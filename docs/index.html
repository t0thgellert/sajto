anakkor nehezítheti a külföldi munkaerő bevonását. A WHC szerint a hazai munkaerő-tartalékok önmagukban nem elegendők a hiány pótlására, ezért a vendégmunkások mellett fontos szerepet kaphatnak a diákok, nyugdíjasok, kisgyermekes szülők és külföldi hallgatók is.","kulcsszavak":["vendégmunka","munkaerő-tartalék","logisztika"],"het":"2026-09-14","url_forras":"docx","id":"ART-0559","kivonat":"A Waberer’s Csoport jelenleg mintegy kétezer magyar és ezer külföldi, főként ázsiai gépjárművezetőt foglalkoztat, mivel az európai sofőrhiány tartós problémát jelent az ágazatban. A vendégmunkásokra vonatkozó szabályok szigorítása ugyanakkor nehezítheti a külföldi munkaerő bevonását. A WHC szerint a hazai munkaerő-tartalékok önmagukban nem elegendők a hiány pótlására, ezért a vendégmunkások mellett egyre fontosabb szerepet kaphatnak a diákok, nyugdíjasok, kisgyermekes szülők és külföldi hallgatók is. A nagyobb vállalatok munkaerőigénye közben az ingatlanpiacra is hat: a termelési és logisztikai központok környezetében nőhet a kereslet munkásszállásokra, bérlakásokra és kapcsolódó szolgáltatásokra."},{"cim":"Már több mint 5000-en dolgoznak a debreceni BMW-nél","url":"https://www.hrportal.hu/hr/mar-tobb-mint-5000en-dolgoznak-a-debreceni-bmw-nel-20260925.html","forras":"HR Portál","datum":"2026-09-25","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HR Portál és az Opten Létszámtrendek adatai szerint júliusban a debreceni BMW létszáma átlépte az 5000 főt, szemben az egy évvel korábbi 3079-cel. Növekedés látszik több más ipari nagyvállalatnál is, köztük a kecskeméti Mercedesnél, a Harman Beckernél és a Rosenbergernél. A munkaerő-kölcsönzők közül a Prohuman 273, a WHC 147, a Jobtain 115 fővel bővítette állományát egy hónap alatt, a Pannonjobnál ugyanakkor 150 fős visszaesést mértek.","kulcsszavak":["autóipar","munkaerő-kölcsönzés","WHC","Jobtain"],"het":"2026-09-21","url_forras":"docx","id":"ART-0560","kivonat":"A HR Portal és az Opten Létszámtrendek adatai szerint tovább bővül a debreceni BMW: júliusban a vállalat létszáma átlépte az 5000 főt, szemben az egy évvel korábbi 3079-cel. Több más ipari nagyvállalatnál is növekedés látszik, köztük a kecskeméti Mercedesnél, a Harman Beckernél és a Rosenbergernél. A munkaerő-kölcsönzők közül a Prohuman 273, a WHC 147, a Jobtain 115 fővel növelte állományát egy hónap alatt, miközben a Pannonjobnál 150 fős visszaesést mértek. A nagyvállalati adatok így összességében vegyes képet mutatnak: egyes ipari és HR-szolgáltató cégek erősen bővülnek, másoknál stagnálás vagy csökkenés látszik."},{"cim":"Tömegek találnak így villámgyorsan munkát Magyarországon: de vajon tényleg megéri belevágni?","url":"https://www.penzcentrum.hu/karrier/20260922/tomegek-talalnak-igy-villamgyorsan-munkat-magyarorszagon-de-vajon-tenyleg-megeri-belevagni-1205935","forras":"Pénzcentrum","datum":"2026-09-22","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"A Jobtain kutatása szerint a fizikai munkát keresők a fizetés mellett a műszakrendet, a munkavégzés helyét, a bejárást és a munkahelyi közeget is fontosnak tartják, a válaszadók 84 százaléka pedig elvárja a pontos bérinformációt a hirdetésekben. Mihályi Magdolna, a Jobtain ügyvezetője szerint a megkérdezettek 83 százaléka ismeri a munkaerő-kölcsönzést, 62 százalék dolgozott már így, és a korábbi kölcsönzött munkavállalók 90 százaléka újra jelentkezne ilyen állásra.","kulcsszavak":["munkaerő-kölcsönzés","bértranszparencia","toborzás","Jobtain"],"het":"2026-09-21","url_forras":"docx","id":"ART-0561","kivonat":"A Jobtain friss kutatása szerint a fizikai munkát keresők egyre tudatosabban választanak: a fizetés mellett a műszakrend, a munkavégzés helye, a bejárás, a stabilitás és a munkahelyi közeg is fontos. A válaszadók 84 százaléka elvárja, hogy az álláshirdetés pontos bérinformációt tartalmazzon. Mihályi Magdolna, a Jobtain ügyvezetője szerint a munkaerő-kölcsönzés elfogadottsága is magas: a megkérdezettek 83 százaléka ismeri ezt a formát, 62 százalék már dolgozott így, és a korábbi kölcsönzött munkavállalók 90 százaléka újra jelentkezne ilyen állásra. A dolgozók számára kulcsfontosságú az átlátható tájékoztatás, az elérhető kapcsolattartó, a pontos fizetés és az, hogy kölcsönzöttként is megbecsült tagjai legyenek a munkahelyi közösségnek."},{"cim":"A vendégmunkáskérdésről még szeptemberben újabb egyeztetés jöhet","url":"https://www.portfolio.hu/gazdasag/20260920/a-vendegmunkaskerdesrol-meg-szeptemberben-ujabb-egyeztetes-johet-863738","forras":"Portfolio","datum":"2026-09-20","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A kormány újragondolja a vendégmunkások foglalkoztatásának szabályait, a munkáltatói szervezetek pedig már megküldték javaslataikat a részletszabályokhoz, amelyekről várhatóan még szeptemberben folytatódnak az egyeztetések. A Szociális és Családügyi Minisztérium egy egyszerűbb, átláthatóbb rendszert szeretne, amely elsőbbséget ad a magyar munkaerőnek, de lehetővé teszi harmadik országbeliek alkalmazását is, ahol nincs hazai utánpótlás. Mihályi Magdolna, a VOSZ társelnöke szerint a feldolgozóiparban, a logisztikában, az építőiparban és az élelmiszeriparban, főként gépkezelői, operátori, összeszerelői és raktári munkakörökben nehéz stabil hazai utánpótlást találni.","kulcsszavak":["vendégmunka","munkáltatói szövetség","munkaerőhiány"],"het":"2026-09-14","url_forras":"docx","id":"ART-0562","kivonat":"A kormány újragondolja a vendégmunkások foglalkoztatásának szabályait, a munkáltatói szervezetek pedig már megküldték javaslataikat; a részletszabályokról várhatóan még szeptemberben folytatódnak az egyeztetések. A Szociális és Családügyi Minisztérium szerint a cél egy egyszerűbb, átláthatóbb rendszer, amely elsőbbséget ad a magyar munkaerőnek, de továbbra is lehetővé teszi harmadik országbeliek alkalmazását ott, ahol hazai dolgozó nem áll rendelkezésre. Mihályi Magdolna, a VOSZ társelnöke és a Jobtain ügyvezetője szerint főként a feldolgozóiparban, a logisztikában, az építőiparban és az élelmiszeriparban nehéz stabil hazai utánpótlást találni. Különösen a gépkezelői, operátori, összeszerelői és raktári munkakörökben jelenthet gondot a külföldi munkaerő utánpótlásának korlátozása."},{"cim":"Magyar edtech startupokkal egyeztetett Lannert Judit oktatási miniszter","url":"https://startuponline.hu/magyar-edtech-startupokkal-egyeztetett-lannert-judit-oktatasi-miniszter","forras":"Startup Online","datum":"2026-09-22","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Magyar edtech cégek, köztük a Redmenta, az imagi, a BOOKR Class és a Logiscool, Lannert Judit oktatási miniszterrel egyeztettek az AI oktatási használatának szabályozásáról. A startupok szerint az AI-t nem lehet kizárni az iskolákból, ezért biztonságos, zárt rendszerekre és egységes módszertani keretekre van szükség, amelyek támogatják, de nem helyettesítik a tanulói gondolkodást. A cégek közös szakmai anyagot készítenek, amely egy későbbi egységes szabályozás alapjául szolgálhat.","kulcsszavak":["AI","képzés"],"het":"2026-09-21","url_forras":"docx","id":"ART-0563","kivonat":"Magyar edtech cégek – köztük a Redmenta, az imagi, a BOOKR Class és a Logiscool – Lannert Judit oktatási miniszterrel egyeztettek arról, hogyan kellene szabályozni az AI használatát a magyar oktatásban. A startupok szerint az AI-t nem lehet kizárni az iskolákból, ezért inkább biztonságos, zárt rendszerekre és egységes módszertani keretekre van szükség, amelyek támogatják, de nem helyettesítik a tanulói gondolkodást. Kiemelt célként kezelik a szövegértés, a kritikus gondolkodás és az AI-válaszok ellenőrzésének fejlesztését, valamint a pedagógusok támogatását. A cégek közös szakmai anyagot készítenek, amely reményeik szerint egy későbbi egységes szabályozás alapjául is szolgálhat."},{"cim":"Lannert Judit: év végére elkészül az új magyar oktatási stratégia, külön mesterséges intelligencia fókusszal","url":"https://www.portfolio.hu/gazdasag/20260923/lannert-judit-ev-vegere-elkeszul-az-uj-magyar-oktatasi-strategia-kulon-mesterseges-intelligencia-fokusszal-864688","forras":"Portfolio","datum":"2026-09-23","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Lannert Judit oktatási és gyermekügyi miniszter szerint év végére elkészül az új magyar oktatási stratégia, amelynek külön része lesz az oktatás és képzés mesterségesintelligencia-stratégiája is. A kormány két lépcsőben rendezi a NOKS- és technikai dolgozók béreit, bővíti az iskolaigazgatók és nevelőtestületek jogköreit, és nyílt pályázatokat ír ki a tankerületek és szakképzési centrumok vezetésére. Az új stratégia részeként új Nemzeti alaptanterv és átfogó szövegértés-fejlesztési program is készül.","kulcsszavak":["AI","képzés","bérek"],"het":"2026-09-21","url_forras":"docx","id":"ART-0564","kivonat":"Lannert Judit oktatási és gyermekügyi miniszter szerint év végére elkészül az új magyar oktatási stratégia, amelynek külön része lesz az oktatás és képzés mesterségesintelligencia-stratégiája is. A kormány közben két lépcsőben rendezi a NOKS- és technikai dolgozók béreit, bővíti az iskolaigazgatók és nevelőtestületek jogköreit, valamint nyílt pályázatokat ír ki a tankerületek és szakképzési centrumok vezetésére. Az új stratégia részeként új Nemzeti alaptanterv és átfogó szövegértés-fejlesztési program is készül. Lannert szerint az AI oktatási használatát úgy kell szabályozni, hogy ne szorítsa háttérbe az önálló gondolkodást és gyakorlást."},{"cim":"Kiírták a szakképzési centrumok főigazgatói pályázatait, kevesebb mint egy hónap van a jelentkezésre","url":"https://eduline.hu/kozoktatas/20260925_szakkepzesi-centrum-foigazgato-palyazat-kozszolgallas","forras":"Eduline","datum":"2026-09-25","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A szeptemberben elfogadott törvénymódosítás nyomán átalakítják a szakképzési centrumok vezetését: a jelenlegi főigazgatók és kancellárok megbízatása 2026 végén megszűnik, 2027 januárjától egy kézbe kerül a szakmai és működési irányítás. A pályázatok jelentkezési határideje október 15., a pályázóknak vezetői programot, mérhető korábbi eredményeket és referenciákat kell bemutatniuk, a kiválasztás pedig többkörös interjúval és kompetenciaértékeléssel zajlik. Az új vezetők öt évre, 2031 végéig kapnak megbízást.","kulcsszavak":["képzés","toborzás"],"het":"2026-09-21","url_forras":"docx","id":"ART-0565","kivonat":"A szeptemberben elfogadott törvénymódosítás nyomán átalakítják a szakképzési centrumok vezetését: a jelenlegi főigazgatók és kancellárok megbízatása 2026 végén megszűnik, 2027 januárjától pedig egy kézbe kerül a szakmai és működési irányítás. Az új főigazgatói posztokra már kiírták a pályázatokat, a jelentkezési határidő október 15. A pályázóknak vezetői programot, mérhető korábbi eredményeket és referenciákat is be kell mutatniuk, a kiválasztás pedig többkörös interjúval és kompetenciaértékeléssel zajlik majd. Az új vezetők öt évre, 2031 végéig kapnak megbízást."},{"cim":"Nem vicc: havi félmillió forintot is hazavisznek ezek a magyar diákok, itt a titok, hogyan csinálják","url":"https://www.penzcentrum.hu/karrier/20260925/nem-vicc-havi-felmillio-forintot-is-hazavisznek-ezek-a-magyar-diakok-itt-a-titok-hogyan-csinaljak-1205928","forras":"Pénzcentrum","datum":"2026-09-25","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A diákmunkák átlagos órabére a Meló-Diák adatai szerint már meghaladja a bruttó 2500 forintot, egyes pozíciókban 3000 forint felett is van, így heti 40 órás munkával akár havi 480–550 ezer forintot kereshet egy hallgató. A MŰISZ szerint a teljes vagy közel teljes munkaidős diákmunkát főként félévet halasztók, szakmai gyakorlatukat töltők vagy diplomamunkán dolgozó végzősök vállalják heti 30–40 órában, ők adják a havi diákmunkás-létszám mintegy ötödét. Sokan már szakmai feladatokat végeznek, 40 százalékuk gyakornokként, jellemzően irodai adminisztrációban, összeszerelésben, raktári vagy műszaki munkakörökben.","kulcsszavak":["diákmunka","bérek"],"het":"2026-09-21","url_forras":"docx","id":"ART-0566","kivonat":"A diákmunkák átlagos órabére a MELÓ-DIÁK adatai szerint már meghaladja a bruttó 2500 forintot, egyes pozíciókban pedig 3000 forint feletti összeg is elérhető, így heti 40 órás munkával akár havi 480–550 ezer forintot is kereshet egy hallgató. A teljes vagy közel teljes munkaidős diákmunka ugyanakkor csak speciális élethelyzetben reális: a MŰISZ szerint főként félévet halasztók, szakmai gyakorlatukat töltők vagy diplomamunkán dolgozó végzősök vállalnak heti 30–40 órát. Ők a havi diákmunkás-létszám mintegy ötödét adják, és sokan már szakmai feladatokat végeznek, 40 százalékuk gyakornokként. A legtöbben irodai adminisztrációban, összeszerelésben, raktári vagy műszaki munkakörökben dolgoznak."},{"cim":"Itt vannak a tervek, így alakítaná át a Tisza-kormány a munka világát","url":"https://www.hrportal.hu/hr/itt-vannak-a-tervek-igy-alakitana-at-a-tisza-kormany-a-munka-vilagat-20260925.html","forras":"HR Portál","datum":"2026-09-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Szabó Imre Szilárd, a Szociális és Családügyi Minisztérium helyettes államtitkára a recruiTECH BLUE konferencián vázolta a kormány munkaerőpiaci terveit: a harmadik országbeli munkavállalók egyszerűbb és átláthatóbb szabályozását, a hazai munkaerőpiaci vizsgálat megerősítését és a 2027-es minimálbér-megállapodás újratárgyalását. Napirenden van a Platform Irányelv és a bértranszparencia-szabályok átültetése, valamint a Munka törvénykönyvének felülvizsgálata a platformmunka, a távmunka és más atipikus foglalkoztatási formák miatt. A kormány a munkavédelmi és foglalkoztatásfelügyeleti rendszer megerősítését és a munkavállalói jogérvényesítés javítását is tervezi.","kulcsszavak":["politika","vendégmunka","bértranszparencia","munkajog"],"het":"2026-09-21","url_forras":"docx","id":"ART-0567","kivonat":"Szabó Imre Szilárd, a Szociális és Családügyi Minisztérium foglalkoztatási szabályozásért és tervezésért felelős helyettes államtitkára a recruiTECH BLUE konferencián vázolta a kormány munkaerőpiaci terveit. Ezek között szerepel a harmadik országbeli munkavállalók foglalkoztatásának egyszerűbb és átláthatóbb szabályozása, a hazai munkaerőpiaci vizsgálat megerősítése, valamint a 2027-es minimálbér-megállapodás újratárgyalása. Napirenden van a Platform Irányelv és a bértranszparencia-szabályok átültetése, továbbá a Munka törvénykönyvének átfogó felülvizsgálata a platformmunka, a távmunka és más atipikus foglalkoztatási formák miatt. A kormány a munkavédelmi és foglalkoztatásfelügyeleti rendszer megerősítését, illetve a munkavállalói jogérvényesítés javítását is tervezi."},{"cim":"Kiterítette kártyáit a kormány: visszatér a kata, milliárdos vagyonadó jön","url":"https://www.economx.hu/magyar-gazdasag/2026/09/22/gki-konferencia-kormany-adotervek-vagyonado-allamtitkar-mnb/","forras":"Economx","datum":"2026-09-22","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Kövesdy Attila, a Pénzügyminisztérium adópolitikáért felelős államtitkára a GKI konferenciáján bejelentette, hogy januártól szja-jóváírást vezetnének be az alacsony jövedelműeknek, visszahoznák a katát, és egy 1 milliárd forint feletti vagyonra évi 1 százalékos vagyonadót vetnének ki. Virág Barnabás, az MNB elnöki főtanácsadója szerint a magyar gazdaság olcsó munkaerőre épülő modellje kifutott: évente mintegy 110 ezer ember esik ki a munkaerőpiacról betegségek és más egészségügyi okok miatt, miközben az alapkészségek romlása is fékezi a foglalkoztathatóságot. A továbblépéshez szerkezeti reformokra, jobb egészségügyre, készségfejlesztésre és az új technológiák gyorsabb vállalati alkalmazására lenne szükség.","kulcsszavak":["adózás","munkaerő-tartalék","gazdasági kilátások"],"het":"2026-09-21","url_forras":"docx","id":"ART-0568","kivonat":"Kövesdy Attila, a Pénzügyminisztérium adópolitikáért felelős államtitkára a GKI konferenciáján több készülő adóintézkedést is bejelentett: januártól szja-jóváírást vezetnének be az alacsony jövedelműeknek, visszahoznák a katát, és egy 1 milliárd forint feletti vagyonra évi 1 százalékos vagyonadót vetnének ki. A konferencián Virág Barnabás, az MNB elnöki főtanácsadója arról beszélt, hogy a magyar gazdaság korábbi, olcsó munkaerőre és költségelőnyre épülő modellje kifutott. Szerinte még lenne munkaerőpiaci tartalék: évente mintegy 110 ezer ember esik ki betegségek és más egészségügyi okok miatt, miközben az alapkészségek romlása is fékezi a foglalkoztathatóságot. A továbblépéshez ezért szerkezeti reformokra, jobb egészségügyre, készségfejlesztésre és az új technológiák gyorsabb vállalati alkalmazására lenne szükség."},{"cim":"Érdekes, de ellentmondásos munkaerőpiaci folyamatok vannak Magyarországon","url":"https://www.portfolio.hu/gazdasag/20260925/erdekes-de-ellentmondasos-munkaeropiaci-folyamatok-vannak-magyarorszagon-865164","forras":"Portfolio","datum":"2026-09-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH augusztusi adatai szerint egyszerre nőtt a foglalkoztatottak (4,654 millió fő) és a munkanélküliek (229 ezer fő) száma, a munkanélküliségi ráta pedig 4,7 százalékra emelkedett. A látszólag ellentmondásos kép mögött az áll, hogy egyre többen lépnek be vagy vissza a munkaerőpiacra: az év elejéhez képest mintegy 50 ezerrel nőtt az aktívak száma, miközben a 15–74 éves népesség először csökkent 7,1 millió fő alá. Az aktivitási ráta így közel 69 százalékra, történelmi csúcsra emelkedett.","kulcsszavak":["foglalkoztatottság","munkanélküliség","demográfia","kutatás és statisztika"],"het":"2026-09-21","url_forras":"docx","id":"ART-0569","kivonat":"A KSH augusztusi adatai szerint egyszerre nőtt a foglalkoztatottak és a munkanélküliek száma: előbbiek 4,654 millióan, utóbbiak 229 ezren voltak, a munkanélküliségi ráta pedig 4,7 százalékra emelkedett. Az elsőre ellentmondásos kép mögött az áll, hogy egyre többen lépnek be vagy vissza a munkaerőpiacra: az év elejéhez képest mintegy 50 ezerrel nőtt az aktívak száma. Közben a 15–74 éves népesség először csökkent 7,1 millió fő alá, vagyis egy fogyó népességből arányaiban egyre többen dolgoznak vagy keresnek munkát. Az aktivitási ráta így közel 69 százalékra, történelmi csúcsra emelkedett, ami arra utal, hogy a javuló konjunktúra egyelőre képes részben ellensúlyozni a kedvezőtlen demográfiai folyamatokat."},{"cim":"Egyszerűbb szabályokkal, rugalmas foglalkoztatással erősítenék a vendéglátást","url":"https://turizmusonline.hu/cikkek/gasztro/szakmai-javaslatcsomag-egyszerubb-szabalyokkal-rugalmasabb-foglalkoztatassal-erositenek-a-vendeglatast.html","forras":"Turizmus Online","datum":"2026-09-23","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A vendéglátóipari szakmai szervezetek szerint az ágazat versenyképességét egyszerűbb szabályozással, rugalmasabb foglalkoztatással és korszerűbb képzéssel lehetne javítani. A munkaerőhiány enyhítésére lazítanák az egyszerűsített és szezonális foglalkoztatás korlátait, ösztönöznék a belföldi mobilitást és a külföldön dolgozó magyarok hazatérését, valamint könnyítenék a képzett harmadik országbeli munkavállalók alkalmazását. A javaslatcsomag emellett egyszerűbb adózást, több digitalizációt és a KRÉTA-hoz, a NAV-hoz kapcsolódó adminisztratív terhek csökkentését is sürgeti.","kulcsszavak":["turizmus","rugalmas foglalkoztatás","szezonális munka","munkaerőhiány"],"het":"2026-09-21","url_forras":"docx","id":"ART-0570","kivonat":"A vendéglátóipari szakmai szervezetek szerint az ágazat versenyképességét nem újabb támogatásokkal, hanem egyszerűbb szabályozással, rugalmasabb foglalkoztatással és korszerűbb képzéssel lehetne javítani. A munkaerőhiány enyhítésére lazítanák az egyszerűsített és szezonális foglalkoztatás korlátait, ösztönöznék a belföldi mobilitást és a külföldön dolgozó magyarok hazatérését, valamint könnyítenék a képzett harmadik országbeli munkavállalók alkalmazását. A szakképzést jobban a valós munkaerőpiaci igényekhez igazítanák, miközben csökkentenék a KRÉTA-hoz, a NAV-hoz és más adminisztratív rendszerekhez kapcsolódó terheket. A javaslatcsomag egyszerűbb adózást, több digitalizációt és kiszámíthatóbb működési környezetet is sürget."},{"cim":"Magyar bérek: elfogyott a cégek egyik titkos fegyvere – az erős forint új helyzetet teremtett, elvette az exportőrök egyik nagy előnyét","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/09/forint-bermelemes-fizetes-ksh-elemzo","forras":"Világgazdaság","datum":"2026-09-21","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Világgazdaság elemzése szerint látványosan lassul a magyar béremelkedés: júliusban a bruttó átlagkereset 7,5, a rendszeres bruttó átlagkereset 7 százalékkal nőtt éves alapon. Regős Gábor, a Gránit Alapkezelő vezető közgazdásza szerint ebben nem elsősorban az erős forint, hanem a gyenge gazdasági teljesítmény és a korábbi munkaerőhiány enyhülése játszik szerepet, a feldolgozóiparban a bérek pedig az átlagnál lassabban emelkedtek. A munkavállalók ugyanakkor jól járnak a mérsékelt inflációval: júliusban a reálkeresetek 7,8 százalékkal nőttek.","kulcsszavak":["bérek","gazdasági kilátások","ipar"],"het":"2026-09-21","url_forras":"docx","id":"ART-0571","kivonat":"A Világgazdaság elemzése szerint látványosan lassul a magyar béremelkedés: júliusban a bruttó átlagkereset 7,5, a rendszeres bruttó átlagkereset 7 százalékkal nőtt éves alapon. Regős Gábor, a Gránit Alapkezelő vezető közgazdásza szerint ebben nem elsősorban az erős forint, hanem a gyenge gazdasági teljesítmény és a korábbi munkaerőhiány enyhülése játszik szerepet. A feldolgozóiparban a bérek az átlagnál lassabban emelkedtek, miközben a cégek már kevésbé kényszerülnek agresszív bérversenyre. A munkavállalók ugyanakkor továbbra is jól járnak a mérsékelt inflációval: júliusban a reálkeresetek 7,8 százalékkal nőttek, de hosszabb távon ehhez a termelékenység javulására is szükség lesz."},{"cim":"Ennyit kell keresni a felső 10 százalékhoz 2026-ban megyénként","url":"https://www.hrportal.hu/c/ennyit-kell-keresni-a-felso-10-szazalekhoz-2026ban-megyenkent-20260925.html","forras":"HR Portál","datum":"2026-09-23","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Bankmonitor KSH-adatokra épülő elemzése szerint jelentős regionális különbség van abban, milyen nettó fizetéssel lehet bekerülni a legjobban kereső 10 százalék közé. Budapesten ehhez 2026 első felében havi nettó 1,104 millió forint kellett, Győr-Moson-Sopronban 911 ezer, Tolnában 854 ezer forint, míg Békés vármegyében már 653 ezer forint feletti nettó kereset is elegendő volt. A különbségeket jól mutatja, hogy a budapesti székhelyű cégek 656 ezer forintos nettó átlagbére önmagában meghaladta a Békés vármegyei felső tized küszöbét.","kulcsszavak":["bérek","régiós különbségek","kutatás és statisztika"],"het":"2026-09-21","url_forras":"docx","id":"ART-0572","kivonat":"A Bankmonitor KSH-adatokra épülő elemzése szerint jelentős regionális különbség van abban, milyen nettó fizetéssel lehet bekerülni a legjobban kereső 10 százalék közé. Budapesten ehhez 2026 első felében havi nettó 1,104 millió forint kellett, Győr-Moson-Sopronban 911 ezer, Tolnában 854 ezer forint. A másik véglet Békés vármegye, ahol már 653 ezer forint feletti nettó kereset elegendő volt, míg Zalában 675 ezer, Szabolcs-Szatmár-Beregben 685 ezernél húzódott a határ. A különbségeket jól érzékelteti, hogy a budapesti székhelyű cégek 656 ezer forintos nettó átlagbére már önmagában meghaladta a Békés vármegyei felső tized küszöbét."},{"cim":"A miniszterelnök fizetését is lekörözi, amit a sztárorvosok keresnek","url":"https://index.hu/gazdasag/2026/09/21/orvos-fizetes-top20-szakdolgozok/","forras":"Index","datum":"2026-09-21","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A NEAK január–augusztusi adatai szerint a közfinanszírozott egészségügy legjobban kereső orvosa havi átlagban bruttó 9,6 millió forintot kapott, miközben az orvosi átlagkereset 2,03 millió forint körül alakult. A húszas orvosi toplistára is legalább 6,2 millió forintos havi bruttó keresettel lehetett felkerülni, a legjobban kereső szakdolgozó pedig 4,4 millió forintot vitt haza. Az Index összevetése szerint ezek az összegek (pótlékokkal és mozgóbérekkel együtt) jelentősen meghaladják a miniszterelnök mintegy 3,8 millió forintos havi bruttó jövedelmét.","kulcsszavak":["bérek","egészségügy"],"het":"2026-09-21","url_forras":"docx","id":"ART-0573","kivonat":"A NEAK január–augusztusi adatai szerint a közfinanszírozott egészségügy legjobban kereső orvosa havi átlagban bruttó 9,6 millió forintot kapott, miközben az orvosi átlagkereset 2,03 millió forint körül alakult. A húszas orvosi toplistára is legalább 6,2 millió forintos havi bruttó keresettel lehetett felkerülni, a legjobban kereső szakdolgozó pedig 4,4 millió forintot vitt haza. Ezek az összegek azonban nem alapbérek, hanem pótlékokat és mozgóbéreket is tartalmaznak, és az adatokból nem derül ki, hány munkaóra vagy ügyelet áll mögöttük. Az Index összevetése szerint a legmagasabb egészségügyi keresetek így a miniszterelnök mintegy 3,8 millió forintos havi bruttó jövedelmét is jelentősen meghaladják."},{"cim":"Hivatalos nyilatkozatot tett az amerikai óriásgyár, tényleg átköltezteti-e Ukrajnába a termelést: filippínó vendégmunkások nélkül nem tudják kiszolgálni az igényeket – a következő 2-3 hét perdöntő lesz","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/09/amerikai-oriasgyar-flex-sarvas-vendegmunkasok-ukrajna","forras":"Világgazdaság","datum":"2026-09-23","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A sárvári Flex egyelőre nem erősítette meg sem a több száz fős leépítést, sem azt, hogy gyártósorokat telepítene át Ukrajnába; a vállalat szerint a telephely működését folyamatosan a vevői igényekhez és a piaci környezethez igazítják. A gyárban jelenleg 1400-an dolgoznak, a korábbi munkaerőhiányt ukrán és filippínó vendégmunkások bevonásával kezelték, a pontosabb döntés a termelés átszervezéséről a következő két-három héten várható. A Flex az automatizáció további erősítését is a hosszú távú sárvári stratégia részének tekinti, ennek foglalkoztatási hatásairól egyelőre nem közölt konkrétumokat.","kulcsszavak":["leépítés","vendégmunka","automatizáció","ipar"],"het":"2026-09-21","id":"ART-0574","url_forras":"talalt","kivonat":"A sárvári Flex egyelőre nem erősítette meg sem a több száz fős leépítést, sem azt, hogy gyártósorokat telepítene át Ukrajnába, a vállalat szerint a telephely működését folyamatosan a vevői igényekhez és a piaci környezethez igazítják. A gyárban jelenleg 1400-an dolgoznak, a korábbi munkaerőhiányt pedig ukrán és filippínó vendégmunkások bevonásával is kezelték. A következő két-három hétben várható pontosabb döntés a termelés esetleges átszervezéséről. A Flex közben az automatizáció további erősítését is a hosszú távú sárvári stratégia részének tekinti, de ennek foglalkoztatási hatásairól egyelőre nem közölt konkrétumokat."},{"cim":"Sorsfordító évek jöhetnek - Mit lépnek a nyugat-magyarországi vállalatok?","url":"https://www.portfolio.hu/gazdasag/20260924/sorsfordito-evek-johetnek-mit-lepnek-a-nyugat-magyarorszagi-vallalatok-865012","forras":"Portfolio","datum":"2026-09-24","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A nyugat-magyarországi vállalatok előtt egyszerre állnak országos és régiós kihívások: a bér- és energiaköltségek emelkedése, a német ipar gyengélkedése és az AI terjedése mind közvetlenül hat a működésükre. A térség cégei úgy próbálják javítani hatékonyságukat és versenyképességüket, hogy közben továbbra is munkaerőhiánnyal küzdenek. A lap októberi győri gazdasági fórumán külön blokk foglalkozik majd a német ipar hazai hatásaival, az energiafelhasználás optimalizálásával és a mesterséges intelligencia munkaerőpiaci következményeivel.","kulcsszavak":["gazdasági kilátások","régiós különbségek","AI","munkaerőhiány"],"het":"2026-09-21","url_forras":"docx","id":"ART-0575","kivonat":"A nyugat-magyarországi vállalatok előtt egyszerre állnak országos és régiós kihívások: a bér- és energiaköltségek emelkedése, a német ipar gyengélkedése, valamint az AI terjedése mind közvetlenül hat a működésükre. A térség számára különösen fontos kérdés, hogyan tudják a cégek javítani hatékonyságukat és versenyképességüket úgy, hogy közben továbbra is munkaerőhiánnyal küzdenek. A lap októberi győri gazdasági fórumán ezért külön blokk foglalkozik majd a német ipar hazai hatásaival, az energiafelhasználás optimalizálásával és a mesterséges intelligencia gazdasági, illetve munkaerőpiaci következményeivel."},{"cim":"Bezáró gyárak, NER-es leépítések: tényleg lejtmenetben van a munkaerőpiac?","url":"https://telex.hu/g7/adat/2026/09/21/gyarbezarasok-leepitesek-munkaeropiac-foglalkoztatottsag-munkanelkuliseg","forras":"G7","datum":"2026-09-21","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A látványos gyárbezárások és leépítések ellenére nem beszélhetünk általános munkaerőpiaci összeomlásról: január óta ismét nő a foglalkoztatás, és a munkakeresés átlagos ideje is valamelyest csökkent, bár a csoportos létszámleépítések száma magas és a vállalatok toborzási tervei óvatosak maradnak. Mihályi Magdolna, a Jobtain vezetője szerint a piacot egyszerre jellemzi munkaerőhiány és túlkínálat, ősszel inkább célzott, ágazatonként eltérő toborzási hullámokra lehet számítani. Nógrádi József, a Trenkwalder igazgatója szerint a tartós javuláshoz exportbővülésre, új beruházásokra és erősebb belső fogyasztásra lenne szükség, ezekben azonban egyelőre nincs széles körű fordulat.","kulcsszavak":["leépítés","foglalkoztatottság","toborzás","Trenkwalder"],"het":"2026-09-21","id":"ART-0576","url_forras":"talalt","kivonat":"A látványos gyárbezárások és leépítések ellenére nem beszélhetünk általános munkaerőpiaci összeomlásról: január óta ismét nő a foglalkoztatás, miközben a munkakeresés átlagos ideje is valamelyest csökkent. Ugyanakkor a csoportos létszámleépítések száma magas, a vállalatok toborzási tervei pedig továbbra is óvatosak. Mihályi Magdolna, a Jobtain vezetője szerint a piacot egyszerre jellemzi munkaerőhiány és túlkínálat: ősszel inkább célzott, ágazatonként eltérő toborzási hullámokra lehet számítani. Nógrádi József, a Trenkwalder igazgatója szerint a tartós javuláshoz exportbővülésre, új beruházásokra és erősebb belső fogyasztásra lenne szükség, ezekben azonban egyelőre nincs széles körű fordulat."},{"cim":"A legtöbb szervezet etikai kódexéből hiányzik a mesterséges intelligencia","url":"https://www.hrportal.hu/c/a-legtobb-szervezet-etikai-kodexebol-hianyzik-a-mesterseges-intelligencia-20260918.html","forras":"HR Portál","datum":"2026-09-18","fokategoria":"versenytars","alkategoria":"Adecco","osszefoglalo":"Az LRN felmérése szerint a szervezetek etikai kódexeinek mindössze mintegy 10 százaléka tér ki kifejezetten a mesterséges intelligenciára vagy a technológiai etikára. Az alkalmazottak közel ötöde hiányolja a gyakorlati útmutatást, és csak 66 százalékuk érzi úgy, hogy retorzió nélkül jelentheti a visszaéléseket. Az Adecco adatai szerint a munkavállalók a vezetőknél szkeptikusabban ítélik meg, mennyire felkészültek a cégek az autonóm AI-rendszerek bevezetésére.","kulcsszavak":["AI","Adecco"],"het":"2026-09-14","url_forras":"docx","id":"ART-0577","kivonat":"Az LRN felmérése szerint a szervezetek etikai kódexeinek mindössze mintegy 10 százaléka tér ki kifejezetten a mesterséges intelligenciára vagy a technológiai etikára, miközben a dolgozók egyre gyakrabban találkoznak új típusú munkahelyi kockázatokkal. Az alkalmazottak közel ötöde hiányolja a gyakorlati útmutatást, és csak 66 százalék érzi úgy, hogy retorzió nélkül jelentheti a visszaéléseket. Az Adecco adatai közben arra utalnak, hogy a munkavállalók a vezetőknél szkeptikusabban ítélik meg, mennyire felkészültek a cégek az autonóm AI-rendszerek bevezetésére. Az LRN szerint ezért az AI-használatot az elszámoltathatóság, a tisztesség lgatás egyik témája ezért várhatóan az lesz, hogyan kezelték korábban a beruházáshoz kapcsolódó külföldi munkaerő beutazását."},{"cim":"Kiderült, mely ügyeket kezdi először vizsgálni a vagyonvisszaszerzési hivatal","url":"https://hvg.hu/itthon/20260928_nvvh-ugyek-vagyonvisszaszerzesi-hivatal","forras":"HVG","datum":"2026-09-28","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A NVVH első négy kiemelt ügye között szerepel a munkavállalási célú tartózkodási engedélyek megszerzésével kapcsolatos feltételezett befolyással üzérkedés. A gyanú szerint politikai kapcsolatokkal rendelkező szereplők azt ígérték munkaerő-kölcsönző vállalkozóknak, hogy soron kívül el tudják intézni külföldi munkavállalók vízumait és tartózkodási engedélyeit. Az egyik ismertetett esetben nepáli dolgozók engedélyeinek gyorsított intézésére fizettek előleget, a kérelmeket azonban végül elutasították. Az ügy azt vizsgálja, történt-e visszaélés politikai kapcsolatokkal a vendégmunkások magyarországi behozatalának rendszerében.","kulcsszavak":["vendégmunka","munkaerő-kölcsönzés","politika"],"het":"2026-09-28","url_forras":"docx","id":"ART-0585","kivonat":"A NVVH első négy kiemelt ügye között szerepel a munkavállalási célú tartózkodási engedélyek megszerzésével kapcsolatos feltételezett befolyással üzérkedés. A gyanú szerint politikai kapcsolatokkal rendelkező szereplők azt ígérték munkaerő-kölcsönző vállalkozóknak, hogy soron kívül el tudják intézni külföldi munkavállalók vízumait és tartózkodási engedélyeit. Az egyik ismertetett esetben nepáli dolgozók engedélyeinek gyorsított intézésére fizettek előleget, a kérelmeket azonban végül elutasították. Az ügy azt vizsgálja, történt-e visszaélés politikai kapcsolatokkal a vendégmunkások magyarországi behozatalának rendszerében."},{"cim":"Eltűnt több mint 400 ezer nő a 15–74 éves korosztályból – nagyon kellenének Magyar Péternek","url":"https://www.economx.hu/magyar-gazdasag/2026/09/28/munkanelkuliseg-demografia-nok-gazdasag-ipar/","forras":"Economx","datum":"2026-09-28","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az Economx szerint a magyar munkaerőpiac egyik legnagyobb hosszú távú korlátja a demográfia: miközben a foglalkoztatási ráta történelmi csúcson van, folyamatosan csökken a munkaképes korú népesség. A 15–74 éves nők száma 2009 és 2026 között több mint 406 ezer fővel esett vissza, miközben foglalkoztatási rátájuk 46,2-ről 61 százalékra emelkedett. A férfiaknál szintén csökkent a korosztály létszáma, miközben a foglalkoztatási ráta 54,7-ről 70,4 százalékra nőtt. A folyamat azt jelzi, hogy a magas aktivitás mellett egyre szűkül az a népességi tartalék, amelyből a gazdaság új munkavállalókat tudna bevonni.","kulcsszavak":["demográfia","nők a munkaerőpiacon","munkaerő-tartalék","foglalkoztatottság"],"het":"2026-09-28","url_forras":"docx","id":"ART-0586","kivonat":"Az Economx szerint a magyar munkaerőpiac egyik legnagyobb hosszú távú korlátja a demográfia: miközben a foglalkoztatási ráta történelmi csúcson van, folyamatosan csökken a munkaképes korú népesség. A 15–74 éves nők száma 2009 és 2026 között több mint 406 ezer fővel esett vissza, miközben foglalkoztatási rátájuk 46,2-ről 61 százalékra emelkedett. A férfiaknál szintén csökkent a korosztály létszáma, miközben a foglalkoztatási ráta 54,7-ről 70,4 százalékra nőtt. A folyamat azt jelzi, hogy a magas aktivitás mellett egyre szűkül az a népességi tartalék, amelyből a gazdaság új munkavállalókat tudna bevonni."},{"cim":"Megérkezett a beruházási válság a munkaerőpiacra: egyre kevésbé ragaszkodnak dolgozóikhoz a cégek – „Különösen kellemetlen, maradtunk a gödör alján”","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/09/munkaeropiac-beruhazasi-valsag-cegek-magyar-gazdasag","forras":"Világgazdaság","datum":"2026-09-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Regős Gábor, a Gránit Alapkezelő vezető közgazdásza szerint a 2023 óta tartó beruházási visszaesés megjelent a munkaerőpiacon. A feldolgozóiparban 2023 első félévéhez képest 5, az építőiparban 4,9, a mezőgazdaságban 4,6 százalékkal csökkent az alkalmazottak száma. A cégek ma már kevésbé ragaszkodnak a feleslegessé váló munkaerő megtartásához, és a létszámcsökkentés kevésbé látványosan, például a kölcsönzött dolgozók leépítésében jelenik meg. A 2027-re várt beruházási fordulat javíthat a helyzeten, de a feldolgozóiparban a gyenge külső kereslet és az alacsony kapacitáskihasználtság miatt ez sem oldaná meg a problémákat.","kulcsszavak":["gazdasági kilátások","leépítés","munkaerő-kölcsönzés","ipar"],"het":"2026-09-28","url_forras":"docx","id":"ART-0587","kivonat":"Regős Gábor, a Gránit Alapkezelő vezető közgazdásza szerint a 2023 óta tartó beruházási visszaesés megjelent a munkaerőpiacon. A feldolgozóiparban 2023 első félévéhez képest 5, az építőiparban 4,9, a mezőgazdaságban 4,6 százalékkal csökkent az alkalmazottak száma. A cégek ma már kevésbé ragaszkodnak a feleslegessé váló munkaerő megtartásához, és a létszámcsökkentés kevésbé látványosan, például a kölcsönzött dolgozók leépítésében jelenik meg. A 2027-re várt beruházási fordulat javíthat a helyzeten, de a feldolgozóiparban a gyenge külső kereslet és az alacsony kapacitáskihasználtság miatt ez sem oldaná meg a problémákat."},{"cim":"Egyetlen hónap alatt 21 ezerrel csökkent a foglalkoztatottak száma","url":"https://www.youtube.com/watch?v=oLUvim0pZMM","forras":"HírTV","datum":"2026-09-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Sebestyén Géza közgazdász szerint a magyar munkaerőpiac több mutatója is romlott az elmúlt hónapokban: a munkanélküliségi ráta 4,3-ról 4,7 százalékra emelkedett, miközben nyáron közel 40 ezerrel kevesebben dolgoztak, mint egy éve. Különösen aggasztónak tartja a fiatalok helyzetét, akiknél a munkanélküliség szerinte néhány hónap alatt 12-ről 16 százalékra nőtt, valamint azt, hogy az állástalanok 33,7 százaléka már több mint egy éve keres munkát. A közgazdász a problémák hátterében a gyenge gazdasági teljesítményt, a beruházások hiányát és a munkaerőpiaci kereslet-kínálat földrajzi, illetve képzettségi eltéréseit látja. Megoldásként új beruházások ösztönzését, célzott átképzéseket és a munkakeresők készségfejlesztését sürgeti.","kulcsszavak":["munkanélküliség","pályakezdők","gazdasági kilátások","képzés"],"het":"2026-09-28","url_forras":"docx","id":"ART-0588","kivonat":"Sebestyén Géza közgazdász szerint a magyar munkaerőpiac több mutatója is romlott az elmúlt hónapokban: a munkanélküliségi ráta 4,3-ról 4,7 százalékra emelkedett, miközben nyáron közel 40 ezerrel kevesebben dolgoztak, mint egy éve. Különösen aggasztónak tartja a fiatalok helyzetét, akiknél a munkanélküliség szerinte néhány hónap alatt 12-ről 16 százalékra nőtt, valamint azt, hogy az állástalanok 33,7 százaléka már több mint egy éve keres munkát. A közgazdász a problémák hátterében a gyenge gazdasági teljesítményt, a beruházások hiányát és a munkaerőpiaci kereslet-kínálat földrajzi, illetve képzettségi eltéréseit látja. Megoldásként új beruházások ösztönzését, célzott átképzéseket és a munkakeresők készségfejlesztését sürgeti."},{"cim":"A magyar bérek elszakadtak a valóságtól, lemaradtunk az uniós rangsorban","url":"https://novekedes.hu/elemzesek/a-magyar-berek-elszakadtak-a-valosagtol-lemaradtunk-az-unios-rangsorban","forras":"Növekedés.hu","datum":"2026-09-29","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az MNB Inflációs Jelentésére épülő elemzés szerint a magyar bérek euróban továbbra is az uniós rangsor végén vannak, miközben a béremelkedés az elmúlt években elszakadt a termelékenység javulásától. 2020 és 2025 között az egy főre jutó munkaerőköltség növekedési üteme 1,9-szerese volt a termelékenység bővülésének, ami a régiós országokénál is nagyobb különbség. A bérek növekedését ugyanakkor továbbra is felfelé hajtja a demográfiai szűkülés, a munkaerőhiány és a külföldi bérek elszívó hatása, miközben a lazuló munkaerőpiac és az alacsonyabb inflációs várakozások fékezik a bérnyomást. Az MNB szerint ezért a minimálbér- és általános béremeléseknek a jövőben szorosabban kell igazodniuk a termelékenységhez.","kulcsszavak":["bérek","gazdasági kilátások","munkaerőhiány","demográfia"],"het":"2026-09-28","url_forras":"docx","id":"ART-0589","kivonat":"Az MNB Inflációs Jelentésére épülő elemzés szerint a magyar bérek euróban továbbra is az uniós rangsor végén vannak, miközben a béremelkedés az elmúlt években elszakadt a termelékenység javulásától. 2020 és 2025 között az egy főre jutó munkaerőköltség növekedési üteme 1,9-szerese volt a termelékenység bővülésének, ami a régiós országokénál is nagyobb különbség. A bérek növekedését ugyanakkor továbbra is felfelé hajtja a demográfiai szűkülés, a munkaerőhiány és a külföldi bérek elszívó hatása, miközben a lazuló munkaerőpiac és az alacsonyabb inflációs várakozások fékezik a bérnyomást. Az MNB szerint ezért a minimálbér- és általános béremeléseknek a jövőben szorosabban kell igazodniuk a termelékenységhez."},{"cim":"Hol kezdődik a felső tized? Megyénként mutatjuk, mennyit kell keresni hozzá 2026-ban","url":"https://bankmonitor.hu/mediatar/cikk/hol-kezdodik-a-felso-tized-megyenkent-mutatjuk-mennyit-kell-keresni-hozza-2026-ban/","forras":"Bankmonitor","datum":"2026-09-24","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Bankmonitor KSH-adatokra épülő elemzése szerint jelentős területi különbség van abban, milyen nettó fizetéssel lehet bekerülni a legjobban kereső 10 százalék közé. Budapesten ehhez 2026 első felében havi nettó 1,104 millió forint kellett, Győr-Moson-Sopronban 911 ezer, Tolnában 854 ezer forint. A másik véglet Békés vármegye, ahol már 653 ezer forint feletti nettó kereset elegendő volt, míg Zalában 675 ezer, Szabolcs-Szatmár-Beregben 685 ezer forintnál húzódott a határ. A fővárosi székhelyű cégek 656 ezer forintos nettó átlagbére önmagában eléri a békési felső tized küszöbét.","kulcsszavak":["bérek","régiós különbségek","kutatás és statisztika"],"het":"2026-09-21","url_forras":"docx","id":"ART-0590","kivonat":"A Bankmonitor KSH-adatokra épülő elemzése szerint jelentős területi különbség van abban, milyen nettó fizetéssel lehet bekerülni a legjobban kereső 10 százalék közé. Budapesten ehhez 2026 első felében havi nettó 1,104 millió forint kellett, Győr-Moson-Sopronban 911 ezer, Tolnában 854 ezer forint. A másik véglet Békés vármegye, ahol már 653 ezer forint feletti nettó kereset elegendő volt, míg Zalában 675 ezer, Szabolcs-Szatmár-Beregben 685 ezer forintnál húzódott a határ. A különbségeket jól mutatja, hogy a fővárosi székhelyű cégek 656 ezer forintos nettó átlagbére már önmagában elérte a békési felső tized küszöbét."},{"cim":"„Ha albérletet is kellene fizetnem, fogalmam sincs, mire lenne elég” – botrányosak a fizetések a modellváltásnak ellenálló egyetemeken","url":"https://qubit.hu/2026/09/28/ha-alberletet-is-kellene-fizetnem-fogalmam-sincs-mire-lenne-eleg-botranyosak-a-fizetesek-a-modellvaltasnak-ellenallo-egyetemeken","forras":"Qubit","datum":"2026-09-28","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Súlyos bérfeszültség alakult ki a modellváltáson kívül maradt állami egyetemeken, különösen a Zeneakadémián és a Magyar Képzőművészeti Egyetemen. A Zeneakadémián a tanársegédek és adjunktusok alapbére bruttó 373 ezer forint körül van, a művésztanároké 380 ezer forint, miközben a jelenlegi 15 százalékos bérkiegészítés decembertől megszűnhet. A szakszervezet még idén 30, jövőre további legalább 20 százalékos emelést sürget. A Képzőművészeti Egyetemen a művész- és mérnöktanárok bruttó 450 ezer forint körül keresnek, miközben egyes adminisztratív és fizikai munkakörök bére magasabb.","kulcsszavak":["bérek","szakszervezet"],"het":"2026-09-28","url_forras":"docx","id":"ART-0591","kivonat":"Súlyos bérfeszültség alakult ki a modellváltáson kívül maradt állami egyetemeken, különösen a Zeneakadémián és a Magyar Képzőművészeti Egyetemen. A Zene k inkább az elismerést és a megbízható fizetést, az idősebbek a szervezeti és pénzügyi stabilitást értékelik.","kulcsszavak":["nők a munkaerőpiacon","Randstad","munkáltatói márka"],"het":"2026-09-28","id":"ART-0596","kivonat":"Nincs éles törésvonal a férfi és női munkavállalók elvárásai között a Randstad Employer Brand Research 2026-os magyar eredményei szerint, de hangsúlykülönbségek megfigyelhetők. Baja Sándor, a Randstad csehországi, magyarországi és romániai ügyvezetője szerint a nőknél valamivel fontosabb a kiszámítható fizetés és a vonzó juttatási csomag, míg a férfiak a teljesítményalapú szempontokra helyeznek nagyobb hangsúlyt. Mindkét nem számára egyre fontosabb a stabilitás, a rugalmasság, a jó munkahelyi légkör, a fejlődési lehetőség és a munka-magánélet egyensúlya. A „biztonság” jelentése generációnként is eltér: a fiatalabbak inkább az elismerést és a megbízható fizetést, az idősebbek a szervezeti és pénzügyi stabilitást értékelik.","url_forras":"docx"},{"cim":"Korabeli celebek, akikről portrét festettek: Miért tisztelték úgy a pénzosztókat, mint a királyokat?","url":"https://trademagazin.hu/hu/korabeli-celebek-akikrol-portret-festettek-miert-tiszteltek-ugy-a-penzosztokat-mint-a-kiralyokat/","forras":"Trade Magazin","datum":"2026-10-02","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Szakály Balázs, a WHC Payroll üzletágvezetője szerint a bérszámfejtés ma már komoly jogi, pénzügyi és munkáltatói márka-kockázatot hordoz: egyetlen hiba munkavállalói elégedetlenséget, hatósági bírságot és reputációs veszteséget is okozhat. Veszélyes, ha egy vállalat egyetlen kulcsemberre építi a folyamatot, mert kiesése esetén nehéz gyorsan megfelelő helyettest találni. Egyre több cég számára lehet racionális megoldás a bérszámfejtés kiszervezése, amely kiszámíthatóbb költséget, nagyobb folyamatbiztonságot és korszerűbb technológiai hátteret adhat. Ez tehermentesítheti a belső HR-t is, hogy stratégiai feladatokra koncentráljon.","kulcsszavak":["WHC","munkál zlovák állampolgár. A Mercedes és a BMW nem közölt konkrét adatokat a külföldi munkavállalók számáról, a BYD pedig nem válaszolt a Világgazdaság megkeresésére. A nagy autóipari beruházások a lakás-, munkásszállás- és infrastruktúra-fejlesztések iránti keresletet is növelhetik az érintett térségekben. A WHC szerint a hazai munkaerő-tartalékok fontosak, de nem tudják teljesen kiváltani a vendégmunkásokat, a diákok, nyugdíjasok, szülők és külföldi hallgatók bevonására is szükség lehet."},{"cim":"Külföldre küldött munkavállalók: könnyebb adminisztrációt hozhat az EU új csomagja","url":"https://www.penzcentrum.hu/karrier/20261004/kulfoldre-kuldott-munkavallalok-konnyebb-adminisztraciot-hozhat-az-eu-uj-csomagja-1206652","forras":"Pénzcentrum","datum":"2026-10-04","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"Az Európai Bizottság új javaslatcsomagja egyszerűsítené a határon átnyúló foglalkoztatás adminisztrációját, köztük az A1-es igazolások digitalizációját és a külföldi szakmai képesítések gyorsabb elismerését. Ez csökkentené a munkaerő-kölcsönző és -közvetítő cégek HR- és bérszámfejtési terheit azoknál, akik külföldre küldenek vagy Magyarországra közvetítenek munkavállalókat. A digitalizáció egyúttal hatékonyabb hatósági ellenőrzést is lehetővé tenne. A csomagot még nem fogadták el, így az új szabályok egyelőre nem alkalmazandók.","kulcsszavak":["munkaerő-kölcsönzés","munkajog","politika"],"het":"2026-09-28","url_forras":"docx","id":"ART-0599","kivonat":"Az Európai Bizottság új javaslatcsomagja egyszerűsítheti a határon átnyúló foglalkoztatással kapcsolatos adminisztrációt, ami a munkaerő-kölcsönzéssel és -közvetítéssel foglalkozó vállalatok számára is jelentős könnyebbséget hozhat. A tervezett intézkedések között szerepel a társadalombiztosítási dokumentumok, köztük az A1-es igazolások digitalizációja, valamint a külföldön szerzett szakmai képesítések gyorsabb elismerése. Ez csökkentheti a HR- és bérszámfejtési feladatok adminisztrációs terheit, különösen azoknál a munkaerő-kölcsönző cégeknél, amelyek külföldre küldenek vagy Magyarországra közvetítenek munkavállalókat. A digitalizáció ugyanakkor hatékonyabb hatósági ellenőrzéseket is lehetővé tehet. A javaslatcsomag még elfogadás előtt áll, így az új szabályok egyelőre nem alkalmazandók."},{"cim":"Két óráig tartott Szijjártó meghallgatása, ahol felmerült Orbán Viktor neve is","url":"https://www.portfolio.hu/gazdasag/20261005/ket-oraig-tartott-szijjarto-meghallgatasa-ahol-felmerult-orban-viktor-neve-is-867440","forras":"Portfolio","datum":"2026-10-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az Országgyűlés Nemzetbiztonsági Bizottsága több mint két órán át hallgatta meg Szijjártó Péter volt külügyminisztert a kínai BYD-nál vállalt új pozíciója miatt. A meghallgatáson szóba került a cég szegedi beruházása, az ahhoz kötött állami támogatás és a külföldi munkaerő alkalmazása. Velkey György László államtitkár korábban több száz milliárd forintos támogatásról és mintegy tízezer vendégmunkás engedélyezéséről beszélt, ami megközelíti a gyárban ígért munkahelyek számát. A bizottság Szijjártó új munkakörének nemzetbiztonsági kockázatait is vizsgálta, a vizsgálat további meghallgatásokkal folytatódhat.","kulcsszavak":["vendégmunka","beruházás","autóipar","politika"],"het":"2026-10-05","url_forras":"docx","id":"ART-0600","kivonat":"Az Országgyűlés Nemzetbiztonsági Bizottsága több mint két órán keresztül hallgatta meg Szijjártó Péter volt külügyminisztert a kínai BYD autógyártónál vállalt új pozíciója miatt. A meghallgatáson szóba került a vállalat szegedi beruházása, az ahhoz kapcsolódó állami támogatások és a külföldi munkaerő alkalmazása is. Velkey György László államtitkár korábbi állítása szerint a beruházáshoz több száz milliárd forintos állami támogatás és mintegy tízezer vendégmunkás engedélyezése kapcsolódhatott, ami megközelíti a gyár által ígért munkahelyek számát. A meghallgatáson a volt miniszter új munkakörének esetleges nemzetbiztonsági kockázatait is vizsgálták. A bizottság kormánypárti és ellenzéki tagjai eltérően értékelték az elhangzottakat, a vizsgálat pedig további meghallgatásokkal folytatódhat"},{"cim":"Kármán András szerint kifulladt a korábban sikeres magyar gazdasági modell","url":"https://infostart.hu/gazdasag/2026/10/07/karman-andras-szerint-kifulladt-a-korabban-sikeres-magyar-gazdasagi-modell","forras":"Infostart","datum":"2026-10-07","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Kármán András pénzügyminiszter szerint a magyar gazdaság korábbi, foglalkoztatásbővítésre épülő növekedési modellje elérte a korlátait, mert a munkaerő-tartalék jelentősen csökkent. A munkaerőpiacon még vannak bevonható csoportok, de foglalkoztatásukhoz gyors képzési és felzárkóztatási programok kellenének. A kedvezőtlen demográfiai folyamatok hosszabb távon tovább szűkíthetik a munkaerő-kínálatot, így már a jelenlegi foglalkoztatási szint fenntartása is eredmény lehet. A miniszter szerint a bérfelzárkózás kulcsa a termelékenység javítása, a technológiai fejlesztés és a vállalatok hatékonyabb működése.","kulcsszavak":["munkaerő-tartalék","gazdasági kilátások","demográfia","képzés"],"het":"2026-10-05","url_forras":"docx","id":"ART-0601","kivonat":"Kármán András pénzügyminiszter szerint a magyar gazdaság korábbi, foglalkoztatásbővítésre épülő növekedési modellje elérte a korlátait, mivel a rendelkezésre álló munkaerő-tartalék jelentősen csökkent. Bár a munkaerőpiacon még vannak bevonható csoportok, foglalkoztatásukhoz gyors és hatékony képzési, valamint felzárkóztatási programokra lenne szükség. A kedvezőtlen demográfiai folyamatok hosszabb távon tovább szűkíthetik a munkaerő-kínálatot, ezért már a foglalkoztatási szint fenntartása is eredménynek számíthat. A miniszter szerint a gazdasági növekedés és a bérek felzárkózásának kulcsa a jövőben elsősorban a termelékenység javítása, a technológiai fejlesztések és a vállalatok hatékonyabb működése lehet."},{"cim":"Külföldi munkaerő: egyelőre kevés konkrétum ismert a szabályozás átalakításáról","url":"https://turizmus.com/cikk/szabalyozas/kulfoldi-munkaero-felulvizsgalat-egyszerusitett-behozatali-rendszer-felfuggesztese","forras":"Turizmus Online","datum":"2026-10-01","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Július óta szünetel az új vendégmunkás-tartózkodási engedélyek kiadása Magyarországon, miközben más jogcímeken továbbra is foglalkoztathatók külföldi munkavállalók. A kormány a szabályozás felülvizsgálatán dolgozik, és elsősorban a mintegy 320 ezer fős hazai munkaerő-tartalék aktivizálását helyezi előtérbe, amit képzések, támogatások és a mobilitási akadályok kezelése nehezít. A mezőgazdaságban továbbra is jelentős a fizikai munkaerő hiánya, a 2026-ra meghatározott 35 ezres külföldi munkavállalói keretet pedig a cégek nem használták ki. Az új szabályozás várhatóan 2027-ben lép életbe, pontos időpontja még nem ismert.","kulcsszavak":["vendégmunka","vendégmunkás-stop","munkaerő-tartalék","agrárium"],"het":"2026-09-28","url_forras":"docx","id":"ART-0602","kivonat":"Július óta szünetel az új vendégmunkás-tartózkodási engedélyek kiadása Magyarországon, miközben más jogcímeken továbbra is lehetséges külföldi munkavállalók foglalkoztatása. A kormány jelenleg a szabályozás felülvizsgálatán dolgozik, és elsősorban a mintegy 320 ezer fős hazai munkaerő-tartalék aktivizálását helyezi előtérbe. A tartalék bevonását ugyanakkor nehezíti, hogy a munkavállalók elhelyezkedéséhez képzésekre, támogatásokra és a mobilitási akadályok kezelésére is szükség lenne. Egyes ágazatokban, különösen a mezőgazdaságban továbbra is jelentős a fizikai munkaerő hiánya. A bizonytalan szabályozási környezet a munkaerő-közvetítő és -kölcsönző cégek tervezését is megnehezíti, miközben a 2026-ra meghatározott 35 ezres külföldi munkavállalói keretet a vállalatok nem használták ki. Az új szabályozás várhatóan 2027-ben léphet életbe, pontos időpontja azonban még nem ismert."},{"cim":"Jönnének a megrendelések, de ki teljesíti őket? Komoly korlátba ütközhetnek a magyar cégek","url":"https://www.portfolio.hu/gazdasag/20261006/jonnenek-a-megrendelesek-de-ki-teljesiti-oket-komoly-korlatba-utkozhetnek-a-magyar-cegek-867578","forras":"Portfolio","datum":"2026-10-06","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Portfolio közel 450 vállalat részvételével készült felmérése szerint a munkaerőhiány a hazai cégek növekedésének egyik legnagyobb akadálya. Győr-Moson-Sopron vármegyében a vállalkozások 64,8 százaléka, Közép-Dunántúlon 56,9 százaléka jelezte, hogy egy hirtelen, 20 százalékos megrendelésbővülés esetén a megfelelő munkavállalók hiánya jelentené a legnagyobb problémát. Győr-Moson-Sopronban 2026 második negyedévében 2 százalékos munkanélküliségi rátát mértek, szemben az országos 4,5 százalékkal. A cégek a munkaerőhiányra egyre inkább termelékenységi beruházásokkal és automatizációval reagálnak.","kulcsszavak":["munkaerő-tartalék","munkaerőhiány","régiós különbségek","automatizáció"],"het":"2026-10-05","url_forras":"docx","id":"ART-0603","kivonat":"A Portfolio közel 450 vállalat részvételével készült felmérése szerint a hazai cégek növekedésének egyik legjelentősebb akadálya a megfelelő munkaerő hiánya lehet. Győr-Moson-Sopron vármegyében a vállalkozások 64,8 százaléka, Közép-Dunántúlon pedig 56,9 százaléka jelezte, hogy egy hirtelen, 20 százalékos megrendelésbővülés esetén a megfelelő munkavállalók megtalálása jelentené a legnagyobb problémát. A munkaerő-tartalék szűkösségét jól mutatja, hogy Győr-Moson-Sopronban 2026 második negyedévében mindössze 2 százalékos munkanélküliségi rátát mértek, szemben az országos 4,5 százalékkal. A vállalatok számára nemcsak a rendelkezésre álló munkaerő létszáma, hanem annak képzettsége is kihívást jelent. A munkaerőhiány kezelésére a cégek egyre inkább a termelékenység javításában, a hatékonyságnövelő beruházásokban és az automatizációban látják a megoldást. A kutatás rámutat, hogy a szűkös munkaerő-tartalék már jelenleg is korlátozhatja a vállalatok bővülési lehetőségeit."},{"cim":"Mutatjuk, miért nem kell félni attól, hogy a humanoid robotok átveszik a fizikai munkát","url":"https://www.hrportal.hu/hr/mutatjuk-miert-nem-kell-felni-attol-hogy-a-humanoid-robotok-atveszik-a-fizikai-munkat-20261007.html","forras":"HR Portal","datum":"2026-10-08","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Az Anthropic elemzése szerint az Egyesült Államok mintegy 160 millió munkavállalójából jelenleg körülbelül 300 ezer fő munkáját válthatnák ki a robotok, ami a teljes foglalkoztatás 0,2 százaléka. A robotizáció terjedését elsősorban a magas beruházási és fenntartási költségek, a technológiai korlátok és az emberi munkavégzés összetettsége lassítja. A finommotorikát, alkalmazkodóképességet és személyes jelenlétet igénylő szakmákban az emberi munkaerő marad meghatározó. A szakértők szerint az automatizáció inkább az egyes munkafolyamatokat alakítja át a következő évtizedekben, nem teljes munkaköröket szüntet meg.","kulcsszavak":["AI","automatizáció","foglalkoztatottság"],"het":"2026-10-05","url_forras":"docx","id":"ART-0604","kivonat":"A mesterséges intelligencia és a robottechnológia gyors fejlődése ellenére a fizikai munkakörök többsége még hosszú ideig nem lesz teljesen automatizálható. Az Anthropic elemzése szerint az Egyesült Államok mintegy 160 millió munkavállalójából jelenleg körülbelül 300 ezer fő munkáját lennének képesek kiváltani a robotok, ami a teljes foglalkoztatás mindössze 0,2 százalékát jelenti. A robotizáció terjedését elsősorban a magas beruházási és fenntartási költségek, a technológiai korlátok, valamint az emberi munkavégzés összetettsége akadályozza. Különösen a finommotorikát, alkalmazkodóképességet és személyes jelenlétet igénylő szakmákban maradhat meghatározó az emberi munkaerő. A szakértők szerint az automatizáció a következő évtizedekben inkább az egyes munkafolyamatokat alakíthatja át, mintsem teljes munkaköröket szüntetne meg, miközben az új technológiák és vállalkozások további foglalkoztatási lehetőségeket teremthetnek."},{"cim":"Ettől rettegtek a dolgozók: szinte a teljes részleget kirúgja a globális bankóriás, az AI veszi át a jól fizetett munkájukat","url":"https://www.portfolio.hu/uzlet/20261007/ettol-rettegtek-a-dolgozok-szinte-a-teljes-reszleget-kirugja-a-globalis-bankorias-az-ai-veszi-at-a-jol-fizetett-munkajukat-867864","forras":"Portfolio","datum":"2026-10-07","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A HSBC jelentős létszámleépítést tervez brit vagyonkezelési üzletágában, és nagyobb szerepet szán a mesterséges intelligenciának az ügyfélkiszolgálásban. A bank a pénzügyi tanácsadók mintegy 70 százalékát és a vezetői, szakértői munkakörben dolgozók közel felét bocsátja el, a távozásokra várhatóan október végén kerül sor. A leépítés Georges Elhedery vezérigazgató átalakítási stratégiájának része, amely a szervezet egyszerűsítésére és az AI szélesebb körű alkalmazására épül. A bank a technológiával gyorsabb, személyre szabottabb ügyfélkiszolgálást és hatékonyabb működést céloz.","kulcsszavak":["leépítés","AI","automatizáció"],"het":"2026-10-05","id":"ART-0605","url_forras":"talalt","kivonat":"A HSBC jelentős létszámleépítést tervez brit vagyonkezelési üzletágában, miközben egyre nagyobb szerepet szán a mesterséges intelligenciának az ügyfélkiszolgálásban. A pénzintézet a pénzügyi tanácsadók mintegy 70 százalékának, valamint a vezetői és szakértői munkakörökben dolgozók közel felének elbocsátását tervezi. Az érintett munkavállalókkal jelenleg egyeztetések zajlanak, távozásukra várhatóan október végén kerülhet sor. A leépítés Georges Elhedery vezérigazgató átalakítási stratégiájának része, amely a szervezeti működés egyszerűsítésére és a mesterséges intelligencia szélesebb körű alkalmazására épül. A technológia bevezetésével a bank gyorsabb, személyre szabottabb ügyfélkiszolgálást és hatékonyabb működést kíván elérni. Az intézkedés rámutat arra, hogy az automatizáció már a magas képzettséget igénylő, jól fizetett munkakörökben is jelentős létszámcsökkentéssel járhat."},{"cim":"Longevity a HR-ben: hogyan éljen a munkavállaló minőségben 100 évet?","url":"https://www.hrportal.hu/hr/longevity-a-hr-ben-hogyan-eljen-a-munkavallalo-minosegben-100-evet-20261001.html","forras":"HR Portal","datum":"2026-10-01","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A Bosch és a Richter közös Innovátorok Napján a hosszú, egészséges élet és a munkahelyi jóllét kapcsolatát vizsgálták, különös tekintettel a HR szerepére. A longevity szemlélet célja nem pusztán az élettartam növelése, hanem az egészségben és aktívan eltöltött évek meghosszabbítása. A résztvevők szerint a munkáltatóknak nagyobb figyelmet kell fordítaniuk a dolgozók testi és mentális egészségére, a pszichológiai biztonságra és a kiégés megelőzésére, amihez a mesterséges intelligencia és az egészségügyi adatok elemzése személyre szabott támogatást adhat. A technológia mellett az emberi kapcsolatok és a munkahelyi közösségek maradnak a minőségi élet egyik alapja.","kulcsszavak":["mentális egészség","munkakörülmények","idősebb munkavállalók"],"het":"2026-09-28","url_forras":"docx","id":"ART-0606","kivonat":"A Bosch és a Richter közös Innovátorok Napján a hosszú, egészséges élet és a munkahelyi jóllét kapcsolatát vizsgálták, különös tekintettel a HR szerepére. A longevity szemlélet célja nem pusztán az élettartam növelése, hanem az egészségben és aktívan eltöltött évek meghosszabbítása. A szakértők szerint a munkáltatóknak egyre nagyobb figyelmet kell fordítaniuk a dolgozók testi és mentális egészségére, a pszichológiai biztonság megteremtésére és a kiégés megelőzésére. A mesterséges intelligencia és az egészségügyi adatok elemzése személyre szabott támogatást nyújthat az egészségesebb életmód kialakításában. A HR hosszú távú feladata olyan támogató vállalati kultúra kialakítása, amely elősegíti a munkavállalók jóllétét, elkötelezettségét és tartós munkaképességét. A szakértők hangsúlyozták, hogy a technológiai fejlődés mellett továbbra is az emberi kapcsolatok és a munkahelyi közösségek jelentik a minőségi élet egyik legfontosabb alapját."},{"cim":"Tartósan öt százalék felett maradhat a munkanélküliség Magyarországon","url":"https://www.atv.hu/belfold/20261005/munkanelkuliseg-munkavallalo/","forras":"ATV","datum":"2026-10-05","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Központi Statisztikai Hivatal adatai szerint 2026 júniusa és augusztusa között közel 235 ezer munkanélkülit tartottak nyilván Magyarországon, a ráta 4,8 százalékra emelkedett. György László közgazdász szerint a mutató tartósan meghaladhatja az 5 százalékot, ezért a meglévő munkaerő megtartására kell összpontosítani. Nógrádi József, a Trenkwalder vezetője szerint a kelet-magyarországi dolgozók számára a nyugat-magyarországi munkavállalás gyakran csak átmeneti állomás, mert sokan végül Ausztriában helyezkednek el, ahol magasabb béreket érhetnek el.","kulcsszavak":["Trenkwalder","KSH","munkanélküliség","régiós különbségek"],"het":"2026-10-05","id":"ART-0607","url_forras":"talalt","kivonat":"A Központi Statisztikai Hivatal adatai szerint 2026 júniusa és augusztusa között közel 235 ezer munkanélkülit tartottak nyilván Magyarországon, a munkanélküliségi ráta pedig 4,8 százalékra emelkedett. György László közgazdász szerint a mutató tartósan meghaladhatja az 5 százalékot, ezért kiemelten fontos a meglévő munkaerő megtartása. Nógrádi József, a Trenkwalder egyik vezetője a munkavállalók földrajzi mobilitásával kapcsolatban arra hívta fel a figyelmet, hogy a kelet-magyarországi dolgozók számára a nyugat-magyarországi munkavállalás gyakran csak átmeneti megoldást jelent. Sokan később Ausztriában helyezkednek el, ahol magasabb béreket érhetnek el. A szakértő szerint a belföldi költözés vagy ingázás megkönnyítheti a külföldi munkavállalásra való áttérést. A cikk emellett a továbbképzések fontosságára, valamint a mesterséges intelligencia és a robotizáció foglalkoztatásra gyakorolt lehetséges hatásaira is kitér."},{"cim":"Hoppon maradhat, aki nem képzi magát","url":"https://autopro.hu/hr/hoppon-maradhat-aki-nem-kepzi-magat/1690230","forras":"Autopro","datum":"2026-10-02","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Központi Statisztikai Hivatal adatai szerint Magyarországon mintegy 220 ezer munkanélküli van, 54 százalékuk 45 év feletti, körülbelül 10 százalékuk rendelkezik felsőfokú végzettséggel. Nógrádi József, a Trenkwalder és az ELTE-Trenkwalder iskolaszövetkezet stratégiai igazgatója szerint az álláskeresés átlagosan 12 hónapig tart, ami különösen az idősebb munkavállalók újbóli elhelyezkedését nehezíti. Ezért nő az élethosszig tartó tanulás és a készségfejlesztés, köztük a kommunikációs készségek jelentősége. Idén eddig 6-7 ezer munkavállalót érintettek csoportos leépítések.","kulcsszavak":["Trenkwalder","képzés","idősebb munkavállalók","munkanélküliség"],"het":"2026-09-28","url_forras":"docx","id":"ART-0608","kivonat":"A Központi Statisztikai Hivatal adatai szerint Magyarországon mintegy 220 ezer munkanélküli van, akiknek 54 százaléka 45 év feletti, és körülbelül 10 százaléka rendelkezik felsőfokú végzettséggel. Nógrádi József, a Trenkwalder és az ELTE-Trenkwalder iskolaszövetkezet stratégiai igazgatója szerint az álláskeresés átlagosan 12 hónapot vesz igénybe, ami rámutat a munkaerőpiaci alkalmazkodás nehézségeire. Különösen az idősebb munkavállalók számára jelenthet kihívást az újbóli elhelyezkedés, ezért egyre fontosabbá válik az élethosszig tartó tanulás és a készségek folyamatos fejlesztése. A szakértő hangsúlyozta, hogy a szakmai tudás mellett a kommunikációs és egyéb személyes készségek fejlesztése is elengedhetetlen. A gazdasági nehézségek következtében idén eddig 6–7 ezer munkavállalót érintettek csoportos leépítések. Nógrádi szerint a munkavállalóknak tudatosan kell készülniük a változásokra, miközben a munkáltatóknak is figyelmet kell fordítaniuk dolgozóik igényeire és megtartására."},{"cim":"Egy asztalhoz ülnek az autóipar nagyágyúi - ilyen lesz az idei TechTogether+","url":"https://autopro.hu/techtogether/egy-asztalhoz-ulnek-az-autoipar-nagyagyui-ilyen-lesz-az-idei-techtogether/1692797","forras":"Autopro","datum":"2026-10-07","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"November 12-én Herceghalmon rendezik meg a TECHTOGETHER+ járműipari konferenciát, ahol a magyar autóipar meghatározó vállalatai és szakértői az intelligens gyártásról, az automatizációról és a mesterséges intelligencia gyakorlati alkalmazásáról tartanak előadást. Nógrádi József, a Trenkwalder Magyarország stratégiai igazgatója a magyar munkaerőpiac változó helyzetéhez való alkalmazkodásról beszél. A résztvevők között van az Audi, a BMW, a BYD és a Suzuki is, szó esik az automatizációs beruházások gazdasági hasznáról is. A Trenkwalder Magyarország a rendezvény támogatói között szerepel.","kulcsszavak":["Trenkwalder","autóipar","automatizáció","AI"],"het":"2026-10-05","url_forras":"docx","id":"ART-0609","kivonat":"November 12-én Herceghalmon rendezik meg a TECHTOGETHER+ járműipari konferenciát, amelyen a magyar autóipar meghatározó vállalatai és szakértői vesznek részt. A rendezvény középpontjában az intelligens gyártás, az automatizáció, a digitalizáció és a mesterséges intelligencia gyakorlati alkalmazása áll. A szakmai programban Nógrádi József, a Trenkwalder Magyarország stratégiai igazgatója is előadást tart, amelyben a magyar munkaerőpiac változó helyzetéhez való alkalmazkodás lehetőségeit mutatja be. A konferencián többek között az Audi, a BMW, a BYD és a Suzuki képviselői is megosztják tapasztalataikat az iparág átalakulásáról. A résztvevők azt is megvizsgálják, milyen gazdasági előnyökkel járhatnak az automatizációs beruházások, illetve hogyan teremthet valódi üzleti értéket a mesterséges intelligencia. A Trenkwalder Magyarország a rendezvény támogatói között is szerepel, ezzel is erősítve jelenlétét az iparági és munkaerőpiaci szakmai párbeszédben."},{"cim":"Évi 240 millió eurós többletköltséget okoz a hiányzás a spanyol kiskereskedelemben","url":"https://trademagazin.hu/hu/evi-240-millio-euros-tobbletkoltseget-okoz-a-hianyzas-a-spanyol-kiskereskedelemben/","forras":"Trade magazin","datum":"2026-10-05","fokategoria":"versenytars","alkategoria":"Adecco","osszefoglalo":"Az Adecco Group Institute és az Anged kereskedelmi szövetség kutatása szerint a munkavállalói hiányzások évente mintegy 240 millió eurós többletköltséget okoznak a spanyol nagy- és kiskereskedelemnek. A hiányzások évi 12,7 millió munkaóra kiesését jelentik, ami 7113 teljes munkaidős állásnak felel meg, a hiányzási ráta pedig közelíti a 8 százalékot. A vállalatok 81,8 százaléka az elmúlt három évben növekedésről számolt be, a mentális egészséggel összefüggő betegállományok aránya pedig megduplázódott, és már az összes hiányzás ötödét teszi ki. A munkáltatók ideiglenes munkaerővel, munkaszervezési változtatásokkal és pszichológiai támogatóprogramokkal próbálják mérsékelni a kieséseket.","kulcsszavak":["Adecco","mentális egészség","kereskedelem","kutatás és statisztika"],"het":"2026-10-05","url_forras":"docx","id":"ART-0610","kivonat":"Évente mintegy 240 millió eurós többletköltséget okoznak a munkavállalói hiányzások a spanyol nagy- és kiskereskedelmi vállalatoknak – derül ki az Adecco Group Institute és az Anged kereskedelmi szövetség közös kutatásából. A felmérés szerint a hiányzások évente 12,7 millió munkaóra kiesését eredményezik, ami 7113 teljes munkaidős állásnak felel meg. A hiányzási ráta megközelíti a 8 százalékot, és a vállalatok 81,8 százaléka növekedésről számolt be az elmúlt három évben. A mentális egészséggel összefüggő betegállományok aránya megduplázódott, és már az összes hiányzás ötödét teszi ki. A munkáltatók ideiglenes munkaerő alkalmazásával, munkaszervezési változtatásokkal és pszichológiai támogatóprogramokkal igyekeznek mérsékelni a kieséseket. A kutatás rámutat a munkavállalói egészségmegőrzés és a hatékony munkaerő-gazdálkodás növekvő jelentőségére."},{"cim":"Nem igaz, hogy mi, magyarok, lusták vagyunk, látom a Lidlben!","url":"https://www.portfolio.hu/uzlet/20261007/nem-igaz-hogy-mi-magyarok-lustak-vagyunk-latom-a-lidlben-868036","forras":"Portfolio","datum":"2026-10-07","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Budapest Economic Forum konferencián a magyar gazdaság termelékenységi problémái kerültek előtérbe. Baja Sándor, a Randstad régiós ügyvezető igazgatója szerint a magyar munkavállalók teljesítményével kapcsolatos negatív általánosítások megalapozatlanok, a valódi gondot a gazdaságpolitikai és vállalatszervezési hiányosságok okozzák. Szerinte a korábbi gazdaságpolitika túlságosan a támogatásokra épült, és nem ösztönözte kellően a vállalatokat a hatékonyság javítására. A munkaerőhiány kezelésében a képzés, a megfelelő munkaszervezés és a vállalatok alkalmazkodóképessége játszhat szerepet.","kulcsszavak":["Randstad","gazdasági kilátások","munkaerőhiány"],"het":"2026-10-05","id":"ART-0611","url_forras":"talalt","kivonat":"A Budapest Economic Forum konferencián a magyar gazdaság termelékenységi problémái kerültek előtérbe. Baja Sándor, a Randstad régiós ügyvezető igazgatója szerint a magyar munkavállalók teljesítményével kapcsolatos negatív általánosítások nem megalapozottak, a valódi problémát inkább a gazdaságpolitikai és vállalatszervezési hiányosságok jelentik. A szakértő hangsúlyozta, hogy a vállalatok versenyképességének javításához kiszámíthatóbb gazdasági környezetre, hatékonyabb működésre és a termelékenység növelésére van szükség. Véleménye szerint a korábbi gazdaságpolitika túlságosan a támogatásokra épült, miközben nem ösztönözte megfelelően a vállalatokat a hatékonyság javítására. A munkaerőhiány kezelésében a képzés, a megfelelő munkaszervezés és a vállalatok alkalmazkodóképessége is meghatározó szerepet játszhat. Baja arra is felhívta a figyelmet, hogy Magyarországon egyes ágazatokban már most is jelentős termelékenységi különbségek tapasztalhatók, amelyek hosszabb távon befolyásolják a gazdaság versenyképességét."},{"cim":"Az európai gazdaságtól a mesterséges intelligenciáig - a szakértők szerint ezek a folyamatok alakítják át a magyar munkaerőpiacot","url":"https://profitline.hu/az-europai-gazdasagtol-a-mesterseges-intelligenciaig-a-szakertok-szerint-ezek-a-folyamatok-alakitjak-at-a-magyar-munkaeropiacot-491430","forras":"ProfitLine","datum":"2026-10-06","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"Az előrejelzések szerint Magyarország munkaképes korú népessége 2070-ig mintegy 18 százalékkal csökkenhet, amit a demográfiai változások, a nemzetközi gazdasági folyamatok és a mesterséges intelligencia térnyerése egyaránt alakít. A Work Force szakértői szerint a munkaerőpiaci kereslet jelenleg mérséklődik, de a tartós szakemberhiány megmarad. Maljusin Anna, a vállalat szellemi szolgáltatások üzletágának vezetője szerint a legnagyobb kihívást ma már nem a jelentkezők száma, hanem a munkavállalói készségek és a munkáltatói elvárások közötti eltérés jelenti. Szerinte a cégeknek a hagyományos végzettség és tapasztalat mellett a jelöltek tényleges kompetenciáit is figyelembe kell venniük.","kulcsszavak":["Work Force","demográfia","munkaerőhiány","skills-alapú HR"],"het":"2026-10-05","url_forras":"docx","id":"ART-0612","kivonat":"A magyar munkaerőpiac hosszú távú alakulását a demográfiai változások, a nemzetközi gazdasági folyamatok és a mesterséges intelligencia térnyerése egyaránt befolyásolják. Az előrejelzések szerint Magyarország munkaképes korú népessége 2070-ig mintegy 18 százalékkal csökkenhet. A Work-Force szakértői hangsúlyozzák, hogy bár a munkaerőpiaci kereslet jelenleg mérséklődik, a tartós szakemberhiány továbbra is fennáll. Maljusin Anna, a vállalat szellemi szolgáltatások üzletágának vezetője szerint a legnagyobb kihívást egyre inkább nem a jelentkezők száma, hanem a munkavállalók készségei és a munkáltatói elvárások közötti eltérés jelenti. A szakértő kiemelte, hogy a vállalatoknak a hagyományos végzettségek és munkaköri tapasztalatok mellett a jelöltek meglévő kompetenciáit is figyelembe kell venniük. A mesterséges intelligencia terjedése ugyanakkor tovább növeli az alkalmazkodóképesség és az emberi kreativitás jelentőségét a foglalkoztatásban."},{"cim":"Összeállt a jubileumi HRKOMM Award shortlistje","url":"https://hrpwr.hu/cikk/osszeallt-a-jubileumi-hrkomm-award-shortlistje","forras":"HRPWR","datum":"2026-10-13","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HRKOMM Award jubileumi, 2026-os kiírásának zsűrije kiválasztotta a verseny finalistáit, akik employer branding, munkavállalói kommunikáció, társadalmi felelősségvállalás és wellbeing témájú kampányokkal neveztek. A zsűri a pályamunkákat stratégia, eredményesség és kreativitás alapján értékelte, több esetben a mesterséges intelligencia alkalmazása is felmerült. A díjátadót október 29-én rendezik meg a budapesti Symbolban. A Prohuman a HRKOMM Award főtámogatója.","kulcsszavak":["munkáltatói márka","AI"],"het":"2026-10-12","url_forras":"docx","id":"ART-0613","kivonat":"A jubileumi HRKOMM Award zsűrije kiválasztotta a 2026-os verseny finalistáit, akik többek között employer branding, munkavállalói kommunikáció, társadalmi felelősségvállalás és wellbeing témájú kampányokkal neveztek. A pályamunkákat stratégia, eredményesség és kreativitás alapján értékelték, és több esetben a mesterséges intelligencia használata is felmerült. A díjátadót október 29-én rendezik meg a budapesti Symbolban. A Prohuman a HRKOMM Award főtámogatója."},{"cim":"Vajon milyen szakemberre lesz szükséged 3 év múlva, az AI korában?","url":"https://profitline.hu/vajon-milyen-szakemberre-lesz-szukseged-3-ev-mulva-az-ai-koraban-491815","forras":"Profitline","datum":"2026-10-15","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman a SkillCompass csapatát Nagy Andrea HR- és szervezetfejlesztési szakemberrel erősítette meg, aki 2026 augusztusa óta kiemelt partnerségben dolgozik a céggel. A SkillCompass segítségével a vállalatok felmérhetik a munkatársak meglévő kompetenciáit, azonosíthatják a hiányosságokat, és megtervezhetik a szükséges képzéseket. A cikk szerint a mesterséges intelligencia térnyerésével egyre fontosabbá válik a készségalapú szemlélet, amely a hagyományos munkakörök helyett a feladatokra és a munkavállalók képességeire helyezi a hangsúlyt.","kulcsszavak":["skills-alapú HR","AI","képzés"],"het":"2026-10-12","url_forras":"docx","id":"ART-0614","kivonat":"A Prohuman a SkillCompass csapatát Nagy Andrea tapasztalt HR- és szervezetfejlesztési szakemberrel erősítette meg, aki 2026 augusztusától kiemelt partnerségben dolgozik a céggel. A SkillCompass segítségével a vállalatok felmérhetik a munkatársak meglévő kompetenciáit, azonosíthatják a hiányosságokat, és megtervezhetik a szükséges képzéseket. A cikk kiemeli, hogy a mesterséges intelligencia korában egyre fontosabbá válik a készségalapú szemlélet, amely a hagyományos munkakörök helyett a feladatokra és a munkavállalók képességeire helyezi a hangsúlyt. A cél, hogy a vállalatok könnyebben alkalmazkodjanak a változásokhoz, és hosszú távon is biztosítani tudják a szükséges szakértelmet. (A cikk az általunk közzétett sajtóközlemény alapján született)"},{"cim":"Egyre tovább tart munkát találni: ezt tanácsolja a HR-szakértő az álláskeresőknek","url":"https://www.hrportal.hu/hr/egyre-tovabb-tart-munkat-talalni-ezt-tanacsolja-a-hr-szakerto-az-allaskeresoknek-20261015.html","forras":"HR Portál","datum":"2026-10-16","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"2026 nyarán a munkanélküliek 33,7 százaléka már legalább egy éve keresett állást Magyarországon. Dénes Rajmund, a Humán Centrum Kft. ügyvezetője szerint az álláskeresőknek a teljes munkaidős pozíciók mellett érdemes rugalmasabb formákat, köztük a munkaerő-kölcsönzést is megfontolniuk, mert az új tapasztalatot és szakmai kapcsolatokat ad, és később hosszabb távú munkaviszonyhoz vezethet. Emellett több csatornán érdemes állást keresni, fejleszteni a készségeket, és tudatosan használni az AI-t az önéletrajz elkészítéséhez és az interjúra való felkészüléshez.","kulcsszavak":["munkaerő-kölcsönzés","munkanélküliség","AI"],"het":"2026-10-12","url_forras":"docx","id":"ART-0615","kivonat":"A cikk szerint egyre nehezebb munkát találni Magyarországon: 2026 nyarán a munkanélküliek 33,7%-a már legalább egy éve keresett állást. Dénes Rajmund, a Humán Centrum Kft. ügyvezetője azt tanácsolja az álláskeresőknek, hogy a hagyományos, teljes munkaidős pozíciók mellett a rugalmasabb lehetőségeket is vegyék figyelembe. A munkaerő-kölcsönzés átmeneti megoldásként is segíthet az elhelyezkedésben, új tapasztalatok és szakmai kapcsolatok megszerzésében, később pedig akár hosszabb távú munkaviszonyhoz is vezethet. Emellett érdemes több csatornán állást keresni, fejleszteni a készségeket, és az AI-t is tudatosan használni az önéletrajz elkészítéséhez és az állásinterjúra való felkészüléshez."},{"cim":"Bérjelentés: bérfeszültséghez vezethet, ha a munkáltató nyílt lapokkal játszik?","url":"https://www.hrportal.hu/hr/berjelentes-berfeszultseghez-vezethet-ha-a-munkaltato-nyilt-lapokkal-jatszik-20261013.html","forras":"HR Portál","datum":"2026-10-14","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"Az uniós bértranszparencia-irányelvhez kapcsolódó bérjelentési kötelezettség célja többek között a nők és férfiak közötti bérkülönbségek feltárása, a jelentés összesített adatokat és arányszámokat tartalmaz, nem az egyes munkavállalók fizetését teszi nyilvánossá. Nyitott kérdés, hogyan kell figyelembe venni a kölcsönzött dolgozókat a munkáltatói létszám meghatározásakor. A munkáltatóknak már most érdemes felülvizsgálniuk HR-gyakorlataikat és bérstruktúrájukat a későbbi adatszolgáltatásra való felkészülés érdekében.","kulcsszavak":["bértranszparencia","munkaerő-kölcsönzés","nők a munkaerőpiacon"],"het":"2026-10-12
