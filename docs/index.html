","url_forras":"docx","id":"ART-0616","kivonat":"A cikk az uniós bértranszparencia-irányelvhez kapcsolódó bérjelentési kötelezettséget mutatja be, amelynek célja többek között a nők és férfiak közötti bérkülönbségek feltárása. A jelentés összesített adatokat és arányszámokat tartalmaz, nem az egyes munkavállalók konkrét fizetését teszi nyilvánossá. A munkaerő-kölcsönzés kapcsán felmerül, hogy a kölcsönzött dolgozókat hogyan kell figyelembe venni a munkáltatói létszám meghatározásakor, de erre egyelőre nincs egyértelmű válasz. A cikk szerint a munkáltatóknak már most érdemes felülvizsgálniuk a HR-gyakorlataikat és bérstruktúrájukat a későbbi adatszolgáltatásra való felkészülés érdekében."},{"cim":"Külföldi vendégmunkások: radikális javaslatcsomag érkezett a kormány asztalára","url":"https://www.portfolio.hu/gazdasag/20261009/kulfoldi-vendegmunkasok-radikalis-javaslatcsomag-erkezett-a-kormany-asztalara-868774","forras":"Portfolio","datum":"2026-10-09","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A LIGA Vas- és Fémipari Szövetsége javaslatcsomagot dolgozott ki a harmadik országbeli vendégmunkások foglalkoztatásának szigorítására és a hazai munkaerő-tartalék mozgósítására. A szövetség szerint Magyarországon mintegy 300 ezer munkanélküli, inaktív vagy alulfoglalkoztatott ember jelenthet belső munkaerő-tartalékot, miközben több százezer magyar dolgozik külföldön. A javaslatok között szerepel a kötelező munkaerőpiaci vizsgálat, a külföldi munkavállalók arányának korlátozása és kötelező képzések bevezetése. Az érdekképviselet szerint a gazdaság fejlődését a hazai dolgozók megbecsülésére, a digitalizációra és az automatizációra kellene alapozni.","kulcsszavak":["vendégmunka","munkaerő-tartalék","politika"],"het":"2026-10-05","url_forras":"docx","id":"ART-0617","kivonat":"A LIGA Vas- és Fémipari Szövetsége javaslatcsomagot dolgozott ki a harmadik országbeli vendégmunkások foglalkoztatásának szigorítására és a hazai munkaerőtartalék mozgósítására. A szövetség szerint Magyarországon mintegy 300 ezer munkanélküli, inaktív vagy alulfoglalkoztatott ember jelenthet belső munkaerő-tartalékot, emellett több százezer magyar dolgozik külföldön. A javaslatok között szerepel a kötelező munkaerőpiaci vizsgálat, a külföldi munkavállalók arányának korlátozása, valamint a kötelező képzések bevezetése. Az érdekképviselet szerint a gazdaság fejlődését inkább a hazai dolgozók megbecsülésére, a digitalizációra és az automatizációra kellene alapozni."},{"cim":"Minimálbér 2027: nemsokára érkeznek a konkrét számok, ennyivel nőhetnek a legkisebb fizetések jövőre","url":"https://www.penzcentrum.hu/karrier/20261013/minimalber-2027-nemsokara-erkeznek-a-konkret-szamok-ennyivel-nohetnek-a-legkisebb-fizetesek-jovore-1207180","forras":"Pénzcentrum","datum":"2026-10-13","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Október második felében kezdődnek a 2027-es minimálbér-emelés mértékéről szóló egyeztetések. A 2024-ben megkötött hároméves bérmegállapodás eredetileg 14 százalékos emelést irányzott elő jövőre, de a vártnál gyengébb gazdasági növekedés miatt ez valószínűtlen. Perlusz László, a VOSZ főtitkára szerint az emelés ütemét a tényleges makrogazdasági teljesítményhez kell igazítani, mivel a megállapodás alapjául szolgáló 4,3 százalékos GDP-növekedés 2027-re jelenleg nem reális. A munkáltatók már az idei, 11 százalékos minimálbér-emelést is jelentős teherként értékelik, miközben az átlagkeresetek 2026-ban várhatóan 8–9 százalékkal nőnek.","kulcsszavak":["bérek","gazdasági kilátások","munkáltatói szövetség"],"het":"2026-10-12","url_forras":"docx","id":"ART-0618","kivonat":"Október második felében kezdődnek a 2027-es minimálbér-emelés mértékéről szóló egyeztetések. A 2024-ben megkötött hároméves bérmegállapodás eredetileg 14 százalékos emelést irányzott elő jövőre, azonban a vártnál gyengébb gazdasági növekedés miatt ennek megvalósulása valószínűtlen. Perlusz László, a VOSZ főtitkára szerint a minimálbér-emelés ütemét a tényleges makrogazdasági teljesítményhez kell igazítani. A megállapodás 2027-re 4,3 százalékos GDP-növekedéssel számolt, amelynek teljesülése jelenleg nem reális. A munkáltatók már az idei, 11 százalékos minimálbér-emelést is jelentős teherként értékelik, ezért további nagyarányú béremelésre korlátozott mozgásterük maradt. Ugyanakkor a mérsékelt infláció mellett az átlagkeresetek 2026-ban várhatóan 8–9 százalékkal emelkedhetnek, ami érdemi reálbér-növekedést eredményezhet. A végleges emelési mértékről a gazdasági adatok alapján döntenek a tárgyalópartnerek."},{"cim":"Mi vár a magyar autógyártásra? Öt nagyvállalat vezetője ül egy asztalhoz","url":"http://autopro.hu/","forras":"Autopro","datum":"2026-10-16","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"November 12-én rendezik meg a TECHTOGETHER+ konferenciát, amely a magyar autóipar jövőjét és az ágazat előtt álló kihívásokat állítja középpontba. A rendezvényen több jelentős autóipari vállalat, köztük az Audi, a BMW, a BYD, a CATL, a Stellantis és a Magyar Suzuki képviselői is részt vesznek. Az autógyártás helyzete jelentősen befolyásolja az ipari foglalkoztatási igényeket és a munkaerő-kölcsönzési piac alakulását.","kulcsszavak":["autóipar","munkaerő-kölcsönzés"],"het":"2026-10-12","id":"ART-0619","kivonat":"A november 12-én megrendezendő TECHTOGETHER+ konferencia a magyar autóipar jövőjét és az ágazat előtt álló kihívásokat helyezi középpontba. A rendezvényen több jelentős autóipari vállalat, köztük az Audi, a BMW, a BYD, a CATL, a Stellantis és a Magyar Suzuki képviselői is részt vesznek. A szakmai program lehetőséget teremt az autóipari szereplők közötti párbeszédre, valamint az iparágat érintő változások és jövőbeli kilátások megvitatására. A konferencia a munkaerőpiaci szolgáltatók számára is releváns, hiszen az autógyártás helyzete jelentősen befolyásolja az ipari foglalkoztatási igényeket és a munkaerő-kölcsönzési piac alakulását.","url_forras":"docx"},{"cim":"Változtatni kell a magyar gazdaságpolitikán, hogy utolérjük a lengyeleket","url":"https://www.heol.hu/helyi-gazdasag/2026/10/kata-adozas-oktatas-egeszsegugy-nav-vosz-forum?utm_source=factiva_f%3Fxml_output_generate_by_type%3Dfactiva_f&utm_medium=referral&utm_campaign=hiraggregator","forras":"HEOL","datum":"2026-10-09","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Vállalkozók és Munkáltatók Országos Szövetségének egri gazdasági fórumán Baja Sándor, a Randstad Hungary ügyvezető igazgatója elmondta: 2026-ban a vállalatok többsége tervezett béremelést, ugyanakkor többen jeleztek létszámcsökkentést, mint bővítést. A munkaerőpiacon elsősorban a mérnöki és informatikai végzettségű szakemberek iránt mutatkozott kereslet, más területeken nehezebbé vált az elhelyezkedés. Baja szerint a csökkenő születésszám miatt Magyarországnak hosszú távon külföldi munkavállalókra lesz szüksége, akiknél a szakképzettséget kellene előtérbe helyezni. A hazai termelékenység növekedése elmaradt a reálbérek emelkedésétől, miközben a mesterséges intelligencia munkaerőpiaci hatásai továbbra is bizonytalanok.","kulcsszavak":["Randstad","demográfia","munkáltatói szövetség"],"het":"2026-10-05","url_forras":"docx","id":"ART-0620","kivonat":"A Vállalkozók és Munkáltatók Országos Szövetségének egri gazdasági fórumán a magyar gazdaság helyzete, a munkaerőpiaci folyamatok és a foglalkoztatás jövője is napirendre került. Baja Sándor, a Randstad Hungary ügyvezető igazgatója szerint 2026-ban a vállalatok többsége béremelést tervezett, ugyanakkor többen számoltak létszámcsökkentéssel, mint bővítéssel. A munkaerőpiacon elsősorban a mérnöki és informatikai végzettségű szakemberek iránt mutatkozott kereslet, míg más területeken nehezebbé vált az elhelyezkedés. Baja hangsúlyozta, hogy a csökkenő születésszám miatt Magyarországnak hosszú távon szüksége lesz külföldi munkavállalókra, akiknek kiválasztásánál a szakképzettséget kellene előtérbe helyezni. Kitért arra is, hogy a hazai termelékenység növekedése elmaradt a reálbérek emelkedésétől, miközben a mesterséges intelligencia munkaerőpiaci hatásai továbbra is bizonytalanok. A jövőben a munkavállalói bizalom, a stabilitás és az alkalmazkodóképesség szerepe is felértékelődhet."},{"cim":"A magyar kismamák forradalma: az óraszám alapú munka hódít a körükben","url":"https://trademagazin.hu/hu/a-magyar-kismamak-forradalma-az-oraszam-alapu-munka-hodit-a-korukben-2/","forras":"Trade magazin","datum":"2026-10-09","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC Csoport elemzése szerint egyre nagyobb szerepet kap a kisgyermekes édesanyák rugalmas, óraszám alapú foglalkoztatása a magyar munkaerőpiacon, a 25–49 éves nők foglalkoztatási rátája már meghaladja a 80 százalékot. Kiss Nikolett, a WHC szövetkezeti-szolgáltatás régióvezetője szerint a kismama szövetkezeti modell a munkáltatóknak rugalmasabb létszámgazdálkodást, alacsonyabb bérköltséget és adminisztrációs terhet jelent. Az édesanyák számára a modell megőrzi a szakmai kapcsolatokat és kompetenciákat, és fokozatos visszatérést biztosít a teljes munkaidős foglalkoztatásba.","kulcsszavak":["WHC","nők a munkaerőpiacon","rugalmas foglalkoztatás"],"het":"2026-10-05","url_forras":"docx","id":"ART-0621","kivonat":"A WHC Csoport elemzése szerint egyre nagyobb szerepet kap a kisgyermekes édesanyák rugalmas foglalkoztatása a magyar munkaerőpiacon. A 25–49 éves nők foglalkoztatási rátája már meghaladja a 80 százalékot, miközben a kismama szövetkezeti modell lehetőséget biztosít a gyermeknevelés melletti, óraszám alapú munkavégzésre. Kiss Nikolett, a WHC szövetkezeti-szolgáltatás régióvezetője szerint ez a foglalkoztatási forma a munkáltatóknak és a munkavállalóknak egyaránt előnyös. A vállalatok rugalmasan igazíthatják a létszámot a feladatokhoz, miközben kedvezőbb bérköltségekkel és alacsonyabb adminisztrációs terhekkel számolhatnak. Az édesanyák számára a modell lehetőséget teremt a szakmai kapcsolatok és kompetenciák megőrzésére, valamint a teljes munkaidős foglalkoztatásba történő fokozatos visszatérésre. A cikk emellett bemutatja a szövetkezeti foglalkoztatás adózási előnyeit és a gyermekgondozási ellátások melletti munkavállalás lehetőségeit."},{"cim":"A bérszámfejtés tétje: elpárolgó munkavállalói bizalom, megugró fluktuáció","url":"https://hrpwr.hu/cikk/a-berszamfejtes-tetje-elparolgo-munkavallaloi-bizalom-megugro-fluktuacio","forras":"HRPWR","datum":"2026-10-12","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A pontos és időben történő bérszámfejtés alapvető szerepet játszik a munkavállalói bizalom és a vállalati stabilitás megőrzésében, egy hibás vagy késedelmes bérkifizetés pedig növelheti a fluktuációt és hatósági bírságot is eredményezhet. Szakály Balázs, a WHC Payroll üzletágvezetője szerint a folyamatosan változó jogszabályok és az eltérő foglalkoztatási formák miatt a bérszámfejtés egyre összetettebb feladat, különösen kockázatos, ha a folyamat egyetlen belső szakemberre épül. A cikk a kiszervezés előnyeit emeli ki: kiszámítható költségeket, szakértői támogatást és a működési folytonosság biztosítását, miközben a belső HR-csapatok több figyelmet fordíthatnak stratégiai feladataikra.","kulcsszavak":["WHC","munkáltatói márka","munkajog"],"het":"2026-10-12","url_forras":"docx","id":"ART-0622","kivonat":"A pontos és időben történő bérszámfejtés alapvető szerepet játszik a munkavállalói bizalom és a vállalati stabilitás megőrzésében. Egy hibás vagy késedelmes bérkifizetés növelheti a fluktuációt, ronthatja a munkáltatói márkát, valamint jelentős hatósági bírságokat eredményezhet. Szakály Balázs, a WHC Payroll üzletágvezetője szerint a folyamatosan változó jogszabályok és az eltérő foglalkoztatási formák miatt a bérszámfejtés egyre összetettebb feladattá válik. Különösen nagy kockázatot jelent, ha a folyamat egyetlen belső szakemberre épül. A cikk a bérszámfejtés kiszervezésének előnyeit hangsúlyozza, köztük a kiszámítható költségeket, a szakértői támogatást és a működési folytonosság biztosítását. A külső szolgáltatók automatizált rendszerekkel és digitális HR-megoldásokkal is segíthetik a vállalatokat, miközben a belső HR-csapatok több figyelmet fordíthatnak stratégiai feladataikra."},{"cim":"Tízmilliós spórolás és elenyésző fluktuáció: miért keresik egyre több helyen a megváltozott munkaképességű munkavállalókat?","url":"https://trademagazin.hu/hu/tizmillios-sporolas-es-elenyeszo-fluktuacio-miert-keresik-egyre-tobb-helyen-a-megvaltozott-munkakepessegu-munkavallalokat/","forras":"Trade magazin","datum":"2026-10-15","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC Csoport elemzése szerint a rehabilitációs hozzájárulás kiváltásával a cégek megváltozott munkaképességű munkavállalónként évente közel 2,9 millió forintot takaríthatnak meg. Tóth Edina, a WHC Csoport rehabilitációs vezetője szerint a rugalmas, részmunkaidős és hibrid foglalkoztatási modellekkel jelentős munkaerő-kapacitások válnak elérhetővé, az érintettek fizikai mellett adminisztratív, ügyfélszolgálati, pénzügyi és informatikai feladatokban is dolgozhatnak. A legnagyobb akadályt az orvosi minősítésekkel kapcsolatos bizonytalanság, a folyamatok előkészítésének hiánya és a befogadó szervezeti kultúra kialakítása jelenti.","kulcsszavak":["WHC","esélyegyenlőség","munkaerőhiány"],"het":"2026-10-12","url_forras":"docx","id":"ART-0623","kivonat":"A megváltozott munkaképességű munkavállalók foglalkoztatása egyre jelentősebb lehetőséget kínál a magyar vállalatok számára a munkaerőhiány enyhítésére és a foglalkoztatási költségek csökkentésére. A WHC Csoport elemzése szerint a rehabilitációs hozzájárulás kiváltásával a cégek érintett munkavállalónként évente közel 2,9 millió forintot takaríthatnak meg. Tóth Edina, a WHC Csoport rehabilitációs vezetője hangsúlyozta, hogy a rugalmas, részmunkaidős és hibrid foglalkoztatási modellek alkalmazásával jelentős munkaerő-kapacitások válhatnak elérhetővé. Az érintett munkavállalók nemcsak fizikai, hanem adminisztratív, ügyfélszolgálati, pénzügyi és informatikai feladatokban is foglalkoztathatók. A WHC tapasztalatai alapján a vállalatok számára a legnagyobb akadályt az orvosi minősítésekkel kapcsolatos bizonytalanság, a folyamatok előkészítésének hiánya és a befogadó szervezeti kultúra kialakítása jelenti. A megfelelő integráció ugyanakkor alacsony fluktuációt és stabilabb működést eredményezhet."},{"cim":"A szakértők szerint ezek a folyamatok alakítják át a magyar munkaerőpiacot","url":"https://hrpwr.hu/cikk/a-szakertok-szerint-ezek-a-folyamatok-alakitjak-at-a-magyar-munkaeropiacot","forras":"HRPWR","datum":"2026-10-15","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A Work-Force szakértői szerint az üres álláshelyek száma 2025 eleje óta 5 százalékkal csökkent, a hosszú távú szakemberhiány azonban továbbra is fennáll, mert Magyarország munkaképes korú népessége 2070-ig mintegy 18 százalékkal csökkenhet. Maljusin Anna, a Work-Force szellemi szolgáltatások üzletágának vezetője szerint a munkaerőpiac egyik legnagyobb problémája a munkavállalók kompetenciái és a vállalatok elvárásai közötti eltérés, ezért a munkáltatóknak a végzettség mellett a jelöltek meglévő készségeire is nagyobb figyelmet kell fordítaniuk. A mesterséges intelligencia terjedése szintén átalakítja a munkavégzést, az emberi kreativitás és szakértelem ugyanakkor nélkülözhetetlen marad.","kulcsszavak":["Work Force","demográfia","munkaerőhiány","skills-alapú HR"],"het":"2026-10-12","url_forras":"docx","id":"ART-0624","kivonat":"A magyar munkaerőpiac jövőjét a demográfiai változások, a nemzetközi gazdasági folyamatok és a mesterséges intelligencia térnyerése egyaránt meghatározzák. A Work-Force szakértői szerint bár az üres álláshelyek száma 2025 eleje óta 5 százalékkal csökkent, a hosszú távú szakemberhiány továbbra is fennáll. Magyarország munkaképes korú népessége 2070-ig mintegy 18 százalékkal csökkenhet, ami további kihívásokat jelenthet a foglalkoztatásban. Maljusin Anna, a Work-Force szellemi szolgáltatások üzletágának vezetője hangsúlyozta, hogy a munkaerőpiac egyik legnagyobb problémája a munkavállalók kompetenciái és a vállalatok elvárásai közötti eltérés. A munkáltatóknak ezért a végzettség és a korábbi munkakörök mellett a jelöltek meglévő készségeire is nagyobb figyelmet kell fordítaniuk. A mesterséges intelligencia terjedése szintén átalakítja a munkavégzést, ugyanakkor az emberi kreativitás és szakértelem továbbra is nélkülözhetetlen marad."},{"cim":"Vajon milyen szakemberre lesz szükséged 3 év múlva?","url":"https://hrpwr.hu/cikk/vajon-milyen-szakemberre-lesz-szukseged-3-ev-mulva","forras":"HRPWR","datum":"2026-10-20","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman a SkillCompass csapatát Nagy Andrea tapasztalt HR- és szervezetfejlesztési szakemberrel erősítette meg, aki 2026 augusztusától szoros partnerségben dolgozik a céggel. A SkillCompass segítségével a vállalatok felmérhetik a munkatársak meglévő kompetenciáit, azonosíthatják a hiányosságokat, és megtervezhetik a szükséges képzéseket. A cikk szerint a mesterséges intelligencia korában egyre fontosabbá válik a készségalapú szemlélet, amely a hagyományos munkakörök helyett a feladatokra és a munkavállalók képességeire helyezi a hangsúlyt.","kulcsszavak":["skills-alapú HR","AI","képzés"],"het":"2026-10-19","url_forras":"docx","id":"ART-0625","kivonat":"A Prohuman a SkillCompass csapatát Nagy Andrea tapasztalt HR- és szervezetfejlesztési szakemberrel erősítette meg, aki 2026 augusztusától kiemelt partnerségben dolgozik a céggel. A SkillCompass segítségével a vállalatok felmérhetik a munkatársak meglévő kompetenciáit, azonosíthatják a hiányosságokat, és megtervezhetik a szükséges képzéseket. A cikk kiemeli, hogy a mesterséges intelligencia korában egyre fontosabbá válik a készségalapú szemlélet, amely a hagyományos munkakörök helyett a feladatokra és a munkavállalók képességeire helyezi a hangsúlyt. A cél, hogy a vállalatok könnyebben alkalmazkodjanak a változásokhoz, és hosszú távon is biztosítani tudják a szükséges szakértelmet. (Saját közlemény alapján.)"},{"cim":"Akiktől a munkádat félted: filippínók Magyarországon","url":"https://www.youtube.com/watch?v=Dvf2tSZbA5A","forras":"Partizán","datum":"2026-10-18","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Fülöp-szigeteki vendégmunkások száma néhány száz főről 16 ezerre nőtt, amit a hazai munkaerőhiány és a Fülöp-szigetek munkaerő-export modellje egyaránt hajt. A dolgozók gyakran több millió forintos tartozással vállalják a külföldi munkát, mert a közvetítői díjat, az utazást és a család átmeneti megélhetését is finanszírozniuk kell, miközben jövedelmük jelentős részét hazaküldik. A Partizán riportjában megszólaló filippínó pap elmondása szerint rendszeresen munkásszállókon segít szerződéseket átnézni, tolmácsol, és rendőrségi, bevándorlási ügyekben jár el a dolgozóknak, mert a munkaviszony megszűnése a tartózkodási jogot is érintheti.","kulcsszavak":["vendégmunka","munkakörülmények","munkajog"],"het":"2026-10-12","url_forras":"docx","id":"ART-0626","kivonat":"A Fülöp-szigeteki vendégmunkások száma a néhány száz főről 16 ezerre nőtt, amit egyszerre hajt a hazai munkaerőhiány és a Fülöp-szigetek „munkaerő-export” modellje. Sokan több millió forintos tartozással vágnak neki a külföldi munkának, mert közvetítői díjakat, utazási költségeket és a család átmeneti megélhetését is finanszírozniuk kell, miközben jövedelmük jelentős részét hazaküldik. Egy filippínó pap arról beszélt, hogy rendszeresen munkásszállókon alszik, szerződéseket néz át, tolmácsol, rendőrségi és bevándorlási ügyekben segít, mert a dolgozók gyakran nem ismerik jogaikat és félnek a munkájuk elvesztésétől. A riport központi állítása, hogy a szabályozás kiszolgáltatott helyzetet teremthet: a munkaviszony megszűnése a tartózkodási jogot is veszélybe sodorhatja, ami nehezíti a jogérvényesítést és teret ad a kizsákmányoló gyakorlatoknak."},{"cim":"Vendégmunkás vagy külföldi munkavállaló – a fogalmi különbség, amely sok magyar céget megtéveszt","url":"https://mfor.hu/cikkek/vallalatok/vendegmunkas-vagy-kulfoldi-munkavallalo--a-fogalmi-kulonbseg-amely-sok-magyar-ceget-megteveszt.html","forras":"MFOR.hu","datum":"2026-10-20","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A júniusi szigorítások ellenére nem szűnt meg a harmadik országbeli munkavállalók foglalkoztatásának lehetősége Magyarországon. Új vendégmunkás-tartózkodási engedély nem kérhető, de a foglalkoztatási célú tartózkodási engedély továbbra is elérhető, és ebben a konstrukcióban a külföldi dolgozó közvetlenül a magyar munkáltató állományába kerülhet. Az engedély legfeljebb két évre adható, további egy évvel meghosszabbítható, és a Fülöp-szigetek állampolgárai is jogosultak lehetnek rá. Az Overseas Labour szerint a cégeknek azt kell megvizsgálniuk, milyen jogcímen és milyen feltételekkel alkalmazhatnak harmadik országbeli dolgozókat.","kulcsszavak":["vendégmunka","munkajog"],"het":"2026-10-19","url_forras":"docx","id":"ART-0627","kivonat":"A júniusi szigorítások ellenére nem szűnt meg a harmadik országbeli munkavállalók foglalkoztatásának lehetősége. Új vendégmunkás-tartózkodási engedély nem kérhető, de a foglalkoztatási célú tartózkodási engedély bizonyos feltételekkel továbbra is elérhető, és ebben a konstrukcióban a külföldi dolgozó közvetlenül a magyar munkáltató saját állományába kerülhet. Az engedély legfeljebb két évre adható, majd további egy évvel meghosszabbítható, és a Fülöp-szigetek állampolgárai is jogosultak lehetnek rá. Az Overseas Labour azt hangsúlyozza, hogy a cégeknek nem általában a külföldi munkaerő lehetőségét kell kizárniuk, hanem azt kell megvizsgálniuk, milyen jogcímen és milyen feltételekkel alkalmazhatnak harmadik országbeli dolgozókat."},{"cim":"Aranyat érő szakik, kiszoruló magyar vezetők – a hazai munkaerőpiac új törésvonalai","url":"https://www.hrportal.hu/hr/aranyat-ero-szakik-kiszorulo-magyar-vezetok-a-hazai-munkaeropiac-uj-toresvonalai-20261019.html","forras":"HR Portál","datum":"2026-10-19","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Varga Csaba, a Job Impulse cégvezetője szerint a hazai munkaerőpiac egyszerre küzd vezetői túlkínálattal és súlyos szakmunkáshiánnyal. A mesterséges intelligencia a szellemi toborzást gyorsabbá tette, ugyanakkor tökéletesre csiszolt önéletrajzokkal árasztotta el a cégeket, ezért a valódi szakmai és emberi érték kiszűrése a fő kihívás. A német ipari vállalatok leépítései miatt sok tapasztalt magyar vezető kerül piacra, az ázsiai gigaberuházások közép- és felsővezetői pozícióiban viszont a cégek saját expat szakembereiket alkalmazzák. A demográfiai folyamatok és a szakképzés korábbi háttérbe szorulása miatt egy jó CNC-s, karbantartó vagy autószerelő sok diplomásnál is magasabb bért érhet el.","kulcsszavak":["munkaerőhiány","leépítés","AI","demográfia"],"het":"2026-10-19","url_forras":"docx","id":"ART-0628","kivonat":"Varga Csaba, a Job Impulse cégvezetője szerint a hazai munkaerőpiac egyszerre küzd vezetői túlkínálattal és súlyos szakmunkáshiánnyal. Az AI jelentősen felgyorsította a szellemi toborzást, de közben elárasztotta a cégeket tökéletesre csiszolt önéletrajzokkal, ezért a valódi szakmai és emberi érték kiszűrése a fő kihívás. A német ipari vállalatok leépítései miatt sok tapasztalt magyar vezető kerül piacra, az új ázsiai gigaberuházások közép- és felsővezetői pozícióiban viszont saját expat szakembereiket alkalmazzák. A demográfiai folyamatok és a szakképzés korábbi háttérbe szorulása miatt egyre nagyobb a hiány szakmunkásokból, ezért egy jó CNC-s, karbantartó, autószerelő vagy más hiányszakmás dolgozó sok diplomásnál is magasabb bért érhet el."},{"cim":"Valami nagyon nincs rendben a magyar munkaerőpiacon: a KSH friss számai aggasztó folyamatokról árulkodnak – 12 hónap munkát találni itthon","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/10/foglalkoztatas-ksh-munkaeropiac-allaskereso","forras":"Világgazdaság","datum":"2026-10-22","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH szeptemberi adatai szerint a magyar munkaerőpiac stabil maradt, de több mutató romló tendenciát jelez. A harmadik negyedévben átlagosan 4,669 millióan dolgoztak, miközben a hazai elsődleges munkaerőpiacon foglalkoztatottak száma egy év alatt 22 ezer fővel csökkent. A munkanélküliségi ráta 4,7 százalék volt, az álláskeresés átlagos időtartama pedig 11,6 hónapra nőtt, a munkanélküliek 32,5 százaléka pedig már több mint egy éve keres állást.","kulcsszavak":["munkanélküliség","kutatás és statisztika","foglalkoztatottság"],"het":"2026-10-19","url_forras":"docx","id":"ART-0629","kivonat":"A KSH szeptemberi adatai szerint a magyar munkaerőpiac továbbra is stabil, de több mutató romló tendenciát jelez. A harmadik negyedévben átlagosan 4,669 millióan dolgoztak, a hazai elsődleges munkaerőpiacon foglalkoztatottak száma azonban egy év alatt 22 ezer fővel csökkent. A munkanélküliségi ráta 4,7 százalék volt, az álláskeresés átlagos időtartama pedig 11,6 hónapra nőtt. Különösen kedvezőtlen, hogy a munkanélküliek 32,5 százaléka már több mint egy éve keres állást, miközben a rövid ideje állást keresők aránya csökkent."},{"cim":"A Tisza vagy a Fidesz miatt van munkanélküliség? Itt a meglepő válasz","url":"https://www.portfolio.hu/gazdasag/20261022/a-tisza-vagy-a-fidesz-miatt-van-munkanelkuliseg-itt-a-meglepo-valasz-871114","forras":"Portfolio","datum":"2026-10-20","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Portfolio elemzése szerint a 4,7 százalékos munkanélküliségi ráta emelkedését elsősorban az okozza, hogy egyre több inaktív ember jelenik meg a munkaerőpiacon és kezd állást keresni. A foglalkoztatottak száma eközben emelkedett, a foglalkoztatási ráta történelmi csúcs közelében jár, az aktivitási ráta pedig rekordmagasságba nőtt. A lap szerint a néhány tizedszázalékos ingadozásokat a szezonális hatások és a statisztikai hibahatár miatt nem érdemes túlértelmezni.","kulcsszavak":["munkanélküliség","foglalkoztatottság","kutatás és statisztika"],"het":"2026-10-19","id":"ART-0630","kivonat":"A Portfolio elemzése szerint a 4,7 százalékos munkanélküliségi ráta emelkedése nem elsősorban tömeges leépítések következménye, hanem annak, hogy egyre több inaktív ember jelenik meg a munkaerőpiacon és kezd állást keresni. A foglalkoztatottak száma emelkedett, a foglalkoztatási ráta pedig történelmi csúcs közelében jár, de az aktivitási ráta is rekordmagasságba nőtt. A lap szerint ezért a mostani munkanélküliségi növekedés mögött részben kedvező folyamat áll: bővül a dolgozni akarók köre, miközben az üres állások száma is ismét növekszik. Az elemzés arra is figyelmeztet, hogy a néhány tizedszázalékos ingadozásokat a szezonális hatások és a statisztikai hibahatár miatt sem érdemes túlértelmezni.","url_forras":"talalt"},{"cim":"Nem ott van a munkaerő, ahol a gyárak: illeszkedési válságban a hazai munkaerőpiac","url":"https://novekedes.hu/elemzesek/nem-ott-van-a-munkaero-ahol-a-gyarak-illeszkedesi-valsagban-a-hazai-munkaeropiac","forras":"Növekedés.hu","datum":"2026-10-22","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A magyar munkaerőpiacon a kereslet és a kínálat földrajzilag és szakmailag sem találkozik, miközben az álláskeresés átlagos időtartama közel egy év. A gyártó- és logisztikai cégek továbbra is nehezen találnak gépkezelőket, karbantartókat, hegesztőket és villanyszerelőket. Mihályi Magdolna, a Jobtain ügyvezetője szerint a távolság, az ingázás költsége, a műszakrend és a bérszintek közötti eltérés egyaránt akadályozza az elhelyezkedést. A cég kutatása szerint az álláskeresők 84 százaléka már a hirdetésben pontos fizetést vár el.","kulcsszavak":["munkaerőhiány","régiós különbségek","ipar"],"het":"2026-10-19","url_forras":"docx","id":"ART-0631","kivonat":"A magyar munkaerőpiac egyik fő problémája nem egyszerűen a munkaerőhiány vagy a munkanélküliség, hanem az, hogy a kereslet és a kínálat földrajzilag és szakmailag sem találkozik. Miközben az álláskeresés átlagos időtartama közel egy év, a gyártó- és logisztikai cégek továbbra is nehezen találnak gépkezelőket, karbantartókat, hegesztőket, villanyszerelőket és technikusokat. Mihályi Magdolna, a Jobtain ügyvezetője szerint a távolság, az ingázás költsége, a műszakrend és a bérszintek közötti eltérés egyaránt akadályozza az elhelyezkedést. A cég kutatása szerint az álláskeresők 84 százaléka már a hirdetésben pontos fizetést vár el, ezért a vállalatoknak gyorsabb, átláthatóbb toborzásra és versenyképesebb teljes ajánlatra van szükségük."},{"cim":"Hónapok óta hiába keresnek munkát a magyarok","url":"https://piacesprofit.hu/cikkek/gazdasag/honapok-ota-hiaba-keresnek-munkat-a-magyarok.html?oldal=1","forras":"Piac és Profit","datum":"2026-10-20","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Dénes Rajmund, a Humán Centrum Kft. ügyvezetője szerint a visszafogottabb munkaerő-kereslet miatt az álláskeresőknek is alkalmazkodniuk kell: a munkakeresés átlagos időtartama 11,7 hónap, minden harmadik munkanélküli pedig több mint egy éve próbál elhelyezkedni. A Humán Centrum a teljes munkaidős állások mellett a részmunkaidőt, a határozott idejű munkát, a munkaerő-kölcsönzést és a szövetkezeti foglalkoztatást is reális belépési lehetőségnek tartja. A szakember szerint a hosszabb munkanélküli időszak nem jelenti feltétlenül a szakmai kompetenciák elvesztését, és az 55 év felettiek tapasztalatát is jobban ki kellene használni.","kulcsszavak":["munkanélküliség","munkaerő-kölcsönzés","idősebb munkavállalók"],"het":"2026-10-19","url_forras":"docx","id":"ART-0632","kivonat":"Dénes Rajmund, a Humán Centrum Kft. ügyvezetője szerint a visszafogottabb munkaerő-kereslet miatt az álláskeresőknek is alkalmazkodniuk kell: a munkakeresés átlagos időtartama 11,7 hónap, és minden harmadik munkanélküli több mint egy éve próbál elhelyezkedni. A Humán Centrum ezért a teljes munkaidős állások mellett a részmunkaidőt, a határozott idejű munkát, a munkaerő-kölcsönzést és a szövetkezeti foglalkoztatást is reális belépési lehetőségnek tartja. Felértékelődik a többcsatornás álláskeresés, a szakmai kapcsolatok használata és az önéletrajz pozícióra szabása, amelyben az AI is segíthet. A munkaadókat arra figyelmezteti a szakember, hogy a hosszabb munkanélküli időszak nem jelenti feltétlenül a szakmai kompetenciák elvesztését, és az 55 év felettiek tapasztalatát is jobban ki kellene használni."},{"cim":"Se munka, se munkás Magyarországon: valami letarolta Baranyát, Somogyot és Budapestet, mire elmúlt a nyár","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/10/munkaero-negyedev-kereslet-hirdetes","forras":"Világgazdaság","datum":"2026-10-21","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Profession.hu harmadik negyedéves adatai szerint országosan stagnált a munkaerő-kereslet, de a térségek és ágazatok között jelentős különbségek alakultak ki. Baranyában 14, Somogyban 11, Budapesten 5 százalékkal csökkent a meghirdetett állások száma, miközben Bács-Kiskunban 18, Nógrádban és Fejérben 15-15 százalékos növekedés volt. A vendéglátásban másfélszeresére nőtt az álláskínálat, a jelentkezések viszont 23 százalékkal visszaestek, az IT-ban és a mezőgazdaságban pedig 17 százalékkal csökkent a pozíciók száma. Tüzes Imre, a Profession.hu kereskedelmi igazgatója szerint a visszafogott kereslet nem teszi automatikusan könnyebbé a toborzást, mert a munkavállalói aktivitás szinte mindenhol csökken.","kulcsszavak":["régiós különbségek","toborzás","turizmus"],"het":"2026-10-19","url_forras":"docx","id":"ART-0633","kivonat":"A Profession.hu harmadik negyedéves adatai szerint országosan lényegében stagnált a munkaerő-kereslet, de az egyes térségek és ágazatok között jelentős különbségek alakultak ki. Baranyában 14, Somogyban 11, Budapesten 5 százalékkal csökkent a meghirdetett állások száma, miközben Bács-Kiskunban 18, Nógrádban és Fejérben 15-15 százalékos növekedés volt. A vendéglátásban másfélszeresére nőtt az álláskínálat, miközben a jelentkezések 23 százalékkal visszaestek, az IT-ban és a mezőgazdaságban viszont 17 százalékkal csökkent a pozíciók száma. Tüzes Imre, a Profession.hu kereskedelmi igazgatója szerint a visszafogott kereslet nem feltétlenül teszi könnyebbé a toborzást, mert a munkavállalói aktivitás szinte mindenhol csökken."},{"cim":"Ők kapnak fizetésemelést 2027-től a magyar államtól, nem fog mindenki örülni – a 2027-es költségvetésből derültek ki a kiválasztott szakmák","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/10/beremeles-kozszfera-koltsegvetes-2027-tisza-kormany","forras":"Világgazdaság","datum":"2026-10-19","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A 2027-es költségvetésben legalább 603 ezer állami alkalmazott béremelésére összesen 677 milliárd forintot irányoz elő a kormány. A legnagyobb emeléseket az egészségügyi szakdolgozók, a szociális és gyermekvédelmi ágazat munkavállalói, valamint a nevelést-oktatást segítő dolgozók kapják, a rendvédelmi szerveknél pedig átlagosan 15 százalékos béremelést terveznek. Az állami felsőoktatás bérrendezésére 10 milliárd forint jut, de az emelés pontos mértéke egyelőre nem ismert. Több ágazatban a bejelentett emelések elmaradnak a Tisza kampányígéreteitől, ami a rendvédelmi dolgozók körében váltott ki elégedetlenséget.","kulcsszavak":["bérek","politika"],"het":"2026-10-19","url_forras":"docx","id":"ART-0634","kivonat":"A 2027-es költségvetésben legalább 603 ezer állami alkalmazott béremelésére összesen 677 milliárd forintot irányoz elő a kormány. A legnagyobb emelések az egészségügyi szakdolgozókat, a szociális és gyermekvédelmi ágazat munkavállalóit, valamint a nevelést-oktatást segítő dolgozókat érintik, miközben a rendvédelmi szerveknél átlagosan 15 százalékos béremelést terveznek. Az állami felsőoktatás bérrendezésére 10 milliárd forint jut, de az emelés pontos mértéke még nem ismert. Több ágazatban a most bejelentett emelések elmaradnak a Tisza kampányígéreteitől, ami főleg a rendvédelmi dolgozók körében váltott ki elégedetlenséget."},{"cim":"Borulhat a minimálbér-megállapodás: 2027-ben 14 helyett 4-6 százalékos emelésre számítanak az elemzők","url":"https://www.penzcentrum.hu/karrier/20261021/borulhat-a-minimalber-megallapodas-2027-ben-14-helyett-4-6-szazalekos-emelesre-szamitanak-az-elemzok-1207469","forras":"Pénzcentrum","datum":"2026-10-21","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Pénzcentrumnak nyilatkozó elemzők szerint a 2027-re korábban rögzített 14 százalékos minimálbér-emelés a jelenlegi gazdasági helyzetben már nem reális, inkább 4–6 százalék körüli növekedés várható. Virovácz Péter, az ING vezető elemzője 5 százalékos emeléssel számol, Németh Dávid, a K&H vezető elemzője 4–5 százalékot tart valószínűnek, a GKI szerint pedig a minimálbérnél akár az inflációt meghaladó emelés sem indokolt. A visszafogottabb bruttó növekedést részben ellensúlyozhatja a minimálbér adóterhének csökkentése, ami növelheti a nettó kereseteket. Az elemzők szerint a bérek csak akkor emelkedhetnek tartósan gyorsabban, ha azt a termelékenység és a gazdasági teljesítmény is alátámasztja.","kulcsszavak":["bérek","adózás","gazdasági kilátások"],"het":"2026-10-19","url_forras":"docx","id":"ART-0635","kivonat":"A Pénzcentrumnak nyilatkozó elemzők szerint a 2027-re korábban rögzített 14 százalékos minimálbér-emelés a jelenlegi gazdasági helyzetben már nem reális, inkább 4–6 százalék körüli növekedés várható. Virovácz Péter, az ING vezető elemzője 5 százalékos emeléssel számol, Németh Dávid, a K&H vezető elemzője 4–5 százalékot tart valószínűnek, míg a GKI szerint a minimálbérnél akár az inflációt meghaladó emelés sem indokolt. A visszafogottabb bruttó növekedést részben ellensúlyozhatja a minimálbér adóterhének csökkentése, ami érdemben növelheti a nettó kereseteket. Az elemzők arra figyelmeztetnek, hogy a bérek csak akkor emelkedhetnek tartósan gyorsabban, ha azt a termelékenység és a gazdasági teljesítmény is alátámasztja."},{"cim":"Havi közel egymillió forint ütheti a markukat: így alakul a rendszergazda fizetés Magyarországon 2026-ban","url":"https://www.penzcentrum.hu/karrier/20261022/havi-kozel-egymillio-forint-utheti-a-markukat-igy-alakul-a-rendszergazda-fizetes-magyarorszagon-2026-ban-1207278","forras":"Pénzcentrum","datum":"2026-10-22","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH adatai alapján 2025-ben havi bruttó 938 ezer forint körül alakult a rendszergazdák átlagkeresete Magyarországon. A 40–49 évesek átlagosan már több mint bruttó egymillió forintot kerestek, míg a 30 év alattiaknál 711 ezer forint volt az átlag. A szakmához az informatikai tudás mellett angolnyelv-ismeret, problémamegoldó és kommunikációs készség, valamint folyamatos önképzés szükséges, a belépéshez pedig néhány hónapos tanfolyamok is elegendőek lehetnek. Az automatizáció és az AI átvesz egyes rutinfeladatokat, miközben felértékelődhetnek a felhőtechnológiai, DevOps- és kiberbiztonsági ismeretek.","kulcsszavak":["bérek","IT","AI","automatizáció"],"het":"2026-10-19","url_forras":"docx","id":"ART-0636","kivonat":"A rendszergazdák továbbra is a jobban fizetett szakmák közé tartoznak: a KSH adatai alapján 2025-ben havi bruttó 938 ezer forint körül alakult az átlagkeresetük. A 40–49 évesek átlagosan már több mint bruttó egymillió forintot kerestek, míg a 30 év alattiaknál 711 ezer forint volt az átlag. A szakmához az informatikai tudás mellett angol nyelvismeret, problémamegoldó és kommunikációs készség, valamint folyamatos önképzés szükséges, belépési lehetőséget pedig akár néhány hónapos tanfolyamok is kínálnak. Az automatizáció és az AI ugyan átvesz egyes rutinfeladatokat, de a cikk szerint ezzel párhuzamosan felértékelődhetnek a komplexebb üzemeltetési feladatok, valamint a felhőtechnológiai, DevOps- és kiberbiztonsági ismeretek."},{"cim":"Leépítések kezdődtek az iváncsai akkumulátorgyárban","url":"https://www.portfolio.hu/gazdasag/20261022/leepitesek-kezdodtek-az-ivancsai-akkumulatorgyarban-871558","forras":"Portfolio","datum":"2026-10-22","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Leépítések kezdődtek az iváncsai SK On akkumulátorgyárban, ahol október 21-én több magyar munkavállalónak is felmondtak. A helyi szakszervezet hivatalos tájékoztatást követel a létszámcsökkentés mértékéről és okairól, és választ vár a közelmúltban kiszabott munkavédelmi bírságok hátterére is. A LIGA – Ifjúsági Munkás Érdekvédelmi Szervezet azonnali egyeztetést kezdeményezett a cégvezetéssel, a HR-rel és a munkavédelmi vezetőkkel, de eddig nem sikerült megbeszélést összehozni.","kulcsszavak":["leépítés","szakszervezet","autóipar"],"het":"2026-10-19","url_forras":"docx","id":"ART-0637","kivonat":"Váratlan leépítések kezdődtek az iváncsai SK On akkumulátorgyárban, ahol október 21-én több magyar munkavállalónak is felmondtak. A helyi szakszervezet attól tart, hogy az elbocsátások folytatódnak, ezért hivatalos tájékoztatást követel a létszámcsökkentés mértékéről és okairól. Az érdekképviselet egyben választ vár a közelmúltban kiszabott jelentős munkavédelmi bírságok hátterére és az ezek nyomán bevezetett intézkedésekre is. A LIGA – Ifjúsági Munkás Érdekvédelmi Szervezet azonnali egyeztetést kezdeményezett a cégvezetéssel, a HR-rel és a munkavédelmi vezetőkkel, de eddig nem sikerült megbeszélést összehozni."},{"cim":"Olyan szakképzés kell, amely a gyerekeknek és az olyan nagy cégeknek is jó, mint a BYD","url":"https://telex.hu/g7/podcast/2026/10/17/szegedi-szakkepzesi-centrum-foigazgato-dirik-podcast-kompetencia-byd","forras":"G7","datum":"2026-10-17","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Erdélyi Margit, a Szegedi Szakképzési Centrum főigazgatója a G7 podcastjában arról beszélt, hogy a szakképzésnek egyszerre kell a diákok érdekeit és a munkaerőpiac igényeit szolgálnia. Szerinte a rendszer egyik legfontosabb feladata a gyengébb alapkészségekkel érkező tanulók kompetenciafejlesztése, miközben a technikumi képzések már közvetlen utat nyithatnak a felsőoktatás felé. Szegeden a BYD-beruházás érezhetően alakítja a képzési kínálatot: bővültek az iparigép-kezelői kapacitások, és nőtt az érdeklődés a felnőttképzések iránt is.","kulcsszavak":["képzés","beruházás","autóipar"],"het":"2026-10-12","url_forras":"docx","id":"ART-0638","kivonat":"A G7 podcastjában Erdélyi Margit, a Szegedi Szakképzési Centrum főigazgatója arról beszélt, hogy a szakképzésnek egyszerre kell a diákok érdekeit és a munkaerőpiac igényeit szolgálnia. Szerinte a rendszer egyik legfontosabb feladata a gyengébb alapkészségekkel érkező tanulók kompetenciafejlesztése, miközben a technikumi képzések ma már közvetlen utat is nyithatnak a felsőoktatás felé. Szegeden a BYD-beruházás már érezhetően alakítja a képzési kínálatot: bővültek az iparigép-kezelői és kapcsolódó szakmai kapacitások, és nőtt az érdeklődés a felnőttképzések iránt is. Erdélyi szerint ugyanakkor kulcsfontosságú a pályaorientáció, mert nem minden diáknak a szakképzés a megfelelő út."},{"cim":"Tudatos építkezés és egyablakos rendszer tette Európa technológiai erőművévé Debrecent – véli az EDC ügyvezetője","url":"https://dehir.hu/debrecen/tudatos-epitkezes-es-egyablakos-rendszer-tette-europa-technologiai-eromuveve-debrecent/2026/10/20/","forras":"Dehir","datum":"2026-10-21","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Tanács Zoltán tudományos és technológiai miniszter debreceni látogatásán elismerően szólt a BMW-gyárról és a Debreceni Egyetem vállalati képzési programjairól. Pécskay Zoltán, az EDC Debrecen ügyvezetője szerint a város sikere több mint egy évtizedes gazdaságfejlesztés eredménye, amely az oktatási háttérre, az infrastruktúra előzetes kiépítésére és a munkahelyteremtésre épül. Az EDC egyablakos rendszerként közvetlen kapcsolatot biztosít a befektetőknek, és összeköti a városvezetést, az egyetemet és a vállalatokat, hogy a cégek szakemberigényeit eljuttassák az oktatási intézményekhez.","kulcsszavak":["beruházás","képzés","autóipar"],"het":"2026-10-19","url_forras":"docx","id":"ART-0639","kivonat":"Tanács Zoltán tudományos és technológiai miniszter debreceni látogatásán elismerően szólt a BMW-gyárról és a Debreceni Egyetem vállalati képzési programjairól. Pécskay Zoltán, az EDC Debrecen ügyvezetője ennek kapcsán azt hangsúlyozta, hogy a város sikere több mint egy évtizedes, tudatos gazdaságfejlesztés eredménye, amely az oktatási háttérre, az infrastruktúra előzetes kiépítésére és a munkahelyteremtésre épül. Az EDC egyablakos rendszerként közvetlen kapcsolatot biztosít a befektetőknek, és összeköti a városvezetést, az egyetemet és a vállalatokat. A cégek jövőbeli szakemberigényeit így az oktatási intézményekhez is eljuttatják, amelyek gyorsabban tudják a képzéseiket a piaci elvárásokhoz igazítani."},{"cim":"Még egy hétig kedvezményesen juthat belépőhöz a TECHTOGETHER+-ra!","url":"https://autopro.hu/techtogether/meg-egy-hetig-kedvezmenyesen-juthat-belepohoz-a-techtogether-ra/1702480","forras":"Autopro","datum":"2026-10-22","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A november 12-i TECHTOGETHER+ konferencián a magyar jármű- és gyártóipar szereplői vitatják meg az ágazat jövőjét, az automatizáció, a robotika és a mesterséges intelligencia gyakorlati alkalmazását. Az Audi, a BMW, a BYD, a CATL és a Stellantis képviselői vesznek részt közös kerekasztalon, a technológiai programban pedig többek között a Siemens, a Denso és a Universal Robots szakemberei szólalnak meg. Nógrádi József, a Trenkwalder Magyarország stratégiai igazgatója a technológiai átalakulás munkaerőpiaci hatásairól és a hazai alkalmazkodás lehetőségeiről beszél.","kulcsszavak":["Trenkwalder","autóipar","automatizáció"],"het":"2026-10-19","url_forras":"docx","id":"ART-0640","kivonat":"A november 12-i TECHTOGETHER+ konferencián a magyar jármű- és gyártóipar meghatározó szereplői vitatják meg az ágazat jövőjét, az automatizáció, a robotika és a mesterséges intelligencia gyakorlati alkalmazását. Az Audi, a BMW, a BYD, a CATL és a Stellantis képviselői közös kerekasztalon vesznek részt, míg a technológiai programban többek között a Siemens, a Denso és a Universal Robots szakemberei is megszólalnak. Nógrádi József, a Trenkwalder Magyarország stratégiai igazgatója a technológiai átalakulás munkaerőpiaci hatásairól és a hazai alkalmazkodás lehetőségeiről beszél."},{"cim":"Akár kétszeres bérkülönbség is lehet ugyanannál a munkakörnél - Honnan jön a több százezer forintos különbség?","url":"https://www.portfolio.hu/uzlet/20261022/akar-ketszeres-berkulonbseg-is-lehet-ugyanannal-a-munkakornel-honnan-jon-a-tobb-szazezer-forintos-kulonbseg-871452","forras":"Portfolio","datum":"2026-10-22","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A Work Force 216 munkakörre kiterjedő bérelemzése szerint a vizsgált pozíciók felében már eléri vagy meghaladja az egymillió forintot a havi bruttó alapfizetés mediánja. Ugyanazon munkakörön belül is jelentős lehet a szórás: 64 pozícióban legalább 50 százalék a különbség az alsó és felső bérkvartilis között, 11 munkakörben pedig meghaladja az egymillió forintot. Az informatikai, szakértői és vezetői pozícióknál különösen nagyok az eltérések: az AI/ML mérnökök mediánbére 1,47 millió, a szoftvermérnököké 1,15 millió forint. Az elemzés szerint a bértranszparencia a fizetési sávok közzététele mellett azt is megköveteli, hogy a cégek szakmailag indokolni tudják az azonos munkakörön belüli bérkülönbségeket.","kulcsszavak":["Work Force","bértranszparencia","IT","bérek"],"het":"2026-10-19","url_forras":"docx","id":"ART-0641","kivonat":"A Work Force 216 munkakörre kiterjedő bérelemzése szerint a vizsgált pozíciók felében már eléri vagy meghaladja az egymillió forintot a havi bruttó alapfizetés mediánja. Ugyanazon munkakörön belül is jelentős lehet a szórás: 64 pozícióban legalább 50% a különbség az alsó és felső bérkvartilis között, 11 munkakörben pedig ez meghaladja az egymillió forintot. Különösen nagy eltérések látszanak az informatikai, szakértői és vezetői pozícióknál: az AI/ML mérnökök mediánbére 1,47 millió, a szoftvermérnököké 1,15 millió forint. Az elemzés szerint a bértranszparencia ezért nem pusztán a fizetési sávok közzétételét jelenti, hanem azt is, hogy a cégeknek szakmailag meg kell tudniuk indokolni az azonos munkakörön belüli jelentős bérkülönbségeket."},{"cim":"Töretlenül bővül a BMW és a Lidl: friss létszámadatok","url":"https://www.hrportal.hu/hr/toretlenul-bovul-a-bmw-es-a-lidl-friss-letszamadatok-20261023.html","forras":"HR Portál","datum":"2026-10-23","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HR Portal és az Opten augusztusi adatai szerint a debreceni BMW 283 fővel 5311-re, a Lidl 156 fővel 10 442-re növelte létszámát egy hónap alatt. A munkaerő-kölcsönzőknél is bővülés látszik: a Prohuman 179, a WHC 178, a HSA 155, a Pannon-Work 118 fővel nőtt júliusról augusztusra, a WHC pedig egy év alatt 34 százalékkal, 5547-ről 7448 főre emelkedett. A nagyobb visszaesések között a Tesco 296, a Danubius Hotels 135, az MH Magyarország 106, a B+N Magyarország 107 fős csökkenést mutatott.","kulcsszavak":["munkaerő-kölcsönzés","foglalkoztatottság","kutatás és statisztika"],"het":"2026-10-19","url_forras":"docx","id":"ART-0642","kivonat":"A HR Portal és az Opten augusztusi létszámadatai szerint a versenyszférában tovább bővült több nagy foglalkoztató állománya: a debreceni BMW egyetlen hónap alatt 283 fővel, 5311-re, a Lidl pedig 156 fővel, 10 442-re növelte létszámát. A munkaerő-kölcsönzőknél is erősödés látszik: a Prohuman 179, a WHC 178, a HSA 155, a Pannon-Work 118 fővel bővült júliusról augusztusra. A WHC egy év alatt 34 százalékkal, 5547-ről 7448 főre növelte állományát. A nagyobb visszaesések között a Tesco 296, a Danubius Hotels 135, az Auchant működtető MH Magyarország 106, a B+N Magyarország pedig 107 fős csökkenést mutatott."},{"cim":"Hogyan tudna Magyarország felülni az AI-hullámra? Megszólal a robbanásszerű növekedést elért magyar cég vezére","url":"https://www.portfolio.hu/uzlet/20261030/hogyan-tudna-magyarorszag-felulni-az-ai-hullamra-megszolal-a-robbanasszeru-novekedest-elert-magyar-ceg-vezere-869554","forras":"Portfolio","datum":"2026-10-30","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Foxconn komáromi gyárában mintegy 2700-an dolgoznak, és a vállalat az AI-hardverek iránti kereslet miatt további bővülésre számít. Tálos Péter, a Foxconn Csoport alelnöke szerint a hazai munkaerő-kínálat elakadt, ezért idén hosszú idő után először külföldi munkavállalókat is alkalmaztak. Szerinte a vendégmunkások foglalkoztatásának további szigorítása új helyzetet teremtene, mert a növekedést már nem lehet kizárólag magyar munkaerőből fedezni.","kulcsszavak":["vendégmunka","munkaerőhiány","AI"],"het":"2026-10-26","url_forras":"docx","id":"ART-0643","kivonat":"A Foxconn komáromi gyárában mintegy 2700-an dolgoznak, és az AI-hardverek iránti erős kereslet miatt további bővüléssel számolnak. Tálos Péter, a Foxconn Csoport alelnöke szerint a hazai munkaerő-kínálat mára elakadt, ezért idén hosszú idő után először külföldi munkavállalókat is alkalmaztak. Úgy fogalmazott: ha a vendégmunkások foglalkoztatását tovább szigorítják, az új helyzetet teremt, mert a növekedést már nem lehet kizárólag magyar munkaerőből fedezni."},{"cim":"Éjjel csendben beadták a módosítót: majdnem egymillió vállalkozás szabadulhat meg ettől a tehertől – Ruff Bálint szerint nem kaptak a pénzükért cserébe semmit","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/10/kotelezo-kamarai-hozzajarulas-tisza-kormany-vallalkozas","forras":"Világgazdaság","datum":"2026-10-28","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A kormány 2027-től megszüntetné a kötelező kamarai hozzájárulást, amit a vállalkozások pénzügyi és adminisztratív terheinek csökkentésével indokol. Egy hivatkozott kkv-felmérés szerint a vállalkozások legfontosabb elvárásai között a kevesebb adminisztráció, az egyszerűbb szabályok és a kiszámíthatóbb működési környezet szerepelnek. A vendégmunkások foglalkoztatása ezzel szemben nem került a legfontosabb vállalkozói problémák közé.","kulcsszavak":["politika","adózás","vendégmunka"],"het":"2026-10-26","url_forras":"docx","id":"ART-0644","kivonat":"A kormány 2027-től megszüntetné a kötelező kamarai hozzájárulást, amit a vállalkozások pénzügyi és adminisztratív terheinek csökkentésével indokol. A cikk felidéz egy kkv-felmérést is, amely szerint a vállalkozások legfontosabb elvárásai között a kevesebb adminisztráció, az egyszerűbb szabályok és a kiszámíthatóbb működési környezet szerepelnek. A vendégmunkások kérdése ezzel szemben egyáltalán nem került a legfontosabb vállalkozói problémák közé."},{"cim":"Megváltozott munkaképességűek számára szervezett állásbörzét a váci Piarista Kilátó Központ","url":"https://www.magyarkurir.hu/hirek/megvaltozott-munkakepesseguek-szamara-szervezett-allasborzet-vaci-piarista-kilato-kozpont","forras":"Magyar Kurír","datum":"2026-10-24","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A váci Piarista Kilátó Központ harmadik alkalommal rendezett állásbörzét megváltozott munkaképességű és fokozott személyes támogatást igénylő álláskeresők számára. A rendezvényre közel 200 résztvevőt vártak, akik 22 kiállító (köztük vendéglátóipari, élelmiszeripari és logisztikai cégek, munkaerő-közvetítők, valamint civil és szociális szervezetek) ajánlataival ismerkedhettek meg. A kínálat a raktári és konyhai munkáktól a kereskedelmi, irodai és ügyfélszolgálati pozíciókig terjedt.","kulcsszavak":["esélyegyenlőség","munkaerő-tartalék","toborzás"],"het":"2026-10-19","url_forras":"docx","id":"ART-0645","kivonat":"A váci Piarista Kilátó Központ harmadik alkalommal rendezett állásbörzét megváltozott munkaképességű és fokozott személyes támogatást igénylő álláskeresők számára. A rendezvényre közel 200 résztvevőt vártak, akik 22 kiállító – köztük vendéglátóipari, élelmiszeripari és logisztikai cégek, munkaerő-közvetítők, valamint civil és szociális szervezetek – állásajánlataival ismerkedhettek meg. A kínálat a raktári és konyhai munkáktól a kereskedelmi, irodai és ügyfélszolgálati pozíciókig terjedt."},{"cim":"A tollvonás, ami működött: hogyan lett félmillióval több dolgozó Magyarországon?","url":"https://hold.hu/holdblog/balasy-dolgozo-munkavallalo-hvg/","forras":"Holdblog","datum":"2026-10-22","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Balásy Zsolt, a HOLD Alapkezelő portfóliómenedzsere a Kapitalizmus Balásyval című hírlevelében arról írt, hogy 2010 óta nagyságrendileg félmillióval többen dolgoznak Magyarországon, amivel az ország a régiós sereghajtók közül a legmagasabb foglalkoztatási arányú országok közé került. Szerinte ebben fontos szerepet játszott a 2010 előtti segélyezési rendszer átalakítása, mivel az alanyi jogú és hosszú ideig járó juttatások egyes háztartások számára racionálisabbá tehették az inaktivitást az alacsony bérű munkánál. Balásy szerint a valóban rászorulók támogatását fenn kell tartani, de úgy, hogy az ne gyengítse a munkavállalás ösztönzőit azoknál, akik képesek dolgozni.","kulcsszavak":["foglalkoztatottság","munkaerő-tartalék","politika"],"het":"2026-10-19","url_forras":"docx","id":"ART-0646","kivonat":"Amagyar foglalkoztatás egyik legnagyobb sikere, hogy 2010 óta nagyságrendileg félmillióval többen dolgoznak, és Magyarország a régiós sereghajtók közül a legmagasabb foglalkoztatási arányú országok közé került – mutatá rá Kapitalizmus Balásyval című hírlevelében Balásy Zsolt, a HOLD Alapkezelő portfóliómenedzsere. Szerinte a magyar felzárkózásban fontos szerepet játszott a 2010 előtti, munkavállalást kevésbé ösztönző segélyezési rendszer átalakítása: korábban az alanyi jogú és hosszú ideig járó juttatások egyes háztartások számára racionálisabbá tehették az inaktivitást az alacsony bérű munkánál. A valóban rászorulók támogatását fenn kell tartani, de úgy, hogy az ne gyengítse a munkavállalás ösztönzőit azoknál, akik képesek dolgozni."},{"cim":"Bemutatta a kormány, hogy pörgetné be 2030-ig a magyar gazdaságot","url":"https://telex.hu/gazdasag/2026/10/28/penzugyminiszterium-gazdasag-koltsegvetesi-program-terv-kormany-novekedes","forras":"Telex","datum":"2026-10-28","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Pénzügyminisztérium 2027–2030-as gazdaságpolitikai programja a munkaerő- és tőkebevonásra épülő növekedési modell helyett termelékenység-központú pályára állítaná a magyar gazdaságot, és 2027-re 5 százalék alá csökkentené a költségvetési hiányt. A program abból indul ki, hogy a könnyen mozgósítható munkaerő-tartalék nagyrészt elfogyott, a beruházások visszaestek, és Magyarország termelékenységnövekedése elmaradt a régiós versenytársakétól. A kormány ezért az állami működési kiadások és a vállalati támogatások visszafogását, erősebb piaci versenyt, több uniós forrású beruházást és az export bővülését várja a növekedés fő motorjaitól.","kulcsszavak":["gazdasági kilátások","politika","munkaerő-tartalék"],"het":"2026-10-26","url_forras":"docx","id":"ART-0647","kivonat":"A kormány 2027–2030 közötti gazdaságpolitikai programja a munkaerő- és tőkebevonásra épülő növekedési modell helyett termelékenység-központú pályára állítaná a magyar gazdaságot. A Pénzügyminisztérium szerint 2027-ben 5 százalék alá csökkentenék a költségvetési hiányt, 2030-ra pedig teljesítenék az eurózónához való csatlakozás feltételeit. A program abból indul ki, hogy a könnyen mozgósítható munkaerő-tartalék nagyrészt elfogyott, a beruházások visszaestek, Magyarország termelékenységnövekedése pedig jelentősen elmaradt a régiós versenytársakétól. A kormány ezért az állami működési kiadások és a nem hatékonynak ítélt vállalati támogatások visszafogását, erősebb piaci versenyt, több uniós forrásból finanszírozott beruházást és az export bővülését várja a következő évek növekedésének fő motorjaitól."},{"cim":"Aki egyszer pályát váltott, az már nem néz vissza","url":"https://mfor.hu/cikkek/vallalatok/aki-egyszer-palyat-valtott-az-mar-nem-nem-nez-vissza.html","forras":"Mfor.hu","datum":"2026-10-30","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Profession.hu reprezentatív felmérése szerint tízből nyolc magyar munkavállaló gondolkodott már pályaváltáson, és minden második ténylegesen váltott is. A pályamódosítók 83 százaléka másik ágazatban dolgozik, közel 70 százalékuk ma is meghozná ugyanezt a döntést, és csak 19 százalék tervezi, hogy visszatér eredeti szakmájához, miközben 54 százalékuk magasabb bér mellett eredeti pályáján maradt volna. Dencső Blanka, a Profession.hu szakértője szerint ez lehetőséget jelent a munkáltatóknak más ágazatokból érkező jelöltek átvihető készségeinek felismerésére, és minél tovább halogatja valaki a váltást, annál kisebb az esélye, hogy végül meglépi.","kulcsszavak":["Profession.hu","toborzás","skills-alapú HR"],"het":"2026-10-26","url_forras":"docx","id":"ART-0648","kivonat":"A Profession.hu reprezentatív felmérése szerint tízből nyolc magyar munkavállaló gondolkodott már pályaváltáson, minden második pedig ténylegesen váltott is. A pályamódosítók 83 százaléka másik ágazatban dolgozik, közel 70 százalékuk ma is meghozná ugyanezt a döntést, és csak 19 százalék tervezi, hogy visszatér eredeti szakmájához. A váltók leggyakrabban a fizetésük és a munka–magánélet egyensúlyának javulásáról számoltak be, miközben 54 százalékuk magasabb bér mellett eredeti pályáján maradt volna. Dencső Blanka, a Profession.hu szakértője szerint a munkáltatók számára ez lehetőséget jelent arra, hogy más ágazatokból érkező jelöltek átvihető készségeit is felismerjék, miközben a kutatás azt is mutatja, hogy minél tovább halogatja valaki a váltást, annál kisebb az esélye, hogy végül valóban meglépi."},{"cim":"Fordulat jön a magyar fizetéseknél: drasztikusan lelassulhat a béremelések üteme","url":"https://www.penzcentrum.hu/karrier/20261029/fordulat-jon-a-magyar-fizeteseknel-drasztikusan-lelassulhat-a-beremelesek-uteme-1208141","forras":"Pénzcentrum","datum":"2026-10-29","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A kormány gazdaságpolitikai programja alapján 2027-ben 5,6 százalékkal nőhet a bruttó átlagkereset, a nettó bérek pedig 6,3 százalékkal emelkedhetnek, ami lassulás az elmúlt évek 8–10 százalékos bérdinamikájához képest. A kabinet a következő négy évben is 5–6 százalékos nominális béremelkedéssel számol, amelyet a termelékenységhez és az alacsonyabb inflációhoz igazítana, mivel Magyarország 2030-ra teljesíteni szeretné az euró bevezetésének feltételeit. A GKI szerint a nemzetközi energiadrágulás miatt az infláció magasabb lehet a tervezettnél, ami mérsékelheti a reálbérek növekedését.","kulcsszavak":["bérek","gazdasági kilátások","politika"],"het":"2026-10-26","url_forras":"docx","id":"ART-0649","kivonat":"A Pénzcentrum szerint a kormány gazdaságpolitikai programja alapján 2027-ben 5,6 százalékkal nőhet a bruttó átlagkereset, a nettó bérek pedig 6,3 százalékkal emelkedhetnek, ami jelentős lassulás az elmúlt évek 8–10 százalékos bérdinamikájához képest. A kabinet a következő négy évben is nagyjából 5–6 százalékos nominális béremelkedéssel számol, amelyet a termelékenységhez és az alacsonyabb inflációhoz kíván igazítani. A program ezt részben azzal is indokolja, hogy Magyarország 2030-ra teljesíteni szeretné az euró bevezetésének feltételeit, ami tartósan alacsony inflációt követel. A GKI arra figyelmeztet, hogy a nemzetközi energiadrágulás miatt az infláció magasabb lehet a tervezettnél, ami a reálbérek növekedését is mérsékelheti."},{"cim":"Már akár százezer forinttal is többet kérnek a munkára jelentkezők, mint amennyit adnának nekik","url":"https://telex.hu/g7/vallalat/2026/10/27/munkaeropiac-szerkezet-munkaadok-munkakeresok-berek-igenyek","forras":"G7","datum":"2026-10-27","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Menton Jobs adatai alapján a G7 szerint a magyar munkaerőpiacon egyszerre vannak betöltetlen állások megfelelő jelentkezők nélkül és álláskeresők megfelelő pozíciók nélkül. A cég toborzási projektjeiben a jelentkezőknek mindössze 1–3 százalékát vették fel, miközben az operátori és betanított munkáknál nettó 40–50 ezer, a raktáros és targoncavezető pozícióknál 60–90 ezer, a szakmunkásoknál pedig akár 100–120 ezer forint a különbség a kínált és az elvárt fizetés között. A földrajzi és készségbeli eltérés tovább erősíti a problémát, miközben az aktivitási ráta és az üres állások száma is emelkedik.","kulcsszavak":["Menton Jobs","bérek","munkaerőhiány"],"het":"2026-10-26","url_forras":"docx","id":"ART-0650","kivonat":"A G7 a Menton Jobs adatai alapján azt írja, hogy a magyar munkaerőpiacon egyre inkább két párhuzamos piac működik: az egyik oldalon vannak betöltetlen állások megfelelő jelentkezők nélkül, a másikon álláskeresők megfelelő pozíciók nélkül. A cég toborzási projektjeiben a jelentkezők mindössze 1–3 százalékát vették fel, miközben az operátori és betanított munkáknál nettó 40–50 ezer, a raktáros és targoncavezető pozícióknál 60–90 ezer, a szakmunkásoknál pedig akár 100–120 ezer forint is lehet a különbség a kínált és az elvárt fizetés között. A problémát tovább erősíti a földrajzi és készségbeli mismatch, miközben az aktivitási ráta és az üres állások száma is emelkedik. A kép így nem egyszerű munkaerőhiányt vagy munkanélküliséget mutat, hanem egyre erősebb szerkezeti széttartást a kereslet és a kínálat között."},{"cim":"Hatalmas változás jöhet a magyar kórházakban és rendelőkben: 123 ezer egészségügyi dolgozót érinthet az új béremelés","url":"https://www.penzcentrum.hu/karrier/20261025/hatalmas-valtozas-johet-a-magyar-korhazakban-es-rendelokben-123-ezer-egeszsegugyi-dolgozot-erinthet-az-uj-beremeles-1207841","forras":"Pénzcentrum","datum":"2026-10-25","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A kormány 2027-től mintegy 123 ezer egészségügyi és egészségügyben dolgozó bérét emelné, amire évente 192 milliárd forintot fordítana. Hegedűs Zsolt egészségügyi miniszter szerint az átlagos béremelés 15 százalékos lehet, az adóváltozásokkal együtt pedig egyes dolgozóknál akár 17 százalékos nettó keresetnövekedést is eredményezhet. A bérrendezés az ápolók mellett a mentésben, alapellátásban, háttérfunkciókban, valamint egyes otthoni szakápolási, hospice- és dialízisellátási területeken dolgozókra is kiterjedhet, a minisztérium pedig hat besorolási csoportból és 15 gyakorlati fokozatból álló bértáblát készít.","kulcsszavak":["bérek","egészségügy","politika"],"het":"2026-10-19","url_forras":"docx","id":"ART-0651","kivonat":"A Pénzcentrum szerint 2027-től mintegy 123 ezer egészségügyi és egészségügyben dolgozó bére emelkedhet, amire a kormány évente 192 milliárd forintot fordítana. Hegedűs Zsolt egészségügyi miniszter szerint az átlagos béremelés 15 százalékos lehet, az adóváltozásokkal együtt pedig egyes dolgozóknál akár 17 százalékos nettó keresetnövekedést is eredményezhet. A bérrendezés az ápolók és más szakdolgozók mellett a mentésben, alapellátásban, háttérfunkciókban, valamint bizonyos otthoni szakápolási, hospice-, betegszállítási és dialízisellátási területeken dolgozókra is kiterjedhet. A minisztérium emellett új, hat besorolási csoportból és 15 gyakorlati fokozatból álló bértáblát készít, amelyben a szakmai tapasztalat és a magasabb képzettség rendszeres, jellemzően háromévenkénti bérelőrelépést jelentene."},{"cim":"Megáll az ész: havi majdnem 1 milliós fizetésért toboroznak raktárosokat, végzettség és nyelvtudás sem kell hozzá","url":"https://www.penzcentrum.hu/karrier/20261026/megall-az-esz-havi-majdnem-1-millios-fizetesert-toboroznak-raktarosokat-vegzettseg-es-nyelvtudas-sem-kell-hozza-1207575","forras":"Pénzcentrum","datum":"2026-10-26","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az ausztriai logisztikai állásokról szóló Pénzcentrum-cikk szerint csomagkézbesítőket, raktári dolgozókat és műszakvezetőket keresnek, több esetben német nyelvtudás nélkül. A kézbesítői munkáknál nettó 1900–2200 eurós, a raktári pozícióknál bruttó mintegy 1925 eurós, a műszakvezetői állásoknál pedig havi bruttó körülbelül 2700 eurós, azaz közel egymillió forintos keresetet kínálnak. Egyes munkáltatók szállást, fizetett betanítást, valamint 13. és 14. havi juttatást is biztosítanak.","kulcsszavak":["bérek","logisztika","toborzás"],"het":"2026-10-26","url_forras":"docx","id":"ART-0652","kivonat":"Az ausztriai logisztikai állásokról szóló Pénzcentrum-cikk szerint csomagkézbesítőket, raktári dolgozókat és műszakvezetőket is keresnek, több esetben német nyelvtudás nélkül. A kézbesítői munkáknál nettó 1900–2200 eurós keresetet kínálnak, a raktári pozícióknál bruttó mintegy 1925 eurót, míg a műszakvezetői állások havi bruttó bére körülbelül 2700 euró, azaz közel egymillió forint lehet. Egyes munkáltatók szállást, fizetett betanítást, 13. és 14. havi juttatást is biztosítanak. A cikk szerint Ausztria továbbra is fontos célország a magyar munkavállalók számára, különösen azokban a fizikai és szolgáltatási munkakörökben, ahol a magyarországinál jóval magasabb bér érhető el."},{"cim":"Havi másfél milliós fizetéssel keresnek magyarokat Finnországba: még nyelvtudás sem kell","url":"https://www.penzcentrum.hu/karrier/20261027/havi-masfel-millios-fizetessel-keresnek-magyarokat-finnorszagba-meg-nyelvtudas-sem-kell-1207925","forras":"Pénzcentrum","datum":"2026-10-27","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A finnországi állásajánlat villanyszerelői és adatközponti kábelezési munkákra keres dolgozókat Helsinki környékére, akár nettó 3000–4000 eurós, azaz nagyjából 1,1–1,5 millió forintos havi fizetéssel. A heti 50 órás munkarendhez hat hét munka után egy hét otthoni pihenő társul, a szállást, az utazást és a munkába járást a cég biztosítja. A jelentkezéshez angol nyelvtudás nem kötelező, és a cég olyan jelentkezőket is vár, akik még nem rendelkeznek villanyszerelői végzettséggel, de hajlandók képzésben részt venni. A Pénzcentrum összevetése szerint ez többszöröse a magyarországi villanyszerelők 2025-ös, mintegy 597 ezer forintos bruttó átlagbérének.","kulcsszavak":["bérek","toborzás","ipar"],"het":"2026-10-26","url_forras":"docx","id":"ART-0653","kivonat":"A finnországi állásajánlat villanyszerelői és adatközponti kábelezési munkákra keres dolgozókat Helsinki környékére, akár nettó 3000–4000 eurós, vagyis nagyjából 1,1–1,5 millió forintos havi fizetéssel. A heti 50 órás munkarendhez hat hét munka után egy hét otthoni pihenő társul, a szállást, az utazást és a munkába járást a cég biztosítja. A jelentkezéshez az angol nyelvtudás nem kötelező, és a cég olyan motivált jelentkezőket is vár, akik még nem rendelkeznek villanyszerelői végzettséggel, de hajlandók képzésben részt venni. A Pénzcentrum összevetése szerint ez többszöröse a magyarországi alkalmazott villanyszerelők 2025-ös, mintegy 597 ezer forintos bruttó átlagbérének."},{"cim":"Eladósodva és veszteségesen, már egy kajmán-szigeteki céggel a háttérben robog a csőd felé az állami milliárdokkal kitömött Nanushka","url":"https://hvg.hu/360/20261027_nanushka-kajman-szigetek-ceghalo-veszteseg-csod-milliardok-kozpenz","forras":"HVG","datum":"2026-10-29","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Nanushka munkavállalói létszáma 150 főről augusztusra 40-re, mostanra pedig 20 főre csökkent, miközben a cég súlyos pénzügyi válságba került. A dolgozók nagy részének augusztus elején mondtak fel a nehéz pénzügyi helyzetre hivatkozva, azóta pedig a végkielégítések és a megmaradt munkatársak béreinek kifizetése is akadozik. A leépítéshez üzletbezárások is társultak, a Nanushka valamennyi külföldi üzletét bezárta, és nyáron a budapesti bolt is megszűnt. Az irodából nemfizetés miatt kellett kiköltözniük.","kulcsszavak":["leépítés","bérek","kereskedelem"],"het":"2026-10-26","url_forras":"docx","id":"ART-0654","kivonat":"A HVG szerint súlyos pénzügyi válságba került a Nanushka, amelynek munkavállalói létszáma 150 főről augusztusra 40-re, mostanra pedig mindössze 20 főre csökkent. A dolgozók nagy részének augusztus elején mondtak fel a cég nehéz pénzügyi helyzetére hivatkozva, azóta pedig a végkielégítések és a megmaradt munkatársak béreinek kifizetése is akadozik. A cég vezetése elismerte a késedelmes kifizetéseket, és közölte, hogy rendezésük a folyamatban lévő finanszírozási tárgyalások eredményétől is függ. A leépítéshez üzlet- és irodabezárások is társultak: a Nanushka valamennyi saját külföldi üzletét bezárta, nyáron a budapesti bolt is megszűnt, az irodából pedig nemfizetés miatt kellett kiköltözniük."},{"cim":"Rekordberuházást jelentett be a Coca-Cola Magyarországon: Kapitány István is megszólalt – újabb országokat hódítanának meg Dunaharasztiból","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/10/coca-cola-magyarorszag-kapitany-istvan-dunaharaszti","forras":"Világgazdaság","datum":"2026-10-28","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Coca-Cola HBC Magyarország 35 milliárd forintos, több évre szóló beruházási programot indít dunaharaszti gyártóközpontjában, ami a vállalat eddigi legnagyobb hazai fejlesztése. A cég jelenleg több mint ezer embert foglalkoztat, mintegy 830 hazai beszállítóval dolgozik együtt, és 17 exportpiacra szállít Magyarországról. A beruházás új gyártósort, aszeptikus kapacitásbővítést, csomagolástechnológiai fejlesztéseket és egy 30 ezer raklapos magasraktárat foglal magában. Kapitány István gazdasági miniszter szerint a cél, hogy a magyar beszállítók technológiai és vezetési tudást is szerezzenek a multinacionális vállalatokkal való együttműködésből.","kulcsszavak":["beruházás","ipar","foglalkoztatottság"],"het":"2026-10-26","url_forras":"docx","id":"ART-0655","kivonat":"A Coca-Cola HBC Magyarország 35 milliárd forintos, több évre szóló beruházási programot indít dunaharaszti gyártóközpontjában, ami a vállalat eddigi legnagyobb magyarországi fejlesztése. A cég jelenleg több mint ezer embert foglalkoztat, mintegy 830 hazai beszállítóval dolgozik együtt, és 17 exportpiacra szállít Magyarországról. A beruházás új gyártósort, aszeptikus kapacitásbővítést, csomagolástechnológiai fejlesztéseket és egy 30 ezer raklapos magasraktárat is tartalmaz. Kapitány István gazdasági miniszter szerint a cél az, hogy a magyar beszállítók a multinacionális vállalatokkal való együttműködésből technológiai és vezetési tudást is szerezzenek, és idővel önállóan is erősödjenek a nemzetközi piacokon."},{"cim":"Mitől lehet Magyarország nyertese az AI-korszaknak?","url":"https://www.portfolio.hu/gazdasag/20261027/mitol-lehet-magyarorszag-nyertese-az-ai-korszaknak-870240","forras":"Portfolio","datum":"2026-10-27","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Kadocsa Fanni, a Hybridge Consulting szakértője szerint Magyarországnak elsősorban azt kell elérnie, hogy az AI által létrehozott gazdasági értékből minél több maradjon itthon, és a gazdaság a magasabb hozzáadott értékű tevékenységek felé mozduljon. Kiemelt feladatnak tartja a hazai technológiai vállalkozások építését és a végrehajtási, tranzakciós munkakörökben dolgozók átképzését elemző, tudásintenzívebb szerepekbe. A WEF szerint 2030-ig száz munkavállalóból 59-nek lesz szüksége up- vagy reskillingre. A cikk szerint Magyarország egyik fő lemaradása a vállalati AI-használatban látszik, mivel 2025-ben a legalább tíz főt foglalkoztató magyar cégek mintegy 10,5 százaléka használt AI-t, szemben a 20 százalékos uniós átlaggal.","kulcsszavak":["AI","képzés","skills-alapú HR"],"het":"2026-10-26","url_forras":"docx","id":"ART-0656","kivonat":"Kadocsa Fanni, a Hybridge Consulting szakértője szerint Magyarországnak nem az AI-modellek fejlesztésében kell versenyeznie, hanem abban, hogy az AI által létrehozott gazdasági értékből minél több maradjon itthon, és a gazdaság magasabb hozzáadott értékű tevéken
