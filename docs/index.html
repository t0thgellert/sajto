// ─── WEEK LABELS ────────────────────────────────────────────────────────────
const HU_HONAP = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
function weekLabel(w) {
  const d = new Date(w + 'T00:00:00');
  if (isNaN(d)) return w;
  const sun = new Date(d.getTime() + 6*86400000);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wn = Math.ceil((((t - y0) / 86400000) + 1) / 7);
  const f = x => `${x.getFullYear()}. ${HU_HONAP[x.getMonth()]} ${x.getDate()}.`;
  return `${wn}. hét (${f(d)} – ${f(sun)})`;
}

// ─── STATE ──────────────────────────────────────────────────────────────────
let activeKat = '';
let activeTags = new Set();

// ─── INIT ───────────────────────────────────────────────────────────────────
function init() {
  // Hero update date only
  document.getElementById('hero-sub').innerHTML =
    `<span class="hero-sub-dot"></span>Frissítve: ${DB.generated}`;

  // Populate week dropdown
  const sel = document.getElementById('week-select');
  const weeks = [...new Set(DB.cikkek.map(a=>a.het))].sort((a,b)=>b.localeCompare(a));
  weeks.forEach(w => {
    const o = document.createElement('option');
    o.value = w;
    o.textContent = weekLabel(w);
    sel.appendChild(o);
  });

  // Kezdőállapot: a legfrissebb hét, AMIBEN VAN CIKK.
  // Nem a naptári hét: a körkép péntek délután jön, tehát hétfőtől péntekig a
  // naptári hét üres, és az oldal 'Nincs találat'-tal nyitna. A weeks[0] a
  // DB-ből jön, így minden frissítés után magától a friss hétre áll.
  if (weeks.length) sel.value = weeks[0];

  // Pill click handlers
  document.querySelectorAll('#pills-kat .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#pills-kat .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      activeKat = p.dataset.val;
      applyFilters();
    });
  });


  renderTagCloud();
  applyFilters();
}

// ─── FILTERS ────────────────────────────────────────────────────────────────

// A kereső az EGÉSZ archívumra kérdez, ezért ha a felhasználó beír valamit, a
// hét-szűrő elengedi magát. Nélküle a keresés csendben 0 találatot adna: az
// oldal alapból az aktuális hétre szűr, és ott a keresett cikk jó eséllyel
// nincs benne. A legördülő látványosan visszaáll 'Összes hét'-re, hogy ne
// rejtett viselkedés legyen.
function onSearchInput() {
  const sel = document.getElementById('week-select');
  if (document.getElementById('nav-search').value.trim() && sel.value) sel.value = '';
  applyFilters();
}

function getFiltered() {
  const week   = document.getElementById('week-select').value;
  const search = document.getElementById('nav-search').value.toLowerCase().trim();
  return DB.cikkek.filter(a => {
    if (activeKat && a.fokategoria !== activeKat) return false;
    if (week      && a.het         !== week)       return false;
    if (activeTags.size > 0 && !a.kulcsszavak.some(t => activeTags.has(canonTag(t)))) return false;
    if (search) {
      const hay = (a.cim + ' ' + a.forras + ' ' + (a.osszefoglalo||'') + ' ' + (a.kivonat||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function applyFilters() {
  const articles = getFiltered();
  renderArticles(articles);
  renderTagCloud();

  const total = DB.cikkek.length;
  // A hét-szűrő szándékosan NINCS benne: a clearFilters() nem nullázza (a heti
  // nézet a kezdőállapot), tehát ne is bukkanjon fel a gomb csak attól, hogy egy
  // hét ki van választva — nem lenne mit tennie vele. Váltani a legördülőben kell.
  const isFiltered = activeKat || activeTags.size || document.getElementById('nav-search').value;
  document.getElementById('results-text').textContent =
    articles.length === total
      ? `Összes ${total} cikk megjelenítve`
      : `${articles.length} találat (összesen: ${total})`;
  const clearBtn = document.getElementById('clear-btn');
  clearBtn.classList.toggle('visible', !!isFiltered);
}

function clearFilters() {
  // A hét-szűrő nem nullázódik: 'Összes hét'-re állni itt visszalépés lenne a
  // régi, zsúfolt kezdőnézethez. Ha az egész archívum kell, a legördülőben ott
  // van az 'Összes hét'.
  activeKat = ''; activeHv = ''; activeTags = new Set();
  document.getElementById('nav-search').value  = '';
  document.querySelectorAll('#pills-kat .pill').forEach((p,i)=>p.classList.toggle('active',i===0));
  applyFilters();
}

// ─── TAG CLOUD ──────────────────────────────────────────────────────────────
let tagCloudExpanded = false;
const TAG_CLOUD_COLLAPSE_THRESHOLD = 12;
const TAG_CLOUD_MAX = 100;

// A címkéket a feldolgozó oldal (cowork/vocab.py) normalizálja egy zárt
// vokabuláriumra, ezért kliensoldalon nincs összevonandó írásmód-variáns.
// A hook megmarad, hogy egy jövőbeni átmeneti időszakban legyen hova írni.
const TAG_SYNONYMS = {};
function canonTag(t) { return TAG_SYNONYMS[t] || t; }

function renderTagCloud() {
  const filtered = getFiltered();
  const counts = {};
  filtered.forEach(a => a.kulcsszavak.forEach(t => {
    const ct = canonTag(t);
    counts[ct] = (counts[ct]||0) + 1;
  }));
  const allTags = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const tags = allTags.slice(0, TAG_CLOUD_MAX);
  const cloud = document.getElementById('tag-cloud');
  const toggle = document.getElementById('tag-cloud-toggle');
  if (!tags.length) { cloud.innerHTML = ''; toggle.style.display = 'none'; return; }
  cloud.innerHTML = tags.map(([t,c]) =>
    `<span class="tag-chip ${activeTags.has(t)?'active':''}" onclick="toggleTag('${esc(t)}')">${t} <span class="tag-cnt">(${c})</span></span>`
  ).join('');
  if (tags.length > TAG_CLOUD_COLLAPSE_THRESHOLD) {
    toggle.style.display = 'inline-block';
    cloud.classList.toggle('collapsed', !tagCloudExpanded);
    toggle.textContent = tagCloudExpanded ? 'Szűrők bezárása' : `Összes szűrő megnyitása (${tags.length})`;
  } else {
    toggle.style.display = 'none';
    cloud.classList.remove('collapsed');
  }
}

function toggleTagCloud() {
  tagCloudExpanded = !tagCloudExpanded;
  renderTagCloud();
}

function toggleTag(t) {
  activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  applyFilters();
}

// ─── RENDER ARTICLES ────────────────────────────────────────────────────────
const SECTIONS = {
  prohuman:   { label: 'Prohuman megjelenések',                    cls: 'sh-prohuman', dot: 'dot-prohuman', badge: 'badge-prohuman' },
  piac:       { label: 'Munkaerőpiaci hírek és elemzések',         cls: 'sh-piac',     dot: 'dot-piac',     badge: 'badge-piac' },
  versenytars:{ label: 'Versenytársakra vonatkozó megjelenések',   cls: 'sh-verseny',  dot: 'dot-verseny',  badge: 'badge-verseny' },
};

function renderArticles(articles) {
  const container = document.getElementById('content');
  if (!articles.length) {
    container.innerHTML = `<div class="empty"><span class="empty-icon">🔍</span>Nincs találat a megadott szűrési feltételekre.</div>`;
    return;
  }
  // Group by fokategoria
  const groups = { prohuman: [], piac: [], versenytars: [] };
  articles.forEach(a => { if (groups[a.fokategoria]) groups[a.fokategoria].push(a); });

  let html = '';
  for (const [key, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const s = SECTIONS[key];
    html += `<div class="section-head ${s.cls}">
      <span class="section-dot ${s.dot}"></span>
      <span class="section-title-text">${s.label}</span>
      <span class="section-count">(${items.length})</span>
    </div>`;

    // Sub-group by alkategoria for piac & versenytars
    if (key !== 'prohuman') {
      const subs = {};
      items.forEach(a => { (subs[a.alkategoria] = subs[a.alkategoria]||[]).push(a); });
      for (const [sub, sitems] of Object.entries(subs)) {
        html += `<div class="subsection-label">${esc(sub)} (${sitems.length})</div>`;
        html += `<div class="card-grid">${sitems.map(a=>cardHtml(a,s.badge)).join('')}</div>`;
      }
    } else {
      html += `<div class="card-grid">${items.map(a=>cardHtml(a,s.badge)).join('')}</div>`;
    }
  }
  container.innerHTML = html;
}

function cardHtml(a, badgeCls) {
  const cim = cleanText(a.cim);
  const title = a.url
    ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(cim)}</a>`
    : esc(cim);
  const wkLbl = weekLabel(a.het);
  const fullSum = cleanText(a.osszefoglalo);
  const shortSum = smartCut(fullSum);
  const summary = a.osszefoglalo && a.osszefoglalo !== a.cim
    ? `<div class="card-summary">${esc(shortSum)}</div>` : '';
  const more = (a.kivonat || shortSum.length < fullSum.length)
    ? `<button type="button" class="card-more" data-id="${esc(a.id)}">Összefoglaló</button>`
    : '';
  const tags = a.kulcsszavak.map(t =>
    `<span class="card-tag ${activeTags.has(t)?'active':''}" onclick="toggleTag('${esc(t)}')">${esc(t)}</span>`
  ).join('');
  return `<div class="card ${a.fokategoria==='prohuman'?'card-prohuman':''}">
    <div class="card-top">
      <span class="badge ${badgeCls}">${esc(a.alkategoria)}</span>
      <div class="card-title">${title}</div>
    </div>
    <div class="card-meta">
      <span class="meta-source">${esc(a.forras)}</span>
      <span class="meta-dot">·</span>
      <span>${esc(a.datum||'')}</span>
      <span class="meta-week">${esc(wkLbl)}</span>
    </div>
    ${summary}
    <div class="card-footer">${tags}${more}</div>
  </div>`;
}

function cleanText(s) {
  // Eltávolítja a Word→JSON konverzióból maradt markdown artifaktokat
  return (s || '').replace(/^#+\s*/, '').replace(/^\[/, '').trim();
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── ÖSSZEFOGLALÓ-VÁGÁS (2026-10-14, 2. változat) ──────────────────────────
// Cél: 270–290 karakter, a mondat egy természetes pontján — előbb mondatvég,
// aztán mondatrészhatár (; : vessző, gondolatjel), végül szóhatár. Nem vág
// névelő, kötőszó, számszó vagy szám után („…költségek, a…", „…35…"), nem
// választja le a névutót, és nem hagy csonka mondatkezdetet („…A cég szerint…").
// Ha a sávban nincs jó pont, legfeljebb 260-ig visszalép egy mondat- vagy
// tagmondatvégre.
const CUT_STOP_END = new Set(('a az egy és s vagy de hogy mint mintegy pedig illetve valamint továbbá ' +
  'ami amely amelyek amelyet amelynek amit aki akik akit ahol amikor ahogy amíg mert ha nem már még csak ' +
  'ez ezt azt ezzel azzal erre arra ennek annak ezek azok így úgy akár mind minden több kevesebb legalább ' +
  'közel csaknem nagyjából körülbelül kb mintegy alig szinte egyre leginkább főleg főként különösen ' +
  'elsősorban sok kevés néhány számos egyes bizonyos olyan ilyen annyi ennyi azonban viszont tehát ezért ' +
  'emiatt hiszen ugyanakkor miközben mivel míg bár noha hanem sőt vagyis azaz például pl ill is sem ' +
  'nagy kis új régi magyar hazai külföldi első második harmadik utolsó teljes jelentős komoly fontos ' +
  'azokat ezeket azoknak ezeknek azon ezen annál ennél abban ebben arról erről akkor most ' +
  'amelyben amelyre amelyeket amelyekben amelyekre amelyből amiben amire amiket amiért ahova ahonnan ' +
  'akinek akiket egyik másik mindkét valamennyi összes saját ' +
  'ezer millió milliárd billió száz ' +
  'valamivel kicsit jóval sokkal egészen nagyon igen rendkívül kifejezetten mindössze csupán nagyrészt ' +
  'negyedik ötödik hatodik hetedik nyolcadik kilencedik tizedik ' +
  'semmilyen bármilyen milyen valamilyen semmi bármi valami szerint más egyéb ' +
  'the and of').split(' '));
// Melléknévi végződések (-i, -bb, -ó/-ő): utánuk gyakran a jelzett főnév jönne
// („a kínai…", „fontosabb…") — szóhatárként csak akkor, ha nincs jobb.
const CUT_WEAK_END = /(i|bb|ó|ő)$/;
const CUT_BAD_NEXT = new Set(('szerint miatt után előtt alatt között felett fölött közül számára által ' +
  'révén nélkül helyett óta alapján kapcsán mellett ellen iránt során keretében nyomán hatására idején ' +
  'folytán ellenére végén elején közepén is sem').split(' '));
const CUT_ABBR = new Set('dr prof kft zrt bt nyrt kb pl stb ill vö id ifj özv szt u ún jan febr márc ápr máj jún júl aug szept okt nov dec'.split(' '));

function smartCut(s, min = 270, max = 290, floor = 260) {
  s = (s || '').replace(/\s+/g, ' ').trim();
  if (s.length <= max) return s;
  const norm = w => (w || '').toLowerCase().replace(/^[„"“(\[]+|[”"“)\].,;:!?…]+$/g, '');
  const cands = [];
  for (let i = 1; i < s.length && i <= max; i++) {
    if (s[i] !== ' ') continue;
    const prev = s.slice(0, i);
    const lastTok = prev.slice(prev.lastIndexOf(' ') + 1);
    const nextTok = s.slice(i + 1).split(' ')[0] || '';
    const last = norm(lastTok), next = norm(nextTok);
    let score = 1, type = 'szó';
    if (/[.!?]["”)]?$/.test(lastTok) && /^[„"“(A-ZÁÉÍÓÖŐÚÜŰ0-9]/.test(nextTok)
        && !CUT_ABBR.has(last) && !/^\d+\.$/.test(lastTok)) { score = 4; type = 'mondat'; }
    else if (/[;:]$/.test(lastTok)) { score = 3; type = 'tagmondat'; }
    else if (/,$/.test(lastTok)) { score = 2.6; type = 'tagmondat'; }
    else if (/^[–—]$/.test(nextTok) || /^[–—]/.test(nextTok)) { score = 2.4; type = 'tagmondat'; }
    else if (/[)”"]$/.test(lastTok)) { score = 1.8; type = 'zárójel'; }
    // tiltások: névelő / kötőszó / számszó a végén, puszta szám a végén, névutó utána
    let ok = true;
    if (type === 'szó' || type === 'zárójel') {
      if (CUT_STOP_END.has(last)) ok = false;
      if (/^[\d\s.,–-]+$/.test(lastTok)) ok = false;
      if (ok && CUT_WEAK_END.test(last)) score = 0.7;
      // névelő + melléknévszerű szó a végén („a jóváhagyott…", „az uniós…"): gyenge
      const toks = prev.split(' '), before = norm(toks[toks.length - 2]);
      if (ok && ['a', 'az', 'egy', 'más', 'egyéb', 'minden', 'több', 'sok', 'néhány', 'számos']
          .includes(before) && /(tt|s|i|bb|ó|ő)$/.test(last)) score = 0.7;
      if (CUT_BAD_NEXT.has(next)) ok = false;
      if (/^\d/.test(nextTok) === false && /^\d+$/.test(last)) ok = false;
    }
    if (type === 'tagmondat' && CUT_STOP_END.has(last) && !/[,;:]$/.test(lastTok)) ok = false;
    if (type !== 'mondat' && /^[\d\s.,–%-]+$/.test(lastTok.replace(/[,;:]$/, ''))) ok = false;   // „…51…
    // nyitott idézőjel / zárójel a vágás előtt: kerüljük
    const openQ = (prev.match(/„/g) || []).length - (prev.match(/”/g) || []).length;
    const openP = (prev.match(/\(/g) || []).length - (prev.match(/\)/g) || []).length;
    if (openQ > 0 || openP > 0) score -= 1.2;
    cands.push({ i, score, ok, type });
  }
  const pick = (lo, needOk, minScore) => cands
    .filter(c => c.i >= lo && (!needOk || c.ok) && c.score >= minScore)
    .sort((a, b) => b.score - a.score || b.i - a.i)[0];
  // Sorrend: jó hely a sávban → mondat/tagmondat kicsit (≤20 karakter) a sáv előtt →
  // gyenge, de megengedett szóhatár a sávban → bármi a sávban → bármi.
  let best = pick(min, true, 1) || pick(floor, true, 2.4) || pick(min, true, -9)
            || pick(floor, true, -9) || pick(min - 40, true, 2.4)
            || pick(min, false, -9) || cands[cands.length - 1];
  if (!best) return s.slice(0, max) + '…';
  // Ha a választott hely egy új mondat első pár szava után van („…hatékonyak. A szövetség
  // szerint…"), inkább az előző mondat végén vágunk, ha az nincs messze.
  if (best.type !== 'mondat') {
    const se = cands.filter(c => c.type === 'mondat' && c.i >= floor && c.i < best.i).pop();
    if (se && s.slice(se.i, best.i).trim().split(' ').length <= 4) best = se;
  }
  let out = s.slice(0, best.i);
  out = best.type === 'mondat' ? out.replace(/[.!?]+(["”)]?)$/, '$1') : out.replace(/[\s,;:–—-]+$/, '');
  return out + '…';
}

const BY_ID = Object.fromEntries(DB.cikkek.map(a => [a.id, a]));

// ─── ÖSSZEFOGLALÓ ABLAK ────────────────────────────────────────────────────
// A kártya „Összefoglaló" gombja: a teljes összefoglaló (kivonat), ha van,
// különben a kártya teljes szövege.
function openSummary(id) {
  const a = BY_ID[id];
  if (!a) return;
  const dlg = document.getElementById('sum-dialog');
  const okUrl = !!a.url && /^https?:\/\//i.test(a.url);
  const mkLink = (cls, text) => {
    const l = document.createElement('a');
    if (cls) l.className = cls;
    l.href = a.url; l.target = '_blank'; l.rel = 'noopener'; l.textContent = text;
    return l;
  };

  const title = document.getElementById('sum-title');
  title.textContent = '';
  if (okUrl) title.appendChild(mkLink('', cleanText(a.cim)));
  else title.textContent = cleanText(a.cim);

  document.getElementById('sum-meta').innerHTML =
    `<b>${esc(a.forras)}</b> · ${esc(a.datum || '')} · ${esc(a.alkategoria || '')}`;

  const box = document.getElementById('sum-text');
  box.textContent = '';
  String(a.kivonat || cleanText(a.osszefoglalo)).split(/\n\s*\n/).forEach(t => {
    if (!t.trim()) return;
    const p = document.createElement('p');
    p.textContent = t.trim();
    box.appendChild(p);
  });

  const foot = document.getElementById('sum-foot');
  foot.textContent = '';
  if (okUrl) {
    foot.appendChild(mkLink('sum-link', 'Cikk megnyitása ↗'));
  } else {
    const n = document.createElement('span');
    n.className = 'sum-note';
    n.textContent = a.url_forras === 'nincs'
      ? 'Ennek a megjelenésnek nincs online változata (pl. TV- vagy nyomtatott megjelenés).'
      : 'Ehhez a megjelenéshez még nincs online link.';
    foot.appendChild(n);
  }
  if (typeof dlg.showModal === 'function') dlg.showModal();
  else dlg.setAttribute('open', '');
}

document.getElementById('content').addEventListener('click', e => {
  const b = e.target.closest('.card-more');
  if (b) openSummary(b.dataset.id);
});
(() => {
  const dlg = document.getElementById('sum-dialog');
  const close = () => (typeof dlg.close === 'function' ? dlg.close() : dlg.removeAttribute('open'));
  document.getElementById('sum-close').addEventListener('click', close);
  dlg.addEventListener('click', e => { if (e.target === dlg) close(); });   // háttérre kattintás
})();

init();
</script>
