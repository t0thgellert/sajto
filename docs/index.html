hoz kapcsolódó álláshirdetések 61%-kal nőttek egy év alatt Nagy-Britanniában; az AI-készségekkel rendelkezők átlagosan 34,2%-kal, egyes szektorokban akár 64%-kal keresnek többet.","kulcsszavak":["kutatás és statisztika","AI","bérek","toborzás"],"het":"2026-06-15","id":"ART-0333","url_forras":"docx","kivonat":"A PwC AI Jobs Barometer elemzése szerint az AI-hoz kapcsolódó álláshirdetések száma 61 százalékkal ugrott meg egyetlen év alatt Nagy-Britanniában – miközben az általános álláspiac 6,6 százalékkal szűkült. A növekedést elsősorban nem az AI-fejlesztők, hanem az „AI-felhasználók\" hajtják: olyan szakemberek, akik saját területükön belül hatékonyan alkalmazzák a technológiát – ez a kategória 65,8 százalékkal bővült. A bérprémium is látványosan nőtt: az AI-készségekkel rendelkezők átlagosan 34,2 százalékkal keresnek többet, fogyasztói piaci szektorban ez akár 64 százalékot is elérhet. A pályakezdő szinten különösen éles az elmozdulás: az AI-nak leginkább kitett belépő pozíciókban hétszer nagyobb valószínűséggel várnak el szenior szintű képességeket, mint a vezetés vagy a kreativitás."},{"cim":"A mesterséges intelligencia egyre több irodai feladatot vesz át, ezért idén kevesebb diákot keresnek ezekre a munkákra","url":null,"forras":"RTL","datum":"2026-06-13","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint az AI sok irodai feladatot átvett, ezért a cégek kevesebb diákot vesznek fel; a legnépszerűbb területek a turizmus és a mezőgazdaság.","kulcsszavak":["Trenkwalder","diákmunka","AI","rugalmas foglalkoztatás"],"het":"2026-06-08","id":"ART-0334","kivonat":"Az RTL Híradó riportja szerint az idei nyári diákmunka-szezonban az irodai és adminisztratív pozíciók egyre kevésbé elérhetők, mivel az AI sok ilyen feladatot átvett – a cégek inkább a meglévő dolgozóikat terhelik meg, mintsem diákokat vesznek fel. Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint a gazdasági stagnálás is nehezíti a helyzetet. A legnépszerűbb területek a turizmus, a vendéglátás, a mezőgazdaság és a fesztiválok. Göbl Róbert, a Mind-Diák Szövetkezet elnöke szerint az órabérek jellemzően 2000–2500 forint között mozognak, kiemelt elvárások – nyelvtudás, IT-feladatok – esetén elérheti a 3000 forintot is, a minimális alap bruttó 1856, középfokú végzettséggel 2145 forint."},{"cim":"Miért fizeti ki a kormány a diákmunkások bérének 75–100 százalékát?","url":"https://telex.hu/g7/kozelet/2026/06/19/nyari-diakmunka-munkaeropiac-foglalkoztatas-bertamogatas","forras":"G7","datum":"2026-06-19","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Nyári Diákmunka 2026 program keretében az állam a diákok bérének 75-100%-át fedezi; Pénzes Lili, a Trenkwalder diáküzletágának vezetője szerint a meghirdetett pozíciók száma 8-10%-kal csökkent.","kulcsszavak":["Trenkwalder","diákmunka","adózás","politika"],"het":"2026-06-15","id":"ART-0335","url_forras":"docx","kivonat":"A Szociális és Családügyi Minisztérium Nyári Diákmunka 2026 névvel bértámogatási programot indít: önkormányzatok, egyházi szervezetek, valamint a mezőgazdaság, turizmus, vendéglátás és erdőgazdálkodás területén működő vállalkozások pályázhatnak, amelyek 16–25 éves nappali tagozatos diákokat alkalmaznak júliusban és augusztusban. Önkormányzatoknál a bér 100, máshol 75 százalékát fedezi az állam. A cél az uniós átlagtól elmaradó fiatal foglalkoztatási arány javítása: a 15–24 évesek 26,2 százaléka dolgozik itthon, szemben az uniós 33 százalékos átlaggal. Pénzes Lili, a Trenkwalder diáküzletágának vezetője ugyanakkor hangsúlyozta, hogy a tanulmányi szünetben a diákok sok lehetőség közül válogathatnak – bár 8-10 százalékkal csökkent a meghirdetett pozíciók száma. A program a Tisza választási programjával is összecseng, amely 400 ezer inaktív munkavállalót kíván bevonni a munkaerőpiacra, részben a vendégmunkások kiváltása érdekében."},{"cim":"Így szabályos, így fizet a nyári diákmunka","url":"https://haszon.hu/penz/nyari-diakmunka-nav/","forras":"Haszon","datum":"2026-06-14","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az ELTE-Trenkwalder Iskolaszövetkezet szerint idén a diákok átlagosan 2350 forintos órabért kapnak, az IT területen akár 3200 forintot is; a NAV szerint a háztartási munka jövedelme köztehermentes.","kulcsszavak":["Trenkwalder","diákmunka","bérek","adózás"],"het":"2026-06-08","id":"ART-0336","url_forras":"docx","kivonat":"Az ELTE-Trenkwalder Iskolaszövetkezet adatai szerint idén a munkáltatók átlagosan 2350 forintos órabért kínálnak a diákoknak – 8-9 százalékkal többet, mint tavaly. Az IT és telekommunikáció területén a legjobb, akár 3100-3200 forint is elérhető, a gyógyszeripari és marketing munkáknál 2500, a logisztikában 2400, míg a vendéglátásban 2200 forintról indul az órabér, bár a balatoni és budapesti főszezonban ez meghaladhatja a 2600 forintot is. A NAV tájékoztatója szerint a diákok iskolaszövetkezeten, munkaviszonyban vagy egyszerűsített foglalkoztatásban is dolgozhatnak – utóbbinál nem kötelező az írásos szerződés. Háztartási munkánál (korrepetálás, gyermekfelügyelet, takarítás) a diák jövedelme köztehermentes, egyetlen kötelezettség a bejelentés, amit a foglalkoztató természetes személy teljesít."},{"cim":"Új helyzet a munkaerőpiacon: így élhetik túl a vállalatok a szigorodó vendégmunkás-szabályozást","url":"https://www.portfolio.hu/gazdasag/20260614/uj-helyzet-a-munkaeropiacon-igy-elhetik-tul-a-vallalatok-a-szigorodo-vendegmunkas-szabalyozast-842876","forras":"Portfolio","datum":"2026-06-14","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"G. Nagy Balázs, a Trenkwalder Magyarország ügyvezetője szerint a vállalatoknak stratégiai tervezésüket kell újragondolniuk; a megoldás munkafolyamatok újraszervezéséből és automatizációs beruházásokból állhat össze.","kulcsszavak":["Trenkwalder","vendégmunka","automatizáció"],"het":"2026-06-08","id":"ART-0337","url_forras":"docx","kivonat":"G. Nagy Balázs, a Trenkwalder Magyarország ügyvezetője a Portfolio véleményrovatában azt írja: a vendégmunkás-tartózkodási engedélyek leállítása nem tekinthető végleges állapotnak, de az átmeneti időszakban a vállalatoknak stratégiai tervezésük újragondolása elkerülhetetlen. Tökéletes alternatíva rövid határidővel aligha létezik – a megoldás várhatóan munkafolyamatok újraszervezéséből, egyes tevékenységek kiszervezéséből és a belföldi tartalékok aktivizálásából áll majd össze. Az eddig túl kockázatosnak ítélt automatizációs beruházások felé is lökést adhat. Versenyelőnybe azok a vállalatok kerülhetnek, amelyek gyorsan reagálnak. A tét, hogy milyen irányban és milyen ütemben képes strukturálisan átalakulni a magyar gazdaság a demográfiai trendek és globális erőviszonyok közepette."},{"cim":"„Az AI nem helyettesít, hanem kognitív asszisztensként felszabadít” – Interjú dr. Gedeon Valériával a neurodiverzitás és az AI csendes forradalmáról","url":"https://ictglobal.hu/print/ai-neurodiverzitas-munkaeropiac-integracio/","forras":"ICT Global","datum":"2026-06-15","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Dr. Gedeon Valéria, a Randstad IT-toborzási managere szerint a munka feladatokra bontása kedvező a neurodivergens munkavállalóknak, akiket a hagyományos toborzás kizár, holott kiemelkedő képességekkel bírnak.","kulcsszavak":["Randstad","esélyegyenlőség","AI","toborzás"],"het":"2026-06-15","id":"ART-0338","url_forras":"talalt","kivonat":"Dr. Gedeon Valéria, a Randstad IT-toborzási branch managere szerint a „munka pixelekre bontása” – vagyis a pozíciók konkrét feladatokra és készségekre való felbontása – különösen kedvező a neurodivergens munkavállalóknak, akiket a hagyományos toborzási rendszerek kizárnak, holott kiemelkedő képességekkel bírnak. Az USA-ban a neurodiverzitással élők 40 százaléka munkanélküli, miközben a vállalatok több mint 70 százaléka nem talál megfelelő tehetségeket. Az AI ebben kognitív asszisztensként segíthet: objektívebb szűrést tesz lehetővé, mikrofeladatokra bonthatja a nagy projekteket ADHD-s munkavállalóknak, vagy professzionális formátumba öntheti egy diszlexiás szakember gondolatait. A Randstad felmérése szerint a Fortune 500 vállalatok 20 százaléka jövőre már aktívan toboroz neurodivergens tehetségeket."},{"cim":"Van élet a vendégmunka után?","url":"https://profitline.hu/van-elet-a-vendegmunka-utan-487869","forras":"Profitline","datum":"2026-06-13","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szakmai kerekasztalán a résztvevők cáfolták, hogy a külföldi munkaerő olcsóbb lenne a hazainál; valós potenciál rejlik a diákokban, nyugdíjasokban és a mintegy 50 ezer itthon tanuló külföldi diákban.","kulcsszavak":["WHC","vendégmunka","diákmunka","munkaerő-tartalék"],"het":"2026-06-08","id":"ART-0339","url_forras":"talalt","kivonat":"A vendégmunkás-tartózkodási engedélyek júniusi szigorítása nyomán szervezett szakmai kerekasztalt a WHC Csoport azzal a kérdéssel, hogy képes-e a diákmunka pótolni a kieső munkaerőt. A résztvevők egybehangzóan cáfolták a közhiedelmet: a külföldi munkaerő nem olcsóbb, hanem drágább a hazainál, alkalmazásuk mögött a létszámkényszer áll. A „több százezres hazai tartalék” gyors bevonása nem reális – az érintettek nagy része egészségügyi, szociális vagy földrajzi okokból nem mobilizálható. Valós potenciál rejlik viszont a diákokban, nyugdíjasokban, kisgyermekes szülőkben és az itthon tanuló közel 50 ezer külföldi diákban. Kiss Nikolett, a WHC Csoport régióvezetője szerint a megoldás nem „vagy-vagy”, hanem ezeknek a csoportoknak az egymást kiegészítő, rugalmas kombinálása – a versenyelőnyt az alkalmazkodóképes vállalatok szerzik meg."},{"cim":"Megszólaltak a legnagyobb magyar cégek: rendkívüli veszély fenyegeti a hazai gyárakat, hamarosan teljesen kiürülhetnek?","url":"https://www.penzcentrum.hu/karrier/20260616/megszolaltak-a-legnagyobb-magyar-cegek-rendkivuli-veszely-fenyegeti-a-hazai-gyarakat-hamarosan-teljesen-kiurulhetnek-1200560","forras":"Pénzcentrum","datum":"2026-06-16","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A Business Fest kerekasztalán a MOL, a Schaeffler, a Richter és a WHC vezetői jelezték: 2030-ra a szakemberhiány a 40%-ot is elérheti a gyártóiparban; a megoldást a duális képzésben látják.","kulcsszavak":["WHC","munkaerőhiány","képzés","ipar"],"het":"2026-06-15","id":"ART-0340","url_forras":"docx","kivonat":"A Business Fest gyártóipari kerekasztalán Bán Zoltán (MOL), Gazdag András (Schaeffler), Günther Gábor (Richter) és Göltl Viktor (WHC) egybehangzóan jelezték: a hazai gyártóipar következő nagy kihívása nem a technológia finanszírozása, hanem a megfelelő munkaerő és kompetencia biztosítása – 2030-ra a 40 százalékot is elérheti a szakemberhiány. A kékgalléros toborzásnál száz jelentkezőből gyakran csak néhány felel meg az elvárásoknak, és az elöregedő állomány tömeges nyugdíjba vonulásával évtizedes gyakorlati tudás tűnhet el a szervezetekből. A megoldást a duális képzésben látják: ez az egyetlen rendszer, amely egyszerre adja át a gyakorlati tudást és vonja be a fiatalokat már tanulmányaik alatt – a gyártószektor az oktatásra fordított forrásokat nem költségként, hanem a jövőbe való befektetésként értelmezi."},{"cim":"Millásreggeli podcast: eltűnő idénymunkások, miért félünk az AI-tól?","url":"https://millasreggeli.hu/podcast/millasreggeli-podcast-eltuno-idenymunkasok-miert-felunk-az-ai-tol/","forras":"Millásreggeli","datum":"2026-06-15","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Göltl Viktor, a WHC ügyvezetője a mezőgazdasági idénymunkáról beszélt: a kombájnvezetők órabére elérheti az 5000 forintot, a gyümölcsszedőké 2500 forint körül alakul, a fiatalok bevonása egyre nehezebb.","kulcsszavak":["WHC","szezonális munka","agrárium"],"het":"2026-06-15","id":"ART-0341","url_forras":"docx","kivonat":"Göltl Viktor, a WHC ügyvezető igazgatója a Radiocafe Millásreggeli műsorában a mezőgazdasági idénymunka helyzetéről beszélt. Elmondása szerint a kombájnvezetőtől a gyümölcsszedőig terjed a skála – előbbinél az órabér elérheti az 5000 forintot is, utóbbinál 2500 forint körül alakul. A fiatalabb generáció bevonása egyre nehezebb, az idősebb korosztályra azonban még mindig lehet számítani. A szezonális mezőgazdasági munkavállalási engedély harmadik országbelieknek is lehetővé teszi a hat hónapos idénymunkát, de Göltl szerint ez jóval kisebb számban van jelen, mint a mostanában felfüggesztett vendégmunkás-engedélytípus. Az inaktív tartalékok mozgósítását szkeptikusan ítéli meg – rámutatva, hogy Ausztriában 300 ezer munkanélküli sem mozdul tizennégyszeres éves bérért. A béremelés lehetséges lenne, de az ár a fogyasztóhoz gyűrűzne tovább: bruttó milliós fizetés mellett az eper kilója is tizennégy-tizenötezer forint lenne."},{"cim":"A Master Good-konfliktus: Valóban a külföldi vendégmunkás az egyetlen kiút?","url":"https://jelen.media/a-master-good-konfliktus-valoban-a-kulfoldi-vendegmunkas-az-egyetlen-kiut/","forras":"Jelen","datum":"2026-06-22","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Jelen podcastjában a Prohuman két szakmai vezetője a Master Good-vitát elemezve rámutatott: a 2%-os külföldi munkaerő nem a valódi kérdés, hanem a strukturális hiány; a kiút a skills-alapú, mikrotanúsítványokra épülő képzési ökoszisztéma.","kulcsszavak":["agrárium","képzés","munkaerőhiány"],"het":"2026-06-22","id":"ART-0342","url_forras":"docx","kivonat":"A Jelen podcastjában Ónody-Molnár Dóra a Prohuman két szakmai vezetőjével, Horváth Ádámmal és Major Gáborral a Master Good és Magyar Péter vendégmunkás-vitája kapcsán a munkaerőpiac „tökéletes viharát” elemzi: az évi 50 ezer fős zsugorodást, a globalizációs nyomást és a gyorsuló technológiai váltást. A szakértők szerint a 2% körüli külföldi munkaerő nem a valódi kérdés, hanem a strukturális hiány – a mintegy 300 ezer inaktívnak csupán 10-15%-a mobilizálható, miközben Magyarország az EU utolsó helyén áll a felnőttképzési hajlandóságban, és a béreket utolérő, de a termelékenységben elmaradó gazdaság a közepes jövedelmi csapdába ragadt. A kiút a skills-alapú, adatvezérelt szemlélet és egy mikrotanúsítványokra épülő, a megszerzett tudást elismerő–tanúsító–beszámító képzési ökoszisztéma kiépítése – azzal a tanulsággal, hogy nem az AI, hanem az azt használó munkavállaló veszi majd el a technológiát elutasítók munkáját."},{"cim":"Kontroll heti best of: véget érhet a \"Sulyok-saga\", \"fűnyíró\" a Mediaworksnél, hőségriadó az országban","url":"https://kontroll.hu/cikk/belfold/2026/06/21/kontroll-heti-best-of-veget-erhet-a-sulyok-saga-funyiro-a-mediaworksnel-hossegriado-az-orszagban","forras":"Kontroll","datum":"2026-06-21","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A heti összefoglaló megemlíti, hogy a Prohuman Zrt. konferenciáján magyar szakemberek és a harvardi közgazdászprofesszor a kihasználatlan magyar munkaerő kérdéséről osztották meg gondolataikat.","kulcsszavak":["kutatás és statisztika","munkaerő-tartalék"],"het":"2026-06-15","id":"ART-0343","url_forras":"docx","kivonat":"A Kontroll heti összefoglalója a politikai-közéleti témák (Sulyok Tamás lehetséges távozása, a Mediaworks leépítései, korrupciós ügyek) mellett a videós tartalmak között megemlíti, hogy a Prohuman Zrt. konferenciáján a magyar szakemberek és a Harvard közgazdászprofesszora a kihasználatlan magyar munkaerő kérdéséről osztották meg gondolataikat a lap riporterével."},{"cim":"Robotszendvics","url":"https://e.pcloud.link/publink/show?code=XZ8pxcZUGCsubsSyg4tSXNyINRE8X5FczDk","forras":"Supply Chain Monitor","datum":"2026-06-26","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman, az MKIK és a JVSZ Verseny. Képesség. Business Summitján a résztvevők egyetértettek: a versenyképesség többé nem létszámbővítéssel, hanem termelékenységnöveléssel és humántőke-fejlesztéssel tartható fenn.","kulcsszavak":["gazdasági kilátások","skills-alapú HR"],"het":"2026-06-22","id":"ART-0344","url_forras":"docx","kivonat":"A budapesti Néprajzi Múzeumban június 11-én rendezett Verseny. Képesség. Business Summit – amelyet a Prohuman Csoport, a Magyar Kereskedelmi és Iparkamara és a Joint Venture Szövetség szervezett – a magyar munkaerőpiac eróziójára keresett válaszokat: az évente 50 ezer fővel zsugorodó aktív munkaerőbázisra, a demográfiai fogyásra és a felnőttképzésben elfoglalt utolsó uniós helyre. A harvardi Dani Rodrik, az oxfordi Dávid-Barrett Tamás, kormányzati döntéshozók és vállalati vezetők egyetértettek, hogy a versenyképesség többé nem létszámbővítéssel, hanem termelékenységnöveléssel és a humántőke minőségének fejlesztésével tartható fenn. Az AI és a robotizáció korában felértékelődik az emberi kreativitás és a folyamatos tanulásra való képesség, a pozícióalapú HR helyét pedig a skills-first megközelítés veszi át."},{"cim":"Egyre mélyebb a szakadék","url":"https://e.pcloud.link/publink/show?code=XZppxcZoEdw7WKbI1uvV6iTTcucnpQ21Ja7","forras":"Supply Chain Monitor","datum":"2026-06-26","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman győri regionális gazdasági fórumán a szakértők rámutattak: Győr-Moson-Sopron megye egyszerre erős és sebezhető; a válasz a Prohuman SkillCompass rendszere által is támogatott skills-alapú gondolkodás.","kulcsszavak":["képzés","skills-alapú HR"],"het":"2026-06-22","id":"ART-0345","url_forras":"docx","kivonat":"A Prohuman május 27-i győri regionális gazdasági fórumán a szakértők rámutattak, hogy Győr-Moson-Sopron megye – az ország legalacsonyabb munkanélküliségével, legmagasabb foglalkoztatottságával és nettó átlagbérével – egyszerre erős és sebezhető: a szinte teljes foglalkoztatottság miatt egyre nehezebb és lassabb a dolgozók pótlása, miközben a régiót a demográfiai apadás, az osztrák bérverseny és az AI „tökéletes vihara” sújtja. A válasz a skills-alapú, adatvezérelt gondolkodás: nem pozíciókat kell betölteni, hanem gyorsan újrakombinálható kompetenciamixeket összeállítani, amit a Prohuman SkillCompass rendszere is támogat. A fiatalok munkaerőpiacával foglalkozó kerekasztal résztvevői a tudatos gyakornoki rendszer, a mentorálás és a visszajelzés-kultúra fontosságát emelték ki a Z-generáció megtartásában."},{"cim":"A nyári melótól a karrierépítésig: így alakult át a magyar diákmunkapiac az elmúlt másfél évtizedben","url":"https://www.hrportal.hu/hr/a-nyari-melotol-a-karrierepitesig-igy-alakult-at-a-magyar-diakmunkapiac-az-elmult-masfel-evtizedben-20260616.html","forras":"HR Portál","datum":"2026-06-16","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prodiák Iskolaszövetkezet fennállásának 15. évfordulóján visszatekint arra, hogyan vált a diákmunka a nyári alkalmi kereset helyett a tudatos karrierépítés első állomásává, havonta mintegy 5000 diákot foglalkoztatva.","kulcsszavak":["diákmunka","Prodiák","megtartás"],"het":"2026-06-15","id":"ART-0346","url_forras":"docx","kivonat":"A Prodiák Iskolaszövetkezet 2026-ban ünnepli fennállása 15. évfordulóját, és ennek apropóján tekint vissza arra, hogyan vált a magyar diákmunka a nyári alkalmi keresetből a tudatos karrierépítés első állomásává. Az 2011-ben indult, ma havonta mintegy 5000 diákot foglalkoztató és 650-nél több partnerrel dolgozó szövetkezet nemcsak követte, hanem alakította is ezt a folyamatot: a 2015 körüli fordulóponttól az irodai és gyakornoki feladatkörök bővítésével, országos irodahálózattal, a Felszállópálya Pályakezdő Programmal és a digitalizációval reagált a piac igényeire. A jövőben a felsőoktatási kapcsolatok szorosabbra fűzését, a gyakornoki programok erősítését és a külföldi hallgatók foglalkoztatásának fejlesztését tűzte ki célul."},{"cim":"Apáti Ferenc: több ok miatt is kellenek a külföldi vendégmunkások a zöldség-gyümölcs ágazatban","url":"https://infostart.hu/belfold/2026/06/25/apati-ferenc-tobb-ok-miatt-is-kellenek-a-kulfoldi-vendegmunkasok-a-zoldseg-gyumolcs-agazatban","forras":"InfoRádió","datum":"2026-06-25","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A FruitVeB elnöke szerint a zöldség-gyümölcs ágazat nem kerülheti el a harmadik országbeli munkaerőt; a szektor 97%-ban magyar munkaerőt foglalkoztat, a vendégmunkásstop nagyrészt nem érinti, mert a külföldiek 80%-a más jogcímen dolgozik.","kulcsszavak":["munkáltatói szövetség","agrárium","vendégmunka"],"het":"2026-06-22","id":"ART-0347","url_forras":"docx","kivonat":"Apáti Ferenc, a FruitVeB elnöke az InfoRádió Arena című műsorában elmondta: a zöldség–gyümölcs-ágazat hosszú távon nem kerülheti el a harmadik országbeli munkaerő foglalkoztatását, mert egyre kevesebb magyar születik, egyre kevesebben vállalják a betakarítás nehéz fizikai munkáját, a piaci verseny miatt pedig nem tudnak sokkal magasabb bért fizetni. Hangsúlyozta, hogy a szektor jelenleg 97%-ban magyar munkaerőt foglalkoztat, és a „vendégmunkásstop” az ágazatot nagyrészt nem érinti, mert a külföldi dolgozók 80%-át foglalkoztatási célú behozatallal alkalmazzák – csak a munkaerő-közvetítőkön át zajló behozatalt függesztették fel, amit ki tudnak váltani. Ha a 26 EU-s versenytárs és az olcsóbb munkaerejű EU-n kívüli termelők is külföldi munkaerőre építenek, Magyarország a tiltással csak saját magát hozná versenyhátrányba."},{"cim":"Olcsó munkaerő hajtja az európai versenytársainkat","url":"https://www.vg.hu/velemeny/2026/06/kulfoldi-olcso-munkaero-europai-versenytarsainkat","forras":"Világgazdaság","datum":"2026-06-24","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A MAGOSZ főtitkára szerint az európai mezőgazdaság nem működhetne 3 millió külföldi vendégmunkás nélkül; Spanyolország, Lengyelország és Németország eltérő modelleket alkalmaz a szezonális munkaerő biztosítására.","kulcsszavak":["munkáltatói szövetség","agrárium","vendégmunka","régiós különbségek"],"het":"2026-06-22","id":"ART-0348","url_forras":"docx","kivonat":"Dr. Cseh Tibor András a MAGOSZ főtitkára és a Nemzeti Agrárgazdasági Kamara alelnöke cikkében kifejti: az európai mezőgazdaság – köztük a kontinens vezető zöldség-gyümölcs- és húságazatai – nem működhetne a több mint 3 millió külföldi vendégmunkás nélkül, mivel a helyi lakosság nem vállalja az alacsony bérű, nehéz fizikai munkát, a betakarítás pedig hirtelen nagy tömegű kézi munkaerőt igényel. A szerző három modellt vesz sorra: Spanyolországban a termelés illegális vagy bizonytalan jogi státuszú migránsokra épül, ezért indult idén legalizációs program; Lengyelország agrárcsodája egymilliós ukrán munkaerőre támaszkodik; Németországban pedig szervezettebb, évi 250-300 ezer fős, főként kelet-európai szezonális rendszer működik."},{"cim":"„Migráns” – a meghaladhatatlan ellenségkép","url":"https://politicalcapital.hu/hirek.php?article_read=1&article_id=3709","forras":"Political Capital","datum":"2026-06-24","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Political Capital elemzése szerint a Tisza-kormány a kampányban ígért teljes vendégmunkásstopot nem tudta tartani, helyette részleges korlátozást vezetett be, amit két oldalról is bírálnak.","kulcsszavak":["kutatás és statisztika","vendégmunkás-stop","politika"],"het":"2026-06-22","id":"ART-0349","url_forras":"docx","kivonat":"A TISZA-kormány ugyanabba a vendégmunkás-csapdába lavírozhatja magát, amelyből az Orbán-kormány sem tudott kikecmeregni: a kampányban ígért teljes vendégmunkásstopot a realitásokkal szembesülve nem tudta tartani, helyette megkésve csak egyetlen jogcímet érintő, részleges behozatali korlátozást vezetett be, ami nehezíti, de nem lehetetleníti el a munkaerő-beáramlást. Vitatható a stop indoklása – „elvesziuk a magyarok munkáját”, „leszorítják a béreket”. Az elöregedő társadalomban a vendégmunkások hiányának komoly ára lehet a beruházások, a növekedés és az adóbevételek terén, miközben a kormányt két oldalról is támadják: a Mi Hazánk a „kiskapuk” nyitva hagyását, a gazdasági szereplők a szigorítást bírálják, a Fidesz pedig azzal riogat, hogy a Fülöp-szigeteki behozatal leállítása után muszlim pakisztániak fogják elárasztani Magyarországot."},{"cim":"Tényleg nincs az országban elég ember, aki jó fizetésért hajlandó lenne dolgozni a vendégmunkások helyett?","url":"https://hvg.hu/360/20260624_premium-hirlevelek-adatbanyasz-vendegmunkas-munka-fizetes-munkaerotartalek","forras":"HVG","datum":"2026-06-24","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A KSH szerint a potenciális munkaerő-tartalék 312 ezer fő, de területileg egyenlőtlenül oszlik el; a fő veszély demográfiai, mert a nyugdíjba vonuló korosztályokat a Z generáció létszámban nem tudja pótolni.","kulcsszavak":["KSH","munkaerő-tartalék","demográfia","vendégmunka"],"het":"2026-06-22","id":"ART-0350","url_forras":"docx","kivonat":"Tényleg nincs-e elég magyar, aki jó fizetésért elvállalná a szalagmunkát? Ezt a kérdést járja körül a HVG cikke. A KSH 2026 első negyedévi adatai szerint a potenciális munkaerő-tartalék 312 ezer fő, ám ezek területileg egyenlőtlenül oszlanak el – a Dunántúl szerencsésebb megyéiben szinte mindenki dolgozik, miközben a legtöbb tartalék Északkelet-Magyarországon van, így a Master Good kisvárdai vezetője által felvázolt probléma valójában inkább a nyugati cégeket sújtja, és kérdés, mekkora béremelés mozdítana meg embereket. A fő veszély demográfiai: a dolgozó magyarok száma két és fél éve csökken, és bár a Z generáció gyorsan beáramlik a piacra, a nyugdíjba vonuló korosztályok létszámban pótolhatatlanok – amikor pedig az 1970-es években születettek elkezdenek kilépni, akkora hiány lesz, amit reálisan csak vendégmunkásokkal lehet betölteni."},{"cim":"Megjött a fiatalok által leginkább várt adat – kiderült, mekkora az idei átlagos órabérre számíthatnak a diákmunkások","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/06/diakmunka-oraber","forras":"Világgazdaság","datum":"2026-06-23","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Profession.hu szerint az átlagos diákmunka-órabér idén bruttó 2180 forint, 4,6%-os növekedéssel; a diákmunka egyre inkább egész éves erőforrássá és a munkaerőpiacra való belépővé válik.","kulcsszavak":["Profession.hu","diákmunka","bérek","pályakezdők"],"het":"2026-06-22","id":"ART-0351","url_forras":"docx","kivonat":"A Profession.hu adatai szerint a hirdetésekben feltüntetett átlagos diákmunka-órabér idén bruttó 2180 forint, ami a 25 év alatti fiataloknál a szja-kedvezmény miatt a nettó keresettel is megegyezik, és 4,6%-os növekedést jelent a tavalyihoz képest. A cégek diákmunka iránti igénye egyre kevésbé szezonális, a legtöbb lehetőséget a vendéglátás (a hirdetések közel 20%-a), majd az adminisztráció (13%) kínálja. A diákmunka egyre inkább egész éves erőforrássá és a munkaerőpiacra való belépővé válik, a Z generáció pedig a fizetés, a munkavégzés helye és a munkarend mellett értékeli a munkahelyi közösséget és a home office lehetőségét. A diákmunkás hirdetések több mint 85%-a tartalmaz bérinformációt, szemben az összes álláshirdetés negyedével."},{"cim":"Váratlan javulás a magyar munkaerőpiacon","url":"https://www.portfolio.hu/gazdasag/20260625/varatlan-javulas-a-magyar-munkaeropiacon-845550","forras":"Portfolio","datum":"2026-06-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A májusi KSH-adatok szerint a foglalkoztatottak száma 4 millió 654 ezer főre nőtt, a munkanélküliségi ráta 4,3%-ra csökkent; egyetlen hónap alapján még korai trendfordulóról beszélni.","kulcsszavak":["KSH","foglalkoztatottság","munkanélküliség"],"het":"2026-06-22","id":"ART-0352","url_forras":"docx","kivonat":"A Portfolio gyorselemzése szerint a májusi KSH-adatok váratlan javulást mutatnak a magyar munkaerőpiacon: a foglalkoztatottak száma 4 millió 654 ezer főre nőtt, a munkanélküliségi ráta 4,5%-ról 4,3%-ra csökkent, és a gazdaságilag aktívak száma is emelkedett. A javulás a szűrt adatok alapján a hazai elsődleges munkapiac folyamataiból fakad, ami arra utal, hogy a korábbi gyenge számok nem csak demográfiai, hanem ciklikus okokra is visszavezethetők, így a gazdaság erősödése is belelátható az adatokba. Egyetlen hónap alapján azonban a cikk szerint még korai lenne megalapozottan trendfordulóról beszélni."},{"cim":"Meglepő fordulatot látnak az elemzők a magyar munkaerőpiacon: az egyik mutató drámaian megy lefelé – ez jelenti a legnagyobb veszélyt","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/06/munka-foglalkoztatottsag-munkaeropiac-ksh-elemzok","forras":"Világgazdaság","datum":"2026-06-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Elemzők szerint a munkaképes korú népesség egy év alatt 56 ezer fővel csökkent; a fordulat a gazdasági teljesítményen múlik, a legnagyobb hosszú távú veszélyt a demográfia jelenti.","kulcsszavak":["KSH","demográfia","foglalkoztatottság","kutatás és statisztika"],"het":"2026-06-22","id":"ART-0353","url_forras":"docx","kivonat":"Az elemzők szerint egyetlen hónap kedvező munkaerőpiaci adatai alapján még nem beszélhetünk tartós fordulatról. Molnár Dániel (MGFÜ) szerint a hazai létszámcsökkenés mögött a gyenge munkaerő-kereslet és a visszafogott növekedés áll, Regős Gábor (Gránit) a javulást részben az ipar és a nagyberuházások hatásának tulajdonítja, Virovácz Péter (ING) pedig a héthavi foglalkoztatási csúcs mellett is a növekedés kifulladására figyelmeztet. A közös üzenet, hogy a fordulat a gazdasági teljesítményen múlik, miközben a legnagyobb hosszú távú veszélyt a demográfia jelenti: a munkaképes korú népesség egy év alatt 56 ezer fővel csökkent, és egyre többen lépnek ki nyugdíjba, mint ahányan belépnek a piacra."},{"cim":"Lesújtó adatok érkeztek: öt magyarból kettőnek nincs semmilyen tartaléka","url":"https://www.economx.hu/magyar-gazdasag/2026/06/24/lesujto-adatok-erkeztek-ot-magyarbol-kettonek-nincs-semmilyen-tartaleka/","forras":"Economx","datum":"2026-06-24","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Provident Barométer szerint a magyar lakosság 59%-ának van tartaléka, de a fele legfeljebb három hónapig bírná jövedelem nélkül; a hónapról hónapra élők aránya 43%-ról 39%-ra csökkent.","kulcsszavak":["kutatás és statisztika","gazdasági kilátások","demográfia"],"het":"2026-06-22","id":"ART-0354","url_forras":"docx","kivonat":"A Provident Barométer felmérése szerint a magyar lakosság 59%-ának van tartaléka, ám a kép a számok mögött korántsem kedvező: a megtakarítók fele legfeljebb három hónapig, 21%-uk maximum egy hónapig tudná fenntartani magát jövedelme elvesztése esetén, és csak 16%-nak van egy évnél hosszabb időre elegendő vésztartaléka. A községekben élők 45%-a, a fővárosiak 74%-a, az érettségivel nem rendelkezők 33%-a, a felsőfokú végzettségűek 76%-a, a nők 50%-a, a férfiak 69%-a tud félretenni. A 200 ezer forint alatti háztartások 84%-a, de a 700 ezer feletti jövedelműek harmada is rendszeresen kifogy a pénzéből hó végére, ugyanakkor van enyhe javulás: a hónapról hónapra élők aránya tavaly októberhez képest 43%-ról 39%-ra csökkent."},{"cim":"Ez Orbán Viktor bukása előtt elképzelhetetlennek tűnt, de most Magyar Péternek is fájhat","url":"https://index.hu/gazdasag/2026/06/20/forint-forintarfolyam-forinterosodes-devizaarfolyam-magyar-peter-kormany-euroarfolyam-devizapiac-makrogazdasag/","forras":"Index","datum":"2026-06-20","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az erős forint sok exportőrnek fáj, mivel euróban számolt bérköltségük 10%-kal nőtt; egy MAPI-felmérés szerint a válaszadók felénél legalább felére csökkent a havi eredmény.","kulcsszavak":["gazdasági kilátások","adózás","beruházás"],"het":"2026-06-15","id":"ART-0355","url_forras":"docx","kivonat":"Az erős forint kétélű fegyver: a fogyasztóknak és az infláció letörésének kedvez, ám sok exportőrnek fáj, mivel forintban felmerülő bérköltségük euróban számolva nagyjából 10%-kal nőtt – egy MAPI-felmérés szerint a válaszadók felénél legalább 50%-kal csökkent a havi eredmény, 21%-uknál veszteségessé vált a működés –, és egyes feldolgozóipari cégek a szűkülő profitra hivatkozva visszafogottabb béremelést hajthatnak végre. Nem az a kérdés, erős vagy gyenge forint kell-e, hanem hogy a gazdaság képes-e versenyképes maradni egy tartósan gyenge deviza „doppingja” nélkül, miközben a cégeknek leginkább a kiszámíthatóság számít."},{"cim":"Minden magyar apa nagyot nyer azzal, ha megvalósul ez a három fontos reformjavaslat","url":"https://index.hu/belfold/2026/06/21/apak-napja-apa-akademia-szulesi-szabadsag-leder-laszlo/?token=b2affe9b94c6ac9690394f79e73c7a0f","forras":"Index","datum":"2026-06-21","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az Apa Akadémia három reformot sürget: az apai szülési szabadság egy hónapra bővítését, a váltott gondoskodás általánossá tételét és az apabarát szülészeti kultúra országos megerősítését.","kulcsszavak":["esélyegyenlőség","demográfia","gazdasági kilátások"],"het":"2026-06-15","id":"ART-0356","url_forras":"docx"},{"cim":"Minden ötödik magyar munkavállaló környezetéből fúrt már ki valakit az AI – Te biztonságban vagy?","url":"https://femina.hu/terasz/ai-mesterseges-intelligencia-magyar-munkahelyek-elbocsatas/","forras":"Femina","datum":"2026-06-25","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Egy 700 fős kutatás szerint a válaszadók 17,1%-a tud olyan ismerősről, aki AI vagy robotok miatt vesztette el állását; a férfiak több mint fele haladó AI-felhasználó, szemben a nők 22%-ával.","kulcsszavak":["AI","leépítés","nők a munkaerőpiacon","kutatás és statisztika"],"het":"2026-06-22","id":"ART-0357","url_forras":"docx","kivonat":"Egy 700 fős mintán készült új kutatás szerint az AI egyre látványosabban hat a magyar munkaerőpiacra: a válaszadók közel ötöde (17,1%) tud olyan ismerősről, aki a mesterséges intelligencia vagy robotok miatt veszítette el az állását, miközben Török Balázs szakértő szerint nem pusztán munkahelyek megszűnéséről van szó, hanem a munkakörök tartalmának és az elvárt készségeknek a gyors átalakulásáról. A felmérés feltárta a nemek közötti szakadékot is: a férfiak több mint fele (53%) vallja magát haladó vagy szakértő felhasználónak a nők 22%-ával szemben, a heti 10-40 órás időmegtakarítást elérők közt nyolcszor annyi a férfi, és többet is költenek AI-ra. A jelentés végül arra figyelmeztet, hogy az AI csak akkor teremt versenyelőnyt, ha tudás, gyakorlat és szervezeti támogatás társul hozzá – strukturált AI-képzést a nagyvállalatoknál már 68%, a kisebb cégeknél viszont csak 37% kapott."},{"cim":"Továbbra is nehéz itthon tartani a jövő autóipari mérnökeit","url":"https://profitline.hu/tovabbra-is-nehez-itthon-tartani-a-jovo-autoipari-mernokeit-488328","forras":"Profitline","datum":"2026-06-25","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder és az autopro.hu felmérése szerint a hazai elhelyezkedést tervező mérnökhallgatók 77%-a hajlandó belföldön költözni, de 65%-uk külföldi munkavállalással is számol a diploma után.","kulcsszavak":["Trenkwalder","pályakezdők","autóipar","demográfia"],"het":"2026-06-22","id":"ART-0358","url_forras":"talalt","kivonat":"A Trenkwalder és az autopro.hu közel 600 mérnökhallgató bevonásával készült felmérése szerint a jövő autóipari mérnökeit egyre nehezebb itthon tartani: a hazai elhelyezkedést tervezők 77%-a hajlandó a karrierért belföldön költözni, ám 65%-uk a diploma után külföldi munkavállalással is számol, és a hazai maradók kétharmadának bérigénye meghaladja a junior mérnökök jelenlegi, nagyjából nettó 600 ezer forintos kezdőfizetését. A hallgatók tudatosan készülnek a pályára – mindössze 28%-uk nem dolgozott még a diploma előtt, 86%-uk tervez mesterképzést –, a rugalmas, hibrid munkavégzést pedig alapelvárásnak tekintik, de a fizetésükből nem engednének érte. A felmérés üzenete a cégeknek, hogy a tehetségek megtartásához a versenyképes bér mellett a hibrid működés és a kiszámítható karrierút is kulcskérdéssé vált."},{"cim":"Megszűnő szakmák, 200 jelentkezésből nulla ajánlat – hogyan találnak most munkát a fiatalok?","url":"https://telex.hu/g7/elet/2026/06/26/palyakezdok-munkaeropiac-foglalkoztatas-ai-mesterseges-intelligencia","forras":"G7","datum":"2026-06-26","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A G7 cikke szerint a pályakezdők munkaerőpiaci helyzete romlik az AI terjedése miatt; szakértők szerint a gyakori munkahelyváltás nem hűtlenség, hanem racionális válasz a bizonytalan foglalkoztatásra.","kulcsszavak":["pályakezdők","AI","foglalkoztatottság"],"het":"2026-06-22","id":"ART-0359","url_forras":"docx","kivonat":"A G7 cikke a pályakezdő fiatalok romló munkaerőpiaci helyzetét járja körül: a gazdasági stagnálás, a növekvő munkanélküliség és az AI terjedése nyomán a belépő szintű, adminisztratív és szellemi pozíciók is szűkülnek, így a fiataloknak egyre tapasztaltabb jelöltekkel kell versenyezniük kevesebb állásért. Szakértők szerint a gyakori munkahelyváltás nem a Z generáció hűtlensége, hanem a bizonytalan foglalkoztatási formákra adott racionális válasz, hiszen a stabilitást a fiataloknak nem a lojalitás, hanem a megfelelő fizetés adja. A cikk négy fiatal történetével illusztrálja a helyzetet – kétszáz jelentkezésből nulla ajánlat, hatvan HR-interjú, megszűnő szakmák –, miközben figyelmeztet, hogy ha az AI miatt a fiatalok nem jutnak be a szervezetek alsó szintjeire, az hosszú távon súlyos utánpótlási krízist okozhat."},{"cim":"A vendégmunkásstop nem zárja ki, hogy külföldiek dolgozzanak a szegedi BYD-gyárban","url":"https://telex.hu/gazdasag/2026/06/26/a-vendegmunkas-stop-nem-zarja-ki-hogy-kulfoldiek-dolgozzanak-a-szegedi-byd-gyarban","forras":"Telex","datum":"2026-06-26","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A vendégmunkás-engedélyek leállítása nem zárja ki, hogy külföldiek dolgozzanak a szegedi BYD-gyárban, amely akár 20 ezer embernek adhat munkát; több jogcím továbbra is utat nyit a külföldi munkavállalóknak.","kulcsszavak":["autóipar","vendégmunkás-stop","toborzás"],"het":"2026-06-22","id":"ART-0360","url_forras":"docx","kivonat":"A vendégmunkás-engedélyek júniusi leállítása nem zárja ki, hogy külföldiek dolgozzanak a szegedi BYD-gyárban, amely Stella Li alelnök szerint akár 20 ezer embernek is munkát adhat. Bár a vármegyében másfél éve ötezer alatt van az álláskeresők száma és a térségben munkaerőhiány van, a gyár 2024 óta toboroz, eddig több mint 22 ezer önéletrajzot kapott, és az egyetemi-szakképzési együttműködések, valamint a szomszédos vármegyék és országok tartalékai is segíthetnek. A cikk részletezi, hogy a korábban kijelölt országokból (Fülöp-szigetek, Grúzia, Örményország) a már kiadott engedélyek érvényben maradnak és hosszabbíthatók, új vendégmunkás-engedély viszont nem adható ki – ám több jogcím (foglalkoztatási vagy beruházási célú tartózkodási engedély, céges áthelyezés, a szerbiai ingázókra vonatkozó Nemzeti Kártya) továbbra is utat nyit a külföldi munkavállalóknak, így a kampányretorikához képest a rendszer kevésbé tűnik szigorúnak."},{"cim":"WHC: túlélési útmutató a nyári home office-hoz","url":"https://ado.hu/munkaugyek/whc-tulelesi-utmutato-a-nyari-home-office-hoz/","forras":"Adó Online","datum":"2026-06-20","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szerint a nyári home office legnagyobb kihívása nem a munka mennyisége, hanem a figyelem töredezettsége; a megoldás a tudatos időbeosztás és a mélymunka reggeli időzítése.","kulcsszavak":["WHC","rugalmas foglalkoztatás","szezonális munka","munkajog"],"het":"2026-06-15","id":"ART-0361","url_forras":"talalt","kivonat":"A WHC szakértői a nyári home office kihívásairól adnak útmutatót: az iskolai szünetben a szülők figyelme munkaidőben folyamatosan megoszlik a feladatok és az otthon lévő gyerekek között, így a legnagyobb nehézséget nem a munka mennyisége, hanem a fókusz töredezettsége jelenti. A megoldás nem a munkaidő csökkentése, hanem a figyelem tudatos beosztása, a reális napi keretek és a rugalmas modellek, amelyek lehetővé teszik, hogy a mélymunka a legkevésbé zavart időszakokra essen. A cég tippjei közt szerepel a komplex feladatok kora reggeli időzítése, a kiszámítható elérhetőség és transzparens kommunikáció, a mikroszünetek beiktatása, valamint a hőség kezelése hűtött munkakörnyezettel és folyadékpótlással."},{"cim":"Diákmunka: akár bruttó 2500 forintos órabérrel is számolhatnak a fiatalok, az irodai munkák a legnépszerűbbek nyáron","url":"https://profitline.hu/diakmunka-akar-brutto-2500-forintos-oraberrel-is-szamolhatnak-a-fiatalok-az-irodai-munkak-a-legnepszerubbek-nyaron-488330","forras":"Profitline","datum":"2026-06-25","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A Job Force Iskolaszövetkezet szerint a nyári diákmunka átlagos bruttó órabére 2000-2500 forint, futárszolgálatoknál akár 5000 forint is lehet; a legkeresettebbek mégis az irodai munkák.","kulcsszavak":["Work Force","Job Force","diákmunka","bérek"],"het":"2026-06-22","id":"ART-0362","url_forras":"docx","kivonat":"A Job Force Iskolaszövetkezet összeállítása szerint júniusban felgyorsult a roham a nyári diákmunkákért, amelyek átlagos bruttó órabére 2000-2500 forint, de a futárszolgálatoknál akár az 5000 forintot is elérheti, és a fiatalok nyáron a tanévi havi 64 óráról 100-120 órára növelik a munkamennyiséget. A legtöbb diákot a vendéglátás, turizmus, kereskedelem és adminisztráció foglalkoztatja, a legkeresettebbek mégis az irodai munkák, a kereslet pedig főként a megyeszékhelyekre és nagyvárosokra koncentrálódik. Magony András vezető kiemelte, hogy a munkáltatók a kiszámíthatóságot és lojalitást, a fiatalok a rugalmasságot keresik, és egyre fontosabb utánpótlási csatornává válnak az átlagosan féléves gyakornoki programok, amelyek sikeres esetben teljes munkaidős állásajánlathoz vezethetnek."},{"cim":"Lehetünk több összeszerelő üzemnél? – Bod Péter Ákos és Major Gábor a magyar gazdaság jövőjéről","url":"https://kontroll.hu/cikk/gazdasag/2026/07/02/lehetuenk-toebb-oesszeszerelo-uezemnel-bod-peter-akos-es-major-gabor-a-magyar-gazdasag-joevojerol","forras":"Kontroll","datum":"2026-07-02","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Bod Péter Ákos közgazdász és Major Gábor, a Prohuman stratégiai igazgatója szerint Magyarország ütemet tévesztett: a folyamatos tanulás kultúrája nem épült ki, a kitörési pontot az AI-korszakhoz igazodó iparstratégiában látják.","kulcsszavak":["képzés","AI"],"het":"2026-06-29","id":"ART-0363","url_forras":"docx","kivonat":"A Kontroll.hu podcastjában Bod Péter Ákos közgazdász és Major Gábor, a Prohuman stratégiai igazgatója arról vitázott, hogy Magyarországnak munka- vagy tudásalapú társadalomra van-e szüksége. Mindketten úgy vélték, a korábbi munkaalapú modell a maga idejében indokolt volt, de az ország ütemet tévesztett: a folyamatos tanulás kultúrája nem épült ki, és Magyarország ma az EU-ban utolsó a felnőttképzési hajlandóságban. A vendégmunkáskérdést mindketten árnyaltan látják: a külföldi munkaerő aránya itthon mindössze 2% körüli, a klasszikus vendégmunkások száma 20 ezer alatti, a feszültséget pedig inkább a kommunikáció, mintsem a szabályozás okozza – a külföldre távozott magyarok tömeges hazahívását ugyanakkor Bod pótcselekvésnek tartja. A kitörési pontot az AI-korszakhoz igazodó ágazati iparstratégiában, az európai értékláncokban való feljebb lépésben és a természettudományos oktatás megerősítésében látják. Egyetértettek abban, hogy az automatizáció a fizikai és az egyszerű szellemi munkát is gyorsan átalakítja, ezért állam, vállalatok és egyének közös felelőssége, hogy a társadalom elmozduljon az élethosszig tartó tanulás irányába."},{"cim":"Ezzel a melóval most is bankot robbanthatsz: szinte bárhol állást találsz vele, a cégek itthon is egymásra licitálnak a dolgozókért","url":"https://www.penzcentrum.hu/karrier/20260701/ezzel-a-meloval-most-is-bankot-robbanthatsz-szinte-barhol-allast-talalsz-vele-a-cegek-itthon-is-egymasra-licitalnak-a-dolgozokert-1201182","forras":"Pénzcentrum","datum":"2026-07-01","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Izsó Balázs, a Prohuman operatív vezérigazgató-helyettese szerint a targoncavezetőkért erős verseny zajlik; a szakma néhány hetes tanfolyammal elsajátítható, további képzésekkel raktárvezetői szintig lehet előrelépni.","kulcsszavak":["munkaerőhiány","bérek"],"het":"2026-06-29","id":"ART-0364","url_forras":"docx","kivonat":"Továbbra is kiemelkedően keresettek a targoncavezetők, különösen a budapesti, Pest, Győr-Moson-Sopron és Komárom-Esztergom megyei ipari és logisztikai központokban – Izsó Balázs, a Prohuman Zrt. operatív vezérigazgató-helyettese szerint a tapasztalt, több géptípus kezelésében jártas szakemberekért erős verseny zajlik. A KSH szerint 2025-ben a bruttó átlagkereset havi 628 ezer forint körül alakult, de a régiók között akár 50%-os bérkülönbség is előfordul: hiányterületeken a 700 ezres bér sem ritka, míg Északkelet-Magyarországon 380–400 ezer forint az alapbér. A szakma gyorsan, néhány hetes tanfolyammal elsajátítható, és további képzésekkel (raktárkezelés, SAP, több géptípus) akár raktárvezetői szintig lehet előrelépni, ami a fizetés megduplázását is jelentheti. Külföldön, főleg Ausztriában, Németországban és Hollandiában szintén folyamatos a kereslet. A szakértők szerint az automatizáció rövid távon nem veszélyezteti az állásokat – a Prohuman vezetője szerint a hazai vállalatok többsége még messze van a teljesen automatizált működéstől –, hosszabb távon azonban a munkakör átalakulása várható."},{"cim":"A közepes jövedelem csapdájában: összeszerelő üzem helyett innováció kellene","url":"https://www.hrportal.hu/hr/a-kozepes-jovedelem-csapdajaban-osszeszerelo-uzem-helyett-innovacio-kellene-20260627.html","forras":"HR Portál","datum":"2026-06-27","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Zakor Sándor, a Prohuman elnöke a Business Summiton arról beszélt, hogy a poroszos oktatási rendszer lassan változtatható, de a felnőttképzés gyorsabban reformálható; a BMW debreceni gyárában 800 ezer órányi képzést tartottak.","kulcsszavak":["bérek","képzés"],"het":"2026-06-22","id":"ART-0365","url_forras":"docx","kivonat":"Magyarország a közepes jövedelem csapdájában van, a kitörési pont mindig a tudás és az innováció volt – mutatott rá Nagy Elek, az MKIK elnöke a Business Summiten. Zakor Sándor, a Prohuman elnöke arról beszélt, hogy a poroszos oktatási rendszer lassan változtatható, de a felnőttképzés gyorsabban reformálható – és a Z generáció már igényli is a fejlődési lehetőségeket. Bozsonyi Károly adattudós rámutatott: a munka melletti felnőttképzésben résztvevők 9,6%-os aránya mélyen az EU-átlag alatt van, évente 50-100 ezer fővel csökken a munkaerő, és a termelékenységen kell javítani. A BMW debreceni gyárában az elmúlt három évben 800 ezer órányi képzést tartottak 110 ezer résztvevőnek, a duális szakképzés keretein belül pedig 300 diákkal az ország legnagyobb technikusképzőjét hozták létre."},{"cim":"A globalizáció sokkja semmi lesz ahhoz képest, ha az óriásvállalatokra hagyjuk, mit kezdenek az új technológiákkal","url":"https://telex.hu/gazdasag/2026/06/27/dani-rodrik-interju-globalizacio-ipar-szolgaltato-szektor-munkahelyek-mesterseges-intelligencia","forras":"Telex","datum":"2026-06-27","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Dani Rodrik a Prohuman, az MKIK és a JVSZ konferenciája előtt elmondta: a jövő munkahelyei a szolgáltató szektorban lesznek, az AI kulcsszerepet játszhat az alacsonyan képzettek felemelésében.","kulcsszavak":["kutatás és statisztika","gazdasági kilátások"],"het":"2026-06-22","id":"ART-0366","url_forras":"docx","kivonat":"Dani Rodrik harvardi közgazdász a Prohuman, az MKIK és a JVSZ konferenciája előtt a Telexnek elmondta: a hiperglobalizáció véget ért, de az ipar már nem képes felemelni gazdaságokat – a jövő munkahelyei a szolgáltató szektorban lesznek. Ezek ma rossz munkahelyek, de ez nem törvényszerűség: más munkaszervezéssel, kormányzati ösztönzőkkel jobb körülmények és magasabb termelékenység érhető el. Az AI ebben kulcsszerepet játszhat, mert – ellentétben a robotokkal – képessé teheti az alacsonyan képzetteket magasabb szintű feladatok elvégzésére. Magyar Péter miniszterelnöknek azt tanácsolná: a külföldi befektetők önmagukban nem elegendők, új stratégiára van szükség."},{"cim":"Megállíthatatlan a BMW, nőttek a kölcsönzők, tovább csökkent az Aldi","url":"https://www.hrportal.hu/hr/megallithatatlan-a-bmw-nottek-a-kolcsonzok-tovabb-csokkent-az-aldi-20260629.html","forras":"HR Portál","datum":"2026-06-29","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Az Opten adatai szerint áprilisban a Prohuman 251, a WHC 220 fővel növelte állományát; a debreceni BMW-gyár is tovább bővült, míg az Aldinál 16 hónapja folyamatosan csökken a létszám.","kulcsszavak":["autóipar","foglalkoztatottság","munkaerő-kölcsönzés"],"het":"2026-06-29","id":"ART-0367","url_forras":"docx","kivonat":"Az Opten és a HR Portál adatai szerint áprilisban, a választás hónapjában minimális volt a létszámmozgás a legnagyobb hazai foglalkoztatóknál, mindössze öt cégnél volt 100 fő feletti változás. A legnagyobb bővülést a két HR-szolgáltató érte el: a Prohuman 251, a WHC 220 fővel növelte állományát, ami jellemzően a kölcsönzött munkaerő iránti megnövekedett igényt jelzi. Töretlenül bővül a debreceni BMW-gyár is (+206 fő, összesen már közel 5 ezer dolgozó), és a nyári szezonra készülő Danubius Hotels is 173 fővel erősített. Az Aldinál viszont 16 hónapja folyamatosan csökken a létszám: 2025 januárja óta 1501 fővel, 4403-ra zsugorodott a csapat."},{"cim":"Krízistől tart a mezőgazdaság a vendégmunkásstop miatt","url":"https://24.hu/fn/gazdasag/2026/07/02/vendegmunkasstop-mezogazdasag-azsiai-dolgozok-24extra/","forras":"24.hu","datum":"2026-07-02","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkásstop miatt a mezőgazdaság krízistől tart; a MOSZ szerint bizonyos állattartási és kertészeti munkákra nincs magyar jelentkező, és 20-30%-kal több munkáskézre lenne szükség.","kulcsszavak":["agrárium","vendégmunkás-stop","munkáltatói szövetség","munkaerőhiány"],"het":"2026-06-29","id":"ART-0368","url_forras":"docx","kivonat":"A vendégmunkásstop miatt a magyar mezőgazdaság krízistől tart: bár a legjellemzőbb agrár-foglalkoztatási formák elvben elérhetők maradnak, a kormányzati kommunikáció bizonytalansága miatt a termelők (köztük a MasterGood és a FruitVeb) a termelés ellehetetlenülésétől félnek. Koncz Máté (MOSZ) szerint bizonyos állattartási és kertészeti munkákra nincs magyar jelentkező – nem a bér, hanem a munka vonzerejének hiánya miatt –, és 20–30 százalékkal több munkáskézre lenne szükség. Egy minisztériumi egyeztetésen az ágazati szereplők egybehangzóan hangsúlyozták: a külföldi munkaerő nem a magyar dolgozókat váltja ki, hanem a be nem tölthető pozíciókat pótolja."},{"cim":"Színház volt az egész: hiába a vendégmunkásstop, özönlenek Magyarországra a Fülöp-szigetekiek, itt a bizonyíték – így trükközik a Tisza-kormány","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/vendegmunkasstop-fulop-szigetek-magyar-peter","forras":"Világgazdaság","datum":"2026-07-03","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkásstop ellenére továbbra is toboroznak Fülöp-szigetekieket Magyarországra, mert a rendelet csak a minősített kölcsönzők gyorsított eljárására vonatkozik, a foglalkoztatási célú engedély elérhető marad.","kulcsszavak":["vendégmunkás-stop","vendégmunka","toborzás","agrárium"],"het":"2026-06-29","id":"ART-0369","url_forras":"docx","kivonat":"A vendégmunkásstop ellenére továbbra is toborozzák a Fülöp-szigetekieket Magyarországra – az ottani Peridot International oldalán a tiltás óta több magyar álláshirdetés is megjelent. A magyarázat jogi: a rendelet csak a vendégmunkás-engedélyekre és a minősített magyar kölcsönzők gyorsított eljárására vonatkozik, a foglalkoztatási célú tartózkodási engedély viszont továbbra is elérhető. Csizmadia Gábor (MMKOSZ) szerint a szabályozás lényegében csak a magyar kölcsönzőket zárja ki. A munkaadók élesen bírálják a döntést: a Master Good jelezte, hogy 120 milliárdos új gyárát nem építi fel, ha nem hozhat be vendégmunkásokat."},{"cim":"A munkaerő-piaci migráció korlátozása rosszat tesz a magyar gazdaságnak","url":"https://qubit.hu/2026/07/03/a-munkaero-piaci-migracio-korlatozasa-rosszat-tesz-a-magyar-gazdasagnak","forras":"Qubit","datum":"2026-07-03","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Három szakértő szerint külföldi munkaerőre nemcsak fizikai munkáknál van szükség, hanem magasan kvalifikált területeken is; a legnagyobb gondnak az átláthatatlan szabályozást tartják.","kulcsszavak":["vendégmunka","IT","munkajog","Gi Group"],"het":"2026-06-29","id":"ART-0370","url_forras":"docx","kivonat":"A Tisza-kormány egyeztetés nélkül szigorította a vendégmunkások foglalkoztatását, miközben a 2010 óta kivándorolt közel 400 ezer magyar munkaerejét pótolni kell. Három szakértő – Varga Szilvia (Settlers), Ürögdi Barbara (Helpers) és Gáspár Gergely (Gi Group) – egyetért abban, hogy külföldi munkaerőre nemcsak a fizikai munkáknál van szükség, hanem a magasan kvalifikált területeken (IT, mérnöki, szolgáltatóközpontok) is, ahol a külföldi dolgozó gyakran a beruházás feltétele, nem a magyarok kiszorítója. A legnagyobb gondnak az átláthatatlan szabályozást és a három országra szűkített engedélylistát tartják. Javaslatuk: a kérdést gazdasági, ne politikai ügyként kezeljék, és a valós munkaerőigényre épülő, kiszámítható rendszert alakítsanak ki."},{"cim":"Valóban nincs bevethető magyar munkaerő, vagy a jelenlegi foglalkoztatási keretek rugalmatlanok?","url":"https://turizmus.com/cikk/business-travel/valoban-nincs-bevetheto-magyar-munkaero-vagy-a-jelenlegi-foglalkoztatasi-keretek-rugalmatlanok","forras":"Turizmus.com","datum":"2026-06-30","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Giggle alapítói szerint a „nincs bevethető magyar munkaerő” állítás téves, mert csak a teljes munkaidős modellben gondolkodik; a részmunkaidős foglalkoztatás aránya itthon mindössze 4,8%.","kulcsszavak":["Giggle","munkaerő-kölcsönzés","rugalmas foglalkoztatás","munkaerő-tartalék"],"het":"2026-06-29","id":"ART-0371","url_forras":"docx","kivonat":"A Giggle alapítói, Birizdó Ádám és Sebestyén Ádám elemzésükben azt állítják: a „nincs bevethető magyar munkaerő” kijelentés téves, mert csak a teljes munkaidős modellben gondolkodik. A 2026-os Gig Economy Report szerint a magyar felnőttek 20%-a szeretne rugalmas többletjövedelmet, miközben a részmunkaidős foglalkoztatás aránya itthon mindössze 4,8 százalék, szemben az uniós 18,6 százalékos átlaggal. A 436 ezer forintos mediánbér mellett heti egyetlen extra munkanap havi 100 ezer forintos, legalább 20 százalékos keresetnövelést jelenthet. A szerzők szerint a feladatalapú foglalkoztatás csökkenti a betanulási időt és az elköteleződést, a vállalatoknak gyorsabb kapacitásbővítést tesz lehetővé, egyúttal belépési pontot kínálhat a munkaerőpiacról kiszorulóknak – az inaktivitás ma mintegy egymillió munkaképes korú magyart érint."},{"cim":"Mítosz vagy valóság – tényleg kevesen vannak a STEM-diplomás nők Magyarországon?","url":"https://ictglobal.hu/hr/oktatas/mitosz-vagy-valosag-tenyleg-kevesen-vannak-a-stem-diplomas-nok-magyarorszagon/","forras":"ICT Global","datum":"2026-07-02","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az Eurostat szerint a STEM-diplomás nők aránya Magyarországon 2025-re 4,8%-ra nőtt, ami továbbra is az EU egyik legalacsonyabb értéke, szemben az uniós 6,1%-os átlaggal.","kulcsszavak":["képzés","nők a munkaerőpiacon","kutatás és statisztika","pályakezdők"],"het":"2026-06-29","id":"ART-0372","url_forras":"docx","kivonat":"Az Eurostat adatai szerint a STEM-diplomás foglalkoztatott nők aránya az EU-ban lassan, de folyamatosan nő: 2021 és 2025 között az uniós átlag 5,5-ről 6,1 százalékra emelkedett. Magyarország jóval alacsonyabb szintről indult – 2021 és 2023 között 3,9 százalékon stagnált, majd 2025-re 4,8 százalékra kúszott fel –, de az ország továbbra is az EU egyik legalacsonyabb értékével bír. Az élen a balti és északi országok állnak (8–10%), de a fejlettség önmagában nem magyarázza az arányokat: Hollandia és Csehország meglepően alacsony, Bulgária és Lengyelország viszont előkelő helyen áll. A cikk figyelmeztet, hogy az arányokat óvatosan kell értelmezni, hiszen a népességfogyás, a migráció és a képzési átfutási idő is torzíthat."},{"cim":"Berobbant a diákmunkaszezon: már a 3500 forintos órabér sem ritka – mutatjuk, hol fizetnek a legtöbbet","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/06/diakmunkaszezon-oraber-diakszovetkezetek-munkakor","forras":"Világgazdaság","datum":"2026-06-29","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A nyári diákmunkaszezonban az átlagos órabér 2000-2500 forint, speciális tudást igénylő pozíciókban 3000-3500 forint is elérhető; a diákokért egyre nagyobb a verseny a munkáltatók között.","kulcsszavak":["diákmunka","bérek","gazdasági kilátások"],"het":"2026-06-29","id":"ART-0373","url_forras":"docx","kivonat":"Teljes gőzzel beindult a nyári diákmunkaszezon: a legnagyobb diákszövetkezeteknél több száz állás érhető el, az átlagos órabér 2000–2500 forint között mozog, de a speciális tudást igénylő pozíciókban már a 3000–3500 forintos órabér sem ritka. A legjobban az informatikai és mérnöki gyakornokok kereshetnek, míg a klasszikus nyári munkák – gyorséttermek, kereskedelem, logisztika – továbbra is széles körben elérhetők, jellemzően 2000–2800 forintos bérekkel. A diákokért egyre nagyobb a verseny: a munkáltatók rugalmas beosztással, pótlékokkal és hosszú távú lehetőségekkel csábítják a fiatalokat, akik iskolaszövetkezeten keresztül, 25 év alatt adómentesen kereshetnek. A 3000 forintos órabér havi szinten már bruttó 504 ezer forintot jelent, ami a nemzetgazdasági átlagkereset mintegy 65 százaléka."},{"cim":"Megszólalt a szakértő: ennyi fizetést vihetnek haza az idén nyáron dolgozó diákok","url":"https://www.baon.hu/helyi-kozelet/2026/06/nyari-diakmunka-kecskemet","forras":"Baon","datum":"2026-06-27","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Meló-Diák szerint a bérek a bruttó 1856 forintos minimum órabértől 2300-2500 forintig terjednek; a legnépszerűbb területek a vendéglátás, raktári munkák és árufeltöltés.","kulcsszavak":["Meló-Diák","diákmunka","bérek","szezonális munka"],"het":"2026-06-22","id":"ART-0374","url_forras":"docx","kivonat":"A Rádió 1 Gong műsorában Fábián Dorina, a Meló-Diák diákprojektvezetője beszélt a nyári diákmunka-piacról: idén is sokan keresnek munkát, és a munkáltatói oldalon is nőtt az igény, folyamatosan jelennek meg új pozíciók. Diákmunka 15 éves kortól vállalható (nyáron), 16 évesen már tanév közben is, 18 év alatt szülői beleegyezéssel és korlátozott munkaidőben. A bérek a bruttó 1856 forintos minimum órabértől 2300–2500 forintig terjednek, este 6 után 30 százalékos műszakpótlék járhat, a 25 év alattiak adókedvezménye miatt pedig a bruttó bér megegyezhet a nettóval. A legnépszerűbb területek a vendéglátás, a raktári és üzemi munkák, valamint az árufeltöltés – előképzettségre a legtöbb helyen nincs szükség."},{"cim":"Száguldanak a magyar fizetések euróban, és sok cég nagyon nem örül ennek","url":"https://telex.hu/g7/penz/2026/06/29/forint-erosodes-munkaero-koltseg-termelekenyseg","forras":"G7","datum":"2026-06-29","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A forint erősödése miatt a márciusi átlagbér euróértéke három hónap alatt 11%-kal, 2235 euróra nőtt, ami komoly kihívás az exportáló vállalatoknak, mivel az olcsó munkaerő eddig versenyelőnyt jelentett.","kulcsszavak":["gazdasági kilátások","adózás"],"het":"2026-06-29","id":"ART-0375","url_forras":"docx","kivonat":"A forint az elmúlt hetekben öt éve nem látott szintre, egy ponton 350 alá erősödött az euróval szemben, ami euróban kifejezve jelentősen megdrágítja a magyar munkaerőt: a márciusi átlagbér euróértéke három hónap alatt 11 százalékkal, 2235 euróra nőtt, és Magyarország több uniós országot is megelőzött a bérek terén. Ez komoly kihívás az exportáló, euróban elszámoló vállalatoknak, hiszen az ország versenyképességének eddig egyik alapja az olcsó munkaerő volt, miközben a termelékenység növekedése regionális összevetésben elmaradt a bérek felzárkózásától. A forinterősödés ugyanakkor a magas importhányaddal dolgozó, belföldre termelő kkv-knak kedvezhet. Ha az árfolyam tartósan erős marad, még sürgetőbbé válik az összeszerelőüzem-modell leváltása és a magas hozzáadott értékű tevékenységek támogatása."},{"cim":"Fizetések: vége a holtversenynek, előzött a XII. kerület - Nézze meg térképen a legfrissebb nettókat!","url":"https://hvg.hu/gazdasag/20260628_ber-kereset-fizetes-ksh-medianber-jaras","forras":"HVG","datum":"2026-06-28","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH szerint csökkentek a területi bérkülönbségek: a XII. kerület vezet 561 ezer forintos mediánbérrel, a Sarkadi járás áll a lista végén 296 ezer forint alatti értékkel.","kulcsszavak":["KSH","bérek","régiós különbségek"],"het":"2026-06-22","id":"ART-0376","url_forras":"docx","kivonat":"A HVG által kikért KSH-adatok szerint 2026 első negyedévében csökkentek a területi bérkülönbségek: míg tavaly több mint kétszeres volt az eltérés a legmagasabb és legalacsonyabb nettó mediánbérű térségek között, idén már \"csak\" 1,9-szeres. Az élen a budapesti XII. kerület áll, amely közel 561 ezer forintos mediánbérrel elhúzott a II. kerület (550 ezer forint) mellett, a sereghajtó pedig a Sarkadi járás 296 ezer forint alatti értékkel. A felzárkózást segítette, hogy több hátrányos helyzetű járás – köztük a Cigándi, a Szikszói és a Gönci – 20 százalék feletti bérnövekedést ért el egy év alatt."},{"cim":"Kiderült, melyik diploma éri a legtöbbet: több tízmillió forinttal is többet kereshetsz életed során, ha ezt a szakot választod","url":"https://www.penzcentrum.hu/oktatas/20260702/kiderult-melyik-diploma-eri-a-legtobbet-tobb-tizmillio-forinttal-is-tobbet-kereshetsz-eleted-soran-ha-ezt-a-szakot-valasztod-1201303","forras":"Pénzcentrum","datum":"2026-07-02","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A magyar Diplomás Pályakövetési Rendszer szerint az államtudományi, műszaki és informatikai végzettségűek keresnek legjobban pályakezdőként, a legalacsonyabb bérek a művészeti szakokhoz kötődnek.","kulcsszavak":["pályakezdők","bérek","kutatás és statisztika"],"het":"2026-06-29","id":"ART-0377","url_forras":"docx","kivonat":"Az Institute for Fiscal Studies friss brit kutatása szerint nem minden diploma jelent automatikusan anyagi előnyt: bár a diplomások átlagosan mintegy 100 ezer fonttal keresnek többet életük során, az orvosi végzettség akár 400 ezer fontos többletet is hozhat, míg egyes művészeti, nyelvi és filozófiai szakok elvégzése akár veszteséges is lehet. A magyar Diplomás Pályakövetési Rendszer adatai hasonló képet mutatnak: a legjobban az államtudományi, műszaki és informatikai végzettségűek keresnek pályakezdőként, a legalacsonyabb bérek pedig a művészeti szakokhoz kötődnek – a különbség hosszú távon több tízmillió forintra is rúghat. A szakértők ugyanakkor hangsúlyozzák, hogy a szakválasztást nem csak a várható fizetés motiválja, a bölcsész- és művészeti képzések társadalmilag fontos területeket szolgálnak ki."},{"cim":"Leesik az állad: ennyit keres egy stewardess 2026-ban Magyarországon","url":"https://www.penzcentrum.hu/karrier/20260702/leesik-az-allad-ennyit-keres-egy-stewardess-2026-ban-magyarorszagon-1201458","forras":"Pénzcentrum","datum":"2026-07-02","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH szerint 2025-ben az utaskísérők bruttó átlagfizetése havi 768 ezer forint volt; a bekerülés feltételei szigorúak, de a képzést a légitársaságok biztosítják néhány hét alatt.","kulcsszavak":["munkaerőhiány","bérek","KSH","turizmus"],"het":"2026-06-29","id":"ART-0378","url_forras":"docx","kivonat":"A légiutas-kísérői munka sokak számára vonzó a nemzetközi környezet és az utazási lehetőségek miatt, de a valóság összetettebb: az utasok kiszolgálása mellett a biztonságért felelnek, vészhelyzetben elsősegélyt nyújtanak, és kiszámíthatatlan, ünnepnapokat sem kímélő beosztásban dolgoznak. A bekerülés feltételei szigorúak – a Wizz Airnél például angol nyelvtudás, úszástudás, minimális magasság és látható tetoválás hiánya is elvárás –, a képzést viszont a légitársaságok maguk biztosítják, néhány hét alatt. A KSH szerint 2025-ben az utaskísérők bruttó átlagfizetése havi 768 ezer forint volt, amit utazási kedvezmények és egyéb juttatások egészítenek ki, karrierútként pedig akár a pilótaképzés is elérhető. Cserébe a szakma fizikailag és mentálisan is megterhelő, a felborult bioritmus hosszú távon az egészségre is hathat."},{"cim":"Napi 18 ezer forintért toboroznak idénymunkást a magyar földekre: kemény meló, szállást is adnak","url":"https://www.penzcentrum.hu/karrier/20260627/napi-18-ezer-forintert-toboroznak-idenymunkast-a-magyar-foldekre-kemeny-melo-szallast-is-adnak-1201205","forras":"Pénzcentrum","datum":"2026-06-27","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Napi 18 ezer forintos fizetéssel és szállással toboroznak idénymunkásokat a magyar földekre; a toborzás hátterében az agrárium súlyosbodó munkaerőhiánya és a vendégmunkás-szabályok szigorítása áll.","kulcsszavak":["szezonális munka","agrárium","toborzás","vendégmunka"],"het":"2026-06-22","id":"ART-0379","url_forras":"docx"},{"cim":"Visszaütött az erős forint – tömegesen rúgja ki dolgozóit az egyik legnagyobb magyar cég","url":"https://www.vg.hu/penz-es-tokepiac/2026/06/richter-elbocsatas-forint-egeszsegugy","forras":"Világgazdaság","datum":"2026-06-26","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Richter Gedeon csoportos létszámcsökkentést jelentett be a hatóanyag-gyártási területen; az erős forint az árfolyamhatás miatt több mint 7 százalékponttal vetette vissza a bevételeket.","kulcsszavak":["egészségügy","leépítés","gazdasági kilátások"],"het":"2026-06-22","id":"ART-0380","url_forras":"talalt","kivonat":"A Richter Gedeon csoportos létszámcsökkentést jelentett be, amely elsősorban a hatóanyag-gyártási területet érinti – a lépést a vállalat a versenyképesség megőrzésével és költséghatékonysági projektekkel indokolta. A háttérben az erős forint áll: az év eleji forintrali jelentősen rontotta a döntően exportra termelő gyógyszergyártó forintban kifejezett eredményeit, az árfolyamhatás több mint 7 százalékponttal vetette vissza a bevételeket, az adózott eredmény pedig 4 százalékkal, 65,5 milliárd forintra csökkent. A tavaly év végén közel 12 ezer főt foglalkoztató társaság részvényei a bejelentésre eséssel reagáltak, a BUX indexet is alulteljesítve."},{"cim":"Tiszta vizet öntött a pohárba a MediaMarkt: kiderült, veszélyben vannak-e a magyar munkahelyek a kínai tulajdonos bejelentése után","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/mediamarkt-munkahelyek-jdcom-hazhozszallitas","forras":"Világgazdaság","datum":"2026-07-02","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A MediaMarkt Magyarország szerint a munkahelyek biztonsága kiemelt szempont marad a JD.com robotizációs bejelentése után; a cég 120 oktatási intézménnyel állapodott meg a futárok átképzéséről.","kulcsszavak":["kereskedelem","vendégmunka","automatizáció","képzés"],"het":"2026-06-29","id":"ART-0381","url_forras":"docx","kivonat":"A MediaMarkt Magyarország a Világgazdaságnak reagált a kínai JD.com – az anyavállalat egyik tulajdonosa – bejelentésére, amely szerint a cég mintegy 700 ezer futárának munkáját idővel robotok vehetik át. A magyar leányvállalat hangsúlyozta: működése a hazai piacra épül, a házhozszállítást szerződött partnerekkel biztosítja, a fejlesztések fókuszában pedig a gyorsabb kiszállítás és a magyar vásárlói igények állnak, miközben a munkahelyek biztonsága kiemelt szempont marad. A JD.com elnöke, Richard Liu szerint öt éven belül megszűnhetnek a szállítási költségek az automatizált raktárak, önvezető járművek és drónok révén, de a cél nem az elbocsátás: a cég 120 oktatási intézménnyel állapodott meg a futárok átképzéséről, elsősorban robotkarbantartói munkakörökre."},{"cim":"Megkérdezték a magyarokat, félnek-e, hogy a munkájukat elveszi az AI","url":"https://hvg.hu/tudomany/20260703_mesterseges-intelligencia-munkahelyek-megszunese-felelem-felmeres-magyar-munkavallalok","forras":"HVG","datum":"2026-07-03","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Az Europion kutatása szerint a magyar munkavállalók 82%-a nem félti állását az AI-tól; a vezetők és szellemi dolgozók jóval pesszimistábbak, 54%-uk számít munkaköre megszűnésére.","kulcsszavak":["IT","AI","mentális egészség","foglalkoztatottság"],"het":"2026-06-29","id":"ART-0382","url_forras":"docx","kivonat":"Az Europion friss kutatása szerint a magyar munkavállalók többsége nem félti az állását a mesterséges intelligenciától: 82% egyáltalán nem vagy inkább nem érzi helyettesíthetőnek a munkakörét, és 66% szerint a megszűnés veszélye sem fenyeget. A legnyugodtabbak az 50 év felettiek és a fizikai dolgozók, míg a vezetők és a szellemi munkát végzők jóval pesszimistábbak – előbbiek 54%-a számít munkaköre megszűnésére. A dolgozók 42%-a használ AI-t a munkájában, de csak 14% napi szinten; a leggyakoribb felhasználás az információgyűjtés, a szövegírás és a fordítás. A hatékonyságnövekedést többségük csak kis vagy közepes mértékűnek érzi, jelentősnek mindössze 17% tartja."},{"cim":"Felértékelődött a logisztikai tudás Magyarországon","url":"https://autopro.hu/logisztika/felertekelodott-a-logisztikai-tudas-magyarorszagon/1639838","forras":"Autopro","datum":"2026-07-01","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A logisztikai tudás iránti kereslet folyamatosan nő Magyarországon; a Magyar Logisztikai Egyesület képzésein több mint 600 aktív hallgató tanul, a digitalizáció miatt a kereslet a jövőben is fennmaradhat.","kulcsszavak":["logisztika","képzés","automatizáció"],"het":"2026-06-29","id":"ART-0383","url_forras":"docx","kivonat":"A logisztikai tudás iránti kereslet folyamatosan nő Magyarországon: a felsőoktatásban az ellátásilánc-menedzsment mesterszakra 2024-ben 681-en jelentkeztek, többségük levelező tagozatra, munka mellett. A Magyar Logisztikai Egyesület képzésein jelenleg több mint 600 aktív hallgató tanul, köztük pályakezdők, közép- és felsővezetők egyaránt – a népszerűséget elsősorban a gyakorlatorientált, vállalati szakemberek által tartott oktatás adja. Az ellátási láncok ismerete ma már nemcsak a logisztikusoknak, hanem beszerzőknek, termelési szakembereknek és vezetőknek is versenyelőnyt jelent, és az MLE szerint a digitalizáció és az automatizáció miatt a kereslet a következő években is fennmaradhat."},{"cim":"Az adatvezérelt HR is az üzleti döntéshozatalt támogatja","url":"https://ictglobal.hu/hr/az-adatvezerelt-hr-is-az-uzleti-donteshozatalt-tamogatja/","forras":"ICT Global","datum":"2026-07-01","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad Talent Trends kutatása szerint a cégek 82%-a már használ AI-t ügyfélkiszolgálásban; a prediktív analitika előre jelzi a fluktuációt és a készséghiányokat.","kulcsszavak":["Randstad","AI"],"het":"2026-06-29","id":"ART-0384","url_forras":"docx","kivonat":"A Randstad Talent Trends kutatása szerint a cégek 82 százaléka már használ AI-t ügyfélkiszolgálásban vagy belső folyamatokban, 65 százalékuk növeli a HR-technológiai befektetéseit, 87 százalékuk pedig a munkaerő agilitását tartja a versenyképesség kulcsának. A prediktív analitika már előre jelzi a fluktuációt, a készséghiányokat és a felmondási kockázatot, így a problémák megelőzhetők; a belső AI-asszisztensek – mint a K&H Kate nevű chatalapú megoldása – pedig gyorsítják az információáramlást. A szakértők ugyanakkor hangsúlyozzák: az AI csak tiszta, strukturált adatokra építve működik, ráadásul a HR-nek az EU AI Act és a GDPR szigorú környezetében az adatminőségért és az etikus működésért is felelnie kell."},{"cim":"Változó munka-tér-erő: Pusztító présbe hajszolja a dolgozókat a végtelen növekedés mítosza?","url":"https://www.hrportal.hu/hr/valtozo-munka-ter-ero-pusztito-presbe-hajszolja-a-dolgozokat-a-vegtelen-novekedes-mitosza-20260701.html","forras":"HR Portál","datum":"2026-07-01","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad 2026-os felmérése szerint a munkaadóknak csak 26%-a tervez létszámbővítést; egy HR-szakértő szerint a munkáltatók visszatértek az erőből történő irányításhoz, ami kiégéshez vezethet.","kulcsszavak":["Randstad","mentális egészség","rugalmas foglalkoztatás","munkáltatói márka"],"het":"2026-06-29","id":"ART-0385","kivonat":"Papp Tamás István HR-szakértő szerint a munkáltatók a 2026-os piaci lazulást kihasználva visszatértek az erőből történő irányításhoz: korlátozzák a home office-t, visszanyesik a wellbeing-programokat, és az egyre emelkedő teljesítményelvárásokat előszeretettel az AI-ra hivatkozva igazolják. A fordulatot az adatok is jelzik: a foglalkoztatás 65 ezerrel csökkent egy év alatt, a Randstad 2026-os hazai felmérése szerint pedig a munkaadóknak csak 26%-a tervez létszámbővítést, 17%-uk nem pótolja a távozókat, 12%-uk pedig kifejezetten leépítést fontolgat. A merev, munkáltató-dominanciájú visszarendeződés zsákutca: a folyamatosan emelt, elérhetetlen elvárások kiégéshez, csendes felmondáshoz és a munkaközösségek összeomlásához vezethetnek, a megoldás ehelyett a rugalmas, a dolgozói preferenciákat figyelembe vevő HR-rendszerek kiépítése lenne.","url_forras":"docx"},{"cim":"A kánikula a munkahelyeket sem kíméli","url":"https://piacesprofit.hu/cikkek/gazdasag/a-kanikula-a-munkahelyeket-sem-kimeli.html","forras":"Piac és Profit","datum":"2026-06-30","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szakértői szerint kánikulában a koncentráció és a csapaton belüli béke megőrzése a legnagyobb kihívás; a megoldás a rugalmas munkakezdés és a transzparens kommunikáció.","kulcsszavak":["WHC","mentális egészség","munkakörülmények","rugalmas foglalkoztatás"],"het":"2026-06-29","id":"ART-0386","url_forras":"talalt","kivonat":"A 35 fok feletti kánikula a munkahelyeken is új helyzetet teremt: a WHC szakértői szerint ilyenkor nem a feladatok mennyisége, hanem a koncentráció és a csapaton belüli béke megőrzése a legnagyobb kihívás. A megoldás nem a munkaidő csökkentése, hanem a rugalmas keretek – például az öltözködési szabályok átmeneti enyhítése vagy a korábbi munkakezdés –, valamint a transzparens kommunikáció és a munkavédelmi előírások betartása. A szakértők a \"termosztátháborúk\" kompromisszumos kezelését, mikroszünetek beiktatását és apró vezetői gesztusokat – jégkrémszünet, behűtött görögdinnye – is javasolnak a morál és a hatékonyság fenntartására."},{"cim":"Kecskeméti munkaerőpiac: indul az új Mercedes-gyáregység, tabutéma lett a vendégmunkások kérdése","url":"https://kecsup.hu/2026/07/kecskemeti-munkaeropiac-indul-az-uj-mercedes-gyaregyseg-tabutema-lett-a-vendegmunkasok-kerdese","forras":"KecsUP","datum":"2026-07-08","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Mercedes-Benz második kecskeméti gyáregysége 2500 munkahelyet teremt; a vendégmunkások kérdése tabutémává vált, a megkeresett nagyvállalatok közül csak egy válaszolt, névtelenül.","kulcsszavak":["autóipar","vendégmunka","toborzás"],"het":"2026-07-06","id":"ART-0387","url_forras":"docx","kivonat":"A KecsUP a Mercedes-Benz második kecskeméti gyáregységének július 13-i átadása kapcsán térképezi fel a helyi munkaerőpiacot. A vendégmunkások kérdése tabutémává vált: a megkeresett tíznél több nagyvállalat és munkaerő-kölcsönző közül csak egy válaszolt, névtelenül. Az új gyár 2500 munkahelyet teremt (az elsőben 4500-an dolgoznak), a Mercedes már tavaly ősztől toboroz és roadshow-t is szervezett a régióban, mivel a pozíciókat Kecskemét szűk vonzáskörzetéből nem lehet feltölteni – több helyi cégtől érkezett jelzés, hogy dolgozóik felmondtak és az autógyárhoz mentek. A vendégmunkás-szigorítás csak a munkaerő-kölcsönzőkön át érkező Fülöp-szigeteki dolgozókat érinti, miközben a térségben a munkanélküliség tovább csökkent: a Kecskeméti járásban egy év alatt 8,7%-kal."},{"cim":"Csendes válság terjed Magyarországon, ebbe a Fidesznek is beletört a bicskája","url":"https://index.hu/gazdasag/2026/07/08/demografia-valsag-nepessegfogyas-nyugdij-munkaero/","forras":"Index","datum":"2026-07-08","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman, MKIK és JVSZ rendezvényén Zakor Sándor szerint „a vihar nem jön, már itt van”; 2022 közepe óta egy Szeged méretű munkaképes korú lakosság tűnt el Magyarországról.","kulcsszavak":["demográfia","foglalkoztatottság"],"het":"2026-07-06","id":"ART-0388","url_forras":"docx","kivonat":"A magyar demográfiai válság már a jelen valósága: évente 50 ezerrel többen lépnek ki a munkaerőpiacról, mint ahányan belépnek, 2025-ben pedig 76 éves negatív rekord dőlt meg 72 ezer születéssel és 124 ezer halálozással. Virovácz Péter (ING) szerint 2022 közepe óta egy Szeged méretű munkaképes korú lakosság tűnt el, ami tartós bérnyomást jelent, és a gazdaság importált munkaerő nélkül nem működtethető – a Prohuman, MKIK és Joint Venture Szövetség rendezvényén Zakor Sándor úgy fogalmazott, „a vihar nem jön, már itt van\". György László közgazdász szerint viszont a probléma gyökere mélyebb: a bőkezű családtámogatás ellenére sem fordult meg tartósan a születésszám, mert a válság végső soron nem pénz-, hanem kapcsolatválság."},{"cim":"A jövő munkaerőpiacának kulcsa a szakképzés és az élethosszig tartó tanulás","url":"https://kaposvarmost.hu/hirek/kaposvari-hirek/2026/07/06/a-jovo-munkaeropiacanak-kulcsa-a-szakkepzes-es-az-elethosszig-tarto-tanulas.html","forras":"Kaposvár Most","datum":"2026-07-06","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Kaposvári Szakképzési Centrum a Prohuman, MKIK és JVSZ rendezvényének tanulságait összegzi: a demográfiai apadásra a válasz a szakképzés, a folyamatos készségfejlesztés és a tanulásra való nyitottság.","kulcsszavak":["képzés","demográfia"],"het":"2026-07-06","id":"ART-0389","url_forras":"docx","kivonat":"Ez a Kaposvári Szakképzési Centrum írása, amely a Prohuman, az MKIK és a Joint Venture Szövetség júniusi rendezvényének tanulságait a szakképzés szemszögéből összegzi. A demográfiai kihívásra – évi 50 ezres munkaerőpiaci apadásra – a résztvevők szerint a tudás, a szakképzés és a folyamatos készségfejlesztés a válasz, hiszen a gyorsan változó környezetben már nem elég egyetlen szakmát elsajátítani, a siker a tanulásra való nyitottságon és az olyan kompetenciákon múlik, mint a kommunikáció és a problémamegoldás. Nagy Elek MKIK-elnök hangsúlyozta, hogy a tudásalapú gazdaság a szakképzés, a felsőoktatás, az innováció és a felnőttképzés összehangolt fejlesztése nélkül elképzelhetetlen."},{"cim":"Szakmai javaslat került a kormány asztalára, teljesen új alapokra helyeznék a külföldiek foglalkoztatását","url":"https://www.portfolio.hu/gazdasag/20260707/szakmai-javaslat-kerult-a-kormany-asztalara-teljesen-uj-alapokra-helyeznek-a-kulfoldiek-foglalkoztatasat-848158","forras":"Portfolio","datum":"2026-07-07","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Szakértők átfogó reformjavaslatot dolgoztak ki a harmadik országbeliek foglalkoztatásáról: egy állampolgárságtól független, általános munkavállalási célú tartózkodási engedély bevezetését javasolják.","kulcsszavak":["munkajog","gazdasági kilátások","vendégmunka"],"het":"2026-07-06","id":"ART-0390","url_forras":"docx","kivonat":"Foglalkoztatók, érdekképviseletek, jogi, HR- és bevándorlási szakértők átfogó reformjavaslatot dolgoztak ki a harmadik országbeliek foglalkoztatásáról, amelyet több minisztériumhoz is eljuttattak. Álláspontjuk szerint a 2024-ben bevezetett, több mint egy tucat jogcímet tartalmazó idegenrendészeti rendszer annyira bonyolulttá vált, hogy módosítások helyett szerkezeti átalakításra van szükség. A javaslat fő eleme eg
