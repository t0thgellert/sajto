hu/karrier/20260731/kiderult-ekkora-fizetessel-mar-jomodunak-szamitasz-magyarorszagon-tagul-az-ollo-gazdag-es-szegeny-kozott-1203023","forras":"Pénzcentrum","datum":"2026-07-31","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH májusi adatai szerint a teljes munkaidőben dolgozók bruttó átlagkeresete 764 100 forint, a nettó 535 900 forint, a reálkeresetek egy év alatt 9 százalékkal nőttek, a bruttó mediánkereset viszont csak 615 600 forint. A jövedelmi ötödök közötti különbség csaknem ötszörös: az alsó kvintilis átlaga bruttó 323 ezer, a felsőé közel 1,6 millió forint. Százalékosan az alsó-középső csoportok bérei nőttek gyorsabban (a második kvintilisben 10,2, a legalsóban 9 százalékkal), forintban viszont a felső ötöd nyert legtöbbet: a 7,7 százalékos emelés náluk havi 113 ezer forintos pluszt jelentett.","kulcsszavak":["bérek","KSH"],"het":"2026-07-27","id":"ART-0443","url_forras":"docx","kivonat":"A KSH májusi adatai szerint a teljes munkaidőben dolgozók bruttó átlagkeresete 764 100 forint, a nettó 535 900 forint, a reálkeresetek pedig egy év alatt 9 százalékkal nőttek – a bruttó mediánkereset viszont csak 615 600 forint, vagyis a dolgozók fele el sem éri a nettó átlagbért. A jövedelmi ötödök közötti különbség csaknem ötszörös: az alsó kvintilis átlaga bruttó 323 ezer, a felsőé közel 1,6 millió forint, a bruttó 620 ezer forintos kereset pedig már a jobban kereső félbe sorol. Százalékosan az alsó-középső csoportok bérei nőttek gyorsabban (a második kvintilisben 10,2, a legalsóban 9 százalékkal), forintban viszont a felső ötöd nyert a legtöbbet: náluk a 7,7 százalékos emelés is havi 113 ezer forintos pluszt jelentett."},{"cim":"Így dolgoznak home officeból az élelmesek, miközben utazgatnak: itt a TOP10 úticél, ahol ezt legkönnyebben megteheted","url":"https://www.penzcentrum.hu/karrier/20260730/igy-dolgoznak-home-officebol-az-elelmesek-mikozben-utazgatnak-itt-a-top10-uticel-ahol-ezt-legkonnyebben-megteheted-1203138","forras":"Pénzcentrum","datum":"2026-07-30","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Az IWG negyedik Work from Anywhere Indexén 2026-ban Bangkok lett a legjobb workcation úti cél Tokió és Barcelona előtt, Budapest a hatodik helyen végzett a tízes mezőnyben. A kutatás szerint a munkavállalók 51 százaléka már rugalmas munkavégzést támogató cégnél dolgozik, 90 százalékuk szerint ez javította a munka-magánélet egyensúlyt, 80 százalékuk produktívabbnak érzi magát. Tízből nyolcan vonzóbbnak látnak egy állásajánlatot a WFA-lehetőség miatt, 62 százalék munkahelyet is váltana kedvezőbb feltételekért, 39 százalék egyértelműbb vállalati szabályokat vár.","kulcsszavak":["rugalmas foglalkoztatás","megtartás","kutatás és statisztika"],"het":"2026-07-27","id":"ART-0444","url_forras":"docx","kivonat":"Az IWG negyedik alkalommal közzétett Work from Anywhere Indexén 2026-ban Bangkok lett a legjobb workcation úti cél Tokió és Barcelona előtt, Budapest pedig a hatodik helyen tartotta magát a tízes mezőnyben – a rangsor az éghajlat, az internetminőség, a szálláskínálat, a közlekedés és a rugalmas munkaterek elérhetősége alapján értékel. A kutatás szerint a munkavállalók 51 százaléka már rugalmas munkavégzést támogató cégnél dolgozik, 90 százalékuk szerint ez javította a munka-magánélet egyensúlyt, 80 százalékuk pedig produktívabbnak érzi magát. HR-szempontból a megtartás a lényeg: tízből nyolcan vonzóbbnak látnak egy állásajánlatot a WFA-lehetőség miatt, 62 százalék munkahelyet is váltana kedvezőbb feltételekért, 39 százalék viszont egyértelműbb vállalati szabályokat vár."},{"cim":"Magyar Péter bezárta a kaput, nekiment a vendégmunkásoknak: máris visszaüthet a döntés","url":"https://www.economx.hu/magyar-gazdasag/2026/07/29/vendegmunkasok-magyar-peter-gyarak-byd-mercedes-catl-bmw/","forras":"Economx","datum":"2026-07-29","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A vendégmunkásokkal kapcsolatos kormányzati szigorítás akkor jött, amikor a szegedi BYD, a kecskeméti Mercedes és a debreceni BMW-CATL egyszerre futtatja fel termelését; a BYD-hez önmagában mintegy tízezer vendégmunkás behozatalát engedélyezte az előző kormány. A KSH adatai szerint júniusban 4,646 millióan dolgoztak, a munkanélküliségi ráta 4,4 százalék, a munkakeresés átlagos ideje 12,5 hónapra nőtt. A Randstad regionális vezetője mintegy négyszázezer fős elméleti tartalékot azonosít a fiatalok, az 55 év felettiek és a kistelepülésen élők körében, de ennek mozgósítását a lakhatás és a távolság korlátozza.","kulcsszavak":["vendégmunka","autóipar","munkaerő-tartalék","Randstad"],"het":"2026-07-27","id":"ART-0445","url_forras":"talalt","kivonat":"A Magyar-kormány vendégmunkásokkal kapcsolatos szigorítása akkor jött, amikor a szegedi BYD, a kecskeméti Mercedes és a debreceni BMW–CATL egyszerre futtatja fel a termelését – a BYD-hez önmagában mintegy tízezer vendégmunkás behozatalát engedélyezte az előző kormány. A KSH adatai szerint júniusban 4,646 millióan dolgoztak, a munkanélküliségi ráta 4,4 százalék, a munkakeresés átlagos ideje viszont 12,5 hónapra nőtt; a Randstad regionális vezetője mintegy négyszázezer fős elméleti tartalékot azonosít a fiatalok, az 55 év felettiek és a kistelepülésen élők körében, ennek mozgósítását azonban a lakhatás és a távolság korlátozza. A Business Festen a WHC, a Schaeffler, a Richter és a MOL vezetői is úgy nyilatkoztak, hogy a munkaerőtartalék egyetlen csoportja sem váltja ki teljes mértékben a vendégmunkásokat."},{"cim":"Generációk egymás között: Mit vár valójában a Z generáció?","url":"https://hrpwr.hu/cikk/generaciok-egymas-kozott-mit-var-valojaban-a-z-generacio","forras":"HRPWR","datum":"2026-07-30","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad kutatása szerint a magyar munkavállalók az idősebbektől soft skilleket, a fiatalabbaktól AI- és technológiai tudást tanulnak, a kölcsönös tanulás tehát már zajlik, csak strukturálatlanul. Gombos Brigitta szerint a Z generáció gyors visszajelzést és 6-12 hónapon belül látható karrierlépéseket vár, a fordított mentoring itthon még gyerekcipőben jár. A visszajelzési igény munkakör- és személyiségfüggő, a megoldás informális check-in az éves értékelés mellett.","kulcsszavak":["pályakezdők","képzés","megtartás","Randstad"],"het":"2026-07-27","id":"ART-0446","url_forras":"docx","kivonat":"A Randstad kutatása szerint a magyar munkavállalók az idősebbektől soft skilleket, a fiatalabbaktól AI- és technológiai tudást tanulnak, vagyis a kölcsönös tanulás már zajlik, csak strukturálatlanul. Gombos Brigitta szerint a Z generáció nem babzsákfotelt vár, hanem gyors visszajelzést és 6–12 hónapon belül is látható karrierlépéseket; a fordított mentoring itthon még gyerekcipőben jár. A kiválasztásban a sztereotípiák apró mondatokban bújnak meg, a visszajelzési igény pedig nem generációs, hanem munkakör- és személyiségfüggő – a megoldás informális check-in az éves értékelés mellett, nem helyett."},{"cim":"Home office a hőkupola alatt","url":"https://hrpwr.hu/cikk/home-office-a-hokupola-alatt","forras":"HRPWR","datum":"2026-07-30","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad „HR Trends Survey 2026” szerint a munkavállalók 70 százaléka a rugalmasságot tartja a legfontosabb munkahelyi vonzerőnek, a tartós nyári hőterhelés viszont fáradtságot, fejfájást és romló koncentrációt okoz azoknál, akiknek a lakása nem hűthető megfelelően. A döntést, hogy irodából vagy otthonról dolgozzanak, egyéni tényezők (albérlet, ingázás, közös terek eltérő hőérzete) befolyásolják. Györgyi József, az LG key account managere a 24-26°C körüli beállítást és az alacsony légáramlást ajánlja; a cikk gyártói szakértőre épülő, natív jellegű tartalom.","kulcsszavak":["rugalmas foglalkoztatás","mentális egészség","Randstad"],"het":"2026-07-27","id":"ART-0447","url_forras":"docx","kivonat":"A home office továbbra is alapelvárás – a Randstad „HR Trends Survey 2026\" szerint a munkavállalók 70 százaléka a rugalmasságot tartja a legfontosabb munkahelyi vonzerőnek –, a kánikulában viszont sok lakás nem hűthető megfelelően, a tartós hőterhelés pedig fáradtságot, fejfájást és romló koncentrációt okoz. Ilyenkor felértékelődhetnek a klímabiztos irodák, a döntést azonban egyéni tényezők (albérlet, ingázás, közös terek eltérő hőérzete) befolyásolják. Györgyi József, az LG key account managere a 24–26 °C körüli beállítást és az alacsony légáramlást ajánlja – az anyag erősen épít a gyártói szakértőre, natív jellegű."},{"cim":"Vissza a mókuskerékbe: Ezért vagyunk fáradtabbak nyaralás után","url":"https://www.hrportal.hu/hr/vissza-a-mokuskerekbe-ezert-vagyunk-faradtabbak-nyaralas-utan-20260727.html","forras":"HR Portál","datum":"2026-07-27","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szakértői szerint a szabadságról való hirtelen visszatérés a munkavállalót és a szervezet működését is megterheli: a kötetlen rutint egyik napról a másikra váltja fel a korai kelés és a szoros határidő, ami koncentrációs nehézséghez, motivációvesztéshez és ingerlékenységhez vezet. A cégek hibája, hogy az egyszerre visszatérő csapattagokat azonnal teljes kapacitással terhelik, ami túltelítettséget és több hibázást okoz. A WHC négy eszközt ajánl: puffernap a szabadság és az első munkanap között, priorizálás a mélymunka helyett, rövid csapat-szinkronizáció a távollét alatt történtekről, és könnyített első hét nagy prezentációk nélkül.","kulcsszavak":["mentális egészség","munkakörülmények","WHC"],"het":"2026-07-27","id":"ART-0448","url_forras":"talalt","kivonat":"A WHC szakértői szerint a szabadságról való hirtelen visszatérés nemcsak a munkavállalót terheli meg, hanem a szervezet működésében is fennakadást okozhat: a kötetlen rutint egyik napról a másikra váltja fel a korai kelés és a szoros határidő, ami koncentrációs nehézséghez, motivációvesztéshez és ingerlékenységhez vezet. A cégek azzal hibáznak, hogy az egyszerre visszatérő csapattagokat azonnal teljes kapacitással terhelik – ez túltelítettséget és több hibázást eredményez. A WHC négy eszközt ajánl: puffernap a szabadság és az első munkanap közé, priorizálás a mélymunka helyett az első napon, rövid csapat-szinkronizáció a távollét alatt történtekről, valamint könnyített első hét nagy prezentációk és kritikus határidők nélkül."},{"cim":"Sorra húzzák le a rolót a vendéglátóhelyek, lesújtó számok érkeztek","url":"https://haszon.hu/piacok/vendeglatohelyek-kocsma-kavezo/","forras":"Haszon","datum":"2026-07-29","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Az MBH Bank elemzése szerint 2019 és 2025 vége között több mint 9 ezer vendéglátóhely szűnt meg Magyarországon: az 51 ezres állomány 41 852-re, közel 18 százalékkal csökkent. Legnagyobbat az italüzletek, kávézók és szórakozóhelyek száma esett, 35 százalékkal, Budapesten minden ötödik egység eltűnt, a reálforgalom hat év alatt mindössze 1,4 százalékkal nőtt. Az energiaárak, az élelmiszer-infláció, a duplájára emelkedett átlagbér és a járvány előttinél 15-20 ezer fővel kisebb létszám együtt nyomja a szektort; a WHC szerint 2025-ben a fizikai munkaerőpiacon a kiskereskedelem és a szálloda-vendéglátás maradt a legmeghatározóbb ágazat.","kulcsszavak":["turizmus","leépítés","bérek","WHC"],"het":"2026-07-27","id":"ART-0449","url_forras":"docx","kivonat":"Az MBH Bank elemzése szerint 2019 és 2025 vége között több mint 9 ezer vendéglátóhely szűnt meg Magyarországon: az 51 ezres állomány 41 852-re, közel 18 százalékkal csökkent. Legnagyobbat az italüzletek, kávézók és szórakozóhelyek száma esett (-35%), Budapesten minden ötödik egység eltűnt, a reálforgalom hat év alatt mindössze 1,4 százalékkal nőtt – az energiaárak, az élelmiszer-infláció, a duplájára emelkedett átlagbér és a járvány előttinél 15–20 ezer fővel kisebb létszám együtt nyomja a szektort. A WHC szerint 2025-ben a fizikai munkaerőpiacon a kiskereskedelem és a szálloda-vendéglátás maradt a legmeghatározóbb ágazat."},{"cim":"Ezzel a melóval degeszre kereshetik magukat a magyar fiatalok: óránként 4000 forintot is fizetnek","url":"https://www.penzcentrum.hu/karrier/20260806/ezzel-a-meloval-degeszre-kereshetik-magukat-a-magyar-fiatalok-orankent-4000-forintot-is-fizetnek-1203503","forras":"Pénzcentrum","datum":"2026-08-06","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A diákmunka az elmúlt másfél évtizedben kinőtte a nyári kiegészítő kereset szerepét: a demográfiai olló miatt a cégek ma már junior kollégát keresnek a fiatalok közül, nem alkalmi diákmunkást. A Prodiák Iskolaszövetkezet elnöke, Tóth Rozália szerint a fordulópont 2015 körül volt, amikor megjelentek az irodai, ügyfélszolgálati és gyakornoki pozíciók. A bérezés a 2011-es bruttó 500–800 forintos órabérről mára bruttó 2200–2800 forintra nőtt, az informatikai és mérnöki gyakornoki helyeken pedig eléri a bruttó 3000–4000 forintot is. A piacot az e-kereskedelem és a logisztika felfutása, a digitalizáció és a home office iránti igény rajzolta át.","kulcsszavak":["diákmunka","bérek","pályakezdők"],"het":"2026-08-03","url_forras":"docx","id":"ART-0450","kivonat":"A diákmunka az elmúlt másfél évtizedben kinőtte a nyári kiegészítő kereset szerepét: a demográfiai olló miatt a cégek ma már nem „diákot”, hanem junior kollégát keresnek, és hosszú távú utánpótlásként tekintenek a fiatalokra. A fordulópontot a Prodiák Iskolaszövetkezet elnöke, Tóth Rozália 2015 köré teszi, amikor a fizikai munkák mellett megjelentek az irodai, ügyfélszolgálati és gyakornoki pozíciók. A bérezés nagyságrendekkel emelkedett: a 2011-es bruttó 500–800 forintos órabér mára bruttó 2200–2800 forint, az informatikai és mérnöki gyakornoki helyeken pedig eléri a bruttó 3000–4000 forintot is. A piacot átrajzolta az e-kereskedelem és a logisztika felfutása, a folyamatok digitalizációja, valamint a home office iránti igény is."},{"cim":"Árfolyamhajózás","url":null,"forras":"HVG","datum":"2026-08-06","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HVG idei nagyvállalati toplistáján a munkaerő-piaci szolgáltatók közül a Prohuman a 23. helyen áll, két pozícióval visszacsúszva a tavalyihoz képest. A cég 4845 főt foglalkoztat, ami 15 százalékos csökkenés az előző évhez mérve, míg a listán 20. WHC 5314 alkalmazottal szerepel. A legnagyobb munkaadó változatlanul a MÁV, mögötte az OTP és a Mol áll. A HVG a visszaesést az autó-, alkatrész- és akkumulátoripar gyengélkedésével magyarázza, mivel a kölcsönzött munkaerő iránti kereslet elsősorban ezekhez az iparágakhoz kötődik.","kulcsszavak":["kutatás és statisztika","autóipar","munkaerő-kölcsönzés","WHC"],"het":"2026-08-03","id":"ART-0451","kivonat":"A HVG idén is elkészítette a legnagyobb magyarországi cégek toplistáit árbevétel, nyereség, saját tőke és a foglalkoztatottak száma szerint. A legnagyobb munkaadók listáját változatlanul a MÁV vezeti, mögötte az OTP és a Mol áll, jóllehet mindkettőnél a dolgozók zöme külföldi érdekeltségeknél van. A munkaerő-piaci szolgáltatók közül a Prohuman a rangsor 23. helyén szerepel, két pozícióval visszacsúszva a tavalyihoz képest. A WHC ezen a listán a 20. helyen áll 5314 alkalmazottal. A Prohuman 4845 főt foglalkoztat, ami 15 százalékos csökkenés az előző évhez mérve – a mérséklődés jól illeszkedik abba a képbe, amelyet a HVG az autó-, alkatrész- és akkumulátoripar visszaeséséről fest, hiszen a kölcsönzött és kiszervezett munkaerő iránti kereslet elsősorban ezekhez az iparágakhoz kötődik.","url_keresve":2,"url_keresve_utoljara":"2026-10-26"},{"cim":"Hogyan lettünk HRKOMM arany díjazottak? – Publicis Groupe Hungary","url":"https://hrpwr.hu/cikk/hogyan-lettunk-hrkomm-arany-dijazottak-publicis-groupe-hungary","forras":"HRPOWER","datum":"2026-08-06","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HRPWR tizedik, jubileumi alkalommal hirdette meg a HRKOMM Awardot, a hazai HR-kommunikációs versenyt, amelynek idei főtámogatója a Prohuman. Az első nevezési határidő szeptember 7. Tavaly a Publicis Groupe Hungary „Walk for equality” kampánya nyerte a „Sokszínű és befogadó munkahely” kategóriát, amely a Budapest Pride útvonalát hozta be az iroda falai közé egy 24 órás, vezetői részvétellel megvalósult kezdeményezéssel. A díjazott ügynökség szerint a zsűrit nem a kreatív ötlet, hanem a valódi szervezeti beágyazottságból fakadó vállalati kiállás győzte meg.","kulcsszavak":["esélyegyenlőség","munkáltatói márka"],"het":"2026-08-03","url_forras":"docx","id":"ART-0452","kivonat":"Tizedik alkalommal, immár jubileumi kiadásában hirdette meg a HRPWR a HRKOMM Awardot, a hazai HR-kommunikációs megoldások első számú versenyét, amelynek idei főtámogatója a Prohuman. Az első nevezési határidő szeptember 7. Tavaly a Publicis Groupe Hungary „Walk for equality” kampánya a Budapest Pride útvonalát az iroda falai közé hozó, 24 órás, vezetői részvétellel megvalósult kezdeményezés a „Sokszínű és befogadó munkahely” kategóriában nyert – a díjazott ügynökség tanulsága szerint a zsűrit nem a puszta kreatív ötlet, hanem a valódi szervezeti beágyazottságból fakadó, hiteles vállalati kiállás győzi meg."},{"cim":"A vendégmunkásvita rossz kérdést tesz fel","url":"https://telex.hu/g7/vallalat/2026/08/01/vendegmunkasvita-kepzettseg-munkaerohiany-atkepzes-allami-szerep","forras":"G7","datum":"2026-08-01","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A G7 véleményrovatában Földi Miklós Dániel munka- és szervezetpszichológus szerint a vendégmunkásvita a rossz kérdésre koncentrál: a lényeg az, mikor, hol, milyen feltételekkel és meddig érkezzenek vendégmunkások, nem az, hogy egyáltalán legyenek-e. Érvelése szerint a magyar munkaerőpiacon egyszerre van hiány és többlet, csak más ágazatokban és képzettségi szinteken, ezért egy hazatérő jogász nem oldja meg a hegesztő- vagy gépkezelőhiányt: a gond elsősorban kompetenciahiány. Szerinte a hazai munkaerő fejlesztése – megtartás, hazahívás, átképzés, automatizáció – az elsődleges feladat, de átmenetileg elkerülhetetlen a szabályozott, ágazati hiánylistákhoz igazított külföldi munkaerő bevonása is. A már itt dolgozókat az uniós Single Permit-rendszerhez igazodva javasolja kiszámíthatóan rendezni.","kulcsszavak":["vendégmunka","munkaerőhiány","képzés"],"het":"2026-07-27","url_forras":"docx","id":"ART-0453","kivonat":"A G7 véleményrovatában Földi Miklós Dániel munka- és szervezetpszichológus szerint a vita nem arról szól, amiről kellene: a kérdés nem az, legyen-e vendégmunkás, hanem hogy mikor, hol, milyen feltételekkel és meddig. Érvelése szerint a magyar munkaerőpiacon egyszerre van hiány és többlet – csak más ágazatokban, képzettségi szinteken és régiókban –, ezért egy hazatérő jogász nem oldja meg a hegesztő- vagy gépkezelőhiányt: nem munkaerőhiányunk van elsősorban, hanem kompetenciahiányunk. A szerző szerint a magyar munkaerő fejlesztése (megtartás, hazahívás, átképzés, automatizáció) az elsődleges feladat, de a nyugat-európai gyakorlathoz hasonlóan átmenetileg elkerülhetetlen a szabályozott, ágazati hiánylistákhoz igazított külföldi munkaerő – nem összemosva az illegális migrációval –, a már itt dolgozók helyzetét pedig az uniós Single Permit-rendszerhez igazodva kellene kiszámíthatóan rendezni."},{"cim":"Titokzatos szemétügy Újpesten: ázsiai utcaseprőkbe botlottak a lakók, senki nem tudja, kinek dolgozott a külföldi brigád","url":"https://www.blikk.hu/aktualis/belfold/kulfoldi-utcaseprok-ujpest/n5zcb0n","forras":"Blikk","datum":"2026-08-06","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az újpesti kertvárosban magyarul nem beszélő, ázsiai származású férfiak takarítottak formaruha nélkül, miközben a lakók nem kaptak választ arra, kinek a megbízásából dolgoznak. A fővárosi tisztaságért felelős BKM tagadja, hogy külföldi munkaerőt alkalmazna, és jelezte, hogy a kertvárosi utcák takarítását gyakran a kerületi önkormányzat vagy egy megbízott társaság végezteti. Munkaerőpiaci szakértők szerint a férfiakat egy cég alkalmi, egyszerűsített foglalkoztatás keretében, napi bejelentéssel foglalkoztathatja, alacsonyabb bérért, mint a fővárosi utcaseprőké vagy a közmunkásoké. Faragó Ágota munkajogász szerint az ilyen ügyekben „tízből kilencszer” hibádzik valami a foglalkoztatási engedélyek körül.","kulcsszavak":["vendégmunka","munkajog","munkakörülmények"],"het":"2026-08-03","url_forras":"docx","id":"ART-0454","kivonat":"Az újpesti kertváros utcáin magyarul nem beszélő, ázsiai származású férfiak takarítottak formaruha nélkül, a lakók pedig hiába keresték a választ, hogy kinek a megbízásából. A fővárosi tisztaságért felelős BKM tagadja, hogy külföldi munkaerőt alkalmazna, és arra utal, hogy a kisebb, kertvárosi utcák takarítását gyakran maga a kerületi önkormányzat vagy egy megbízott társaság végezteti. Munkaerőpiaci szakértők szerint a férfiakat egy cég alkalmi, egyszerűsített foglalkoztatás keretében, napi bejelentéssel foglalkoztathatja, a bérük pedig a fővárosi utcaseprőkénél és a közmunkások juttatásánál is alacsonyabb lehet. Faragó Ágota munkajogász szerint az ilyen ügyekben „tízből kilencszer” hibádzik valami a foglalkoztatási engedélyek körül."},{"cim":"Vendégmunkásszálló elé szervez megmozdulást a Mi Hazánk Szombathelyen","url":"https://magyarjelen.hu/belfold/32822-vendegmunkasszallo-ele-szervez-megmozdulast-a-mi-hazank-szombathelyen","forras":"Magyar Jelen","datum":"2026-08-07","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Mi Hazánk Ifjainak Vas vármegyei szervezete „A magyar dolgozó az első!” jelszóval demonstrációt hirdetett egy szombathelyi vendégmunkásszálló elé. A szervezők szerint a vendégmunkások jelenléte továbbra is probléma, annak ellenére, hogy a Tisza-kormány bejelentette a beáramlás megállítását. A párt munkaügyi kabinetvezetője, Lantos János szerint a szabályozásban maradtak kiskapuk, így továbbra is érkezhetnek külföldi munkavállalók.","kulcsszavak":["vendégmunka","politika"],"het":"2026-08-03","id":"ART-0455","url_forras":"talalt","kivonat":"A Mi Hazánk Ifjainak Vas vármegyei szervezete „A magyar dolgozó az első!” jelszóval demonstrációt hirdetett egy szombathelyi vendégmunkásszálló elé. A szervezők szerint a vendégmunkások jelenléte továbbra is probléma, és hiába jelentette be a Tisza-kormány a beáramlás megállítását, a párt munkaügyi kabinetvezetője, Lantos János szerint a szabályozásban maradtak kiskapuk, így továbbra is érkezhetnek külföldi munkavállalók."},{"cim":"Az 50+ korosztály mint megoldás a szakemberhiányra? Hogyan segít a közvetítő a rejtett tehetségek megtalálásában?","url":"https://www.digitalhungary.hu/uzlet/az-50-korosztaly-mint-megoldas-a-szakemberhianyra-hogyan-segit-a-kozvetito-a-rejtett-tehetsegek-megtalalasaban/75988/","forras":"Digital Hungary","datum":"2026-08-06","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Viapan Group közleménye szerint a munkaképes korú népesség 2022 közepe óta mintegy 170 ezer fővel csökkent, a vállalatok mégis gyakran figyelmen kívül hagyják az 50 év felettiek tudatos bevonását a szakemberhiány enyhítésére. Az 55–64 évesek aktivitási rátája 2024-re 73 százalékra nőtt, közel 15 százalékponttal 2019 óta, és ez a réteg stabilabb jelenlétet, alacsonyabb fluktuációt, felhalmozott szaktudást és mentori kapacitást kínál. Az akadály sokszor az előítélet: az álláskeresők 24,1 százaléka jelölte meg az életkort a hátrányos megkülönböztetés okaként, az 55–64 évesek körében pedig 40 százalék. A kompetenciaalapú, életkorsemleges kiválasztás segít feltárni ezeket a rejtett tehetségeket.","kulcsszavak":["idősebb munkavállalók","demográfia","esélyegyenlőség","munkaerőhiány"],"het":"2026-08-03","url_forras":"docx","id":"ART-0456","kivonat":"A Viapan Group közleménye szerint a demográfiai apadás – a munkaképes korú népesség 2022 közepe óta mintegy 170 ezer fővel csökkent – mellett a vállalatok gyakran figyelmen kívül hagyják a szakemberhiány egyik kézenfekvő megoldását, az 50 év felettiek tudatos bevonását. Pedig az 55–64 évesek aktivitási rátája 2024-re 73 százalékra nőtt (közel 15 százalékponttal 2019 óta), és ez a réteg stabilabb jelenlétet, alacsonyabb fluktuációt, felhalmozott szaktudást és mentori kapacitást kínál. Az akadály sokszor az előítélet: az álláskeresők 24,1 százaléka jelölte meg az életkort a hátrányos megkülönböztetés okaként, az 55–64 évesek körében pedig 40 százalék. A kompetenciaalapú, életkorsemleges kiválasztás segít feltárni ezeket a rejtett tehetségeket."},{"cim":"Óriási különbség van a frissdiplomások elhelyezkedési esélyei között","url":"https://piacesprofit.hu/cikkek/tarsadalom/oriasi-kulonbseg-van-a-frissdiplomasok-elhelyezkedesi-eselyei-kozott.html","forras":"Piac és Profit","datum":"2026-08-02","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Profession.hu adatai szerint miközben idén 140 ezren jelentkeztek a felsőoktatásba, a pályakezdőknek meghirdetett állások száma 2026 első felében 7,2 százalékkal csökkent. A legnagyobb tolongás a marketing, média és PR területén van, ahol átlagosan száz feletti jelentkező juthat egy állásra, míg a mérnöki, egészségügyi és gyártási-termelési pozícióknál átlagosan húsz jelentkező jut egy állásra. A mérnöki diploma marad az egyik legjobb belépő, mert itt magas a kereslet, alacsonyabb a verseny, és a kezdő fizetés is a legversenyképesebbek közé tartozik: az IT, a mérnöki és a gyártási munkakörökben nettó 500–600 ezer forint. Egyre többet számítanak a már egyetem alatt megszerzett készségek és a gyakorlati tapasztalat is.","kulcsszavak":["pályakezdők","skills-alapú HR"],"het":"2026-07-27","url_forras":"docx","id":"ART-0457","kivonat":"A Profession.hu adatai szerint miközben idén 140 ezren jelentkeztek a felsőoktatásba, a pályakezdőknek meghirdetett állások száma 2026 első felében 7,2 százalékkal csökkent. A mérséklődés egyenetlen. A legnagyobb tolongás a marketing, média és PR területén van, ahol átlagosan száz feletti jelentkező juthat egy állásra (az adminisztráció, az ügyfélszolgálat, a HR és a jog is túljelentkezett), a másik végponton a mérnöki, az egészségügyi és a gyártási-termelési pozíciók állnak, ahol átlagosan húsz jelentkező jut egy állásra. A mérnöki diploma marad az egyik legjobb belépő: itt egyszerre magas a kereslet, alacsonyabb a verseny, és a kezdő fizetés is a legversenyképesebbek közé tartozik (az IT, a mérnöki és a gyártási munkakörökben nettó 500–600 ezer forint). Egyre többet számítanak a már egyetem alatt megszerzett készségek és a gyakorlati tapasztalat."},{"cim":"Felpörögtek a szakszervezetek, de vajon mire számíthatnak a Tiszától?","url":"https://telex.hu/g7/kozelet/2026/08/07/szakszervezet-sztrajk-beremeles-tisza-kormany-dolgozok","forras":"G7","datum":"2026-08-07","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Két hónap alatt már a harmadik sztrájk van készülőben: nyáron leálltak a dolgozók a Hanon Systemsnél és az IKEA-nál, a szegedi Continentalnál pedig most készülnek munkabeszüntetésre – az elmúlt évtizedben nem volt olyan év, amikor ennyi gyűlt volna össze. A mozgolódás mögött a reálbérüket féltő munkavállalók állnak, a nyitott kérdés pedig az, hogy az új kormányzat ad-e lökést az érdekképviseletnek. A Vasas Szakszervezet alelnöke, László Zoltán szerint a Tisza „se optimizmusra, se pesszimizmusra nem adott eddig okot”. A Hanon egyik dolgozója szkeptikusabb: szerinte a kormány eddig semmit nem tett az ügyükben, és a kampányban a munka törvénykönyvéről sem beszélt.","kulcsszavak":["szakszervezet","bérek","politika"],"het":"2026-08-03","url_forras":"docx","id":"ART-0458","kivonat":"Két hónap alatt már a harmadik sztrájk van készülőben: a Hanon Systemsnél és az IKEA-nál nyáron leálltak a dolgozók, a szegedi Continentalnál most készülnek munkabeszüntetésre – az utóbbi évtizedben több olyan év is volt, amikor egész évben nem gyűlt össze ennyi. A mozgolódás mögött mindenütt a reálbérüket féltő munkavállalók állnak, a nyitott kérdés inkább az, hogy az új kormányzat ad-e lökést az érdekképviseletnek. A Vasas Szakszervezet alelnöke, László Zoltán szerint a Tisza „se optimizmusra, se pesszimizmusra nem adott eddig okot”, a Hanon egyik dolgozója viszont szkeptikus, mert a kormány eddig semmit nem tett az ügyükben, a kampányban a munka törvénykönyvéről sem beszélt."},{"cim":"Ezen bukhat el a magyar növekedés: már nem a beruházások hiánya a legnagyobb veszély","url":"https://www.portfolio.hu/gazdasag/20260803/ezen-bukhat-el-a-magyar-novekedes-mar-nem-a-beruhazasok-hianya-a-legnagyobb-veszely-852474","forras":"Portfolio","datum":"2026-08-03","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Portfolio véleményrovatában Toldi Gábor toborzási tanácsadó szerint a következő öt év magyar növekedésének legnagyobb kockázata a megfelelő tudású és motivációjú munkaerő hiánya, nem a beruházások elmaradása. A munkaerőpiac papíron stabil, de évente mintegy 50 ezer fővel csökken az aktív munkavállalók száma, a valódi problémát pedig az alapvető írás- és szövegértési készség, illetve a munkavállalási hajlandóság hiánya jelenti, a termelő cégeknél tomboló fluktuáció mellett – a toborzott operátoroknak csak töredéke lép be és marad. A megoldást a saját munkaerő fejlesztésében, a re- és upskill programokban, valamint a munkaügyi központok regionális koordinátorrá alakításában látja. A harmadik országbeli munkavállalók behozatalát nem célnak, hanem átmeneti eszköznek tekinti.","kulcsszavak":["munkaerőhiány","gazdasági kilátások","képzés"],"het":"2026-08-03","url_forras":"docx","id":"ART-0459","kivonat":"A Portfolio véleményrovatában Toldi Gábor toborzási tanácsadó szerint a következő öt év növekedésének fő korlátja nem a beruházások hiánya lesz, hanem a megfelelő tudású és motivációjú munkaerő rendelkezésre állása. A munkaerőpiac papíron stabil, de évente mintegy 50 ezer fővel csökken az aktív munkavállalók száma, a valódi gond pedig nem a mennyiség, hanem a minőség és a motiváció: az alapvető írás- és szövegértési készség, valamint a munkavállalási hajlandóság hiányát is problémának látja, a termelő cégeknél tomboló fluktuáció mellett (a toborzott operátoroknak csak töredéke lép be és marad). A megoldást a saját munkaerő fejlesztésében, a re- és upskill programokban, a munkaügyi központok regionális koordinátorrá alakításában látja; a harmadik országbeli munkavállalók behozatalát nem célnak, hanem átmeneti eszköznek tekinti."},{"cim":"Fordulat az IT-piacon: eddig így írta át az AI a szakemberekért folyó versenyt","url":"https://novekedes.hu/hirek/fordulat-az-it-piacon-eddig-igy-irta-at-az-ai-a-szakemberekert-folyo-versenyt","forras":"Növekedés.hu","datum":"2026-08-06","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Bluebird International több mint 3000 valós béradaton alapuló felmérése szerint lezárult az IT-fizetések 2021–2023-as intenzív növekedési szakasza: a legtöbb pozícióban a bérek stagnálnak. Érdemi emelkedés csak a továbbra is hiányszakmának számító területeken látszik – SAP, architekt szerepkörök, cloud, DevOps, cybersecurity –, míg a klasszikus fejlesztői területeken, mint a Java, JavaScript, .NET, Python vagy Full Stack, nem volt számottevő növekedés. A korábbi licitháborúk ritkábbak, a visszafogottabb beruházások és a létszámstopok mérsékelték a bérnyomást. Réfi Veronika vezérigazgató szerint a következő verseny már a kompetenciastratégiáról szól: arról, hogy egy vállalat képes-e előre felmérni, milyen tudásra lesz szüksége.","kulcsszavak":["bérek","AI","IT"],"het":"2026-08-03","url_forras":"docx","id":"ART-0460","kivonat":"A Bluebird International több mint 3000 valós béradaton alapuló felmérése szerint lezárult az IT-fizetések 2021–2023-as intenzív növekedési szakasza: a legtöbb pozícióban a bérek stagnálnak, érdemi emelkedés csak a továbbra is hiányszakmának számító területeken – SAP, architekt szerepkörök, cloud, DevOps, cybersecurity – látszik, míg a klasszikus fejlesztői területeken (Java, JavaScript, .NET, Python, Full Stack) nem volt számottevő növekedés. A korábbi licitháborúk ritkábbak, a visszafogottabb beruházások és a létszámstopok mérsékelték a nyomást. A következő verseny Réfi Veronika vezérigazgató szerint már a kompetenciastratégiáról szól – arról, hogy egy vállalat képes-e előre felmérni, milyen tudásra lesz szüksége."},{"cim":"Csődbe ment egy újabb magyarországi óriásgyár: nem az áll a háttérben, amire mindenki gondolt – levelet írt a polgármester, „vegyék át a kirúgott dolgozókat!”","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/08/szolnok-csodbe-ment-egy-ujabb-magyarorszagi-oriasgya","forras":"Világgazdaság","datum":"2026-08-06","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A tószegi Accell Hunland kerékpárgyár bezárásával mintegy 400 ember veszíti el az állását – a döntés hátterében nem az üzem működése, hanem a nemzetközi Accell-csoport pénzügyi nehézségei állnak. A márkát 2022-ben 1,8 milliárd euróért vásárolta meg a KKR, és a gyár 2023-as nyeresége 2024-re több mint 2,7 millió eurós veszteségbe fordult. Szolnok polgármestere, Györfi Mihály nyílt levélben kérte a térség vállalkozásait, hogy vegyék át az elbocsátott dolgozókat, és a hivatal vállalta a munkavállalók és munkáltatók kapcsolatfelvételének koordinálását. Az Accell volt a település legnagyobb HIPA-befizetője, így a bevételkiesés a városi költségvetést is destabilizálhatja.","kulcsszavak":["leépítés","ipar","régiós különbségek"],"het":"2026-08-03","id":"ART-0461","url_forras":"talalt","kivonat":"A tószegi Accell Hunland kerékpárgyár bezárásával mintegy 400 ember veszíti el az állását – a döntés hátterében nem az üzem működése, hanem a nemzetközi Accell-csoport pénzügyi nehézségei állnak (a márkát 2022-ben vásárolta meg 1,8 milliárd euróért a KKR, a gyár 2023-as nyeresége 2024-re több mint 2,7 millió eurós veszteségbe fordult). Szolnok polgármestere, Györfi Mihály nyílt levélben kérte a térség meghatározó vállalkozásait, hogy lehetőségeikhez mérten vegyék át az elbocsátott dolgozókat, mert a városban évek óta nem volt ekkora, egyszerre ennyi embert érintő leépítés; a hivatal vállalta a munkavállalók és a munkáltatók kapcsolatfelvételének koordinálását.
