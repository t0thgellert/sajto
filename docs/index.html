// ─── WEEK LABELS ────────────────────────────────────────────────────────────
const HU_HONAP = ['január','február','március','április','május','június','július','augusztus','szeptember','október','november','december'];
function weekLabel(w) {
  const d = new Date(w + 'T00:00:00');
  if (isNaN(d)) return w;
  const sun = new Date(d.getTime() + 6*86400000);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  const wn = Math.ceil((((t - y0) / 86400000) + 1) / 7);
  const f = x => `${x.getFullYear()}. ${HU_HONAP[x.getMonth()]} ${x.getDate()}.`;
  return `${wn}. hét (${f(d)} – ${f(sun)})`;
}

// ─── STATE ──────────────────────────────────────────────────────────────────
let activeKat = '';
let activeTags = new Set();

// ─── INIT ───────────────────────────────────────────────────────────────────
function init() {
  // Hero update date only
  document.getElementById('hero-sub').innerHTML =
    `<span class="hero-sub-dot"></span>Frissítve: ${DB.generated}`;

  // Populate week dropdown
  const sel = document.getElementById('week-select');
  const weeks = [...new Set(DB.cikkek.map(a=>a.het))].sort((a,b)=>b.localeCompare(a));
  weeks.forEach(w => {
    const o = document.createElement('option');
    o.value = w;
    o.textContent = weekLabel(w);
    sel.appendChild(o);
  });

  // Kezdőállapot: a legfrissebb hét, AMIBEN VAN CIKK.
  // Nem a naptári hét: a körkép péntek délután jön, tehát hétfőtől péntekig a
  // naptári hét üres, és az oldal 'Nincs találat'-tal nyitna. A weeks[0] a
  // DB-ből jön, így minden frissítés után magától a friss hétre áll.
  if (weeks.length) sel.value = weeks[0];

  // Pill click handlers
  document.querySelectorAll('#pills-kat .pill').forEach(p => {
    p.addEventListener('click', () => {
      document.querySelectorAll('#pills-kat .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      activeKat = p.dataset.val;
      applyFilters();
    });
  });


  renderTagCloud();
  applyFilters();
}

// ─── FILTERS ────────────────────────────────────────────────────────────────

// A kereső az EGÉSZ archívumra kérdez, ezért ha a felhasználó beír valamit, a
// hét-szűrő elengedi magát. Nélküle a keresés csendben 0 találatot adna: az
// oldal alapból az aktuális hétre szűr, és ott a keresett cikk jó eséllyel
// nincs benne. A legördülő látványosan visszaáll 'Összes hét'-re, hogy ne
// rejtett viselkedés legyen.
function onSearchInput() {
  const sel = document.getElementById('week-select');
  if (document.getElementById('nav-search').value.trim() && sel.value) sel.value = '';
  applyFilters();
}

function getFiltered() {
  const week   = document.getElementById('week-select').value;
  const search = document.getElementById('nav-search').value.toLowerCase().trim();
  return DB.cikkek.filter(a => {
    if (activeKat && a.fokategoria !== activeKat) return false;
    if (week      && a.het         !== week)       return false;
    if (activeTags.size > 0 && !a.kulcsszavak.some(t => activeTags.has(canonTag(t)))) return false;
    if (search) {
      const hay = (a.cim + ' ' + a.forras + ' ' + (a.osszefoglalo||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function applyFilters() {
  const articles = getFiltered();
  renderArticles(articles);
  renderTagCloud();

  const total = DB.cikkek.length;
  // A hét-szűrő szándékosan NINCS benne: a clearFilters() nem nullázza (a heti
  // nézet a kezdőállapot), tehát ne is bukkanjon fel a gomb csak attól, hogy egy
  // hét ki van választva — nem lenne mit tennie vele. Váltani a legördülőben kell.
  const isFiltered = activeKat || activeTags.size || document.getElementById('nav-search').value;
  document.getElementById('results-text').textContent =
    articles.length === total
      ? `Összes ${total} cikk megjelenítve`
      : `${articles.length} találat (összesen: ${total})`;
  const clearBtn = document.getElementById('clear-btn');
  clearBtn.classList.toggle('visible', !!isFiltered);
}

function clearFilters() {
  // A hét-szűrő nem nullázódik: 'Összes hét'-re állni itt visszalépés lenne a
  // régi, zsúfolt kezdőnézethez. Ha az egész archívum kell, a legördülőben ott
  // van az 'Összes hét'.
  activeKat = ''; activeHv = ''; activeTags = new Set();
  document.getElementById('nav-search').value  = '';
  document.querySelectorAll('#pills-kat .pill').forEach((p,i)=>p.classList.toggle('active',i===0));
  applyFilters();
}

// ─── TAG CLOUD ──────────────────────────────────────────────────────────────
let tagCloudExpanded = false;
const TAG_CLOUD_COLLAPSE_THRESHOLD = 12;
const TAG_CLOUD_MAX = 100;

// A címkéket a feldolgozó oldal (cowork/vocab.py) normalizálja egy zárt
// vokabuláriumra, ezért kliensoldalon nincs összevonandó írásmód-variáns.
// A hook megmarad, hogy egy jövőbeni átmeneti időszakban legyen hova írni.
const TAG_SYNONYMS = {};
function canonTag(t) { return TAG_SYNONYMS[t] || t; }

function renderTagCloud() {
  const filtered = getFiltered();
  const counts = {};
  filtered.forEach(a => a.kulcsszavak.forEach(t => {
    const ct = canonTag(t);
    counts[ct] = (counts[ct]||0) + 1;
  }));
  const allTags = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const tags = allTags.slice(0, TAG_CLOUD_MAX);
  const cloud = document.getElementById('tag-cloud');
  const toggle = document.getElementById('tag-cloud-toggle');
  if (!tags.length) { cloud.innerHTML = ''; toggle.style.display = 'none'; return; }
  cloud.innerHTML = tags.map(([t,c]) =>
    `<span class="tag-chip ${activeTags.has(t)?'active':''}" onclick="toggleTag('${esc(t)}')">${t} <span class="tag-cnt">(${c})</span></span>`
  ).join('');
  if (tags.length > TAG_CLOUD_COLLAPSE_THRESHOLD) {
    toggle.style.display = 'inline-block';
    cloud.classList.toggle('collapsed', !tagCloudExpanded);
    toggle.textContent = tagCloudExpanded ? 'Szűrők bezárása' : `Összes szűrő megnyitása (${tags.length})`;
  } else {
    toggle.style.display = 'none';
    cloud.classList.remove('collapsed');
  }
}

function toggleTagCloud() {
  tagCloudExpanded = !tagCloudExpanded;
  renderTagCloud();
}

function toggleTag(t) {
  activeTags.has(t) ? activeTags.delete(t) : activeTags.add(t);
  applyFilters();
}

// ─── RENDER ARTICLES ────────────────────────────────────────────────────────
const SECTIONS = {
  prohuman:   { label: 'Prohuman megjelenések',                    cls: 'sh-prohuman', dot: 'dot-prohuman', badge: 'badge-prohuman' },
  piac:       { label: 'Munkaerőpiaci hírek és elemzések',         cls: 'sh-piac',     dot: 'dot-piac',     badge: 'badge-piac' },
  versenytars:{ label: 'Versenytársakra vonatkozó megjelenések',   cls: 'sh-verseny',  dot: 'dot-verseny',  badge: 'badge-verseny' },
};

function renderArticles(articles) {
  const container = document.getElementById('content');
  if (!articles.length) {
    container.innerHTML = `<div class="empty"><span class="empty-icon">🔍</span>Nincs találat a megadott szűrési feltételekre.</div>`;
    return;
  }
  // Group by fokategoria
  const groups = { prohuman: [], piac: [], versenytars: [] };
  articles.forEach(a => { if (groups[a.fokategoria]) groups[a.fokategoria].push(a); });

  let html = '';
  for (const [key, items] of Object.entries(groups)) {
    if (!items.length) continue;
    const s = SECTIONS[key];
    html += `<div class="section-head ${s.cls}">
      <span class="section-dot ${s.dot}"></span>
      <span class="section-title-text">${s.label}</span>
      <span class="section-count">(${items.length})</span>
    </div>`;

    // Sub-group by alkategoria for piac & versenytars
    if (key !== 'prohuman') {
      const subs = {};
      items.forEach(a => { (subs[a.alkategoria] = subs[a.alkategoria]||[]).push(a); });
      for (const [sub, sitems] of Object.entries(subs)) {
        html += `<div class="subsection-label">${esc(sub)} (${sitems.length})</div>`;
        html += `<div class="card-grid">${sitems.map(a=>cardHtml(a,s.badge)).join('')}</div>`;
      }
    } else {
      html += `<div class="card-grid">${items.map(a=>cardHtml(a,s.badge)).join('')}</div>`;
    }
  }
  container.innerHTML = html;
}

function cardHtml(a, badgeCls) {
  const cim = cleanText(a.cim);
  const title = a.url
    ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(cim)}</a>`
    : esc(cim);
  const wkLbl = weekLabel(a.het);
  const summary = a.osszefoglalo && a.osszefoglalo !== a.cim
    ? `<div class="card-summary">${esc(cleanText(a.osszefoglalo).substring(0,280))}${cleanText(a.osszefoglalo).length>280?'…':''}</div>` : '';
  const tags = a.kulcsszavak.map(t =>
    `<span class="card-tag ${activeTags.has(t)?'active':''}" onclick="toggleTag('${esc(t)}')">${esc(t)}</span>`
  ).join('');
  return `<div class="card ${a.fokategoria==='prohuman'?'card-prohuman':''}">
    <div class="card-top">
      <span class="badge ${badgeCls}">${esc(a.alkategoria)}</span>
      <div class="card-title">${title}</div>
    </div>
    <div class="card-meta">
      <span class="meta-source">${esc(a.forras)}</span>
      <span class="meta-dot">·</span>
      <span>${esc(a.datum||'')}</span>
      <span class="meta-week">${esc(wkLbl)}</span>
    </div>
    ${summary}
    <div class="card-footer">${tags}</div>
  </div>`;
}

function cleanText(s) {
  // Eltávolítja a Word→JSON konverzióból maradt markdown artifaktokat
  return (s || '').replace(/^#+\s*/, '').replace(/^\[/, '').trim();
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
