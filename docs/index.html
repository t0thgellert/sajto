y állampolgárságtól független, általános munkavállalási célú tartózkodási engedély, amelyet egyedi munkaerőpiaci vizsgálat alapján adnának ki, megőrizve a magyar és EGT-munkavállalók elsőbbségét, míg az EU Kék Kártya, a szezonális munka, a beruházási foglalkoztatás és a vállalaton belüli áthelyezés megmaradna. A szakértők a demográfiai apadásra is figyelmeztetnek, a reformot az uniós összevont engedélyről szóló irányelv is sürgeti."},{"cim":"Óriási a baj a gyümölcsösökben: eltűnnek a magyarok a földekről, Ukrajnából érkezik a megoldás","url":"https://www.economx.hu/magyar-gazdasag/2026/07/07/szezonalis-munkak-magyarok-ukranok-atlagkeresetek-mezogazdasag/","forras":"Economx","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Menton Jobs szerint 66%-kal nőtt a munkáltatói igény a szezonális mezőgazdasági munkaerőre, de a magyar toborzottak nagy része lemorzsolódik; a legéletképesebb megoldás az ukrán munkaerő.","kulcsszavak":["Menton Jobs","szezonális munka","vendégmunka","agrárium"],"het":"2026-07-06","id":"ART-0391","url_forras":"docx","kivonat":"Komoly gond van a szezonális mezőgazdasági munkaerőpiacon: Letenovics Roland (Menton Jobs) elmondása szerint cégüknél 66%-kal nőtt a munkáltatói igény, ám az ázsiai munkaerőre nem kaptak engedélyt, a főként északkeleti régiókban toborzott magyarok pedig a nettó átlagkereset 15%-os egyéves emelkedése ellenére nagyrészt lemorzsolódtak az óriási fluktuáció miatt. Így a legéletképesebb megoldásnak az ukrán munkaerő bizonyult, akik Nemzeti Kártyával jelentkezhetnek, és talán ők szedik a legtöbb bodzát, paprikát és barackot Magyarországon. A szakember szerint a legnehezebb a fizikailag megterhelő, korán kezdődő vagy távoli munkákra embert találni – ezen az utazási támogatás, buszjárat vagy lakhatás segíthet –, a lemorzsolódást pedig az őszinte kommunikáció és a szezon előtt 4-6 héttel elkezdett toborzás mérsékli."},{"cim":"„Ez egy időzített bomba” – több tízezer férőhelyre és Fülöp-szigeteki ápolókra is szükség lehet, hogy elkerüljük az idősellátás összeomlását","url":"https://24.hu/kultura/2026/07/09/idosellatas-osszeomlas/","forras":"24.hu","datum":"2026-07-09","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az idősellátás krízise miatt becslések szerint 50 ezernél is többen várnak férőhelyre; a szakértő szerint rövid távon a Fülöp-szigeteki ápolók behozatala lehet a válasz, amit a vendégmunkás-stop nehezített.","kulcsszavak":["idősebb munkavállalók","munkaerőhiány","vendégmunka"],"het":"2026-07-06","id":"ART-0392","url_forras":"docx","kivonat":"A 24.hu Édes öregem sorozatának negyedik része Dr. Nagy Viktor szakértővel járja körül a hazai idősellátás „időzített bombának\" nevezett krízisét: az intézmények telítettek, becslése szerint 50 ezernél is többen várnak férőhelyre, miközben az állami finanszírozású férőhelyek száma 2019 óta nem nőtt, a szociális törvény pedig még 1993-as. A gyors férőhelybővítést a súlyos szakképzett munkaerőhiány hátráltatja, amelyre a szakértő szerint középtávon a béremelés és a pálya vonzóbbá tétele, rövid távon a harmadik országbeli, jellemzően Fülöp-szigeteki ápolók behozatala a válasz – amit épp a júniusi vendégmunkás-stop nehezített, miközben az idősotthonok 5-6 év edukáció után kezdtek erre nyitni. Az új kormánytól a szakma a program szerinti plusz 20 ezer állami normatív férőhelyet várja, Nagy pedig az osztrák hiányszakma-lista mintáját ajánlja."},{"cim":"Hivatalos: a Fülöp-szigeteki kormány megtalálta a megoldást, mégis tud vendégmunkásokat küldeni Magyarországra – a Tisza-kormány nem zárt be egy kiskaput","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/vendegmunkas-kormany-munkavallalok-harmadik-orszagbeli","forras":"Világgazdaság","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkás-szigorítás nem érinti a közvetlen foglalkoztatási konstrukciókat, így filippínó munkavállalók továbbra is érkezhetnek Magyarországra; jelenleg mintegy 10 ezer filippínó dolgozik itthon.","kulcsszavak":["vendégmunka","vendégmunkás-stop","toborzás","munkajog"],"het":"2026-07-06","id":"ART-0393","url_forras":"docx","kivonat":"A vendégmunkás-szigorítás ellenére továbbra is érkezhetnek filippínó munkavállalók Magyarországra: a Fülöp-szigeteki külföldi munkavállalók minisztériumának tájékoztatója szerint az új rendelet nem érinti a közvetlen foglalkoztatási konstrukciókat, így a harmadik országbeliek munkavállalási célú tartózkodási engedéllyel továbbra is alkalmazhatók. A szabály ráadásul nem visszamenőleges hatályú, így a június 5. előtt kiadott engedélyeket és a folyamatban lévő ügyeket sem érinti. A cikk kiemeli, hogy jelenleg mintegy 10 ezer filippínó dolgozik itthon, és a toborzás sem állt le – noha a Tisza-kormány épp azzal indokolta a stopot, hogy a vendégmunkások veszélyeztetik a magyar munkahelyeket és leszorítják a béreket."},{"cim":"Átírnák a vendégmunkások szabályait – fontos javaslat érkezett a kormányhoz","url":"https://www.economx.hu/magyar-gazdasag/2026/07/09/vendegmunkasok-szabalyai-javaslat-kormany/","forras":"Store Insider","datum":"2026-07-06","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az élelmiszeripar vezetői szerint a harmadik országbeli munkaerő nélkülözhetetlen, egyes szakágazatokban akár 30%-ban foglalkoztatnak külföldit; teljes tiltás esetén telepbezárások következhetnek.","kulcsszavak":["agrárium","vendégmunka"],"het":"2026-07-06","id":"ART-0394","url_forras":"docx","kivonat":"Az élelmiszeripar érdekvédelmi vezetői a vendégmunkás-szigorításról szóló körképben a harmadik országbeli munkaerő nélkülözhetetlenségét hangsúlyozzák: az ágazat átlagosan 10-15%-ban, egyes szakágazatokban akár 30%-ban foglalkoztat külföldit, a probléma pedig a szereplők szerint nem fizetési kérdés, hanem valós emberhiány. Teljes tiltás esetén élőmunka-igényes ágazatok sora – hús- és baromfifeldolgozás, tejtermelés, zöldség-gyümölcs – kerülne súlyos működési zavarba, akár telepbezárásokkal, és a magyar termelők versenyhátrányba kerülnének az olcsóbb munkaerejű országokkal szemben. Az összeállítást Bóna Szabolcs agrárminiszter megnyugtató üzenete zárja, miszerint a szigorítás csak a főként „NER-közeli kölcsönzők” ázsiai vendégmunkásait érinti, a mezőgazdasági engedélyek változatlanul kiadhatók."},{"cim":"Így kereshetsz havi 100 ezer forint pluszpénzt: teljesen legális, bárki élhet a lehetőséggel","url":"https://www.penzcentrum.hu/karrier/20260708/igy-kereshetsz-havi-100-ezer-forint-pluszpenzt-teljesen-legalis-barki-elhet-a-lehetoseggel-1201758","forras":"Pénzcentrum","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Giggle alapítói szerint a rugalmas foglalkoztatás aránya itthon mindössze 4,8%, amivel mintegy 5%-nyi plusz kapacitás szabadítható fel, ami a vendégmunkás-behozatalnak részleges alternatívája lehet.","kulcsszavak":["Giggle","munkaerő-kölcsönzés","rugalmas foglalkoztatás","munkaerő-tartalék"],"het":"2026-07-06","id":"ART-0395","url_forras":"docx","kivonat":"A Pénzcentrum a Giggle rugalmas foglalkoztatási platform alapítóit, Birizdó Ádámot és Sebestyén Ádámot kérdezte a munkaerőpiac rejtett tartalékáról. Érvelésük szerint sokan nem béremelésre, hanem alacsonyabb belépési küszöbre várnak: fix 40 órát nem vállalnának, de egy-egy műszakot igen, így heti egy pluszmunkával havi 80-100 ezer forintot kereshetnek. A rugalmas foglalkoztatás aránya itthon mindössze 4,8% (mélyen az EU-átlag alatt), amivel mintegy 5%-nyi plusz kapacitás szabadítható fel, ami a vendégmunkás-behozatalnak is részleges alternatívája lehet. Platformjukon nagyjából 180 ezer regisztrált munkavállaló van, a munkák 80%-át 30 év alattiak végzik, bejelentett, közvetítéses vagy munkaerő-kölcsönzéses keretek közt."},{"cim":"Pofátlanul jó pénzt fizetnek, mégsem kell senkinek a meló a Balatonnál: lasszóval vadásszák a diákokat a magyar tengernél","url":"https://www.penzcentrum.hu/karrier/20260709/pofatlanul-jo-penzt-fizetnek-megsem-kell-senkinek-a-melo-a-balatonnal-lasszoval-vadasszak-a-diakokat-a-magyar-tengernel-1201871","forras":"Pénzcentrum","datum":"2026-07-09","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A balatoni nyári diákmunka-kínálatban a vendéglátás dominál; a bérek felülmúlják az országos átlagot, egy végigdolgozott nyár akár 1,4 millió forintot is hozhat 3000 forintos órabérrel.","kulcsszavak":["diákmunka","turizmus","bérek"],"het":"2026-07-06","id":"ART-0396","url_forras":"docx","kivonat":"A Pénzcentrum a balatoni nyári diákmunka-kínálatot tekintette át: a rövid, de intenzív főszezonban a diákmunka sokszor a működés alapfeltétele, mert a szezonális, hétvégi és esti munkarend a felnőtt munkavállalóknak nem vonzó. A legtöbb lehetőséget továbbra is a vendéglátás kínálja (pultos munka 2200, konyhai kisegítő 2800 forint körüli órabérrel), a magasabb kategóriában pedig a promóciós és hostessmunkák állnak akár 3000 forinttal, de van eladói, árufeltöltői és csomagolói állás is. A balatoni bérek jellemzően felülmúlják a bruttó 2300-2500 forintos országos átlagot, a 3000 forintos órabér mellett egy végigdolgozott nyár akár 1,4 millió forintot is hozhat – ez az összeg azonban jelentősen megcsappanhat, ha a fiatalnak a szállást vagy az étkezést magának kell fizetnie."},{"cim":"Többszörös a túljelentkezés ezekre a munkákra – és nem a pénz miatt","url":"https://www.economx.hu/magyar-gazdasag/2026/07/08/diakmunka-turizmus-vendeglatas-melo-diak-majzik-nandor/","forras":"Economx","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Meló-Diák ügyvezetője szerint a nyári diákmunkapiac motorja a turizmus és a vendéglátás; a szállás biztosítása többszörözheti a jelentkezők számát, az átlagos órabér nagyjából 2400 forint.","kulcsszavak":["Meló-Diák","diákmunka","turizmus","bérek"],"het":"2026-07-06","id":"ART-0397","url_forras":"docx","kivonat":"Az Economxnak nyilatkozó Majzik Nándor, a Meló-Diák ügyvezetője szerint a nyári diákmunkapiac legfontosabb motorja továbbra is a turizmus és a vendéglátás (strandok, balatoni helyszínek, fesztiválok, Forma-1), de sok cég a szabadságon lévő dolgozókat is diákokkal pótolja, így július végén is akad még munka. Kiemelte, hogy a fizetés mellett a szállás biztosítása a legerősebb vonzerő – többszörözheti a jelentkezők számát –, és sokaknak a közösségi élmény is fontos, amit jelez a 30-50%-os visszatérési arány. A nyelvtudásnál a munkáltatók fontosabbnak tartják a megbízhatóságot és a pontosságot, az idei átlagos órabér pedig nagyjából 2400 forint (a 25 év alattiaknál ez az szja-mentesség miatt a nettóval egyezik), területi és munkaköri eltérésekkel: a szakmai gyakornoki vagy ritka nyelvet igénylő pozíciók 2500-3000 forintot is fizethetnek."},{"cim":"Minden második cég ugyanazért a néhány szakmunkásjelöltért versenyez","url":"https://mfor.hu/cikkek/makro/minden-masodik-ceg-ugyanazert-a-nehany-szakmunkasjeloltert-versenyez.html","forras":"MFOR","datum":"2026-07-10","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Jobtain kutatása szerint a fizikai munkaerő toborzásában a legnagyobb veszteség a folyamat végén keletkezik; a megbízhatóság a legfontosabb kiválasztási szempont, a cégek fele ugyanazokért a jelöltekért versenyez.","kulcsszavak":["Jobtain","munkaerőhiány","toborzás"],"het":"2026-07-06","id":"ART-0398","url_forras":"docx","kivonat":"A Jobtain HR országos Kékgalléros Benchmark kutatása szerint a fizikai munkaerő toborzásában a legnagyobb veszteség a folyamat végén keletkezik: az alkalmasnak minősített jelöltek közül sokan végül nem állnak munkába, egyetlen elmaradt visszahívás vagy néhány napos csúszás is elég, hogy versengő ajánlatot fogadjanak el. A munkáltatók számára a megbízhatóság vált a legfontosabb kiválasztási szemponttá (90%), a szakmunkásokért folyó verseny pedig tovább élesedett – a cégek fele szerint gyakorlatilag eltűntek a jó, azonnal felvehető dolgozók, és sokan ugyanazért a néhány tapasztalt jelöltért versenyeznek. A felkutatásban továbbra is a munkavállalói ajánlások a legerősebbek (90%), a jövő kulcsa pedig a kutatás szerint a gyorsaság, a jó jelöltélmény, a digitalizált jelentkezés és a fejleszthető potenciállal bíró jelöltek tudatos keresése."},{"cim":"Egyre több vendéglátóhely húzza le a rolót – már napi 4-5 üzlet zár be","url":"https://www.hrportal.hu/c/egyre-tobb-vendeglatohely-huzza-le-a-rolot-mar-napi-45-uzlet-zar-be-20260708.html","forras":"HR Portál","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Magyar Vendéglátók Ipartestülete szerint napi 4-5 vendéglátóhely zár be, a számuk 41 900-ra csökkent; a havi bruttó átlagkereset 420 ezer forint, a nemzetgazdasági átlag mindössze 60%-a.","kulcsszavak":["turizmus","leépítés","munkaerő-kölcsönzés","munkáltatói szövetség","bérek"],"het":"2026-07-06","id":"ART-0399","url_forras":"docx","kivonat":"Értem, elnézést. A Magyar Vendéglátók Ipartestülete szerint felgyorsult a vendéglátóhelyek bezárása: a korábbi napi 3-4 helyett most már 4-5 üzlet zár be naponta, így számuk tavaly év végére 41 900-ra csökkent – 9500-zal kevesebb, mint 2019-ben –, elsősorban az italüzletek, kávézók és éttermek rovására. Az üres álláshelyek száma és aránya kissé nőtt 2025 végén, ezzel a munkaerőhiány is enyhén emelkedett az ágazatban, amely 167 ezer főt foglalkoztatott. A havi bruttó átlagkereset 420 ezer forint volt (9%-os emelkedés), ami továbbra is a nemzetgazdasági átlag mindössze 60%-a. Az MVI kifogásolta, hogy az uniós összevetésben is alacsony 5%-os éttermi áfa egyszerűsítése vagy kiterjesztése továbbra is elmaradt."},{"cim":"Eldőlt, 36 év után először sztrájkolnak a magyarországi IKEA dolgozói","url":"https://merce.hu/2026/07/08/eldolt-36-utan-eloszor-sztrajkolnak-a-magyarorszagi-ikea-dolgozoi/","forras":"Mérce","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az IKEA magyarországi dolgozói 36 év után először sztrájkolnak a sikertelen béremelési tárgyalások miatt; a KASZ egységes, 6%-os alapbéremelést és új kollektív szerződést követel.","kulcsszavak":["kereskedelem","szakszervezet","bérek"],"het":"2026-07-06","id":"ART-0400","url_forras":"docx","kivonat":"36 éves hazai jelenléte alatt először sztrájkolnak az IKEA dolgozói: mindhárom hazai üzletben figyelmeztető munkabeszüntetés várható, miután a béremelésről folytatott, öt fordulós tárgyalások sikertelenül zárultak. A feszültség 2026 elején kezdődött, amikor a cég előbb az elmaradó béremelést, majd a rekordbevételt kommunikálta – ez a szakszervezeti tagságot mintegy 30 főről 200-ra duzzasztotta –, és bár áprilisban volt egy differenciált bérfejlesztés, a dolgozók többségének helyzete nem rendeződött. A KASZ egységes, 6%-os alapbéremelést, új kollektív szerződést és az uniós bértranszparencia-irányelv bevezetését követeli, az IKEA viszont a pénzügyi év augusztus végi zártáig mindenfajta bérfejlesztést kizárt. A cikk ezt a nagyvállalat globális, a Trump-féle vámok és a növekvő nyersanyagköltségek miatti spórolási stratégiájába illeszti bele."},{"cim":"Óriási bejelentést tett a vezérigazgató, miután kirúgta Kapitány István: napokon belül átadják a világ második legnagyobb Mercedes-gyárát Magyarországon – Pécsen hatalmas beruházás készül","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/beruhazas-mercedes-kecskemet-hipa","forras":"Világgazdaság","datum":"2026-07-08","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Joó István négy év után távozik a HIPA éléről; az elmúlt négy évben 472 beruházási megállapodás született 35 milliárd euró értékben, 67 ezer új munkahelyet teremtve.","kulcsszavak":["beruházás","politika","autóipar"],"het":"2026-07-06","id":"ART-0401","url_forras":"talalt","kivonat":"Négy év után távozik a HIPA éléről Joó István, miután Kapitány gazdasági és energetikai miniszter kezdeményezte visszahívását. Joó a közösségi oldalán jelentette be távozását, egyúttal beruházási eredményekről is számot adott: az elmúlt négy évben 472 projektről született megállapodás összesen 35 milliárd euró (mintegy 13 370 milliárd forint) értékben, ami 67 ezer új munkahelyet teremt. Kiemelte a dél-magyarországi térség felgyorsuló ipari fejlődését (BYD Szeged, CPMC Makó, VSG Békéscsaba, valamint egy készülő pécsi fejlesztés), a K+F-eredményeket, továbbá az autóipari beruházásokat – köztük a napokon belül átadandó kecskeméti Mercedes-üzemet, amelyet a világ második legnagyobb Mercedes-gyáraként említett."},{"cim":"A várható drasztikus fizetéscsökkentés hírére már van olyan állami cégvezető, aki piaci állások után érdeklődik náluk, mondta egy munkaerőpiaci szakértő","url":null,"forras":"RTL","datum":"2026-07-04","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint több állami cégvezető is jelentkezett náluk a várható drasztikus fizetés- és létszámcsökkentés hírére, alternatív állások után érdeklődve.","kulcsszavak":["Trenkwalder","gazdasági kilátások","bérek"],"het":"2026-06-29","id":"ART-0402","kivonat":"Az RTL Híradó riportja szerint az állami cégvezetőket érintő, várható drasztikus fizetés- és létszámcsökkentés hírére máris megmozdult a munkaerőpiac: Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint több állami vezető is jelentkezett náluk és más piaci szereplőknél alternatív lehetőségek után érdeklődve. Magyar Péter a csütörtöki kormányinfón üzent az állami vállalatok vezetőinek, hogy az igazgatóságok és felügyelőbizottságok létszámának jelentős csökkentésére és a fizetések radikális visszavágására számítsanak, a pontos mértékről azonban még nem született döntés. Nógrádi ugyanakkor úgy látja, a távozók nehéz helyzetbe kerülhetnek: a harmadik éve recesszióban lévő versenypiacon nincsenek ilyen magas felsővezetői bérek, és több pozíció egyidejű betöltése is elképzelhetetlen lenne."},{"cim":"Az Egis gyógyszergyár lett a legvonzóbb munkáltató az élettudományok szektorban","url":"https://www.hrportal.hu/hr/az-egis-gyogyszergyar-lett-a-legvonzobb-munkaltato-az-elettudomanyok-szektorban-20260705.html","forras":"HR Portál","datum":"2026-07-05","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Az Egis Gyógyszergyár elnyerte a Randstad munkáltatói márkakutatásában az élettudományi szektor legvonzóbb munkahelyének járó elismerést; a HR-igazgató a béren kívüli juttatásokat és a home office-t emelte ki.","kulcsszavak":["Randstad","egészségügy","munkáltatói márka"],"het":"2026-06-29","id":"ART-0403","url_forras":"talalt","kivonat":"A HR Portálon támogatott tartalomként megjelent interjú az Egis Gyógyszergyár HR- és kommunikációs igazgatójával, dr. András Klárával abból az alkalomból, hogy az Egis a Randstad munkáltatói márkakutatásában elnyerte az élettudományi szektor legvonzóbb munkahelyének járó elismerést. Az igazgató szerint a magyar munkavállalók tudatosan – a fizetés, a jó légkör, a biztonság, a munka-magánélet egyensúly és a karrierépítés alapján – választanak munkahelyet, és a cég ezekben sokat tesz értük (béren kívüli juttatások, 13. havi jutalom, home office). Kiemeli, hogy bár a gyógyszeripar itthon sosem volt az élmezőnyben, az élettudományi szektor egyre erősebben felzárkózik az IT és az üzleti szolgáltató ágazatok mögé."},{"cim":"Komoly ára lehet annak, ha valaki a nyaraláson sem tud elszakadni a munkától","url":"https://www.hrportal.hu/hr/komoly-ara-lehet-annak-ha-valaki-a-nyaralason-sem-tud-elszakadni-a-munkatol-20260709.html","forras":"HR Portál","datum":"2026-07-09","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szakértői a nyári „szabadság-szorongás” jelenségéről írnak: sok dolgozó bűntudatból figyeli a céges e-maileket nyaraláson; a megoldás a tudatos feladatátadás és a vezetői példamutatás.","kulcsszavak":["WHC","mentális egészség","munkakörülmények"],"het":"2026-07-06","id":"ART-0404","url_forras":"talalt","kivonat":"A WHC szakértői a nyári „szabadság-szorongás” (PTO-anxiety) jelenségéről írnak: sok dolgozó a nyaraláson sem tud elszakadni a munkától, bűntudatból figyeli a céges e-maileket, mert fél a visszatérés utáni feladatcunamitól vagy a folyamatos elérhetőséget a lojalitás jelének tekinti. A cikk szerint ez súlyos mentális terhet jelent, és a felgyülemlett stressz miatt a főszezon után visszaeshet a teljesítmény, ezért fontos, hogy a vállalati kultúra támogassa az offline létet. A megoldás a tudatos, transzparens feladatátadás – a projektek listázása és a helyettesítőkkel való egyeztetés, a világos „Házon kívül” üzenet és a céges értesítések lekapcsolása, valamint a vezetői példamutatás."},{"cim":"Vendégmunkás vagy robot? Égető a munkaerőhiány a magyar mezőgazdaságban","url":"https://mfor.hu/cikkek/agrarium/vendegmunkas-vagy-robot-egeto-a-munkaerohiany-a-magyar-mezogazdasagban-.html","forras":"MFOR","datum":"2026-07-16","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Egy szabolcsi gazda példáján a cikk bemutatja a mezőgazdaság kettős szorítását: az idénymunkások eltűnését és a klímaváltozás okozta károkat; Koncz Máté (MOSZ) szerint a robotizálás csak részleges és lassú megoldás.","kulcsszavak":["agrárium","szezonális munka","automatizáció","munkáltatói szövetség"],"het":"2026-07-13","id":"ART-0405","url_forras":"docx","kivonat":"Egy szabolcsi gazda példáján keresztül mutatja be a cikk a mezőgazdaság kettős szorítását: az idénymunkások eltűnését – a napszám 15-20%-os emelkedése ellenére már öt-hat faluból kell összetoborozni az embereket – és a klímaváltozás okozta fagy- és aszálykárokat. Koncz Máté (MOSZ) szerint a robotizálás csak részleges és lassú megoldás, hiszen külföldön már a szedőgépeket üzemeltető néhány ember sincs meg, ráadásul ha nem áll be pár vendégmunkás a termeléshez, a mögöttük álló magyar munkahelyek is veszélybe kerülnek. A cikk szembeállítja ezt a spanyol gyakorlattal, ahol az AI-alapú válogatás és a robotizált megoldások harmadával csökkentették a bérköltséget, és felidézi a Master Good–Magyar Péter vitát is."},{"cim":"Lassan ellepik Székelyföldet a nepáliak és a bangladesiek: Romániában is egyre több a vendégmunkás","url":"https://www.vg.hu/nemzetkozi-gazdasag/2026/07/munkaeropiac-vendegmunkas-erdely-szekelyfold","forras":"Világgazdaság","datum":"2026-07-15","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Romániában gyorsul a nem uniós vendégmunkások beáramlása, ami Erdélyben és Székelyföldön is látszik; idén már 90 ezer új munkavállalási engedélyt adtak ki, a legtöbb harmadik országbeli Nepálból érkezett.","kulcsszavak":["régiós különbségek","vendégmunka"],"het":"2026-07-13","id":"ART-0406","url_forras":"docx","kivonat":"Romániában tovább gyorsul a nem uniós vendégmunkások beáramlása, ami már Erdélyben és a székelyföldi megyékben is markánsan látszik: a kormány idén már 90 ezer új munkavállalási engedélyt adott ki, tavaly pedig rekordot jelentő 118 ezer engedélyt adtak ki. Hargita megye országos összevetésben is előkelő helyen áll 670 engedéllyel, a nyilvántartott 430 harmadik országbeli közül a legtöbben Nepálból érkeztek, és a tendencia Maros és Kovászna megyében is hasonló – a dolgozók főként az építőiparban, a feldolgozóiparban, a vendéglátásban és az élelmiszeriparban helyezkednek el."},{"cim":"Napi 30 ezer forint a hőségben – Ennyit keres most egy jó idénymunkás Magyarországon","url":"https://www.blikk.hu/gazdasag/penz/szezonmunka-keresetek-mezogazdasag/dd6197w","forras":"Blikk","datum":"2026-07-11","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A mezőgazdasági szezonmunkára akkora a hiány, hogy a munkaadói igény 66%-kal nőtt egy év alatt; a legéletképesebb megoldás a nemzeti kártyás ukrán munkaerő, egy jó szedő napi 20-30 ezer forintot is hazavisz.","kulcsszavak":["szezonális munka","Menton Jobs","vendégmunka","agrárium"],"het":"2026-07-06","id":"ART-0407","url_forras":"docx","kivonat":"A mezőgazdasági szezonmunkára akkora a hiány, hogy a munkaadói igény 66%-kal nőtt egy év alatt: Letenovics Roland (Menton Jobs) szerint a szükséglet felét ázsiai munkaerővel oldották volna meg, a főleg északkeleten toborzott magyarok nagyobb fele pedig lemorzsolódott – a nettó átlagkereset 15%-os emelkedése ellenére –, így a legéletképesebb megoldás a nemzeti kártyás ukrán munkaerő. Az átlagos bérigény 2500-2600 forint óránként, a gyakorlatban jellemzőbb a teljesítménybér, egy jó szedő napi 20-30 ezer forintot is hazavisz, a gyengébben teljesítők kikopnak. Egy zsámbéki-medencei gyümölcstermesztő vitatja, hogy csak az ukránok maradtak: nála 15-20 éve ugyanaz a jórészt roma szedőbanda dolgozik – a jövőt a gépesítésben látja."},{"cim":"Hódít a karrierváltás 40 felett, ezek a legnépszerűbb szakmák az újratervezésnél","url":"https://novekedes.hu/vallalkozas/hodit-a-karriervaltas-40-felett-ezek-a-legnepszerubb-szakmak-az-ujratervezesnel","forras":"Növekedés.hu","datum":"2026-07-17","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Tanfolyamguru adatai szerint egyre több középkorú vág bele karrierváltásba, a tanfolyamkeresők negyede már 40 év feletti; a legkeresettebbek az egészségügyi, szépségipari, HR- és digitális képzések.","kulcsszavak":["megtartás","képzés","idősebb munkavállalók"],"het":"2026-07-13","id":"ART-0408","url_forras":"docx","kivonat":"A Tanfolyamguru adatai egyre több középkorú vág bele a karrierváltásba: a tanfolyamkeresők negyede már 40 év feletti, és sokan nem kényszerből, hanem tudatos döntésből váltanak – élvezhetőbb munkát, jobb fizetést vagy kiszámíthatóbb élethelyzetet keresve. Szabó Andrea szakértő szerint ma már egyre többen ismerik fel, hogy több sikeres karrier is beleférhet egy életbe. A legkeresettebbek az egészségügyi és szociális képzések, a szépségipari tanfolyamok, az adminisztrációs, HR- és bérügyintézői, illetve a digitális és marketing területek – a munkaerőpiacon már nem az életkor, hanem a naprakész tudás és az alkalmazkodóképesség számít."},{"cim":"Szegeden sokaknak az álláskeresés a munkája, pedig elvileg munkaerőhiány van","url":"https://telex.hu/gazdasag/2026/07/11/szegeden-sokaknak-az-allaskereses-a-munkaja-pedig-elvileg-munkaerohiany-van","forras":"Telex","datum":"2026-07-11","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Szegeden sok diplomás pályakezdő évekig hiába keres állást, miközben munkaerőhiányról beszélnek a cégek; a hiány a szakmunkás és műszaki pozíciókban van, Vida György szerint a vendégmunkások alkalmazása elkerülhetetlen.","kulcsszavak":["munkaerő-tartalék","munkaerőhiány"],"het":"2026-07-06","id":"ART-0409","url_forras":"docx","kivonat":"Szegeden sok diplomás pályakezdő évekig hiába keres állást, és sokan végül csak Budapesten tudtak elhelyezkedni –, miközben a munkáltatók munkaerőhiányról beszélnek. Ez nem ellentmondás, hanem strukturális munkanélküliség: a hiány nem a diplomások által keresett irodai és társadalomtudományi pozíciókban van, hanem a szakmunkás, műszaki és termelési munkakörökben, a cégek pedig kevésbé nyitottak junior pozíciók meghirdetésére és pályakezdők kiképzésére. Vida György szerint a szegedi munkaerőpiac új korszakba lépett: a 2010-es évek SSC- és IT-növekedését az ipar (Rheinmetall, BYD) váltotta, ami műszaki és logisztikai dolgozókat keres – a vendégmunkások alkalmazását pedig elkerülhetetlennek nevezte."},{"cim":"Ez már az új kormánynak szól: rekord szintre nőtt a magyar vállalkozások üzleti hangulata","url":"https://www.portfolio.hu/gazdasag/20260716/ez-mar-az-uj-kormanynak-szol-rekord-szintre-nott-a-magyar-vallalkozasok-uzleti-hangulata-850016","forras":"Portfolio","datum":"2026-07-16","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A VOSZ Barométer szerint a vállalkozások üzleti hangulata rekordszintre, 63%-ra nőtt; új felvételt csak a cégek 24%-a tervez, a szakképzett munkaerő hiányát nevezték meg a legmarkánsabb problémaként.","kulcsszavak":["kutatás és statisztika","gazdasági kilátások","munkaerőhiány"],"het":"2026-07-13","id":"ART-0410","url_forras":"docx","kivonat":"A VOSZ Barométer második negyedéves adataiban rekordszintre, 61-ről 63%-ra nőtt a tagvállalkozások üzleti hangulata – a 2023 eleje óta mért legmagasabb érték –, a cégvezetők többsége bizakodó azzal kapcsolatban, hogy az új kormány javítani tudja a kkv-k működési környezetét. Az optimizmus a beruházásokban nem jelenik meg: az erre vonatkozó mutató 38-ról 30%-ra esett. A munkaerőpiaci vonatkozásokat illetően új felvételt csak a cégek 24%-a tervezett, az elbocsátást tervezők aránya tartósan 10% alatt maradt, ugyanakkor jelentősen, 80%-ra nőtt a fizetésemelést nem tervező cégvezetők aránya – a mindennapi üzletmenet legmarkánsabb problémájaként pedig a szakképzett munkaerő hiányát nevezték meg."},{"cim":"Üres vezetőfülkék, növekvő kockázatok: munkaerőhiány szorításában a logisztika","url":"https://newtechnology.hu/ures-vezetofulkek-novekvo-kockazatok-munkaerohiany-szoritasaban-a-logisztika/","forras":"New Technology","datum":"2026-07-16","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Trans-Sped HR-igazgatója szerint a logisztikában már nem a fuvarfeladat, hanem a munkaerő a szűk keresztmetszet; Európában közel félmillió betöltetlen tehergépjármű-vezetői állás jelzi a strukturális problémát.","kulcsszavak":["logisztika","munkaerőhiány","toborzás"],"het":"2026-07-13","id":"ART-0411","url_forras":"docx","kivonat":"A Trans-Sped HR-igazgatójával, Kőszegi Boglárkával készült interjú szerint a logisztikában már nem a fuvarfeladat a szűk keresztmetszet, hanem a munkaerő: Európában közel félmillió betöltetlen tehergépjármű-vezetői állás jelzi, hogy tartós strukturális problémáról van szó, amely valós üzleti kockázattá vált. A HR-igazgató szerint a korrekt bér csak belépő a versenybe, a megtartás a vállalati kultúrán múlik, a toborzás helyét pedig a tudatos utánpótlás-építésnek kell átvennie: saját képzések, oktatási együttműködések, nyitás a pályakezdők, pályamódosítók és a harmadik országbeliek felé."},{"cim":"Itt vannak a legfrissebb átlagkeresetek","url":"https://24.hu/fn/gazdasag/2026/07/16/atlagkereset-medianber-majus-ksh/","forras":"24.hu","datum":"2026-07-16","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH szerint 2026 májusában a bruttó átlagkereset 764 100, a nettó 535 900 forint volt, éves szinten 8,7-11%-os emelkedéssel; a nonprofit szféra nettó átlaga volt a legmagasabb, a közfoglalkoztatottaké a legalacsonyabb.","kulcsszavak":["KSH","bérek"],"het":"2026-07-13","id":"ART-0412","url_forras":"docx","kivonat":"A KSH friss adatai szerint 2026 májusában a teljes munkaidőben alkalmazásban állók bruttó átlagkeresete 764 100, nettó átlagkeresete 535 900 forint volt, ami éves szinten 8,7, illetve 11%-os emelkedést jelent – az 1,8%-os infláció mellett a reálkeresetek 9%-kal nőttek. A nettó középérték 436 200 forint, csaknem százezerrel kevesebb az átlagnál, amelyet a kiugróan magas fizetések húznak felfelé. A nettó bérek gyorsabb növekedése nem pusztán béremelés eredménye, hanem az adókedvezmények – a családi kedvezmény emelése és az anyák szja-mentessége – hatása is; szektoronként a nonprofit szféra nettó átlaga volt a legmagasabb (550 400 forint), a közfoglalkoztatottaké pedig mindössze 122 600 forint."},{"cim":"Súlyos kezdőbérrel csábítják ezeket a szakembereket Magyarországon: mutatjuk, kik kereshetnek akár havi 2,5 milliót","url":"https://www.penzcentrum.hu/karrier/20260716/sulyos-kezdoberrel-csabitjak-ezeket-a-szakembereket-magyarorszagon-mutatjuk-kik-kereshetnek-akar-havi-25-milliot-1202339","forras":"Pénzcentrum","datum":"2026-07-16","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A PROGmasters szerint az IT-piacon egyre keresettebbek az egészségügyből, jogból, pénzügyből érkező pályamódosító juniorok; ilyen háttérrel a szeniorok akár havi 2,5 milliót is kereshetnek.","kulcsszavak":["képzés","bérek","megtartás","munkaerőhiány"],"het":"2026-07-13","id":"ART-0413","url_forras":"docx","kivonat":"A PROGmasters partnereinek visszajelzései alapján az IT-piacon egyre keresettebbek azok a pályamódosító juniorok, akik az egészségügyből, a jogból vagy a pénzügyből érkeztek – a legaltech, biotech, insurtech és fintech területeken kifejezetten előny az orvosi, jogi vagy pénzügyi diploma. A korábbi szaktudás a bérekben is megjelenik: ilyen háttérrel a pályakezdők induló alapfizetése elérheti a bruttó 900 ezer forintot, medior szinten 1,2-1,5 millióra nőhet, a szeniorok pedig akár havi 2,5 milliót is kereshetnek. A legkeresettebb szakmák a full-stack fejlesztő, a szoftvertesztelő, az adatelemző és az adatmérnök, a junior pozíciókat viszont a cégek jellemzően belső ajánlások vagy állásbörzék útján töltik be."},{"cim":"Átadták Európa legnagyobb Mercedes-gyárát Kecskeméten","url":"https://www.hrportal.hu/c/atadtak-europa-legnagyobb-mercedes-gyarat-kecskemeten-20260714.html","forras":"HR Portál","datum":"2026-07-14","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Átadták a Mercedes-Benz kecskeméti üzemét, Európa legnagyobb és a világ második legnagyobb Mercedes-gyárát; a cél a 350 ezres éves darabszám és a 9-10 ezres létszám elérése egymilliárd eurós beruházással.","kulcsszavak":["autóipar","beruházás"],"het":"2026-07-13","id":"ART-0414","kivonat":"Átadták a Mercedes-Benz új kecskeméti üzemét, amellyel a gyár Európa legnagyobb és a világ második legnagyobb Mercedes-üzemévé vált – itt gyártják a C-osztály elektromos változatát. Magyar Péter miniszterelnök szerint a jelenleg ötezer embert foglalkoztató, évi több mint 100 ezer autót gyártó üzemben a cél a 350 ezres éves darabszám és a 9-10 ezres létszám elérése; a Mercedes egymilliárd eurós beruházásával duplájára nő a termelési kapacitás. A miniszterelnök kiszámítható partnerséget, versenyképes adórendszert és képzett munkaerőt ígért, ugyanakkor elvárja az előírások betartását és a magyar munkavállalók megbecsülésé – emellett a magyar kkv-k beszállítói bekapcsolódását és a digitalizáció támogatását.","url_forras":"docx"},{"cim":"„Sorozat sabbatical”, aminek a vége karrierváltás lett","url":"https://www.hrportal.hu/hr/sorozat-sabbatical-aminek-a-vege-karriervaltas-lett-20260717.html","forras":"HR Portál","datum":"2026-07-17","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Fogarasi Norbert a Morgan Stanleynél háromszor vett ki féléves fizetés nélküli szabadságot, majd karriert váltott; szerinte az AI a kódolást kiváltja, de a problémamegoldás továbbra is érték marad.","kulcsszavak":["rugalmas foglalkoztatás","megtartás","kutatás és statisztika"],"het":"2026-07-13","id":"ART-0415","url_forras":"docx","kivonat":"A HR Portál Fogarasi Norberttel készített interjút a sabbaticalek fontosságáról. Fogarasi a Morgan Stanleynél töltött 26 év alatt háromszor vett ki féléves fizetés nélküli szabadságot – mindannyiszor tanulni, kutatni. Tavaly végleg karriert váltott, feladta a Morgan Stanley 3000 főt foglalkoztató budapesti irodájának vezetését, azóta a Pázmány Péter Katolikus Egyetemen oktat és kutat. A sabbaticalek nem voltak részei a céges kultúrának, egyedi engedéllyel kapta meg őket, az egyéves előkészítés és a fél éves átadás-átvétel viszont a szervezetnek is hasznos volt: a kollégák kipróbálhatták magukat, ő megújult energiával tért vissza. A pályakezdőkről úgy véli, nehezebb a helyzetük, az AI a kódolást valóban kiváltja, de a problémamegoldás továbbra is érték marad."},{"cim":"Otthonról végezhető ingyenes képzést indítanak magyaroknak AI-ból","url":"https://hvg.hu/tudomany/20260714_ingyenes-ai-tanfolyam-kepzes-magyaroknak-aws-mesterseges-intelligencia","forras":"HVG","datum":"2026-07-14","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Az Amazon Web Services ingyenes AI-képzési programot indít Magyarországon és 17 más országban; az európai vállalkozások 44%-a az AI- és digitális készségek hiányát tartja a fő akadálynak.","kulcsszavak":["IT","AI","automatizáció","munkaerőhiány"],"het":"2026-07-13","id":"ART-0416","url_forras":"docx","kivonat":"Az Amazon Web Services Magyarországon és további 17 közép- és kelet-európai országban indít ingyenes AI-képzési programot: az AWS AI Get Certified Challenge résztvevői három hónapos díjmentes hozzáférést kapnak a Skill Builder mesterséges intelligenciával, gépi tanulással és generatív AI-jal foglalkozó képzéseihez, a követelményeket teljesítők pedig félárú minősítő vizsgát. A kezdeményezés a szakemberhiányra reagál: az európai vállalkozások 54%-a már alkalmaz AI-t (két éve még 33%), 44%-uk viszont épp az AI- és digitális készségek hiányát tartja a szélesebb körű alkalmazás fő akadályának."},{"cim":"A vendégmunkásvita a magyar ipar egyik érzékeny pontját találta el","url":"https://telex.hu/g7/vallalat/2026/07/14/vendegmunkasok-ipar-vita-munkaero-beruhazas-automatizacio","forras":"G7","datum":"2026-07-14","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A G7 elemzése szerint a vendégmunkás-szigorítás a hazai munkaerő elfogyására és a betanított munkásoknál akár 15%-os fluktuációra tapint rá; a Randstad magyarországi vezetője, Baja Sándor szerint az automatizáció felkészülési ideje irreális.","kulcsszavak":["Randstad","vendégmunkás-stop","megtartás"],"het":"2026-07-13","id":"ART-0417","url_forras":"talalt","kivonat":"A G7 elemzése szerint a vendégmunkás-szigorítás a magyar gazdaság egyik szerkezeti gyengeségére tapintott rá: a hazai munkaerő elfogyott, a mobilitás hiányzik, a betanított munkásoknál pedig akár 15%-os a folyamatos fluktuáció – ezt a stabil gerincet éppen a vendégmunkások tartották egyben. A béreket sem szorítják le, a piacon senki sem számít arra, hogy a stop tartós béremelést hozna; a Randstad magyarországi vezetője, Baja Sándor grafikonja azt is mutatja, hogy a hazai munkavállalók között az uniós átlagnál stabilan kisebb a felsőfokú végzettségűek aránya. A fő probléma a tempó: az automatizáció idővel csökkentheti a vendégmunkás-igényt, de a néhány hónapos felkészülési idő irreális, ezért a szereplők kontrollált, szakmai megoldást sürgetnek."},{"cim":"Uborkaszezon vagy aranybánya az álláskeresés nyáron?","url":"https://hrportal.hu/hr/uborkaszezon-vagy-aranybanya-az-allaskereses-nyaron-20260714.html","forras":"HR Portál","datum":"2026-07-14","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC elemzése szerint a nyári „uborkaszezon” mítosz: júliusban-augusztusban 15-20%-kal kevesebb a jelölt, ami könnyebbé teszi a kitűnést; a júliusi-augusztusi jelentkezéssel már a szeptemberi boom előtt ajánlattételi szakaszba lehet érni.","kulcsszavak":["WHC","munkanélküliség","szezonális munka","munkáltatói márka"],"het":"2026-07-13","id":"ART-0418","url_forras":"talalt","kivonat":"A WHC elemzése szerint a nyári „uborkaszezon” az álláskeresésben mítosz: a toborzás nem áll le, sok cég épp az év végi hajrára építi a csapatait, miközben júliusban és augusztusban 15-20%-kal kevesebb a jelölt, így könnyebb kitűnni az őszi roham előtt. A kevesebb pályázó mellett a HR-eseknek is több kapacitásuk marad elmélyedni a profilokban, ezért a mennyiség helyett a minőségre – a személyre szabott önéletrajzra és motivációs levélre – érdemes koncentrálni, és a lazább vállalati tempó a kapcsolatépítésre is jó alkalom. A szabadságolások miatt rugalmasságra van szükség az interjúk szervezésében, a július végén-augusztus elején indított jelentkezéssel viszont a szeptemberi „boom” előtt már az ajánlattételi szakaszba lehet érni."},{"cim":"Miért érdemes nevezni a hazai HR-kommunikációs megoldások elsőszámú versenyén?","url":"https://hrpwr.hu/cikk/a-hazai-hr-kommunikacios-megoldasok-elsoszamu-versenye","forras":"HRPWR","datum":"2026-07-23","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HRKOMM Award 2026-ban jubileumi, tizedik alkalommal keresi Magyarország legjobb HR-kommunikációs megoldásait, megújult kategóriarendszerrel, nemzetközi benchmarkokhoz igazított értékelési szempontokkal és független szakmai zsűrivel. A verseny célja, hogy elismerje azokat a HR-projekteket, amelyek valódi üzleti és szervezeti értéket teremtenek. A nevezők szakmai visszajelzést és nyilvánosságot kaphatnak, valamint pontokat szerezhetnek a HRPOWER HR Toplistán és az APEX PR Toplistán. A PROHUMAN a HRKOMM Award főtámogatójaként kiemelt szerepet vállal a verseny támogatásában.","kulcsszavak":["munkáltatói márka","munkakörülmények"],"het":"2026-07-20","id":"ART-0419","url_forras":"docx","kivonat":"A HRKOMM Award 2026-ban jubileumi, tizedik alkalommal keresi Magyarország legjobb HR-kommunikációs megoldásait, megújult kategóriarendszerrel, nemzetközi benchmarkokhoz igazított értékelési szempontokkal és független szakmai zsűrivel. A verseny célja, hogy elismerje azokat a HR-projekteket – legyen szó toborzási kampányról, employer brandingről, onboardingról, belső kommunikációról, wellbeingről vagy AI-alapú megoldásokról –, amelyek valódi üzleti és szervezeti értéket teremtenek. A nevezők nemcsak szakmai visszajelzést és széles körű nyilvánosságot kaphatnak, hanem eredményeikkel a HRPOWER HR Toplistán és az APEX PR Toplistán is pontokat szerezhetnek. A PROHUMAN a HRKOMM Award főtámogatójaként kiemelt szerepet vállal a hazai HR-kommunikációs szakma egyik legjelentősebb versenyének támogatásában, hozzájárulva a legjobb HR-megoldások elismeréséhez és láthatóságához."},{"cim":"Súlyos figyelmeztetést kapott az uniós óriásbanktól Magyarország és Lengyelország a vendégmunkások kitiltása miatt","url":"https://www.vg.hu/kozelet/2026/07/vendegmunkasok-kitiltasa-magyar-lengyel-figyelmeztetes","forras":"Világgazdaság","datum":"2026-07-22","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Magyarország és Lengyelország az EU-n kívüli vendégmunkások foglalkoztatásának szigorításával igyekszik megfelelni a bevándorlásellenes közvéleménynek, miközben a vállalatok munkaerőhiánnyal szembesülnek. Az Európai Újjáépítési és Fejlesztési Bank vezető közgazdásza szerint a külföldi munkavállalók számának csökkentése lassíthatja a gazdasági növekedést és növelheti az elöregedő társadalmak nyugdíj- és egészségügyi terheit.","kulcsszavak":["vendégmunka","munkaerőhiány","demográfia","beruházás"],"het":"2026-07-20","id":"ART-0420","url_forras":"docx","kivonat":"Magyarország és Lengyelország az Európai Unión kívülről érkező vendégmunkások foglalkoztatásának szigorításával igyekszik megfelelni a bevándorlásellenes közvélemény elvárásainak, miközben a vállalatok egyre súlyosabb munkaerőhiánnyal szembesülnek. Az Európai Újjáépítési és Fejlesztési Bank vezető közgazdásza arra figyelmeztet, hogy a külföldi munkavállalók számának csökkentése hosszabb távon lassíthatja a gazdasági növekedést, mérsékelheti az adóbevételeket, és tovább növelheti az elöregedő társadalmak nyugdíj- és egészségügyi kiadásainak finanszírozási terheit, miközben Magyarország és Lengyelország intézményrendszere még viszonylag rövid ideje alkalmazkodik ahhoz, hogy a korábbi kivándorló országokból célországgá váltak a külföldi munkavállalók számára."},{"cim":"Az éveken át migránsokkal riogató Orbán-kormány nem magyar munkavállalókkal tervezte feltölteni a BYD-es álláshelyeket, hanem harmadik országbeliekkel","url":"https://nepszava.hu/3329587_velkey-gyorgy-laszlo-szeged-byd-szijjarto-peter-vendegmunkasok","forras":"Világgazdaság","datum":"2026-07-22","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Velkey György László, a Tisza Párt külügyi államtitkára szerint a BYD és alvállalkozói a szegedi beruházáshoz csaknem annyi harmadik országbeli munkavállalóra kértek engedélyt, mint amennyi új munkahelyet ígértek. A politikus szerint ez ellentmond a korábbi kormányzati kommunikációnak, és felidézi, hogy a beruházási szerződést Szijjártó Péter tárgyalta le, a kormány pedig kiemelt beruházási státusszal és gyorsított vízumeljárással is támogatta a kínai vállalatot.","kulcsszavak":["vendégmunka","autóipar"],"het":"2026-07-20","id":"ART-0421","url_forras":"docx","kivonat":"Velkey György László, a Tisza Párt külügyi államtitkára állítási szerint a BYD és alvállalkozói a szegedi beruházáshoz csaknem annyi harmadik országbeli munkavállalóra kértek és kaptak csoportos munkavállalási engedélyt, mint ahány új munkahely létrehozását ígérték. A politikus szerint ez ellentmond a korábbi kormányzati kommunikációnak a migráció és a vendégmunkások kérdésében, és azt is felidézi, hogy a BYD beruházási szerződését Szijjártó Péter, korábbi külgazdasági- és külügyminiszter tárgyalta le, valamint a minisztériumi dokumentumok alapján a kormány több intézkedéssel is támogatta a kínai vállalat magyarországi beruházását, köztük a kiemelt beruházási státusz és a kínai munkavállalók gyorsított vízumeljárásának biztosításával."},{"cim":"Nem biztos, hogy érdemes vendégmunkásokkal megmenteni a mostani magyar iparszerkezetet","url":"https://telex.hu/g7/vallalat/2026/07/19/vendegmunkasok-magyar-iparszerkezetet-demografia-munkaerohiany-kepzettseg","forras":"G7","datum":"2026-07-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkások alkalmazásáról szóló vita nem csak a munkaerőhiányról szól, hanem a magyar gazdaság szerkezetéről és versenyképességéről is. A cikk hangsúlyozza, hogy a munkaerőhiánynak eltérő okai vannak (készséghiány, földrajzi eltérések, megtartási nehézségek), és a vendégmunkásokra nem lehet tartós válaszként tekinteni a szerkezeti kihívásokra, miközben a külföldi munkavállalók jogi kiszolgáltatottsága is problémát jelent.","kulcsszavak":["vendégmunka","gazdasági kilátások","munkaerőhiány"],"het":"2026-07-13","id":"ART-0422","url_forras":"docx","kivonat":"A vendégmunkások alkalmazásáról szóló vita nem kizárólag a munkaerőhiányról szól, hanem a magyar gazdaság szerkezetéről és hosszú távú versenyképességéről is. A külföldi munkavállalók hirtelen kizárása valódi nehézségeket okozhat a már működő vállalatoknak, ugyanakkor a munkaerőhiányt nem szabad egységes problémaként kezelni, mert annak különböző okai – például a készséghiány, a földrajzi eltérések vagy a munkavállalók megtartásának nehézségei – eltérő megoldásokat igényelnek. A cikk hangsúlyozza, hogy a vendégmunkásokra nem lehet tartós válaszként tekinteni a gazdaság szerkezeti kihívásaira, miközben a külföldi munkavállalók jogi kiszolgáltatottságára és a munkafeltételek javításának szükségességére is felhívja a figyelmet."},{"cim":"Ők lehetnek a hazai munkaerőhiány legnagyobb nyertesei: óriási tabu, alig beszélnek erről","url":"https://www.penzcentrum.hu/karrier/20260707/ok-lehetnek-a-hazai-munkaerohiany-legnagyobb-nyertesei-oriasi-tabu-alig-beszelnek-errol-1201694","forras":"Pénzcentrum","datum":"2026-07-07","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Salva Vita Alapítvány szakértőivel készült interjú szerint a megváltozott munkaképességű és fogyatékossággal élő emberek foglalkoztatása jelentősen elmarad a teljes népességétől, elsősorban a munkáltatók információhiánya miatt. A befogadó munkahelyek üzleti szempontból is előnyt jelentenek, de szemléletváltásra, vezetői felkészítésre és kiszámíthatóbb állami támogatásra van szükség a sikeres integrációhoz.","kulcsszavak":["esélyegyenlőség","foglalkoztatottság","munkaerő-tartalék"],"het":"2026-07-06","id":"ART-0423","url_forras":"docx","kivonat":"A Pénzcentrum a Salva Vita Alapítvány két szakértőjével készített interjút arról, hogy a megváltozott munkaképességű és fogyatékossággal élő emberek foglalkoztatása továbbra is jelentősen elmarad a teljes népességétől, elsősorban a munkáltatók információhiánya és bizonytalansága miatt. A szakértők szerint a befogadó munkahelyek nemcsak társadalmi, hanem üzleti szempontból is előnyt jelentenek, mivel ezek a munkavállalók jellemzően elkötelezettek és lojálisak, ugyanakkor sikeres foglalkoztatásukhoz szemléletváltásra, a vezetők felkészítésére, a munkakörök rugalmas átalakítására és személyre szabott támogatásra van szükség. Az interjú arra is kitér, hogy a jelenlegi pályázati finanszírozás helyett kiszámíthatóbb állami támogatás segíthetné a munkaerőpiaci integrációt, amely hosszú távon nemcsak az érintettek, hanem a gazdaság számára is előnyös lenne."},{"cim":"A hazai cégek fele szerint eltűntek a jó szakmunkások","url":"https://gyartastrend.hu/cikk/a-hazai-cegek-fele-szerint-eltuntek-a-jo-szakmunkasok","forras":"Gyártástrend","datum":"2026-07-22","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Jobtain HR Szolgáltató Kékgalléros Benchmark kutatása szerint a cégek fele érzékeli, hogy jelentősen beszűkült a szakmunkások köre. A megbízhatóság a legfontosabb kiválasztási szempont, a legnagyobb akadályt pedig a bérigények és a kínált fizetések közötti különbség jelenti. A szakmunkáspiac egyre jelöltvezéreltebbé válik, felértékelődik a gyors kiválasztás és a munkavállalói ajánlások szerepe.","kulcsszavak":["munkaerőhiány","toborzás","bérek"],"het":"2026-07-20","id":"ART-0424","url_forras":"docx","kivonat":"A magyarországi vállalatok továbbra is komoly nehézségekkel szembesülnek a fizikai munkavállalók és különösen a szakmunkások toborzásában. A Jobtain HR Szolgáltató országos Kékgalléros Benchmark kutatása alapján a cégek számára ma már a megbízhatóság a legfontosabb kiválasztási szempont, miközben a szakmai tapasztalat és a gyors tanulási képesség is egyre nagyobb szerepet kap. A vállalatok közel fele úgy érzékeli, hogy jelentősen beszűkült a szakmunkások köre, a legnagyobb akadályt pedig a bérigények és a kínált fizetések közötti különbség, a kevés jelentkező és a megfelelő tapasztalat hiánya jelenti. A szakmunkáspiac egyre inkább jelöltvezéreltté válik, ezért felértékelődik a gyors kiválasztás, a pozitív jelöltélmény és a hatékony toborzás, miközben a munkavállalói ajánlások továbbra is az egyik legerősebb eszközt jelentik a megfelelő munkaerő megtalálásában."},{"cim":"Nyolcéves csúcsra ugrott a fogyasztói bizalom Magyarországon, de van egy komoly bökkenő","url":"https://www.portfolio.hu/gazdasag/20260723/nyolceves-csucsra-ugrott-a-fogyasztoi-bizalom-magyarorszagon-de-van-egy-komoly-bokkeno-851578","forras":"Portfolio","datum":"2026-07-23","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A GKI júliusi felmérése szerint többéves csúcsra emelkedett a magyar fogyasztói bizalom és a konjunktúraindex. A lakosság kedvezőbben ítéli meg anyagi helyzetét, de a javuló hangulat egyelőre nem hozott élénkülést a vállalati oldalon: a cégek nem terveznek számottevő létszámbővítést, az áremelési szándék pedig közel kétéves mélyponton van.","kulcsszavak":["gazdasági kilátások","kutatás és statisztika","beruházás"],"het":"2026-07-20","id":"ART-0425","url_forras":"docx","kivonat":"A GKI júliusi felmérése alapján többéves csúcsra emelkedett a magyar fogyasztói bizalom és a hazai konjunktúraindex. A lakosság egyre kedvezőbben ítéli meg saját anyagi helyzetét és a gazdasági kilátásokat, ugyanakkor a javuló hangulat egyelőre nem jelentett jelentős élénkülést a vállalati oldalon. A cégek továbbra is óvatosak, nem terveznek számottevő létszámbővítést, miközben az áremelési szándékuk közel kétéves mélypontra csökkent. A bizalom erősödése pozitív jel, de a gazdasági fellendüléshez még szükség van arra, hogy a kedvezőbb várakozások tényleges fogyasztásban és üzleti aktivitásban is megjelenjenek."},{"cim":"Óriási tévhitben élnek a magyar dolgozók a nyári szabadságról: értékes napokat bukhatsz, ha erre nem figyelsz","url":"https://www.penzcentrum.hu/karrier/20260718/oriasi-tevhitben-elnek-a-magyar-dolgozok-a-nyari-szabadsagrol-ertekes-napokat-bukhatsz-ha-erre-nem-figyelsz-1202336","forras":"Pénzcentrum","datum":"2026-07-18","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Sok munkavállaló nincs tisztában a nyári szabadság kiadásának pontos szabályaival. A Munka Törvénykönyve szerint a szabadság időpontját alapvetően a munkáltató határozza meg, de a dolgozókat is megilletik jogok, például az évi legalább 14 egymást követő nap pihenőidő. Rendkívüli esetben a munkáltató módosíthatja az időpontot, de szigorú feltételek mellett, és köteles megtéríteni az ebből eredő károkat.","kulcsszavak":["munkajog"],"het":"2026-07-13","id":"ART-0426","url_forras":"docx","kivonat":"A nyári szabadságok időszakában sok munkavállaló nincs tisztában a szabadság kiadásának pontos szabályaival, ami félreértésekhez és akár a jogosan járó napok elvesztéséhez is vezethet. A Munka Törvénykönyve alapján fő szabály szerint a szabadság kiadásának időpontját a munkáltató határozza meg, ugyanakkor a dolgozókat is megilletik bizonyos jogok: például évente legalább egyszer tizennégy egymást követő nap pihenőidőt kell lehetővé tenni számukra. Rendkívüli gazdasági vagy működési okok esetén a munkáltató módosíthatja a szabadság időpontját, de ennek szigorú feltételei vannak, és az ebből eredő költségeket, károkat köteles megtéríteni. A tudatos tervezés, a korai egyeztetés és a munkáltató–munkavállaló közötti együttműködés ezért kulcsfontosságú a nyári szabadságolások gördülékeny megszervezésében."},{"cim":"Öt évvel többet dolgozunk, mint egy évtizede: valójában ennyit töltenek munkával a magyarok","url":"https://www.blikk.hu/gazdasag/munka-munkaeropiac-magyarok-dolgoznak/djd57gv","forras":"Blikk","datum":"2026-07-23","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A magyarok várhatóan átlagosan 37,5 évet töltenek a munkaerőpiacon, ami megegyezik az uniós átlaggal. Az Eurostat adatai szerint az elmúlt évtizedben öt évvel nőtt a várható munkaerőpiaci jelenlét hossza, amiben szerepet játszik a foglalkoztatottság bővülése és az idősebbek munkában maradása. A szakértők szerint hosszabb távon a digitalizáció és a termelékenység növelése jelenthet fenntartható megoldást a munkaerőhiányra.","kulcsszavak":["foglalkoztatottság","demográfia","kutatás és statisztika"],"het":"2026-07-20","id":"ART-0427","url_forras":"docx","kivonat":"A magyarok várhatóan átlagosan 37,5 évet töltenek a munkaerőpiacon, ami megegyezik az európai uniós átlaggal. Az Eurostat adatai alapján Magyarországon az elmúlt évtizedben öt évvel nőtt a várható munkaerőpiaci jelenlét hossza, amelyben szerepet játszik a foglalkoztatottság bővülése és az idősebb korosztályok egyre nagyobb arányú munkában maradása. Az elöregedő társadalom miatt a gazdaság számára egyre fontosabb a munkában töltött évek meghosszabbítása, valamint a munkaerőpiaci tartalékok – például az alacsonyabb foglalkoztatottságú csoportok és a nyugdíjasok – bevonása. Hosszabb távon azonban a szakértők szerint a technológiai fejlődés, a digitalizáció, a képzés és a termelékenység növelése jelenthet fenntartható megoldást a munkaerőhiány kihívásaira."},{"cim":"Megszólaltak a szakszervezetek: ezt várják a kormánytól a bérekkel és a munkavállalói jogokkal kapcsolatban","url":"https://www.penzcentrum.hu/karrier/20260722/megszolaltak-a-szakszervezetek-ezt-varjak-a-kormanytol-a-berekkel-es-a-munkavallaloi-jogokkal-kapcsolatban-1202656","forras":"Pénzcentrum","datum":"2026-07-22","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Öt szakszervezeti szövetség közös levélben fogalmazta meg elvárásait a kormány felé a szociális párbeszéd, a munkavállalói jogok és a bérek terén. Az érdekképviseletek az érdemi érdekegyeztetés helyreállítását, a kollektív szerződéskötési jog biztosítását és a sztrájkjogi szabályozás felülvizsgálatát kérik, valamint a bérek uniós szinthez való felzárkózását és az EU bértranszparencia-irányelv teljes átültetését.","kulcsszavak":["szakszervezet","bérek","bértranszparencia"],"het":"2026-07-20","id":"ART-0428","url_forras":"docx","kivonat":"Öt jelentős szakszervezeti szövetség közös levélben fogalmazta meg a kormány felé a munka világával kapcsolatos elvárásait, különös tekintettel a szociális párbeszéd, a munkavállalói jogok és a bérek kérdésére. Az érdekképviseletek szerint szükség van az érdemi érdekegyeztetés helyreállítására, az országos szintű párbeszéd megerősítésére, a szakszervezetek működésének és kollektív szerződéskötési jogának biztosítására, valamint a sztrájkjogi szabályozás felülvizsgálatára. A szakszervezetek kiemelt célként jelölték meg a munkavállalók jövedelmi helyzetének javítását is: elvárják, hogy folytatódjon a bérek felzárkózása az uniós szinthez, valamint, hogy Magyarország teljes körűen ültesse át az EU bértranszparencia-irányelvét."},{"cim":"Vallottak a külföldön dolgozó magyarok: tényleg ennyivel jobb az élet, ha elhagyjuk az országot?","url":"https://www.penzcentrum.hu/karrier/20260723/vallottak-a-kulfoldon-dolgozo-magyarok-tenyleg-ennyivel-jobb-az-elet-ha-elhagyjuk-az-orszagot-1202744","forras":"Pénzcentrum","datum":"2026-07-23","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Profession.hu felmérése szerint a külföldi munkavállalást már nem kizárólag a magasabb fizetés motiválja, egyre nagyobb szerepet kapnak a családi szempontok és az életminőség. A külföldön dolgozók háromnegyede szerint javult az életminősége, tízből nyolcan elégedettek munkahelyükkel. Dencső Blanka szerint a külföldi munkavállalás ma jóval összetettebb döntés, mint pusztán a fizetés kérdése.","kulcsszavak":["demográfia","Profession.hu","mentális egészség"],"het":"2026-07-20","id":"ART-0429","url_forras":"docx","kivonat":"A külföldi munkavállalás továbbra is sok magyar számára jelent vonzó lehetőséget, azonban a Profession.hu friss, reprezentatív felmérése szerint már nem kizárólag a magasabb fizetés motiválja azokat, akik más országban vállalnak munkát. A kutatás alapján egyre nagyobb szerepet kapnak a családi szempontok és az életminőség javításának igénye is. A külföldön dolgozók háromnegyede szerint életminősége javult, tízből nyolcan pedig elégedettek jelenlegi vagy legutóbbi munkahelyükkel. Dencső Blanka, a Profession.hu piackutatási és üzletfejlesztési szakértője szerint a kutatás azt mutatja, hogy a külföldi munkavállalás ma már jóval összetettebb döntés annál, mint hogy kizárólag a magasabb fizetés motiválná az embereket. A szakértő szerint az is figyelemre méltó, hogy a külföldi tapasztalatot szerzett magyarok döntő többsége összességében pozitívan értékeli az ott töltött időszakot, sokak számára ez nemcsak szakmai, hanem személyes fejlődést is jelentett."},{"cim":"Újraindították a beruházásösztönzési döntéshozatalt","url":"https://hipa.hu/hir/ujrainditottas-beruhazasosztonzesi-donteshozatal/","forras":"Hipa","datum":"2026-07-23","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Újraindult a beruházásösztönzési döntéshozatal, az első új Beruházási Bizottsági ülésen nyolc projektet tárgyaltak. Kiemelt figyelmet kapnak a magas hozzáadott értéket teremtő, korszerű technológiát hozó és képzett munkahelyeket létrehozó beruházások. A HIPA mandátumot kapott a jóváhagyott projektek részletes szakmai és üzleti tárgyalásainak folytatására.","kulcsszavak":["beruházás"],"het":"2026-07-20","id":"ART-0430","url_forras":"talalt","kivonat":"Újraindult a beruházásösztönzési döntéshozatal, miután megtartották az első új Beruházási Bizottsági ülést, amelyen nyolc projektet tárgyaltak. A jövőben kiemelt figyelmet kapnak azok a beruházások, amelyek magas hozzáadott értéket teremtenek, korszerű technológiát és tudást hoznak Magyarországra, valamint képzett munkahelyeket hoznak létre. A cél egy kiszámíthatóbb, átláthatóbb befektetési környezet kialakítása, amely erősíti a magyar gazdaság versenyképességét. A HIPA a Beruházási Bizottság döntése alapján mandátumot kapott arra, hogy a jóváhagyott projektek esetében folytassa a részletes szakmai és üzleti tárgyalásokat a vállalatokkal."},{"cim":"Országos adatokat mozdítanak el a fideszes média elbocsátásai","url":"https://telex.hu/g7/adat/2026/07/20/csoportos-letszamleepites-ner-fidesz-media","forras":"G7","datum":"2026-07-20","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"2026 júniusában jelentősen megugrott a csoportos létszámleépítések száma Magyarországon: országosan 1461 munkavállalót érintő elbocsátást jelentettek be, több mint fele Budapesten. A növekedésben szerepet játszhattak a kormányközeli médiacégek leépítései, és várhatóan a következő időszakban is jelentős maradhat a csoportos létszámcsökkentések száma.","kulcsszavak":["leépítés"],"het":"2026-07-20","id":"ART-0431","url_forras":"docx","kivonat":"2026 júniusában jelentősen megugrott a csoportos létszámleépítések száma Magyarországon: országosan 1461 munkavállalót érintő elbocsátást jelentettek be, amelyek több mint fele Budapesten történt. A növekedésben jelentős szerepet játszhattak a kormányközeli médiacégek leépítései, amelyek több száz munkavállalót érintettek. A leépítések hátterében a megváltozott politikai és gazdasági környezet, valamint a korábbi működési modell átalakulása állhat, és várhatóan a következő időszakban is jelentős maradhat a csoportos létszámcsökkentések száma."},{"cim":"Munka és magánélet: még messze vannak a magyarok az egyensúlyi állapottól","url":"https://mfor.hu/cikkek/kozelet/munka-es-maganelet-meg-messze-vannak-a-magyarok-az-egyensulyi-allapottol-.html","forras":"MFOR","datum":"2026-07-19","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Magyarországon még messze van az ideális munka-magánélet egyensúly, különösen a részmunkaidő elterjedtsége terén, amely jelentősen elmarad az uniós átlagtól. A rugalmasabb munkavégzés szélesebb körű alkalmazását anyagi és szervezési akadályok nehezítik. A szakértők szerint jogszabályi változásokra és a munkáltatói szemlélet fejlődésére egyaránt szükség van.","kulcsszavak":["rugalmas foglalkoztatás"],"het":"2026-07-13","id":"ART-0432","url_forras":"docx","kivonat":"Magyarországon még messze van az ideális munka–magánélet egyensúly megvalósulása, különösen az atipikus foglalkoztatási formák, például a részmunkaidő elterjedtsége terén. Bár a munkavállalók számára egyre fontosabb a rugalmasabb munkavégzés és a magánélet védelme, ennek szélesebb körű alkalmazását gyakran anyagi és szervezési akadályok nehezítik. Magyarországon a részmunkaidős foglalkoztatás aránya jelentősen elmarad az uniós átlagtól, miközben több nyugat-európai országban már bevett gyakorlat a rövidebb munkaidő és a rugalmasabb munkaszervezés. A szakértők szerint a munka és a magánélet jobb összehangolásához nemcsak jogszabályi változásokra, hanem a munkáltatói szemlélet és a vállalati kultúra fejlődésére is szükség van."},{"cim":"Felrobban a fizikai dolgozók bére Magyarországon","url":"https://www.portfolio.hu/gazdasag/20260722/felrobban-a-fizikai-dolgozok-bere-magyarorszagon-851374","forras":"Portfolio","datum":"2026-07-22","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A fizikai dolgozók bérei tovább emelkednek Magyarországon: a szak- és betanított munkások átlagos bruttó órabére 2026 második negyedévében 2430 forint volt, 8,5%-os növekedés az előző évhez képest. A Trenkwalder elemzése szerint minden régióban 2000 forint felett alakul az átlagos órabér, a legmagasabb szinteket Közép-Magyarországon és a fővárosban mérték.","kulcsszavak":["Trenkwalder","bérek"],"het":"2026-07-20","id":"ART-0433","url_forras":"talalt","kivonat":"Továbbra is erőteljesen emelkednek a fizikai dolgozók bérei Magyarországon: a szak- és betanított munkások átlagos bruttó órabére 2026 második negyedévében 2430 forint volt, ami 8,5%os növekedést jelent az előző év azonos időszakához képest. A Trenkwalder közel 7000 munkavállaló adatai alapján készült elemzése szerint már minden régióban 2000 forint felett alakul az átlagos órabér, a legmagasabb szintek pedig Közép-Magyarországon és a fővárosban figyelhetők meg. A béremelkedést továbbra is a képzett fizikai munkaerő iránti erős kereslet hajtja, ugyanakkor a növekedési ütem hosszabb távú fenntarthatósága kérdéses, mert a bérköltségek emelkedését nem minden esetben követi a gazdasági teljesítmény javulása."},{"cim":"Jönnek az ázsiai vendégmunkások, de így is fogy a munkaerő az összeszerelő üzemekből","url":"https://mfor.hu/cikkek/makro/jonnek-az-azsiai-vendegmunkasok-de-igy-is-fogy-a-munkaero-az-osszeszerelo-uzemekbol.html","forras":"MFOR","datum":"2026-07-22","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az ázsiai vendégmunkások növekvő száma ellenére csökken a munkaerő az összeszerelő üzemekben: a feldolgozóiparban egy év alatt 15 ezerrel mérséklődött a foglalkoztatottak száma. Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint a vállalatoknak a külföldi munkaerő bevonása mellett a meglévő munkaerő megtartására és képzésére is szükségük van.","kulcsszavak":["Trenkwalder","vendégmunka","ipar","munkaerőhiány"],"het":"2026-07-20","id":"ART-0434","url_forras":"docx","kivonat":"Az ázsiai vendégmunkások növekvő száma ellenére továbbra is csökken a munkaerő az összeszerelő üzemekben: a feldolgozóiparban egy év alatt több mint 15 ezerrel mérséklődött a foglalkoztatottak száma, miközben az új ipari beruházások egyre több munkavállalót igényelnek. Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint a vállalatok számára egyre nagyobb kihívást jelent a megfelelő munkaerő biztosítása, ezért a külföldi munkavállalók bevonása mellett a meglévő munkaerő megtartása, a képzés és a hatékonyabb foglalkoztatási megoldások is felértékelődnek. A demográfiai folyamatok, a munkaerőhiány és a nagy ipari beruházások együttesen olyan helyzetet teremtenek, amelyben a vállalatoknak hosszú távú stratégiákra van szükségük a megfelelő létszám biztosításához."},{"cim":"A bér már csak bevonz, a kultúra tart meg - új prioritások a tehetségekért vívott harcban","url":"https://www.hrportal.hu/hr/a-ber-mar-csak-bevonz-a-kultura-tart-meg-uj-prioritasok-a-tehetsegekert-vivott-harcban-20260720.html","forras":"HR Portál","datum":"2026-07-20","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A munkaerőpiacon egyre nagyobb a verseny a tehetségekért a demográfiai folyamatok miatt. A Randstad operációs vezetője, Demeter Csaba szerint a fizetés önmagában már nem elegendő a munkavállalók megszerzéséhez és megtartásához: a fiatalabb generációk számára fontos az egyenlő bánásmód, a modern technológiai környezet és a munka-magánélet egyensúlya. A Randstad kutatása szerint a fizetés után a munkahelyi atmoszféra és a munkahely biztonsága a legfontosabb szempontok.","kulcsszavak":["Randstad","munkáltatói márka","megtartás","munkakörülmények"],"het":"2026-07-20","id":"ART-0435","kivonat":"A munkaerőpiacon egyre nagyobb a verseny a tehetségekért, amit a demográfiai folyamatok tovább erősítenek: évente jóval több munkavállaló lép ki a piacról, mint ahány fiatal belép. A Randstad operációs vezetője, Demeter Csaba szerint a munkáltatóválasztásban a fizetés továbbra is meghatározó, de önmagában már nem elegendő a munkavállalók megszerzéséhez és megtartásához. A fiatalabb generációk számára egyre fontosabb az egyenlő bánásmód, a modern technológiai környezet, a vezetők átlátható kommunikációja, a jó munkahelyi légkör és a munka–magánélet egyensúlya. A Randstad kutatása alapján a fizetés után a kellemes munkahelyi atmoszféra, a munkahely biztonsága és a magánélethez igazodó munkakörnyezet számítanak a legfontosabb szempontoknak, ezért a vállalatoknak a bérezés mellett a szervezeti kultúrára és a munkavállalói élményre is nagyobb figyelmet kell fordítaniuk.","url_forras":"docx"},{"cim":"Spar, Tesco, Aldi, dm: ezer dolgozóval lett kevesebb a legnagyobb hazai boltláncoknál","url":"https://www.hrportal.hu/hr/spar-tesco-aldi-dm-ezer-dolgozoval-lett-kevesebb-a-legnagyobb-hazai-boltlancoknal-20260729.html","forras":"HR Portál","datum":"2026-07-29","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A HR Portál és az Opten közös létszámjelentése szerint áprilisról májusra a kiskereskedelemben csökkent a nagyvállalati foglalkoztatás: a Spar 312, a Tesco 396, a dm 139, az Auchan 102, az Aldi 43 fővel foglalkoztatott kevesebbet, egyedül a Lidl bővített 68 fővel. Az Aldinál 17 hónapja tart az apadás, 2025 januárja óta nettó 1544 fővel csökkent a létszám. A HR-szolgáltatói szektorban ellenkező irányba mozdult a mutató: a Prohuman állománya 416 fővel 5992-re, a WHC-é 208 fővel 6951-re nőtt, jórészt a munkaerő-kölcsönzés bővülése miatt.","kulcsszavak":["foglalkoztatottság","munkaerő-kölcsönzés","kereskedelem","WHC"],"het":"2026-07-27","id":"ART-0436","url_forras":"docx","kivonat":"A HR Portál és az Opten közös havi létszámjelentése szerint áprilisról májusra a kiskereskedelem húzta le a nagyvállalati foglalkoztatási statisztikát: a Spar (-312), a Tesco (-396), a dm (-139), az Auchan (-102) és az Aldi (-43) együtt közel ezer fővel foglalkoztatott kevesebbet, egyedül a Lidl bővített enyhén (+68). Az Aldinál már 17 hónapja tart az apadás, 2025 januárja óta nettó 1544 fővel lettek kevesebben. A HR-szolgáltatói szektor ezzel szemben élénkült: a Prohuman Zrt. állománya 416 fővel, 5992-re, a WHC-é 208 fővel, 6951-re nőtt – mindkét esetben jórészt a munkaerő-kölcsönzés hajtotta a bővülést."},{"cim":"Reagált a BYD: hosszú távon a munkahelyek döntő többségét magyar dolgozókkal töltenék be Szegeden","url":"https://szeged365.hu/2026/07/31/reagalt-a-byd-hosszu-tavon-a-munkahelyek-donto-tobbseget-magyar-dolgozokkal-toltenek-be-szegeden/","forras":"Szeged365","datum":"2026-07-31","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A BYD reagált Velkey György László Tisza-politikus videójára, amely szerint a cég tízezer vendégmunkás behozatalára kapott engedélyt. A vállalat szerint az engedély a beruházás előkészítési és kivitelezési szakaszára szóló csoportos keretengedély, amelyet egyszer sem használtak ki teljesen, és nem azonos a gyár végleges létszámával. A szegedi gyár jelenleg 800 magyar munkavállalót foglalkoztat, a termelés felfutásával a helyi toborzást és képzést bővítik, hosszú távon a munkahelyek döntő többségét magyar dolgozókkal töltenék be.","kulcsszavak":["vendégmunka","autóipar","politika","toborzás"],"het":"2026-07-27","id":"ART-0437","url_forras":"docx","kivonat":"A BYD reagált Velkey György László tiszás politikus videójára, miszerint tízezer vendégmunkás behozatalára kapott engedélyt. A vállalat szerint az engedély a beruházás előkészítési és kivitelezési szakaszára szóló csoportos keretengedélyhez kapcsolódik, vagyis összesített keretet jelent, nem az egyidejűleg itt dolgozók számát, és nem azonos a gyár működése során kialakuló végleges létszámmal – hozzátéve, hogy a keretet egyszer sem használták ki teljesen. A cég hangsúlyozta, hogy minden érkező munkavállaló nyilvántartásba kerül, és az idegenrendészeti hatóság felügyelete mellett dolgozik. A szegedi gyár jelenleg 800 magyar munkavállalót foglalkoztat, a termelés felfutásával pedig a helyi felvételt bővítenék: toborzási és képzési programokon dolgozik, hosszú távon a munkahelyek döntő többségét magyar dolgozókkal töltené be."},{"cim":"Paradicsomhajtatás: hol veszik el a versenyelőny?","url":"https://mezohir.hu/2026/07/25/mezogazdasag-paradicsomhajtatas-munkaero-es-hatekonysag/","forras":"Mezőhír","datum":"2026-07-25","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A FruitVeB Magyar Paradicsom Napján a MMOSZ arra mutatott rá, hogy a mezőgazdaságban egyszerre van munkaerőhiány és kihasználatlan tartalék: az 55 év felettiek, a kisgyermekes szülők és a hátrányos helyzetű térségek lakói csak korlátozottan mobilizálhatók. A szövetség szerint a harmadik országbeliek aránya a hazai agráriumban 2 százalék alatt marad az uniós 8-16 százalékkal szemben, és ha augusztusig nem születik vendégmunkás-szabályozás, az termelési károkat okozhat. Az ágazat versenyelőnye a 7-8 eurós órabér, a hektáronkénti éves munkaóra-felhasználás viszont 15-30 százalékkal magasabb a fejlett európai termelőkénél.","kulcsszavak":["vendégmunka","munkaerőhiány","agrárium","munkáltatói szövetség"],"het":"2026-07-20","id":"ART-0438","url_forras":"docx","kivonat":"A FruitVeB Magyar Paradicsom Napján a MMOSZ arra mutatott rá, hogy a mezőgazdaságban egyszerre van munkaerőhiány és kihasználatlan tartalék: az 55 év felettiek, a kisgyermekes szülők és a hátrányos helyzetű térségek lakói csak korlátozottan mobilizálhatók, miközben a modern üvegházi termelés már technológiai fegyelmet és digitális kompetenciát vár el. A szövetség szerint a mezőgazdaságban dolgozó harmadik országbeliek aránya itthon 2 százalék alatt marad az uniós 8–16 százalékkal szemben, és ha augusztusig nem születik működőképes vendégmunkás-szabályozás, az termelési károkat okozhat. Az ágazat versenyelőnye a 7–8 eurós órabér, a hektáronkénti éves munkaóra-felhasználás viszont 15–30 százalékkal magasabb a fejlett európai termelőkénél."},{"cim":"Heti 2-3 nap home office-t vár el a legtöbb egyetemista az első munkahelyétől","url":"https://eduline.hu/felsooktatas/20260731_corvinus-kutatas-tavmunka-hibrid-home-office","forras":"Eduline","datum":"2026-07-31","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Corvinus Egyetem 1840 hallgató megkérdezésével készült felmérése szerint az alapszakosok 56, a mesterszakosok 62 százaléka olyan első állást keresne, ahol heti két-három napot otthonról dolgozhat, a kizárólag irodai munka nem vonzó számukra. Tanulmányai mellett az alapszakosok 51, a mesterszakosok 68 százaléka dolgozik, utóbbiak többsége heti 20 óránál is többet, több mint negyedük heti 31-40 órát. Az alapszakosok anyagi okból, a mesterszakosok szakmai tapasztalatszerzésért vállalnak munkát tanulmányaik mellett.","kulcsszavak":["pályakezdők","rugalmas foglalkoztatás","diákmunka","kutatás és statisztika"],"het":"2026-07-27","id":"ART-0439","url_forras":"docx","kivonat":"A Corvinus Egyetem 1840 alap- és mesterszakos hallgató megkérdezésével készült felmérése szerint a hibrid munkavégzés a pályakezdők egyik legfontosabb szempontjává vált: az alapszakosok 56, a mesterszakosok 62 százaléka olyan első állást keresne, ahol heti két-három napot otthonról dolgozhat, a kizárólag irodai munka nem vonzó. Tanulmányai mellett az alapszakosok 51, a mesterszakosok 68 százaléka dolgozik – utóbbiak többsége heti 20 óránál is többet, több mint negyedük heti 31–40 órát –, miközben a Tudatos Diák korábbi felmérése szerint a diákmunka gyakran a szabadidő és a közösségi élet rovására megy. A motiváció eltér: az alapszakosok anyagi okból, a mesterszakosok szakmai tapasztalatszerzésért vállalnak munkát."},{"cim":"Meglepetés, vége a pozitív elmozdulásnak – reagáltak az elemzők a friss munkanélküliségi adatokra","url":"https://hvg.hu/gazdasag/20260724_ksh-munkanelkuliseg-elemzok-virovacz-sumegi","forras":"HVG","datum":"2026-07-24","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH szerint júniusban 4 millió 646 ezren dolgoztak Magyarországon, havi szinten 8 ezres, éves szinten 34 ezres csökkenéssel; a munkanélküliségi ráta 4,5 százalék, az álláskeresők száma 211 ezer, az álláskeresés átlagos ideje 12,5 hónap. Virovácz Péter (ING) szerint az előző havi javulás átmeneti volt: a nőknél az aktivitás ugrott meg álláskeresőként, de nem helyezkedtek el gyorsan, a férfiaknál az inaktívak, vélhetően a nyugdíjba lépők száma nőtt. A munkaképes korú népesség 2022 közepe óta 170 ezer fővel fogyott. Sümegi Ákos (MBH) az energiaárakban, a júniusi ezer fő feletti leépítésekben, az AI-hatásban és a vendégmunkás-szigorításban lát kockázatot; az ING 4,5, az MBH 4,6 százalékos éves rátát vár.","kulcsszavak":["munkanélküliség","demográfia","gazdasági kilátások","KSH"],"het":"2026-07-20","id":"ART-0440","url_forras":"docx","kivonat":"A KSH szerint júniusban 4 millió 646 ezren dolgoztak Magyarországon, ami havi szinten 8 ezres, éves szinten 34 ezres csökkenés; a munkanélküliségi ráta 4,5 százalék, az álláskeresők száma 211 ezer, az álláskeresés átlagos ideje 12,5 hónap. Virovácz Péter (ING) szerint az előző havi pozitív elmozdulás átmeneti volt, és éles kettősség látszik: a nőknél az aktivitás ugrott meg – sokan tértek vissza álláskeresőként, de nem helyezkedtek el gyorsan –, a férfiaknál az inaktívak, vélhetően a nyugdíjba lépők száma nőtt. A munkaképes korú népesség 2022 közepe óta 170 ezer fővel fogyott, demográfiai fordulat nem látszik, így a cégek egy része továbbra is munkaerőt tartalékol. Sümegi Ákos (MBH) az energiaárak, a júniusi ezer fő feletti leépítések, az AI-hatás és a vendégmunkás-szigorítás miatt lát kockázatot – az ING 4,5, az MBH 4,6 százalékos éves rátát vár."},{"cim":"Sokkoló számok: kiderült, mennyit keres a kecskeméti Mercedes-gyárban egy magyar munkás, elképedtek a fizetésen a németek","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/07/mercedes-11","forras":"Világgazdaság","datum":"2026-07-30","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Mercedes számításai szerint 70 százalékkal olcsóbb Magyarországon autót gyártani, mint Németországban: az ipari munkaóra költsége itthon 15,60 euró a német 49,50 euróval szemben, a magyar munkahét pedig 40, a német autóipari 35 órás. Németországban mintegy 18 ezer Mercedes-dolgozó tiltakozott a költségcsökkentés ellen, miközben a júliusban átadott, egymilliárd euróból bővített kecskeméti üzem 400 ezres éves kapacitással a márka legnagyobb európai gyára lett, mintegy ötezer fővel. Christian Dickert gyárigazgató szerint a fizikai állomány közel száz százaléka magyar, így a vendégmunkás-szigorítás a gyárat nem, a beszállítóit viszont érintheti.","kulcsszavak":["autóipar","bérek","beruházás","vendégmunka"],"het":"2026-07-27","id":"ART-0441","url_forras":"docx","kivonat":"A Mercedes számításai szerint 70 százalékkal olcsóbb Magyarországon autót gyártani, mint Németországban: az ipari munkaóra költsége itthon 15,60 euró 49,50 euróval szemben – ez munkáltatói összköltség, nem kézhez kapott bér –, ráadásul a magyar munkahét 40, a német autóipari 35 órás. Németországban mintegy 18 ezer Mercedes-dolgozó tiltakozott a költségcsökkentés ellen, miközben a júliusban átadott, egymilliárd euróból bővített kecskeméti üzem 400 ezres éves kapacitással a márka legnagyobb európai gyára lett, jelenleg mintegy ötezer fővel. Christian Dickert gyárigazgató szerint a fizikai állomány közel száz százaléka magyar, így a vendégmunkás-szigorítás a gyárat nem, a beszállítóit viszont érintheti."},{"cim":"900 ezres fizetést ad átlagosan hazánk egyik legnagyobb vállalata: rengeteg embert keresnek, sok álláshoz tapasztalat sem kell","url":"https://www.penzcentrum.hu/karrier/20260730/900-ezres-fizetest-ad-atlagosan-hazank-egyik-legnagyobb-vallalata-rengeteg-embert-keresnek-sok-allashoz-tapasztalat-sem-kell-1202998","forras":"Pénzcentrum","datum":"2026-07-30","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Pénzcentrum nagyfoglalkoztatói sorozata a hatvani Robert Bosch Elektronika Gyártó Kft.-t vizsgálta, ahol 2025 végén 4704-en dolgoztak, 2021-hez képest 16 százalékkal kevesebben. A fizikai állomány 40 százalékkal esett, a szellemi 47 százalékkal nőtt, így mára csaknem paritásba került (52 vs 48%); az éves bérköltség 145,5 millió euró, ami egy főre 832 ezer (fizikai) és 1,03 millió forintot (szellemi) jelent. A Bosch szerint a fluktuáció iparági átlag alatti, a pozíciók betöltése átlagosan két hónap, hiányszakmának a logisztikai-informatikai-automatizációs és a többműszakos gyártósor-üzemeltető munkakörök számítanak.","kulcsszavak":["ipar","bérek","munkaerőhiány","megtartás"],"het":"2026-07-27","id":"ART-0442","url_forras":"docx","kivonat":"A Pénzcentrum nagyfoglalkoztatói sorozatának friss része a hatvani Robert Bosch Elektronika Gyártó Kft.-t vizsgálja, ahol 2025 végén 4704-en dolgoztak – 2021-hez képest több mint 16 százalékkal kevesebben. A létszám szerkezete gyökeresen átalakult: a fizikai állomány 40 százalékkal esett, a szellemi 47 százalékkal nőtt, így mára csaknem paritásba került (52 vs 48%). A vállalat éves bérköltsége 145,5 millió euró, ami egy főre a fizikai állománynál 832 ezer, a szelleminél 1,03 millió forintot jelent. A Bosch szerint a fluktuáció iparági átlag alatti, a pozíciók betöltése átlagosan két hónap, hiányszakmának a logisztikai-informatikai-automatizációs tudást ötvöző szellemi és a többműszakos gyártósor-üzemeltető fizikai munkakörök számítanak."},{"cim":"Kiderült, ekkora fizetéssel már jómódúnak számítasz Magyarországon: tágul az olló gazdag és szegény között","url":"https://www.penzcentrum.
