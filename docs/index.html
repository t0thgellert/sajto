önbségek","beruházás"],"het":"2026-05-11","id":"ART-0221","url_forras":"docx","kivonat":"A Német Autóipari Szövetség (VDA) szerint 2019 és 2035 között összesen 225 ezer munkahely szűnhet meg a német autóiparban – ez 35 ezerrel több a korábbi becslésénél. 2019 és 2025 között már 100 ezer pozíció tűnt el, a következő évtizedben további 125 ezret fenyeget az elektromos átállás. A VDA technológiasemlegesebb uniós szabályozást sürget – a jelenlegi 2035-ös belső égésű motor-tilalom önmagában 50 ezer állást veszélyeztet, míg a plug-in hibridek és szintetikus üzemanyagok engedélyezése enyhíthetné a veszteségeket. A folyamat Magyarországot is érinti, mivel a hazai autóipari beszállítói szektor erősen kitett a német ipar felé."},{"cim":"Átlagkeresetek Magyarországon szakmák szerint: itt a „teljes” lista","url":"https://uzletem.hu/munkaeropiac/atlagkeresetek-magyarorszagon-szakmak-szerint-itt-a-teljes-lista/rsslink/rss2","forras":"Üzletem","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH 2025-ös FEOR-kódos kereseti adatai szerint a légiforgalmi irányítók keresnek legtöbbet közel 3,9 millió forinttal, míg a nád- és fűzfeldolgozók 249 ezer forinttal a lista alján állnak.","kulcsszavak":["bérek","skills-alapú HR","KSH"],"het":"2026-05-11","id":"ART-0222","url_forras":"docx","kivonat":"A Nemzeti Fejlesztési Központ közzétette a KSH 2025-ös hivatalos kereseti adatait FEOR-kódok szerint, amely több mint 460 magyarországi foglalkozás átlagbérét tartalmazza. A lista élén a légiforgalmi irányítók állnak közel 3,9 millió forintos havi bruttóval, amelyet a légijármű-vezetők és a törvényhozók, miniszterek követnek. A rangsor alján a nád- és fűzfeldolgozók (249 ezer forint), a kubikosok (307 ezer) és a konyhai kisegítők (349 ezer forint) találhatók. Az adatbázis nyilvánosan elérhető, és foglalkozás neve szerint is kereshető."},{"cim":"Vígan továbbáll a magyar, ha máshol több pénzt kap","url":"https://www.economx.hu/magyar-gazdasag/2026/05/13/professionhu-felmeres-berezes/","forras":"Economx","datum":"2026-05-13","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Profession.hu kutatása szerint a fizetés a legfontosabb munkahelyválasztási szempont minden generációnál, de a váltási küszöb eltérő: a fiatalabbak csak 100-200 ezer forintos emelésért, az idősebbek már 50 ezerért is váltanának.","kulcsszavak":["Profession.hu","bérek","pályakezdők","megtartás"],"het":"2026-05-11","id":"ART-0223","url_forras":"docx","kivonat":"A Profession.hu 1000 fős reprezentatív kutatása szerint a fizetés, az elhelyezkedés és a munkarend minden korcsoport számára a legfontosabb munkahelyválasztási szempont – de markánsak a generációs különbségek is: a Z a home office-t, az Y a vezető személyét, az X  a cég megbízhatóságát helyezi előtérbe. A váltási küszöb is eltér: a fiatalabbak 41 százaléka csak 100-200 ezer forintos nettó emelésért váltana, míg az X és Y generációsok harmada már 50 ezerért is lépne. A Z-generációt terheli legjobban a túlterheltség és kiégés veszélye, az Y generációsok legnagyobb problémája a megbecsülés hiánya."},{"cim":"Gazsi Attila: A magyar gazdaság következő tartaléka az okosabb munka","url":"https://vosz.hu/vosz-info/gazsi-attila-a-magyar-gazdasag-kovetkezo-tartaleka-az-okosabb-munka","forras":"VOSZ-Infó","datum":"2026-05-15","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A VOSZ elnökhelyettese szerint a magyar gazdaság következő versenyképességi tartaléka nem az olcsóbb, hanem az okosabb munka; a termelékenységi fordulat öt pillére a humántőke-fejlesztés és a digitalizáció.","kulcsszavak":["munkáltatói szövetség","gazdasági kilátások","automatizáció"],"het":"2026-05-11","id":"ART-0224","url_forras":"docx","kivonat":"Gazsi Attila, a VOSZ elnökhelyettese a New World Talks 2026 konferencián rámutatott: a magyar gazdaság következő versenyképességi tartaléka nem az olcsóbb, hanem az okosabb munka. A GDP/fő az EU-átlag 76 százalékán beragadt, miközben a külföldi vállalatoknál dolgozókra 115 ezer euró hozzáadott érték jut, a hazai kkv-knál viszont csak 26 ezer. A magas beruházási ráta nem hozott áttörést, mert a beruházás csak akkor termel valódi versenyelőnyt, ha javítja a szervezettséget, a digitalizációt és a menedzsmentminőséget. Gazsi szerint a termelékenységi fordulat öt pillére: humántőke-fejlesztés, teljesítményalapú támogatások, AI- és digitalizációs voucherek, hazai beszállítói felkészítés és kiszámítható finanszírozás."},{"cim":"Átalakuló munkaerőpiac: A nők elhúznak, a férfiak lemaradnak?","url":"https://wmn.hu/wmn-szuro/67254-nok-ferfiak-gyengul-munkaeropiac-usa","forras":"WMN","datum":"2026-05-11","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A Wall Street Journal elemzése szerint az amerikai munkahelybővülés az egészségügyre koncentrálódott; a nők foglalkoztatási aránya 75%-ra nőtt, de az AI inkább a női munkaköröket fenyegeti az ILO szerint.","kulcsszavak":["nők a munkaerőpiacon","foglalkoztatottság","egészségügy","AI"],"het":"2026-05-11","id":"ART-0225","url_forras":"docx","kivonat":"A Wall Street Journal elemzése szerint az amerikai munkaerőpiacon az elmúlt év munkahelybővülésének szinte egésze az egészségügyre és szociális ellátásra koncentrálódott – ezek nélkül a magánszektor munkahelyeket veszített volna. A férfidominált szektorok visszaesnek, a 25–54 éves nők foglalkoztatási aránya 75%-ra nőtt, részben a hibrid munkavégzésnek köszönhetően. Az oktatási szakadék is nő: a nők 46%-a diplomás, a férfiaknál ez csak 38%. Ugyanakkor az AI inkább a nők munkáit fenyegeti: az ILO szerint a nők állásainak 41%-a érintett lehet az automatizálásban, szemben a férfiak 28%-ával."},{"cim":"Hallani sem akarnak a fiatalok ezekről a munkákról: ki fogja helyettük elvégezni?","url":"https://www.penzcentrum.hu/karrier/20260515/hallani-sem-akarnak-a-fiatalok-ezekrol-a-munkakrol-ki-fogja-helyettuk-elvegezni-1198723","forras":"Pénzcentrum","datum":"2026-05-15","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A gépkezelői és targoncavezetői munkakörök tartós hiányszakmák, a Z-generáció alig képviselteti magát ezeken; az átlátható bérkommunikációval harmadával több jelentkező érkezik.","kulcsszavak":["pályakezdők","munkaerőhiány","bértranszparencia","toborzás"],"het":"2026-05-11","id":"ART-0226","url_forras":"docx","kivonat":"A gépkezelői, karbantartói és targoncavezetői munkakörök tartósan hiányszakmák, a Z-generáció azonban alig képviselteti magát ezeken a területeken. Dénes Rajmund Roland, a Humán Centrum vezetője szerint a demográfia mellett a cégek kommunikációja is ludas: a digitális világban felnőtt fiatalok bértranszparenciát, gyors toborzást és jó közösséget várnak – az átlátható bérkommunikációval harmadával több jelentkező érkezik. A fizikai munkának ráadásul az AI-korszakban épp felértékelődő előnye van: kézügyességet és fizikai jelenlétet igényel, a műszak végén a feladat lezárul. A szakértő szerint azok a cégek kerülnek előnybe, amelyek már a diákévek alatt megszólítják a fiatalokat jól felépített diákmunka- és gyakornoki programokkal."},{"cim":"Robotok, AI és a jövőd – készen állsz a változásra?","url":"https://autopro.hu/trend/robotok-ai-es-a-jovod---keszen-allsz-a-valtozasra/1609009","forras":"Autopro","datum":"2026-05-14","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az INTEGRATOR FM podcastban Nógrádi József, a Trenkwalder stratégiai igazgatója arról beszélt, hogyan alakítja át az AI és a robotika a munkaerőpiacot, és miért válik kulcskompetenciává a kreatív gondolkodás.","kulcsszavak":["Trenkwalder","automatizáció","skills-alapú HR"],"het":"2026-05-11","id":"ART-0227","url_forras":"talalt","kivonat":"Az INTEGRATOR FM legújabb podcastepizódjában Nógrádi József, a Trenkwalder stratégiai igazgatója és Barta Balázs, a Pannon Business Network ügyvezetője arról beszélget, hogyan alakítja át az AI és a robotika a munkaerőpiacot – eltűnnek-e egyes szakmák, melyek értékelődnek fel, és miért válik kulcskompetenciává a kreatív gondolkodás és az alkalmazkodóképesség. A beszélgetés kitér a humanoid robotok megjelenésére és a magyar munkaerőhiányra is, hangsúlyozva, hogy az MI nem csupán munkahelyeket szüntethet meg, hanem új iparágakat és karrierlehetőségeket is teremthet."},{"cim":"MI, robotika és ipari kihívások várják a Techtogether résztvevőit","url":"https://autopro.hu/techtogether/mi-robotika-es-ipari-kihivasok-varjak-a-techtogether-resztvevoit/1606239","forras":"Autopro","datum":"2026-05-12","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Techtogether Automotive Hungary mérnökhallgatói versenyen a Trenkwalder Recruitment is feladatot biztosít több mint 140 hallgatónak az ország vezető műszaki egyetemeiről.","kulcsszavak":["Trenkwalder","pályakezdők","gazdasági kilátások"],"het":"2026-05-11","id":"ART-0228","url_forras":"docx","kivonat":"Május 18–19-én a HUNGEXPO-n rendezik meg a Techtogether Automotive Hungary mérnökhallgatói versenyt, amelyen több mint 140 hallgató vesz részt az ország vezető műszaki egyetemeiről. A résztvevők AI-alapú tervezési, robotikai, automatizálási és kiberbiztonsági feladatokon dolgoznak valós ipari partnerekkel – köztük a Trenkwalder Recruitment is feladatot biztosít. A verseny egyben közvetlen találkozási pont a tehetséges hallgatók és a munkaerőt kereső vállalatok között."},{"cim":"Leépítenek, majd drágán visszavesznek embereket – új trend a munkaerőpiacon?","url":"https://www.hrportal.hu/hr/leepitenek-majd-dragan-visszavesznek-embereket-uj-trend-a-munkaeropiacon-20260512.html","forras":"HR Portál","datum":"2026-05-12","fokategoria":"versenytars","alkategoria":"Adecco","osszefoglalo":"Az Adecco Group részét képező LHH kutatása szerint a leépítések már nem egyszeri válságreakciók; a cégek elbocsátanak, majd drágábban toborozzák vissza ugyanazt a tudást – ezt „készségbizalmi válságnak” nevezik.","kulcsszavak":["Adecco","régiós különbségek","leépítés","toborzás"],"het":"2026-05-11","id":"ART-0229","url_forras":"docx","kivonat":"Az Adecco Group részét képező LHH nemzetközi kutatása szerint a leépítések már nem egyszeri válságreakciók – a HR-vezetők 78 százaléka rendszeres jelenségként írja le azokat. A kutatás legfontosabb megállapítása a leépítési költségparadoxon: a cégek elbocsátják az embereket, majd drágábban toborozzák vissza ugyanazt a tudást, miközben a belső áthelyezés olcsóbb lenne. A HR-vezetők 77 százaléka szerint léteznek belső mobilitási programok, de a munkavállalóknak csupán 19 százaléka érzékeli ezeket. A dolgozók 56 százaléka úgy érzi, készségei már nem relevánsak – az LHH ezt „készségbizalmi válságnak\" nevezi."},{"cim":"Jövőálló szervezetével nyert ismét Randstad-díjat a Magyar Telekom","url":"https://hrpwr.hu/cikk/jovoallo-szervezetevel-nyert-ismet-randstad-dijat-a-magyar-telekom","forras":"HRPWR","datum":"2026-05-11","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Magyar Telekom nyolcadszor nyerte el a Randstad Employer Brand Research alapján a hazai telco szektor legvonzóbb munkáltatója díjat, skill-alapú karriermodellt épít AI-fókusszal.","kulcsszavak":["Randstad","IT","munkáltatói márka","megtartás"],"het":"2026-05-11","id":"ART-0230","url_forras":"docx","kivonat":"A Magyar Telekom közleményében kiemeli, hogy nyolcadszor nyerte el a Randstad Employer Brand Research alapján a hazai telco szektor legvonzóbb munkáltatója díjat – Tóth Zsuzsa Chief People Officer szerint ez a tartós munkavállalói bizalom jele. A cég skill-alapú karriermodellt és „self-tuning\" szemléletet épít, amelyben a munkavállalók maguk irányítják szakmai fejlődésüket, kiemelt fókusszal az AI-ra."},{"cim":"Az Egis Gyógyszergyár lett a legvonzóbb munkáltató az élettudományok szektorban","url":"https://pharmaonline.hu/cikk/gyogyszeripar/az-egis-gyogyszergyar-lett-a-legvonzobb-munkaltato-az-elettudomanyok-szektorban","forras":"Pharma Online","datum":"2026-05-12","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Az Egis Gyógyszergyár a Randstad 2026-os, 170 ezer válaszadót felölelő kutatásában első helyen végzett az élettudományok szektorban, egyedüli hazai gyógyszergyártóként nyerve el a Top Employer elismerést is.","kulcsszavak":["Randstad","egészségügy","munkáltatói márka"],"het":"2026-05-11","id":"ART-0231","url_forras":"docx","kivonat":"Az Egis Gyógyszergyár saját közleményében számol be arról, hogy a Randstad 2026-os, 170 ezer válaszadót felölelő globális kutatásában az élettudományok szektorban első helyen végzett – megelőzve számos hazai és multinacionális versenytársát. Dr. András Klára HR- és kommunikációs igazgató szerint a díj azért különösen értékes, mert a potenciális munkavállalók szemszögéből méri a munkáltatói márkát. Az Egis egyedüli hazai gyógyszergyártóként nyerte el a Top Employer 2025 és 2026 elismerést is.\n\nRecruitment Market Talk: Riding the Evolutionary AI Wave in Search of More ‘Rounded’ Candidates [URL: https://bbj.hu/business/people/hr/recruitment-market-talk-riding-the-evolutionary-ai-wave-in-search-of-more-rounded-candidates/]"},{"cim":"Recruitment Market Talk: Riding the Evolutionary AI Wave in Search of More 'Rounded' Candidates","url":"https://bbj.hu/business/people/hr/recruitment-market-talk-riding-the-evolutionary-ai-wave-in-search-of-more-rounded-candidates/","forras":"BBJ.hu","datum":"2026-05-10","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A BBJ toborzási körkérdésén a fejvadász cégek szerint az AI hatása evolúciós; Baja Sándor, a Randstad ügyvezetője szerint a legnagyobb kihívás a 700 ezer külföldön dolgozó magyar visszacsábítása.","kulcsszavak":["Randstad","toborzás","AI"],"het":"2026-05-04","id":"ART-0232","url_forras":"docx"},{"cim":"Sokakat érintő fordulat készül: visszahozná a kormány a régi KATA egyik legfontosabb elemét","url":"https://www.economx.hu/magyar-gazdasag/2026/05/15/sokakat-erinto-fordulat-keszul-visszahozna-a-kormany-a-regi-kata-egyik-legfontosabb-elemet/","forras":"Economx","datum":"2026-05-15","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A pénzügyminiszter a KATA szélesebb körű visszaállítását tervezi; a WHC Payroll elemzése szerint ez adminisztrációs könnyítést hozhat, de a NAV színlelt foglalkoztatással kapcsolatos ellenőrzései is visszatérhetnek.","kulcsszavak":["WHC","adózás"],"het":"2026-05-11","id":"ART-0233","url_forras":"talalt","kivonat":"Kármán András pénzügyminiszter szerint a kormány az egyik legfontosabb gazdasági tervének tekinti a KATA szélesebb körű visszaállítását – azt is lehetővé tennék, hogy katás vállalkozók ismét cégeknek számlázhatnak. A WHC Payroll elemzése szerint ez elsősorban a kisebb vállalkozásoknak hozhat adminisztrációs könnyítést, ugyanakkor várhatóan visszatérnek a színlelt foglalkoztatással kapcsolatos NAV-ellenőrzések is – a szerződések és számlázási gyakorlat gondos dokumentálása így továbbra is elengedhetetlen lesz."},{"cim":"Már csak 7 napunk van az SZJA-bevallásra","url":"https://profitline.hu/mar-csak-7-napunk-van-az-szja-bevallasra-486740","forras":"Profitline","datum":"2026-05-13","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC Payroll szakértői figyelmeztetnek: a 2025-ös szja-bevallást május 20-ig kell véglegesíteni, a NAV automatikus tervezeteit érdemes ellenőrizni, különösen külföldi vagy tőzsdei jövedelem esetén.","kulcsszavak":["WHC","adózás"],"het":"2026-05-11","id":"ART-0234","url_forras":"docx","kivonat":"Május 20-ig kell véglegesíteni a 2025-ös jövedelmekre vonatkozó szja-bevallást – a határidő jogvesztő, mulasztás esetén bírság jár. A WHC Payroll szakértői figyelmeztetnek: a NAV által automatikusan elkészített tervezeteket mindenképpen ellenőrizni kell, különösen azoknak, akiknek külföldi jövedelmük, egyéni vállalkozói vagy tőzsdei bevételük volt. A határidő az 1+1 százalékos felajánlásra is vonatkozik."},{"cim":"Milyen hatása lehet a vendégmunkás stopnak?","url":"https://www.hrportal.hu/c/milyen-hatasa-lehet-a-vendegmunkas-stopnak-20260511.html","forras":"HR Portál","datum":"2026-05-11","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC felmérést indított a tervezett vendégmunkás-stop hatásainak feltérképezésére; a gazdasági miniszter szerint a külföldi munkaerő tömeges alkalmazása válságtünet, nem gazdasági siker.","kulcsszavak":["WHC","vendégmunkás-stop","kutatás és statisztika"],"het":"2026-05-11","id":"ART-0235","url_forras":"docx","kivonat":"A WHC felmérést indított a tervezett vendégmunkás-stop várható hatásainak feltérképezésére. Kapitány István gazdasági miniszter szerint a külföldi munkavállalók tömeges alkalmazása válságtünet, nem gazdasági siker – rontja a hazai munkavállalók helyzetét, torzítja a bérversenyt és fékezi a technológiai megújulást. A Tisza választási programja szerint június 1-től megtiltják a harmadik országbeli vendégmunkások toborzását. [URL: https://forms.cloud.microsoft/pages/responsepage.aspx?id=xLMEPCO7AUOm69Zdq4fEV_b7kMaWAzBMuc1K3mysUhxURVcyTDU4TFZaWjlSVVdOTjhUTjZMWVhTQi4u&origin=lprLink&route=shorturl]"},{"cim":"Június 1-jétől jön a Tisza Párt külföldimunkaerő-stopja. Milyen hatással lehet ez a magyarországi cégekre?","url":"https://telex.hu/gazdasag/2026/05/15/vendegmunkas-tisza-munkaerostop-munkaerohiany","forras":"Telex","datum":"2026-05-15","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Kovács Endre, a Prohuman Csoport üzletfejlesztési igazgatója szerint ha egy multi nem tud külföldieket felvenni és elhagyja az országot, a magyarok által betöltött munkahelyek is veszélybe kerülnek, mert a nagy beruházók nem találnak elég hazai munkaerőt.","kulcsszavak":["vendégmunkás-stop","munkaerőhiány"],"het":"2026-05-11","id":"ART-0236","url_forras":"talalt","kivonat":"Kapitány István újonnan kinevezett gazdasági és energetikai miniszter a Tisza győzelme után is megerősítette, hogy felülvizsgálják a vendégmunkások jogi szabályozását, és június 1-jétől felfüggesztik a vendégmunkások behozatalát. Gyakori érv a közbeszédben, hogy a magyar emberek körében is van munkanélküliség, nekik kellene munkát találni, nem külföldieket behozni. Ugyanakkor a demográfiai és strukturális munkaerőhiány miatt nagy kárt okozna a stoptábla. Tavaly 49 600-zal csökkent a gazdaságilag aktívak száma, de strukturális problémák is vannak, a munkanélküliek többsége nem feltétlenül képes a nagy gyárak és a szolgáltatóközpontok, vagy más néven BSC-irodák szakképzett munkaerő iránti igényét kielégíteni. Kovács Endre, a Prohuman Csoport üzletfejlesztési igazgatója egy 500 főt kereső multit hoz példának: ha a cég nem tud 100 külföldit felvenni, és emiatt elmegy az országból, akkor a 400, magyarok által betöltött munkahely is veszélybe kerül. A piacvezető cég tapasztalata az, hogy a most belépő nagy munkáltatók – a BMW és a CATL Debrecenben vagy a BYD Szegeden – képtelenek a szükséges munkaerőt pusztán a magyar jelentkezők közül megtalálni, pedig egy új beruházás elindulásakor egyszerre több száz alkalmazottnak kellene kezdenie. Ha sikerülne is ennyi embert találni, őket biztosan más cégtől veszik el, ezzel pedig a környező kkv-k (kis- és középvállalkozások) számára okoznak foglalkoztatási problémát."},{"cim":"Nem elég a munkaerő – kell a tudás is","url":"https://gyartastrend.hu/cikk/nem-eleg-a-munkaero-kell-a-tudas-is","forras":"Gyártástrend","datum":"2026-05-18","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman szegedi Regionális Gazdasági Fórumán Göndöcs Viktor vezérigazgató és Major Gábor stratégiai igazgató rámutatott a munkaerő-kínálat csökkenésére és Magyarország alacsony felnőttkori tanulási hajlandóságára.","kulcsszavak":["munkaerőhiány"],"het":"2026-05-18","id":"ART-0237","url_forras":"talalt","kivonat":"A Prohuman szegedi Regionális Gazdasági Fórumának előadói rámutattak: a régióba érkező nagyberuházások magasan képzett technikusokat és mérnököket igényelnek – miközben a vállalatok 80 kilométeres körzetben sem találnak hegesztőt sem. Göndöcs Viktor, a Prohuman vezérigazgatója szerint a makroadatok és a vállalati valóság között jelentős eltérés van. Major Gábor stratégiai igazgató három kihívást azonosított: évente 50 ezerrel csökken a hazai munkaerő-kínálat, globálisan egyre több digitálisan versenyképes diplomás lép piacra, és az AI csökkenti a keresletet a közepes képzettségűek iránt – miközben Magyarország az EU utolsó helyén áll a felnőttkori tanulási hajlandóság terén. Az eseményen beszámoltak tapasztalataikról olyan nagyvállalatok képviselői, mint a Contifluid és a Vulcan Shield, valamint az egyetem és a város képviselő is, a Prohuman szerbiai munkatársa pedig a határon túli munkaerő-tartalék kimerüléséről számolt be."},{"cim":"„A nevelés nem egy üzleti tranzakció” – Így zajlott a II. Lumen Educationis Konferencia","url":"https://uniside.hu/ii-lumen-educationis-konferencia/","forras":"uniside.hu","datum":"2026-05-20","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Lumen Educationis Konferencia kerekasztalán Farkas Bertalan Péter, a Prohuman Learning Solutions ügyvezetője és mások arról beszéltek, milyen készségeket vár a munkaerőpiac a fiataloktól, és milyen szerepe van ebben az iskolának.","kulcsszavak":["képzés"],"het":"2026-05-18","id":"ART-0238","kivonat":"A Lumen Educationis Konferencia elsődleges célja, hogy párbeszédet teremtsen a katolikus oktatás szereplői, az oktatástechnológiai szakemberek és a munkaerőpiac képviselői között arról, hogyan lehet a fiatalokat egyszerre szakmailag felkészülten és emberileg stabil értékrenddel nevelni egy gyorsan változó világban. A konferencia egyik kerekasztalának résztvevői Dr. Gloviczki Zoltán, az Apor Vilmos Katolikus Főiskola rektora, Dr. Puskás Balázs, a Szent Mihály Intézményfenntartó főigazgatója és Farkas Bertalan Péter, a Prohuman Learning Solutions ügyvezető és szakmai igazgatója voltak. A beszélgetést az a kérdés határozta meg, hogyan lehet egyszerre értékalapú és alkalmazkodó oktatási környezetet létrehozni. A másik panelben Szabó Dávid József (Prohuman Group), Szabó Letícia (GE Vernova Hungary Kft.), Varga Zoltán (Körber HR), továbbá Deszk Réka és Demeter Konrád Noel foglaltak helyet. A beszélgetés moderátora a két HR-szakértőt és a Veresegyházi Katolikus Gimnázium végzős tanulóit kérdezte. A panel középpontjában az állt, hogy milyen készségeket vár ma a munkaerőpiac a fiataloktól, és ebben milyen szerepe van az iskolának.","url_forras":"talalt"},{"cim":"VOSZ: Tényleg a vendégmunkás-stop a jó megoldás?","url":"https://www.portfolio.hu/gazdasag/20260519/vosz-tenyleg-a-vendegmunkas-stop-a-jo-megoldas-837788","forras":"Portfolio","datum":"2026-05-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A VOSZ szerint a magyar munkaerőpiacot védeni kell, de hirtelen döntésekkel nem szabad veszélyeztetni a működő vállalkozásokat; az inaktívak bevonásához célzott programokra és időre van szükség.","kulcsszavak":["munkáltatói szövetség","vendégmunkás-stop","munkaerő-tartalék"],"het":"2026-05-18","id":"ART-0239","url_forras":"talalt","kivonat":"A VOSZ komplex programjavaslatot dolgozott ki és hálózatunkkal közre is működne a megvalósításban: A magyar munkaerőpiacot védeni kell, de nem szabad olyan hirtelen döntéseket hozni, amelyek működő vállalkozásokat, termelőkapacitásokat és végső soron magyar munkahelyeket veszélyeztetnek. Van aktivizálható munkaerő-tartalék Magyarországon, de ez nem gombnyomásra elérhető. Az inaktívak, a szenior munkavállalók, a részmunkaidőben visszatérők, a pályakezdők vagy a külföldről hazatérő magyarok bevonásához célzott programokra, tanácsadásra, képzésre és időre van szükség – mondta Gazsi Attila, a VOSZ elnökhelyettese a szervezet közleménye szerint."},{"cim":"A Tisza-kormány első gazdasági korlátozása: megszólalt a debreceni BMW és az egyik legnagyobb magyar gyár Kapitány István tervéről","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/05/vendegmunkasok-debrecen-bmw-mastergood-eve-power-tisza","forras":"Világgazdaság","datum":"2026-05-21","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Master Good és a BMW is kellemetlenül érintett a vendégmunkás-kitiltás tervétől; a Master Good tulajdonosa szerint a hazai munkaerőpiacról nem tudják kielégíteni szükségleteiket, mert a magyarok nem vállalnak állattenyésztési munkát.","kulcsszavak":["agrárium","autóipar","vendégmunka","munkajog"],"het":"2026-05-18","id":"ART-0240","url_forras":"talalt","kivonat":"A Tisza-kormány tervezett intézkedése a harmadik országból érkező vendégmunkások kitiltásáról kellemetlenül érinti Magyarország több meghatározó vállalatát, például a Master Good vagy a BMW is. A vendégmunkások foglalkoztatása kizárólag a beruházás beüzemeléséig, de legfeljebb egy évig tarthat. A magyar munkaerő védelmét szolgálja, hogy e munkavállalók száma is beleszámít a Magyarországon egyidejűleg alkalmazható vendégmunkások létszámkvótájába. Ha ezt a lehetőséget felfüggeszti a Tisza, az éppen a beruházások kapcsán okozhat problémát. A harmadik országból érkező munkavállalók aránya Magyarországon a legalacsonyabb a visegrádi országok között. Bárány Péter, a Master Good tulajdonosa és cégvezetője szerint vendégmunkások nélkül nem megy, mivel a munkabér mellett a közvetítés költségeit, a szállást és részben az étkezést is a foglalkoztatónak kell állnia, a vendégmunkás-foglalkoztatás drágább, így számukra előnyösebb lenne a magyar munkavállalók alkalmazása, a hazai munkaerőpiacról azonban nem tudják kielégíteni a szükségleteiket, mert a Magyar-kormány által emlegetett munkaerő-tartalékhoz tartozó emberek tapasztalataik szerint nem kívánnak a 24 órás odafigyelést igénylő állattenyésztésben vagy a vágóhidakon dolgozni. A másik súlyos probléma, hogy demográfiai okok miatt a magyar munkaerőpiac évi 1 százalékkal szűkül, így addig, amíg a robotizáció eléri azt a szintet, hogy az állatok mellé és a vágóhídi munkára ilyen megoldást lehessen alkalmazni, szükség van a harmadik országbeli munkaerőre.\n\nHans Peter Kemser a BMW Debrecen elnök-vezérigazgatója azt nyilatkozta, hogy a BMW globális cég, és a debreceni gyár a Neue Klasséhoz kötődő tudásexport révén is globális szereplő lesz. Ám ahhoz, hogy ez megvalósuljon, a magyarországi gyárban is indokolt és szükséges a legkülönbözőbb országokból érkező munkavállalók jelenléte. A BMW akkumulátorszükségleteinek kielégítésére idetelepült kínai EVE Power, úgy tűnik, szeretné elkerülni a vendégmunkások körüli konfrontációt. Már többször is kommunikálta, hogy debreceni gyárában év végéig 400-ra kívánja felfejleszteni dolgozói létszámát, és ebben 93 százalékban magyar munkavállalókra számít."},{"cim":"Négyszázezer rejtett dolgozót találtak Magyarországon: ők menthetik meg a hazai munkaerőpiacot a vendégmunkás-stop után","url":"https://www.penzcentrum.hu/karrier/20260521/negyszazezer-rejtett-dolgozot-talaltak-magyarorszagon-ok-menthetik-meg-a-hazai-munkaeropiacot-a-vendegmunkas-stop-utan-1199086","forras":"Pénzcentrum","datum":"2026-05-21","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Egy jelentés szerint a munkaképes magyarok ötöde nyitott lenne rugalmas, műszakalapú munkára; Magyarország az EU 5. legrosszabb helyén áll a részmunkaidős foglalkoztatás tekintetében 4,8%-kal.","kulcsszavak":["munkaerő-kölcsönzés","rugalmas foglalkoztatás","munkaerő-tartalék"],"het":"2026-05-18","id":"ART-0241","url_forras":"talalt","kivonat":"Miközben a magyar munkaerőpiac egyszerre küzd tízéves csúcson lévő munkanélküliséggel, a vendégmunkások korlátozásával és a bizonytalan gazdasági környezettel, egyre többen fordulnak a rugalmas, műszakalapú foglalkoztatás felé. Egy friss jelentés szerint a munkaképes magyarok ötöde nyitott lenne ilyen típusú munkára, miközben a cégek is költségcsökkentési és alkalmazkodási lehetőséget látnak a gig economy térnyerésében.  Scharle Ágota, a Budapest Szakpolitikai Elemző Intézet vezető kutatója szerint az inaktív réteg jelentős része csak hosszabb távon és komoly állami ráfordítások mellett integrálható a munkaerőpiacra. ”A magyar munkaképes lakosság legalább 20%-a szeretne rugalmas, műszakalapú munkavégzést. Ez több mint egymillió embert jelent, akik nem munkanélküliek, hanem a saját feltételeik szerint akarnak dolgozni. Mi ezt a rejtett likviditást tesszük láthatóvá és elérhetővé a gazdaság számára” - hangsúlyozta Sebestyén Ádám, a Giggle társalapítója. A gig economy modellje ezt nem csak operatív rugalmassággal támogatja, hanem közben profitot is növel: az igény szerinti atipikus foglalkoztatás egyenlő nettó bérek mellett önmagában akár 22% költségelőnyt jelenthet az állandó állományhoz képest, amely költségtétel a vállalatok számára csak tényleges munkaerő igény esetén jelentkezik. Magyarország jelenleg az 5. legrosszabb helyen áll az EU-ban a részmunkaidős foglalkoztatás tekintetében (4,8%), miközben az EU-átlag 18,6 százalék, Ausztriában pedig meghaladja a 30 százalékot."},{"cim":"Öregedő társadalom, átalakuló munkaerőpiac: felértékelődik az 55 év felettiek szerepe","url":"https://hirado.hu/belfold/gazdasag/cikk/2026/05/19/oregedo-tarsadalom-atalakulo-munkaeropiac-felertekelodik-az-55-ev-felettiek-szerepe","forras":"Híradó.hu","datum":"2026-05-21","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az EU-ban már több a 65 év feletti lakos, mint a gyermek; 2050-re két aktív korú lakosra juthat egy időskorú, ezért az 55 év felettiek munkában tartása kulcskérdéssé vált.","kulcsszavak":["idősebb munkavállalók","demográfia","régiós különbségek"],"het":"2026-05-18","id":"ART-0242","url_forras":"talalt","kivonat":"Az Európai Unióban már több a 65 év feletti lakos, mint a gyermek, miközben a munkaerőpiac egyre nehezebben pótolja a kieső fiatalokat. A kontinens gyorsuló elöregedése miatt látványosan felértékelődik az idősebbek szerepe. A gazdaság jövője így nagyban függ attól, miként sikerül hosszabb ideig aktívan tartani az 55 év felettieket. Az öregedő népesség nemcsak társadalmi kérdés, hanem komoly gazdasági kihívás is. Ahogy csökken a fiatal munkavállalók száma, miközben nő a nyugdíjasok aránya, egyre nagyobb teher nehezedik az aktív korú lakosságra. Jelenleg nagyjából három dolgozó tart el egy nyugdíjas korú embert az Európai Unióban, de a következő évtizedekben ez az arány tovább romolhat. Az előrejelzések szerint 2050-re már két aktív korú lakosra juthat egy időskorú személy. Ebben a helyzetben az idősebb generációk munkában tartása mára kulcskérdéssé vált. A gazdaság fenntartásához elengedhetetlen, hogy az emberek hosszabb ideig dolgozzanak, és hogy nyugdíj után is aktívak maradhassanak. Az elemzés szerint ez nemcsak gazdasági érdek, hanem társadalmi felelősség is."},{"cim":"„Két férfi munkája? Akkor ez részmunkaidő?” – nők a technológia világában","url":"https://www.economx.hu/tech/2026/05/19/ket-ferfi-munkaja-akkor-ez-reszmunkaido-nok-a-technologia-vilagaban/","forras":"Economx","datum":"2026-05-19","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A MediaMarkt kutatása szerint a nők 79%-a nélkülözhetetlennek tartja a technológiát a munkában, de a női vezetői pályákat az önbizalom, a támogató háttér és a munkahelyi beidegződések is erősen alakítják.","kulcsszavak":["nők a munkaerőpiacon","kereskedelem","automatizáció"],"het":"2026-05-18","id":"ART-0243","url_forras":"talalt","kivonat":"A technológia ma már nem külön előny, hanem alapfeltétel a munkahelyeken, a nők számára azonban egyszerre jelent lehetőséget és új terhet. A MediaMarkt friss kutatása szerint a nők 79 százaléka nélkülözhetetlennek tartja a technológiát a munkavégzésben, miközben minden második válaszadó információs túlterheltségről számol be. A Women in Tech kerekasztal-beszélgetésein az is kiderült, hogy a női vezetői pályákat nemcsak a digitális készségek, hanem az önbizalom, a támogató háttér és a munkahelyi beidegződések is erősen alakítják. A technológia egyszerre nyit és szűkít. Lehetőséget ad rugalmasabb munkavégzésre, gyorsabb tanulásra, hatékonyabb döntéshozatalra és ismétlődő feladatok kiváltására. Közben viszont növeli az információs zajt, folyamatos alkalmazkodást vár el, és nem tünteti el automatikusan a munkahelyi előítéleteket. A női vezetői pályák szempontjából ezért nem az a fő kérdés, hogy a nők képesek-e használni a technológiát. A kutatás alapján ez már adottság. A valódi kérdés inkább az, hogy a vállalatok, a családi háttér és maguk az érintettek meg tudják-e teremteni azt a környezetet, amelyben a digitális tudásból valódi döntéshozói szerep és karrierelőny lesz. Mert a technológia önmagában nem bontja le a régi beidegződéseket, legfeljebb láthatóbbá teszi, hol kellene végre változtatni rajtuk."},{"cim":"Sok diák számára aranybánya lehet az idei nyár: ezek a munkák fizetnek a legjobban","url":"https://www.penzcentrum.hu/karrier/20260521/sok-diak-szamara-aranybanya-lehet-az-idei-nyar-ezek-a-munkak-fizetnek-a-legjobban-1199110","forras":"Pénzcentrum","datum":"2026-05-21","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"2026-ban az átlagos diákmunka-órabérek bruttó 2200-2500 forint között mozognak, az IT-szektorban 3000-3500 forint is elérhető; a fővárosi pozíciók átlagos órabére megközelíti a 2450 forintot.","kulcsszavak":["diákmunka","bérek","szezonális munka","IT"],"het":"2026-05-18","id":"ART-0244","url_forras":"talalt","kivonat":"2026-ban az átlagos diákmunka-órabérek bruttó 2200-2500 forint között mozognak, de speciális tudást, nyelvismeretet vagy jogosítványt igénylő feladatkörökben ennél magasabb óradíjak is elérhetők. Így egy diák havi keresete a munkakörtől, a képzettségtől és a vállalt óraszámtól függően néhány százezer forinttól akár félmillió forint fölé is emelkedhet. A Mind-Diák Szövetkezet sajtóközleménye szerint ugyanakkor a nyári szezonban a legtöbb diákmunka már a minimálbérnél magasabb bérszinten érhető el: az átlagos órabérek bruttó 2200-2500 forint között alakulnak. A béreket azonban a munkakör mellett a földrajzi elhelyezkedés is befolyásolja. Az ország délkeleti régióiban a diák-órabérek többnyire bruttó 2000-2200 forint között érhetők el. Észak-Magyarországon és Észak-Dunántúlon ennél valamivel magasabb, 2200 forint körüli átlagok jellemzőek, míg a fővárosi és Pest megyei pozíciók továbbra is kiemelkednek: itt az átlagos bruttó órabér megközelíti a 2450 forintot. A könnyen betanítható, szezonális munkák jellemzően a 2000-2200 forintos sávban mozognak, míg a nyelvtudást vagy más szakmai ismereteket igénylő gyakornoki pozíciók bruttó 2300-3000 forintos órabért kínálnak. A mérnöki és pénzügyi területeken általában 2500-3200 forintos óradíjak jellemzőek, míg az IT-szektorban nem ritkák a 3000-3500 forintos vagy akár ennél magasabb bérek sem. A cégek közül sokan már eleve úgy terveznek, hogy a bevált diákokat szeptembertől is visszavárják, akár heti néhány napos, órarendhez igazítható munkavégzésben. Míg korábban inkább a multinacionális vállalatok és nagyvállalati szolgáltatóközpontok indítottak gyakornoki programokat, ma már a kkv-k is egyre nyitottabbak arra, hogy diákokat vonjanak be adminisztratív, pénzügyi, mérnöki, informatikai vagy ügyféltámogatási feladatokba."},{"cim":"Egy év alatt 11,3 százalékkal emelkedett a nettó átlagkereset","url":"https://telex.hu/gazdasag/2026/05/20/keresetek-fizetes-atlagkereset","forras":"Telex","datum":"2026-05-20","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH szerint márciusban a bruttó átlagkereset 9,2%-kal, a nettó 11,3%-kal nőtt egy év alatt, részben a családi adókedvezmények bővülése miatt; a reálkereset 9,3%-kal emelkedett az alacsony inflációnak köszönhetően.","kulcsszavak":["bérek","KSH","adózás"],"het":"2026-05-18","id":"ART-0245","url_forras":"talalt","kivonat":"A bruttó átlagkereset 9,2 százalékkal, a nettó átlagkereset pedig 11,3 százalékkal nőtt idén márciusban tavaly márciushoz képest – írja a KSH gyorsjelentése. Mivel az infláció viszonylag alacsony volt, ez az elmúlt egy évhez képest relatív magas, 9,3 százalékos reálkereset-emelkedést jelent. A KSH közleménye szerint idén márciusban részben a családi adókedvezmény, részben az anyákat érintő kedvezmények bővülése miatt haladta meg a nettó kereset növekedés a bruttó átlagkereset növekedését. Ez a mediánértékeken is látszik: a bruttó kereseteké 10,7 százalékkal, a nettó kereseteké 13,2 százalékkal növekedett. Mivel az infláció márciusban csak 1,8 százalékot tett ki, a reálkereset ilyen magas nominális fizetésemelkedés mellett 9,3 százalékkal nőtt. Ez tavalyhoz képest relatív magas emelkedésnek számít, akkor egész évben 3-6 százalék között volt a reálbér-növekedés."},{"cim":"Óriási béremelés jön Magyarországon, de rengeteg dolgozó ráfázhat: könnyen veszélybe kerülhet a munkahelyük","url":"https://www.penzcentrum.hu/gazdasag/20260520/oriasi-beremeles-jon-magyarorszagon-de-rengeteg-dolgozo-rafazhat-konnyen-veszelybe-kerulhet-a-munkahelyuk-1198952","forras":"Pénzcentrum","datum":"2026-05-20","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A kötelező legkisebb munkabér folyamatos emelése miatt a legalacsonyabb bérszintek összetorlódnak, ami plusz terhet ró a vállalatokra és elbocsátásokhoz vezethet, gyengítve a béremelések pozitív hatását.","kulcsszavak":["bérek","leépítés","gazdasági kilátások"],"het":"2026-05-18","id":"ART-0246","url_forras":"talalt","kivonat":"A magyar bérek 2010 és 2019 közötti dinamikus reálérték-növekedését a 2020-as évek elején az inflációs sokk és a válságok megtörték. Bár 2024-től a csökkenő inflációnak köszönhetően újraindult a reálbérek emelkedése, ez a növekedési ütem 2025-re és 2026-ra már lassulást mutat. A kötelező legkisebb munkabérek folyamatos emelése miatt a legalacsonyabb bérszintek egyre inkább összetorlódnak a hazai munkaerőpiacon. Ez a folyamat ugyan növeli a legalsó kereseti sávokban élők fogyasztását, de jelentős plusz terhet ró a vállalatokra.\n\nSok cég nehezen gazdálkodja ki a megemelkedett bérköltségeket, ami elbocsátásokhoz vezethet, ez pedig gyengíti a béremelések pozitív hatásait. A minimálbérért dolgozók képzettségi és földrajzi okokból eleve sérülékenyebbek, így számukra a munkahelyek megtartása kulcsfontosságú. Nemzetközi összehasonlításban a magyar bérszint Szlovákiát ugyan megelőzi, de Csehországhoz, Lengyelországhoz és az uniós átlaghoz képest továbbra is jelentős a lemaradása. A fenntartható bérfelzárkózás és a munkaerőpiac stabilitásának megőrzése érdekében a jövőben a vállalati termelékenység növelésére lesz szükség."},{"cim":"Fordulat az orosházi török gigaberuházásban: itt tart a 441 új munkahelyet teremtő projekt","url":"https://www.beol.hu/helyi-gazdasag/2026/05/elelmiszeripari-beruhazas-torokorszag-oroshaza","forras":"Békés Vármegyei Hírportál","datum":"2026-05-15","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A török Dogus Cay burgonya- és kukoricafeldolgozó üzemet létesít Orosházán, amely várhatóan 441 új munkahelyet teremthet; az adásvételi folyamat várhatóan június elejéig lezárulhat.","kulcsszavak":["agrárium","beruházás"],"het":"2026-05-11","id":"ART-0247","url_forras":"talalt","kivonat":"Új üzemet hoz létre Magyarországon a Dogus Cay, amely burgonya- és kukoricafeldolgozásra épül. Az élelmiszeripari beruházás stabil piacot biztosít a hazai gazdálkodóknak és erősíti a régió gazdaságát. Várhatóan 441 új munkahelyet teremthet Orosházán és térségében a török cég. Megalakult a beruházó magyarországi leányvállalata, a Karakan Foods Hungary Kft. A befektető szerdán megtekintette a leendő gyárat és bejárta a volt Guardian síküveggyár területét. Az adásvételi folyamat várhatóan június elejéig lezárulhat. A beruházás keretében a tervek szerint burgonya- és kukoricapehely, valamint jegestea gyártására alkalmas üzem jön létre Orosházán. A beruházás a helyi mezőgazdaság számára is jelentős lehetőséget jelenthet."},{"cim":"Felmérés: a magyar cégek nagy része nem szabályozza az MI munkahelyi használatát","url":"https://www.hrportal.hu/c/felmeres-a-magyar-cegek-nagy-resze-nem-szabalyozza-az-mi-munkahelyi-hasznalatat-20260520.html","forras":"HR Portál","datum":"2026-05-20","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A magyar cégek 80%-a még nem foglalkozik az MI szabályozásával, miközben a dolgozók kétharmada már használ valamilyen MI-eszközt; a válaszadók 91%-a szerint vannak feladatok, amelyeket jobb, ha ember végez.","kulcsszavak":["AI","IT","munkajog"],"het":"2026-05-18","id":"ART-0248","url_forras":"talalt","kivonat":"A magyar cégek 80 százaléka még nem foglalkozik a mesterséges intelligencia (MI) munkahelyi bevezetésével és szabályozásával, miközben a dolgozók kétharmada már használ valamilyen MI-eszközt magán vagy munkahelyi célokra - derül ki az ESET kiberbiztonsági cég hazai forgalmazójának megbízásából készített reprezentatív kutatásból. A válaszadók több mint háromnegyede továbbra is a ChatGPT-vel azonosítja a mesterséges intelligenciát. A kutatás szerint jelentős a bizalmatlanság és a bizonytalanság az MI használatával kapcsolatban. A megkérdezettek 77 százaléka teljes mértékben egyetértett azzal, hogy az MI által adott eredményeket embernek is ellenőriznie kell. Kétharmaduk (64 százalék) szerint túlságosan megbízunk a mesterséges intelligencia javaslataiban, míg 91 százalék véli úgy, hogy vannak feladatok, amelyeket jobb, ha ember végez."},{"cim":"Interjú Nógrádi Józseffel, a Trenkwalder Csoport kereskedelmi igazgatójával","url":null,"forras":"ATV","datum":"2026-05-20","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József szerint a törvény tervezett szigorítása a jogi kiskapukat zárja majd be; Magyarországon jelenleg nagyjából 120 ezer vendégmunkás tartózkodik, a cégek csak be nem tölthető pozíciókra hozzák őket.","kulcsszavak":["Trenkwalder","vendégmunka","munkajog"],"het":"2026-05-18","id":"ART-0249","url_forras":"nincs","kivonat":"A kormány felülvizsgálja a vendégmunkásokról szóló törvényt, amelyet az elmúlt években a változó közhangulat és céges igények miatt már többször módosítottak. Magyarországon 2016 óta van lehetőség külföldi munkaerő alkalmazására, és kezdetben a nagy létszámigényű feldolgozóiparban dolgozó ukránok jelentettek megoldást. Az ukrán munkavállalók nagy része a háború kitörése után a kedvezőbb európai segélyezési rendszerek miatt elhagyta a hazai munkaerőpiacot. Pótlásukra a kormányzat megnyitotta a lehetőséget a távolabbi országok előtt, aminek eredményeként leginkább a délkelet- és közép-ázsiai dolgozók váltak be. Magyarországon jelenleg nagyjából 120 ezer vendégmunkás tartózkodik, és a gazdasági recesszió miatt a piac most nem is igényel ennél nagyobb létszámot. A hatályos szigorítások értelmében a minősített kölcsönzők évente legfeljebb 35 ezer új külföldit hozhatnak be, akik maximum három évet maradhatnak. Jelenleg közvetlenül vendégmunkásként leginkább Fülöp-szigetekiek érkeznek, miközben más nemzetek tagjai – például a nepáli futárok – egyéni vállalkozói kiskapukat kihasználva dolgoznak itt. Nógrádi József szerint a törvény tervezett szigorítása valószínűleg pont ezeket a jogi kiskapukat zárja majd be a növekvő hazai munkanélküliség kezelése érdekében, ugyanakkor cáfolta, hogy a külföldiek elvennék a magyarok munkáját, hiszen a cégek csak olyan pozíciókra hozzák őket, amelyeket hazai munkaerővel képtelenek feltölteni. Bár papíron létezik egy 300 ezer fős hazai munkaerő-tartalék, a felzárkóztató programok tapasztalatai alapján az érintettek integrálása a valóságban rendkívül nehéz és lassú folyamat."},{"cim":"Rég volt ekkora elbocsátási hullám Magyarországon, ráadásul a NER-közeli cégek még bele sem kezdtek igazán","url":"https://nepszava.hu/3322570_magyarorszag-elbocsatasi-hullam-cegek-2026-munkaeropiac-ner","forras":"Népszava","datum":"2026-05-17","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint 2026 első négy hónapjában 30%-kal nőtt a csoportos létszámleépítések száma az előző évhez képest, összesen 2098 fő érintett.","kulcsszavak":["Trenkwalder","leépítés"],"het":"2026-05-11","id":"ART-0250","url_forras":"talalt","kivonat":"A gazdasági recesszió miatt drasztikusan, az elmúlt évihez képest mintegy 30 százalékkal megemelkedett a csoportos létszámleépítések száma 2026 első négy hónapja alatt. Ez összesítve 2098 fő, ami kiugrónak mondható és csak azért nem nagyobb, mert a csendes elbocsátások már hónapok óta zajlanak – jelezte lapunknak Nógrádi József, a hazai munkaerő-kölcsönző szektor meghatározó cége, a Trenkwalder stratégiai kapcsolatokért felelős igazgatója. A Központi Statisztikai Hivatal (KSH) jelentései alapján készített saját kalkulációja szerint a növekedés 2024-hez képest szinte már drámai mértékű, mert ebben az összevetésben az évek első négy hónapját összehasonlítva nagyjából duplájára ugrott az így elküldött alkalmazottak száma. Az előző választási ciklusban egyébként egyik év elején sem voltak ennyire csúnya számok. Ráadásul az innen fakadó leépítésekre még rárakódhat a NER-közeli vállalkozások választás utáni helyzetének hirtelen jött meggyengülése, illetve az ebből fakadó hatás. A nyilatkozatok alapján mintegy 3000-5000 olyan vállalat lehet, amelyet a NER vonzáskörzetéhez lehet sorolni. Ez azt jelenti, hogy a jelenleg mintegy 220 ezerre tett álláskeresők száma nyár végére, azaz szeptember elejére 240-250 ezer főre szaladhat fel."},{"cim":"Aranybánya lehet a nyári szünet: a Balatonnál és Budapesten kaszálhatnak a diákok","url":"https://www.economx.hu/gazdasag/2026/05/18/diakmunka-oraberek-trenkwalder/","forras":"Economx","datum":"2026-05-18","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az ELTE-Trenkwalder Iskolaszövetkezet adatai szerint a diákok átlagos órabére idén 2350 forint körül alakul, 8-9%-os éves növekedéssel; a Balatonnál és Budapesten a főszezonban akár 2600 forint is elérhető.","kulcsszavak":["Trenkwalder","diákmunka","turizmus","bérek"],"het":"2026-05-18","id":"ART-0251","url_forras":"talalt","kivonat":"A nyári szünidő közeledtével számos cég már aktívan toborozza a diákmunkásokat, akik számára a munkáltatók idén átlagosan 2350 forint körüli órabért kínálnak. Ez éves szinten 8-9 százalékos növekedést mutat - közölte legfrissebb adatait az ELTE-Trenkwalder Iskolaszövetkezet. Jelezték ugyanakkor, hogy az egyes szektorok között továbbra is jelentősek az eltérések. A gyártás-termelés, a call center és ügyfélszolgálat, az adminisztrációs feladatok és irodai asszisztencia, valamint a HR és az értékesítés területén egyaránt 2200 forint körül alakul a diákok átlagos órabére. Az üzleti kiszolgáló központokban (BSC) és a fizikai munka esetében 2350 forint az órabérek átlaga, a beszerzés, logisztika területére jelentkező diákok 2400, míg a marketing, média, illetve gyógyszeripari feladatokat választók 2500 forint körüli munkabérrel számolhatnak óránként. Az IT, telekommunikáció területén működő cégeknél pedig akár 3100-3200 forintot is elérhetnek a diákok. A vendéglátás és idegenforgalom bérszintje alapvetően 2200 forintról indul, ám a főszezonban, a kiemelt turisztikai központokban (például a Balatonnál vagy Budapesten) az órabérek a 2600 forintot is meghaladhatják, különösen a már nagyobb tapasztalattal rendelkezőknél."},{"cim":"Külföldben gondolkodik a magyar mérnökök nagy része","url":"https://autopro.hu/techtogether/kulfoldben-gondolkodik-a-magyar-mernokok-nagy-resze/1610913","forras":"Autopro","datum":"2026-05-18","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az autopro.hu felmérése szerint a mérnökhallgatók több mint háromnegyede hajlandó lenne belföldön elköltözni egy jó állásért, közel 65%-uk pedig diploma után külföldön is kipróbálná magát.","kulcsszavak":["pályakezdők","demográfia","kutatás és statisztika"],"het":"2026-05-18","id":"ART-0252","url_forras":"talalt","kivonat":"A magyar mérnökhallgatók jelentős része nyitott arra, hogy akár az ország másik végébe költözzön egy jó állásért, sokan pedig már külföldi karrierben gondolkodnak. Közben egyre magasabb fizetési elvárásokkal lépnének be a munkaerőpiacra, és a home office lehetőségét is alapvető elvárásnak tekintik. Az autopro.hu felmérése szerint a fiatal műszaki generáció már egészen más szemlélettel készül a munka világára. A 591 hallgató válaszai alapján a mostani mérnökgeneráció egyszerre ambiciózus, mobilis és tudatos. Sokaknál már nem az a legfontosabb kérdés, hogy „lesz-e munkájuk”, hanem az, hogy milyen életet tudnak kialakítani mellette. A kutatás egyik legerősebb eredménye, hogy a válaszadók több mint háromnegyede hajlandó lenne Magyarországon belül elköltözni egy megfelelő állásért. Ez különösen fontos lehet most, amikor az autóipari és technológiai beruházások egyre inkább vidéki ipari központokban jelennek meg. Debrecen, Győr, Kecskemét vagy Szeged ma már nemcsak gyártási helyszínek, hanem komoly karrierlehetőségeket kínáló technológiai központok is. A hallgatók jelentős része már tanulmányai alatt kapcsolatba kerül a munka világával. Sokan dolgoznak részmunkaidőben, szakmai gyakorlaton vagy iskolaszövetkezeten keresztül, de teljes állásban is közel 11 százalék vállal munkát az egyetem mellett. Közben a külföld továbbra is komoly vonzerőt jelent. A hallgatók közel 65 százaléka tervezi, hogy diploma után külföldön is kipróbálná magát. Érdekes ugyanakkor, hogy a válaszadók többsége korábban még nem tanult vagy élt külföldön, vagyis sokaknál inkább jövőbeli tervről, mint meglévő nemzetközi tapasztalatról van szó."},{"cim":"Kiborultak a magyarországi gyárak Kapitány István első korlátozásán: van, ahol le kell állítani a teljes műszakot – súlyosan érinti az egész gazdaságot","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/05/vendegmunkas-stop-vizum-magyar-peter-kormany-multik","forras":"Világgazdaság","datum":"2026-05-15","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Baja Sándor, a Randstad regionális vezetője szerint egy teljes vendégmunkás-tiltás hosszú távon nem lenne működőképes, mert a következő tíz évben a magyar munkaerőpiac jelentős része nyugdíjba vonul.","kulcsszavak":["Randstad","vendégmunka","munkajog"],"het":"2026-05-11","id":"ART-0253","url_forras":"talalt","kivonat":"A Tisza párt programja szerint meg akarják akadályozni, hogy a külföldi vendégmunkások „elvegyék a magyarok munkáját” és lenyomják a béreket. Baja Sándor, a Randstad munkaerő-közvetítő cég csehországi, magyarországi és romániai vezetője a Reutersnek elmondta: egy teljes tiltás hosszú távon nem lenne működőképes. A szakember szerint a következő tíz évben a magyar munkaerőpiac jelentős része nyugdíjba vonul, ezért a gazdaság egyre nagyobb munkaerőhiánnyal nézhet szembe. Baja azt reméli, hogy a gazdasági racionalitás végül felülírja majd a politikai szándékot. Bár a hivatalos adatok szerint a külföldi munkavállalók jelenleg a magyar munkaerő mindössze 2 százalékát adják, bizonyos ágazatok ennél sokkal erősebben támaszkodnak rájuk. Különösen az iparban, a gyártásban és a szolgáltatási szektorban váltak kulcsfontosságúvá az EU-n kívülről érkező dolgozók. Több vállalat szerint nélkülük már most sem tudnák fenntartani a termelést."},{"cim":"Egyeztetésre kéri a kormányt a WHC a vendégmunkás-stopról","url":"https://www.hrportal.hu/c/egyeztetesre-keri-a-kormanyt-a-whc-a-vendegmunkas-stoprol-20260519.html","forras":"HR Portál","datum":"2026-05-19","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szerint a vendégmunkás-állomány hirtelen korlátozása veszélyezteti a piac stabilitását és tízezernyi magyar munkahelyét is; az inaktív tömeg rövid távon nem mobilizálható a munkaerőpiacra.","kulcsszavak":["WHC","vendégmunkás-stop","szakszervezet"],"het":"2026-05-18","id":"ART-0254","url_forras":"talalt","kivonat":"A WHC Csoport szerint a tervezett drasztikus szigorítás azonnali és nyílt szakmai egyeztetést követel a döntéshozók és a piaci szereplők között. A vendégmunkás-állomány hirtelen korlátozása nemcsak a növekedési terveket húzhatja keresztül, de a jelenlegi piac stabilitását és tízezernyi magyar munkavállaló munkahelyét is közvetlenül veszélyezteti. „A Magyarországon dolgozó vendégmunkások az évek óta fennálló, strukturális munkaerőhiányt kompenzálják. Ha ők kiesnek a rendszerből, a termelési láncok megszakadnak, nem lehet új műszakokat indítani, a nagy nemzetközi vállalatok pedig kénytelenek lesznek felülbírálni magyarországi jelenlétüket. Ez pedig az ott dolgozó magyarok tízezreinek megélhetését, és a gazdaság stabilitását sodorja veszélybe” – fejtette ki aggodalmát Göltl Viktor, a WHC Csoport ügyvezetője. A WHC szakmai álláspontja szerint a kormányzat által említett 400 ezres – a statisztikákban rendszerint 300 ezresként regisztrált – inaktív tömeg, nem jelenthet azonnali megoldást a vállalatok napi szintű munkaerőigényére. Ez a régóta inaktív réteg jelen állapotában nem mobilizálható, hiszen többségük komoly egészségügyi, szociális vagy strukturális hátránnyal küzd. Ahhoz, hogy belőlük produktív munkavállaló váljon, egy komplex, éveken át tartó kormányzati és vállalati összefogásra – rehabilitációra, átképzésre és lépcsőzetes társadalmi-munkaerőpiaci integrációra – van szükség."},{"cim":"Hasítottak a munkaerő-kölcsönzők és a BMW a választás előtti hónapban","url":"https://www.hrportal.hu/hr/hasitottak-a-munkaero-kolcsonzok-es-a-bmw-a-valasztas-elotti-honapban-20260524.html","forras":"HR Portál","datum":"2026-05-24","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Az Opten adatai szerint a márciusi létszámbővülésben a Prohuman Zrt. produkálta a legnagyobb ugrást 285 fővel, a WHC és a Pannonjob követte; a debreceni BMW 187 fővel nőtt.","kulcsszavak":["autóipar","beruházás","munkaerő-kölcsönzés"],"het":"2026-05-18","id":"ART-0255","url_forras":"docx","kivonat":"Az Opten és a HR Portál márciusi létszámtrendjei szerint február-március között öt vállalatnál történt 100 fő feletti bővülés. A legnagyobb ugrást a Prohuman Zrt. produkálta 285 fővel, amelyet a WHC (139 fő) és a Pannonjob (101 fő) követett – a munkaerő-kölcsönzők élénkülése részben a vendégmunkás-toborzás felfutásának köszönhető, mivel több cég a Tisza-párti győzelem előtt igyekezett lépni, tartva a várható import-felfüggesztéstől. A gyártók közül a debreceni BMW nőtt 187 fővel és közelít az 5000-es létszámhoz, a Rosenberger pedig 118 munkavállalóval bővült egyetlen hónap alatt."},{"cim":"Ausztria elszívja a dolgozókat, az AI pedig mindent átír a munkaerőpiacon","url":"https://www.economx.hu/magyar-gazdasag/2026/05/27/ausztria-elszivja-a-dolgozokat-az-ai-pedig-mindent-atir-a-munkaeropiacon/","forras":"Economx","datum":"2026-05-27","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman győri regionális gazdasági fórumán elhangzott: Győr-Moson-Sopronban gyakorlatilag elfogyott a szabad munkaerő, a foglalkoztatottság közel 80%; a megoldást a skills-alapú HR-szemlélet és a gyakornoki programok jelenthetik.","kulcsszavak":["munkaerőhiány","skills-alapú HR"],"het":"2026-05-25","id":"ART-0256","url_forras":"docx","kivonat":"A Prohuman győri regionális gazdasági fórumán elhangzott: Győr-Moson-Sopron vármegyében gyakorlatilag elfogyott a szabad munkaerő – a munkanélküliség alig 2%, a foglalkoztatottság közel 80%, ami közgazdasági értelemben már a teljes foglalkoztatottság határát jelenti. Egy betanított pozíció feltöltése korábban napokat, ma másfél-két hetet vesz igénybe, hegesztőből, CNC-kezelőből és villamossági szakemberből különösen nagy a hiány. A vállalatokat három tényező szorítja egyszerre: az osztrák bérverseny, a Z-generáció megváltozott elvárásai és az AI miatt folyamatosan változó kompetenciaigény. A fórumon az is elhangzott, hogy Magyarországon évente 50 ezerrel csökken az aktív munkavállalók száma – a megoldást a skills-alapú HR-szemlélet, a gyakornoki programok és az utánpótlás-nevelés jelentheti.\n\nA Prohuman közleményét átvette az Economx mellett a HR Portál, a HRPOWER, az Autopro, a Pénzcentrum, a Profitline, a Digital Hungary, valamint az Adó Online is."},{"cim":"„Valódi versenyhelyzetet várok” – új vezetővel indul új időszak a munkaerő-kölcsönzőknél","url":"https://www.hrportal.hu/c/valodi-versenyhelyzetet-varok-uj-vezetovel-indul-uj-idoszak-a-munkaero-kolcsonzoknel-20260529.html","forras":"HR Portál","datum":"2026-05-29","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"Az MMOSZ éves közgyűlésén öt új tagszervezettel bővült, és az elnökségben Laczi Péter vette át Dénes Rajmund Roland helyét, aki valódi versenyhelyzetet vár a szektor megtisztulásához.","kulcsszavak":["munkaerő-kölcsönzés","munkáltatói szövetség","politika"],"het":"2026-05-25","id":"ART-0257","url_forras":"docx","kivonat":"A Magyar Munkaerő-kölcsönzők Országos Szövetsége (MMOSZ) éves közgyűlésén öt új tagszervezettel – köztük a HR-Rent Kft.-vel – negyedével növelte tagságát, és személyi változásokról is döntött. Az elnökségben Dénes Rajmund Roland helyét Laczi Péter, a Humán Navigátor Kft. képviselője vette át, aki hangsúlyozta: valódi versenyhelyzetet vár, mert a magyar gazdaságnak megtisztulásra van szüksége az innováció és fejlődés elindulásához. A szövetség új szlogenje – „Közös hang, valódi súly\" – a jogkövető és etikus HR-szolgáltatók érdekképviseletének megerősítését jelzi."},{"cim":"Még nem találták ki a vendégmunkások foglalkoztatásának új szabályozását","url":"https://telex.hu/belfold/2026/05/27/vendegmunkasok","forras":"Telex","datum":"2026-05-27","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A kormányszóvivő szerint a vendégmunkások új szabályozását még dolgozzák ki; a cél, hogy a nagy iparvállalatokban magyarok kapjanak munkát, míg a mezőgazdaságban továbbra is érkezhessenek vendégmunkások.","kulcsszavak":["vendégmunka","munkajog","politika"],"het":"2026-05-25","id":"ART-0258","url_forras":"docx","kivonat":"A kormányszóvivő, Szondi Vanda szerint a vendégmunkások szabályozásának új rendszerét még dolgozzák ki – bár a Tisza korábban június 1-jét jelölte meg határidőként, rendeletet vagy határozatot még nem adtak ki. A szóvivő elmondta: a problémát az előző kormánytól örökölték, amely olyan beruházásokat támogatott, ahol a munkahelyeket vendégmunkásokkal töltötték be. A reform nem egyszerű, mert a jelenlegi keretrendszeren belül határon túli magyarok is dolgoznak. A cél az, hogy a nagy iparvállalatokban magyar dolgozók kapjanak munkát, miközben a mezőgazdasághoz hasonló ágazatokban, ahol a külföldi munkaerő elengedhetetlen, továbbra is érkezhessenek vendégmunkások."},{"cim":"„Értünk dolgozzanak a vendégmunkások, ne helyettünk”","url":"https://www.youtube.com/watch?v=rDaQERyKgoY","forras":"Kontroll","datum":"2026-05-24","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Földi Miklós munkapszichológus szerint a vendégmunkás-rendszert nem eltörölni, hanem megreformálni kell: minőségi alapú akkreditációs rendszerre és a magyar munkaerő visszavezetésére van szükség.","kulcsszavak":["vendégmunka","mentális egészség","képzés","gazdasági kilátások"],"het":"2026-05-18","id":"ART-0259","url_forras":"docx","kivonat":"Földi Miklós munkapszichológus, a Fuse Work ügyvezetője szerint a vendégmunkás-rendszert nem kidobni kell kidobni, hanem megreformálni. A jelenlegi minősített kölcsönzői rendszer alapvető hibája, hogy mennyiségi alapon privilegizált piaccá vált, kiszorítva a tisztességes, kisebb szereplőket, miközben számos visszaélésre adott lehetőséget: hamis toborzói ígéretek, becsapott munkavállalók, papíron tartott emberek. Először a magyar munkaerőt kell visszavezetni a piacra – képzéssel, egyszerűsített digitális munkaközvetítéssel és a munka értékének helyreállításával –, emellé minőségi alapú, szakmailag ellenőrzött akkreditációs rendszert kell kiépíteni a vendégmunkásokra. A külföldi munkaerőnek a magyar mellé kell rendelve lennie, nem helyette – ott, ahol valódi hiány van, mint az egészségügyi kisegítő személyzet vagy a betanított munkák."},{"cim":"Vendégmunkás-stop: komoly kockázatokra figyelmeztetnek a munkaerő-kölcsönzők","url":"https://www.portfolio.hu/gazdasag/20260526/vendegmunkas-stop-komoly-kockazatokra-figyelmeztetnek-a-munkaero-kolcsonzok-838652","forras":"Portfolio","datum":"2026-05-26","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Pensum Group társalapítója szerint a vendégmunkás-stop csakis veszteseket termelne; a mobilizálható hazai munkaerő-tartalék az MNB szerint legfeljebb 150 ezer fő, tömeges tartalék nincs.","kulcsszavak":["Pensum Group","vendégmunkás-stop","munkaerő-tartalék","kutatás és statisztika"],"het":"2026-05-25","id":"ART-0260","url_forras":"docx","kivonat":"Hadházy Tamás, a Pensum Group társalapítója szerint a vendégmunkás-stop rövid távon csakis veszteseket termelne – a bérek nem fognak emelkedni, de a gazdasági visszaesés és a költségvetési bevételkiesés biztosra vehető. Magyarországon a külföldi munkavállalók aránya mindössze 3%, szemben a cseh 16%-kal vagy a lengyel 7%-kal, és az MNB szerint a valóban mobilizálható hazai munkaerő-tartalék maximum 150 ezer fő – tömeges tartalék egyszerűen nincs. A bérszínvonal-lenyomás vádját városi legendának nevezi: vendégmunkást csak akkor lehet hozni, ha az adott munkakörre nincs hazai jelentkező, azonos feltételek mellett. A Pensum a képzés fejlesztését, az automatizálást és a jelenlegi inaktív rétegek átképzését tartja kulcskérdésnek."},{"cim":"Zsongó darázsfészek vár a Tisza-kormányra: a vendégmunkásvita elfed egy súlyos problémát","url":"https://www.portfolio.hu/gazdasag/20260527/zsongo-darazsfeszek-var-a-tisza-kormanyra-a-vendegmunkasvita-elfed-egy-sulyos-problemat-839152","forras":"Portfolio","datum":"2026-05-27","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Szakértők szerint a jelenlegi idegenrendészeti rendszer kiszámíthatatlan és túl sok engedélytípusra esik szét; az AmCham és az ABSL kevesebb, átláthatóbb engedélykategóriát és az országlista eltörlését sürgeti.","kulcsszavak":["munkajog","munkáltatói szövetség","gazdasági kilátások"],"het":"2026-05-25","id":"ART-0261","url_forras":"docx","kivonat":"A vendégmunkás-vita mögött egy mélyebb, strukturális probléma húzódik: a jelenlegi idegenrendészeti rendszer munkáltatók és szakértők szerint egyaránt kiszámíthatatlan, túl sok engedélytípusra esik szét, és az országlista-korlátok miatt olyan munkavállalókat is kizár, akikre a gazdaságnak szüksége lenne – az amerikaiaktól a magyarországi diplomásokig. Az AmCham, az ABSL, a Sanofi és bevándorlási szakértők egybehangzóan kevesebb, átláthatóbb engedélykategóriát, az országlista eltörlését és a magyarországi diplomások munkapiaci átvezetését sürgetik. A június 1-jei felfüggesztést az érintett szereplők nem ellenezk feltétlenül, de egyeztetés nélküli, általános tiltástól óvnak, és ellenőrizhető, a valós munkaerőpiaci igényekre épülő, a magyar munkavállalók elsőbbségét fenntartó reformot sürgetnek."},{"cim":"A tehetségek bevonzása lehet a magyar gazdasági áttörés kulcsa – figyelni kell, mert fogy a hazai munkaerő","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/05/munkaero-magyarorszag-gazdasagi-attores-kepzett-munkas","forras":"Világgazdaság","datum":"2026-05-26","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az Oeconomus elemzése szerint stratégiai kérdés, hogy Magyarország képes-e vonzó célországgá válni képzett szakembereknek; a munkaképes népesség 2050-ig közel egymillió fővel csökkenhet.","kulcsszavak":["kutatás és statisztika","munkáltatói márka","demográfia","beruházás"],"het":"2026-05-25","id":"ART-0262","url_forras":"docx","kivonat":"Az Oeconomus Gazdaságkutató Alapítvány elemzése szerint Magyarország számára stratégiai kérdéssé válik, hogy képes-e vonzó célországgá válni a képzett szakemberek számára. Jelenleg mintegy 100 ezer betöltetlen álláshely van, a munkaképes korú népesség 2050-ig közel egymillió fővel csökkenhet, miközben az újabb beruházások – 2025-ben közel 7 milliárd eurónyi FDI érkezett – tovább növelik a munkaerő iránti keresletet. A régiós versenytársak – Észtország, Portugália, Lengyelország, Litvánia – már tudatos stratégiákkal vadásznak a magasan képzett szakemberekre, Magyarország eddig csak korlátozottan élt az EU-n belüli munkaerő-mobilitás lehetőségeivel. Az elemzés szerint a következő évek gazdasági versenyképességét egyre kevésbé az adókörnyezet, egyre inkább a tehetségvonzó képesség határozza meg."},{"cim":"Százezrek hiányoznak a munkaerőpiacról, és nincsenek rejtett tartalékok","url":"https://ado.hu/munkaugyek/szazezrek-hianyoznak-a-munkaeropiacrol-es-nincsenek-rejtett-tartalekok/","forras":"Adó Online","datum":"2026-05-27","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Menton Jobs ügyvezetője szerint a magyar gazdaságban nincsenek gyorsan mobilizálható tartalékok; a GKI adatai szerint 2025-ben az álláshirdetéseknek csak 60%-át sikerült betölteni.","kulcsszavak":["Menton Jobs","munkaerő-tartalék","kutatás és statisztika","toborzás"],"het":"2026-05-25","id":"ART-0263","url_forras":"docx","kivonat":"Horváth Tamás, a Menton Jobs tulajdonos-ügyvezetője szerint a magyar gazdaságban évek óta nincsenek gyorsan mobilizálható munkaerőtartalékok – aki akar és tud dolgozni, az már elhelyezkedett. A GKI adatai szerint 2025-ben 350-550 ezer álláshirdetés jelent meg, ezeknek csak 60%-át sikerült betölteni, és legalább 65 ezer munkakör tartósan üres maradt. A hazai iparnak azonnal kellene képzett hegesztő, CNC-megmunkáló, kamionsofőr és gyári operátor – ezeket a pozíciókat reálisan csak külföldi munkaerővel lehet betölteni, ahogy az minden, „bezzegországként” emlegetett európai államban is így van. Horváth szerint fontos tudatosítani: a vendégmunkások nem migránsok, hanem szigorú feltételekkel, hatósági kontroll mellett, néhány évre érkező munkavállalók, akik magyarokkal azonos bért keresnek – nélkülük teljes iparágak állnának le."},{"cim":"Fogy a magyar, kevesebb a foglalkoztatott","url":"https://telex.hu/gazdasag/2026/05/28/ksh-foglalkoztatas-munkaero-munkanelkuliseg","forras":"Telex","datum":"2026-05-28","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH szerint a foglalkoztatottak száma 4 millió 619 ezer fő volt áprilisban, 55 ezerrel kevesebb egy évvel korábbinál; a külföldön dolgozók száma 120 ezerre nőtt.","kulcsszavak":["KSH","foglalkoztatottság","munkanélküliség","demográfia"],"het":"2026-05-25","id":"ART-0264","url_forras":"docx","kivonat":"A KSH áprilisi adatai szerint a foglalkoztatottak száma 4 millió 619 ezer fő volt, a február–áprilisi átlag pedig 55 ezerrel maradt el az egy évvel korábbitól – elsősorban demográfiai okokból. A munkanélküliségi ráta 4,5 százalék, az álláskeresés átlagos ideje 13,1 hónap. A külföldön dolgozók száma 120 ezerre nőtt. A gyenge gazdasági teljesítmény ellenére nem ugrott meg a munkanélküliség, ugyanakkor a természetes kínálatcsökkenés és a június 1-től bevezetendő vendégmunkás-stop együttesen komoly kérdés elé állítja az új kormányt a szabályozás kialakításában."},{"cim":"Valami nagyon nem stimmel a magyar munkaerőpiacon - veszélyes trend rajzolódik ki","url":"https://www.hrportal.hu/hr/valami-nagyon-nem-stimmel-a-magyar-munkaeropiacon-veszelyes-trend-rajzolodik-ki-20260529.html","forras":"HR Portál","datum":"2026-05-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Elemzők szerint a foglalkoztatottak száma 4,5 éves mélypont közelében van; a vállalatok a geopolitikai bizonytalanság miatt inkább optimalizálnak, mint bővítenek, a fordulat legkorábban a második félévtől várható.","kulcsszavak":["foglalkoztatottság","gazdasági kilátások","kutatás és statisztika"],"het":"2026-05-25","id":"ART-0265","url_forras":"docx","kivonat":"A KSH áprilisi adatait elemezve a szakértők aggasztó trendeket látnak: a foglalkoztatottak száma 4,5 éves mélypont közelében van, miközben a munkaképes korú népesség tovább csökken, és egyre többen hagyják el a munkaerőpiacot. Virovácz Péter (ING Bank) szerint 4,5-5% között ingadozhat idén a munkanélküliségi ráta, Balog-Béki Márta (MBH Bank) 4,6%-os éves átlagot vár. A vállalatok kivárnak: a gyenge külső kereslet, az iráni háború miatti energiaár-sokk és a geopolitikai bizonytalanság miatt inkább optimalizálnak, mint bővítenek. Regős Gábor (Gránit Alapkezelő) szerint a vendégmunkás-behozatal korlátozása enyhíthetne a munkaerőpiac feszességén, a fordulat azonban legkorábban a második félévtől várható, ha a növekedés beindul."},{"cim":"Durva számok érkeztek: sötét fellegek gyülekeznek a magyar húzóágazat felett","url":"https://www.economx.hu/gazdasag/2026/05/25/turizmus-konjunktura-index-vendeglatas-gki-legi-kozlekedes-kul-es-belfoldi-turistak/","forras":"Economx","datum":"2026-05-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A VIMOSZ és GKI konferenciáján elhangzott: a hazai turizmus külföldi dolgozók nélkül nem tud működni; a Turizmus Konjunktúra Index mínusz 9 ponton áll, a vendégmunkás-stop nyári időzítése kellemetlen.","kulcsszavak":["turizmus","munkáltatói szövetség","kutatás és statisztika","vendégmunka"],"het":"2026-05-25","id":"ART-0266","url_forras":"docx","kivonat":"A VIMOSZ és a GKI konferenciáján résztvevők leszögezték: a hazai turizmus külföldi dolgozók nélkül már nem tud működni – a vendégmunkás-stop bevezetésének nyári főszezonban való időzítését a VIMOSZ elnöke, Gál Pál Zoltán kifejezetten kellemetlennek nevezte. A szektor ráadásul más nehézségekkel is küzd: a Turizmus Konjunktúra Index mínusz 9 ponton áll, a Covid előtti csúcsot még mindig nem sikerült elérni, és a kerozinárak megduplázódása a légi forgalmat is érinti. A MGYOSZ közgazdásza szerint 2027-re hozhatnak érdemi változást az EU-s források és a kormányváltás nyomán induló gazdasági folyamatok – addig viszont a szektor a munkaerőhiány, a bizonytalan szabályozási környezet és a magas energiaárak szorításában működik."},{"cim":"Még egy államtitkárt akarnak a szakszervezetek","url":"https://piacesprofit.hu/cikkek/gazdasag/meg-egy-allamtitkart-akarnak-a-szakszervezetek.html","forras":"Piac és Profit","datum":"2026-05-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Munkástanácsok Országos Szövetsége és a Szakszervezetek Együttműködési Fóruma önálló foglalkoztatáspolitikai szakállamtitkárság létrehozását kéri az új kormányzati struktúrában.","kulcsszavak":["szakszervezet","képzés","foglalkoztatottság"],"het":"2026-05-25","id":"ART-0267","url_forras":"docx","kivonat":"A Munkástanácsok Országos Szövetsége és a Szakszervezetek Együttműködési Fóruma nyílt levélben kéri, hogy az új kormányzati struktúrában önálló, erős mandátumú foglalkoztatáspolitikai szakállamtitkárság jöjjön létre. Az érdekképviseletek szerint aggodalomra ad okot, hogy egyelőre nem látható kifejezetten munkaügyekért felelős kormányzati felelős – a terület széttagolt kezelése a munkavállalók megélhetését, a vállalkozások működését és az ország versenyképességét egyaránt érinti. Különösen fontosnak tartják a közszféra – köztük az egészségügyi, oktatási és rendvédelmi – munkajogi szabályozásának összehangolását."},{"cim":"Mehessenek a férfiak is 40 év után nyugdíjba? Ilyen költségekkel járna az intézkedés","url":"https://www.portfolio.hu/gazdasag/20260529/mehessenek-a-ferfiak-is-40-ev-utan-nyugdijba-ilyen-koltsegekkel-jarna-az-intezkedes-839572","forras":"Portfolio","datum":"2026-05-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Férfi40 bevezetése akár 440 milliárd forintos éves többletterhet jelenthetne; a NyugdíjGuru szerint a valódi megoldás egy rugalmas, mindkét nemre kiterjedő korhatár előtti nyugdíjrendszer lenne.","kulcsszavak":["idősebb munkavállalók","gazdasági kilátások"],"het":"2026-05-25","id":"ART-0268","url_forras":"docx","kivonat":"A Férfi40 bevezetése – amelynek vizsgálatát a Tisza és a Mi Hazánk egyaránt szorgalmazza – akár 440 milliárd forintos éves többletterhel is járhatna, ami a Nők40 jelenlegi 539 milliárdos kiadásának több mint 80 százaléka. A NyugdíjGuru elemzése szerint a rendszer finanszírozhatóságát a 13. és 14. havi nyugdíjjal együtt már három plusz havi kiadás terheli, egy negyedik veszélyeztetné a hosszú távú stabilitást. A szerző szerint a valódi megoldás nem a Férfi40, hanem egy mindkét nemre kiterjedő, rugalmas korhatár előtti nyugdíjrendszer – levonással terhelve –, ahol a nők kisebb levonással és korábbi életkortól élhetnének a lehetőséggel."},{"cim":"Munkaalapú rendszerváltás","url":null,"forras":"HVG","datum":"2026-05-28","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder és a Randstad vezetői szerint a munkaerőpiac valódi problémája nem a vendégmunkások jelenléte, hanem a gazdasági stagnálás; egyes szektorokban a külföldi munkaerő nélkülözhetetlen.","kulcsszavak":["Trenkwalder","Randstad","vendégmunka","gazdasági kilátások"],"het":"2026-05-25","id":"ART-0269","url_forras":"nincs","kivonat":"A vendégmunkásokkal kapcsolatos politikai félelmek nem tükrözik a valóságot: a harmadik országbeli dolgozók száma jelenleg 84 ezer fő, foglalkoztatásuk drága, adminisztratív terhet jelent, és csak akkor lehetséges, ha nincs hazai jelentkező. G. Nagy Balázs, a Trenkwalder ügyvezetője és Baja Sándor, a Randstad Hungary igazgatója szerint a munkaerőpiac valódi problémája nem a vendégmunkások jelenléte, hanem a gazdasági stagnálás, a meg nem alapozott béremelések és az AI térnyerése. Egyes szektorokban – hajtató kertészetek, állattartó telepek, éjszakai gyári műszakok, építőipar – a külföldi munkaerő nélkülözhetetlen, mivel ezekre a munkákra nincs hazai jelentkező. Hosszabb távon a demográfiai folyamatok – évente 50 ezerrel csökkenő aktív munkaerő – szükségszerűvé teszik a külföldi munkaerő átgondolt, szabályozott bevonását."},{"cim":"Marad-e diákmunka a diákoknak, vagy pedig mindent visz az AI?","url":"https://infostart.hu/gazdasag/2026/05/23/marad-e-diakmunka-a-diakoknak-vagy-pedig-mindent-visz-az-ai","forras":"InfoStart","datum":"2026-05-23","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az ELTE-Trenkwalder Iskolaszövetkezet szerint a diákmunkások átlagosan 2350 forintos órabérre számíthatnak, de a meghirdetett pozíciók száma 8-10%-kal csökkent az AI és a recesszió miatt.","kulcsszavak":["Trenkwalder","diákmunka","AI","bérek"],"het":"2026-05-18","id":"ART-0270","url_forras":"docx","kivonat":"Nógrádi József, az ELTE-Trenkwalder Iskolaszövetkezet értékesítési igazgatója szerint idén a diákmunkások átlagosan 2350 forintos órabérre számíthatnak – ez 8-9 százalékos emelkedés –, a legjobban az IT és telekommunikációs terület fizet, akár 3100-3200 forinttal. Ugyanakkor a meghirdetett pozíciók száma 8-10 százalékkal csökkent, főként az irodai és gyakornoki munkakörökben. Ennek két fő oka van: az AI elveszi a belépő szintű állásokat, a három éve tartó gazdasági recesszió pedig arra készteti a cégeket, hogy a meglévő dolgozókat túlóráztassák inkább diákmunkások alkalmazása helyett."},{"cim":"A Formula Racing Team nyerte a Techtogethert!","url":"https://www.autoszektor.hu/hu/content/formula-racing-team-nyerte-techtogethert","forras":"Autószektor","datum":"2026-05-27","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A BME Formula Racing Team nyerte a Techtogether Automotive Hungary mérnökhallgatói versenyt; a Trenkwalder Recruitment különdíját a BME Motorsport csapata kapta.","kulcsszavak":["Trenkwalder","pályakezdők","gazdasági kilátások"],"het":"2026-05-25","id":"ART-0271","url_forras":"docx","kivonat":"A Hungexpón megrendezett Techtogether Automotive Hungary mérnökhallgatói versenyen a BME Formula Racing Team végzett az élen – ők nyerték az összesített versenyt és öt különdíjat is begyűjtöttek. A több mint 140 résztvevő valós ipari feladatokon – AI, robotika, automatizálás, PLC-programozás, kiberbiztonság – dolgozott együtt vállalati szakemberekkel, köztük a Trenkwalder Recruitment Kft. különdíját a BME Motorsport kapta, akik amúgy a második helyen végeztek."},{"cim":"Versenyeznek a hazai cégek a mérnökökért","url":"https://e.pcloud.link/publink/show?code=XZMeTrZAI9VbtGW4eR2K3H0IFQnr4UgpM3k","forras":"Műszaki Magazin","datum":"2026-05-20","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint a hazai cégek az egész világgal versenyeznek a mérnökökért; a belépő mérnöki bérek 500-750 ezer forinttól indulnak, senior szinten elérik az 1,7 milliót.","kulcsszavak":["Trenkwalder","munkaerőhiány","bérek"],"het":"2026-05-18","id":"ART-0272","url_forras":"docx","kivonat":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint Magyarországon – ahol a legnagyobb hiány villamos- és gépészmérnökökből van – a hazai cégek gyakorlatilag az egész világgal versenyeznek a szakemberekért: több mint 18 ezer magyar hallgató tanul külföldön, a nyelvtudással rendelkezőket pedig a nyugati munkaerőpiac aktívan szippantja el. A belépő mérnöki bérek régiótól függően bruttó 500–750 ezer forinttól indulnak, senior szinten elérik az 1,5–1,7 milliót – az IT-szektorban tapasztalt szakembereknél akár 2,2 milliót is. A munkáltatók ma már releváns gyakorlatot, tárgyalóképes nyelvtudást és AI-ismeretet várnak el, a friss diplomások bérelvárásai pedig közelítenek a valósághoz."},{"cim":"Sokkoló számok a magyar gazdaságról: A közép- és nagyvállalatok 71%-a kerülhet szorult helyzetbe a vendégmunkások tiltása miatt","url":"https://profitline.hu/sokkolo-szamok-a-magyar-gazdasagrol-a-kozep-es-nagyvallalatok-71-a-kerulhet-szorult-helyzetbe-a-vendegmunkasok-tiltasa-miatt-487112","forras":"Profitline","datum":"2026-05-23","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC felmérése szerint a megkérdezett nagyvállalatok 71,3%-a működésképtelen lenne kizárólag hazai munkaerővel; a cégek a rendszer finomhangolását, nem a külföldi munkaerő eltörlését kérik.","kulcsszavak":["WHC","vendégmunka","kutatás és statisztika","gazdasági kilátások"],"het":"2026-05-18","id":"ART-0273","url_forras":"talalt","kivonat":"A WHC Csoport felmérésében megkérdezett 157 nagyvállalat 71,3 százaléka működésképtelen lenne kizárólag hazai munkaerővel. A megkérdezett cégek 73,9 százaléka foglalkoztat harmadik országbeli munkavállalót, és 81,5 százalékuk szerint saját erőből teljesen kivitelezhetetlen lenne a külföldi toborzás és az ezzel járó adminisztráció. A vállalatok nem a külföldi munkaerő eltörlését, hanem a rendszer finomhangolását kérik: gyorsabb digitális ügyintézést, hosszabb foglalkoztatási lehetőséget és rugalmasabb státuszkezelést. A WHC azonnali szakmai egyeztetést sürget a kormánnyal – a szektor megkeresésére eddig nem érkezett válasz."},{"cim":"2000 milliárd forint GDP, 300 milliárd forint adóbevétel: ennyit veszíthet a magyar gazdaság az új vendégmunkás-rendelettel","url":"https://www.portfolio.hu/gazdasag/20260526/2000-milliard-forint-gdp-300-milliard-forint-adobevetel-ennyit-veszithet-a-magyar-gazdasag-az-uj-vendegmunkas-rendelettel-838646","forras":"Portfolio","datum":"2026-05-26","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Göltl Viktor, a WHC ügyvezetője szerint a külföldi munkavállalók évente 1600-2000 milliárd forint GDP-t és 250-300 milliárd forint adóbevételt termelnek, amelynek kiesése komoly terhet róna a gazdaságra.","kulcsszavak":["WHC","gazdasági kilátások","vendégmunka"],"het":"2026-05-25","id":"ART-0274","url_forras":"docx","kivonat":"Göltl Viktor, a WHC Csoport ügyvezetője a Portfoliónak adott interjúban elmondta: a mintegy 100 ezer külföldi munkavállaló évente 1600-2000 milliárd forintnyi GDP-t termel és 250-300 milliárd forint adóbevételt generál – ezek kiesése komoly terhet róna a már így is gyengélkedő gazdaságra és költségvetésre. A külföldi munkavállalók a 4,7 milliós foglalkoztatotti kör mindössze 2 százalékát teszik ki, és alkalmazásuk drágább a hazainál – szállás, utazás, betanítás –, tehát nem szorítják ki a magyar munkavállalókat, hanem a működés alátámasztását szolgálják olyan pozíciókban, amelyekre nincs hazai jelentkező. A hirtelen stop különösen a multinacionális gyáraknál okozhat bajt: ha egy telephely munkaerőhiány miatt nem tud teljesíteni, elveszíthet megrendeléseket, ami végső soron a magyar munkahelyeket is veszélyezteti – a régiós versenyben Lengyelország, Csehország és Szlovákia ugyanazokra a megbízásokra hajt."},{"cim":"Hihetetlen, de igaz: ennyit keresnek
