 most a melósok a magyar földeken","url":"https://www.agronaplo.hu/agrarhirek/20260528/hihetetlen-de-igaz-ennyit-keresnek-most-a-melosok-a-magyar-foldeken-40454","forras":"Agronapló","datum":"2026-05-28","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC körképe szerint a mezőgazdasági szezonális munkaerőhiány komoly kihívás; az órabérek bruttó 2200 forintig terjedhetnek, a kukoricabetakarításban csoportvezetői szinten 420-440 ezer forint is elérhető havonta.","kulcsszavak":["WHC","agrárium","szezonális munka","bérek"],"het":"2026-05-25","id":"ART-0275","url_forras":"docx","kivonat":"A WHC Csoport idei körképe szerint a mezőgazdasági szezonális munkaerőhiány komoly kihívás elé állítja a gazdálkodókat: a gyümölcsszedéstől a konzervipari válogatásig mindenütt keresik a dolgozókat. A 2026-os szezonban az órabérek bruttó 2200 forintig terjedhetnek, a kukoricabetakarításban csoportvezetői szinten havi 420-440 ezer forint is elérhető. A diákok főként Szeged és Debrecen környékén mutatnak nyitottságot, a nyugdíjas munkavállalók megbízhatósága és tapasztalata szintén felértékelődött. A szektor előtt azonban nagy a bizonytalanság: június 1-től egyelőre nem ismert, milyen szabályozás vonatkozik a harmadik országbeli munkavállalókra – akiknek jelenlétére az agrárium erősen támaszkodik."},{"cim":"Debrecen Economic Forum 2026: a helyi gazdasági boom hajtóerőitől az átfogó makro nagyképig","url":"https://www.portfolio.hu/gazdasag/20260601/debrecen-economic-forum-2026-a-helyi-gazdasagi-boom-hajtoeroitol-az-atfogo-makro-nagykepig-840388","forras":"Portfolio","datum":"2026-06-01","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Portfolio Debrecen Economic Forum 2026 konferenciáján a munkaerőpiaci feszültségeket is tárgyalják; a Prohumant Pappné Kövesdi Nikolett kelet-magyarországi régióvezető képviseli az előadók között.","kulcsszavak":["foglalkoztatottság"],"het":"2026-06-01","id":"ART-0276","url_forras":"docx","kivonat":"A Portfolio június 9-én rendezi meg a Debrecen Economic Forum 2026 konferenciát, amelynek négy szekciója a kkv-hitelezést és EU-s forrásokat, a debreceni beruházási és ingatlanpiaci folyamatokat, a globális megatrendeket – energiaárak, autóipari átrendeződés, AI –, valamint a makrogazdasági kilátásokat járja körül. A munkaerőpiaci feszültségek is terítékre kerülnek – a Prohumant Pappné Kövesdi Nikolett kelet-magyarországi régióvezető képviseli az előadók között. A záró makropanelen Bod Péter Ákos, Madár István és Tardos Gergely közgazdászok értékelik Magyarország növekedési kilátásait."},{"cim":"Harmincadik éve rendezett Kecskeméten állásbörzét a Foglalkoztatási Osztály","url":"https://hiros.hu/harmincadik-eve-rendezett-kecskemeten-allasborzet-a-foglalkoztatasi-osztaly/","forras":"Hírös.hu","datum":"2026-05-31","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Bács-Kiskun Vármegyei Kormányhivatal harmincadik alkalommal rendezte meg kecskeméti állásbörzéjét 360 érdeklődővel és 22 kiállítóval, köztük a Prohuman és a WHC részvételével.","kulcsszavak":["toborzás"],"het":"2026-05-25","id":"ART-0277","url_forras":"docx","kivonat":"A Bács-Kiskun Vármegyei Kormányhivatal harmincadik alkalommal rendezte meg kecskeméti állásbörzéjét, amelyen 360 érdeklődő és 22 kiállító vett részt – köztük a Prohuman és a WHC. A 61 munkakörben közel 1300 munkavállalót kereső cégek elsősorban a fémipar, autóipar, elektronika és élelmiszeripar területéről érkeztek."},{"cim":"Robotkutyával, VR-szimulációval és rakétával érkezett Szegedre a BME roadshow-ja","url":"https://szegeder.hu/helyi/2026-06-03/robotkutyaval-vr-szimulacioval-es-raketaval-erkezett-szegedre-a-bme-roadshow-ja/6a204d6c47d3c00bc7e82b3f","forras":"Szegeder","datum":"2026-06-03","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A BME szegedi roadshow-ján a Prohuman Learning Solutions szakmai partnerként Kawasaki és Niryo oktatási robotokat hozott el, amelyeket magyar diákok most próbálhattak ki először.","kulcsszavak":["képzés","AI"],"het":"2026-06-01","id":"ART-0278","url_forras":"docx","kivonat":"A Budapesti Műszaki és Gazdaságtudományi Egyetem június 2-án roadshow-t tartott Szegeden, amelyen minden tizedik szegedi középiskolás részt vett. A pályaorientációs eseményen robotkutya, humanoid robot, elektromos versenyautó, rakéta és VR-szimuláció várta az érdeklődőket – a cél a STEM-képzések élményszerű bemutatása volt. Szakmai partnerként a Prohuman Learning Solutions is részt vett: a vállalat Kawasaki és Niryo oktatási robotjait hozta el, amelyeket Magyarországon most próbálhattak ki először diákok."},{"cim":"Alacsonyabb árréssel szervezik a vendégmunkásokat, jelképes osztalékot fizet a Pensum Group","url":"https://www.vg.hu/penz-es-tokepiac/2026/06/vendegmunkas-kolcsonzo","forras":"Világgazdaság","datum":"2026-06-20","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"A tőzsdén jegyzett Pensum Group részvényenként 8 forintos osztalékot fizet 2025-re, szemben a tavalyi 35 forinttal; a visszaesés hátterében a vendégmunkás-kölcsönzés szigorodó szabályozása áll.","kulcsszavak":["Pensum Group","adózás","munkaerő-kölcsönzés","munkajog"],"het":"2026-06-15","id":"ART-0279","url_forras":"docx","kivonat":"A tőzsdén jegyzett Pensum Group részvényenként 8 forintos osztalékot fizet 2025-re – ez jelképesnek tekinthető, különösen a tavalyi 35 forintos kifizetéshez képest. A drasztikus visszaesés hátterében a vendégmunkás-kölcsönzés szigorodó szabályozása és csökkenő profitmarzsa áll. Az osztalékszelvény június 10-ig forog a pesti parketten, a kifizetés kezdőnapja június 22."},{"cim":"Döntött Magyar Péter kormánya: azonnali hatállyal vége a jelenlegi vendégmunkás-rendszernek","url":"https://www.portfolio.hu/gazdasag/20260605/dontott-magyar-peter-kormanya-azonnali-hatallyal-vege-a-jelenlegi-vendegmunkas-rendszernek-841496","forras":"Portfolio","datum":"2026-06-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A kormány rendelettel lezárta a vendégmunkás-tartózkodási engedélyen alapuló tömeges foglalkoztatási csatornát; a Fülöp-szigetek, Örményország és Grúzia állampolgárai számára az engedély továbbra is elérhető marad.","kulcsszavak":["politika","vendégmunka","munkajog"],"het":"2026-06-01","id":"ART-0280","url_forras":"docx","kivonat":"Magyar Péter kormánya egy pénteken kihirdetett rendelettel lezárta a vendégmunkás-tartózkodási engedélyen alapuló tömeges foglalkoztatási csatornát – a jövőben egyetlen harmadik ország állampolgára sem foglalkoztatható ilyen jogcímen. A döntés elsősorban azt a rendszert érinti, amelyen keresztül munkaerő-kölcsönzők nagyobb számban hozhattak munkavállalókat az országba. Fontos különbség: a foglalkoztatási célú tartózkodási engedély a Fülöp-szigetek, Örményország és Grúzia állampolgárai számára továbbra is elérhető marad. Az átmeneti szabályok szerint a már kiadott engedélyek érvényesek maradnak, és a folyamatban lévő, június 5-ig benyújtott kérelmeket a korábbi szabályok szerint bírálják el. Szondi Vanda kormányszóvivő az intézkedést első lépésként mutatta be – a teljes rendszer felülvizsgálata és új szabályozás kidolgozása folyamatban van, a 24 különböző munkavállalási jogcím egységes kezelése még várat magára."},{"cim":"A nagy felfutás után sincs tele Magyarország vendégmunkásokkal","url":"https://telex.hu/g7/adat/2026/06/05/vendegmunkasok-szama-statisztika-orszagok-szabalyozas-valtozasa","forras":"G7","datum":"2026-06-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A külföldi munkavállalók aránya Magyarországon mindössze 2,3%, szemben az uniós átlaggal, amely ennek négyszerese; a számuk 2020 és 2025 között 67 ezerről 106 ezerre nőtt, elsősorban filippínók révén.","kulcsszavak":["vendégmunka","kutatás és statisztika"],"het":"2026-06-01","id":"ART-0281","url_forras":"docx","kivonat":"Magyarországon a közérzülettel szemben európai összehasonlításban kevés külföldi munkavállaló dolgozik: arányuk a foglalkoztatottakon belül mindössze 2,3%, miközben az uniós átlag ennek négyszerese, Csehországban pedig kétszer akkora. A külföldi munkavállalók száma 2020 és 2025 között 67 ezerről 106 ezerre nőtt – elsősorban ázsiai munkavállalók, főként filippínók révén, miközben az ukrán és szerb dolgozók száma csökkent. A vendégmunkások területileg koncentráltak: Budapesten 6,2%, vidéken csupán 1,3% az arányuk. Az adatok nem támasztják alá, hogy a külföldi munkavállalók elvennék a magyarok állásait – ahol a legtöbben dolgoznak, ott a legalacsonyabb a munkanélküliség. És inkább a nyugat-európai uniós munkavállalók szorítják ki a magyarokat a jobban fizetett pozíciókból, nem a harmadik országbeliek."},{"cim":"Magyar munkaerőpiac: kétezermilliárdos növekedési tartalék hever parlagon","url":"https://novekedes.hu/hirek/a-hazai-kordiszkriminacio-valos-ara-ketezermilliardos-novekedesi-tartalek-hever-parlagon-a-magyar-munkaeropiacon","forras":"Növekedés.hu","datum":"2026-06-01","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A The Seniors számításai szerint a 45 év felettiek munkaerőpiaci kiszorítása évente 1400-2200 milliárd forintos GDP-kiesést okoz; a senior álláskeresők 74%-a automatikus elutasítást kap.","kulcsszavak":["esélyegyenlőség","idősebb munkavállalók","gazdasági kilátások"],"het":"2026-06-01","id":"ART-0282","url_forras":"docx","kivonat":"A The Seniors tanácsadó cég számításai szerint a 45 év feletti szakemberek munkaerőpiaci kiszorítása évente 1400–2200 milliárd forintos GDP-kiesést okoz Magyarországon. A cég kutatása szerint a senior álláskeresők 74 százaléka automatikus elutasítást kap, 57 százalékukat túlképzettnek minősítik, 28 százalékuk több mint egy éve nem tud elhelyezkedni. Egyetlen senior szakember lecserélése átlagosan 11-22 millió forintos közvetlen és közvetett veszteséget jelent – évente körülbelül 119 ezer ilyen esetnél ez a vállalati szektorban 680-1350 milliárd forintos felesleges kiadást eredményez. Csillag-Csatlós Csilla, a The Seniors alapítója szerint a döntéshozók a rövid távú bérmegtakarítást látják, a 18 hónapos betanulási időt, a tudásveszteséget és a drágábban visszavásárolt szakértelmet azonban nem."},{"cim":"Diákmunka: a 3000 forintos órabér is meglehet, de mi van az AI-jal?","url":"https://infostart.hu/belfold/2026/05/31/diakmunka-a-3000-forintos-oraber-is-meglehet-de-mi-van-az-ai-jal","forras":"InfoRádió","datum":"2026-05-31","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Mind-Diák Szövetkezet elnöke szerint a diákmunka órabére elérheti a 3000 forintot informatikai területen; az AI inkább a monoton feladatokat veszi le a diákok válláról, a gyakornoki programok száma évről évre 20%-kal nő.","kulcsszavak":["diákmunka","Mind-Diák","bérek","AI"],"het":"2026-05-25","id":"ART-0283","url_forras":"docx"},{"cim":"Kiszámolták: ennyien térhetnek át a kata-adózásra 2027-ben","url":"https://24.hu/belfold/2026/06/05/kata-adozas-vallalkozo-tisza-kormany/","forras":"24.hu","datum":"2026-06-05","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A GKI szerint a 2027-re tervezett kata-kibővítés 300-350 ezer vállalkozót érinthet; visszaáll a cégeknek való számlázás lehetősége, de garanciák kerülnek be a bújtatott foglalkoztatás kizárására.","kulcsszavak":["adózás","kutatás és statisztika","foglalkoztatottság"],"het":"2026-06-01","id":"ART-0284","url_forras":"docx","kivonat":"A GKI Gazdaságkutató elemzése szerint a 2027-re tervezett kata-kibővítés mintegy 300-350 ezer vállalkozót érinthet, és 250-270 ezer kisadózó térhet át az adózási formára. A tervek szerint visszaáll a cégeknek való számlázás lehetősége, megmarad az egyszerű adminisztráció, de garanciák is bekerülnek a bújtatott foglalkoztatás kizárására – amely a 2022-es szigorítás fő indoka volt, bár az adóhivatal utóbb mindössze 9 milliárd forintnyi visszaélést tárt fel. A kata fénykorában 444 ezer vállalkozót érintett és közel 200 milliárd forint bevételt hozott, a szigorítás után a számuk 145 ezerre csökkent. A GKI figyelmeztet: ha az új szabályozás nem tartalmaz elég erős garanciákat, a vállalatok foglalkoztatási gyakorlata ismét alkalmazkodhat – leginkább a logisztikai, kereskedelmi és gyártószektorban."},{"cim":"Elfogyhat a munkaerő Magyarországon? A számok sokkoló képet mutatnak","url":"https://www.hrportal.hu/hr/elfogyhat-a-munkaero-magyarorszagon-a-szamok-sokkolo-kepet-mutatnak-20260602.html","forras":"HR Portál","datum":"2026-06-02","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Az Oeconomus szerint Magyarország rekordberuházásokkal és súlyos munkaerőhiánnyal néz szembe egyszerre; 100 ezer betöltetlen álláshely van, és 2050-re a munkaképes népesség egymillió fővel csökkenhet.","kulcsszavak":["kutatás és statisztika","munkaerőhiány","beruházás","demográfia"],"het":"2026-06-01","id":"ART-0285","url_forras":"docx","kivonat":"Az Oeconomus elemzése szerint Magyarország egyszerre néz szembe rekordberuházásokkal és súlyos munkaerőhiánnyal: 2025-ben közel 7 milliárd euró FDI érkezett, miközben 100 ezer betöltetlen álláshely van, és 2050-re a munkaképes korú népesség közel egymillió fővel csökkenhet. A hiány különösen az IT, mérnöki és egészségügyi területeken éles, miközben 540 ezer magyar állampolgár él külföldön. Magyarország rendelkezik vonzó adottságokkal – 15 százalékos szja, kedvező megélhetési költségek, jó infrastruktúra –, de ezeket nem kommunikálja elég hatékonyan. A megoldást a hazai képzés fejlesztése és a külföldi szakemberek célzott bevonzása együttesen jelentheti – ahogy azt Észtország, Portugália és Lengyelország példája mutatja."},{"cim":"Napokon belül óriási fordulat jön a magyarországi fizetéseknél: élesedik az új jogszabály, csúnya vége is lehet","url":"https://www.penzcentrum.hu/karrier/20260604/napokon-belul-oriasi-fordulat-jon-a-magyarorszagi-fizeteseknel-elesedik-az-uj-jogszabaly-csunya-vege-is-lehet-1199654","forras":"Pénzcentrum","datum":"2026-06-04","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Egy kutatás szerint a 100 főnél nagyobb magyar cégek 78%-a elbukna az EU bértranszparencia-irányelvének tesztjén; a bérkülönbségek kiegyenlítése 600-650 milliárd forintos éves többletköltséget jelenthet.","kulcsszavak":["bértranszparencia","nők a munkaerőpiacon","adózás"],"het":"2026-06-01","id":"ART-0286","url_forras":"docx","kivonat":"Boza István és Ilyés Virág közgazdászok kutatása szerint a 100 főnél nagyobb magyar cégek 78 százaléka elbukna az EU bértranszparencia-irányelvének tesztjén – a nők átlagbére az 5 százalékos küszöbértéknél jóval nagyobb mértékben marad el a férfiakétól. Ha a vállalatoknak ki kell egyenlíteniük a bérkülönbségeket, az 600-650 milliárd forintos éves többletköltséget jelenthet, amelyet végül valószínűleg az áremelkedésen keresztül a fogyasztók fizetnek meg. A kutatás rávilágít a „kis csapatok átka” jelenségre: 2-10 fős csoportokban a dolgozók 76 százaléka olyan csapatban van, ahol egyetlen kiemelkedő béresű kolléga is statisztikailag bérszakadékot okoz. Az irányelvet a még mindig hiányzó magyar jogszabálynak kellene átültetni."},{"cim":"Nem a robotoktól kell félni, hanem a változásra való képtelenségtől","url":"https://autopro.hu/hr/nem-a-robotoktol-kell-felni-hanem-a-valtozasra-valo-keptelensegtol/1619552","forras":"Autopro","datum":"2026-05-31","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint az AI-forradalom nyertesei a leggyorsabban tanulók lesznek; az automatizáció sok esetben nem munkahelyeket vesz el, hanem betöltetlen pozíciókat tölt be.","kulcsszavak":["Trenkwalder","automatizáció","képzés"],"het":"2026-05-25","id":"ART-0287","url_forras":"talalt","kivonat":"Az INTEGRATOR FM podcast újabb epizódjában Nógrádi József, a Trenkwalder stratégiai igazgatója és Barta Balázs, a Pannon Business Network ügyvezetője arról beszéltek, hogy az AI-forradalom nyertesei nem a változástól félők, hanem a leggyorsabban tanulók lesznek. A szakértők szerint az automatizáció sok esetben nem munkahelyeket vesz el, hanem betöltetlen pozíciókat tölt be – jó példa a közúti fuvarozás, ahol Európában több százezer sofőr hiányzik. A jövő versenye az oktatásban dől el: a kreatív gondolkodás, a problémamegoldás és az élethosszig tartó tanulás felértékelődik, miközben a lexikális tudás gyorsan avul."},{"cim":"Az MI korszakában az emberi készségek jelentik a valódi versenyelőnyt","url":"https://profitline.hu/az-mi-korszakaban-az-emberi-keszsegek-jelentik-a-valodi-versenyelonyt-487382","forras":"Profitline","datum":"2026-05-31","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Az IWG kutatása szerint a HR-vezetők 90%-a úgy véli, az emberi készségek háttérbe szorítása visszafoghatja az innovációt; a Randstad adatai szerint 2024-2025 között 29%-kal csökkent a pályakezdő állások száma.","kulcsszavak":["Randstad","rugalmas foglalkoztatás","skills-alapú HR","pályakezdők"],"het":"2026-05-25","id":"ART-0288","url_forras":"talalt","kivonat":"Az International Workplace Group (IWG) kutatása szerint a HR-vezetők 90 százaléka úgy véli, hogy az emberi készségek háttérbe szorítása visszafoghatja az innovációt – az empátia, a komplex döntéshozatal és a vezetői kompetenciák nem helyettesíthetők mesterséges intelligenciával. A toborzásban is fordul a kocka: a munkáltatók kétharmada a kiválasztásnál az emberi készségeket helyezi előtérbe a munkatapasztalattal és a technikai tudással szemben. A Randstad adatai szerint 2024 és 2025 között 29 százalékkal csökkent a pályakezdő állások száma – ebben a környezetben a Z-generáció digitális előnye önmagában már nem elegendő, a valódi versenyelőnyt az AI hatékony alkalmazásának képessége jelenti."},{"cim":"Mihamarabb munkába kell állnia annak a diáknak, aki szeptemberben saját albérletbe szeretne költözni – akár 800 ezer forintos kaucióval is indulhat a tanév","url":"https://profitline.hu/mihamarabb-munkaba-kell-allnia-annak-a-diaknak-aki-szeptemberben-sajat-alberletbe-szeretne-koltozni-akar-800-ezer-forintos-kaucioval-is-indulhat-a-tanev-487486","forras":"Profitline","datum":"2026-06-03","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC körképe szerint a diákmunkásokat a lakhatási piac realitása motiválja: egy budapesti albérlet belépési költsége 800 ezer forint is lehet, amelynek összegyűjtéséhez 324 munkaóra szükséges 2500 forintos órabérrel.","kulcsszavak":["WHC","diákmunka"],"het":"2026-06-01","id":"ART-0289","url_forras":"talalt","kivonat":"A WHC Csoport körképe szerint a 2026-os nyári diákmunkaszezonban a hallgatókat már nem csupán a zsebpénz, hanem a lakhatási piac kőkemény realitása motiválja. Budapesten egy albérlet belépési költsége – kéthavi kaució plusz egyhavi bérleti díj – akár 800 ezer forint is lehet, amelynek összegyűjtéséhez az átlagos 2500 forintos órabérrel számolva 324 munkaóra szükséges. Margitics Ákos, a WHC szövetkezeti-szolgáltatás üzletágának vezetője szerint vidéki egyetemi városokban havi 50-60 órányi munkával reálisan megteremthető a lakhatás alapja, Budapesten azonban feszített tempó kell. A legnagyobb kereslet a turizmusban és a kereskedelemben várható, de a logisztika, a gyógyszeripar és az autóipar is egyre inkább nyit a diákok felé."},{"cim":"A magyar gazdasági modell kifulladt, a poroszos oktatást pedig le kell cserélni","url":"https://www.portfolio.hu/gazdasag/20260610/a-magyar-gazdasagi-modell-kifulladt-a-poroszos-oktatast-pedig-le-kell-cserelni-842348","forras":"Portfolio","datum":"2026-06-10","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Zakor Sándor, a Prohuman Group vezetője szerint Magyarország kinőtte az összeszerelő üzem modellt, mert nincs megfelelő minőségű munkaerő; a poroszos iskolarendszert nem javítani, hanem kicserélni kellene.","kulcsszavak":["képzés","gazdasági kilátások"],"het":"2026-06-08","id":"ART-0290","url_forras":"docx","kivonat":"Zakor Sándor, a Prohuman Group vezetője a Portfoliónak adott nagyinterjúban elmondta: Magyarország kinőtte az összeszerelő üzem gazdasági modellt – nem azért, mert rossz volt, hanem mert nincs megfelelő minőségű munkaerő a folytatáshoz. A legnagyobb hibának az elmúlt 16 év oktatás- és felnőttképzés-elhanyagolását tartja: a poroszos iskolarendszert nem javítani, hanem kicserélni kellene, akár ezer iskola bezárásával, és Magyarország EU-utolsó a felnőttkori tanulási hajlandóságban. A vendégmunkás-stop kapcsán hangsúlyozza: a legálisan foglalkoztatott harmadik országbeliek aránya mindössze 2%, és az átmeneti szigorítást elsősorban a KKV-szektor szenvedi meg, nem a nagyberuházók. A Prohumant a változás nem érinti létfontosságúan – 8 országban működnek, bevételük több mint fele külföldről érkezik. A tervezett vagyonadót populista eszköznek tartja, amely éppen azokat bünteti, akik itthon fejlesztenek, miközben a NER valódi kedvezményezettjei valószínűleg nem fizetik majd meg."},{"cim":"Riasztó előrejelzés: hamarosan negyedmillió dolgozó hiányozhat a magyar gazdaságból","url":"https://www.economx.hu/gazdasag/2026/06/10/europa-munkaeropiac-demografia-versenykepesseg-konferencia-munkaerokolcsonzes/","forras":"Economx","datum":"2026-06-10","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman Verseny. Képesség. Business Summit konferenciáján Zakor Sándor figyelmeztetett: évente 50 ezerrel csökken a hazai munkavállalók száma, ami 4-5 éves távlatban negyedmilliós hiányt jelent.","kulcsszavak":["munkaerőhiány","demográfia"],"het":"2026-06-08","id":"ART-0291","url_forras":"docx","kivonat":"A Prohuman által szervezett Verseny. Képesség. Business Summit konferencián Zakor Sándor, a Prohuman igazgatótanácsának elnöke figyelmeztetett: évente 50 ezerrel csökken a hazai munkavállalók száma, ami 4-5 éves távlatban negyedmilliós hiányt jelent. Nagy Elek, az MKIK elnöke szerint Magyarország a közepes jövedelmű csapdában van – kinőtte az olcsó munkaerőre épülő modellt, de még nem lépett át az innovációvezérelt gazdaságra, miközben csak minden tizedik országnak sikerül ebből kitörni. Aggasztó adat, hogy Magyarország az EU utolsó helyén áll az AI munkahelyi használatában: 1,3% alkalmazza, szemben a 15,5%-os uniós átlaggal. Dani Rodrik, a Harvard közgazdásza szerint az AI-t úgy kell szolgálatba állítani, hogy új munkahelyeket teremtsen – és a jövőben inkább szakképzett, mint diplomás emberekre lesz szükség, az AI pedig tudáselosztó szerepet tölthet be az alacsonyabban képzett munkavállalók felemelésében."},{"cim":"Jó oktatás nélkül a digitalizáció nagyobb veszély, mint amekkora lehetőség – figyelmeztet a szakképzési államtitkár","url":"https://hvg.hu/gazdasag/20260610_szakkepzes-digitalizacio-oktatas-iskola-kepzes-tanulas-konferencia","forras":"HVG","datum":"2026-06-10","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman, az MKIK és a Joint Venture Szövetség közös rendezvényén a szakképzési államtitkár figyelmeztetett: ha az oktatás alapjai nem elég erősek, a digitalizáció nagyobb veszély lehet, mint lehetőség.","kulcsszavak":["képzés","automatizáció"],"het":"2026-06-08","id":"ART-0292","url_forras":"docx","kivonat":"A Prohuman, az MKIK és a Joint Venture Szövetség közös versenyképességi rendezvényén Naderi Zsuzsanna szakképzési és felnőttképzési államtitkár figyelmeztetett: ha az oktatás alapjai nem elég erősek, a digitalizáció nagyobb veszély lehet, mint amekkora lehetőség, mivel tovább mélyítheti a képességbeli hiányokat. Az alapkompetenciákat – kritikus gondolkodás, együttműködés – már a közoktatásban kell lerakni, de a munkaerőpiacon lévő felnőtteknek is el kell sajátítaniuk ezeket. A külföldi munkáltatók szemszögéből Jörg Dötsch, a Német–Magyar Tudásközpont ügyvezetője a fiatalok gyenge alapkészségeit emelte ki, Pető Ernő, a ChinaCham elnöke a Z-generáció túlóraellenességét jelezte kínai cégek részéről."},{"cim":"Leállítja a Master Good a 120 milliárdos gyárépítését, ha nem tud külföldről munkaerőt behozni","url":"https://hvg.hu/gazdasag/20260610_master-good-gyarepites-munka-vendegmunkas-konferencia","forras":"HVG","datum":"2026-06-10","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Master Good ügyvezető igazgatója a Prohuman, az MKIK és a Joint Venture Szövetség rendezvényén leszögezte: ha nem lehet külföldről munkaerőt behozni, a cég leállítja 120 milliárdos gyárberuházását.","kulcsszavak":["agrárium","vendégmunka","beruházás"],"het":"2026-06-08","id":"ART-0293","url_forras":"docx","kivonat":"Ifj. Bárány László, a Master Good Csoport ügyvezető igazgatója a Prohuman, az MKIK és a Joint Venture Szövetség közös rendezvényén leszögezte: ha nem lehet külföldről munkaerőt behozni, a cég leállítja 120 milliárdos gyárberuházását – és termelését is csökkenti. Mint mondta, a külföldi munkaerő nem olcsóbb, egyszerűen nincs elég magyar, aki nehéz fizikai munkát vállalna. Bozsonyi Károly adattudós demográfiai képe is aggasztó: amint az 1970-es évjáratok nyugdíjba mennek, a foglalkoztatottság megbillen, és az Y és Z generációk kisebb létszáma ezt nem tudja kompenzálni. A megoldást a késői nyugdíjba vonulás ösztönzése, az egészségügy javítása és a termelékenység növelése adhatja – ez utóbbiban különösen rossz a helyzet: Magyarország EU-utolsó a munkavállalók továbbképzési hajlandóságában, és az AI munkahelyi használatában is sereghajtó, miközben hétköznapi alkalmazásban közel van az uniós átlaghoz."},{"cim":"Nagy fordulat jön a munkaerőpiacon: Dani Rodrik szerint teljesen átalakul a dolgozók élete","url":"https://www.portfolio.hu/uzlet/20260610/nagy-fordulat-jon-a-munkaeropiacon-dani-rodrik-szerint-teljesen-atalakul-a-dolgozok-elete-842396","forras":"Portfolio","datum":"2026-06-10","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Dani Rodrik harvardi közgazdász a Prohuman és MKIK közös konferenciáján kifejtette: a jövő munkahelyei a szolgáltató szektorban jönnek létre, az AI-t a dolgozók képességeinek bővítésére kellene használni.","kulcsszavak":["kutatás és statisztika","foglalkoztatottság","AI"],"het":"2026-06-08","id":"ART-0294","url_forras":"docx","kivonat":"Dani Rodrik harvardi közgazdász a Prohuman és MKIK közös konferenciáján kifejtette: a gazdaságpolitika fő feladata a méltóságot és biztonságot nyújtó munkahelyek megteremtése – a munka elvesztése nemcsak anyagi, hanem súlyos társadalmi következményekkel jár. Európának sem az amerikai, sem a kínai modellt nem szabad másolnia, hanem saját, befogadóbb utat kell találnia. A jövő munkahelyei nem a feldolgozóiparban, hanem a szolgáltató szektorban jönnek létre, ahol alapkészségek és soft skillek számítanak – ezt felülről irányított iparpolitikákkal nem lehet kezelni, alulról építkező, kkv-orientált stratégiákra van szükség. Az AI-t Rodrik szerint nem a munkaerő kiváltására, hanem a dolgozók képességeinek bővítésére kellene használni – megfelelő szabályozással demokratizálhatja a munkaerőpiacot, és az alacsonyabban képzett munkavállalókat is magasabb szintű feladatokra tehetné alkalmassá.\n\nA Verseny.Képesség. Business Summit által generált sajtómegjelenésekről külön monitoring report készül."},{"cim":"Schiffer András: A hatalomváltás tabuja a kizsákmányolás","url":"https://index.hu/velemeny/2026/06/12/schiffer-andras-munkaugyek-munkaerokolcsonzes-hatalomvaltas-kizsakmanyolas-politika-tisza-part-kormany/","forras":"HVG","datum":"2026-06-12","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"Egy véleménycikk szerint az új kormányzati struktúrában nincs önálló munkaügyi felelős; a szerző szerint a kizsákmányolás mint alapvető probléma a kampányban szóba sem került.","kulcsszavak":["foglalkoztatottság","politika","munkakörülmények"],"het":"2026-06-08","id":"ART-0295","url_forras":"docx","kivonat":"A volt parlamenti képviselő véleménycikkében rámutat: az új kormányzati struktúrában nincs önálló munkaügyi felelős – a szociális tárcán belül egyik államtitkár sem kapott foglalkoztatáspolitikai megbízatást. Végigköveti, hogyan számolta fel a NER 2010-től a munkajogi védelmet: a csoportos elbocsátások garanciáitól a rabszolgatörvényen át a kötelező üzemorvosi vizsgálat megszüntetéséig. A Magyar-kormány helyesen állítja vissza a pedagógusok sztrájkjogát és felhagyott a vendégmunkás-importtal – de a túlóratörvény, a közalkalmazotti védelem és a munkáltatói kárfelelősség sorsa nyitott. A szerző szerint a kampányban a kizsákmányolás mint alapvető probléma szóba sem került, és a kormányprogram alapján a munkavállalók nem sokat várhatnak a tőkével szembeni védelemben."},{"cim":"Magyar Péter megszólalt a vendégmunkások ügyében","url":"https://www.portfolio.hu/gazdasag/20260611/magyar-peter-megszolalt-a-vendegmunkasok-ugyeben-842694","forras":"Portfolio","datum":"2026-06-11","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Magyar Péter miniszterelnök szerint a Master Good a 25,5 milliárdos adózott eredményéből finanszírozhatna béremelést a vendégmunkások helyett; a cégvezető szerint nincs elég hazai munkaerő a fejlesztéshez.","kulcsszavak":["politika","agrárium","vendégmunka","bérek"],"het":"2026-06-08","id":"ART-0296","url_forras":"docx","kivonat":"Magyar Péter miniszterelnök élesen reagált arra, hogy a Master Good Csoport 350 milliárdos beruházását a vendégmunkás-szigorítás veszélyeztetheti. A cégvezető, Bárány László szerint a tervezett fejlesztéshez 3000 új dolgozóra lenne szükség, de nincs elegendő hazai munkaerő. Magyar Péter a Portfolio kérdésére ezzel szemben azt vetette fel: a 25,5 milliárd forintos adózott eredményt elérő vállalat a nyereségéből finanszírozhatna béremelést, és több magyar munkavállalót tudna vonzani – különösen, hogy Kelet-Magyarországon sokan nem a munkahelyek hiányát, hanem az alacsony béreket látják problémának. A miniszterelnök emlékeztetett arra is, hogy a cég az elmúlt másfél évtizedben milliárdos közpénztámogatásokat kapott magyar munkahelyek létrehozására."},{"cim":"Vendégmunkásstop: szigorúbb feltételek mellett, de továbbra is érkezhetnek vendégmunkások Magyarországra az új rendelet szerint","url":"https://telex.hu/gazdasag/2026/06/05/vendegmunkas-torveny-orszaglista-szigoritas-eltorles-fulop-szigetek","forras":"Telex","datum":"2026-06-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A június 5-i rendelet lezárja a vendégmunkás-tartózkodási engedély csatornáját, de a foglalkoztatási célú engedély lassabb, szigorúbb eljárással megmarad; a már itt tartózkodók maradhatnak.","kulcsszavak":["vendégmunkás-stop","munkajog","vendégmunka"],"het":"2026-06-01","id":"ART-0297","url_forras":"docx","kivonat":"A június 5-i rendelet lezárja a vendégmunkás-tartózkodási engedély csatornáját, de a foglalkoztatási célú engedély – lassabb és szigorúbb eljárással – megmarad. A változás valójában elsősorban a Fülöp-szigetekről érkező, minősített kölcsönzőkön keresztüli tömeges behozatalt érinti. A már itt tartózkodók maradhatnak, a június 5-ig benyújtott kérelmeket a régi szabályok szerint bírálják el. Bogdanovits Péter, az Aarenson Consulting ügyvezetője szerint a foglalkoztatási célú engedély annyira lassú, hogy a legtöbb cégnek nem valós alternatíva – egy másik piaci szereplő ugyanakkor pozitívan értékeli a változást, mert visszaállítja a 2021 előtti, más visegrádi országokban is bevett rendszert."},{"cim":"Ha a Master Good megyéjében nem lehet bevonni a munkaerő-tartalékot, akkor sehol","url":"https://telex.hu/g7/vallalat/2026/06/12/mastergood-vendegmunka-munkaerohiany-toborzasi-nehezsegek","forras":"G7","datum":"2026-06-12","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Master Good telephelyein a munkanélküliség 8%, jóval az országos átlag felett, de a vendégmunkások aránya is alacsony a régióban; a munkaerő-tartalék bevonása állami támogatás nélkül aligha sikerülhet.","kulcsszavak":["agrárium","munkaerő-tartalék","munkanélküliség"],"het":"2026-06-08","id":"ART-0298","url_forras":"docx","kivonat":"A Telex elemzése árnyalja a Master Good és Magyar Péter vitáját a vendégmunkásokról. A cég telephelyei főként Szabolcs-Szatmár-Beregben vannak, ahol a munkanélküliség 8 százalék – jóval az országos 4,7 százalékos átlag felett. Ugyanakkor a magas munkaerő-tartalékhoz kevés üres álláshely párosul a régióban, és a vendégmunkások aránya éppen itt az egyik legalacsonyabb az országban. A Master Good fizikai munkásaira jutó bérköltség havi 507 ezer forint volt 2025-ben, ami nagyjából 300 ezres nettónak felel meg – a megyei bruttó átlag 523 ezer. Magyar Péter 22 milliárdos állami támogatásra és 25,5 milliárdos adózott eredményre hivatkozott, de a cikk megjegyzi: a munkaerő-tartalék bevonása állami támogatás nélkül aligha sikerülhet, és rendszerszinten nem látható, hogy a vendégmunkások elvennék a magyarok elől a lehetőséget."},{"cim":"Súlyos terhek – ezért nem jutnak előrébb a nők a munka világában","url":"https://infostart.hu/gazdasag/2026/06/07/sulyos-terhek-ezert-nem-jutnak-elorebb-a-nok-a-munka-vilagaban","forras":"InfoStart","datum":"2026-06-07","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az Oeconomus szerint az 50 év feletti nők munkaerőpiaci helyzete nehéz: alacsonyabb bérű segítő szakmákban dolgoznak, és a „szendvicsgeneráció” jelensége miatt egyszerre gondoskodnak gyermekeikről és idős szüleikről.","kulcsszavak":["kutatás és statisztika","nők a munkaerőpiacon","idősebb munkavállalók","képzés"],"het":"2026-06-01","id":"ART-0299","url_forras":"docx","kivonat":"Szegedi Andrea, az Oeconomus Gazdaságkutató Alapítvány vezető kutatója szerint az 50 év feletti nők munkaerőpiaci helyzete több egymást erősítő tényező miatt nehéz. Bár a nők körében magasabb a diplomások aránya, alacsonyabb keresetű segítő szakmákban – ápolás, oktatás, szociális gondozás – helyezkednek el, a magasabb bérű STEM-területeken alulreprezentáltak. A munkaerőpiacról a nők már 60 éves kortól kivonulnak – szemben a férfiak 65 éves csúcsával –, amit a krónikus fáradtság és a rosszabbnak ítélt szubjektív egészségi állapot is magyaráz. Ehhez járul a „szendvicsgeneráció” jelensége: az 50-es éveikben járó nők egyszerre gondoskodnak még nem teljesen önálló gyermekeikről és már idős szüleikről."},{"cim":"Nő a bérnyomás, fogy a munkaerő: Gazsi Attila VOSZ-elnök a legnagyobb HR-kihívásokról","url":"https://www.hrportal.hu/hr/no-a-bernyomas-fogy-a-munkaero-gazsi-attila-vosz-elnok-a-legnagyobb-hr-kihivasokrol-20260612.html","forras":"HR Portál","datum":"2026-06-12","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Gazsi Attila, a VOSZ elnöke szerint a kkv-k legnagyobb HR-kihívása a munkaerő mennyisége és minősége; a vendégmunkás-stopot szakmailag elhibázottnak tartja, célzott szigorítást javasolt volna helyette.","kulcsszavak":["munkáltatói szövetség","bérek","munkaerőhiány"],"het":"2026-06-08","id":"ART-0300","url_forras":"docx","kivonat":"Gazsi Attila, a VOSZ újonnan megválasztott elnöke szerint a magyar kkv-k legnagyobb HR-kihívása a munkaerő mennyisége és minősége egyszerre – évente 40 ezerrel többen esnek ki a munkaerőpiacból, mint ahányan belépnek, miközben a bérek gyorsabban nőnek, mint a termelékenység. A vendégmunkás-stopot szakmailag elhibázottnak tartja: nem a jogszerű, ellenőrzött csatornákat kellett volna leállítani, hanem célzott szigorítással rendet tenni. A belső tartalékok – kismamák, nyugdíjasok, inaktívak, külföldön dolgozó magyarok – mozgósítása elengedhetetlen, de ez nem gombnyomásra megy. Az AI és digitalizáció kapcsán hangsúlyozza: a VOSZ feladata nem az, hogy „használjatok mesterséges intelligenciát” üzenetet közvetítsen, hanem hogy konkrét, napi szintű kkv-alkalmazásokat mutasson be."},{"cim":"A magyar cégek harmadánál terveznek sok új dolgozót felvenni, az autóipar lehet a vesztes","url":"https://hvg.hu/gazdasag/20260609_cegek-manpower-munka-dolgozok-felvetel","forras":"HVG","datum":"2026-06-09","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Manpower előrejelzése szerint a cégek 33%-a tervez létszámbővítést a harmadik negyedévben, 18%-a csökkentést; az autóiparban a leépítést tervezők aránya 22 százalékponttal meghaladja a bővítőkét.","kulcsszavak":["Manpower","foglalkoztatottság","autóipar"],"het":"2026-06-08","id":"ART-0301","url_forras":"docx","kivonat":"A Manpower Magyarország legfrissebb Munkaerőpiaci Előrejelzése szerint a cégek 33 százaléka tervez létszámbővítést, 18 százalékuk csökkentést a harmadik negyedévben – a különbség egy év alatt 10-ről 15 százalékpontra nőtt, ami óvatosan javuló hangulatot jelez. Kivétel az autóipar, ahol 22 százalékponttal haladja meg a leépítést tervezők aránya a bővítőkét. A legjobb kilátások a közművek, a pénzügy és az építőipar területén vannak. A létszámcsökkentést tervezők harmada nem elbocsát, hanem a megüresedett pozíciókat nem tölti fel – ez a munkaerőpiac lassú természetes zsugorodását jelzi."},{"cim":"Húszezer új munkahely jöhet Debrecenben, de hol fognak lakni az emberek?","url":"https://www.portfolio.hu/gazdasag/20260609/huszezer-uj-munkahely-johet-debrecenben-de-hol-fognak-lakni-az-emberek-842184","forras":"Portfolio","datum":"2026-06-09","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Debrecen Economic Forumon elhangzott: 2015 óta 12 milliárd euró tőkeberuházás érkezett, 20 ezer új munkahelyet bejelentve; az ingatlanárak 2019 óta 120%-kal nőttek a munkaerő-beáramlás miatt.","kulcsszavak":["beruházás"],"het":"2026-06-08","id":"ART-0302","url_forras":"docx","kivonat":"A Debrecen Economic Forumon elhangzott: 2015 óta több mint 12 milliárd eurónyi tőkeberuházás érkezett a városba, több mint 20 ezer új munkahelyet bejelentve, amelyből mintegy 10 ezret már betöltöttek. A hirtelen munkaerő-beáramlás drasztikusan megdrágította az ingatlanpiacot – 2019 óta 120 százalékkal nőttek az árak, a panellakások négyzetméterára is meghaladja az egymillió forintot. Az önkormányzat a Főnix Lakásprogrammal és fejlesztési területek kínálatával próbálja fékezni az áremelkedést, a magánszektor pedig az agglomeráció felé terjeszkedik – apartmanházakkal és tipizált családi házakkal Hajdúböszörménytől Létavértesig. A projektfinanszírozást nehezíti a 7-8 százalékos kamatkörnyezet, amelyen belül a bérlakás-fejlesztések megtérülési ideje elérheti a 20-30 évet is."},{"cim":"Kiderült, mekkora béremelést terveznek a cégek 2026-ra","url":"https://www.hrportal.hu/c/kiderult-mekkora-beremelest-terveznek-a-cegek-2026ra-20260612.html","forras":"HR Portál","datum":"2026-06-12","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A K&H kkv bizalmi indexe szerint a cégvezetők átlagosan 5%-os béremelést terveznek 2026-ra, ami 2021 óta a legalacsonyabb szint; a cégek 80%-a nem tervez létszámváltozást.","kulcsszavak":["bérek","gazdasági kilátások","adózás"],"het":"2026-06-08","id":"ART-0303","url_forras":"docx","kivonat":"A K&H Bank kkv bizalmi indexe szerint a cégvezetők átlagosan 5 százalékos béremelést terveznek 2026-ra – ez 2021 óta nem látott alacsony szint. A megkérdezett 400 kkv döntéshozójának 80 százaléka nem tervez létszámváltozást, 13 százalék mérsékelt, 1-4 fős bővítést jelez. A cégek 34 százaléka tervez béren kívüli juttatást, a legnépszerűbbek a 13. havi fizetés, a prémium és a SZÉP-kártya. Összességében kivárás és fokozott óvatosság jellemzi a munkaerőpiaci tervezést – mind a bérek, mind a juttatások terén mérséklődés várható."},{"cim":"Leépítés jön egy német autóipari cég magyarországi vállalatánál: rengeteg dolgozó kerülhet az utcára","url":"https://www.penzcentrum.hu/karrier/20260610/leepites-jon-egy-nemet-autoipari-ceg-magyarorszagi-vallalatanal-rengeteg-dolgozo-kerulhet-az-utcara-1200250","forras":"Pénzcentrum","datum":"2026-06-10","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A thyssenkrupp Automotive Technology mintegy 200 fejlesztési pozíciót szüntet meg Magyarországon, miközben Budapesten 60 új állást hoz létre; a nettó leépítés 140 fő körüli.","kulcsszavak":["autóipar","leépítés"],"het":"2026-06-08","id":"ART-0304","url_forras":"talalt","kivonat":"A thyssenkrupp Automotive Technology mintegy 200 fejlesztési pozíciót szüntet meg magyarországi működésében, miközben Budapesten 60 új üzlettámogatási állást hoz létre – a nettó leépítés tehát 140 fő körüli. A vállalat debreceni telephelyén emellett új Teszt Kompetencia Központ létrehozását tervezi. Az átszervezést a változó ügyféligények, az ingadozó kereslet és a tartós költségnyomás indokolja – a cég jelenleg mintegy 3000 munkavállalót foglalkoztat Magyarországon."},{"cim":"Lassítja, de nem fékezi meg a vendégmunkások foglalkoztatását a kormányzati szigorítás, mondta egy szakértő","url":null,"forras":"RTL","datum":"2026-06-06","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder kereskedelmi igazgatója szerint a leállított gyorsított eljárás háromról fél évre növeli az ügyintézési időt; a filippínó, örmény és grúz munkavállalók más jogcímen továbbra is érkezhetnek.","kulcsszavak":["Trenkwalder","vendégmunka","munkajog"],"het":"2026-06-01","id":"ART-0305","kivonat":"Az RTL Híradó riportja szerint a június 5-én megjelent kormányrendelet lassítja, de nem állítja meg az EU-n kívüli munkavállalók magyarországi foglalkoztatását. Nógrádi József, a Trenkwalder kereskedelmi igazgatója rámutatott: a most leállított gyorsított eljárás háromról fél évre növeli az ügyintézési időt, ami hátrányosan érintheti a beruházási kedvet. A riport szerint a vendégmunkás-tartózkodási engedély megszűnésével érintett filippínó, örmény és grúz munkavállalók más jogcímen – például foglalkoztatási célú tartózkodási engedéllyel – továbbra is érkezhetnek, hosszabb ügyintézés után. A KSH adatai szerint jelenleg 100 dolgozóból mindössze 2 vendégmunkás, ami lényegesen alacsonyabb a többi visegrádi országénál."},{"cim":"Továbbra is érkezhetnek vendégmunkások Magyarországra, csak nem mindegy, hogy honnan?","url":"https://www.youtube.com/watch?v=4XekqnIE1DE","forras":"ATV","datum":"2026-06-10","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József szerint a legellenőrzöttebb csatorna zárult le, a cégek nem a magyar munkaerőhöz fordulnak, hanem automatizálnak; évente 30-40 ezer magyar hagyja el az országot.","kulcsszavak":["Trenkwalder","automatizáció","demográfia"],"het":"2026-06-08","id":"ART-0306","url_forras":"docx","kivonat":"Nógrádi József, a Trenkwalder stratégiai igazgatója az ATV Start műsorában rámutatott: a vendégmunkás-tartózkodási engedély megszüntetése a legellenőrzöttebb csatornát zárta le, a „kiskapus” megoldások megmaradtak. A Fülöp-szigetekről, Örményországból és Grúziából érkezők száma összesen 10-15 ezer fő volt, a teljes piac töredéke, de a feldolgozóiparban, a vendéglátásban és az agráriumban kulcsszerepet töltöttek be. A gyorsított eljárás megszűnésével az ügyintézési idő háromról hat hónapra nő, amire termelést nem lehet tervezni – ez beruházásokat riaszthat el. Nógrádi szerint a cégek nem visszafordulnak a magyar munkaerőhöz, hanem automatizálnak, ami paradox módon nem béremelést, hanem munkahelyek eltűnését hozhatja. Évente 30-40 ezer magyar hagyja el az országot, miközben Magyarországon mindössze 60 ezer nyitott pozíció van."},{"cim":"Szigorít a kormány a vendégmunkások ügyében, alternatív intézkedéseket hozhatnak a cégek","url":"https://dehir.hu/debrecen/szigorit-a-kormany-a-vendegmunkasok-ugyeben-alternativ-intezkedeseket-hozhatnak-a-cegek/2026/06/08/","forras":"Dehir","datum":"2026-06-08","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József szerint a cégek a vendégmunkások kiesésére nem béremeléssel, hanem termeléscsökkentéssel vagy automatizálással reagálnak; az éves kvóta 35 ezer fő volt, a piac egy százaléka.","kulcsszavak":["Trenkwalder","munkajog","automatizáció"],"het":"2026-06-08","id":"ART-0307","url_forras":"docx","kivonat":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint a vendégmunkások kiesésére a cégek nem béremelésssel, hanem termeléscsökkentéssel, automatizálással vagy akár kivonulással reagálnak. Vendégmunkás csak akkor alkalmazható, ha az adott pozíciót előzetesen magyaroknak is meghirdették, és nem kereshet kevesebbet a hazai kollégáinál. Az éves kvóta 35 ezer fő volt – a 4,7 milliós piac egy százaléka –, Miklóssy Ferenc, a Debreceni Kereskedelmi és Iparkamara elnöke szerint azonban rövid távon mozgósítható hazai tartalék nincs, és a kiesés a termelés és az export visszaesését is hozhatja. A BMW debreceni gyárának vezére jelezte: a Neue Klasse modellek gyártásával a jövőben is szükség lehet külföldi szakemberekre."},{"cim":"Most tényleg megtudhatjuk, mennyit keres a mellettünk ülő kollégánk?","url":"https://www.portfolio.hu/uzlet/20260610/most-tenyleg-megtudhatjuk-mennyit-keres-a-mellettunk-ulo-kollegank-842382","forras":"Portfolio","datum":"2026-06-10","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Médli Katalin, a Trenkwalder Cégcsoport HR managere szerint a bértranszparencia valódi kihívása, hogy a vállalatok képesek-e következetesen megmagyarázni saját bérdöntéseiket.","kulcsszavak":["Trenkwalder","bértranszparencia","munkáltatói márka"],"het":"2026-06-08","id":"ART-0308","url_forras":"docx","kivonat":"Médli Katalin, a Trenkwalder Cégcsoport HR managere szerint a bértranszparencia valódi kihívása nem a kötelező bérsávok vagy az álláshirdetésekben megjelenő fizetések kérdése, hanem az, hogy a vállalatok képesek-e következetesen megmagyarázni saját bérdöntéseiket. Tapasztalata szerint sok szervezet azért bizonytalan, mert maga sem tudja egyértelműen megindokolni, miért alakultak ki a jelenlegi bérviszonyok. Az irányelv nem a bérek teljes nyilvánosságát írja elő, hanem azt, hogy a munkavállalók megismerhessék a bérezési döntések mögötti elveket. Médli szerint a bértranszparencia végső soron nem HR-, hanem szervezetfejlesztési és kulturális kérdés: azok a cégek lesznek előnyben, amelyek már most felülvizsgálják munkaköreiket, teljesítményértékelési rendszerüket és döntéshozatali mechanizmusaikat."},{"cim":"A vendégmunkás nem olcsóbb, a hazai tartalékok mozgósítása kétséges – újabb ágazatok tiltakoznak","url":"https://magyarnemzet.hu/gazdasag/2026/06/munkaerohiany-nem-oldhato-meg-egyetlen-forrasbol","forras":"Magyar Nemzet","datum":"2026-06-12","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Kiss Nikolett, a WHC régióvezetője szerint a külföldi munkaerő nem olcsóbb a hazainál; a tejfeldolgozó iparban a külföldi munkavállalók tartósan hiányszakmának minősülő pozíciókat töltenek be.","kulcsszavak":["WHC","vendégmunka","agrárium"],"het":"2026-06-08","id":"ART-0309","kivonat":"Egy szakmai kerekasztalon és a Tej Terméktanács jelzésein keresztül egyre több ágazat fejezi ki aggodalmát a vendégmunkás-szigorítás miatt. Kiss Nikolett, a WHC Csoport régióvezetője szerint a külföldi munkaerő nem olcsóbb a hazainál, sőt, a vállalatok döntése mögött a megfelelő létszám biztosításának kényszere áll. A „több százezres hazai tartalék” gyors mozgósítása nem reális: az érintettek jelentős része egészségügyi, szociális vagy földrajzi okokból nem bevonható. A tejfeldolgozó iparban a külföldi munkavállalók tartósan hiányszakmának minősülő pozíciókat töltenek be – tapasztalt, stabil munkaerőt jelentenek, akiket pótolni nem lehet. Kiss Nikolett szerint a megoldás nem az „vagy-vagy”, hanem a diákok, nyugdíjasok, kisgyermekes szülők, külföldi diákok és vendégmunkások egymást kiegészítő foglalkoztatása.","url_forras":"docx"},{"cim":"Industry Talks: Szakértői kerekasztalok az Ipari HR konferencián","url":"https://hrpwr.hu/cikk/industry-talks-szakertoi-kerekasztalok-az-ipari-hr-konferencian","forras":"HRPWR","datum":"2026-06-10","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A HRPOWER és a GyártásTrend Ipari HR Konferenciáján Schneider Bálint, a Work Force ügyvezető igazgatója a generációk közötti együttműködésről szóló kerekasztalnál képviseli a munkaerőpiaci trendek témáját.","kulcsszavak":["Work Force","pályakezdők"],"het":"2026-06-08","id":"ART-0310","url_forras":"docx","kivonat":"A HRPOWER és a GyártásTrend június 17-én rendezi meg közös Ipari HR Konferenciáját, amelyen négy kerekasztal-beszélgetés foglalkozik a gyártóipar legégetőbb HR-kihívásaival. A Z-generáció bevonzása és megtartása, a bértranszparencia jogi és szervezeti kihívásai, a vállalati AI-transzformáció HR-szerepe, valamint a generációk közötti együttműködés kerül terítékre – ez utóbbi kerekasztalnál Schneider Bálint, a Work Force ügyvezető igazgatója a munkaerőpiaci folyamatok és foglalkoztatási trendek oldaláról képviseli a témát."},{"cim":"Évi 50 ezerrel kevesebben dolgozunk, és nem biztos, hogy az MI besegít","url":"https://telex.hu/tamogatott-tartalom/2026/06/14/evi-50-ezerrel-kevesebben-dolgozunk-es-nem-biztos-hogy-az-mi-besegit-prohuman","forras":"Telex","datum":"2026-06-14","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman, az MKIK és a JVSZ Business Summitján elhangzott: Magyarország „tökéletes viharba” kerülhet, évente 50 ezerrel csökken az aktív korú népesség, az MI-használatban és felnőttképzésben is EU-utolsók vagyunk.","kulcsszavak":["demográfia","képzés"],"het":"2026-06-08","id":"ART-0311","url_forras":"docx","kivonat":"A Prohuman, az MKIK és a Joint Venture Szövetség versenyképességi Business Summitján egybecsengő üzenet fogalmazódott meg: Magyarország „tökéletes viharba” kerülhet, hiszen évente 50 ezerrel csökken az aktív korú népesség, az MI munkahelyi használatban és a felnőttképzési hajlandóságban is EU-utolsók vagyunk. Dani Rodrik harvardi közgazdász a minőségi munkahelyek megteremtését jelölte meg fő feladatként, Naderi Zsuzsanna szakképzési államtitkár nyilvános stratégiaalkotást ígért. A résztvevők – köztük a BMW képzési vezetője és a Master Good ügyvezető igazgatója – egybehangzóan a kormány, munkáltatók és döntéshozók közötti párbeszéd fontosságát hangsúlyozták: a következő évtized versenyképessége az emberi tőkén múlik."},{"cim":"Eljött a tudásalapú társadalom kora vagy máshogyan kell használni Magyarország rejtett tartalékát?","url":"https://kontroll.hu/cikk/gazdasag/2026/06/17/eljoett-a-tudasalapu-tarsadalom-kora-vagy-mashogyan-kell-hasznalni-magyarorszag-rejtett-tartalekat","forras":"Kontroll","datum":"2026-06-17","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Göndöcs Viktor, a Prohuman vezérigazgatója szerint a hazai munkaerő-tartalék három kategóriára bontható: nyugdíjból visszatérők, külföldön dolgozó magyarok, és alternatív foglalkoztatással bevonhatók.","kulcsszavak":["munkaerő-tartalék","gazdasági kilátások"],"het":"2026-06-15","id":"ART-0312","url_forras":"docx","kivonat":"A Prohuman konferenciáján Dani Rodrik harvardi közgazdász fogalmazta meg az alaptézist: „Nincs munka tudás nélkül és tudás sincs munka nélkül” – a munkaalapú és tudásalapú társadalom tehát nem egymás ellentéte. Göndöcs Viktor, a Prohuman Zrt. vezérigazgatója szerint a hazai munkaerő-tartalék három nagy kategóriára bontható: a nyugdíjból visszatérőkre, a külföldön dolgozó magyarokra, és az alternatív foglalkoztatással bevonhatókra – utóbbiak közé tartoznak az alulképzettek, a részmunkaidőre foghatók, valamint a lakhatási vagy közlekedési problémák miatt kiszorulók. A Prohuman adatbázisaira támaszkodva javaslatokat tesz arra, hogy továbbképzéssel, infrastrukturális fejlesztéssel vagy lakhatási támogatással melyik csoport hogyan vonható be a munkaerőpiacra."},{"cim":"Farkas Bertalan Péter: Veszélyben a magyar versenyképesség, sürgős lépésekre van szükség","url":"https://index.hu/gazdasag/2026/06/17/farkas-bertalan-peter-prohuman-interju-munkaeropiac-versenykepesseg-oktatas-reform/","forras":"Index","datum":"2026-06-17","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Farkas Bertalan Péter, a Prohuman Learning Solutions ügyvezetője szerint Magyarország humántőke-válsággal küzd; a megoldás kulcsa a felnőttképzés reformja, öt oktatási prioritást jelölt meg.","kulcsszavak":["politika","gazdasági kilátások","képzés"],"het":"2026-06-15","id":"ART-0313","url_forras":"docx","kivonat":"Farkas Bertalan Péter, a Prohuman Learning Solutions ügyvezetője szerint Magyarország nem csupán demográfiai, hanem alapvetően humántőke-válsággal küzd – és a megoldás kulcsa nem a közoktatás gyors átalakítása, hanem a felnőttképzés reformja, amely rövid távon is érzékelhető eredményeket hozhat a 4,8 milliós munkavállalói populációban. Öt prioritást jelöl meg az oktatásban: alapkompetenciák fejlesztése, egyéni tanulási utak támogatása, ismeretlen jövőbeli munkaerőpiacra való felkészítés, a tanulás megtanulása, és az iskola mint ökoszisztéma szemlélete. A végzettség helyett egyre a kompetencia válik meghatározóvá – a Prohuman rendszere több ezer kompetenciaelemet képes mérni és adatmodelleken átfuttatni. A képzési paradoxonra – „ha képzed, elmegy” – azt feleli: ma a legnagyobb kockázat nem a fluktuáció, hanem az, ha a cég nem tud lépést tartani a versenytársakkal, mert munkatársai nem fejlődnek."},{"cim":"Kong a vészharang, külön stratégiaalkotó egység jön létre az Oktatási Minisztériumban","url":"https://index.hu/gazdasag/2026/06/15/munkaero-munkaeropiac-munkavallalok-vallalatok-tanulas-oktatas-szakkepzes-felnottkepzes-mkik-naderi-zsuzsanna/","forras":"Index","datum":"2026-06-15","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Business Summit felnőttképzési kerekasztalán Naderi Zsuzsanna államtitkár bejelentette, hogy külön stratégiaalkotó egység jön létre az oktatási minisztériumban, és vizsgálják az egyéni tanulási számla bevezetését.","kulcsszavak":["politika","képzés"],"het":"2026-06-15","id":"ART-0314","url_forras":"docx","kivonat":"Az Index külön cikket írt a Business Summit felnőttképzési kerekasztaláról, ahol Naderi Zsuzsanna államtitkár bejelentette, hogy az Oktatási és Gyermekügyi Minisztériumon belül külön stratégiaalkotó egység jön létre, és vizsgálják az egyéni tanulási számla bevezetését. Pap Máté, az MKIK igazgatója a 18 ezer felnőttképző szervezet széttagoltságát és a minőségi kontroll hiányát nevezte fő problémának – a kamara minősítési rendszert és gyors reagálású, rövid képzéseket sürget. Jörg Dötsch, a Német–Magyar Tudásközpont ügyvezetője szerint az AI csak akkor teremt értéket, ha mögötte erős természetes intelligencia áll – az alapkompetenciák, különösen a szövegértés és az együttműködés romlása komoly figyelmeztetés. Pető Ernő a kínai példán keresztül mutatott irányt: Kínában 31 millióval kevesebb ember dolgozik, mint korábban, mégis nő a termelékenység – ebbe az irányba kell Magyarországnak is elmozdulnia."},{"cim":"Évente egy kisvárosnyi dolgozó tűnik el Magyarországról: csak egyetlen úton kerülhető el a katasztrófa?","url":"https://www.penzcentrum.hu/karrier/20260615/evente-egy-kisvarosnyi-dolgozo-tunik-el-magyarorszagrol-csak-egyetlen-uton-kerulheto-el-a-katasztrofa-1200375","forras":"Pénzcentrum","datum":"2026-06-15","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Humán Versenyképességi Business Summitról szóló beszámoló szerint hat év alatt 200 ezer fővel csökkent Magyarország népessége; Zakor Sándor „tökéletes viharról” beszélt, Nagy Elek a tudásba fektetést jelölte megoldásnak.","kulcsszavak":["demográfia","agrárium"],"het":"2026-06-15","id":"ART-0315","url_forras":"docx","kivonat":"A Pénzcentrum elsősorban a demográfiai vészjelzéseket emelte ki a Humán Versenyképességi Executive Business Summitról: hat év alatt 200 ezer fővel csökkent Magyarország népessége, 2030-ra akár 9 millió alá eshet. Zakor Sándor „tökéletes viharról” beszélt, Nagy Elek szerint egyetlen út van: a tudásba fektetni. A lap részletesen foglalkozott a Master Good ügyvezetőjének bejelentésével – külföldi munkaerő nélkül nem épül meg a 120 milliárdos gyár –, és az ezt követő politikai visszhangggal. A felnőttképzési panelen Naderi Zsuzsanna államtitkár a versenyképesség és a kiegyensúlyozott állampolgári lét kettős célját fogalmazta meg, Pető Ernő a kínai cégek tapasztalatain keresztül mutatta be az átképzés szükségességét, Jörg Dötsch az AI kognitív kockázataira figyelmeztetett. A Prohuman szakértői szerint az ipari robotok megtérülési ideje már másfél-két év, a jövő nyertesei azok lesznek, akik nemcsak használják, hanem értéket is teremtenek a technológiával."},{"cim":"50 ezer dolgozó mínusz minden évben, drámai fordulat jön a munkaerőpiacon","url":"https://index.hu/gazdasag/2026/06/13/munkaeropiac-demografia-demografiai-valsag-foglalkoztatas-tanulas-oktatas-kepzes-felnottkepzes-tudasalapu-gazdasag/","forras":"Index","datum":"2026-06-13","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman–MKIK–JVSZ rendezvényéről szóló cikk szerint évente 50 ezerrel többen hagyják el a munkaerőpiacot, mint ahányan belépnek; Zakor Sándor szerint a „tökéletes vihar” már megérkezett.","kulcsszavak":["foglalkoztatottság","AI"],"het":"2026-06-08","id":"ART-0316","url_forras":"docx","kivonat":"Az Index a Prohuman–MKIK–JVSZ rendezvényéről elsősorban a munkaerőpiaci „tökéletes vihar” metaforáját és a számokat emelte ki: évente 50 ezerrel többen hagyják el a piacot, mint ahányan belépnek, a munkahelyi AI-használatban pedig utolsók vagyunk Európában. Zakor Sándor szerint a vihar már megérkezett és fokozódik – Nagy Elek szerint azonban Magyarország nincs reménytelen helyzetben, a kitörési pont a tudás, ahogy Szingapúr, Tajvan és Dél-Korea példája mutatja. Bozsonyi Károly adattudós az egészségügyet termelőerőként értelmezte: az idősebb generációk bent tartása a munkaerőpiacon egészségügyi befektetés kérdése is. Felidézte, hogy a két világháború között Magyarország a rádiótechnika európai központja volt – az AI hasonló lehetőséget kínál azoknak, akik nemcsak használják, hanem értéket is építenek rá."},{"cim":"Összeomlás helyett megújulás: a humántőke minősége dönti el Magyarország gazdasági jövőjét","url":"https://www.hrportal.hu/hr/osszeomlas-helyett-megujulas-a-humantoke-minosege-donti-el-magyarorszag-gazdasagi-jovojet-20260613.html","forras":"HR Portál","datum":"2026-06-13","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Zakor Sándor, a Prohuman Group vezetője a Business Summiton kiemelte: a következő húsz év kérdése az lesz, hogyan tesszük képessé hatékonyabban dolgozni az embereket, nem az, hogyan találunk elég munkaerőt.","kulcsszavak":["gazdasági kilátások","képzés"],"het":"2026-06-08","id":"ART-0317","url_forras":"docx","kivonat":"Az elmúlt húsz év kérdése az volt, hogyan találunk elég embert – a következő húszé az lesz, hogyan tesszük képessé őket hatékonyabban dolgozni – emelte ki Zakor Sándor, a Prohuman Group vezetője a Verseny. Képesség. Business Summiton. Ugyanitt Naderi Zsuzsanna államtitkár a felnőttképzés teljes újragondolását sürgette, hangsúlyozva, hogy a tanulásnak életfogytig tartó, természetes folyamattá kell válnia. Dávid-Barrett Tamás oxfordi viselkedéskutató figyelmeztette a résztvevőket: nem biológiai intelligencia jelent meg a világba – az emberi kreatív tudás marad az egyetlen, amire nem tanítható meg az AI. Jörg Dötsch éles kontraszttal élt: Kínában tíz emberből tíz értékteremtésen dolgozik, nálunk tíz emberből három az adminisztrációban. A Prohuman szakértői a „robotszendvics” metaforával írták le a jövőt: felül irányító szakember, középen robotok, alul a gépek működését biztosító munkaerő, és a skills first szemléletben jelölték meg a jövőt.\n\nA közleményt az elmúlt héten átvette többek között a HRPWOWER, a GyártásTrend, a Turizmus Online, az ICT Global és a Daily News Hungary is a múlt heti közléseket követően."},{"cim":"Tényleg „pisikártyával” lehet csak kimenni vécére a Master Goodnál? A cég szerint ez így nem igaz","url":"https://24.hu/fn/gazdasag/2026/06/16/pisikartya-master-good-mosdo-cafol/","forras":"24.hu","datum":"2026-06-16","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A MASZSZ állítása szerint a Master Good húsüzemében kártyával korlátozzák a mosdóhasználatot; a vállalat cáfolta, hogy a pisilést korlátoznák, csak az indokolatlan szüneteket vágnák vissza.","kulcsszavak":["agrárium","szakszervezet","munkakörülmények"],"het":"2026-06-15","id":"ART-0318","url_forras":"docx","kivonat":"A Magyar Szakszervezeti Szövetség (MASZSZ) dolgozói bejelentésekre hivatkozva azt állította, hogy a Master Good húsüzemében „pisikártyával” lehet csak mosdóba menni, és 200 emberre mindössze tíz ilyen kártya jut. A vállalat cáfolta ezt: minden dolgozónak van mágneskártyája a területek között való mozgáshoz, a pisilést nem korlátozzák, a szüneteket pedig rotálva adják ki a folyamatos termelés miatt, csak az indokolatlanul sok – cigizésre használt – pisiszüneteket igyekeznek visszavágni. Az ügy a Prohuman–MKIK–JVSZ konferenciája óta zajló szélesebb vita része: a Master Good ügyvezetője ott jelentette be, hogy külföldi munkaerő nélkül nem épül meg a tervezett gyár, Magyar Péter erre élesen visszavágott."},{"cim":"Megszólalt a miniszter: védik az érdekeket, ezért maradnak a vendégmunkások","url":"https://www.economx.hu/magyar-gazdasag/2026/06/14/agrarium-bona-szabolcs-megszolalt-miniszter-vedik-erdekeket-maradnak-vendegmunkasok/","forras":"Economx","datum":"2026-06-14","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az agrárminiszter tisztázta: a vendégmunkás-rendelet kizárólag a vendégmunkás-tartózkodási engedélyre vonatkozik, a mezőgazdaságban használt foglalkoztatási célú engedély változatlan feltételekkel elérhető marad.","kulcsszavak":["vendégmunka","agrárium","munkajog"],"het":"2026-06-08","id":"ART-0319","url_forras":"docx","kivonat":"Bóna Szabolcs agrárminiszter közösségi oldalán tisztázta a vendégmunkás-rendelet hatályát: a június 6-tól érvényes intézkedés kizárólag a vendégmunkás-tartózkodási engedélyre vonatkozik, amelyen keresztül „nagyrészt NER-kötődésű” kölcsönzők hoztak be ázsiai munkavállalókat. A mezőgazdaságban leginkább használt foglalkoztatási célú tartózkodási engedély és a szezonális vendégmunkás-engedély változatlan feltételek mellett elérhető marad, akárcsak a Nemzeti Kártya. A korábban kiadott engedélyek érvényesek és meghosszabbíthatók. Az Agroinform elemzése azonban rámutat: a kertészetek és állattartók beruházásaikat a minimálbéren dolgozó, főként filippínó, vietnámi és indiai munkásokra alapozták – és a béremelési ütem már eddig is meghaladta a termelékenység növekedését."},{"cim":"Vendégmunkás márpedig kell Magyarországon, a piac gyors megoldást remél a Tisza-kormánytól","url":"https://nepszava.hu/3325909_vendegmunkasok-magyarorszag-tisza-kormany-korlatozas-epitoipar-elemzes","forras":"Népszava","datum":"2026-06-15","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Szakértők szerint a harmadik országbeliek a hazai munkaerő mindössze 1,7-1,8%-át teszik ki; a Menton Jobs figyelmeztetett, hogy augusztus végéig rendezni kell a kérdést, különben egyre nagyobb károk keletkeznek.","kulcsszavak":["vendégmunka","Menton Jobs","építőipar","munkaerőhiány"],"het":"2026-06-15","id":"ART-0320","url_forras":"docx","kivonat":"Szakértői szerint a lezárt vendégmunkás-csatorna a honi munkaerőpiac egyik legellenőrzöttebb eleme volt, miközben tucatnyi kevésbé átlátható jogcím nyitva maradt. A hazai munkaerő mindössze 1,7-1,8 százalékát teszik ki a harmadik országbeliek – régiós összehasonlításban ez alacsony. A Menton Jobs figyelmeztetett: ha augusztus végéig nem rendeződik a kérdés, egyre nagyobb gazdasági károk keletkeznek. Koji László, az ÉVOSZ elnöke kettős képet vázolt az építőiparban: egyszerre van jelen munkaerőhiány és rejtett tartalék, és inkább szakképzett munkásokból hiányoznak. A szakértők szerint béremelés azért sem egyszerű megoldás, mert sok cégnek már nincs tartaléka – azt is a korábbi kötelező béremelésekre fordították."},{"cim":"Uniós szorításba kerül Magyarország bevándorlási szabályozása, új feltételekkel szembesül a Tisza-kormány","url":"https://www.portfolio.hu/gazdasag/20260617/unios-szoritasba-kerul-magyarorszag-bevandorlasi-szabalyozasa-uj-feltetelekkel-szembesul-a-tisza-kormany-843586","forras":"Portfolio","datum":"2026-06-17","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Egy 2026. május 22-én hatályba lépett uniós irányelv új jogokat ad a harmadik országbeli munkavállalóknak; az átültetés elmulasztása kötelezettségszegési eljárást és pénzbírságot vonhat maga után.","kulcsszavak":["bértranszparencia","munkajog"],"het":"2026-06-15","id":"ART-0321","url_forras":"docx","kivonat":"A vendégmunkás-stop után a Tisza-kormánynak nem csupán hazai munkaerőpiaci feszültségeket kell kezelnie, hanem egy május 22-én hatályba lépett uniós irányelvnek is meg kell felelnie. Az összevont engedélyről szóló irányelv új jogokat ad a harmadik országbeli munkavállalóknak: 90 napon belüli döntési kötelezettséget, munkáltatóváltási lehetőséget és legalább 3 hónapos türelmi időt állásvesztés esetén – szemben a jelenlegi magyar rendszer 6 napos idegenrendészeti következményeivel. Az irányelv átültetésének elmulasztása kötelezettségszegési eljárást és pénzbírságot vonhat maga után. A munkáltatók és szakértők nem korlátlan nyitást sürgetnek, hanem kevesebb, átláthatóbb engedélytípust, az országlista-logika újragondolását és külön szabályokat a magas hozzáadott értékű munkakörökre."},{"cim":"„Magyar Péter összemossa a bevándorlást és a vendégmunkásokat”","url":"https://nepszava.hu/3326465_bevandorlas-vendegmunkasok-magyar-peter-osszemossa-oket","forras":"Népszava","datum":"2026-06-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Shakkour Aram képviselő szerint Magyar Péter összemossa az illegális bevándorlást és a legális vendégmunkásokat; véleménye szerint a valódi probléma a jogfosztó feltételrendszer, nem a vendégmunkások jelenléte.","kulcsszavak":["vendégmunka","demográfia","politika"],"het":"2026-06-15","id":"ART-0322","url_forras":"docx","kivonat":"Shakkour Aram, kurd származású józsefvárosi képviselő (Szikra Mozgalom) kemény hangú posztban bírálta Magyar Péter parlamenti kommunikációját a vendégmunkás-kérdésben. Szerinte a miniszterelnök összemossa az illegális bevándorlást és a legális vendégmunkásokat, ami pontatlan és emberségtelen. Shakkour álláspontja: vendégmunkásokra szükség van Magyarországon, a probléma az előző rendszer által kialakított jogfosztó feltételrendszer – a megvágott jogok, gyenge alkupozíció és alacsonyabb bérek lefelé húzó bérspirált teremtenek, ami minden magyarországi dolgozónak árt. Ha a vendégmunkások ugyanolyan jogokat kapnának, mint a magyar munkavállalók, ők is a magasabb bérekért és jobb közszolgáltatásokért harcolnának."},{"cim":"Vendégmunkásügy: egymillió fős tartalék lehet a magyar munkaerőpiacban, csak jól kellene megszervezni","url":"https://www.forbes.hu/penz/munkaeropiac-vendegmunkas-giggle-munkavallalas-fobres-money-podcast/","forras":"Forbes","datum":"2026-06-17","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Sebestyén Ádám, a Giggle társalapítója szerint a magyar munkaerőpiacon egymillió fős tartalék lehet flexibilis pluszmunka formájában; a hazai cégek Achilles-sarka az elavult, időalapú munkaszervezés.","kulcsszavak":["Giggle","rugalmas foglalkoztatás","munkaerő-tartalék","munkaerő-kölcsönzés"],"het":"2026-06-15","id":"ART-0323","url_forras":"docx","kivonat":"Sebestyén Ádám, a Giggle társalapítója a Forbes Money podcastban azt állítja: cége felmérése szerint egymillió fős tartalék is lehet a magyar munkaerőpiacon – az aktív munkavállalók 20 százaléka szeretne flexibilisen pluszmunkát vállalni, jövedelemkiegészítés vagy rugalmasabb foglalkoztatás formájában. Szerinte a hazai cégek Achilles-sarka az elavult, időalapú munkaszervezés: aki csak a heti 40 órás modellben gondolkozik, versenyhátrányba kerül. A feladatalapú, rugalmas munkaszervezés beépítése a céges kultúrába nem igényel beruházást, csak szemléletváltást. Sebestyén nem gondolja, hogy a munkaerőpiaci kihívásokat egyetlen eszközzel meg lehet oldani, de határozottan azt mondja: a válasz nem kizárólag a vendégmunkás-behozatal."},{"cim":"Rekordot döntött a vendégmunkások száma Szlovákiában: már az autóipar sem működne nélkülük","url":"https://www.vg.hu/nemzetkozi-gazdasag/2026/06/szlovakia-kulfoldi-vendegmunkas-autoipar-volvo","forras":"Világgazdaság","datum":"2026-06-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Szlovákiában 2025 őszén már 135 ezer külföldi dolgozott, a foglalkoztatottak 7%-a; az öt nagy autógyár mellett a logisztika és gépipar is egyre inkább külföldi munkaerőre támaszkodik.","kulcsszavak":["régiós különbségek","vendégmunka","autóipar"],"het":"2026-06-15","id":"ART-0324","url_forras":"docx","kivonat":"Miközben Magyarország szigorítja a vendégmunkás-szabályozást, Szlovákia ellentétes utat jár: 2025 őszén már 135 ezer külföldi dolgozott az országban – a foglalkoztatottak 7 százaléka –, és ez az arány a leggyorsabban nőtt Európában az elmúlt két évben. Az autóipar szívja fel a legtöbbet: az öt nagy gyár – Volkswagen, Stellantis, Kia, Jaguar Land Rover és a kassai Volvo – mellett a logisztika és a gépipar is egyre inkább külföldi munkaerőre támaszkodik. A külföldiek közel fele ukrán, szerb és indiai állampolgár, az EU-n kívüliek száma 2025-ben először haladta meg a százezret. Szlovákia nem korlátozni, hanem integrálni próbálja a külföldi munkavállalókat – és rendszeresen frissíti a hiányszakmák listáját, amely egyszerűsíti az engedélyek kiadását."},{"cim":"Faramuci helyzet: a románoknak lenne saját munkaerejük, mégis a külföldi vendégmunkásokra szorulnak","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/06/roman-munkaeropiac-kulfoldi-vendegmunkasok-romania","forras":"Világgazdaság","datum":"2026-06-17","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Románia belső munkaerő-tartaléka jelentős, az első negyedéves munkanélküliségi ráta 6,5%; a vendégmunkásokra való támaszkodás oka nem mennyiségi, hanem minőségi hiány, mert a diplomások aránya csak 24,3%.","kulcsszavak":["régiós különbségek","munkaerő-tartalék","vendégmunka","pályakezdők"],"het":"2026-06-15","id":"ART-0325","url_forras":"docx","kivonat":"Molnár Dániel, a Magyar Gazdaságfejlesztési Ügynökség vezető elemzője rámutat egy látszólagos román paradoxonra: miközben a román munkaerő-importőrök szerint az új szabályozás megbénította az EU-n kívüli dolgozók toborzását, Romániában valójában jelentős belső munkaerő-tartalék áll rendelkezésre. Az első negyedéves munkanélküliségi ráta 6,5 százalék – az uniós átlagnál is magasabb –, az aktivitási ráta pedig 8,6 százalékponttal marad el az EU-átlagtól. A betöltetlen álláshelyek aránya mindössze 0,6 százalék, szemben az uniós 2,1 százalékkal. A vendégmunkásokra való támaszkodás oka ezért nem a mennyiségi hiány, hanem a minőségi: a diplomások aránya Romániában csak 24,3 százalék, az EU-s 39,4 százalékkal szemben."},{"cim":"Mindenkit megdöbbentett a Tisza-kormány: a rendszerváltás óta nem fordult elő ilyen Magyarországon","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/06/tisza-kormany-foglalkoztatas-vendegmunkasstop-munkaugy","forras":"Világgazdaság","datum":"2026-06-18","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Tisza-kormány megalakulása után egy hónappal nincs önálló foglalkoztatáspolitikáért felelős államtitkár – ez a rendszerváltás óta elsőként fordulna elő, mert a foglalkoztatáspolitika a szociális tárcához került.","kulcsszavak":["foglalkoztatottság","politika","szakszervezet"],"het":"2026-06-15","id":"ART-0326","url_forras":"docx","kivonat":"A Tisza-kormány megalakulása után egy hónappal még mindig nincs önálló foglalkoztatáspolitikáért felelős államtitkár – ami a rendszerváltás óta először fordulna elő. Kátai-Németh Vilmos szociális és családügyi miniszter négy államtitkárt nevezett ki, egyikük sem felel dedikáltan a munkaügyekért. Névtelen szakszervezeti forrás szerint ez „a terület teljes leértékelődését jelenti” – különösen, hogy a foglalkoztatáspolitika a gazdasági helyett a szociális tárcához került. A Munkástanácsok és a SZEF nyílt levélben, a MASZSZ 10 pontos javaslattal kereste a kormányt – mindkét oldal szerint legfeljebb ágazati szintű egyeztetések zajlottak. Mindeközben a vendégmunkás-stopot semmilyen formában nem előzte meg szakmai egyeztetés – Rolek Ferenc, az MGYOSZ alelnöke szerint van olyan vállalat, amely emiatt halasztotta el beruházását."},{"cim":"A soha nem érkező repülőrajt nyomában – hol a kiút a növekedési csapdából?","url":"https://www.portfolio.hu/gazdasag/20260619/a-soha-nem-erkezo-repulorajt-nyomaban-hol-a-kiut-a-novekedesi-csapdabol-844136","forras":"Portfolio","datum":"2026-06-19","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Portfolio szerint Magyarország fenntartható növekedési potenciálja 1% körülire süllyedt; a munkaerő-tartalék elfogyott, a beruházások három éve zuhannak, a bizalom helyreállítása lehet a fordulópont.","kulcsszavak":["gazdasági kilátások","munkaerő-tartalék","beruházás"],"het":"2026-06-15","id":"ART-0327","url_forras":"docx","kivonat":"A Portfolio elemzése szerint Magyarország fenntartható növekedési potenciálja 1 százalék körülire süllyedt: a munkaerő-tartalék elfogyott, a beruházások három éve zuhannak, egyes szektorokban a tőkeállomány már csökken. A 3 százalékos növekedés elérhető lenne, de ehhez az állami beavatkozás mérséklése, kiszámítható szabályozás és a termelékenység gyors javítása szükséges. Virovácz Péter (ING) a felsőoktatást, a vállalati modernizációt és az energetikát jelöli meg az uniós források legígéretesebb célterületeként, Palócz Éva (Kopint-TÁRKI) az infrastruktúrát és az egészségügyet helyezi előtérbe – utóbbi a munkaerő-mobilitást is növelné. A legkézenfekvőbb mérőszámon, a GDP-n túl a bizalom helyreállítása lehet az igazi fordulópont."},{"cim":"Kifulladt a magyar gazdaság két fő motorja, mire építhet így növekedést a Magyar-kormány?","url":"https://hvg.hu/gazdasag/20260616_gazdasagpolitika-tokebearamlas-munkaero-termelekenyseg-novekedes-tisza-kormany-magyar-kormany-gki","forras":"HVG","datum":"2026-06-16","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A GKI szerint a tőkebeáramlás és a munkaerő-bővülés kifulladt; a termelékenység az egyetlen terület, ahol még van mozgástér, itt viszont Magyarország a legjobban lemaradó a régióban.","kulcsszavak":["kutatás és statisztika","beruházás","gazdasági kilátások"],"het":"2026-06-15","id":"ART-0328","url_forras":"docx","kivonat":"A GKI elemzése szerint a három éve stagnáló magyar gazdaság két fő motorja kifulladt. A tőkebeáramlás – amely 2012-2024 között évente átlagosan 1,1 százalékponttal járult a növekedéshez – 2022 óta csökken, és a 2010-es évek forrásbőségéhez hasonló időszak nem várható. A munkaerő-bővülés is megállt: a tartalékok kimerültek, 2020-2024 között a munkaerő már nem járult hozzá a GDP-hez, 2025-től pedig demográfiai okokból a foglalkoztatottak száma csökkeni kezdett. Ahol még van mozgástér – a termelékenységben –, Magyarország egyben a legjobban le is maradt: 2012-2024 között ez csupán átlagosan 0,6 százalékponttal járult a növekedéshez, miközben a régiós versenytársak jobb ütemet produkáltak. A GKI azt javasolja, hogy a Magyar-kormány gazdaságpolitikájának középpontjába a termelékenység ösztönzését állítsa."},{"cim":"Megjöttek a friss béradatok: már 772 ezer forint fölött jár az átlagfizetés","url":"https://www.penzcentrum.hu/gazdasag/20260617/megjottek-a-friss-beradatok-mar-772-ezer-forint-folott-jar-az-atlagfizetes-1200597","forras":"Pénzcentrum","datum":"2026-06-17","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH szerint áprilisban a bruttó átlagkereset 772 200 forintra emelkedett, a nettó 541 200 forintra 11,2%-os növekedéssel; a reálkereset 8,9%-kal nőtt az alacsony inflációnak köszönhetően.","kulcsszavak":["bérek","KSH"],"het":"2026-06-15","id":"ART-0329","url_forras":"docx","kivonat":"A KSH friss adatai szerint 2026 áprilisában a bruttó átlagkereset 772 200 forintra emelkedett – 9 százalékkal meghaladva az egy évvel korábbit. A nettó átlagkereset ennél is gyorsabban, 11,2 százalékkal nőtt 541 200 forintra, részben a bővített családi adókedvezmény és az anyákat érintő szja-mentessége miatt. A reálkereset 8,9 százalékkal emelkedett, miközben az infláció mindössze 2,1 százalék volt. A bruttó mediánkereset 616 000, a nettó mediánkereset 436 400 forint – utóbbi 11,1 százalékkal haladja meg a tavalyi szintet."},{"cim":"Van egy ágazat, ahol 30 százalékkal lőttek ki a fizetések áprilisban, alighanem a választás tehet róla","url":"https://444.hu/2026/06/17/van-egy-agazat-ahol-30-szazalekkal-lottek-ki-a-fizetesek-aprilisban-alighanem-a-valasztas-tehet-rola","forras":"444","datum":"2026-06-17","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH áprilisi adatai szerint a pénzügyi szektor fizet legjobban; a legnagyobb kiugrás a tartalomszolgáltatásban volt 30%-os emelkedéssel, míg a vendéglátás bruttó átlaga a félmillió forintot sem érte el.","kulcsszavak":["KSH","bérek","turizmus"],"het":"2026-06-15","id":"ART-0330","url_forras":"docx","kivonat":"A KSH áprilisi béradataiból kiderül: legjobban a pénzügyi szektor fizet (1 419 100 forint bruttó átlag), amelyet a távközlés követ (1 287 600 forint). A legnagyobb kiugrás a tartalomszolgáltatásban volt: 874 400-ról 1 129 800 forintra, 30 százalékos emelkedéssel – amit a 44 választásokkal hoz összefüggésbe. Az energiaiparban egymillió forint felett keresnek, de ott csökkent a fizetés. A sor végén a vendéglátás és szálláshely-szolgáltatás áll 492 500 forintos bruttó átlaggal – az egyetlen szektor, ahol az átlag a félmillió forintot sem éri el."},{"cim":"A cégeknek közölniük kell majd, náluk hogyan keresnek a nők a férfiakhoz képest – Nem mindegy, hogy fognak mérni","url":"https://www.portfolio.hu/krtk/20260614/a-cegeknek-kozolniuk-kell-majd-naluk-hogyan-keresnek-a-nok-a-ferfiakhoz-kepest-nem-mindegy-hogy-fognak-merni-841960","forras":"Portfolio","datum":"2026-06-14","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Kutatók szerint a nemek közötti bérkülönbség mérése erősen függ a módszertantól; 100 fős cégeknél a nők átlagbére a férfiak 90%-a, de részletesebb FEOR-bontásnál már 95,2%.","kulcsszavak":["bértranszparencia","nők a munkaerőpiacon","skills-alapú HR","adózás"],"het":"2026-06-08","id":"ART-0331","url_forras":"docx","kivonat":"Boza István és Ilyés Virág kutatók NAV-adatokon mutatták meg, hogy a nemek közötti bérkülönbségek mérése erősen függ az alkalmazott módszertantól – ez különösen fontos, mivel a 150 főnél nagyobb cégeknek 2027-től bértranszparencia-jelentést kell benyújtaniuk. A 100 fős munkáltatóknál a nők átlagbére a férfiakénak 90 százaléka, de minél részletesebb munkakörönkénti bontást alkalmaznak, annál kisebb a mért különbség – 4-jegyű FEOR-kódon már 95,2 százalék. A különbség tehát nagyrészt munkaköri szegregációból, nem azonos munkáért kapott alacsonyabb bérből fakad. Mechanikus bérkorrekció esetén a becsült éves többletköltség mai bérszinten 650 milliárd forint lenne. A kutatók szerint az államnak útmutatókkal kell segíteni a cégeknek."},{"cim":"70 új csomagológyári munkahely Makón","url":"https://gyartastrend.hu/cikk/70-uj-csomagologyari-munkahely-makon","forras":"Gyártástrend","datum":"2026-06-16","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Ball Corporation 70 új munkatársat keres makói gyáregységébe; az üzem a megnyitás óta közel 250 millió alumíniumdobozt gyártott, és tovább bővíti kapacitásait.","kulcsszavak":["ipar","toborzás"],"het":"2026-06-15","id":"ART-0332","kivonat":"A Ball Corporation 70 új munkatársat keres makói gyáregységébe – gyártási operátorokat, mérnököket és műszakvezetőket. A fenntartható alumíniumcsomagolások terén világvezető vállalat makói üzeme a megnyitás óta már közel 250 millió alumíniumdobozt gyártott, és a régióban tovább bővíti kapacitásait. Az alumíniumdobozok piaci részesedése Európában növekszik, amit a fenntarthatósági szempontok és a körforgásos csomagolás iránti kereslet egyaránt hajt.","url_forras":"docx"},{"cim":"AI tudással akár 64% fizetésnövekedés - ne maradj le","url":"https://www.hrportal.hu/hr/ai-tudassal-akar-64-fizetesnovekedes-ne-maradj-le-20260615.html","forras":"HR Portál","datum":"2026-06-15","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A PwC AI Jobs Barometer szerint az AI-
