helyen 6340-es átlagos létszámmal és 58,3 milliárd forintos árbevétellel, a WHC és a HD Direkt Hungary követik.","kulcsszavak":["munkaerő-kölcsönzés","kutatás és statisztika"],"het":"2026-04-20","id":"ART-0159","url_forras":"docx","kivonat":"A BBJ 2025-ös rangsorolta a magyarországi munkaerő-kölcsönző cégeket. Az első helyen a Prohuman Zrt. áll – a HR-Rent Kft. adataival együtt – 6340-es átlagos statisztikai létszámmal és 58,3 milliárd forintos összes nettó árbevétellel, amelyet a WHC Kft. követ 5890-es létszámmal. A dobogót a HD Direkt Hungary zárja, a 4–5. helyen a Pannonjob és a Trenkwalder HR Solution található. A Randstad Hungary a 21. helyen áll a kölcsönzési rangsorban – ez összhangban van azzal, hogy a cég elsősorban a fejvadász és toborzási piacon erős, ahol viszont listavezető."},{"cim":"HR Special Report – Recruitment Agencies","url":"https://e.pcloud.link/publink/show?code=XZaTRiZKe63zeIJDJyj3B4pPqrWDbQzTJ67","forras":"Budapest Business Journal","datum":"2026-04-20","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A BBJ 2025-ös toborzási rangsorát a Randstad Hungary vezeti; a Prohuman Zrt. a 11. helyen szerepel 689 millió forintos toborzási árbevétellel, amely a 100%-os tulajdonában lévő HR-Rent adatait is tartalmazza.","kulcsszavak":["toborzás","kutatás és statisztika","HR-Rent"],"het":"2026-04-20","id":"ART-0160","url_forras":"docx","kivonat":"A BBJ 2025-ös toborzási árbevétel alapján rangsorolta a magyarországi fejvadász és személyzeti tanácsadó cégeket. Az élmezőnyt a Randstad Hungary vezeti, amelyet a Hays Hungary és a Gi Group Holding követ. A Prohuman Zrt. – amelynek adatai a 100%-os tulajdonában lévő HR-Rent Kft. számait is tartalmazzák – a 11. helyen szerepel 689 millió forintos toborzási árbevétellel és 58,3 milliárd forintos összes nettó árbevétellel, amely az egyik legmagasabb érték a listán. A Trenkwalder Recruitment az 5. helyen áll, a WHC a 4., a Pannonjob a 19. helyen található."},{"cim":"Kegyetlen szigorítás a szomszédban: előre le kell tenni az asztalra a cégeknek a külföldi munkavállalóik kitoloncolásának költségeit","url":"https://www.vg.hu/kozelet/2026/04/kulfoldi-munkavallalo-romania-szigoritas-kitoloncolas","forras":"Világgazdaság","datum":"2026-04-23","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Románia szigorítja az EU-n kívüli vendégmunkások alkalmazását: a közvetítő cégeknek előre letétet kell fizetniük a kitoloncolási költségekre; Magyarországon eközben a kormány 65 ezerről 35 ezerre csökkentette a vendégmunkás-kvótát.","kulcsszavak":["vendégmunka","régiós különbségek","munkajog"],"het":"2026-04-20","id":"ART-0161","url_forras":"docx","kivonat":"Románia sürgősségi rendelettel szigorítja az EU-n kívüli vendégmunkások alkalmazását: ezentúl csak azok a cégek közvetíthetnek külföldi munkaerőt, amelyek előre letétbe helyeznek egy összeget a lehetséges kitoloncolási és szociális ellátási költségek fedezésére. A lépés hátterében az áll, hogy a 100 ezres éves kvóta ellenére az utóbbi négy évben átlagosan csak 60 ezer munkavállalói vízumot adtak ki, és a vendégmunkások megtartási aránya 50 százalék alatt maradt – ráadásul a rendszer embercsempészetre is lehetőséget adott. Magyarországon ezzel párhuzamosan a kormány 65 ezerről 35 ezerre csökkentette a vendégmunkás-kvótát."},{"cim":"Letartóztattak két embert az Orbán Viktor öccsét érintő vendégmunkás-ügyben","url":"https://24.hu/belfold/2026/04/24/nepali-vendegmunkasok-orban-aron-befolyassal-uzerkedes/","forras":"24.hu","datum":"2026-04-24","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A bíróság letartóztatott két embert befolyással üzérkedés miatt egy Orbán Áront érintő ügyben, amelyben nepáli vendégmunkások tartózkodási engedélyeiért kértek pénzt, a kérelmeket végül elutasították.","kulcsszavak":["vendégmunka","politika"],"het":"2026-04-20","id":"ART-0162","url_forras":"docx","kivonat":"A Budai Központi Kerületi Bíróság letartóztatta azt a két személyt, akit befolyással üzérkedés és más bűncselekmények miatt vettek őrizetbe az Orbán Áront érintő ügyben. A gyanúsítottak befolyásos kapcsolataikra hivatkozva ígértek pénzért tartózkodási engedélyeket harmadik országbeli munkavállalóknak – egy vállalkozó 17 ezer euró előleget fizetett nepáli dolgozók vízumügyének intézésére, a kérelmeket azonban végül elutasították, a pénzt pedig a gyanúsítottak elosztották egymás között. A Központi Nyomozó Főügyészség négy személyt hallgatott ki gyanúsítottként, a letartóztatás ellen a védők fellebbeztek."},{"cim":"Így rajzolhatja át a Tisza-kormány a magyar oktatás szabályait: biztosan nem lesz fájdalommentes, erre lehet készülni","url":"https://www.penzcentrum.hu/oktatas/20260422/igy-rajzolhatja-at-a-tisza-kormany-a-magyar-oktatas-szabalyait-biztosan-nem-lesz-fajdalommentes-erre-lehet-keszulni-1197307","forras":"Pénzcentrum","datum":"2026-04-22","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A magyar oktatás rendszerszintű válságban van elavult NAT, tanárhiány és esélyegyenlőtlenség miatt; szakértők a 8+4-es iskolaszerkezet átalakítását és az intézményi autonómia erősítését szorgalmazzák.","kulcsszavak":["képzés","munkaerőhiány","gazdasági kilátások"],"het":"2026-04-20","id":"ART-0163","url_forras":"docx","kivonat":"A magyar oktatás rendszerszintű válságban van – elavult NAT, lexikális túlterhelés, tanárhiány és esélyegyenlőtlenség jellemzi, miközben az AI-kihívásra adott válasz kimerül a tiltásban. Garamvölgyi Zsolt oktatási szakértő a 8+4-es iskolaszerkezet 10+3-asra váltását szorgalmazza, amely személyre szabottabb képzést és hatékonyabb felzárkóztatást hozna. Nahalka István oktatáskutató a NAT gyökeres átalakítását és az intézményi autonómia erősítését tartja kulcskérdésnek, és az egész életen át tartó tanulásra való felkészítés is hiányzik. A Tisza-kormány átfogó reformot ígér – ez azonban nem lesz gyors és fájdalommentes."},{"cim":"Figyelmeztető adat érkezett a KSH-tól: csökken a foglalkoztatottság, nő a bizonytalanság a munkaerőpiacon","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/04/munkaero-foglalkoztatottsag-csokken-magyarorszag-ksh","forras":"Világgazdaság","datum":"2026-04-24","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH szerint a foglalkoztatottak száma 65 ezerrel csökkent egy év alatt, az álláskeresés átlagos ideje 12,2 hónapra nőtt, ami arra utal, hogy a vállalatok óvatosabban vesznek fel új dolgozókat.","kulcsszavak":["KSH","foglalkoztatottság","munkanélküliség"],"het":"2026-04-20","id":"ART-0164","url_forras":"docx","kivonat":"A KSH 2026 első negyedéves adatai szerint a foglalkoztatottak száma 65 ezerrel csökkent egy év alatt – az elsődleges munkaerőpiacon dolgozók visszaesése 85 ezer fő volt. A munkanélküliségi ráta 4,7 százalék volt a negyedév átlagában, márciusban 4,5 százalék – önmagában nem riasztó adat, de a trend kedvezőtlen. Az álláskeresés átlagos ideje már 12,2 hónapra nőtt, az egy évnél hosszabb ideje munkát keresők aránya 36,3 százalék – mindez arra utal, hogy a vállalatok óvatosabban vesznek fel új dolgozókat."},{"cim":"Szakértők szerint lassan, de javulhat a foglalkoztatás","url":"https://magyarnemzet.hu/gazdasag/2026/04/munkanelkuliseg-lassan-javulhat-a-munkaeropiac","forras":"Magyar Nemzet","datum":"2026-04-24","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Közgazdászok szerint az álláskeresés átlagos ideje 13,1-ről 12,2 hónapra csökkent, a második félévtől kedvezőbb folyamatok jöhetnek, de a munkaerőpiac fellendülése lassan megy majd végbe.","kulcsszavak":["foglalkoztatottság","munkanélküliség","gazdasági kilátások"],"het":"2026-04-20","id":"ART-0165","url_forras":"docx","kivonat":"A KSH első negyedéves adatait kommentálva Regős Gábor, a Gránit Alapkezelő vezető közgazdásza elmondta: a fő trend nem változott meg, ugyanakkor az álláskeresés átlagos ideje 13,1-ről 12,2 hónapra csökkent – vegyes kép rajzolódik ki tehát. Molnár Dániel, az MGF vezető elemzője szerint a második félévtől kedvezőbb folyamatok jöhetnek, ha élénkül a gazdasági növekedés, de a munkaerőpiac fellendülése lassan megy majd végbe – idén éves átlagban még kismértékben emelkedhet a munkanélküliségi ráta."},{"cim":"A Tisza-kormány átírhatja a munkaerőpiac szabályait","url":"https://piacesprofit.hu/cikkek/gazdasag/a-tisza-kormany-atirhatja-a-munkaeropiac-szabalyait.html","forras":"Piac és Profit","datum":"2026-04-21","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Gi Group Holding elemzése szerint a foglalkoztatottságcsökkenés ellenére erősödhet a verseny a munkavállalókért, különösen Debrecen térségében; a harmadik országbeli munkaerő iránti érdeklődés visszaesett.","kulcsszavak":["Gi Group","politika","foglalkoztatottság"],"het":"2026-04-20","id":"ART-0166","url_forras":"docx","kivonat":"A Gi Group Holding elemzése szerint a 60–70 ezres foglalkoztatottságcsökkenés ellenére erősödhet a verseny a magyar munkavállalókért – különösen a debreceni nagyberuházások térségében. A vállalatok eddig kitartottak a munkavállalóik mellett, mert korábbi tapasztalataik alapján fellendülés idején nehéz gyorsan pótolni az elveszített munkaerőt. A harmadik országbeli munkavállalók iránti érdeklődés visszaesett – a kiszámíthatatlan megrendelések és a hosszú belépési idő mellett a Tisza-kormány várható szabályozási lépései is óvatosságra intik a cégeket –, ezért a vállalatok egyre inkább a hazai tartalékokra fókuszálnak."},{"cim":"A Tisza 2030-ra felkészítené Magyarországot az eurócsatlakozásra. Mennyire reális ez?","url":"https://telex.hu/gazdasag/2026/04/18/euro-bevezetese-forint-feltetelek-tisza-part","forras":"Telex","datum":"2026-04-18","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Tisza-kormány 2030-ra tűzte ki az eurócsatlakozás feltételeinek megteremtését; elemzők szerint 5-6 év lehet reális, de a költségvetési hiány és az államadósság finanszírozhatósága komoly kockázatot jelent.","kulcsszavak":["gazdasági kilátások","politika"],"het":"2026-04-13","id":"ART-0167","url_forras":"docx","kivonat":"A Tisza-kormány 2030-ra tűzte ki az eurócsatlakozás feltételeinek megteremtését – a legnagyobb kihívást a költségvetési hiány jelenti, amely jelenleg 5% körül van, miközben a maastrichti kritérium 3% alatti szintet követel. Jobbágy Sándor, a Concorde elemzője szerint 5–6 év reális időtáv, de csak ideális körülmények között – ráadásul felkészületlen gazdasággal a csatlakozás inkább hátrány, mint előny, hiszen elvész a saját árfolyam és kamat korrekciós lehetősége. Zsiday Viktor szerint a politikai akarat és a lakossági támogatottság megvan, a két fő kockázat az iráni olajválság és az államadósság finanszírozhatósága."},{"cim":"Kapitány István 9 százalékos szja-t javasol a minimálbérre – Évi 240 ezer maradhat pluszban","url":"https://tozsdeforum.hu/gazdasag/kapitany-istvan-9-szazalekos-szja-t-javasol-a-minimalberre-evi-240-ezer-maradhat-pluszban/","forras":"Tőzsdefórum","datum":"2026-04-23","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Tisza Párt a minimálbér szja-ját 15-ről 9 százalékra csökkentené, évi 240 ezer forinttal több nettó jövedelmet adva; a kedvezmény a mediánbér, bruttó 625 ezer forint alatt keresőkre is vonatkozna, fokozatosan csökkenő mértékben.","kulcsszavak":["politika","bérek","adózás"],"het":"2026-04-20","id":"ART-0168","url_forras":"docx","kivonat":"A Tisza Párt tervei szerint a minimálbér után fizetendő szja 15-ről 9 százalékra csökkenne, ami évente több mint 240 ezer forinttal több nettó jövedelmet jelentene. Az intézkedés nem állna meg a minimálbérnél: Kapitány István leendő gazdasági miniszter szerint mindenki kevesebb adót fizetne, aki a mediánbér alatt – bruttó 625 ezer forintig – keres, a kedvezmény mértéke pedig fokozatosan csökkenne a magasabb jövedelmek felé. A közzétett példák szerint 420 ezer forintos bruttónál évi 180 , 500 ezernél 120, 625 ezernél 60 ezer forint maradna pluszban."},{"cim":"Szomorkodhatnak a magyar tanárok, ha meglátják ezeket a fizetéseket: hiába az elmúlt évek emelései, elmaradt a várva várt csoda","url":"https://www.penzcentrum.hu/oktatas/20260421/szomorkodhatnak-a-magyar-tanarok-ha-meglatjak-ezeket-a-fizeteseket-hiaba-az-elmult-evek-emelesei-elmaradt-a-varva-vart-csoda-1197343","forras":"Pénzcentrum","datum":"2026-04-21","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az OECD adatai szerint a magyar tanárok kezdő fizetése vásárlóerő-paritáson csak 30 692 dollár, szemben az OECD-átlag 47 ezer dollárral; az osztatlan tanárképzésbe járók száma 2019 óta folyamatosan csökken.","kulcsszavak":["bérek","kutatás és statisztika","képzés","munkaerőhiány"],"het":"2026-04-20","id":"ART-0169","url_forras":"docx","kivonat":"Az OECD Education at a Glance 2025 adatai szerint a magyar tanárok kezdő alapfizetése vásárlóerő-paritáson számolva mindössze 30 692 dollár – az OECD-átlag közel 47 ezer dollár, a pálya csúcsán elérhető maximum pedig 42 ezer dollárral szemben a nemzetközi átlag 76 ezer dollár. Az elmúlt évek béremelései ellenére Magyarország a sereghajtók között marad, és a bérpálya szerkezete is kedvezőtlen – a tapasztalat pénzügyi értelemben kevéssé térül meg, ami a pályán maradást is gyengíti. Mindezt tetézi, hogy az osztatlan tanárképzésben részt vevők száma 2019 óta folyamatosan csökken – a 9735-ről 7759-re esett."},{"cim":"A Ball Corporation több mint 40 új munkahelyet hoz létre makói gyárában","url":"https://gyartastrend.hu/cikk/a-ball-corporation-tobb-mint-40-uj-munkahelyet-hoz-letre-a-nemreg-megvasarolt-makoi-gyaraban","forras":"Gyártástrend","datum":"2026-04-23","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Ball Corporation több mint 40 új munkatársat keres nemrég megvásárolt makói alumíniumdoboz-gyárába, a bővítést a növekvő európai kereslet indokolja, minden háttérből várva a jelentkezőket, teljes képzéssel.","kulcsszavak":["ipar","toborzás"],"het":"2026-04-20","id":"ART-0170","url_forras":"docx","kivonat":"A fenntartható alumíniumcsomagolások piacán világvezető Ball Corporation több mint 40 új munkatársat keres nemrég megvásárolt makói gyárába – az első ütem után 2026 során további felvételek várhatók. Dejan Jovanovic regionális gyártási igazgató szerint a vállalat hosszú távú karriert kínál, és minden háttérből várja a műszaki beállítottságú jelentkezőket, teljes képzéssel. A bővítést az újrahasznosítható alumíniumdobozok iránti növekvő európai kereslet indokolja – a szegmens 2025-ben is meghaladta a piac növekedési ütemét."},{"cim":"Botka László: Szeged szívesen fogadja a kínai beruházásokat","url":"https://hirado.hu/kulfold/cikk/2026/04/22/botka-laszlo-szeged-szivesen-fogadja-a-kinai-beruhazasokat","forras":"Híradó.hu","datum":"2026-04-22","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Szeged polgármestere megerősítette, hogy a város nyitott a kínai beruházásokra; a BYD szegedi üzeme a beruházás befejezése után akár 10 ezer munkahelyet teremthet.","kulcsszavak":["autóipar","beruházás","politika"],"het":"2026-04-20","id":"ART-0171","url_forras":"docx","kivonat":"Botka László szegedi polgármester a Hszinhua hírügynökségnek megerősítette: Szeged nyitott a kínai beruházásokra, és a BYD szegedi üzemét a város történetének legnagyobb ipari fejlesztéseként értékelte. A mintegy 3 millió négyzetméteres üzem első fázisban évi 150 ezer jármű gyártására lesz képes, a végszerelő egység már a beüzemelési szakaszba lépett – a beruházás befejezése után 10 ezer munkahely jöhet létre. A polgármester a kormányváltással kapcsolatban azt mondta: tapasztalatai szerint minden politikai irányultságú kabinet törekedett a Kínával fenntartott gazdasági kapcsolatok erősítésére, ebben nem vár jelentős változást."},{"cim":"Interjú Nógrádi Józseffel, a Trenkwalder Csoport kereskedelmi igazgatójával","url":"https://www.atv.hu/belfold/20260425/tisza-kormany-minimalber-ado/","forras":"ATV","datum":"2026-04-24","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder stratégiai igazgatója szerint jó irányba mutat a minimálbér-szja csökkentése, miközben a cégek kimerült állapotban vannak; a részmunkaidős foglalkoztatás hazai aránya csak 3-5%, szemben a nyugat-európai 30-40%-kal.","kulcsszavak":["Trenkwalder","bérek","adózás","rugalmas foglalkoztatás"],"het":"2026-04-20","id":"ART-0172","url_forras":"kezi","kivonat":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint jó irányba mutat a minimálbér-szja  9 százalékra csökkentése – a többlet a munkavállalóknál marad, miközben a cégek kimerült állapotban vannak: a 450 ezer  vállalkozásból 160 ezer pénzügyi kockázati zónában van. A részmunkaidős foglalkoztatás hazai aránya csupán 3–5%, a nyugat-európai 30–40%-kal szemben – sokan inkább a segélynél maradnak, mint alacsony bérű részmunkaidőt vállaljanak."},{"cim":"Húszezer forinttal többet vihetnek haza havonta a minimálbéresek a TISZA Párt adócsökkentésével","url":null,"forras":"RTL","datum":"2026-04-23","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Tisza-kormány a minimálbér szja-kulcsát 9 százalékra csökkentené, havi 20 ezer forint többletet adva; a Trenkwalder szerint az érintettek főként gyári betanított munkások és mezőgazdasági dolgozók.","kulcsszavak":["Trenkwalder","politika","bérek","adózás"],"het":"2026-04-20","id":"ART-0173","kivonat":"A Tisza-kormány a minimálbér szja-kulcsát 15-ről 9 százalékra csökkentené – Kapitány István leendő gazdasági miniszter szerint ez havonta 20 ezer forinttal több nettót jelent, és minden bruttó 625 ezer forint alatt keresőre arányosan vonatkozna. Nógrádi József, a Trenkwalder stratégiai igazgatója amegjegyezte: az érintettek főként gyári betanított munkások és mezőgazdasági dolgozók. A bevezetés időpontja még nem ismert, Bod Péter Ákos szerint a bevételkiesés fedezetét az állami kiadások csökkentésével kell megtalálni."},{"cim":"Tovább erősít a WHC Közép-Kelet Európában: központi ernyőmárka alá került az Adria-régió is","url":"https://profitline.hu/tovabb-erosit-a-whc-kozep-kelet-europaban-kozponti-ernyomarka-ala-kerult-az-adria-regio-is-486065","forras":"Profitline","datum":"2026-04-24","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC Csoport egységes ernyőmárka alá vonja adriai leányvállalatait egy 10 országra kiterjedő integrációs folyamat részeként, miközben januárban létszám alapján piacvezetővé vált Magyarországon.","kulcsszavak":["WHC","régiós különbségek","vendégmunka","gazdasági kilátások"],"het":"2026-04-20","id":"ART-0174","url_forras":"docx","kivonat":"A WHC Csoport 2026 áprilisától egységes ernyőmárka alá vonja adriai leányvállalatait – a szlovéniai és horvátországi cégek, köztük a 2022-ben felvásárolt Heads Adriatic, felveszi a WHC nevet. A lépés egy tágabb, 10 országra kiterjedő integrációs folyamat része, miközben a WHC januárban kölcsönzötti létszám alapján piacvezetővé vált Magyarországon. Berta Péter ügyvezető szerint a szorosabb koordinációt az is indokolja, hogy a lefedett országokban a következő években egymillió fővel csökkenhet a munkaerő-kínálat."},{"cim":"Lassulhat a magyar kivándorlás, reális alternatíva lett a hazatérés","url":"https://index.hu/belfold/2026/04/22/kivandorlas-magyarorszag-hazateres-munka-allas-fizetes-europa-unio/?token=374dcd9317b71f93118fdd889c8ad2de","forras":"Index","datum":"2026-04-22","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC Csoport előrejelzése szerint a kivándorlás mérséklődhet; a debreceni és szegedi nagyberuházások versenyképes alternatívát kínálnak, a visszavándorlók 37%-a elsősorban a család miatt dönt a hazatérés mellett.","kulcsszavak":["WHC","demográfia","foglalkoztatottság"],"het":"2026-04-20","id":"ART-0175","url_forras":"docx","kivonat":"A WHC Csoport előrejelzései szerint a külföldön élő magyarok száma elérheti a 770 ezer főt, de a legújabb jelek a kivándorlás mérséklődésére utalnak. A debreceni és szegedi nagyberuházások emelkedő bérekkel és komplex juttatási csomagokkal versenyképes alternatívát kínálnak, és a WHC toborzási tapasztalatai szerint egyre többen mérlegelik a hazatérést – a visszavándorlók 37%-a elsősorban a család miatt dönt így. Teljes fordulat még nincs: a magasabb képzettséget igénylő szektorokban továbbra is jelentős bérkülönbségek nehezítik a tehetségek hazatérését, és a nemzetközi tapasztalatszerzés motivációja is erős maradt."},{"cim":"Állásbörze élesben - sokan önéletrajzzal érkeztek a gyöngyösi karriernapra","url":"https://www.heol.hu/helyi-kozelet/2026/04/karriernap-iden-is-a-gyongyosi-campuson","forras":"HEOL","datum":"2026-04-28","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A MATE gyöngyösi campusának karriernapján a Pannon Diák, a Prohuman Diákmunka és a Meló-Diák standjainál lehetett tájékozódni diákmunka és gyakorlati lehetőségekről, önéletrajz-benyújtási lehetőséggel.","kulcsszavak":["Prodiák","toborzás","diákmunka"],"het":"2026-04-27","id":"ART-0176","url_forras":"docx","kivonat":"A MATE gyöngyösi Károly Róbert Campusa idén is megrendezte állásbörzével egybekötött karriernapját, amelyen a verseny- és közszféra munkaadói egyaránt megjelentek. Az idei esemény újdonsága, hogy a korábbi évekhez képest több városból érkező álláskereső is felkereste a standokat – nemcsak hallgatók –, és önéletrajzot is be lehetett nyújtani konkrét pozíciókra. A kiállítók között szerepelt a K&V, a P&G, a Rosenberger, az MVM Mátra Energia, valamint közintézmények is; a diákmunka és gyakorlati lehetőségekről a Pannon Diák, a Prohuman Diákmunka és a Meló-Diák standjainál lehetett tájékozódni."},{"cim":"Nem az a kérdés, lesz-e elég munkahely, hanem hogy lesznek-e megfelelően képzett munkavállalók – HR-kihívások a permakrízis korában","url":"https://www.hrportal.hu/hr/nem-az-a-kerdes-lesz-e-eleg-munkahely-hanem-hogy-lesznek-e-megfeleloen-kepzett-munkavallalok-hr-kihivasok-a-permakrizis-koraban-20260428.html","forras":"HR Portál","datum":"2026-04-28","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Göndöcs Viktor, a Prohuman vezérigazgatója a Connect konferencián kiemelte: a valódi kockázat nem a munkahelyek megszűnése, hanem hogy a magyar felnőttek EU-szinten a legkevésbé nyitottak az átképzésre; Izsó Balázs a kompetencia-alapú kiválasztás fontosságát hangsúlyozta.","kulcsszavak":["képzés","skills-alapú HR"],"het":"2026-04-27","id":"ART-0177","url_forras":"docx","kivonat":"Göndöcs Viktor, a Prohuman vezérigazgatója a Connect konferencia panelbeszélgetésén rámutatott: a bizonytalanság ma már nem kivételes állapot, hanem az üzleti élet alapértelmezett üzemmódja. Az AI és az automatizáció kapcsán hangsúlyozta: a valódi kockázat nem a munkahelyek megszűnése, hanem az, hogy Magyarországon a felnőtt társadalom az EU-n belül a legkevésbé nyitott az átképzésre – így nem az lesz a kérdés, hogy van-e elég munkahely, hanem hogy lesznek-e megfelelően képzett munkavállalók. Izsó Balázs, a Prohuman operatív vezérigazgató-helyettese hozzátette: a jövőben a kompetencia alapú kiválasztás – az alkalmazkodási és tanulási képesség felmérése – még hangsúlyosabb szerepet kap."},{"cim":"Hol foglalkoztatnak megváltozott munkaképességű személyeket?","url":"https://www.hrportal.hu/hr/hol-foglalkoztatnak-megvaltozott-munkakepessegu-szemelyeket-20260428.html","forras":"HR Portál","datum":"2026-04-28","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A megváltozott munkaképességű álláskeresőknek több szervezet – köztük a Prohuman – nyújt segítséget álláslehetőségek, felkészülés és munkahelyi beilleszkedés terén.","kulcsszavak":["esélyegyenlőség","foglalkoztatottság"],"het":"2026-04-27","id":"ART-0178","url_forras":"docx","kivonat":"A HRPortal olvasói kérdésre adott válasza szerint a 44%-os egészségkárosodással élő személyek számára több civil szervezet és munkaerőpiaci szolgáltató kínál segítséget – köztük a Salva Vita Alapítvány, a Kézenfogva Alapítvány, a Motiváció Alapítvány és a Prohuman. Ezek a szervezetek nemcsak álláslehetőségeket biztosítanak, hanem a felkészülésben és a munkahelyi beilleszkedésben is támogatást nyújtanak. Az „Érték vagy!” állásportál szintén kifejezetten ilyen álláskeresők számára kínál lehetőségeket."},{"cim":"Trendfordulás a munkaerőpiacon: már nem csak a nagyok eszköze a kölcsönzés","url":"https://www.hrportal.hu/hr/trendfordulas-a-munkaeropiacon-mar-nem-csak-a-nagyok-eszkoze-a-kolcsonzes-20260428.html","forras":"HR Portál","datum":"2026-04-28","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"A Man at Work tapasztalatai szerint már 10-20 fős kisvállalkozások is élnek a munkaerő-kölcsönzéssel a rugalmasság és kockázatcsökkentés miatt, különösen a nyári szezon közeledtével a vendéglátásban.","kulcsszavak":["munkaerő-kölcsönzés","gazdasági kilátások","Man at Work","rugalmas foglalkoztatás"],"het":"2026-04-27","id":"ART-0179","url_forras":"docx","kivonat":"A Man at Work tapasztalatai szerint a munkaerő-kölcsönzés egyre szélesebb ügyfélkört vonz – már 10-20 fős kisvállalkozások is élnek ezzel a lehetőséggel, elsősorban a rugalmasság és a kockázatcsökkentés miatt. Baradits Bulcsú kölcsönzési üzletágvezető szerint a bizonytalan gazdasági környezetben a cégek kerülik a hosszú távú létszámkötelezettségeket, miközben teljesítőképességüket fenn kell tartaniuk. A nyári szezon közeledtével a helyzet különösen élessé válik a vendéglátásban – aki most nem lép, bajba kerülhet."},{"cim":"Debrecenben egy témáról szólt a kampány, és ez tökéletesen látszik a választási eredményben","url":"https://telex.hu/belfold/2026/04/26/debrecen-valasztasi-kampany-fidesz-vereseg-tisza-part-hajdu-bihar-megye","forras":"Telex","datum":"2026-04-26","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Debrecenben a Tisza Párt 58-60%-os eredménnyel nyert; a kampány az akkugyárak körüli szabálytalanságokról és a tömegesen érkező vendégmunkásokról szólt, ami megrendítette a korábbi fideszes városvezetés hitelességét.","kulcsszavak":["politika","beruházás","vendégmunka"],"het":"2026-04-20","id":"ART-0180","url_forras":"docx","kivonat":"Debrecenben a Tisza Párt mindhárom választókerületben 58-60 százalékos eredménnyel nyert – egy olyan városban, amely évtizedekig a Fidesz bástyájának számított. Polgár Tóth Tamás, a Debreciner újságírója szerint a kampány egyetlen témáról szólt: az akkugyárakról. A CATL és a Semcorp üzemeiben feltárt szabálytalanságok – engedély nélkül tárolt veszélyes anyagok, mérgezésre utaló dokumentumok, vízfolyásban talált oldószerek – megrendítették a fideszes városvezetés hitelességét, amelyet az is tovább rontott, hogy miközben a kormány migrációellenes üzenetet kommunikált, Hajdú-Bihar megyébe tömegesen érkeztek vendégmunkások."},{"cim":"Korrupciós gyanúba keveredett Sára Botond főispán","url":"https://www.portfolio.hu/uzlet/20260429/korrupcios-gyanuba-keveredett-sara-botond-foispan-833720","forras":"Portfolio","datum":"2026-04-29","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A főügyészség korrupciós gyanúval vizsgálja Sára Botond főispánt egy nepáli vendégmunkások kölcsönzésével kapcsolatos ügyben, amelyben egy közvetítő cég minősített foglalkoztatói státuszért bort adott a főispánnak.","kulcsszavak":["politika","vendégmunka"],"het":"2026-04-27","id":"ART-0181","url_forras":"docx","kivonat":"A Központi Nyomozó Főügyészség korrupciós bűncselekménnyel gyanúsította meg Sára Botond budapesti főispánt egy nepáli vendégmunkások kölcsönzésével kapcsolatos ügyben. A gyanú szerint egy munkaerő-közvetítő cég ügyvezetője minősített foglalkoztatói státuszt próbált szerezni cégének – ami gyorsabb ügyintézést tett volna lehetővé külföldi dolgozók tartózkodási engedélyeinél –, és ennek érdekében személyes találkozókon közel 70 ezer forint értékű bort adott a főispánnak. Az érintettek üzleti kapcsolatban álltak Orbán Áronnal, Orbán Viktor öccsével, akinek neve egy korábbi, hasonló vendégmunkás-ügyben már felmerült."},{"cim":"A lojalitás ára 2026-ban: Miért a diákmunka a legkedvezőbb választás?","url":"https://hvg.hu/brandcontent/20260427_diakmunka-fluktuacio-berszinvonal","forras":"HVG","datum":"2026-04-27","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az Y Diák Iskolaszövetkezet felmérése szerint a fiatalok 44%-a számára az órabér az elsődleges döntési tényező; a járulékmentes diákmunka a munkáltatónak versenyképes bérköltséget, a munkavállalónak nettó jövedelemtöbbletet jelent.","kulcsszavak":["diákmunka","bérek","munkaerőhiány"],"het":"2026-04-27","id":"ART-0182","url_forras":"docx","kivonat":"Az Y Diák Iskolaszövetkezet 600 diák bevonásával készült felmérése szerint a fiatalok 44 százaléka számára az órabér az elsődleges döntési tényező. Az iskolaszövetkezeti foglalkoztatás teljes járulékmentessége miatt minden béremelés közvetlenül nettó jövedelemként jelenik meg a munkavállalónál – a munkáltató bérköltsége mégis versenyképes marad. Rozs-Horváth Zsófia ügyfél-koordinációs vezető szerint 2026-ban a munkaerőhiány ellenszere nem a létszámbővítés, hanem a kedvezőbb foglalkoztatási formák kihasználása."},{"cim":"Titkos fegyver a munkaerőpiacon: ők az új kedvencek","url":"https://www.economx.hu/gazdasag/2026/04/27/diakmunka-iskolaszovetkezet-felmeres-muisz-munkaeropiac/","forras":"Economx","datum":"2026-04-27","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A MŰISZ felmérése szerint a diákmunka egyre szélesebb körben elterjedt a rugalmas, adminisztrációtól mentes foglalkoztatás miatt; a hallgatók 65%-a dolgozik, elsősorban a rugalmas időbeosztás és a magas órabér miatt.","kulcsszavak":["diákmunka","munkáltatói szövetség","rugalmas foglalkoztatás","szezonális munka"],"het":"2026-04-27","id":"ART-0183","url_forras":"docx","kivonat":"A MŰISZ Iskolaszövetkezet felmérése szerint a diákmunka egyre szélesebb körben elterjedt – az egyéni vállalkozóktól a nagyvállalatokon át minden méretű szervezet támaszkodik rá, különösen szezonális csúcsidőszakokban. A modell fő vonzereje a járulékmentes, rugalmas, adminisztrációtól mentes foglalkoztatás: a létszám napról napra igazítható, és nyári szezonban akár 24 órán belül biztosítható nagyobb létszám. A hallgatók oldalán is erős a munkavállalási hajlandóság – 65 százalékuk jelenleg is dolgozik, 71 százalékuk a rugalmas időbeosztást, 67 százalékuk a magas órabért tartja a legfontosabb szempontnak."},{"cim":"Új korszak a magyar munkaerőpiacon: ezért térhetnek vissza a határozott idejű szerződések","url":"https://www.hrportal.hu/hr/uj-korszak-a-magyar-munkaeropiacon-ezert-terhetnek-vissza-a-hatarozott-ideju-szerzodesek-20260429.html","forras":"HR Portál","datum":"2026-04-29","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A gazdasági stagnálás és az emelkedő bérköltségek felértékelhetik a határozott idejű szerződéseket, amelyek aránya 2015 óta 10%-ról 4%-ra csökkent; indoklás nélküli felmondás esetén a munkavállalót akár 12 havi távolléti díj illetheti.","kulcsszavak":["munkajog","munkanélküliség","adózás","foglalkoztatottság"],"het":"2026-04-27","id":"ART-0184","url_forras":"docx","kivonat":"A gazdasági stagnálás és az emelkedő bérköltségek egyre szűkebb mozgásteret hagynak a vállalatoknak – miközben a bruttó átlagkereset éves alapon közel 10 százalékkal nő, a cégek árbevétele sok esetben stagnál, a munkahelyteremtő képesség gyengül. A munkanélküliségi ráta 5 százalék közelébe emelkedett, a korábbi munkaerő-tartalékolás egyre nehezebben tartható fenn. Mindez ismét felértékelheti a határozott idejű szerződéseket, amelyek aránya 2015-ös 10 százalékos csúcsról 2025-re 4 százalékra csökkent. A konstrukció rugalmasnak tűnik, de felmondani nehezebb, mint határozatlan idejű szerződésnél – indoklás nélküli azonnali megszüntetés esetén a munkavállalót akár 12 havi távolléti díj illetheti meg."},{"cim":"Brüsszelig jutott a BYD szegedi gyárának ügye – Súlyos vádak a kínai céggel szemben","url":"https://www.portfolio.hu/uzlet/20260428/brusszelig-jutott-a-byd-szegedi-gyaranak-ugye-sulyos-vadak-a-kinai-ceggel-szemben-833284","forras":"Portfolio","datum":"2026-04-28","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Az Európai Parlament elé került a BYD szegedi gyárépítkezésének ügye a China Labor Watch jelentése alapján; interjúk heti hét napos túlórákat, hiányos ellátást és halálos darubalesetet tártak fel.","kulcsszavak":["autóipar","kutatás és statisztika","munkajog"],"het":"2026-04-27","id":"ART-0185","url_forras":"docx","kivonat":"A China Labor Watch jelentése alapján az Európai Parlament elé került a BYD szegedi gyárépítkezésének ügye – szúrta ki a Portfolio a magyar sajtóban elsőként. Ez az első alkalom, hogy kínai autógyártó európai beruházásához kapcsolódó munkajogi vádak uniós szintre jutnak. Az 50 munkással készített interjúk heti hét napos, napi 12 órát meghaladó műszakokat, hiányos egészségügyi ellátást, nem megfelelő jogi státuszt és pénzügyi visszatartást tártak fel. Az építkezésen halálos darubaleset is történt, a mentőszolgálat február óta tizenkétszer vonult ki. A kivitelező AIM Construction Hungary egy olyan kínai cégcsoporthoz tartozik, amely korábban Brazíliában kényszermunkát súroló körülmények miatt botrányba keveredett."},{"cim":"Fizikai melósként is összejöhet a 600-900 ezres nettó: íme a legjobban fizető hazai munkahelyek listája","url":"https://www.penzcentrum.hu/karrier/20260428/fizikai-meloskent-is-osszejohet-a-600-900-ezres-netto-ime-a-legjobban-fizeto-hazai-munkahelyek-listaja-1197684","forras":"Pénzcentrum","datum":"2026-04-28","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A fizikai dolgozók nettó átlagkeresete 368 735 forint, de a területi és ágazati különbségek drámaiak: Győr-Moson-Sopron 427 ezerrel vezet, Szabolcs-Szatmár-Bereg 279 ezerrel a sereghajtó.","kulcsszavak":["toborzás","bérek","régiós különbségek"],"het":"2026-04-27","id":"ART-0186","url_forras":"docx","kivonat":"A 2025-ös adatok szerint a fizikai dolgozók nettó átlagkeresete Magyarországon 368 735 forint, de a területi különbségek drámaiak: Győr-Moson-Sopron vezet 427 ezer forinttal, míg Szabolcs-Szatmár-Bereg sereghajtó 279 ezerrel – másfélszeres különbség. Ágazatonként még élesebb a szóródás: a csúcson Tolna vármegye energiaszektora áll közel 953 ezer forintos nettó átlaggal, amelyet a bányászat követ 650 ezer forint körül – míg a feldolgozóipar, amely pedig az ország gazdaságának gerincét adja, Győrben is csak 520 ezer forintnál jár. A legmagasabb és legalacsonyabb toplistás érték között 455 ezer forint a különbség, ami rendkívüli szórást jelez még a legjobban fizető szegmenseken belül is."},{"cim":"469 új munkahely jöhet: az EU rábólintott a Hankook óriásberuházására","url":"https://www.hrportal.hu/c/469-uj-munkahely-johet-az-eu-rabolintott-a-hankook-oriasberuhazasara-20260427.html","forras":"HR Portál","datum":"2026-04-27","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Az Európai Bizottság jóváhagyta a Hankook Tire 71,6 millió eurós állami támogatását egy 538 millió eurós fejér megyei beruházáshoz, amely 469 új munkahelyet teremthet a Közép-Dunántúlon.","kulcsszavak":["autóipar","beruházás"],"het":"2026-04-27","id":"ART-0187","url_forras":"talalt","kivonat":"Az Európai Bizottság jóváhagyta a Hankook Tire 71,6 millió eurós magyar állami támogatását egy 538 millió eurós fejér megyei beruházáshoz, amelynek keretében az üzem tehergépkocsi- és buszradiál gyártósorral bővül – eddig csak személyautó- és kisebb tehergépjármű-gumiabroncsokat gyártottak itt. A projekt várhatóan 469 új munkahelyet teremt a Közép-Dunántúl régióban. Az EB indoklása szerint a támogatás nélkül a vállalat nem valósította volna meg a kapacitásbővítést az Európai Gazdasági Térségben."},{"cim":"Fájhat a beígért vendégmunkás-tilalom, a hazai munkaerő-tartalék egyelőre csak papíron létezik","url":"https://telex.hu/g7/kozelet/2026/04/28/munkaeropiac-vendegmunkas-tisza-kormany-munkaerohiany-munkaero-tartalek-gazdasagpolitika-munkanelkuliseg","forras":"G7","datum":"2026-04-28","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Szakértők szkeptikusak a Tisza Párt vendégmunkás-tilalmi tervével kapcsolatban; a Trenkwalder és a Gi Group szerint a vendégmunkásokra mennyiségi és minőségi hiány miatt is szükség van a nagy gyárak beszállítói láncaiban.","kulcsszavak":["Trenkwalder","vendégmunka","munkaerő-tartalék","politika"],"het":"2026-04-27","id":"ART-0188","url_forras":"talalt","kivonat":"A megszólaltatott szakértők szkeptikusan nyilatkoztak a Tisza Párt tervéről, hogy június 1-től megtiltaná az EU-n kívüli vendégmunkások „tömeges behozatalát”, helyettük 400 ezer inaktív munkaerőpiaci integrációját tűzte ki célul . Mihályi Magdolna, a Jobtain ügyvezetője szerint a valóban megbízhatóan foglalkoztatható tartalék az említett keret 8-10 százaléka, Scharle Ágota kutató szerint a legtöbb érintett csak hosszabb távon és jelentős állami befektetések árán integrálható. Nógrádi József, a Trenkwalder kereskedelmi igazgatója és Gáspár Gergely, a Gi Group szakértője hangsúlyozza: a vendégmunkásokra nemcsak mennyiségi, hanem minőségi hiány miatt is szükség van – különösen a most beinduló nagy gyárak, köztük a CATL, az EV Power és a BYD mellett kiépülő beszállítói láncokban, amelyek munkaerőigénye belföldi vándorlással sem lesz kielégíthető."},{"cim":"Hivatalos: itt a legnagyobb a fizetés Magyarországon a fizikai dolgozóknak, kiderültek a forintra pontos órabérek","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/04/fizetes-magyarorszag-fizikai-dolgozok-oraberek","forras":"Világgazdaság","datum":"2026-04-27","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder 7 ezer fizikai dolgozó adatait feldolgozó elemzése szerint a szak- és betanított munkások átlagos bruttó órabére 2390 forint volt, 6,2%-kal magasabb, mint egy évvel korábban, de lassuló ütemben.","kulcsszavak":["Trenkwalder","bérek","toborzás"],"het":"2026-04-27","id":"ART-0189","url_forras":"docx","kivonat":"A Trenkwalder 7 ezer fizikai dolgozó adatát feldolgozó elemzése szerint 2026 első negyedévében a szak- és betanított munkások átlagos bruttó órabére 2390 forint volt – 6,2 százalékkal több, mint egy évvel korábban, de a korábbi 9,1 százalékos ütemhez képest érzékelhető lassulással. Hamrák Viktor szolgáltatási igazgató szerint a gazdaság érdemi élénkülése előtt ennél dinamikusabb béremelésre nem számíthat a munkavállalók 64 százaléka, aki elégedetlen a jelenlegi mértékkel. Regionálisan nagy a szóródás: Közép-Magyarországon 3200, Észak-Magyarországon csupán 2020 forint az órabér-átlag. A középvezetői körben az RSM Hungary 8,9 százalékos bérnövekedést mért – a bértranszparencia-felkészülés egyszeri hatásának köszönhetően."},{"cim":"Kiürülnek az irodák? Új korszak jön, és nem minden cég éli túl","url":"https://www.economx.hu/ingatlan/2026/04/30/irodapiac-budapest-atalakulas/","forras":"Economx","datum":"2026-04-30","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad kutatása szerint a cégek 26%-a létszámbővítést, 29%-a csökkentést tervez; a rugalmas, jó munkahelyi környezet ma alapelvárás, Budapesten az irodaállomány üresedési rátája 12-13%.","kulcsszavak":["Randstad","foglalkoztatottság","rugalmas foglalkoztatás"],"het":"2026-04-27","id":"ART-0190","url_forras":"talalt","kivonat":"A Randstad kutatása szerint a cégek 26 százaléka létszámbővítést tervez, 29 százalékuk csökkentéssel számol – a munkahelyi környezet és légkör egyre fontosabb döntési tényező. Baja Sándor, a Randstad ügyvezetője szerint a rugalmasság ma már alapelvárás, és a szép iroda nem presztízskérdés, hanem a visszacsábítás egyik legfőbb eszköze – főleg, hogy Budapesten az irodaállomány üresedési rátája 12-13 százalék. A vállalatok rövidebb, rugalmasabb bérleti megoldásokat keresnek, míg az egységes irodahasználati szabályok kialakítása – különösen a több ügyfelet kiszolgáló szolgáltató központoknál – gyakorlatilag lehetetlenné vált."},{"cim":"Több cég is lépett a Tisza által beígért vendégmunkásstop előtt","url":"https://www.hrportal.hu/hr/tobb-ceg-is-lepett-a-tisza-altal-beigert-vendegmunkasstop-elott-20260428.html","forras":"HR Portál","datum":"2026-04-28","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC és a Man at Work szerint óvatos újraindulás érzékelhető a munkaerőpiacon; a vendégmunkásstop ígérete felgyorsított néhány céget a harmadik országbeli toborzás előrehozásában, jellemzően kisebb létszámigényekkel.","kulcsszavak":["WHC","vendégmunka","toborzás","foglalkoztatottság"],"het":"2026-04-27","id":"ART-0191","url_forras":"talalt","kivonat":"A WHC és a Man at Work szakértői szerint óvatos újraindulás érzékelhető a munkaerőpiacon – fizikai munkakörökben váratlan létszámigények jelentek meg, szellemi területen pedig befagyasztott keresések indultak újra, de nagy áttörés egyelőre nincs. A Tisza vendégmunkás-stop ígérete felgyorsított néhány döntést: cégek előrehozták a harmadik országbeli toborzást, jellemzően kisebb, 5-10 fős igényekkel. A WHC szerint Magyarországon arányaiban még mindig kevés a vendégmunkás – a 90 ezer fővel szemben Ausztriában 980 ezer külföldi dolgozik –, de üdvözölnék a keretrendszer megtisztítását, hogy csak tényleges munkaerőhiányos pozíciókban, tisztességes keretek között foglalkoztassanak külföldiek."},{"cim":"„Ma már a munkaerőhiány jelöli ki az irányokat” – Berta Péter (WHC) a régiós munkaerőpiacról","url":"https://www.hrportal.hu/hr/ma-mar-a-munkaerohiany-jeloli-ki-az-iranyokat-berta-peter-whc-a-regios-munkaeropiacrol-20260429.html","forras":"HR Portál","datum":"2026-04-29","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Berta Péter, a WHC ügyvezetője szerint a kelet-közép-európai munkaerőpiac elérte teljesítőképessége határát; Magyarországon 2030-ig 300 ezerrel csökkenhet a munkaerő-kínálat, ma már nem a tőke, hanem a munkaerő dönti el egy beruházás sorsát.","kulcsszavak":["WHC","munkaerőhiány","régiós különbségek"],"het":"2026-04-27","id":"ART-0192","url_forras":"docx","kivonat":"Berta Péter, a WHC Csoport nemzetközi terjeszkedésért felelős ügyvezetője szerint a kelet-közép-európai munkaerőpiac elérte teljesítőképessége határát – a WHC által lefedett tíz országban 1 millió fővel csökkenhet a munkaerő-kínálat a következő években, Magyarországon 2030-ig mintegy 300 ezerrel. A szakértő szerint ma már nem a tőke, hanem a rendelkezésre álló munkaerő dönti el egy beruházás sorsát. A megoldás több lábon áll: automatizáció, a hazai tartalékok – nyugdíjasok, diákok, részmunkaidősök – tudatosabb bevonása, és ahol ezek elfogynak, ott harmadik országbeli munkavállalók alkalmazása. Berta figyelmeztet: a külföldi munkaerő nélkül olyan vállalatok is elhagyhatják a régiót, amelyek jelenleg épp a biztosítható létszám miatt maradnak."},{"cim":"A bérnél sokkal nagyobb probléma tizedeli a munkaerőállományt","url":"https://profitline.hu/a-bernel-sokkal-nagyobb-problema-tizedeli-a-munkaeroallomanyt-486196","forras":"Profitline","datum":"2026-04-28","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szerint 2026-ra a munkaerő-megtartás legnagyobb akadálya nem a bér, hanem a kiégés – a „láthatatlan fluktuáció” miatt a munkavállalók egyszerűen kilépnek a túlterhelő munkakörnyezetből; a megoldás a megelőzésben rejlik.","kulcsszavak":["WHC","mentális egészség","megtartás"],"het":"2026-04-27","id":"ART-0193","url_forras":"docx","kivonat":"A WHC Csoport szakértői szerint 2026-ra a munkaerő-megtartás egyik legnagyobb akadályává nem a bér, hanem a kiégés vált – Horváth Ágnes, a WHC Heads üzletágvezetője ezt „láthatatlan fluktuációnak” nevezi: az érintett munkavállalók nem magasabb fizetésért mennek máshova, hanem egyszerűen kilépnek a túlterhelő munkakörnyezetből. A megoldás a megelőzésben rejlik – rugalmas munkavégzés, pszichológiai tanácsadás és támogató szervezeti kultúra formájában –, amelyek a WHC tapasztalatai szerint nemcsak munkavállalói elégedettséget, hanem mérhető üzleti eredményeket is hoznak."},{"cim":"A motivációm, hogy minél több elégedett ügyfelünk legyen, és közösen tudjunk sikeresek lenni","url":"https://e.pcloud.link/publink/show?code=XZdhtiZFmOWSJGTYAbzmoKBYa8Y3pCitx6k","forras":"Dél-Dunántúli Gazdaság","datum":"2026-05-08","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"Kutyáncsánin Jevrem, a Prohuman cégcsoporthoz tartozó HR-Rent Kft. ügyvezetője az alapító Feleki Attila halála után vette át a céget; kiemelte a Pécsi Tudományegyetemmel 2023 óta fennálló stratégiai partnerséget.","kulcsszavak":["HR-Rent","politika","képzés"],"het":"2026-05-04","id":"ART-0194","url_forras":"docx","kivonat":"Kutyáncsánin Jevrem, a Prohuman cégcsoporthoz tartozó HR-Rent Kft. ügyvezetője az alapító, Feleki Attila halála után vette át a cég irányítását – az átállás zökkenőmentes volt, mivel az alapító már 2023 óta fokozatosan készítette fel a menedzsmentet. Az ügyvezető szerint a siker kulcsa a bizalomra épülő, bevonó szervezeti kultúra és az ügyfélközpontú tanácsadói szemlélet. Kiemelt büszkeség számára, hogy a Prohuman cégcsoport 2023 óta stratégiai partnere a Pécsi Tudományegyetemnek – a Közgazdaságtudományi Karon tanszéket is visznek, céljuk a hallgatók munkaerőpiaci felkészítése. A jövőre vonatkozóan a Dél-Dunántúl gazdasági fellendülésében bízik, és hosszú távú stabilitást szeretne biztosítani minden partnerének."},{"cim":"Felfüggeszthetik a vendégmunkás engedélyeket – reagált egy munkaerőkölcsönző cég","url":"https://www.portfolio.hu/befektetes/20260505/felfuggeszthetik-a-vendegmunkas-engedelyeket-reagalt-egy-munkaerokolcsonzo-ceg-834762","forras":"Pénzcentrum","datum":"2026-05-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Pensum munkaerőkölcsönző üdvözli a vendégmunkás-engedélyek felülvizsgálatát, hangsúlyozva, hogy dolgozóinak többsége magyar állampolgár; a cég nem lát érdemi kockázatot a várható változásokban.","kulcsszavak":["Pensum Group","vendégmunka","munkajog","munkaerő-kölcsönzés"],"het":"2026-05-04","id":"ART-0195","url_forras":"docx","kivonat":"A BÉT-en jegyzett Pensum munkaerőkölcsönző közleményben reagált a vendégmunkás-engedélyek várható felfüggesztésére: a cég üdvözli a szabályozás felülvizsgálatát, és bízik abban, hogy az új keret a munkaerőpiaci realitásokat is figyelembe veszi. A Pensum hangsúlyozza, hogy munkavállalóinak túlnyomó többsége magyar állampolgár, és elsődleges célja a hazai munkaerő foglalkoztatása – ahol pedig nem áll rendelkezésre megfelelő magyar munkaerő, ott a jövőbeni szabályozás várhatóan továbbra is lehetővé teszi a külföldi munkavállalók alkalmazását. A cég összességében nem lát érdemi kockázatot a változásokban, és középtávon is biztosítottnak tartja a stabil működés feltételeit."},{"cim":"Kapitány István három hónapon belül érezhető javulást ígér a magyar gazdaságban","url":"https://index.hu/gazdasag/2026/05/02/kapitany-istvan-tisza-part-gazdasag-novekedes-valtozasok-tervek-tisza-kormany-2026-vendegmunkasok/","forras":"Index","datum":"2026-05-02","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Kapitány István leendő gazdasági miniszter a korrupció visszaszorítását, június 1-től a vendégmunkás-behozatal felfüggesztését és a multitámogatások felülvizsgálatát nevezte kiemelt intézkedésnek.","kulcsszavak":["politika","vendégmunka","gazdasági kilátások"],"het":"2026-04-27","id":"ART-0196","url_forras":"docx","kivonat":"Kapitány István leendő gazdasági és energetikai miniszter szerint a Tisza-kormány első három hónapjában már érezhető irányváltást ígér, bár a teljes gazdasági helyreállítás hosszabb folyamat. Kiemelt intézkedések közé sorolja a korrupció visszaszorítását és a túlárazott közpénzköltések azonnali felülvizsgálatát, június 1-jétől a vendégmunkások behozatalának felfüggesztését és a vonatkozó szabályozás újragondolását, valamint a multiknak fizetett támogatások keretrendszerének felülvizsgálatát. A kkv-k fejlesztése és a bürokrácia csökkentése szintén szerepel a tervek között."},{"cim":"Káosz jöhet? Az új kormány vendégmunkás-tilalma igazi gyomros a mezőgazdaságnak","url":"https://www.agrarszektor.hu/vallalkozas/20260508/kaosz-johet-az-uj-kormany-vendegmunkas-tilalma-igazi-gyomros-a-mezogazdasagnak-62004","forras":"Agrárszektor","datum":"2026-05-08","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az agrárszereplők szerint a vendégmunkás-tilalom súlyosan érintheti a mezőgazdaságot, mert a hajtatókertészet és az állattenyésztés egyes területein ma is csak harmadik országbeliekkel lehet hatékonyan termelni.","kulcsszavak":["agrárium","vendégmunka","munkajog"],"het":"2026-05-04","id":"ART-0197","url_forras":"docx","kivonat":"A Tisza-kormány vendégmunkás-tilalma különösen súlyosan érintheti a mezőgazdaságot – az ágazati szereplők egybehangzóan figyelmeztetnek: a hajtatókertészetek, az állattenyésztés és a feldolgozóipar egyes területein már ma is csak harmadik országbeli munkavállalókkal – jellemzően filipínókkal – lehet hatékonyan termelni. Nagypéter Sándor, a DélKerTÉSZ elnök-ügyvezetője szerint teljes káosz fenyeget, ha nullára csökkentik a kvótát, különösen azért, mert az idén lejáró engedélyek megújítása is ellehetetlenülhet, veszélybe sodorva a 2027-es termelést. Apáti Ferenc, a FruitVeB elnöke rámutat: a hajtatókertészet épp a legversenyképesebb szegmens, amelyet az intézkedés a leginkább sújt. Az ágazati képviselők egyeztetést sürgetnek a leendő agrár- és gazdasági miniszterrel, és azt kérik, hogy a mezőgazdaság kivételes elbánásban részesüljön."},{"cim":"Diákmunka: már az egyetem alatt eldőlhet, ki kap később jó állást","url":"https://magyarnemzet.hu/gazdasag/2026/05/diakmunka-tapasztalat-munkaeropiaci-ervenyesules","forras":"Magyar Nemzet","datum":"2026-05-06","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Mind-Diák Szövetkezet vezetője szerint a diákmunka során szerzett tapasztalat sokszor fontosabb a diplománál; a 25 év alattiak havi bruttó 715 765 forintig szja-mentesen kereshetnek diákmunkából.","kulcsszavak":["diákmunka","pályakezdők","adózás","képzés"],"het":"2026-05-04","id":"ART-0198","url_forras":"docx","kivonat":"Göbl Róbert, a Mind-Diák Szövetkezet vezetője szerint a sikeres pályakezdést ma már nem csupán a diploma határozza meg – a próbaidőszak alatt a szorgalom és a gyakorlati készségek sokszor fontosabbak a papírnál. Azok a fiatalok, akik már az egyetemi éveik alatt munkatapasztalatot szereznek, érzékelhető előnnyel indulnak, és a cégek sokszor főállásban is tovább foglalkoztatják a bevált diákokat. A legnépszerűbb érettségi nélkül végezhető pozíciók a kereskedelmi és vendéglátóipari munkák, a 25 év alattiak számára pedig havi bruttó 715 765 forintig szja-mentes a diákmunkából származó kereset. A nyári szezonra érdemes már most jelentkezni – a legjobb pozíciók néhány nap alatt elkelnek."},{"cim":"Munkaerőhiány és stabilitás: Új utak a foglalkoztatási stratégiában","url":"https://hrpwr.hu/cikk/munkaerohiany-es-stabilitas-uj-utak-a-foglalkoztatasi-strategiaban","forras":"HRPWR","datum":"2026-05-05","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Pannon-Work szerint a megváltozott munkaképességű munkavállalók foglalkoztatása egyre inkább tudatos HR-stratégia; a rehabilitációs hozzájárulás 2026-ban 2,9 millió forint/fő/év, ami erős pénzügyi ösztönző.","kulcsszavak":["Pannon-Work","esélyegyenlőség","munkáltatói márka"],"het":"2026-05-04","id":"ART-0199","url_forras":"docx","kivonat":"A Pannon-Work tapasztalatai szerint a megváltozott munkaképességű munkavállalók foglalkoztatása egyre inkább tudatos HR-stratégiává válik, nem csupán jogszabályi kötelezettség. A rehabilitációs hozzájárulás 2026-ban 2,9 millió forint/fő/év – ez az elmúlt öt évben közel a duplájára nőtt, ami erős pénzügyi ösztönzőt jelent a munkáltatók számára. A foglalkoztatottsági arány ebben a csoportban még mindig 50% alatt van, miközben a növekedés akár 150%-os is lehet az elmúlt években. A Pannon-Work a fizetett cikkben rámutat: sok munkáltatónál már most dolgoznak olyan alkalmazottak, akik megváltozott munkaképességű státuszra lennének jogosultak, ez azonban nincs feltérképezve – ami egyben kiaknázatlan HR-potenciált is jelent."},{"cim":"Itt vannak az első adatok, óriási fordulatot hozott a vállalati kilátásokban is a Tisza Párt választási győzelme","url":"https://www.portfolio.hu/gazdasag/20260507/itt-vannak-az-elso-adatok-oriasi-fordulatot-hozott-a-vallalati-kilatasokban-is-a-tisza-part-valasztasi-gyozelme-835212","forras":"Portfolio","datum":"2026-05-07","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A DUIHK felmérése szerint a Tisza Párt győzelme után a javuló kilátásokat váró cégek aránya 7%-ról 42%-ra ugrott; a 2200 német cég legfőbb elvárása az oktatás minőségének javítása és a korrupció visszaszorítása.","kulcsszavak":["munkáltatói szövetség","politika","gazdasági kilátások","régiós különbségek"],"het":"2026-05-04","id":"ART-0200","url_forras":"docx","kivonat":"A Német-Magyar Ipari és Kereskedelmi Kamara (DUIHK) villámfelmérése szerint a Tisza Párt választási győzelme látványos bizalmi sokkot hozott: a javuló gazdasági kilátásokat váró vállalatok aránya 7%-ról 42%-ra ugrott, az országot befektetési helyszínként újra választanák aránya 77%-ról 87%-ra nőtt. A tényleges gazdasági helyzet azonban nem változik hirtelen – a strukturális kihívások, így a munkaerőhiány, az emelkedő bérköltségek (2026-ban átlagosan 6,5%-os növekedés várható) és az intézményi kiszámíthatóság hiánya, csak hosszabb idő alatt orvosolhatók. A 2200 magyarországi német cég – amelyek 230 ezer embert foglalkoztatnak – legfőbb elvárása az új kormánytól az oktatás minőségének javítása, a kkv-támogatás erősítése és a korrupció visszaszorítása. Az euró bevezetését a vállalatok 75%-a kívánatosnak tartja."},{"cim":"Az IT munkaerőpiac kilábalása állandó délibáb lett","url":"https://www.hwsw.hu/podcast/70542/kraftie-it-informatikai-karrier-2026-munkaeropiac-trendek-ai-berek.html","forras":"HWSW","datum":"2026-05-08","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Kraftie podcast szerint az újonnan felvett IT-sok akár 30%-kal kevesebbet kapnak, mint korábban a meglévő állomány, ami ütközik a bértranszparencia-irányelvvel; terjed az „AI-natív” munkakör fogalma is.","kulcsszavak":["IT","bértranszparencia","AI"],"het":"2026-05-04","id":"ART-0201","url_forras":"docx","kivonat":"A podcastban két meghatározó munkaerőpiaci trendet jártak körül. Az egyik, hogy míg 2020-2022 között az új belépőket magasabb fizetéssel csábították a cégekbe, mint a meglévő állomány, most az újonnan felvetteknek akár 30 százalékkal kevesebbet ajánlanak, miközben a követelmények nőttek. Ez a tendencia közvetlenül ütközik a júniustól életbe lépő uniós bértranszparencia-irányelvvel, amelynek magyar jogszabályi háttere azonban még mindig hiányzik. A másik nagy téma az AI hatása a felvételi folyamatokra: egyre több cégnél mérik az AI-használat költségét szemben az emberi munkaerő árával, és megjelent az „AI-natív” munkakör fogalma, ahol a mérnök nem kódot ír, hanem agenteket menedzsel."},{"cim":"Van egy varázs összeg, ami felett a magyarok boldogan maradnak a munkahelyükön: kiderült, mi még az elvárás","url":"https://www.penzcentrum.hu/karrier/20260507/van-egy-varazs-osszeg-ami-felett-a-magyarok-boldogan-maradnak-a-munkahelyukon-kiderult-mi-meg-az-elvaras-1198237","forras":"Pénzcentrum","datum":"2026-05-07","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az OTP Bank cafeteria-kutatása szerint a béren kívüli juttatásban részesülők 58%-a elégedett munkahelyével, szemben a nem juttatottak 37%-ával; az átlagos keretösszeg 245 ezer forint volt 2025-ben.","kulcsszavak":["adózás","megtartás"],"het":"2026-05-04","id":"ART-0202","url_forras":"docx","kivonat":"Az OTP Bank 2025-ös cafeteria kutatása szerint a béren kívüli juttatásban részesülő munkavállalók 58%-a elégedett munkahelyével, szemben a juttatást nem kapók 37%-ával – és váltási szándékuk is alacsonyabb (13% versus 20%). A munkavállalók 74%-a a munkáltatói megbecsülés egyik legerősebb jelének tartja a cafeteriát, nem egyszerű bérpótléknak. Az átlagos keretösszeg 245 ezer forint volt 2025-ben, de az elégedettség évi 300 ezer forint felett javul érzékelhetően – de fontos a rugalmasság és a személyre szabhatóság is. A juttatásban részesülők aránya 71% volt, a 250 főnél nagyobb cégeknél azonban 82%, a kisebbeknél csak 56%."},{"cim":"Csökkent a szegénység kockázata a magyar adatok szerint","url":"https://infostart.hu/gazdasag/2026/05/07/csokkent-a-szegenyseg-kockazata-a-magyar-adatok-szerint","forras":"InfoStart","datum":"2026-05-07","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH és EU-SILC adatai szerint 2010 és 2024 között az AROPE-mutatóval érintettek száma közel 40%-kal csökkent, a súlyos anyagi depriváció 23,4%-ról 8,5%-ra esett, de a relatív jövedelmi szegénység 15 éve stagnál.","kulcsszavak":["demográfia","KSH"],"het":"2026-05-04","id":"ART-0203","url_forras":"docx","kivonat":"A KSH és az EU-SILC adatai szerint Magyarországon 2010 és 2024 között az AROPE-mutatóval érintettek – tehát a szegénység vagy társadalmi kirekesztődés kockázatának kitettek – száma közel 40 százalékkal, 1,27 millió fővel csökkent. A legnagyobb javulás a súlyos anyagi deprivációban látható: az arány 23,4%-ról 8,5%-ra esett, a nagyon alacsony munkaintenzitású háztartásban élők aránya pedig 12,8%-ról 4,1%-ra. A javulás mögött a foglalkoztatás bővülése, a minimálbér-emelések és a családtámogatások együttes hatása áll. A relatív jövedelmi szegénységi ráta ugyanakkor makacs mutató – 15 éve nagyjából 14% körül stagnál –, mert ha a bérek széles körben emelkednek, a medián is feljebb kerül, így az arány nem javul automatikusan."},{"cim":"Bértranszparencia-irányelv: Csúszásban az uniós határidő, mit tegyenek a magyar cégek?","url":"https://profitline.hu/bertranszparencia-iranyelv-csuszasban-az-unios-hatarido-mit-tegyenek-a-magyar-cegek-486435","forras":"Profitline","datum":"2026-05-05","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Csúszik a bértranszparencia-irányelv június 7-i életbe lépése Magyarországon; az EY és a Trenkwalder arra ösztönzi a cégeket, hogy ettől függetlenül kezdjék meg a felkészülést, mert csökkenti a fluktuációt.","kulcsszavak":["Trenkwalder","bértranszparencia"],"het":"2026-05-04","id":"ART-0204","url_forras":"talalt","kivonat":"Biztosan csúszik Magyarországon a bértranszparencia-irányelv június 7-i életbe lépése, mivel az előző kormány tétlensége, a kormányváltás és az átmeneti időszak miatt nem születik meg időben a végleges jogszabály. Az EY és a Trenkwalder közleménye arra ösztönzi a cégeket, hogy ettől függetlenül kezdjék meg a felkészülést. Nógrádi József, a Trenkwalder stratégiai igazgatója hangsúlyozza: az átlátható bérstruktúra nem csak adminisztratív kötelezettség, hanem csökkenti a fluktuációt és tervezhetőbbé teszi a bérköltségeket is. Dr. Piskóti Adrienn, az EY Law senior menedzsere figyelmeztet: a magyar bíróságok már most kötelesek a hatályos jogot az irányelv céljaival összhangban értelmezni."},{"cim":"Fordulat a magyar munkaerőpiacon: megtört a sokéves tendencia, ők lettek a bérrendezések igazi nyertesei","url":"https://www.penzcentrum.hu/karrier/20260505/fordulat-a-magyar-munkaeropiacon-megtort-a-sokeves-tendencia-ok-lettek-a-berrendezesek-igazi-nyertesei-1198077","forras":"Pénzcentrum","datum":"2026-05-05","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder és az RSM adatai szerint idén a szellemi dolgozók bére 8,9%-kal, a fizikai munkavállalóké csak 6,2%-kal nőtt – ez a koronavírus előtti időszak óta nem látott fordulat a bérrendezésekben.","kulcsszavak":["Trenkwalder","bérek","toborzás","kutatás és statisztika"],"het":"2026-05-04","id":"ART-0205","url_forras":"docx","kivonat":"A Trenkwalder és az RSM Hungary adatai szerint idén megtört egy évek óta tartó tendencia: az első negyedévben a magasabb jövedelmű szellemi dolgozók bére 8,9 százalékkal nőtt, míg a fizikai munkavállalóké csak 6,2 százalékkal – ez a koronavírus előtti időszak óta nem látott fordulat. Nógrádi József, a Trenkwalder stratégiai igazgatója szerint az elmúlt években a munkaerőhiány és a minimálbér-emelések törvényszerűen a fizikai dolgozóknak kedveztek, idén azonban a bértranszparencia-felkészülés és a leépítésekből felszabaduló bértömeg a magasabb kategóriákat emelte meg. Trendfordulóról még korai beszélni – a Tisza-kormány tervezett adócsökkentései a közeljövőben ismét az alacsonyabb bérkategóriák helyzetén javíthatnak."},{"cim":"Nemcsak a munkát, a mindennapi életünket is átalakítja az MI","url":"https://autopro.hu/tema/podcast/1139669","forras":"Autopro","datum":"2026-05-07","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Az Integrator FM podcastban Nógrádi József, a Trenkwalder stratégiai igazgatója arról beszélt, hogyan alakítja át az AI és a robotika a munkaerőpiacot és a mindennapi életet, a humanoid robotok társadalmi szerepét is érintve.","kulcsszavak":["Trenkwalder","AI","automatizáció"],"het":"2026-05-04","id":"ART-0206","url_forras":"docx","kivonat":"Az Integrator FM podcast május 14-i epizódjában Nógrádi József, a Trenkwalder stratégiai igazgatója és Barta Balázs, a Pannon Business Network ügyvezetője arról beszélget, hogyan alakítja át az AI és a robotika a munkaerőpiacot és a mindennapi életet. A humanoid robotok témája is terítékre kerül – nemcsak technológiai újdonságként, hanem társadalmi szerepük szempontjából is: Barta Balázs egy olyan robotfejlesztésről is szól, amely a magány enyhítését és az emberek társasági életbe való visszavezetését célozza."},{"cim":"Újra meg kell tanulnunk tanulni","url":"https://e.pcloud.link/publink/show?code=XZSstiZ0BCLBpOXAV8sddmCOpe4nHVLrtpy","forras":"Népszava","datum":"2026-05-08","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder stratégiai igazgatója szerint az MI korában a tanulási képesség felértékelődik; a WEF előrejelzése szerint 2030-ig 92 millió munkahely szűnik meg, de 170 millió új jön létre.","kulcsszavak":["Trenkwalder","képzés","kutatás és statisztika"],"het":"2026-05-04","id":"ART-0207","url_forras":"docx","kivonat":"Nógrádi József, a Trenkwalder stratégiai igazgatója a Népszavának adott interjúban rámutatott: az MI korában a magas szintű alaptudás és a tanulás képessége felértékelődik – nemcsak a pályakezdők, hanem az évtizedek óta munkában lévők számára is újra meg kell tanulni tanulni. A WEF előrejelzése szerint 2030-ig globálisan 92 millió munkahely szűnik meg, de 170 millió új jön létre – csakhogy ezek 95 százalékához mesterfokú vagy doktori végzettség kell, miközben a hazai foglalkoztatottak alig 30 százaléka rendelkezik felsőfokú diplomával. Nógrádi szerint az évtized végére párhuzamosan lesz jelen a szakemberhiány és a tömeges munkanélküliség, ha az oktatás és a munkaerőpiac nem reagál időben."},{"cim":"Kiderült, kik Magyarország legvonzóbb munkáltatói","url":"https://mfor.hu/cikkek/vallalatok/kiderult-kik-magyarorszag-legvonzobb-munkaltatoi.html","forras":"MFOR","datum":"2026-05-07","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"A Randstad munkáltatói márkakutatása szerint a legvonzóbb hazai munkáltató a LEGO, a Deutsche Telekom IT Solutions és a BMW Manufacturing Hungary követi; a fizetés a legfontosabb, de csak 43% elégedett vele.","kulcsszavak":["Randstad","munkáltatói márka","ipar","bérek"],"het":"2026-05-04","id":"ART-0208","url_forras":"talalt","kivonat":"A Randstad 2026-os munkáltatói márkakutatása szerint a legvonzóbb hazai munkáltató a LEGO, a második a Deutsche Telekom IT Solutions, a harmadik a BMW Manufacturing Hungary. A magyarok legfontosabb munkahelyválasztási szempontjai: fizetés és juttatások (68%), kellemes légkör (63%), munkahely biztonsága (62%), munka-magánélet egyensúlya (60%) és – újdonságként a top 5-ben – karrierépítés (42%). A legnagyobb feszültség a fizetésnél mutatkozik: bár ez a legfontosabb elvárás, csak a munkavállalók 43 százaléka elégedett jelenlegi munkaadójával ezen a téren. A váltási szándék stabil – 30 százalék tervez munkahelyet változtatni a következő fél évben –, a home office stabilizálódott, és a benefitrendszer is átalakulóban van: a munkavállalók ma már időt, rugalmasságot és egészségtámogatást várnak, nem csupán cafeteria-kereteket."},{"cim":"WHC: Legalább 30 százalékkal több ember kellene a vendéglátásba","url":"https://ado.hu/munkaugyek/whc-legalabb-30-szazalekkal-tobb-ember-kellene-a-vendeglatasba/","forras":"Adó Online","datum":"2026-05-08","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC elemzése szerint a vendéglátó szektor munkaerőigénye tavasszal-nyáron 30%-kal ugrik meg; a bérek is emelkedtek, szakácsoknál elérhetik a 900 ezer forintot, de a minőségi szállás biztosítása is kulcskérdés.","kulcsszavak":["WHC","turizmus","szezonális munka","bérek"],"het":"2026-05-04","id":"ART-0209","url_forras":"talalt","kivonat":"A WHC elemzése szerint a vendéglátó szektor munkaerőigénye tavasszal-nyáron 30 százalékkal ugrik meg – a hiány felszolgálóktól a szakácsokon át a szobalányokig minden kulcspozícióban érezhető. A bérek tovább emelkedtek: egy betanított pozícióban 450–550 ezer forint a bruttó átlag, szakképzett munkavállalóknál – például szakácsoknál – ez elérheti a 900 ezret. A bér azonban már önmagában nem elég: a vidéki és balatoni helyszíneken szinte alapfeltétellé vált a minőségi szállás és étkezés biztosítása. Gyarmati Szilvia, a WHC Work üzletágvezetője szerint a szezon sikere az integrált toborzási és megtartási stratégián múlik – a diákok és külföldi munkaerő tudatos bevonása nélkül a szezonális csúcsok kezelése ma már elképzelhetetlen."},{"cim":"Nem elég a munkaerő – kell a tudás is: merre tart Szeged és a régió munkaerőpiaca a nagyberuházási boomban?","url":"https://profitline.hu/nem-eleg-a-munkaero-kell-a-tudas-is-merre-tart-szeged-es-a-regio-munkaeropiaca-a-nagyberuhazasi-boomban-486786","forras":"Profitline","datum":"2026-05-14","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman szegedi Regionális Gazdasági Fórumán Göndöcs Viktor vezérigazgató és Major Gábor stratégiai igazgató rámutatott: évente 50 ezerrel csökken a hazai munkaerő-kínálat, miközben Magyarország az EU utolsó helyén áll a felnőttkori tanulási hajlandóság terén.","kulcsszavak":["munkaerőhiány"],"het":"2026-05-11","id":"ART-0210","url_forras":"docx","kivonat":"A Prohuman szegedi Regionális Gazdasági Fórumának előadói rámutattak: a régióba érkező nagyberuházások magasan képzett technikusokat és mérnököket igényelnek – miközben a vállalatok 80 kilométeres körzetben sem találnak hegesztőt sem. Göndöcs Viktor, a Prohuman vezérigazgatója szerint a makroadatok és a vállalati valóság között jelentős eltérés van. Major Gábor stratégiai igazgató három kihívást azonosított: évente 50 ezerrel csökken a hazai munkaerő-kínálat, globálisan egyre több digitálisan versenyképes diplomás lép piacra, és az AI csökkenti a keresletet a közepes képzettségűek iránt – miközben Magyarország az EU utolsó helyén áll a felnőttkori tanulási hajlandóság terén. Az eseményen beszámoltak tapasztalataikról olyan nagyvállalatok képviselői, mint a Contifluid és a Vulcan Shield, valamint az egyetem és a város képviselő is, a Prohuman szerbiai munkatársa pedig a határon túli munkaerő-tartalék kimerüléséről számolt be.\n\nTovábbi megjelenések eddig: HR Portál, HRPOWER, Adó Online, Store Insider, Rádió 88 Szeged."},{"cim":"Másodszor rendezik meg a katolikus oktatási innovációs konferenciát, ezúttal Budapesten","url":"https://www.magyarkurir.hu/hirek/masodszor-rendezik-meg-katolikus-oktatasi-innovacios-konferenciat-ezuttal-budapesten","forras":"Magyar Kurír","datum":"2026-05-11","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prohuman Learning Solutions és partnerei május 19-én rendezik meg másodszor a Lumen Educationis Katolikus Oktatási Innovációs Konferenciát Budapesten, az iskola és a munkaerőpiac közötti párbeszéd témájában.","kulcsszavak":["képzés"],"het":"2026-05-11","id":"ART-0211","url_forras":"docx","kivonat":"A Szent Mihály Intézményfenntartó, az Apor Vilmos Főiskola és a Prohuman Learning Solutions május 19-én rendezi meg másodszor a Lumen Educationis Katolikus Oktatási Innovációs Konferenciát Budapesten. Az idei fő téma a hivatás és tanulás – konkrétan az iskola és a munkaerőpiac közötti párbeszéd –, amelyet plenáris előadások, szekciók és egy munkáltatók, illetve diákok részvételével zajló kerekasztal-beszélgetés jár körül. A napot a Katolikus Innovációs Díj átadója zárja."},{"cim":"Külföldi dolgozók nélkül bajba kerülhet az agrárium?","url":"https://mezohir.hu/2026/05/15/mezogazdasag-kell-kulfoldi-munkaero/","forras":"Mezőhír","datum":"2026-05-15","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Az agrárminiszter szerint a tervezett vendégmunkás-szabályozás nem teljes tiltás, hanem újraszabályozás; egyes ágazatokban, mint az állattenyésztés és a zöldségtermesztés, a harmadik országbeli munkaerő továbbra is engedélyezett marad.","kulcsszavak":["vendégmunka","agrárium","munkajog"],"het":"2026-05-11","id":"ART-0212","url_forras":"docx","kivonat":"Bóna Szabolcs agrárminiszter szerint a tervezett vendégmunkás-szabályozás nem teljes tiltást jelent, hanem a rendszer újraszabályozását – a moratórium nagyjából egy hónapig tarthat. Azokban az ágazatokban, ahol nincs más megoldás – állattenyésztés, zöldség- és gyümölcstermesztés, élelmiszeripar –, a harmadik országbeli munkavállalók alkalmazása a jövőben is lehetséges marad. A cél a visszaélések visszaszorítása: a miniszter szerint több helyen, főként gyárakban a külföldi munkaerőt bérek alacsonyan tartására használták, nem valódi munkaerőhiány pótlására.\n\nA Mi Hazánk támogatja a vendégmunkás-import leállítását, de a kirúgott magyarokat is kártalanítaná [URL: https://magyarjelen.hu/belfold/31389-a-mi-hazank-tamogatja-a-vendegmunkas-import-leallitasat-de-a-kirugott-magyarokat-is-kartalanitana-video]"},{"cim":"A Mi Hazánk támogatja a vendégmunkás-import leállítását, de a kirúgott magyarokat is kártalanítaná","url":"https://magyarjelen.hu/belfold/31389-a-mi-hazank-tamogatja-a-vendegmunkas-import-leallitasat-de-a-kirugott-magyarokat-is-kartalanitana-video","forras":"Magyar Jelen","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Mi Hazánk üdvözli a vendégmunkás-stopot, de kártalanítaná azokat a magyar dolgozókat is, akik helyére korábban vendégmunkásokat vettek fel; a párt szerint a bejelentés még nem jelenti a végleges megszüntetést.","kulcsszavak":["politika","vendégmunka","munkajog"],"het":"2026-05-11","id":"ART-0213","url_forras":"docx"},{"cim":"Egyelőre önfeledt vidámság uralkodik a vendégmunkások körében","url":"https://magyarjelen.hu/belfold/31378-egyelore-onfeledt-vidamsag-uralkodik-a-vendegmunkasok-koreben","forras":"Magyar Jelen","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A lap gyöngyösi filippínó vendégmunkások TikTok-videóit ismerteti, amelyek szerint a magyarországi kereset akár háromszoros lehet a fülöp-szigeteki szinthez képest, ingyenes szállással kiegészítve.","kulcsszavak":["vendégmunka","bérek"],"het":"2026-05-11","id":"ART-0214","url_forras":"docx","kivonat":"A Mi Hazánk pártlapja, a Magyar Jelen két cikkben foglalkozik a vendégmunkás-kérdéssel. Lantos János munkaügyi kabinetvezető üdvözli a Tisza-kormány bejelentett stopot, de a párt ennél tovább menne: kártalanítani kellene azokat a magyar dolgozókat is, akik helyére vendégmunkásokat hoztak. A lap gyöngyösi filippínó vendégmunkások TikTok-videóit is ismerteti – a cikk szerint a magyarországi kereset akár háromszoros lehet a fülöp-szigeteki szinthez képest, ingyenes szállással kiegészítve. Lantos figyelmeztet: a Mi Hazánk éber marad, mert a bejelentés még nem jelenti a vendégmunkás-import végleges megszüntetését."},{"cim":"Új korszak jöhet a külföldi munkaerő szabályozásában – mire készülhet a HR?","url":"https://www.hrportal.hu/hr/uj-korszak-johet-a-kulfoldi-munkaero-szabalyozasaban-mire-keszulhet-a-hr-20260512.html","forras":"HR Portál","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A tervezett vendégmunkás-stop komoly felkészülési feladatot ró a HR-területre; a legnagyobb kihívás a bizonytalanság, mert nem ismertek az átmeneti szabályok és a már itt dolgozók sorsa.","kulcsszavak":["vendégmunka","munkáltatói márka","munkajog","gazdasági kilátások"],"het":"2026-05-11","id":"ART-0215","url_forras":"docx","kivonat":"A Tisza-kormány tervezett vendégmunkás-stopja – amely június 1-től korlátozná a harmadik országbeli munkavállalók új belépését – komoly felkészülési feladatot ró a HR-területre. Az Expat-Center relocation szakembere, Cziczárdi Györgyi szerint a legnagyobb kihívás jelenleg a bizonytalanság: nem ismert, milyen átmeneti szabályok lépnek életbe, mi történik a már itt dolgozókkal, és mely engedélytípusok maradnak elérhetők. A változások különösen az ipari, logisztikai és termelési szektorban érinthetik a vállalatokat, és a magasan kvalifikált külföldi szakemberek felvételét is megnehezíthetik. (Támogatott tartalom.)"},{"cim":"A külföldi munkaerő foglalkoztatása: szükségszerűség vagy lehetőség?","url":"https://www.hrportal.hu/hr/a-kulfoldi-munkaero-foglalkoztatasa-szuksegszeruseg-vagy-lehetoseg-20260512.html","forras":"HR Portál","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Egy szakértő szerint a külföldi munkaerő nélkül a magyar gazdaság már nem tud létezni, miközben a hazai arány mindössze 2,4%, szemben az EU-s 8,3%-os átlaggal; transzparensebb szabályozásra és kulturális integrációra van szükség.","kulcsszavak":["vendégmunka","munkajog","munkaerőhiány"],"het":"2026-05-11","id":"ART-0216","url_forras":"docx","kivonat":"Poór József, az MTA doktora és a HSZOSZ elnöke szerint a külföldi munkaerő nélkül a mai magyar gazdaság már nem tud létezni – miközben a hazai arány mindössze 2,4%, az EU-s átlag 8,3%. A munkáltatók szorgalmasabbnak tartják őket a hazai munkavállalóknál. Az új kormányzat számára a fő dilemma a gazdasági szükségszerűség és a közvélemény elvárásai közötti egyensúly – a szerző szerint ehhez transzparensebb szabályozás és tudatos kulturális integráció szükséges."},{"cim":"Dorogon gyűjtöttek muníciót a nők munkaerőpiaci helyzetének javításához","url":"https://www.kemma.hu/helyi-kozelet/2026/05/dorogi-richter-noi-munkavallalo-dorogi-gyogyszergyar","forras":"KEMMA","datum":"2026-05-11","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Az Interreg Duna Program WIN-projektje keretében nemzetközi delegáció látogatott a dorogi Richter gyáregységbe a nők munkaerőpiaci helyzetének javítására szolgáló jó gyakorlatok megosztása céljából.","kulcsszavak":["egészségügy","nők a munkaerőpiacon","képzés"],"het":"2026-05-11","id":"ART-0217","url_forras":"docx","kivonat":"Az Interreg Duna Program által finanszírozott WIN-projekt keretében nemzetközi delegáció látogatott a dorogi Richter Gedeon gyáregységbe, hogy jó gyakorlatokat osszon meg a nők munkaerőpiaci helyzetének javításáról. A projekt ipari-perifériális régiókra – köztük Oroszlányra, Tatabányára és Dorogra – fókuszál, és Bosznia-Hercegovinától Ausztrián át Magyarországig több országot érint. A Richter azért került a látogatók útvonalára, mert a vállalat kiemelt mentorprogramokat, karrierépítési lehetőségeket a nőknek, és részt vesz a Lányok Napján, ahol a tudományos és technológiai pályákat népszerűsíti a fiatal lányok körében."},{"cim":"Gyorskaja vagy gyársor: megnéztük, melyik diákmunka fizet legjobban a térségben","url":"https://www.kemma.hu/helyi-kozelet/2026/05/nyari-diakmunka-fizetesek-oraber-szakmai-lehetoseg","forras":"KEMMA","datum":"2026-05-13","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Komárom-Esztergom megyében a gyártás és logisztika kínálja a legjobb diákmunka-fizetéseket, a 2200 forint feletti órabér ma már nem ritka, gyorséttermekben pótlékokkal akár 3700 forintig is felmehet.","kulcsszavak":["diákmunka","bérek","szezonális munka"],"het":"2026-05-11","id":"ART-0218","url_forras":"docx","kivonat":"Komárom-Esztergom megyében a legjobban fizető pozíciók a gyártásban és a logisztikában vannak a nyári diákmunka-szezonban – a 2200 forint feletti órabér ma már nem ritka, a gyorséttermekben műszakpótlékokkal akár 3700 forintig is felmehet. Wachtler-László Enikő, a Meló-Diák észak-dunántúli irodavezetője szerint a fiatalok ma már nem csak a fizetés alapján döntenek – rugalmasság, hangulat és karrierlehetőség is számít. A legnehezebben feltölthető pozíciók a speciális informatikai vagy szellemi felkészültséget igénylő munkák."},{"cim":"Súlyos kijelentést tett a Tisza szociális minisztere: a közmunkaprogram egyelőre kudarc!","url":"https://www.penzcentrum.hu/gazdasag/20260512/sulyos-kijelentest-tett-a-tisza-szocialis-minisztere-a-kozmunkaprogram-egyelore-kudarc-1198490","forras":"Pénzcentrum","datum":"2026-05-12","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A szociális és családügyi miniszter kudarcnak nevezte a közmunkaprogramot jelenlegi formájában, és bejelentette az Egyenlő Bánásmód Hatóság visszaállítását és egy új esélyegyenlőségi ombudsman létrehozását.","kulcsszavak":["foglalkoztatottság","politika","esélyegyenlőség","gazdasági kilátások"],"het":"2026-05-11","id":"ART-0219","url_forras":"docx","kivonat":"Kátai-Németh Vilmos – azóta beiktatott – szociális és családügyi miniszter a hét elején tartott parlamenti bizottsági meghallgatásán kudarcnak nevezte a közmunkaprogramot jelenlegi formájában, és ígéretet tett a politikai zsarolási gyakorlat felszámolására. Beszélt továbbá a vendégmunkás-beáramlás megakadályozásáról a hazai munkavállalók védelme érdekében, az ipari beruházások – köztük az akkumulátorgyárak – szigorú ellenőrzéséről, illetve a munkajogi szabályozás dolgozóbarát átalakításáról. Megígérte az Egyenlő Bánásmód Hatóság visszaállítását és egy új esélyegyenlőségi ombudsman létrehozását is bejelentette."},{"cim":"Szilícium-völgy keleten? Van még bőven tartalék a három magyar nagyvárosban","url":"https://www.haon.hu/helyi-gazdasag/2026/05/gazdasagfejlesztes-pwc-debrecen-miskolc-nyiregyhaza","forras":"HAON","datum":"2026-05-14","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Debrecen, Miskolc és Nyíregyháza polgármesterei a PwC Business Forumon az együttműködést hangsúlyozták a verseny helyett; Debrecen 2014 óta 20 ezer munkahelyet vonzott, Nyíregyházán a LEGO-gyár a legnagyobb termelő egység lehet.","kulcsszavak":["beruházás"],"het":"2026-05-11","id":"ART-0220","url_forras":"docx","kivonat":"Debrecen, Miskolc és Nyíregyháza polgármesterei a PwC Business Forum 2026 konferencián egybehangzóan hangsúlyozták: a régió fejlődésének kulcsa nem az egymás közti verseny, hanem az együttműködés. Papp László szerint Debrecen 2014 óta 20 ezer új munkahelyet és 13 milliárd eurós működő tőkét vonzott, és mára az elektromobilitás globális szereplőjévé vált – a következő lépés a K+F erősítése. Tóth-Szántai József Miskolc legfőbb céljának a fiatalok megtartását jelölte meg, és a Diósgyőri Acélművek 130 hektáros területében, valamint az EU Net-Zero Völgy programjában látja a kitörési lehetőséget. Kovács Ferenc Nyíregyháza kapcsán elmondta: több lehetőséget teremtettek, mint amennyit eddig ki tudtak használni – 950 hektáros ipari parkjuk van, a LEGO-gyár pedig várhatóan a vállalat legnagyobb termelő egységévé válik."},{"cim":"Rengeteg munkahely van veszélyben: hatalmas árat fizethet az autóipar erőltetett átalakításáért Németország","url":"https://www.portfolio.hu/gazdasag/20260513/rengeteg-munkahely-van-veszelyben-hatalmas-arat-fizethet-az-autoipar-eroltetett-atalakitasaert-nemetorszag-836592","forras":"Portfolio","datum":"2026-05-13","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A VDA szerint 2019-2035 között 225 ezer munkahely szűnhet meg a német autóiparban az elektromos átállás miatt, ami a hazai beszállítói szektort is érinti, mert erősen kitett a német ipar felé.","kulcsszavak":["autóipar","régiós kül
