a munkáltatóknak pedig egyre nagyobb gondot okoz a jelentkezők lemorzsolódása és a megfelelő jelöltek megtartása. A Work Force szerint ezért a fizetés mellett egyre fontosabb a kiszámítható beosztás, a juttatások és a gyors, átlátható kiválasztás, a szezonális állások közel egyharmada pedig tartós foglalkoztatássá alakul.","kulcsszavak":["szezonális munka","Work Force","idősebb munkavállalók","megtartás"],"het":"2026-08-31","url_forras":"docx","id":"ART-0524","kivonat":"A Work Force tapasztalatai szerint a szezonális munkák már nem csak a diákokat vonzzák: egyre több 40–50 év közötti dolgozó, kisgyermekes szülő és nyugdíjas keres így kiegészítő jövedelmet. A cég összesítése alapján az átlagos szezonális órabér bruttó 2200–2400 forint, miközben a munkáltatóknak egyre nagyobb gondot okoz a jelentkezők lemorzsolódása és a megfelelő jelöltek megtartása. A Work Force szerint ezért a fizetés mellett mind fontosabb a kiszámítható beosztás, a juttatások és a gyors, átlátható kiválasztás. A szezonális állások közel egyharmada ráadásul tartós foglalkoztatássá alakul."},{"cim":"Nem mind mentek át a befolyásos rektorok emberei az egyetemek új vezetésébe, a minisztérium néhol váratlant húzott","url":"https://telex.hu/belfold/2026/09/04/kekva-egyetem-kuratorium-szfe-corvinus-semmelweis-pecsi-oktatasi-es-gyermekugyi-miniszterium","forras":"Telex","datum":"2026-09-04","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Budapesti Corvinus Egyetem új kuratóriumába bekerült Tóth Ágnes közgazdász, aki korábban a Budapesti Metropolitan Egyetem elnök-vezérigazgatója, azt megelőzően pedig a Prohuman Zrt. vezérigazgatója volt. Az öttagú testületben rajta kívül több egyetemi oktató és dolgozói érdekképviseleti szereplő is helyet kapott. A kinevezés a kekvák megszüntetésére készülő kormányzati átalakítás része: az egyetemi kuratóriumokat és felügyelőbizottságokat 2027 augusztusáig új tagokkal töltötték fel.","kulcsszavak":["politika"],"het":"2026-08-31","url_forras":"docx","id":"ART-0525","kivonat":"A Budapesti Corvinus Egyetem új kuratóriumába bekerült Tóth Ágnes közgazdász is, aki korábban a Budapesti Metropolitan Egyetem elnök-vezérigazgatója, valamint a Prohuman Zrt. vezérigazgatója volt. Az új öttagú testületben rajta kívül több jelenlegi egyetemi oktató és dolgozói érdekképviseleti szereplő is helyet kapott. A kinevezések egy szélesebb átalakítás részei: a kormány a kekvák (közérdekű vagyonkezeló alapítványok) megszüntetésére készül, ezért az egyetemi kuratóriumokat és felügyelőbizottságokat átmenetileg, 2027 augusztusáig új tagokkal töltötték fel. A Telex szerint a Corvinus közössége kedvezően fogadta az új összetételt."},{"cim":"Nemcsak a vendégmunkások okoznak problémát az ételfutároknak","url":"https://magyarjelen.hu/belfold/33274-nemcsak-a-vendegmunkasok-okoznak-problemat-az-etelfutaroknak","forras":"Magyar Jelen","datum":"2026-09-05","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Lantos János, a Mi Hazánk munkaügyi kabinetvezetője szerint az ételfutárok helyzetét nemcsak a vendégmunkások megjelenése nehezíti, hanem egyes flottacégek szabálytalan foglalkoztatási gyakorlata is. A lapnak nyilatkozó futár szerint a dolgozókat gyakran a tényleges munkaidejüknél jóval kevesebb órára jelentik be, így a cégek elkerülhetik a járulékfizetést. A futár állítása szerint ezt korábban a NAV-nak is jelezte, érdemi változás nélkül. Lantos hatósági és kormányzati fellépést sürget a gyakorlattal szemben.","kulcsszavak":["vendégmunka","munkakörülmények","logisztika"],"het":"2026-08-31","url_forras":"docx","id":"ART-0526","kivonat":"Lantos János, a Mi Hazánk munkaügyi kabinetvezetője szerint az ételfutárok helyzetét nemcsak a vendégmunkások megjelenése nehezíti, hanem egyes flottacégek szabálytalan foglalkoztatási gyakorlata is. A Magyar Jelennek nyilatkozó futár azt állította, hogy előfordul: a dolgozókat a tényleges munkaidejüknél jóval kevesebb órára jelentik be, így a cégek járulékfizetést kerülhetnek el. A futár szerint ezeket az eseteket korábban jelezte a NAV-nak is, érdemi változás nélkül. Lantos ezért hatósági és kormányzati fellépést sürget az ilyen gyakorlatokkal szemben."},{"cim":"A felnőttképzés lehetne a magyar gazdaság gyorsítósávja, ha leaszfaltoznánk","url":"https://hvg.hu/360/20260908_a-felnottkepzes-lehetne-a-magyar-gazdasag-gyorsitosavja-ha-leaszfaltoznank","forras":"HVG","datum":"2026-09-08","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Égert Balázs, az OECD közgazdásza és Scharle Ágota, a Budapest Szakpolitikai Elemző Intézet közgazdásza szerint a magyar gazdaság egyik legfontosabb növekedési tartaléka a meglévő munkaerő tudásának fejlesztése, mert egyre kevesebb új dolgozó áll rendelkezésre, miközben a termelékenység stagnál. Elemzésük szerint a munkaképes korú magyarok közel harmada olyan gyenge alapkompetenciákkal rendelkezik, hogy ez nehezíti az átképzést és a munkakörváltást. A szerzők rövid, célzott felnőttképzéseket és személyre szabott tanácsadást nyújtó foglalkoztatási szolgálatot sürgetnek.","kulcsszavak":["képzés","munkaerő-tartalék","gazdasági kilátások"],"het":"2026-09-07","url_forras":"docx","id":"ART-0527","kivonat":"Égert Balázs, az OECD közgazdásza és Scharle Ágota, a Budapest Szakpolitikai Elemző Intézet közgazdásza szerint a magyar gazdaság egyik legfontosabb növekedési tartaléka a meglévő munkaerő tudásának fejlesztése lehet, mert új dolgozókból egyre kevesebb áll rendelkezésre, miközben a termelékenység stagnál. A HVG-ben megjelent elemzésük szerint a munkaképes korú magyarok közel harmadának olyan gyengék az alapkompetenciái, hogy ez már az átképzést és a munkakörváltást is nehezíti. A szerzők ezért a rövid, célzott felnőttképzések erősítését és egy korszerűbb, személyre szabott tanácsadást nyújtó foglalkoztatási szolgálat kialakítását sürgetik. Szerintük a technológiai és AI-átmenetben a jól képzett, alkalmazkodni képes munkaerő az egyik leggyorsabban megtérülő gazdasági befektetés lehet."},{"cim":"Diákmunka ősszel: kiderültek a leggyakoribb munkatípusok és az órabérek","url":"https://infostart.hu/belfold/2026/09/05/diakmunka-osszel-kiderultek-a-leggyakoribb-munkatipusok-es-az-oraberek","forras":"InfoStart","datum":"2026-09-05","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Mind-Diák Szövetkezet szerint az őszi tanévkezdéssel átrendeződik a diákmunka piaca: a nyári szezonális munkák visszaszorulnak, és előtérbe kerülnek a pénzügyi, IT-, mérnöki, HR-, marketing-, sales- és jogi gyakornoki pozíciók. Göbl Róbert, a szövetkezet vezetője szerint a hosszú távú gyakornokok 80-90 százaléka ősszel is folytatja a munkát, jellemzően kevesebb órában. A Mind-Diák több mint 50 országból foglalkoztat hallgatókat, az átlagos diákmunka-órabér idén bruttó 2200-2500 forint körül alakul.","kulcsszavak":["diákmunka","szezonális munka","Mind-Diák"],"het":"2026-08-31","url_forras":"docx","id":"ART-0528","kivonat":"A Mind-Diák Szövetkezet szerint az őszi tanévkezdés átrendezi a diákmunka piacát: a nyári szezonális munkák visszaszorulnak, miközben előtérbe kerülnek a pénzügyi, IT-, mérnöki, HR-, marketing-, sales-, jogi és adminisztratív gyakornoki pozíciók. Göbl Róbert, a szövetkezet vezetője az InfoRádiónak elmondta, hogy a hosszú távú gyakornokok 80–90 százaléka ősszel is folytatja a munkát, bár jellemzően kevesebb órában. A fehérgalléros diákmunkáknál különösen fontos az angol és a német nyelvtudás, a Mind-Diák pedig több mint 50 országból foglalkoztat hallgatókat. Az átlagos diákmunka-órabér idén bruttó 2200–2500 forint körül alakul."},{"cim":"Csaknem 30 ezer diák vett részt idén a Nyári diákmunka programban","url":"https://kormany.hu/kormanyzat/szocialis-es-csaladugyi-miniszterium/hirek/csaknem-30-ezer-diak-vett-reszt-iden-a-nyari-diakmunka-programban","forras":"Kormány.hu","datum":"2026-09-09","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Nyári diákmunka programban idén augusztus végéig több mint 29 ezer fiatal vett részt, foglalkoztatásukra közel 4200 munkáltató kapott összesen több mint 5,4 milliárd forint támogatást. Dr. Nádasné dr. Rab Henriett foglalkoztatáspolitikai helyettes államtitkár szerint a program jövedelemszerzési és gyakorlatszerzési lehetőség mellett munkaerőpiaci szocializációs szerepet is betölt. A résztvevők 80 százaléka önkormányzatoknál dolgozott, a turizmusban és vendéglátásban közel ötezren vállaltak munkát. A kormány tervezi a program folytatását.","kulcsszavak":["diákmunka","szezonális munka","pályakezdők"],"het":"2026-09-07","url_forras":"docx","id":"ART-0529","kivonat":"A Nyári diákmunka programban idén augusztus végéig több mint 29 ezer fiatal vett részt, foglalkoztatásukra közel 4200 munkáltató kapott összesen több mint 5,4 milliárd forint támogatást. Dr. Nádasné dr. Rab Henriett foglalkoztatáspolitikai helyettes államtitkár szerint a program nemcsak jövedelemszerzést és gyakorlatszerzést biztosít, hanem munkaerőpiaci szocializációs szerepe is van. A résztvevők 80 százaléka önkormányzatoknál dolgozott, de a turizmusban és vendéglátásban is közel ötezren vállaltak munkát. A kormány a program folytatását tervezi, mert fontosnak tartja, hogy a fiatalok fokozatosan ismerkedjenek meg a munka világával."},{"cim":"Emelkedik a rokkantsági és a rehabilitációs ellátás összege","url":"https://kormany.hu/hirek/emelkedik-a-rokkantsagi-es-a-rehabilitacios-ellatas-osszege","forras":"Kormány.hu","datum":"2026-09-06","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A kormány 2027 januárjától 10 százalékkal emeli a rokkantsági és rehabilitációs ellátások összegét, ami mintegy 238 ezer embert érint. A 65 év feletti megváltozott munkaképességűeknél havi 120 ezer forintos minimumot vezetnek be, ugyanennyire emelkedik az öregségi nyugdíjminimum is, amely 2008 óta 28 500 forint volt. A következő lépésben a 146 ezer forint alatti öregségi nyugdíjakat sávosan rendeznék, úgy, hogy az alacsonyabb ellátásban részesülők nagyobb emelést kapjanak.","kulcsszavak":["idősebb munkavállalók","esélyegyenlőség"],"het":"2026-08-31","url_forras":"docx","id":"ART-0530","kivonat":"A kormány 2027 januárjától 10 százalékkal emeli a rokkantsági és rehabilitációs ellátások összegét, ami a közlés szerint mintegy 238 ezer embert érint. A 65 év feletti megváltozott munkaképességűek esetében havi 120 ezer forintos minimumot vezetnek be. Ugyancsak 120 ezer forintra emelkedik az öregségi nyugdíjminimum, amely 2008 óta 28 500 forint volt. A következő lépésben a 146 ezer forint alatti öregségi nyugdíjakat rendeznék sávosan, úgy, hogy az alacsonyabb ellátásban részesülők nagyobb emelést kapjanak."},{"cim":"Nagyot fordult a hangulat a magyar autóipari cégeknél","url":"https://autopro.hu/hr/nagyot-fordult-a-hangulat-a-magyar-autoipari-cegeknel/1676770","forras":"Autopro","datum":"2026-09-09","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A ManpowerGroup 525 hazai cég bevonásával készült felmérése szerint öt éve nem voltak ilyen optimisták a magyar munkáltatók: 2026 negyedik negyedévére 37 százalék tervez létszámbővítést, 13 százalék leépítéssel számol. Az autóiparban különösen nagy a fordulat, ahol az előző negyedévben még a létszámcsökkentést tervezők voltak többségben, most viszont a cégek negyede új dolgozókat venne fel. Kedvező várakozások jellemzik a gyártást, a pénzügyet, az informatikát, az építőipart, valamint a kereskedelmet és logisztikát is, az 5000 fő feletti nagyvállalatok azonban továbbra is óvatosabbak.","kulcsszavak":["gazdasági kilátások","autóipar","foglalkoztatottság","Manpower"],"het":"2026-09-07","url_forras":"docx","id":"ART-0531","kivonat":"A ManpowerGroup 525 hazai cég bevonásával készült felmérése szerint öt éve nem voltak ilyen optimisták a magyar munkáltatók: 2026 negyedik negyedévében 37 százalék tervez létszámbővítést, 13 százalék leépítéssel számol. Különösen nagy fordulat látszik az autóiparban, ahol az előző negyedévben még a létszámcsökkentést tervezők voltak többségben, most viszont már a cégek negyede új dolgozókat venne fel. Kedvezőek a várakozások a gyártás, a pénzügy, az informatika, az építőipar, valamint a kereskedelem és logisztika területén is. A nagyvállalatok közül ugyanakkor az 5000 fő felettiek továbbra is óvatosabbak a bővítéssel."},{"cim":"Ne mondj fel meggondolatlanul, mert hónapokig tarthat az álláskeresés","url":"https://www.hrportal.hu/hr/ne-mondj-fel-meggondolatlanul-mert-honapokig-tarthat-az-allaskereses-20260911.html","forras":"HR Portál","datum":"2026-09-11","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Pethő Anikó karrier-tanácsadó szerint jelenleg aránytalanul sok álláskereső van a magyar munkaerőpiacon, kevés a nyitott pozíció, ezért egy meggondolatlan felmondás után akár 8-12 hónapig is eltarthat az elhelyezkedés. Különösen nehéz helyzetben vannak a pályakezdő informatikusok, HR-esek és kommunikációs szakemberek, valamint az állami szférából leépített dolgozók. Pethő szerint a bértárgyalásokon jelenleg a munkáltatók vannak erőfölényben, ezért fontos a reális bérigény és az óvatos állásváltási stratégia.","kulcsszavak":["munkanélküliség","pályakezdők","bérek"],"het":"2026-09-07","url_forras":"docx","id":"ART-0532","kivonat":"Pethő Anikó karrier-tanácsadó szerint jelenleg aránytalanul sok álláskereső van a magyar munkaerőpiacon, miközben kevés a nyitott pozíció, ezért egy meggondolatlan felmondás után akár 8–12 hónapig is eltarthat az elhelyezkedés. Különösen nehéz helyzetben vannak a pályakezdő informatikusok, HR-esek és kommunikációs szakemberek, valamint az állami szférából leépített dolgozók, akiknek a versenypiaci elvárásokhoz is alkalmazkodniuk kell. A technológiai változások miatt felértékelődnek a rövid, célzott mikroképzések és a meglévő tudás folyamatos frissítése. Pethő szerint a bértárgyalásokon jelenleg inkább a munkáltatók vannak erőfölényben, ezért különösen fontos a reális bérigény és az óvatos állásváltási stratégia."},{"cim":"Ötvenezer állás és a modellek fele tűnik el a Volkswagennél – ez történt a 36. héten","url":"https://autopro.hu/elemzesek/otvenezer-allas-es-a-modellek-fele-tunik-el-a-volkswagennel---ez-tortent-a-36-heten/1674415","forras":"Autopro","datum":"2026-09-05","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Volkswagen 50 ezer állás megszüntetésére és modellpalettája megfelezésére készül, miközben több német üzem jövője is bizonytalanná vált. Ezzel párhuzamosan a BYD gyorsan növeli Kínán kívüli jelenlétét, amiben a szegedi gyár is egyre fontosabb szerepet kaphat. Az iparági portál heti körképe szerint az automatizáció és a mesterséges intelligencia több gyártónál már nemcsak létszámkérdésként, hanem átképzési és kompetencia-kérdésként is megjelenik.","kulcsszavak":["leépítés","autóipar","AI","automatizáció"],"het":"2026-08-31","url_forras":"docx","id":"ART-0533","kivonat":"Az autóiparban egyszerre látszik erős költségcsökkentés, technológiai átalakulás és új növekedési irányok keresése. A Volkswagen 50 ezer állás megszüntetésére és modellpalettája megfelezésére készül, miközben több német üzem jövője is bizonytalanná vált. Ezzel párhuzamosan a BYD gyorsan növeli Kínán kívüli jelenlétét, amiben a szegedi gyár is egyre fontosabb szerepet kaphat. A munkaerőpiacot közben az automatizáció és a mesterséges intelligencia is egyre erősebben formálja: több gyártónál már nemcsak létszámkérdés, hanem az átképzés és az új kompetenciák megszerzése is központi téma – derül ki az iparági portál heti körképéből."},{"cim":"Elképesztő fizetési toplista: ezekben a szakmákban kaszálnak a legtöbbet 50 felett!","url":"https://www.nool.hu/helyi-kozelet/2026/09/kimagaslo-jovedelem-fizetesek-szakmak-ksh","forras":"NOOL","datum":"2026-09-09","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH 2025-ös adatai szerint több vezetői és magas szaktudást igénylő munkakörben az 50 év felettiek keresete kiemelkedően magas. A törvényhozók, miniszterek és államtitkárok havi bruttó átlaga meghaladta a 2,5 millió forintot, a pénzintézeti vezetőké a 2,2 milliót. Az informatikai és telekommunikációs vezetők közel 2 millió, a HR-vezetők több mint 1,8 millió forintos átlagkeresetet értek el.","kulcsszavak":["bérek","idősebb munkavállalók","KSH"],"het":"2026-09-07","url_forras":"docx","id":"ART-0534","kivonat":"A KSH 2025-ös adatai szerint több vezetői és magas szaktudást igénylő munkakörben az 50 év felettiek keresete kiemelkedően magas. A legjobban fizető kategóriák között a törvényhozók, miniszterek és államtitkárok havi bruttó átlaga meghaladta a 2,5 millió forintot, a pénzintézeti vezetőké pedig a 2,2 milliót. Az informatikai és telekommunikációs vezetők közel 2 millió, a HR-vezetők több mint 1,8 millió forintos átlagkeresetet értek el. Az adatok azt mutatják, hogy a tapasztalat és a vezetői felelősség bizonyos szakmákban 50 év felett is jelentős kereseti előnyt jelenthet."},{"cim":"Kijózanító pofon: túl magasak a magyar bérek a pénzügyminiszter szerint","url":"https://magyarnemzet.hu/gazdasag/2026/09/minimalber-tisza","forras":"Magyar Nemzet","datum":"2026-09-10","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Kármán András pénzügyminiszter a Közgazdász-vándorgyűlésen elmondta: Magyarországon 2010 óta a vállalati reálbérköltségek 40 százalékkal nőttek, miközben a termelékenység csak 19 százalékkal javult. Szerinte ezt korábban járulékcsökkentéssel és a forint gyengülésével részben ellensúlyozni lehetett, ez a mozgástér mára nagyrészt elfogyott. A Magyar Nemzet ezt a korábbi Tisza-kampányígéretekkel, köztük a minimálbér jelentős emelésével állítja szembe.","kulcsszavak":["bérek","politika","gazdasági kilátások"],"het":"2026-09-07","url_forras":"docx","id":"ART-0535","kivonat":"Kármán András pénzügyminiszter a Közgazdász-vándorgyűlésen arról beszélt, hogy Magyarországon évek óta gyorsabban emelkednek a bérek, mint a termelékenység: 2010 óta a vállalati reálbérköltségek 40 százalékkal nőttek, miközben a termelékenység csak 19 százalékkal javult. Szerinte ezt korábban járulékcsökkentéssel és a forint gyengülésével részben ellensúlyozni lehetett, ez a mozgástér azonban mára nagyrészt elfogyott. A Magyar Nemzet ezt a korábbi Tisza-kampányígéretekkel állítja szembe, köztük a minimálbér jelentős emelésével, és arra jut, hogy a kormány gazdaságpolitikai mozgástere jóval szűkebb a korábban ígértnél."},{"cim":"Bezár a győri WKW Hungária, ötszáz ember kerül az utcára","url":"https://www.kisalfold.hu/helyi-kozelet/2026/09/wkw-hungaria-gyarbezaras-gyor","forras":"Kisalföld","datum":"2026-09-08","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A győri WKW Hungária Kft. az év végén bezár, így közel 500 dolgozó veszítheti el az állását. A német anyacég a csökkenő megrendelésekkel és átszervezéssel indokolta a döntést, a vállalat már évek óta veszteséges volt, és korábban az értékesítésével is próbálkoztak. A Vasas Szakszervezeti Szövetség szerint a bezárás egy szélesebb autóipari folyamat része, a szakszervezet és a győri önkormányzat más helyi cégeknél keres elhelyezkedési lehetőséget az érintetteknek.","kulcsszavak":["leépítés","autóipar","szakszervezet"],"het":"2026-09-07","id":"ART-0536","url_forras":"talalt","kivonat":"A győri WKW Hungária Kft. az év végén bezár, így közel 500 dolgozó veszítheti el az állását. A német anyacég a csökkenő megrendelésekkel és átszervezéssel indokolta a döntést, miközben a vállalat már évek óta komoly veszteségeket termelt, és korábban az értékesítésével is próbálkoztak. A Vasas Szakszervezeti Szövetség szerint a bezárás egy szélesebb autóipari folyamat része, amelyben több cégnél létszámstop és elbocsátás is megjelent. A szakszervezet és a győri önkormányzat most más helyi cégeknél próbál elhelyezkedési lehetőséget találni az érintetteknek."},{"cim":"Elkezdődtek a gyárbezárások, fokozódik a munkanélküliség","url":"https://reakcio.hu/elkezdodtek-a-gyarbezarasok-fokozodik-a-munkanelkuliseg/","forras":"Reakció","datum":"2026-09-09","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Hír TV riportja szerint Szarvason a Gallicoop több mint 70 milliárd forintos fejlesztése került veszélybe egy 33 milliárdos uniós támogatás visszavonása miatt, ami a cég szerint 1600 munkahelyet, közvetve további ezer ember megélhetését érintheti. Jászfényszarun a Sangin Mikron leállása miatt mintegy 150 dolgozót bocsátottak el, bár többségük gyorsan talált másik állást. Palóc André fideszes képviselő szerint az utóbbi időszakban csaknem kétezer munkahely szűnt meg.","kulcsszavak":["leépítés","beruházás","munkanélküliség"],"het":"2026-09-07","url_forras":"docx","id":"ART-0537","kivonat":"A Hír TV riportja szerint több magyarországi települést is érzékenyen érintenek az elmaradó beruházások és gyárbezárások. Szarvason a Gallicoop több mint 70 milliárd forintos fejlesztése került veszélybe egy 33 milliárdos uniós támogatás visszavonása miatt, ami a cég szerint 1600 munkahelyet, közvetve pedig további mintegy ezer ember megélhetését érintheti. Jászfényszarun a Sangin Mikron leállása miatt mintegy 150 dolgozót bocsátottak el, bár többségük gyorsan talált másik állást. A riportban megszólaló Palóc André fideszes képviselő szerint az utóbbi időszakban csaknem kétezer munkahely szűnt meg."},{"cim":"Nagy Elek: Már nem a tőke a kulcs, a tudás döntheti el Magyarország jövőjét","url":"https://www.economx.hu/mesterseges-intelligencia/2026/09/08/nagy-elek-mkik-mesterseges-intelligencia-magyar-vallalkozasok-ai-tudas/","forras":"Economx","datum":"2026-09-08","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Nagy Elek, a Magyar Kereskedelmi és Iparkamara elnöke az AI Summit Budapest 2026-on arról beszélt, hogy Magyarország növekedési tartalékai egyre inkább a tudásban és a termelékenység javításában rejlenek, nem újabb munkaerő bevonásában. Az MKIK ezért év végéig tízezer magyar céghez szeretné eljuttatni az AI alkalmazásához szükséges tudást workshopokon, oktatási programokon és hackathonokon keresztül. Nagy szerint a technológia terjedésével nő a szakértelem jelentősége, mert az AI válaszait csak megfelelő tudással lehet ellenőrizni.","kulcsszavak":["AI","képzés","gazdasági kilátások"],"het":"2026-09-07","url_forras":"docx","id":"ART-0538","kivonat":"Nagy Elek, a Magyar Kereskedelmi és Iparkamara elnöke az AI Summit Budapest 2026-on arról beszélt, hogy Magyarország növekedési tartalékai egyre inkább a tudásban és a termelékenység javításában rejlenek, nem újabb munkaerő bevonásában. Szerinte az AI kitörési lehetőséget kínálhat, de ehhez a vállalkozásoknak gyorsan meg kell tanulniuk gyakorlati üzleti feladatokra használni az új eszközöket. Az MKIK ezért év végéig tízezer magyar céghez szeretné eljuttatni az AI alkalmazásához szükséges tudást workshopokon, saját oktatási programokon és hackathonokon keresztül. Nagy szerint a technológia terjedésével nem csökken, hanem nő a valódi szakértelem jelentősége, mert az AI válaszait csak megfelelő tudással lehet érdemben ellenőrizni."},{"cim":"Interjú Nógrádi Józseffel, a Trenkwalder HR szakértőjével","url":null,"forras":"RTL","datum":"2026-09-07","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"Nógrádi József, a Trenkwalder Magyarország szakértője szerint az őszi-tavaszi betegséghullámok idején a munkáltatói rugalmasság sokat számít a kisgyermekes szülők megtartásában. Magyarországon évente mintegy 1,5 millió napot töltenek gyermekápolási táppénzen, ami körülbelül 35 milliárd forintos gazdasági kiesést jelent. A szakértő szerint nem a rendelkezésre álló napok számát kellene növelni, hanem rugalmasabb munkaszervezéssel, home office-szal, részmunkaidővel és munkakör-módosítással segíteni az érintetteket, a beteg gyermeket ápoló szülők pedig teljes alapbért kapjanak, a munkáltatókat pedig adó- vagy járulékkedvezmények ösztönözzék.","kulcsszavak":["Trenkwalder","megtartás","munkakörülmények"],"het":"2026-09-07","id":"ART-0539","kivonat":"Nógrádi József, a Trenkwalder Magyarország szakértője szerint az őszi-tavaszi betegséghullámok idején a munkáltatói rugalmasság kulcsfontosságú a kisgyermekes szülők megtartásában. Magyarországon évente mintegy 1,5 millió napot töltenek gyermekápolási táppénzen, ami szerinte körülbelül 35 milliárd forintos gazdasági kiesést jelent. A Trenkwalder szakértője szerint nem elsősorban a rendelkezésre álló napok számát kellene növelni, hanem rugalmasabb munkaszervezéssel, home office-szal, részmunkaidővel és munkakör-módosítással segíteni az érintetteket. Emellett azt is indokoltnak tartaná, hogy a beteg gyermeket ápoló szülők teljes alapbért kapjanak, a munkáltatókat pedig adó- vagy járulékkedvezmények ösztönözzék."},{"cim":"„Majdnem lefordultam a székről” - Az egyik legnagyobb európai bank vezérét kérdeztük, a magyar fordulatról is beszélt","url":"https://www.portfolio.hu/bank/20260911/majdnem-lefordultam-a-szekrol-az-egyik-legnagyobb-europai-bank-vezeret-kerdeztuk-a-magyar-fordulatrol-is-beszelt-861864","forras":"Portfolio","datum":"2026-09-11","fokategoria":"versenytars","alkategoria":"Randstad","osszefoglalo":"Steven van Rijswijk, az ING Csoport vezérigazgatója elmondta: a mesterséges intelligencia átalakítja a banki munkaerőpiacot, az ismétlődő, manuális feladatok egyre nagyobb részét automatizálják, ami a munkakörök és a szükséges készségek átrendeződéséhez vezet. Az ING a Randstaddal együttműködve átképzési és áthelyezési programokkal segíti az érintett dolgozókat, akár más ágazatokba, például az egészségügybe vagy az idősgondozásba történő továbblépésben is. A banknál már több mint 20 ezren dolgoznak IT-területen, az AI térnyerésével pedig további szerkezeti változásokra számítanak.","kulcsszavak":["AI","automatizáció","Randstad","képzés"],"het":"2026-09-07","id":"ART-0540","url_forras":"talalt","kivonat":"Az ING Csoport vezérigazgatója, Steven van Rijswijk elmondta: a mesterséges intelligencia alapjaiban alakítja át a banki munkaerőpiacot: az ismétlődő, manuális feladatok egyre nagyobb részét automatizálják, ami a munkakörök és a szükséges készségek átrendeződéséhez vezet. Az ING ezért a Randstaddal együttműködve átképzési és áthelyezési programokkal segíti az érintett dolgozókat, akár teljesen más ágazatokba, például az egészségügybe vagy az idősgondozásba történő továbblépésben is. A banknál már most több mint 20 ezren dolgoznak IT-területen, miközben az AI térnyerésével további jelentős szerkezeti változásokra számítanak."},{"cim":"Felmondási hullám tört ki Magyarországon – Egy rossz főnök ősszel különösen sokba kerülhet a cégeknek","url":"https://www.atv.hu/belfold/20260909/szeptemberi-felmondasi-hullam","forras":"ATV","datum":"2026-09-09","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"Horváth Ágnes, a WHC Heads szellemi területért felelős vezetője a Spirit FM Felvéve! című műsorában elmondta: ősszel gyakran felerősödik a munkavállalók felmondási és álláskeresési kedve, mert a nyári szabadság után sokan kívülről értékelik újra a munkájukat. Ilyenkor felértékelődik a közvetlen vezető szerepe, a rugalmasság és a munkahelyi légkör, a Z generáció pedig könnyebben vált, ha nem kap megfelelő támogatást vagy a munkahely nem illeszkedik az élethelyzetéhez. Horváth szerint a cégeknek folyamatosan kell építeniük a megtartási stratégiát, nem csak a felmondási döntés megszületésekor reagálniuk.","kulcsszavak":["WHC","megtartás","munkakörülmények"],"het":"2026-09-07","id":"ART-0541","url_forras":"talalt","kivonat":"Horváth Ágnes, a WHC Heads szellemi területért felelős vezetője a Spirit FM Felvéve! című műsorában beszélt arról, hogy ősszel gyakran felerősödik a munkavállalók felmondási és álláskeresési kedve. Szerinte a nyári szabadság után sokan kívülről értékelik újra a munkájukat, és ilyenkor különösen felértékelődik a közvetlen vezető szerepe, a rugalmasság és a munkahelyi légkör. A Z generáció könnyebben vált, ha nem kap megfelelő támogatást vagy a munkahely nem illeszkedik az élethelyzetéhez. A cégeknek ezért folyamatosan kell építeniük a megtartási stratégiát, nem csak akkor reagálniuk, amikor már megszületett a felmondási döntés."},{"cim":"Átalakulóban a szezonális munkaerőpiac","url":"https://mmonline.hu/cikk/atalakuloban-a-szezonalis-munkaeropiac/","forras":"MM Online","datum":"2026-09-07","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A Work Force szerint átalakul a szezonális munkaerőpiac: a diákok és fiatalok mellett egyre több 40-50 év közötti munkavállaló, kisgyermekes szülő, részmunkaidős álláskereső és nyugdíjas vállal ilyen munkát. A cég évente mintegy 2400 szezonális dolgozót közvetít, tapasztalataik szerint a legnagyobb kihívás már nem a jelentkezők száma, hanem a megbízható, a teljes időszakot vállaló munkaerő megtalálása. Magony András, a Work Force operatív vezetője szerint felértékelődött a gyors és átlátható kiválasztás, az egyértelmű bérsáv, a kiszámítható beosztás és a munkába járás támogatása, a szezonális munkák közel harmada pedig hosszabb távú foglalkoztatássá alakul.","kulcsszavak":["szezonális munka","Work Force","toborzás"],"het":"2026-09-07","url_forras":"docx","id":"ART-0542","kivonat":"A Work Force szerint átalakul a szezonális munkaerőpiac: miközben továbbra is a diákok és a fiatalok vannak többségben, egyre több 40–50 év közötti munkavállaló, kisgyermekes szülő, részmunkaidős álláskereső és nyugdíjas vállal ilyen munkát. A cég évente mintegy 2400 szezonális dolgozót közvetít, és tapasztalataik szerint a legnagyobb kihívás már nem a jelentkezők száma, hanem a megbízható, a teljes időszakot vállaló munkaerő megtalálása. Magony András, a Work Force operatív vezetője szerint ezért felértékelődött a gyors és átlátható kiválasztás, az egyértelmű bérsáv, a kiszámítható beosztás és a munkába járás támogatása. A szezonális munkák közel harmada ráadásul hosszabb távú foglalkoztatássá alakul."},{"cim":"Új kihívással néznek szembe a cégek, valami megváltozott a diákmunka piacán","url":"https://index.hu/gazdasag/2026/09/18/diakmunka-valtozas-osz-berek-szakmai-gyakorlat-egyuttmukodes/","forras":"Index","datum":"2026-09-18","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prodiák Iskolaszövetkezet szerint az elmúlt másfél évtizedben átalakult a diákmunka: a cégek a fiatalokra egyre kevésbé alkalmi munkaerőként, inkább hosszú távú utánpótlásként tekintenek. Tóth Rozália, a szövetkezet elnöke szerint a diákok órabére a 2011-es 500–800 forintról 2200–2800 forintra nőtt, az IT- és mérnöki gyakornoki helyeken pedig 3000–4000 forintot is elérhet. A Mind-Diák szerint ősszel visszaesnek a szezonális munkák, de a gyakornoki helyeken dolgozók 80–90 százaléka folytatja a munkát ősszel is.","kulcsszavak":["diákmunka","bérek","megtartás","Prodiák"],"het":"2026-09-14","url_forras":"docx","id":"ART-0543","kivonat":"A Prodiák Iskolaszövetkezet szerint az elmúlt másfél évtizedben alapvetően átalakult a diákmunka: a fiatalokra a cégek ma már egyre kevésbé alkalmi munkaerőként, inkább hosszú távú utánpótlásként tekintenek. Tóth Rozália, a szövetkezet elnöke szerint felértékelődött a szakmai tapasztalatszerzés, miközben a diákok órabére a 2011-es 500–800 forintról mára jellemzően 2200–2800 forintra nőtt, az IT- és mérnöki gyakornoki helyeken pedig 3000–4000 forintot is elérhet. A Mind-Diák tapasztalatai szerint ősszel visszaesnek a szezonális munkák, de a gyakornoki helyeken a nyáron dolgozók akár 80–90 százaléka is folytatja a munkát. A tanévkezdés így egyszerre szűkíti a hallgatók rendelkezésre álló idejét és teremt új utánpótlási lehetőséget a cégeknek."},{"cim":"Jöjjön vagy ne jöjjön a külföldi munkaerő? Ha nem, hol a tartalék?","url":"https://www.hrportal.hu/hr/jojjon-vagy-ne-jojjon-a-kulfoldi-munkaero-ha-nem-hol-a-tartalek-20260915.html","forras":"HR Portál","datum":"2026-09-15","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Papp Tamás István HR-szakember szerint a magyar munkaerőpiac 2026-ra jóval kevésbé feszes, mint néhány éve, ezért indokolt nagyobb hangsúlyt helyezni a hazai munkaerő-tartalék aktivizálására: a nyugdíjasokra, diákokra, NEET-fiatalokra, megváltozott munkaképességűekre, közfoglalkoztatottakra és romákra. Szerinte ezek a csoportok gyakran földrajzi, képzettségi vagy szociális hátrányok miatt csak célzott támogatással vonhatók be az elsődleges munkaerőpiacra. Szerinte a vendégmunkások tiltása helyett a hazai munkaerőt védő foglalkoztatáspolitikát kellene összehangolni azzal, hogy külföldieket ott alkalmazzanak, ahol nincs elég belföldi munkaerő.","kulcsszavak":["vendégmunka","munkaerő-tartalék","idősebb munkavállalók"],"het":"2026-09-14","url_forras":"docx","id":"ART-0544","kivonat":"Papp Tamás István HR-szakember szerint a magyar munkaerőpiac 2026-ra jóval kevésbé feszes, mint néhány éve, ezért indokolt nagyobb hangsúlyt helyezni a hazai munkaerő-tartalék aktivizálására, a nyugdíjasokra, diákokra, NEET-fiatalokra, megváltozott munkaképességűekre, közfoglalkoztatottakra, romákra. Ugyanakkor ezek a csoportok sokszor földrajzi, képzettségi vagy szociális hátrányok miatt csak célzott támogatással vonhatók be az elsődleges munkaerőpiacra. Szerinte ezért nem a vendégmunkások tiltása a megoldás, hanem a hazai munkaerőt védő és ösztönző foglalkoztatáspolitika összehangolása azzal, hogy ahol nincs megfelelő belföldi munkaerő, továbbra is lehessen külföldieket alkalmazni."},{"cim":"Egyre több a vendégmunkás Szegeden: Mihálik Edvinék indítványozzák, hogy az önkormányzat vizsgálja felül, hol lehet munkásszállót létesíteni","url":"https://szeged365.hu/2026/09/14/egyre-tobb-a-vendegmunkas-szegeden-mihalik-edvinek-inditvanyozzak-hogy-az-onkormanyzat-vizsgalja-felul-hol-lehet-munkasszallot-letesiteni/","forras":"Szeged365","datum":"2026-09-14","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkások számának várható növekedése miatt szigorítanák a munkásszállások létesítésének helyi szabályait Szegeden. Két önkormányzati képviselő azt kezdeményezi, hogy a város egyértelműen határozza meg, mely területeken lehet, illetve nem lehet ilyen szállásokat kialakítani. Az indítvány hátterében a BYD-beruházás és az ehhez kapcsolódó külföldi munkaerő megjelenése áll; a képviselők a férőhelyszám, a parkolás, a közlekedési terhelés, a közműkapacitás és a lakóövezetek védelme szempontjait kérik figyelembe venni.","kulcsszavak":["vendégmunka","régiós különbségek","beruházás"],"het":"2026-09-14","url_forras":"docx","id":"ART-0545","kivonat":"A vendégmunkások számának várható növekedése miatt szigorítanák a munkásszállások létesítésének helyi szabályait Szegeden. Két önkormányzati képviselők azt kezdeményezi, hogy a város egyértelműen határozza meg, mely területeken lehet, illetve nem lehet ilyen szállásokat kialakítani. Az indítvány hátterében a BYD-beruházás és az ehhez kapcsolódó külföldi munkaerő megjelenése áll, miközben már most is érkeznek lakossági panaszok. A képviselők szerint a szabályozásnak a férőhelyszám, a parkolás, a közlekedési terhelés, a közműkapacitás és a lakóövezetek életminőségének védelme szempontjait is figyelembe kellene vennie."},{"cim":"Kínai vendégmunkásoktól is tartanak a helyiek a tervezett hajdúsámsoni lakópark kapcsán az egyik ellenzéki képviselő szerint","url":"https://debreciner.hu/cikk/kinai-vendegmunkasoktol-is-tartanak-a-helyiek-a-tervezett-hajdusamsoni-lakopark","forras":"Debreciner","datum":"2026-09-16","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Hajdúsámsonban egy tervezett, 300 lakásos lakópark váltott ki vitát, amely mintegy ezer új lakót hozhatna a városba. Szegediné Páll Rita ellenzéki önkormányzati képviselő szerint a megkérdezett helyiek elsősorban a már túlterhelt közművek miatt aggódnak, de attól is tartanak, hogy a debreceni ipari beruházásokhoz érkező kínai vendégmunkások költözhetnek a lakásokba. A képviselő-testület végül 7 igen és 2 tartózkodás mellett támogatta a projekt előkészítését.","kulcsszavak":["vendégmunka","beruházás","régiós különbségek"],"het":"2026-09-14","url_forras":"docx","id":"ART-0546","kivonat":"Hajdúsámsonban egy tervezett, 300 lakásos lakópark váltott ki vitát, amely a tervek szerint mintegy ezer új lakót hozhatna a városba. Szegediné Páll Rita ellenzéki önkormányzati képviselő szerint az általa megkérdezett helyiek elsősorban a már most is túlterhelt közművek miatt aggódnak, de attól is tartanak, hogy a debreceni ipari beruházásokhoz érkező kínai vendégmunkások költözhetnek majd a lakásokba. A beruházó ugyanakkor vállalta az ivóvíz- és szennyvízhálózat, az utak, a közvilágítás és az elektromos infrastruktúra fejlesztését. A képviselő-testület végül 7 igen és 2 tartózkodás mellett támogatta a projekt előkészítését."},{"cim":"Ezért érzi elveszettnek magát a munka világában a Z generáció","url":"https://www.hrportal.hu/c/ezert-erzi-elveszettnek-magat-a-munka-vilagaban-a-z-generacio-20260918.html","forras":"HR Portál","datum":"2026-09-18","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Global Workforce Solutions (GWS) Iskolaszövetkezet 884 fiatal bevonásával készült kutatása szerint a Z generáció munkahelyi nehézségeinek fő oka nem a motiváció hiánya, hanem a szervezethez és a közösséghez való kapcsolódás. A válaszadók 85 százaléka motiváltnak, 91 százaléka önállónak tartja magát, de csak 29 százalékuk tud azonosulni munkahelye értékeivel, és minden harmadik fiatal a beilleszkedéstől tart. 53 százalékuk jó főnök mellett alacsonyabb fizetés ellenére is maradna a jelenlegi munkahelyén.","kulcsszavak":["megtartás","pályakezdők","munkakörülmények"],"het":"2026-09-14","url_forras":"docx","id":"ART-0547","kivonat":"A Global Workforce Solutions (GWS) Iskolaszövetkezet 884 fiatal bevonásával készült kutatása szerint a Z generáció munkahelyi nehézségeinek egyik fő oka nem a motiváció hiánya, hanem a szervezethez és a közösséghez való kapcsolódás. A válaszadók 85 százaléka motiváltnak, 91 százaléka önállónak tartja magát, csak 29 százalékuk tud azonosulni munkahelye értékeivel, és minden harmadik fiatal a beilleszkedéstől tart. A vezető minősége, a fejlődési lehetőség, a visszajelzés és a támogató közeg erős megtartó tényezők: 53 százalék jó főnök mellett alacsonyabb fizetés ellenére is maradna. Nincs egységes „Z generációs munkavállaló”: a fiatalok motivációi a stabilitástól a fejlődésen át a karrierig és a digitális vállalati jelenlétig erősen eltérnek."},{"cim":"Megtudtuk, hányan maradhatnak ki a 120 ezer forintos nyugdíjminimumból","url":"https://lakmusz.hu/2026/09/14/megtudtuk-hanyan-maradhatnak-ki-a-120-ezer-forintos-nyugdijminimumbol","forras":"Lakmusz","datum":"2026-09-14","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A KSH adatai szerint a 2027-től bevezetett 120 ezer forintos nyugdíjminimum a megváltozott munkaképességűek jelentős részére nem vonatkozik majd, mert azt csak a 65 év feletti rokkantsági és rehabilitációs ellátottak kapják meg garantáltan. A 65 év alattiak mindössze 10 százalékos emelésre számíthatnak, miközben több mint 82 ezren jelenleg havi 100 ezer forintnál is kevesebbet kapnak, további több mint 16 ezren pedig 100–120 ezer forint közötti ellátásban részesülnek. Farkas András nyugdíjszakértő szerint kevés a 65 év feletti rokkantsági ellátott, mert a többség a korhatár elérésekor öregségi nyugdíjat igényel.","kulcsszavak":["munkaerő-tartalék","idősebb munkavállalók","politika"],"het":"2026-09-14","url_forras":"docx","id":"ART-0548","kivonat":"A KSH adatai szerint a 2027-től bevezetett 120 ezer forintos minimum a megváltozott munkaképességűek jelentős részére nem vonatkozik majd, mert azt csak a 65 év feletti rokkantsági és rehabilitációs ellátottak kapják meg garantáltan. A 65 év alattiak mindössze 10 százalékos emelésre számíthatnak, miközben több mint 82 ezren jelenleg havi 100 ezer forintnál is kevesebbet kapnak, további több mint 16 ezren pedig 100–120 ezer forint közötti ellátásban részesülnek. Farkas András nyugdíjszakértő szerint azért kevés a 65 év feletti rokkantsági ellátott, mert a többség a korhatár elérésekor inkább öregségi nyugdíjat igényel."},{"cim":"Kétarcúvá vált az ipari munkaerőpiac: keleten embereket keresnek, nyugaton már létszámstop van","url":"https://nepszava.hu/3333017_feldolgozoipar-mercedes-bmw-autogyartas-autoipar","forras":"Népszava","datum":"2026-09-18","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Kettészakadt a magyar ipari munkaerőpiac: Debrecenben és Kecskeméten az új autóipari kapacitások miatt még jelentős a munkaerő-kereslet, Nyugat-Magyarországon viszont több beszállítónál létszámstop és természetes fogyás jellemző. László Zoltán, a Vasas Szakszervezeti Szövetség alelnöke szerint a kínai verseny és a gyenge kereslet miatt a cégek költségcsökkentéssel és hatékonyságjavítással próbálnak kevesebb emberrel működni; a győri WKW és a jászberényi Electrolux gyárbezárása egyenként mintegy 600 munkahelyet érint. A KSH júliusra 4,7 százalékos ipari növekedést mért, de a GKI felmérésében több vállalat tervezett létszámcsökkentést, mint bővítést.","kulcsszavak":["leépítés","régiós különbségek","szakszervezet"],"het":"2026-09-14","url_forras":"docx","id":"ART-0549","kivonat":"Erősen kettészakadt a magyar ipari munkaerőpiac: Debrecenben és Kecskeméten az új autóipari kapacitások miatt még jelentős a munkaerő-kereslet, Nyugat-Magyarországon viszont számos beszállítónál létszámstop és természetes fogyás jellemző. László Zoltán, a Vasas Szakszervezeti Szövetség alelnöke szerint a kínai verseny és a gyenge kereslet miatt a cégek egyre inkább költségcsökkentéssel és hatékonyságjavítással próbálnak kevesebb emberrel működni. A folyamatot olyan gyárbezárások is jelzik, mint a győri WKW és a jászberényi Electrolux üzeme, amelyek egyenként mintegy 600 munkahelyet érintenek. Bár a KSH júliusra már 4,7 százalékos ipari növekedést mért, a fellendülés néhány ágazatra koncentrálódik, miközben a GKI felmérésében több vállalat tervezett létszámcsökkentést, mint bővítést."},{"cim":"Gyárbezárások és visszaeső foglalkoztatás: négy hónap után nevez ki munkaügyi államtitkárt a Tisza-kormány","url":"https://magyarnemzet.hu/gazdasag/2026/09/gyarbezarasok-romlo-foglalkoztatas-negy-honap-munkaugyi-allamtitkar","forras":"Magyar Nemzet","datum":"2026-09-16","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Szociális és Családügyi Minisztérium közlése szerint négy hónappal a kormányalakítás után megszületett a döntés a munkaügyi államtitkár kinevezéséről, nevét azonban egyelőre nem hozták nyilvánosságra. Az új vezető feladata a foglalkoztatáspolitikai és munkaügyi területek koordinációja lesz egy olyan időszakban, amikor romlottak a foglalkoztatási adatok és több gyárbezárás is történt. A WKW győri, az Electrolux jászberényi, az Accell Hunland tószegi és a Bonyhádi Zománcáru üzemének bezárása összesen több mint 1700 munkahelyet érinthet.","kulcsszavak":["leépítés","politika","foglalkoztatottság"],"het":"2026-09-14","url_forras":"docx","id":"ART-0550","kivonat":"A Szociális és Családügyi Minisztérium közlése szerint négy hónappal a kormányalakítás után megszületett a döntés a munkaügyi államtitkár kinevezéséről, nevét azonban egyelőre nem hozták nyilvánosságra. Az új vezető feladata a foglalkoztatáspolitikai és munkaügyi területek egységes koordinációja lesz egy olyan időszakban, amikor romlottak a foglalkoztatási adatok és több jelentős gyárbezárás is történt. A WKW győri, az Electrolux jászberényi, az Accell Hunland tószegi és a Bonyhádi Zománcáru üzemének bezárása összesen több mint 1700 munkahelyet érinthet. A minisztérium szerint a munkaügyi szakmai munka az államtitkár hiányában is folyamatos volt, a nagyobb leépítéseket és gyárbezárásokat pedig figyelemmel kísérték."},{"cim":"Szépen nőnek a fizetések – de van egy trükk a friss adatokban","url":"https://www.economx.hu/magyar-gazdasag/2026/09/16/ksh-keresetek-julius-csaladi-kedvezmeny-anyak-szja-mentesseg-fizetesek/","forras":"Economx","datum":"2026-09-16","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH adatai szerint 2026 júliusában a teljes munkaidőben dolgozók bruttó átlagkere ","kulcsszavak":["bérek","egészségügy","kutatás és statisztika"],"het":"2026-09-14","url_forras":"docx","id":"ART-0552","kivonat":"A Nemzeti Egészségbiztosítási Alapkezelő friss adatai szerint a közfinanszírozott intézményekben dolgozó orvosok havi bruttó átlagkeresete az elmúlt fél évben mintegy 2,03 millió forint volt, a szakdolgozóké pedig 760–770 ezer forint körül alakult. A legmagasabb keresetek ugyanakkor ennek többszörösét érték el: a legjobban fizetett orvos január–augusztusi havi átlaga 9,6 millió, a húszas toplista utolsó helyezettjéé is 6,2 millió forint volt. Ezek azonban nem alapbérek, hanem pótlékokkal és mozgóbérekkel növelt összegek, és az adatokból nem derül ki, hány munkaórával vagy ügyelettel érték el őket. A legjobban kereső szakdolgozó havi bruttó átlaga 4,4 millió forint volt, ami szintén jelentősen meghaladja az ágazati átlagot."},{"cim":"200 milliárd forintos beruházással bővül a Hankook rácalmási gyára, több száz új munkahely jön létre","url":"https://www.feol.hu/helyi-kozelet/2026/09/hankook-beruhazas-racalmas-uj-munkahelyek","forras":"FEOL","datum":"2026-09-19","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A Hankook 540 millió eurós (200 milliárd forintos) beruházással új gyáregységgel bővítette rácalmási üzemét, ahol októbertől tehergépkocsi- és autóbusz-abroncsok gyártása indul. A fejlesztés 66 ezer négyzetméternyi új gyártó- és kiszolgálóterületet jelent, és több mint 450 új munkahelyet hoz létre a térségben. A Hankook jelenleg több mint háromezer embert foglalkoztat Magyarországon, az új egység éves kapacitása meghaladja a 800 ezer abroncsot.","kulcsszavak":["beruházás","ipar","foglalkoztatottság"],"het":"2026-09-14","id":"ART-0553","url_forras":"talalt","kivonat":"A Hankook 540 millió eurós (200 milliárd) forintos beruházással új gyáregységgel bővítette rácalmási üzemét, ahol októbertől tehergépkocsi- és autóbusz-abroncsok gyártása indul. A fejlesztés 66 ezer négyzetméternyi új gyártó- és kiszolgálóterületet jelent, és több mint 450 új munkahelyet hoz létre a térségben. Az új egység éves kapacitása meghaladja a 800 ezer abroncsot. A Hankook jelenleg több mint háromezer embert foglalkoztat Magyarországon, a rácalmási üzem pedig a vállalat európai jelenlétének egyik meghatározó bázisa."},{"cim":"Gigantikus beruházások rajzolják át Magyarországot: óriási építkezési hullám a vidéki nagyvárosokban","url":"https://www.portfolio.hu/ingatlan/20260915/gigantikus-beruhazasok-rajzoljak-at-magyarorszagot-oriasi-epitkezesi-hullam-a-videki-nagyvarosokban-862648","forras":"Portfolio","datum":"2026-09-15","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Új beruházási ciklus indulhat a magyar ingatlanpiacon, amelyben a vidéki ipari és logisztikai fejlesztések kaphatnak lendületet. A CBRE adatai szerint 2026 első felében mintegy 250 ezer négyzetméter új ipari-logisztikai kapacitás került piacra, a nettó kereslet pedig 30 százalékkal nőtt. A BMW, a CATL és a Mercedes beruházásai Debrecen, Miskolc, Nyíregyháza és Kecskemét szerepét is felértékelik, a HIPA pedig a jövőben nagyobb hangsúlyt helyezne a K+F-, mérnöki és innovációs tevékenységeket is Magyarországra hozó beruházásokra.","kulcsszavak":["beruházás","gazdasági kilátások","régiós különbségek"],"het":"2026-09-14","url_forras":"docx","id":"ART-0554","kivonat":"Új beruházási ciklus indulhat a magyar ingatlanpiacon, amelyben különösen a vidéki ipari és logisztikai fejlesztések kaphatnak lendületet. A CBRE adatai szerint 2026 első felében mintegy 250 ezer négyzetméter új ipari-logisztikai kapacitás került piacra, a nettó kereslet pedig 30 százalékkal nőtt. A BMW, a CATL és a Mercedes beruházásai Debrecen, Miskolc, Nyíregyháza és Kecskemét szerepét is felértékelik, miközben lakhatási, közlekedési és szolgáltatási fejlesztéseket is generálhatnak. A HIPA a jövőben nagyobb hangsúlyt helyezne azokra a beruházásokra, amelyek a gyártás mellett K+F-, mérnöki és innovációs tevékenységeket is Magyarországra hoznak."}, :"versenytars","alkategoria":"Randstad","osszefoglalo":"Baja Sándor, a Randstad ügyvezető igazgatója a Portfolio Checklist podcastjában arról beszélt, hogy a fiatalok elhelyezkedési gondjait elsősorban strukturális eltérések okozzák: sokan olyan területen keresnek munkát, ahol kevés a lehetőség, miközben más ágazatokban továbbra is hiány van. A cég felmérése szerint a cégek több mint harmada már használ AI-t, és az azt alkalmazók több mint fele munkaerőköltség-csökkentést is vár tőle, emiatt a belépő szintű szolgáltatóközponti állások jelentősen megfogyatkoztak. Baja szerint a fizetés mellett a fiataloknál egyre fontosabb a munkahelyi környezet, a cég presztízse, a vezető minősége, a work-life balance és a home office lehetősége.","kulcsszavak":["AI","pályakezdők","munkakörülmények"],"het":"2026-09-07","id":"ART-0556","url_forras":"talalt","kivonat":"Baja Sándor, a Randstad ügyvezető igazgatója a Portfolio Checklist podcastjában arról beszélt, hogy a fiatalok elhelyezkedési gondjait elsősorban strukturális eltérések okozzák: sokan olyan területen keresnek munkát, ahol kevés a lehetőség, miközben más ágazatokban továbbra is hiány van. A cég felmérése szerint a cégek több mint harmada már használ AI-t, és az azt alkalmazók több mint fele munkaerőköltség-csökkentést is vár tőle; emiatt korábban tipikus belépő szintű szolgáltatóközponti állások jelentősen megfogyatkoztak. Baja szerint miközben pályakezdő pozícióból alig van, a képzett szakemberek iránt továbbra is erős a kereslet, főleg mérnöki és bizonyos IT-területeken. A fiataloknál közben a fizetés mellett egyre fontosabb a munkahelyi környezet, a cég presztízse, a vezető minősége, a work-life balance és a home office lehetősége."},{"cim":"Szükség van-e vendégmunkásokra Magyarországon? – az új szabályozás változást hozhat a gödi akkugyártól a kisvárdai csirkebontóig","url":"https://24.hu/fn/gazdasag/2026/09/18/vendegmunkasok-samsung-mastergood-szabalyozas/","forras":"24.hu","datum":"2026-09-18","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A 24.hu riportja szerint a vendégmunkások szerepéről szóló vita jóval összetettebb annál, hogy egyszerűen szükség van-e rájuk. A WHC 157 céget bevonó felmérése szerint a cégek 71,3 százaléka nem tartja reálisnak, hogy munkaerőigényét kizárólag magyar dolgozókkal fedezze; a Master Good például 500 fülöp-szigeteki munkavállalót alkalmaz, mert vezetői szerint a hazai munkaerő-tartalék kimerült. Reizer Balázs közgazdász szerint a harmadik országbeli dolgozók kiszolgáltatott helyzete torzíthatja a versenyt, és béremelésre, erősebb foglalkoztatási szolgálatra és uniós szintű szabályozásra lenne szükség. A kormány új szabályozáson dolgozik, amely csak ott engedné a vendégmunkások alkalmazását, ahol a hazai munkaerő valóban nem elegendő.","kulcsszavak":["vendégmunka","munkaerő-tartalék","politika"],"het":"2026-09-14","url_forras":"docx","id":"ART-0557","kivonat":"A 24.hu riportja szerint a vendégmunkások magyarországi szerepéről szóló vita jóval összetettebb annál, mint hogy egyszerűen szükség van-e rájuk vagy sem. A WHC 157 vállalat bevonásával készült felmérése szerint a cégek 71,3 százaléka nem tartja reálisnak, hogy munkaerőigényét kizárólag magyar dolgozókkal fedezze. A Master Good például 500 fülöp-szigeteki munkavállalót alkalmaz, mert vezetői szerint a hazai munkaerő-tartalék kimerült, és egyre kevesebben vállalnak nehéz fizikai munkát. Reizer Balázs közgazdász ugyanakkor arra figyelmeztet, hogy a harmadik országbeli dolgozók kiszolgáltatott helyzete torzíthatja a versenyt és hátrányba hozhatja a hazai álláskeresőket. Szerinte béremelésre, erősebb foglalkoztatási szolgálatra és uniós szintű szabályozásra is szükség lenne. A kormány közben új szabályozáson dolgozik, amely csak ott engedné a vendégmunkások alkalmazását, ahol a hazai munkaerő valóban nem elegendő."},{"cim":"Évente 1000 milliárd dolláros kiesést okoz a stressz: Ezért nem csupán HR-kérdés a munkahelyi egészség","url":"https://hrpwr.hu/cikk/evente-1000-milliard-d
