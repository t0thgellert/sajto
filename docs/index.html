-14","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A vendégmunkások száma májusban rekordot döntött, elérte a 110 800 főt, ami egyetlen hónap alatt 2000 fős növekedés és a valaha mért legmagasabb létszám az országban. A roham az utolsó pillanatban jött: az áprilisi kormányváltás után tudni lehetett, hogy szigorodnak a szabályok, a Tisza programja pedig az EU-n kívüli dolgozók behozatalának megtiltását is tartalmazta. A tiltás végül csúszott, a kormány csak június 5-én döntött, a másnap hatályba lépő rendelet szüntette meg a gyorsított vendégmunkás-eljárást többek között a Fülöp-szigeteki, grúz és örmény állampolgárok számára, miközben a már beadott kérelmeket még elbírálták, így júniusban tovább emelkedhetett a létszám.","kulcsszavak":["vendégmunka","vendégmunkás-stop","politika"],"het":"2026-08-10","url_forras":"docx","id":"ART-0468","kivonat":"A vendégmunkások száma májusban rekordot döntött: elérte a 110 800 főt, egyetlen hónap alatt 2000-rel nőtt – ennyi külföldi dolgozó korábban soha nem volt az országban. A roham az utolsó pillanatban jött, hiszen az áprilisi kormányváltás után tudni lehetett, hogy szigorodnak a szabályok; a Tisza programjában az EU-n kívüli dolgozók behozatalának megtiltása is szerepelt. A tiltás végül csúszott: a kormány csak június 5-én döntött, a másnap hatályba lépő rendelet szüntette meg a gyorsított vendégmunkás-eljárást többek között a Fülöp-szigeteki, grúz és örmény állampolgárok számára, a már beadott kérelmeket azonban még elbírálták – így júniusban akár tovább is emelkedhetett a létszám."},{"cim":"Április 12-e óta nem kevesebb, hanem több vendégmunkás lett Szombathelyen!","url":"https://magyarjelen.hu/belfold/32857-aprilis-12-e-ota-nem-kevesebb-hanem-tobb-vendegmunkas-lett-szombathelyen","forras":"Magyar Jelen","datum":"2026-08-09","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A Mi Hazánk és ifjúsági szervezete tiltakozással egybekötött sajtótájékoztatót tartott a szombathelyi Szövő utcai vendégmunkásszálló előtt. Lantos János munkaügyi kabinetvezető szerint 100–200 ezer vendégmunkás dolgozik az országban, és a tömeges foglalkoztatás gyengítheti a hazai munkavállalók alkupozícióját és a béremelkedés esélyét; egy másik felszólaló a szakszervezeti jogok szűkülését bírálta. A párt szerint a Tisza-kormány új szabályozásában kiskapu maradt, a helyi tapasztalatok szerint pedig április 12. óta nem csökkent, hanem nőtt a városban dolgozó vendégmunkások száma. Megoldásként a magyar munkavállalókra és kkv-kra építő gazdaságpolitikát szorgalmazzák.","kulcsszavak":["vendégmunka","vendégmunkás-stop","politika"],"het":"2026-08-03","url_forras":"docx","id":"ART-0469","kivonat":"A Mi Hazánk és ifjúsági szervezete a szombathelyi Szövő utcai vendégmunkásszálló előtt tartott tiltakozással egybekötött sajtótájékoztatót. Lantos János munkaügyi kabinetvezető szerint 100–200 ezer vendégmunkás dolgozik az országban, a tömeges foglalkoztatás pedig gyengítheti a hazai munkavállalók alkupozícióját és a béremelkedés lehetőségét; egy másik felszólaló a szakszervezeti jogok szűkülését bírálta. A párt szerint a Tisza-kormány sem hoz érdemi fordulatot, mert az új szabályozásban maradt kiskapu, a helyi tapasztalatok szerint pedig április 12-e óta nem csökkent, hanem nőtt a városban dolgozó vendégmunkások száma. A megoldás nem az adminisztratív korlátozás, hanem a magyar munkavállalókra és kkv-kra építő gazdaságpolitika."},{"cim":"Jobtain: az „újgalléros” dolgozók jelenthetik a magyar gazdaság rejtett tartalékát","url":"https://uzletem.hu/munkaeropiac/jobtain-az-ujgalleros-dolgozok-jelenthetik-a-magyar-gazdasag-rejtett-tartalekat","forras":"Üzletem","datum":"2026-08-07","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Jobtain szerint a munkaerőhiány következő szakaszában a megoldást egy új réteg, az „újgalléros” munkavállalók felépítése jelentheti: olyan dolgozóké, akik szakképzettség nélkül is képesek technológiát kezelni, folyamatokban gondolkodni és belső képzéssel gyorsan értékes munkaerővé válni. A cég 2026-os Kékgalléros Benchmark kutatása szerint a szakmunkás-toborzásban a bérigény és a hiányzó tapasztalat a fő akadály, a vállalatok 59 százaléka viszont már tudatosan a jó tanulási potenciállal rendelkező jelölteket keresi, és a gyors tanulási képesség a negyedik legfontosabb kiválasztási szemponttá vált, alig lemaradva a szakmai tapasztalat mögött. A megbízhatóság marad az első számú elvárás 90 százalékkal, mert a vállalatok csak stabil, tervezhető jelöltbe fektetnek be.","kulcsszavak":["munkaerőhiány","toborzás","skills-alapú HR"],"het":"2026-08-03","url_forras":"docx","id":"ART-0470","kivonat":"A Jobtain szerint a munkaerőhiány következő szakaszára már nem a kész szakemberekért folytatott verseny a válasz, hanem egy új réteg, az „újgalléros” munkavállalók felépítése: olyan dolgozóké, akik szakképzettség nélkül is képesek technológiát kezelni, folyamatokban gondolkodni és belső képzéssel gyorsan értékes munkaerővé válni. A cég 2026-os Kékgalléros Benchmark kutatása szerint a szakmunkás-toborzásban a bérigény és a hiányzó tapasztalat a fő akadály, a vállalatok 59 százaléka viszont már tudatosan a jó tanulási potenciállal rendelkező jelölteket keresi – a gyors tanulási képesség a negyedik legfontosabb kiválasztási szemponttá vált, alig lemaradva a szakmai tapasztalat mögött. A megbízhatóság ugyanakkor marad az első számú elvárás (90 százalék), mert a vállalat csak stabil, tervezhető jelöltbe fektet be."},{"cim":"Ezerrel pörög a diákmunka Somogyban – áruházak és balatoni vendéglátóhelyek adják a legtöbb feladatot","url":"https://www.sonline.hu/helyi-kozelet/2026/08/diakmunka-somogy-balaton-kaposvar-vendeglatas-szereles","forras":"SONLINE","datum":"2026-08-13","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A Meló-Diák Iskolaszövetkezet szerint Somogyban mintegy 1000 diák vállalt nyári munkát, a legtöbben a vendéglátásban: a Balaton-parton a panziók, kempingek, büfék és strandok hostess-, recepciós-, szobalány- és felszolgálói állásai a legkeresettebbek, Kaposváron pedig a képzettséget nem igénylő feladatok, csomagolás, összeszerelés a gyárakban, árufeltöltés és pénztárosi munka. A korábbi évek felfutása után idén stagnál a piac, a Balaton szezonja is visszafogottabban indult a kevesebb vendég miatt. Az órabér a kiemelt balatoni övezetben eléri vagy meghaladja a 2000 forintot. Egy olvasó ugyanakkor arra panaszkodott, hogy az áruházakban sok a diák, de kevés a tapasztalt eladó, és emiatt akadozik a kiszolgálás.","kulcsszavak":["diákmunka","szezonális munka","turizmus"],"het":"2026-08-10","url_forras":"docx","id":"ART-0471","kivonat":"A Meló-Diák Iskolaszövetkezet szerint Somogyban mintegy 1000 diák vállalt nyári munkát, a legtöbben a vendéglátásban: a Balaton-parton a panziók, kempingek, büfék és strandok hostess-, recepciós-, szobalány- és felszolgálói állásai a legkeresettebbek, Kaposváron pedig a képzettséget nem igénylő feladatok – csomagolás, összeszerelés a gyárakban, árufeltöltés és pénztárosi munka. A korábbi évek felfutása után idén stagnál a piac, a Balaton szezonja is visszafogottabban indult a kevesebb vendég miatt. Az órabér a kiemelt balatoni övezetben azonban eléri vagy meghaladja a 2000 forintot. Egy olvasó ugyanakkor arra panaszkodott, hogy az áruházakban sok a diák, de kevés a tapasztalt eladó, és emiatt akadozik a kiszolgálás."},{"cim":"Szívóerő külföldről, mentőöv a diákoktól? − Terítéken a hazai munkaerőtartalék-helyzet az őszi HR-csúcson","url":"https://www.portfolio.hu/gazdasag/20260812/szivoero-kulfoldrol-mentoov-a-diakoktol-teriteken-a-hazai-munkaerotartalek-helyzet-az-oszi-hr-csucson-852848","forras":"Portfolio","datum":"2026-08-12","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A foglalkoztatás stabil, éves szinten mégis közel 30 ezres a visszaesés, 4,633 millió főre, és ebbe beleszámítanak az átmenetileg külföldön dolgozók is, akiknek száma rekordmagas, 124 ezer fő; a magyar bérek uniós sereghajtó szintje mellett a Z generáció hattizede költözne jobb állásért külföldre. A cégek egyik reménye a diákok bevonása: a Meló-Diák becslése szerint idén országosan mintegy 100 ezer tanuló vállal diákmunkát, a gyakornoki pozíciók pedig gyakran a főállás előszobájává válnak. Hosszú távon azonban a demográfia szab korlátot: tavaly már csak 72 ezer gyermek született, idén februárban pedig 1949 óta a legalacsonyabb a születésszám, vagyis a diákok is egyre kevésbé jelentenek majd tartalékot.","kulcsszavak":["munkaerő-tartalék","demográfia","diákmunka"],"het":"2026-08-10","url_forras":"docx","id":"ART-0472","kivonat":"A foglalkoztatás stabil, éves szinten mégis közel 30 ezres a visszaesés (4,633 millió fő), és ebbe beleszámítanak az átmenetileg külföldön dolgozók is, akiknek száma rekordmagas, 124 ezer – a magyar bérek uniós sereghajtó szintje mellett a Z generáció hattizede költözne jobb állásért külföldre. A cégek egyik reménye a diákok bevonása: a Meló-Diák becslése szerint idén országosan mintegy 100 ezer tanuló vállal diákmunkát, a gyakornoki pozíciók pedig gyakran a főállás előszobájává válnak. Hosszú távon azonban a demográfia szab kemény korlátot: tavaly már csak 72 ezer gyermek született, idén februárban pedig 1949 óta a legalacsonyabb a születésszám – vagyis a diákok is egyre kevésbé jelentenek majd tartalékot."},{"cim":"A dolgozókat és a cégeket is érinti: több fontos munkaügyi szabály változhat","url":"https://www.hrportal.hu/hr/a-dolgozokat-es-a-cegeket-is-erinti-tobb-fontos-munkaugyi-szabaly-valtozhat-20260807.html","forras":"HR Portál","datum":"2026-08-07","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"Az új kormány megtartotta első, informális VKF-ülését a munkaadói és munkavállalói érdekképviseletekkel Kátai-Németh Vilmos szociális és családügyi miniszter vezetésével. Négy fő kérdés volt napirenden: a legalacsonyabb bérek szabályozása, a munkajog és a munkavédelmi előírások felülvizsgálata, a bértranszparencia-irányelv átvétele és a harmadik országbeli munkavállalók foglalkoztatásának szabályozása. A fórum szeptember első felében ül össze újra, akkor már a bérekről is tárgyalnak, az érdekegyeztetés rendszerének esetleges átalakítása pedig várhatóan csak jövő év elejétől jöhet. A MASZSZ két saját javaslatot vetett fel: egy szabad- és zárttéri munkahelyekre szóló hőhatár-protokollt, valamint december 24. munkaszüneti nappá nyilvánítását.","kulcsszavak":["munkajog","bértranszparencia","politika","vendégmunka"],"het":"2026-08-03","url_forras":"docx","id":"ART-0473","kivonat":"Az új kormány megtartotta első, informális VKF-ülését a munkaadói és munkavállalói érdekképviseletekkel Kátai-Németh Vilmos szociális és családügyi miniszter vezetésével. Négy fő kérdés volt: a legalacsonyabb bérek szabályozása, a munkajog és a munkavédelmi előírások felülvizsgálata, a bértranszparencia-irányelv átvétele és a harmadik országbeli munkavállalók foglalkoztatásának szabályozása. A fórum szeptember első felében ül össze újra, akkor már a bérekről is tárgyalnak, az érdekegyeztetés rendszerének esetleges átalakítása pedig várhatóan csak jövő év elejétől jöhet. A MASZSZ két saját javaslatot is felvetett: egy szabad- és zárttéri munkahelyekre szóló hőhatár-protokollt, valamint december 24. munkaszüneti nappá nyilvánítását."},{"cim":"Minimálbér: a VOSZ szerint át kell írni a 2027-es számokat","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/08/beremele-vosz-perlusz-laszlo-berek-gazdasag","forras":"Világgazdaság","datum":"2026-08-12","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A VOSZ főtitkára, Perlusz László szerint a 2027-re tervezett 14 százalékos minimálbér-emelés alapjául szolgáló növekedési pálya nem valósult meg: a hároméves megállapodás évi 3,5–4,5 százalékos GDP-bővüléssel számolt, de a három év összesített növekedése várhatóan az 5 százalékot sem éri el. A megállapodás tartalmazza az újratárgyalás lehetőségét, ha a makromutatók egy százalékpontnál jobban eltérnek a várttól, Perlusz szerint pedig még a kétszámjegyű emelés sem indokolható, a tét a munkahelyek megtartása. A szakszervezetek a felzárkóztatást sürgetik, mert az EU negyedik legalacsonyabb minimálbére Magyarországon van. A hivatalos tárgyalások még nem kezdődtek el, de a 14 százaléknál kisebb emelés várható, a legnagyobb vita pedig a több dolgozót érintő garantált bérminimum körül alakulhat ki.","kulcsszavak":["bérek","munkáltatói szövetség","szakszervezet"],"het":"2026-08-10","url_forras":"kezi","id":"ART-0474","kivonat":"A VOSZ főtitkára, Perlusz László szerint a 2027-re tervezett 14 százalékos minimálbér-emelés alapjául szolgáló növekedési pálya nem valósult meg: a hároméves megállapodás évi 3,5–4,5 százalékos GDP-bővüléssel számolt, de a három év összesített növekedése sem éri el várhatóan az 5 százalékot. A megállapodás eleve tartalmazza az újratárgyalás lehetőségét, ha a makromutatók egy százalékpontnál jobban eltérnek a várttól – Perlusz szerint még a kétszámjegyű emelés sem indokolható, a tét pedig a munkahelyek megtartása. A szakszervezetek viszont a felzárkóztatást sürgetik, hiszen z EU negyedik legalacsonyabb minimálbére van Magyarországon. A hivatalos tárgyalások még nem kezdődtek el, de elemzők szerint a 14 százaléknál kisebb emelés várható, a legnagyobb vita pedig a több dolgozót érintő garantált bérminimum körül alakulhat ki."},{"cim":"Ennyit keres egy motoros ételfutár egyetlen hét alatt 2026-ban Budapesten: főállásban is durván megéri","url":"https://www.penzcentrum.hu/karrier/20260808/ennyit-keres-egy-motoros-etelfutar-egyetlen-het-alatt-2026-ban-budapesten-foallasban-is-durvan-megeri-1203619","forras":"Pénzcentrum","datum":"2026-08-08","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Egy „Prokopton” néven videózó robogós ételfutár a TikTokon dokumentálta, hogy öt nap alatt közel 51 óra munkával 251 856 forint bruttó bevételt ért el, ami óránként nagyjából 4966 forintnak felel meg, napi átlagban viszont több mint tíz óra munkával. Az összeg félrevezető lehet: a platformos futárok jellemzően vállalkozóként dolgoznak, így a bevételből maguknak kell rendezniük az adókat és a járulékokat, valamint a jármű üzemanyag-, szerviz- és amortizációs költségeit. Egy teljes munkaidős futár havi bruttó bevétele 500–660 ezer forint körül alakulhat, a nettó azonban az adózási formától és a kiadásoktól függően jóval alacsonyabb. Összehasonlításul, a KSH szerint 2026 májusában a bruttó átlagkereset országosan 764 100 forint volt, a szállítási ágazatban 734 900 forint.","kulcsszavak":["bérek","rugalmas foglalkoztatás"],"het":"2026-08-03","url_forras":"docx","id":"ART-0475","kivonat":"Egy „Prokopton” néven videózó robogós ételfutár a TikTokon dokumentálta, hogy öt nap alatt közel 51 óra munkával 251 856 forint bruttó bevételt ért el – ez óránként nagyjából 4966 forint, napi átlagban viszont több mint tíz óra munkával. Az összeg azonban félrevezető lehet: a platformos futárok jellemzően vállalkozóként dolgoznak, így a bevételből maguknak kell rendezniük az adókat és a járulékokat, valamint a jármű üzemanyag-, szerviz- és amortizációs költségeit. Egy teljes munkaidős futár havi bruttó bevétele 500–660 ezer forint körül alakulhat, a nettó azonban az adózási formától és a kiadásoktól függően jóval alacsonyabb. Összevetésül: a KSH szerint 2026 májusában a bruttó átlagkereset országosan 764 100 forint volt, a szállítási ágazatban 734 900."},{"cim":"Masszív munkaerő-toborzási kampányt indított a BYD","url":"https://www.autoszektor.hu/hu/content/massziv-munkaero-toborzasi-kampanyt-inditott-byd","forras":"Autószektor","datum":"2026-08-10","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"Miközben a nagy német autógyártók tömegesen bocsátanak el, a kínai BYD több mint 9000 új munkatársat keres sencseni ipari központjába, gyártósori operátoroktól a mérnökökön át a vezetőkig. A háttérben a robbanásszerű exportnövekedés áll: a cég 2025-ben 1,05 millió járművet adott el külföldön, 145 százalékkal többet, mint egy évvel korábban, 2026 első felében pedig már közel 790 ezret, 70 százalékos növekedéssel. A toborzás a BYD lokalizációs stratégiájába illeszkedik, amely helyi gyártókapacitást épít a fő piacokon: Brazíliában már 5500 fő fölött, Thaiföldön öt modellel, Európában pedig éppen Szegeden épül a vállalat első személyautó-gyára. Az előretörés a szélesebb kínai exportboom része, idén júniusban először lépte át a havi járműexport az egymillió darabot.","kulcsszavak":["toborzás","beruházás","autóipar"],"het":"2026-08-10","id":"ART-0476","url_forras":"talalt","kivonat":"Miközben a nagy német autógyártók tömegesen bocsátanak el, a kínai BYD több mint 9000 új munkatársat keres sencseni ipari központjába – gyártósori operátoroktól a mérnökökön át a vezetőkig. A hátterében a robbanásszerű exportnövekedés áll: a cég 2025-ben 1,05 millió járművet adott el külföldön (+145 százalék), 2026 első felében pedig már közel 790 ezret (+70 százalék). A toborzás a BYD lokalizációs stratégiájába illeszkedik, amely helyi gyártókapacitást épít a fő piacokon – Brazíliában már 5500 fő fölött, Thaiföldön öt modellel, Európában pedig éppen Szegeden épül a vállalat első személyautó-gyára. A előretörés a szélesebb kínai exportboom része: idén júniusban először lépte át a havi járműexport az egymillió darabot."},{"cim":"Kiderült, miért a nyár a legveszélyesebb időszak a hazai munkahelyeken","url":"https://www.economx.hu/eletmod/2026/08/11/munkahelyi-balesetek-nyar-hoseg-kockazat/","forras":"Economx","datum":"2026-08-11","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC közlése szerint a nyári hónapokban több tényező együtt hajtja fel a munkahelyi balesetek számát: a hőség rontja a koncentrációt és gyorsabban kifáraszt, a szabadságolások miatt hiányzó rutinos kollégákat pedig gyakran a munkafolyamatokat még nem ismerő átmeneti vagy új belépők helyettesítik. Tovább nehezíti a helyzetet, hogy több ágazatban, az építőiparban, a logisztikában és a vendéglátásban éppen nyáron tetőzik a szezon, a sok túlóra és a hosszabb műszakok pedig fokozzák a terhelést. A hőstressz nemcsak a szabadban dolgozókat viseli meg, hanem az irodai alkalmazottakat is, akiket az ingázás közben ér. A szakértők szerint a kockázat tudatos tervezéssel, megfelelő pihenőidővel és folyadékbevitellel mérsékelhető.","kulcsszavak":["WHC","munkakörülmények","szezonális munka"],"het":"2026-08-10","url_forras":"docx","id":"ART-0477","kivonat":"A WHC közlése szerint a nyári hónapokban több tényező együtt hajtja fel a munkahelyi balesetek számát: a hőség rontja a koncentrációt és gyorsabban kifáraszt, a szabadságolások miatt hiányzó rutinos kollégákat pedig gyakran a munkafolyamatokat még nem ismerő átmeneti vagy új belépők helyettesítik. Tovább nehezíti a helyzetet, hogy több ágazatban – az építőiparban, a logisztikában és a vendéglátásban – éppen nyáron tetőzik a szezon, a sok túlóra és a hosszabb műszakok pedig fokozzák a terhelést. A hőstressz nemcsak a szabadban dolgozókat viseli meg, hanem az irodai alkalmazottakat is, akiket az ingázás közben ér. A szakértők szerint a kockázat tudatos tervezéssel, megfelelő pihenőidővel és folyadékbevitellel mérsékelhető."},{"cim":"Így változtatja meg a fizetésemelési tárgyalásokat a bértranszparencia","url":"https://profitline.hu/igy-valtoztatja-meg-a-fizetesemelesi-targyalasokat-a-bertranszparencia-489553","forras":"HRPOWER","datum":"2026-08-08","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC szerint a bértranszparencia-irányelv alapjaiban változtatja meg a bértárgyalásokat: a munkavállalók ezentúl joggal kérhetik ki, hogy az azonos értékű munkát végzők nemenkénti bontásban átlagosan mennyit keresnek, így a bérezés egyre inkább átlátható szabályokon és munkaköri értéken alapul majd. A szabály nem hozza nyilvánosságra az egyéni fizetéseket, és nem jár automatikus emeléssel, de ha az azonos munkakörökben a nemek közötti bérkülönbség meghaladja az 5 százalékot, és nincs rá objektív indok, vizsgálatot kell indítani. A magyar jogszabály még kidolgozás alatt áll, a WHC szerint azonban a javadalmazási rendszer átvilágítását és a vezetők felkészítését már érdemes elkezdeni.","kulcsszavak":["bértranszparencia","WHC","bérek","esélyegyenlőség"],"het":"2026-08-03","id":"ART-0478","url_forras":"talalt","kivonat":"A WHC szerint a bértranszparencia-irányelv alapjaiban változtatja meg a bértárgyalásokat: a munkavállalók ezentúl joggal kérhetik ki, hogy az azonos értékű munkát végzők – nemenkénti bontásban – átlagosan mennyit keresnek, így a bérezés egyre inkább átlátható szabályokon és munkaköri értéken alapul majd, nem azon, ki tud jobban alkudni. A szabály nem hozza nyilvánosságra az egyéni fizetéseket, és nem jár automatikus emeléssel, de ha az azonos munkakörökben a nemek közötti bérkülönbség meghaladja az 5 százalékot, és nincs rá objektív indok, vizsgálatot kell indítani. A magyar jogszabály még kidolgozás alatt áll, a WHC szerint azonban a javadalmazási rendszer átvilágítását és a vezetők felkészítését már érdemes elkezdeni."},{"cim":"A kormányváltás után nehezebben helyezkednek el a magyarok – a vendégmunkások kitiltása nem fordított ezen","url":"https://www.vg.hu/vilaggazdasag-magyar-gazdasag/2026/08/munkaerupia-egyre-nehezebb-helyezkednek-el-a-magyarok","forras":"Világgazdaság","datum":"2026-08-12","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A BNP Paribas Cardif felmérése szerint a magyar munkavállalók az év elejéhez képest jóval nehezebbnek látják álláskeresési esélyeiket: azok aránya, akik szerint nehezen találnának munkahelyet, a második negyedévre 18-ról 37 százalékra ugrott, míg azoké, akiknek nem okozna gondot az álláskeresés, 53-ról 19 százalékra esett. Az állását csak a válaszadók harmada tartja biztosnak legalább öt évre, az elhelyezkedést az ország középső részén élők látják a legkönnyebbnek. A megtartásban nemcsak a bér számít: az esetek közel felében a munkahelyi légkör és az ingázási távolság is meghatározó, az alkalmazottak 64 százaléka jól érzi magát a munkahelyén, és anyagilag jobb ajánlatért is csak 26 százalék váltana.","kulcsszavak":["foglalkoztatottság","munkakörülmények","megtartás"],"het":"2026-08-10","id":"ART-0479","url_forras":"kezi","kivonat":"A BNP Paribas Cardif felmérése szerint a magyar munkavállalók az év elejéhez képest jóval nehezebbnek látják álláskeresési esélyeiket: azok aránya, akik szerint nehezen találnának munkahelyet, a második negyedévre 18-ról 37 százalékra ugrott, míg azoké, akiknek nem okozna gondot az álláskeresés, 53-ról 19 százalékra esett. Az állását csak a válaszadók harmada tartja biztosnak legalább öt évre, az elhelyezkedést az ország középső részén élők látják a legkönnyebbnek. A megtartásban nemcsak a bér számít: az esetek közel felében a munkahelyi légkör és az ingázási távolság is meghatározó, az alkalmazottak 64 százaléka jól érzi magát a munkahelyén, és anyagilag jobb ajánlatért is csak 26 százalék váltana."},{"cim":"Már nem csak nyárra keresnek diákmunkásokat: egyre több cég hosszabb távon számít a fiatalokra","url":"https://eduline.hu/felsooktatas/20260816_diakmunka-munkaltatok-egesz-evi-munka-szakmai-valasztek","forras":"Eduline","datum":"2026-08-16","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A Prodiák Iskolaszövetkezet szerint egyre több cég egész évben számít a fiatalokra, és sokan olyan diákot keresnek, akivel a diploma után is terveznek. Az átlagos órabér a vendéglátásban 1928, az irodai munkáknál 2223 forint, az IT- és mérnöki gyakornoki helyeken pedig a 3000–4000 forint sem ritka. A levelező munkarendben tanulók a szabályozás miatt nem dolgozhatnak iskolaszövetkezeten keresztül, mert az csak a nappali tagozatosokhoz köthető, így csak hagyományos munkaviszonyban vagy megbízással foglalkoztathatók.","kulcsszavak":["diákmunka","Prodiák","pályakezdők"],"het":"2026-08-10","url_forras":"docx","id":"ART-0480","kivonat":"Egyre több cég egész évben számít a fiatalokra, a Prodiák Iskolaszövetkezet szerint sokan már olyan diákot keresnek, akivel hosszabb távon is terveznek – egy jó gyakornokból a diploma után főállású kolléga is lehet. Az átlagos órabér a vendéglátásban 1928, az irodai munkáknál 2223 forint, az IT- és mérnöki gyakornoki helyeken a 3000–4000 forint sem ritka. A fiatalok egy része azonban eleve hátrányból indul: a levelező munkarendben tanulók – a nappalisokkal ellentétben – jellemzően nem dolgozhatnak iskolaszövetkezeten keresztül, mert a szabályozás a külső szolgáltatást a nappali tagozatosokhoz köti. Így hiába vállalnának akár több teljes munkanapot is hetente, csak hagyományos munkaviszonyban vagy megbízással foglalkoztathatók."},{"cim":"STOP-hatás: vendégmunkások a hazai agráriumban","url":"https://haszon.hu/agrar/vendegmunkasstop/","forras":"Haszon","datum":"2026-08-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"A kormány júniusi vendégmunkás-szigorítása aggasztja az agrár- és élelmiszeripart, ahol a gazdák 40 százaléka küzd munkaerőhiánnyal, főleg gépkezelő, állattenyésztő, karbantartó, húsfeldolgozó és pék munkakörökben. A FruitVeB és a Tej Terméktanács szerint az ázsiai munkaerő nem kényelmi megoldás, hanem kényszer, mert állatgondozásra és fejésre évek óta nincs hazai jelölt. A foglalkoztatottaknak Magyarországon csak 2,5 százaléka külföldi, szemben az osztrák 25 és a cseh-lengyel 10 százalék feletti aránnyal. A MOSZ elnöke, Koncz Máté szerint vidéken egyszerre van munkanélküliség és munkaerőhiány, ezért a gépesítés és a jobb munkakörülmények is szükségesek.","kulcsszavak":["vendégmunka","vendégmunkás-stop","munkaerőhiány","agrárium"],"het":"2026-08-17","url_forras":"docx","id":"ART-0481","kivonat":"A kormány júniusi vendégmunkás-szigorítása aggasztja az agrár- és élelmiszeripart. Az agrárcégek, a gazdák 40 százaléka küzd munkaerőhiánnya, főleg gépkezelő, állattenyésztő és karbantartó, húsfeldolgozó és pék munkakörökben. A FruitVeB és a Tej Terméktanács szerint az ázsiai munkaerő nem kényelmi megoldás, hanem kényszer – állatgondozásra és fejésre évek óta szinte lehetetlen hazai munkaerőt találni –, a korlátozás pedig hátrányba hozza a magyar cégeket az uniós versenytársakkal szemben. A munkaerő-közvetítők rámutatnak: a foglalkoztatottaknak Magyarországon csak 2,5 százaléka külföldi, szemben az osztrák 25-tel és a cseh-lengyel 10 százalék felettivel. A MOSZ elnöke, Koncz Máté szerint vidéken egyszerre van munkanélküliség és munkaerőhiány, ezért a gépesítés és a jobb munkakörülmények is elengedhetetlenek."},{"cim":"Újabb vendégmunkások érkezhettek Soltra a vendégmunkásstop ellenére?","url":"https://magyarjelen.hu/belfold/33015-ujabb-vendegmunkasok-erkezhettek-soltra-a-vendegmunkasstop-ellenere","forras":"Magyar Jelen","datum":"2026-08-19","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Lantos János, a Mi Hazánk munkaügyi kabinetvezetője videójában azt állítja, hogy a napokban harminc-negyven Fülöp-szigeteki vendégmunkás érkezett a Bács-Kiskun vármegyei Soltra, ahol egy helyi motelben szállásolták el őket, és vélhetően naponta Dunaújvárosba viszik dolgozni. Felvetése szerint ez ellentmond a kormány június 6-i vendégmunkásstopjának. Álláspontja szerint a magyarázat a szabályozásban hagyott kiskapukban keresendő, amelyekre a párt korábban figyelmeztetett.","kulcsszavak":["vendégmunka","vendégmunkás-stop","politika"],"het":"2026-08-17","url_forras":"docx","id":"ART-0482","kivonat":"Lantos János, a Mi Hazánk munkaügyi kabinetvezetője videójában helyi információkra hivatkozva azt állítja, hogy a napokban harminc-negyven Fülöp-szigeteki vendégmunkás érkezett a Bács-Kiskun vármegyei Soltra, ahol egy helyi motelben szállásolták el őket, és vélhetően naponta Dunaújvárosba viszik dolgozni. A politikus felveti, hogyan történhetett ez, ha a kormány június 6-án vendégmunkásstopot hirdetett. Álláspontja szerint a magyarázat a szabályozásban hagyott kiskapukban keresendő, amelyekre a párt korábban figyelmeztetett."},{"cim":"Óriási önszabotázs, ami a magyar cégeknél folyik jelenleg: súlyos böjtje lehet a tömeges leépítéseknek","url":"https://www.penzcentrum.hu/vallalkozas/20260818/oriasi-onszabotazs-ami-a-magyar-cegeknel-folyik-jelenleg-sulyos-bojtje-lehet-a-tomeges-leepiteseknek-1204105","forras":"Pénzcentrum","datum":"2026-08-18","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Menton Jobs üzletfejlesztési igazgatója, Letenovics Roland szerint a hazai technológiai cégeknél a fluktuáció évi 28 százalék, szemben a nyugat-európai 17,4 százalékkal, a gyártói kékgallérosoknál pedig 25 százalék a nyugati 12–20 százalékkal szemben. Egy 500 fős magyar termelő vállalatnak ezért évente 35–40 emberrel többet kell toboroznia ugyanahhoz a kapacitáshoz, mint egy németnek, ez 120–150 millió forint többletkiadás. A fluktuáció a profitot terheli: 5 százalékos EBIT mellett a magyar cégnek a 7 százalékpont extra fluktuáció fedezésére évi 2,5 milliárd forint többletbevételre lenne szüksége a német versenytárshoz képest.","kulcsszavak":["megtartás","toborzás","Menton Jobs"],"het":"2026-08-17","url_forras":"docx","id":"ART-0483","kivonat":"A Menton Jobs üzletfejlesztési igazgatója, Letenovics Roland szerint a hazai technológiai cégeknél a fluktuáció évi 28 százalék, szemben a nyugat-európai 17,4 százalékkal, a gyártói kékgallérosoknál pedig 25 százalék körüli a 12–20 százalékos nyugati aránnyal szemben. Ennek súlyos ára van: egy 500 fős magyar termelő vállalatnak évente 35–40 emberrel többet kell toboroznia ugyanazért a kapacitásért, mint egy németnek – ez 120–150 millió forint többletkiadás. A fluktuáció ráadásul nem a bevételt, hanem a profitot terheli: 5 százalékos EBIT mellett a magyar cégnek a 7 százalékpont extra fluktuáció fedezésére évi 2,5 milliárd forint többletbevételre lenne szüksége a német versenytárshoz képest."},{"cim":"Még csak érik a minimálbérvita, de már egymásnak estek a munkaadók és a szakszervetek","url":"https://www.economx.hu/magyar-gazdasag/2026/08/15/meg-csak-erik-minimalber-vita-mar-egymasnak-estek-munkaadok-szakszervetek-kormany-vkf-munkastanacsok/","forras":"Economx","datum":"2026-08-15","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A munkaadók a vártnál gyengébb növekedés miatt a 2027-re kialkudott 14 százalék helyett csak egyszámjegyű béremelést tartanak reálisnak, miközben a Magyar Szakszervezeti Szövetség szerint még a 14 is kevés lenne ahhoz, hogy a minimálbér elérje a bruttó átlagkereset felét. A Munkástanácsok alelnöke, Bubenkó Csaba szerint a vita nem a tőkeerős nagyvállalatokról szól, hanem arról, hogy a foglalkoztatás 70 százalékát adó kkv-k ki tudják-e gazdálkodni a kötelező emelést, mert ha nem, azt a dolgozók fizetik meg elbocsátással. A szövetség ezért méretarányos, átmeneti kompenzációt javasol a kisvállalkozásoknak, például a minimálbér-emeléshez kötött, célzott munkáltatóijárulék-csökkentéssel. A hivatalos egyeztetés szeptemberben indul.","kulcsszavak":["bérek","szakszervezet","gazdasági kilátások"],"het":"2026-08-10","url_forras":"docx","id":"ART-0484","kivonat":"Bár a hivatalos egyeztetés szeptemberben indul, a munkaadók már jelezték: a vártnál gyengébb növekedés miatt a 2027-re kialkudott 14 százalék helyett csak egyszámjegyű emelés reális – a Magyar Szakszervezeti Szövetség szerint viszont még a 14 is kevés ahhoz, hogy a minimálbér elérje a bruttó átlagkereset felét. A Munkástanácsok alelnöke, Bubenkó Csaba szerint a vita nem a tőkeerős nagyvállalatokról szól, hanem arról, hogy a foglalkoztatás 70 százalékát adó kkv-k ki tudják-e gazdálkodni a kötelező emelést – ha nem, azt a dolgozók fizetik meg elbocsátással. A szövetség ezért méretarányos, átmeneti kompenzációt javasol a kisvállalkozásoknak, például a minimálbér-emeléshez kötött, célzott munkáltatóijárulék-csökkentéssel."},{"cim":"Még mindig óriási a bérszakadék a férfiak és a nők között","url":"https://mfor.hu/cikkek/vallalatok/meg-mindig-oriasi-a-berszakadek-a-ferfiak-es-a-nok-kozott.html","forras":"MFOR","datum":"2026-08-19","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az öt hazai szakszervezeti konföderáció közös javaslatot tett két uniós irányelv átültetésére, a bérdiszkrimináció felszámolására és a bértitok eltörlésére hivatkozva a 16,9 százalékos hazai nemek közötti bérszakadékra, amely meghaladja a 11 százalékos uniós átlagot. Javaslatuk szerint létszámtól függetlenül minden munkáltatónak kötelező lenne az átlátható, nemi szempontból semleges bérstruktúra, és az érdekképviseletek jogot kapnának a béradatok megismerésére. A csomag célja, hogy közelítve a 80 százalékos uniós szinthez, jóval több dolgozót védjen kollektív szerződés, ehhez a szakszervezeti jogok megerősítését és a sztrájkszabályozás felülvizsgálatát kérik. A jogsértő munkáltatókat kizárnák az állami támogatásokból és a közbeszerzésekből, és önálló hatóságot állítanának a megszüntetett Egyenlő Bánásmód Hatóság helyére.","kulcsszavak":["bértranszparencia","nők a munkaerőpiacon","szakszervezet","munkajog"],"het":"2026-08-17","url_forras":"docx","id":"ART-0485","kivonat":"Az öt hazai szakszervezeti konföderáció közös javaslatot tett két uniós irányelv átültetésére, fő elemként a bérdiszkrimináció felszámolására és a bértitok eltörlésére – indokként a magyarországi 16,9 százalékos nemek közötti bérszakadékot hozzák, amely jóval meghaladja a 11 százalékos uniós átlagot. Azt javasolják, hogy létszámtól függetlenül minden munkáltatónak kötelező legyen az átlátható, nemi szempontból semleges bérstruktúra, az érdekképviseletek pedig kapjanak jogot a béradatok megismerésére. A csomag másik célja, hogy jóval több dolgozót védjen kollektív szerződés – közelítve a 80 százalékos uniós szinthez –, ehhez a szakszervezeti jogok megerősítését és a sztrájkszabályozás felülvizsgálatát kérik. A jogsértő munkáltatókat kizárnák az állami támogatásokból és a közbeszerzésekből, és önálló hatóságot állítanának a megszüntetett Egyenlő Bánásmód Hatóság helyére."},{"cim":"Egy váratlan kiadás, és borul minden: így csúsznak adósságba a legszegényebb családok","url":"https://www.economx.hu/magyar-gazdasag/2026/08/19/penzugyi-edukacio-varatlan-kiadas-ksh-okumenikus-szervezet-kamat-alacsony-vegzettseg-jovedelem/","forras":"Economx","datum":"2026-08-19","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"Az Economx szerint egy tartalék nélkül élő családnál már egy 50–100 ezer forintos váratlan kiadás krízist okozhat, rosszabb esetben uzsorahitelbe sodorhat, jelezte az Ökumenikus Segélyszervezet. A végzettség és a jövedelem szoros összefüggésben áll: a legfeljebb nyolc általánost végzettek a minimálbérhez vannak láncolva, és a felcserélhető betanított munkakörökben gyakorlatilag nulla a béralku-pozíciójuk. A KSH szerint az alapfokú végzettségűek relatív szegénységi aránya 32,2 százalék, 2016-ban még csak 20,2 volt, szemben a diplomások 3,1 százalékával. Az OECD mérésében a magyar felnőtteknek csak a fele old meg egy egyszerű kamatszámítást.","kulcsszavak":["bérek","esélyegyenlőség","kutatás és statisztika"],"het":"2026-08-17","url_forras":"docx","id":"ART-0486","kivonat":"Az Economx szerint egy tartalék nélkül élő családnál már egy 50–100 ezer forintos váratlan kiadás krízist okozhat, rosszabb esetben uzsorahitelbe sodorhat – jelezte az Ökumenikus Segélyszervezet. A háttérben a végzettség és a jövedelem szoros összefüggése áll: a legfeljebb nyolc általánost végzettek a minimálbérhez vannak láncolva, és a felcserélhető betanított munkakörökben gyakorlatilag nulla a béralku-pozíciójuk. A KSH szerint az alapfokú végzettségűek relatív szegénységi aránya 32,2 százalék (2016-ban 20,2), szemben a diplomások 3,1 százalékával – a helyzetet pedig a pénzügyi analfabetizmus súlyosbítja, hiszen az OECD mérésében a magyar felnőtteknek csak a fele old meg egy egyszerű kamatszámítást."},{"cim":"Közel húsz új munkahely és csúcstechnológia érkezik, felpörgeti a térséget a mezőtúri beruházás","url":"https://www.szoljon.hu/helyi-gazdasag/2026/08/mezoturi-beruhazas-robotizalt-uj-uzem","forras":"SZOLJON","datum":"2026-08-16","fokategoria":"piac","alkategoria":"Beruházások / leépítések","osszefoglalo":"A mezőtúri Baracsi-Paletta Kft. csaknem egymilliárd forintos, robotizált fejlesztéssel válaszol a szigorodó uniós erdőirtási rendeletre (EUDR), amely a faanyag kitermelési helyéig visszamenő nyomonkövethetőséget ír elő. A projekt kulcseleme egy több mint 300 millió forint értékű, német Weinig Dimter gyártósor, amellyel a telephely a gépgyártó közép-kelet-európai referenciaüzemévé válik. A családi vállalkozás az év során közel 20 új munkatársat vett fel, így a létszám már megközelíti a 80 főt, és a mintegy 2 milliárd forintos árbevételét idén további 10–20 százalékkal növelné.","kulcsszavak":["beruházás","automatizáció","ipar"],"het":"2026-08-10","id":"ART-0487","url_forras":"talalt","kivonat":"A mezőtúri Baracsi-Paletta Kft. csaknem egymilliárd forintos, robotizált fejlesztéssel válaszol a szigorodó uniós erdőirtási rendeletre (EUDR), amely a faanyag kitermelési helyéig visszamenő nyomonkövethetőséget ír elő. A projekt kulcseleme egy több mint 300 millió forint értékű, német Weinig Dimter gyártósor, amellyel a telephely a gépgyártó közép-kelet-európai referenciaüzemévé válik. A beruházás megduplázhatja a kapacitást, a családi vállalkozás pedig az év során közel 20 új munkatársat vett fel, így a létszám már megközelíti a 80 főt. Az 1985 óta működő cég a tömeges raklapgyártástól a magasabb hozzáadott értékű, egyedi ipari csomagolás felé mozdult el, és a mintegy 2 milliárd forintos árbevételét idén további 10–20 százalékkal növelné."},{"cim":"Bemondta a jóslatát Elon Musk: ekkortól mindenki alapjövedelmet kaphat, senkinek nem kell majd dolgoznia – de tényleg ilyen egyszerű?","url":"https://www.penzcentrum.hu/gazdasag/20260818/bemondta-a-joslatat-elon-musk-ekkortol-mindenki-alapjovedelmet-kaphat-senkinek-nem-kell-majd-dolgoznia-de-tenyleg-ilyen-egyszeru-1203820","forras":"Pénzcentrum","datum":"2026-08-18","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"Elon Musk a The Economistnak azt jósolta, hogy az AI és a robotok néhány éven belül annyi árut termelnek, hogy a pénz elveszti mai szerepét, és az államnak alapjövedelmet kell adnia a munkájukat vesztőknek. Két hazai közgazdász, Nagy Attila Zoltán (PTE) és Jobbágy Sándor (Concorde) szerint a vízió helyes, de az időzítés túlzás: az OECD a G7-ben évi 0,4–1,3 százalékpontos termelékenységi hatást vár, Daron Acemoglu tíz évre 0,5–0,7 százalékot. A generatív AI óta eltelt öt évben a teljes gazdaság szintjén még alig mutatható ki érdemi ugrás, tartós, globális deflációt pedig egyik elemző sem tart valószínűnek. Az alapjövedelem ötletében egyetértenek: elképzelhető, hogy az AI-ból profitáló cégek adójából finanszíroznák, ám ez ma még csak néhány országra koncentrálódik.","kulcsszavak":["AI","automatizáció","gazdasági kilátások"],"het":"2026-08-17","url_forras":"docx","id":"ART-0488","kivonat":"Elon Musk a The Economistnak azt jósolta, hogy az AI és a robotok néhány éven belül annyi árut termelnek, hogy a pénz elveszti mai szerepét, és az államnak alapjövedelmet kell adnia a munkájukat vesztőknek. Két hazai közgazdász – Nagy Attila Zoltán (PTE) és Jobbágy Sándor (Concorde) – szerint a vízió helyes, de az időzítés túlzás: a szűkösség a véges erőforrások miatt nem szűnik meg, a termelékenységi hatás pedig szerényebb – az OECD a G7-ben évi 0,4–1,3 százalékpontot vár, Daron Acemoglu tíz évre 0,5–0,7 százalékot. A generatív AI óta eltelt öt évben a teljes gazdaság szintjén még alig mutatható ki érdemi ugrás, tartós, globális deflációt pedig egyik elemző sem tart valószínűnek. Az alapjövedelemben viszont egyetértenek: elképzelhető, hogy az AI-ból profitáló cégek adójából finanszíroznák – ám ez ma még csak néhány országra koncentrálódik."},{"cim":"Agyad eldobod, milyen robotokat fejlesztenek a hazai laborokban: tényleg elvehetik hamarosan a magyarok munkáját?","url":"https://www.penzcentrum.hu/tech/20260812/agyad-eldobod-milyen-robotokat-fejlesztenek-a-hazai-laborokban-tenyleg-elvehetik-hamarosan-a-magyarok-munkajat-1203379","forras":"Pénzcentrum","datum":"2026-08-12","fokategoria":"piac","alkategoria":"Hosszú távú trendek","osszefoglalo":"A Bosch vezető alelnöke, Szőke Zoltán szerint téveszme, hogy a robotok rövid időn belül tömegesen váltják ki az embert, a közeljövő az együttműködésről szól, a következő lépcső a ketrec nélkül, emberek mellett dolgozó „kobot”. Magyarország régiós helyzete kedvező az erős autóipar és az aktív egyetemi kutatások miatt, a vezető humanoid fejlesztéseket azonban Ázsia és Észak-Amerika uralja, erre válasz a Bosch–NEURA Robotics európai partnerség. Az ELTE-Bosch tanszéken agyszerű, energiahatékony neurális hálókat és egy alkatrész-kicsomagolást automatizáló logisztikai robotot fejlesztenek.","kulcsszavak":["automatizáció","AI","autóipar"],"het":"2026-08-10","url_forras":"docx","id":"ART-0489","kivonat":"A Bosch vezető alelnöke, Szőke Zoltán szerint téveszme, hogy a robotok rövid időn belül tömegesen váltják ki az embert: a közeljövő az együttműködésről szól, a következő lépcső a ketrec nélkül, emberek mellett dolgozó „kobot”. Magyarország régiós helyzete kedvező az erős autóipar és az aktív egyetemi kutatások miatt, a vezető humanoid fejlesztéseket azonban Ázsia és Észak-Amerika uralja – erre válasz a Bosch–NEURA Robotics európai partnerség. Idehaza az ELTE-Bosch tanszéken agyszerű, energiahatékony neurális hálókat és egy alkatrész-kicsomagolást automatizáló logisztikai robotot fejlesztenek. Az üzenet: a robotok az ismétlődő feladatokat veszik át, hogy az ember a nagyobb szakértelmet igénylő munkára koncentrálhasson."},{"cim":"Nem csitul a kivándorlási hullám, évente 40 ezer magyar hagyja el az országot","url":"https://novekedes.hu/elemzesek/nem-csitul-a-kivandorlasi-hullam-evente-40-ezer-magyar-hagyja-el-az-orszagot","forras":"Növekedés.hu","datum":"2026-08-17","fokategoria":"versenytars","alkategoria":"Trenkwalder","osszefoglalo":"A Trenkwalder és más munkaerőpiaci tanácsadók adatai szerint a Magyarországot elhagyó állampolgárok száma egymást követő években átlépi az évi 40 ezres határt, meghaladva a 2015–2016-os hullámot is, az összlétszám már 714 ezer fölött jár. A fő célország Németország 200 ezer feletti létszámmal, a leggyorsabban növekvő pedig Ausztria 120–140 ezerrel. A 20–24 évesek aránya a kivándorlók között másfél évtized alatt megduplázódott, elérve a 16 százalékot, miközben a képzett magyarok nyugatra mennek, az összeszerelő üzemek alacsonyabb pozícióit pedig ázsiai vendégmunkásokkal töltik fel.","kulcsszavak":["demográfia","Trenkwalder","vendégmunka"],"het":"2026-08-17","id":"ART-0490","url_forras":"talalt","kivonat":"A Trenkwalder és más munkaerőpiaci tanácsadók adatai szerint a Magyarországot elhagyó állampolgárok száma egymást követő években átlépi az évi 40 ezres határt, meghaladva a 2015–2016-os hullámot is; a kivándoroltak összlétszáma már 714 ezer fölött jár – egy (nagy) megyényi lakosság a rendszerváltás óta. A fő célország Németország (200 ezer felett) és a leggyorsabban növekvő Ausztria (120–140 ezer). Aggasztó a kivándorlók elfiatalodása: a 20–24 évesek aránya másfél évtized alatt megduplázódott, elérve a 16 százalékot. A folyamat kettészakadt munkaerőpiacot teremt: a képzett magyarok nyugatra mennek, az összeszerelő üzemek alacsonyabb pozícióit ázsiai vendégmunkásokkal töltik fel."},{"cim":"Csúszik a bértranszparencia bevezetése, lassult a cégek felkészülése","url":"https://nepszava.hu/3330983_bertranszparencia-profession-hu-fizetes-munkaltato-munkavallalo-jovedelem","forras":"Népszava","datum":"2026-08-18","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A bértranszparencia magyarországi átültetésének csúszásával a munkáltatói felkészülés is megtorpant: a Profession.hu szerint a bérinformációt közlő álláshirdetések aránya a tavalyi 25–27 százalékos csúcsról idén 22–23 százalékra esett, míg a bér feltüntetése 20–25 százalékkal több jelentkezőt hoz. A vendéglátásban a hirdetések 58 százaléka közöl bért, a bankszektorban alig 3 százalék. Egy PwC-kutatás szerint csak minden tizedik cég ismeri jól az irányelvet, 75 százalékuk nem is támogatja. A WHC szakértői szerint az információhiány szül bérfeszültséget, ezért a cégeknek előbb a saját bérrendszerüket kell átláthatóvá tenniük munkakör-értékeléssel és objektív bérsávokkal.","kulcsszavak":["bértranszparencia","WHC","Profession.hu"],"het":"2026-08-17","id":"ART-0491","url_forras":"talalt","kivonat":"Mivel a bértranszparencia magyarországi átültetése csúszik, a munkáltatói felkészülés is megtorpant: a Profession.hu szerint a bérinformációt közlő álláshirdetések aránya a tavalyi 25–27 százalékos csúcsról idén 22–23 százalékra esett. Pedig a bér feltüntetése 20–25 százalékkal több jelentkezőt hoz – a vendéglátásban a hirdetések 58 százaléka közöl bért, a bankszektorban viszont alig 3 százalék. A cégek zöme mégis óvatos: egy PwC-kutatás szerint csak minden tizedik ismeri jól az irányelvet, 75 százalékuk nem is támogatja. A WHC szakértői szerint viszont éppen az információhiány szül bérfeszültséget, ezért a cégeknek előbb a saját bérrendszerüket – munkakör-értékeléssel és objektív bérsávokkal – kell átláthatóvá tenniük."},{"cim":"Először 10 ezer felett a Lidl magyarországi létszáma","url":"https://www.hrportal.hu/hr/eloszor-10-ezer-felett-a-lidl-magyarorszagi-letszama-20260827.html","forras":"HR Portál","datum":"2026-08-27","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A nagyvállalatok júniusi létszámadatai szerint a Lidl magyarországi létszáma először lépte át a 10 ezer főt, a Tescónál közel 1000, a Mercedesnél 319, a BMW-nél 110 fős volt a bővülés. A munkaerő-kölcsönzők közül a Prohuman 213, a WHC 172 fővel növelte kölcsönzöttei számát, fél éves szinten a Prohuman 1279, a WHC 895 fővel bővült. Az Aldinál tovább csökkent a létszám, a thyssenkruppnál 222 főt bocsátottak el.","kulcsszavak":["munkaerő-kölcsönzés","foglalkoztatottság","WHC"],"het":"2026-08-24","url_forras":"docx","id":"ART-0492","kivonat":"A nagyvállalatok júniusi létszámadatai alapján több területen is jelentős bővülés történt. A Lidl magyarországi létszáma először lépte át a 10 ezer főt, miközben a Tescónál közel 1000 fős, a Mercedesnél 319, a BMW-nél pedig 110 fős növekedést regisztráltak. A munkaerő-kölcsönzők közül a Prohuman 213, a WHC 172 fővel növelte kölcsönzöttei számát, míg az Aldinál tovább folytatódott a létszámcsökkenés, a thyssenkruppnál pedig 222 fős leépítés történt (fél éves szinten a Prohuman +1279, a WHC +895)."},{"cim":"Nem minden munkaerő-kihívásra ugyanaz a megoldás – a komplex toborzás üzleti előnye","url":"https://www.hrportal.hu/hr/nem-minden-munkaero-kihivasra-ugyanaz-a-megoldas-a-komplex-toborzas-uzleti-elonye-20260825.html","forras":"HR Portál","datum":"2026-08-25","fokategoria":"piac","alkategoria":"Munkaerő-kölcsönzés","osszefoglalo":"Az euJobs HR-Group szolgáltatási vezetője, Antal György szerint a munkaerőpiacon egyre kevésbé működik az egyetlen megoldásra épülő gondolkodás: a raktári csúcsra diákmunka, egy adminisztratív posztra nyugdíjas, egy középvezetői helyre klasszikus közvetítés, egy szezonális gyártási felfutásra kölcsönzés kellhet. A szolgáltatónak előbb az üzleti problémát kell megértenie, és csak azután választani vagy kombinálni a megoldásokat. Egy komplex, a céget már ismerő partner a toborzási ciklust hetekre rövidítheti.","kulcsszavak":["munkaerő-kölcsönzés","toborzás"],"het":"2026-08-24","url_forras":"docx","id":"ART-0493","kivonat":"Az euJobs HR-Group szolgáltatási vezetője, Antal György egy PR-interjúban amellett érvel, hogy a munkaerőpiacon egyre kevésbé működik az egyetlen megoldásra épülő gondolkodás: egy vállalatnak év közben más-más forma kell – a raktári csúcsra diákmunka, egy tapasztalatot igénylő adminisztratív posztra nyugdíjas, egy középvezetői helyre klasszikus közvetítés, egy szezonális gyártási felfutásra kölcsönzés. A lényeg, hogy a szolgáltató előbb az üzleti problémát értse meg, és csak utána válasszon vagy kombináljon. Egy komplex, a céget már ismerő partner a toborzási ciklust hetekre rövidítheti, tette hozzá."},{"cim":"Renner Tamás: A nyugati bérekhez keleti munkaerő is kelleni fog – krónikus a munkaerőhiány Magyarországon","url":"https://24.hu/fn/gazdasag/2026/08/22/nyugati-berek-keleti-munkavallalok-renner-tamas/","forras":"24.hu","datum":"2026-08-22","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Renner Tamás, a jánoshalmi Renner Rubber műszaki igazgatója véleménycikkében amellett érvel, hogy harmadik országbeli dolgozók nélkül a magyar gazdaság nem tud átállni a kormány által megcélzott, magas hozzáadott értékű működésre. Szerinte a krónikus munkaerőhiány hátterében az öregedő társadalom, a 6-700 ezer nyugaton dolgozó magyar és a gyenge oktatási rendszer áll, ami az egészségügytől a feldolgozóiparig azonnali megoldást igényel. Rövid távon elkerülhetetlennek tartja az ellenőrzött körülmények között, 2+1 évre beengedett keleti munkaerőt, emellett a szakképzés, a területi elosztás és a közlekedési infrastruktúra fejlesztését is szükségesnek látja.","kulcsszavak":["vendégmunka","munkaerőhiány","demográfia"],"het":"2026-08-17","url_forras":"docx","id":"ART-0494","kivonat":"A jánoshalmi Renner Rubber műszaki igazgatója, Renner Tamás véleménycikkében amellett érvel, hogy harmadik országbeli dolgozók nélkül nem állítható át a magyar gazdaság arra az innovatív, magas hozzáadott értékű működésre, amelyet a Tisza-kormány megcéloz. Szerinte a krónikus munkaerőhiány – melynek oka az öregedő társadalom, a 6–700 ezer nyugaton dolgozó magyar és a gyenge oktatási rendszer – az egészségügytől a feldolgozóiparig azonnali megoldást kíván. Rövid távon ezért elkerülhetetlen az ellenőrzött körülmények között, 2+1 évre beengedett keleti munkaerő, amely mellett a szakképzés, a területi elosztás és a közlekedési infrastruktúra fejlesztése is szükséges."},{"cim":"Raskó György kitálal: Miért omlott össze a magyar vidék?","url":"https://www.youtube.com/watch?v=Pw-1l5aX-Mw","forras":"Magyar Közöny","datum":"2026-08-25","fokategoria":"piac","alkategoria":"Vendégmunka","osszefoglalo":"Raskó György agrárközgazdász szerint a mezőgazdaság munkaerőhelyzete drámai: a rendszerváltáskor 980 ezren dolgoztak az ágazatban, ma alig 200 ezren, miközben a termelékenység nőtt. Egy dél-alföldi, 100 százalékban magyar tulajdonú, 20 milliárdos termelési értékű zöldség-gyümölcs válogatóban a dolgozók 90 százaléka ázsiai vendégmunkás, mert a hűtött, kemény fizikai munkát magyar nem vállalja, és ha lejár az engedélyük, a gyár leállhat. Raskó szerint a tudásalapú mezőgazdaságra kellene átállni, de a robottechnikát működtető szakemberekből is több ezer hiányzik, ezért azokat ma drágán, külföldről kell hozni.","kulcsszavak":["vendégmunka","vendégmunkás-stop","munkaerőhiány","agrárium"],"het":"2026-08-24","url_forras":"docx","id":"ART-0495","kivonat":"Raskó György agrárközgazdász szerint a mezőgazdaság munkaerőhelyzete drámai: a rendszerváltáskor 980 ezren dolgoztak az ágazatban, ma alig 200 ezren – a termelékenység nőtt, de a kertészetben és az állattenyésztésben eszméletlen a hiány, a szakmunkásképzést pedig az előző kormány szerinte romba döntötte. A vendégmunkás-stop különösen érzékenyen érinti a feldolgozást: egy dél-alföldi, 100 százalékban magyar tulajdonú, 20 milliárdos termelési értékű zöldség-gyümölcs válogatóban a dolgozók 90 százaléka ázsiai vendégmunkás, mert a hűtött, kemény fizikai munkát magyar nem vállalja – ha lejár az engedélyük, a gyár leállhat. Raskó a tudásalapú mezőgazdaságra állna át, ahol a robottechnikát működtető szakemberekből is több ezer hiányzik, így azokat ma drágán, külföldről kell hozni."},{"cim":"Így lesz egy magyar faluból csapda","url":"https://qubit.hu/2026/08/25/igy-lesz-egy-magyar-falubol-csapda","forras":"Qubit","datum":"2026-08-25","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"Egy PTE-s szociológiai kutatás (Zsinka Flóra és Berger Viktor) egy hátrányos helyzetű baranyai aprófalu, a kutatásban „Háromszegnek” nevezett település példáján mutatja meg, miért illúzió, hogy a hiányzó munkaerőt egyszerűen a hazai tartalék bevonásával lehetne pótolni. A faluból naponta csak két-három busz indul, orvos és iskola nincs, az egyetlen helyi munkáltató az önkormányzat, és a 31 megkérdezettből húszan legfeljebb 8 általánost végeztek. A közlekedés önmagában ellehetetleníti a munkavállalást: van, aki azért veszítette el az állását, mert nem indulhatott el fél órával korábban az egyetlen buszhoz, más csak négyórás műszakot tudott vállalni.","kulcsszavak":["munkaerő-tartalék","régiós különbségek","esélyegyenlőség"],"het":"2026-08-24","url_forras":"docx","id":"ART-0496","kivonat":"Egy PTE-s szociológiai kutatás (Zsinka Flóra és Berger Viktor) egy hátrányos helyzetű baranyai aprófalu példáján mutatja meg, miért illúzió, hogy a hiányzó munkaerőt egyszerűen a hazai tartalék bevonásával lehetne pótolni. A „Háromszegnek” nevezett faluból naponta csak két-három busz indul, kevesen vezetnek, orvos és iskola nincs, az egyetlen helyi munkáltató az önkormányzat – a 31 megkérdezettből húszan legfeljebb 8 általánost végeztek. A közlekedés önmagában ellehetetleníti a munkavállalást: valaki azért veszítette el az állását, mert nem indulhatott el fél órával korábban az egyetlen buszhoz, más csak négyórás műszakot tudott vállalni. A helyben maradás így egyszerre kényszer (nincs meg a költözéshez szükséges anyagi és kapcsolati tőke) és választás (a csend, a biztonság, a családi háló értéke). A megoldáshoz a helyi szolgáltatások, a közlekedés és az esélyegyenlőség rendszerszintű fejlesztése kell."},{"cim":"Hajnali szalonna, szex és szocializmus: így telt a diákmunka a KISZ-táboroktól a Burger Kingig","url":"https://welovebudapest.com/cikk/2026/08/23/nyari-diakmunka-tortenete-epitotaboroktol-napjainkig/","forras":"We Love Budapest","datum":"2026-08-23","fokategoria":"piac","alkategoria":"Munkaerő-tartalék","osszefoglalo":"A cikk végigveszi, hogyan alakult a magyar diákmunka a századeleji Diákkaptár-mozgalomtól a mai iskolaszövetkezetekig. Az 1958-ban indult KISZ-építőtábori mozgalomban 1960-ban már 22 ezer diák dolgozott nagyberuházásokon, mezőgazdaságban és konzervgyárakban, hajnali ötös keléssel. A rendszerváltás után az ideológiai nevelést a pénzkeresés váltotta fel, ma pedig sok fiatalnak már a szakmai tapasztalat és a gyakornoki munka a fő motiváció, a cégek pedig egyre inkább jövőbeli kollégát látnak a diákokban.","kulcsszavak":["diákmunka","pályakezdők"],"het":"2026-08-17","url_forras":"docx","id":"ART-0497","kivonat":"A gazdagon illusztrált összeállítás végigveszi, hogyan alakult a magyar diákmunka a századeleji Diákkaptár-mozgalomtól a mai iskolaszövetkezetekig. A fordulópontot az 1958-ban indult KISZ-építőtábori mozgalom hozta: a Komszomol mintájára szervezett, elvben önkéntes táborokban 1960-ban már 22 ezer diák dolgozott –  nagyberuházásokon (a Hanság lecsapolása, a kiskörei vízlépcső), a mezőgazdaságban és konzervgyárakban, hajnali ötös keléssel és sült szalonnás reggelivel. A nyolcvanas évekre, ahogy a rendszer lazult, a munka mellett egyre nagyobb teret kapott az alkohol, a buli és a rendbontás. A rendszerváltás után az ideológiai nevelést a pénzkeresés váltotta fel, ma pedig sok fiatalnak már a szakmai tapasztalat, a gyakornoki munka a fő motiváció, a cégek pedig egyre inkább jövőbeli kollégát látnak a diákokban."},{"cim":"Itt a fordulat a magyar munkaerőpiacon?","url":"https://www.portfolio.hu/gazdasag/20260828/itt-a-fordulat-a-magyar-munkaeropiacon-858828","forras":"Portfolio","datum":"2026-08-28","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A KSH gyorsjelentése szerint a foglalkoztatottak száma a júniusi 4,64 millióról közel 4,7 millióra emelkedett júliusban, amit a szezonális hatás önmagában nem magyaráz. A munkanélküliség 4,6 százalék (225 ezer fő), a férfiaknál változatlan 4,4, a nőknél 4,9 százalékra nőtt, és az egy évnél régebben állást keresők aránya 5,5 százalékponttal, 34,7 százalékra emelkedett. A külföldi munkavállalók száma eközben történelmi csúcson maradt.","kulcsszavak":["foglalkoztatottság","munkanélküliség","gazdasági kilátások"],"het":"2026-08-24","url_forras":"docx","id":"ART-0498","kivonat":"A KSH gyorsjelentése szerint a foglalkoztatottak száma a júniusi 4,64 millióról közel 4,7 millióra emelkedett júliusban, amit pusztán szezonális hatás nem magyaráz – a külföldön dolgozóktól és a közmunkásoktól megtisztítva is jelentős az ugrás. Ez lehet fordulat jele, hiszen a cégek létszámbővítése tartósabb fellendülésre utalhat, egyértelmű trendfordulóhoz azonban a szezonális munkák lecsengése utáni hónapokban is fent kell maradnia a kedvező folyamatoknak. Eközben a külföldi munkavállalók száma történelmi csúcson maradt. A munkanélküliség 4,6 százalék (225 ezer fő), a férfiaknál változatlan 4,4, a nőknél 4,9 százalékra nőtt – aggasztó, hogy az egy évnél régebben állást keresők aránya 5,5 százalékponttal, 34,7 százalékra emelkedett."},{"cim":"Elmondták a hazai vállalatok, mi kellene a magyar gazdaság újraindításához","url":"https://www.portfolio.hu/gazdasag/20260825/elmondtak-a-hazai-vallalatok-mi-kellene-a-magyar-gazdasag-ujrainditasahoz-857818","forras":"Portfolio","datum":"2026-08-25","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Német–Magyar Kamara állásfoglalása szerint a magyar gazdaság újraindításához nem elég az új beruházások ösztönzése, kiszámíthatóbb szabályozás, alacsonyabb ipari energiaárak és gyorsabb munkaerőpiaci alkalmazkodás is kell. A képzett, főként műszaki szakemberek iránti hiány már termelési zavart okoz és növeli a bérnyomást, mert a technológiai átalakulás gyorsabb, mint a kompetenciafejlesztés. A kamara moduláris, gyakorlatorientált oktatási formákat (hat hónapos duális programok, bootcampek, mikrotanúsítványok) és gyorsabb képesítés-elismerést sürget a harmadik országbeli dolgozók számára.","kulcsszavak":["gazdasági kilátások","képzés","munkaerőhiány"],"het":"2026-08-24","url_forras":"docx","id":"ART-0499","kivonat":"A Német–Magyar Kamara állásfoglalása szerint a magyar gazdaság újraindításához nem elég az új beruházások ösztönzése, hanem kiszámíthatóbb szabályozás, alacsonyabb ipari energiaárak és gyorsabb munkaerőpiaci alkalmazkodás kell. A képzett, főként műszaki szakemberek terén fokozodó hiány már termelési zavart okoz és növeli a bérnyomást. A technológiai átalakulás gyorsabb, mint a kompetenciafejlesztés, ezért az oktatásnak évfolyamok helyett a tényleges kompetenciaszintre kellene épülnie, moduláris, gyakorlatorientált formákkal (hat hónapos duális programok, bootcampek, mikrotanúsítványok). Emellett továbbra is szükség van harmadik országbeli dolgozókra – gyorsabb képesítés-elismeréssel és jobb integrációval."},{"cim":"Kitálalt a díjnyertes balatoni fagyis: elképesztő, mit művelnek a munkát kereső magyarok","url":"https://www.penzcentrum.hu/karrier/20260827/kitalalt-a-dijnyertes-balatoni-fagyis-elkepeszto-mit-muvelnek-a-munkat-kereso-magyarok-1204523","forras":"Pénzcentrum","datum":"2026-08-27","fokategoria":"piac","alkategoria":"Munkaerőpiac / makrogazdaság","osszefoglalo":"A Pénzcentrum három szektort kérdezett arról, miként tartják meg a dolgozókat a valamelyest lazuló munkaerőpiacon. Az IMG Építő létszáma három év alatt 30-ról 11 főre esett, sokan egyéni vállalkozóként folytatták, a gépipari Büttner Kft. szerint pedig a bértorlódás a legnagyobb gond, mert egy exportra dolgozó kkv a távol-keleti árverseny miatt nem tudja arányosan emelni a tapasztalt szakemberek bérét. A balatoni Florida Fagyizó szerint a szezonális toborzás nehéz, tíz jelentkezőből öt nem is reagál, és a legnagyobb változás a munkához való viszonyban van, mert a pénz önmagában már nem motivál úgy, mint korábban.","kulcsszavak":["megtartás","toborzás","szezonális munka"],"het":"2026-08-24","url_forras":"docx","id":"ART-0500","kivonat":"A Pénzcentrum három szektort kérdezett arról, hogy a valamelyest lazuló munkaerőpiacon miként tartják meg a dolgozókat. Az IMG Építő létszáma három év alatt 30-ról 11 főre esett, sokan egyéni vállalkozóként folytatták, a cég szerint az ágazat nagy része ma a túlélésért küzd. A gépipari Büttner Kft. a legnagyobb gondnak a bértorlódást tartja: a minimálbér-emelések felhúzzák az alsó sávot, de egy exportra dolgozó kkv a távol-keleti árverseny miatt nem tudja arányosan emelni a tapasztalt szakemberek bérét. A balatoni, díjnyertes Florida Fagyizó szerint a szezonális toborzás borzasztóan nehéz – tíz jelentkezőből öt nem is reagál –, a legnagyobb változás pedig a munkához való viszonyban van: a pénz önmagában már nem motivál úgy, mint korábban."},{"cim":"Hirtelen lelassult a béremelkedés Magyarországon","url":"https://www.portfolio.hu/gazdasag/20260827/hirtelen-lelassult-a-beremelkedes-magyarorszagon-858568","forras":"Portfolio","datum":"2026-08-27","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A KSH friss adatai szerint júniusban a bruttó átlagkereset 7,1, a nettó 9,4, a reálkereset 7,6 százalékkal haladta meg az egy évvel korábbit, a bruttó átlag 754 700, a nettó 529 700 forint volt. A 7,1 százalékos bruttó növekedés érdemi lassulás: a fegyverpénz hatását kiszűrve utoljára 2020–21-ben volt ilyen alacsony a bérdinamika. Virovácz Péter (ING) szerint a januári minimálbér-emelés és a feszes munkaerőpiac 2026-ra 9–10 százalékos átlagbér-növekedést tart fenn, a 2027-es minimálbér viszont már csak alacsony egy számjegyű mértékben emelkedhet.","kulcsszavak":["bérek","gazdasági kilátások"],"het":"2026-08-24","url_forras":"docx","id":"ART-0501","kivonat":"A KSH friss adatai szerint júniusban a bruttó átlagkereset 7,1, a nettó 9,4, a reálkereset 7,6 százalékkal haladta meg az egy évvel korábbit – a bruttó átlag 754 700, a nettó 529 700 forint volt. A 7,1 százalékos bruttó növekedés érdemi lassulás: a Portfolio szerint a fegyverpénz hatását kiszűrve utoljára 2020–21-ben volt ilyen alacsony a bérdinamika. Virovácz Péter (ING) szerint az évi dinamikát a januári minimálbér-emelés és a feszes munkaerőpiac tartja fenn – 2026-ra 9–10 százalékos átlagbér-növekedésre számít, a 2027-es minimálbér viszont már csak alacsony egy számjegyű mértékben emelkedhet."},{"cim":"Felmérés készült a magyarok pénztárcáiról, nem néz ki jól, amit találtak","url":"https://index.hu/gazdasag/2026/08/25/penzugy-penzugyek-megtakaritas-hitel-hitelpiac-hitelfelvetel-provident-penzugyi-tudatossag-penzugyi-edukacio/","forras":"Index","datum":"2026-08-25","fokategoria":"piac","alkategoria":"Bérszínvonal / fizetések","osszefoglalo":"A Provident kilenc országra kiterjedő felmérése szerint a reálbérek emelkedése nem hozott széles körű biztonságot: a magyarok 28,1 százalékának a hónap végére semmi nem marad a kötelező kiadások után, ez a kilenc ország közül a leggyengébb eredmény, 23,8 százaléknak pedig semmilyen vésztartaléka nincs. Rendszeresen már 37 százalék takarít meg, ötéves csúcs, de ez elmarad a cseh és lengyel 48–53 százaléktól, és legalább hathavi tartalékkal a férfiak 45,8, a nők csak 25,8 százaléka rendelkezik. A kutatás szerint a javulás kettéosztja a társadalmat: egy stabilabb réteg újra tud tartalékot építeni, sokaknak viszont a hónap végi egyensúly a legnagyobb pénzügyi teljesítmény.","kulcsszavak":["bérek","kutatás és statisztika"],"het":"2026-08-24","url_forras":"docx","id":"ART-0502","kivonat":"A Provident kilenc országra kiterjedő felmérése szerint a reálbérek emelkedése nem hozott széles körű biztonságot: a magyarok 28,1 százalékának a hónap végére semmi nem marad a kötelező kiadások után – a kilenc ország közül a leggyengébb eredmény –, 23,8 százaléknak pedig semmilyen vésztartaléka nincs. Rendszeresen már 37 százalék takarít meg (ötéves csúcs), de ez elmarad a cseh és lengyel 48–53 százaléktól, és legalább hathavi tartalékkal a férfiak 45,8, a nők csak 25,8 százaléka rendelkezik. A kutatás fő tanulsága, hogy a javulás kettéosztja a társadalmat: egy stabilabb réteg újra tud tartalékot építeni, sokaknak viszont a hónap végi egyensúly a legnagyobb pénzügyi teljesítmény."},{"cim":"Vége a bonyhádi piros lábasok korszakának: bezár az utolsó m rint pedig a technológia megkönnyítette a mindennapjait, főként az adminisztráció, a dokumentáció és a műszaki ismeretek gyorsabb elérése terén.","kulcsszavak":["munkaerőhiány","AI","toborzás"],"het":"2026-08-17","id":"ART-0506","url_forras":"talalt","kivonat":"Az NFPA amerikai felmérése szerint a szakképzett munkaerő iránti kereslet három év alatt megduplázódott, jelentős részben az MI-infrastruktúra kiépítése miatt, amely elszívja a villanyszerelőket és gépészeket. A Randstad szerint ma nehezebb egy épületgépészt vagy villanyszerelőt felvenni, mint egy szoftverfejlesztőt – a háttérben a tapasztalt szakemberek nyugdíjba vonulása, a szűkülő utánpótlás és az akár 30 százalékosra becsült készségbeli szakadék áll. Az MI eszközt is ad a szakemberek kezébe: a válaszadók 88 százaléka szerint nőtt a munkája iránti kereslet, 87 százalék szerint pedig a technológia megkönnyítette a mindennapjait – főként az adminisztráció, a dokumentáció és a műszaki ismeretek gyorsabb elérése terén."},{"cim":"Ezért növekszik ugrásszerűen a felmondások száma a nyári szünet után","url":"https://hrpwr.hu/cikk/ezert-novekszik-ugrasszeruen-a-felmondasok-szama-a-nyari-szunet-utan","forras":"HRPOWER","datum":"2026-08-27","fokategoria":"versenytars","alkategoria":"WHC","osszefoglalo":"A WHC elemzése szerint az ősz beköszöntével a pihenés kontrasztja felerősíti a lappangó munkahelyi elégedetlenséget, így a szeptember-októberi időszakban az aktív álláskeresők száma az elmúlt három évben 25–30 százalékkal haladta meg a nyári szintet. A szakértők szerint a hirtelen felindulásból tett felmondás ritkán jó döntés: érdemes két-három hetet adni a visszaszokásra, majd ha a motiválatlanság egy hónap után is fennáll, azonosítani az okot – toxikus vezetés, fejlődés hiánya, alulfizetettség vagy csak egy átmeneti túlterhelt időszak. A váltás előtt a házon belüli lehetőségeket, feladatkör-átalakítást, új projektet, hibrid munkát is érdemes feltérképezni.","kulcsszavak":["megtartás","mentális egészség","munkakörülmények"],"het":"2026-08-24","id":"ART-0507","kivonat":"A WHC elemzése szerint az ősz beköszöntével a pihenés kontrasztja felerősíti a lappangó munkahelyi elégedetlenséget, így a szeptember-októberi időszakban az aktív álláskeresők száma az elmúlt három évben 25–30 százalékkal haladta meg a nyári szintet – miközben a cégek is ekkor indítják toborzási kampányaikat. A szakértők szerint a hirtelen felindulásból tett felmondás ritkán jó döntés: érdemes két-három hetet adni a visszaszokásra, és ha a motiválatlanság egy hónap után is fennáll, őszintén azonosítani az okot – toxikus vezetés, fejlődés hiánya, alulfizetettség vagy csak egy átmeneti túlterhelt időszak. A váltás előtt a házon belüli lehetőségeket (feladatkör-átalakítás, új projekt, hibrid munka) is érdemes feltérképezni.","url_forras":"docx"},{"cim":"A rugalmasság lett az egyik legfontosabb szempont a diákmunkában","url":"https://profitline.hu/a-rugalmassag-lett-az-egyik-legfontosabb-szempont-a-diakmunkaban-490059","forras":"Profitline","datum":"2026-08-27","fokategoria":"versenytars","alkategoria":"Work Force","osszefoglalo":"A Job Force tapasztalatai szerint az idei nyári diákmunkaszezont erős kereslet és emelkedő bérek jellemezték, az átlagos órabér bruttó 2200–2400 forint volt, a legmagasabbak a 4000 forintot is meghaladták, elsősorban a szellemi, gyakornoki és futárpozíciókban. Magony András, a Work Force operatív vezetője szerint a fiataloknak legalább a bérrel egyenlő fontosságú lett a rugalmas beosztás, a munkakörnyezet és a fejlődési lehetőség kevésbé számít. A munkáltatók oldalán a megbízhatóság a fő elvárás, a legnehezebben betölthető pozíciók a futár, az úszómester és a mezőgazdasági munkák, ősszel pedig a kereskedelem, a vendéglátás, a gyakornoki helyek mellett a logisztika, a gyártás és a termelés is kínál iskola mellett végezhető munkát.","kulcsszavak":["diákmunka","rugalmas foglalkoztatás","Work Force"],"het":"2026-08-24","url_forras":"docx","id":"ART-0508","kivonat":"A Job Force tapasztalatai szerint az idei nyári diákmunkaszezont erős kereslet és emelkedő bérek jellemezték – az átlagos órabér bruttó 2200–2400 forint, a legmagasabbak a 4000 forintot is meghaladták, elsősorban a szellemi, gyakornoki és futárpozíciókban. A bér azonban nem minden: Magony András, a Work Force operatív vezetője szerint a fiataloknak legalább ilyen fontos lett a rugalmas beosztás – a munkakörnyezet és a fejlődési lehetőség kevésbé. A munkáltatók oldalán a megbízhatóság a fő elvárás, a legnehezebben betölthető pozíciók a futár, az úszómester és a mezőgazdasági munkák. Ősszel a kereskedelem, a vendéglátás és a gyakornoki helyek mellett a logisztika, a gyártás és a termelés is kínál iskola mellett végezhető munkát."},{"cim":"Dartsversenyen döntjük el, kié az ügyfél","url":"https://e.pcloud.link/publink/show?code=XZWNQ77ZL14QLummyUQuKrxVswL4qk9G5f6k","forras":"Forbes","datum":"2026-09-02","fokategoria":"prohuman","alkategoria":"Egyéb","osszefoglalo":"A cikk a Quantum Diákmunka Iskolaszövetkezet történetén mutatja be a diákmunkapiac működését: a cég a gyorsabb, kényelmesebb és olcsóbb megoldásokkal az első tíz piaci szereplő közé került, növekedését pedig a Cápák között-szereplés is segítette. A diákmunka a fiatalok számára egyre gyakrabban hosszú távú karrierlehetőségként jelenik meg, a vállalatok pedig utánpótlásként is tekintenek rájuk. A cikk bemutatja az iskolaszövetkezeti piac átalakulását is, megemlítve a Meló-Diák, a Fürge Diák, a Prohumán és a Prodiák Iskolaszövetkezet szerepét.","kulcsszavak":["diákmunka","pályakezdők","toborzás"],"het":"2026-08-31","url_forras":"docx","id":"ART-0509","kivonat":"A Quantum Diákmunka Iskolaszövetkezet négy fiatal alapítójának történetén keresztül mutatja be a cikk a diákmunkapiac működését, valamint azt, hogyan vált a cég az első tíz piaci szereplő egyikévé. A vállalat kezdetben a gyorsabb, kényelmesebb és olcsóbb megoldásokkal igyekezett kitűnni, később pedig a Cápák között-szereplés is hozzájárult a növekedéséhez. A diákmunka egyre inkább ho
